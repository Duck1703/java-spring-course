hác bằng từ khóa extends và có thể bổ sung field/method mới bên cạnh những gì thừa hưởng từ lớp cha. Java chỉ hỗ trợ đơn kế thừa với lớp (mỗi lớp chỉ extends được đúng một lớp cha), khác với một số ngôn ngữ cho phép đa kế thừa lớp.","citations":["day05-src-1"]},{"id":"day05-blk-2","type":"paragraph","text":"Lớp con kế thừa các thành viên non-static protected và public của lớp cha; thành viên private và static không được kế thừa (static member vẫn truy cập được qua tên lớp cha, nhưng không phải theo cơ chế kế thừa instance).","citations":["day05-src-2"]},{"id":"day05-blk-3","type":"important","text":"Một lớp chỉ kế thừa được một lớp cha (extends) nhưng có thể implement nhiều interface cùng lúc. Nếu hai interface có default method trùng chữ ký, lớp implement bắt buộc phải tự override lại phương thức đó để giải quyết xung đột — trình biên dịch không tự chọn thay.","citations":["day05-src-3"]},{"id":"day05-blk-4","type":"code","language":"java","code":"class Animal {\n    protected String name;\n\n    public Animal(String name) {\n        this.name = name;\n    }\n\n    public String makeSound() {\n        return name + \" makes a generic sound\";\n    }\n}\n\nclass Dog extends Animal {\n    public Dog(String name) {\n        super(name); // goi constructor cua Animal\n    }\n\n    @Override\n    public String makeSound() {\n        return name + \" barks\"; // truy cap field ke thua tu Animal\n    }\n}\n","compile":true,"citations":["day05-src-1","day05-src-2"]}]},{"id":"day05-sec-this-super","title":"this và super khi trùng tên thành viên","blocks":[{"id":"day05-blk-5","type":"paragraph","text":"Khi lớp con và lớp cha khai báo biến hoặc phương thức cùng tên (hidden instance member), dùng super.tenThanhVien để truy cập tường minh thành viên của lớp cha, và this.tenThanhVien để truy cập thành viên của lớp con hiện tại — tránh nhầm lẫn giá trị nào đang được dùng.","citations":["day05-src-4"]},{"id":"day05-blk-6","type":"code","language":"java","code":"class Base {\n    protected int level = 1;\n}\n\nclass Advanced extends Base {\n    protected int level = 2; // che field 'level' cua Base\n\n    public void printLevels() {\n        System.out.println(\"this.level = \" + this.level);   // 2\n        System.out.println(\"super.level = \" + super.level); // 1\n    }\n}\n","compile":true,"citations":["day05-src-4"]}]},{"id":"day05-sec-polymorphism","title":"Method Overriding, Overloading và Polymorphism","blocks":[{"id":"day05-blk-7","type":"paragraph","text":"Polymorphism (đa hình) trong Java chia làm hai loại: polymorphism tĩnh (static, còn gọi là compile-time) được giải quyết ngay lúc biên dịch — ví dụ method overloading (nhiều method cùng tên khác danh sách tham số); và polymorphism động (dynamic, runtime) được JVM giải quyết khi gọi một phương thức đã được override trên subclass, tùy vào kiểu thực sự của đối tượng lúc chạy.","citations":["day05-src-5"]},{"id":"day05-blk-8","type":"paragraph","text":"Ví dụ điển hình của polymorphism động: nếu một subclass override lại một phương thức của lớp cha rồi được gán cho một biến khai báo kiểu lớp cha, JVM vẫn gọi đúng phiên bản đã override của subclass lúc runtime, nhờ JVM giữ tham chiếu tới kiểu thực sự của đối tượng chứ không dựa vào kiểu khai báo của biến.","citations":["day05-src-6"]},{"id":"day05-blk-9","type":"code","language":"java","code":"class Shape {\n    public double area() {\n        return 0;\n    }\n\n    // method overloading: cung ten describe, khac danh sach tham so\n    public String describe() {\n        return \"Shape with area \" + area();\n    }\n\n    public String describe(String prefix) {\n        return prefix + \": \" + describe();\n    }\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    public Circle(double radius) {\n        this.radius = radius;\n    }\n\n    @Override // method overriding: cung chu ky voi Shape.area()\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass PolymorphismDemo {\n    public static void main(String[] args) {\n        Shape shape = new Circle(2.0); // bien khai bao kieu Shape\n        System.out.println(shape.describe()); // goi Circle.area() luc runtime\n    }\n}\n","compile":true,"citations":["day05-src-5","day05-src-6"]}]},{"id":"day05-sec-downcast","title":"Upcast, downcast và ClassCastException","blocks":[{"id":"day05-blk-10","type":"warning","text":"Ép kiểu từ lớp cha xuống lớp con (downcast) khi đối tượng thực sự không phải kiểu đó sẽ ném ClassCastException lúc runtime — nên luôn dùng instanceof (hoặc pattern matching instanceof đã học ở Day 2) để kiểm tra trước khi ép kiểu, thay vì ép kiểu 'liều'.","citations":["day05-src-7"]},{"id":"day05-blk-11","type":"code","language":"java","code":"class Shape {\n    public double area() {\n        return 0;\n    }\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    public Circle(double radius) {\n        this.radius = radius;\n    }\n\n    @Override\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass DowncastDemo {\n    public static void main(String[] args) {\n        Shape shape = new Circle(1.5);\n\n        if (shape instanceof Circle circle) { // downcast an toan\n            System.out.println(\"radius-based area: \" + circle.area());\n        } else {\n            System.out.println(\"Khong phai Circle, bo qua downcast\");\n        }\n    }\n}\n","compile":true,"citations":["day05-src-7"]}]},{"id":"day05-sec-abstract","title":"Abstract class","blocks":[{"id":"day05-blk-12","type":"paragraph","text":"Một lớp được khai báo abstract bằng từ khóa abstract; lớp abstract không thể khởi tạo trực tiếp bằng new nhưng có thể được kế thừa để các lớp con cụ thể hóa.","citations":["day05-src-8"]},{"id":"day05-blk-13","type":"important","text":"Nếu một lớp khai báo ít nhất một abstract method (method không có thân, chỉ có chữ ký), bản thân lớp đó cũng bắt buộc phải là abstract. Lớp con phải cài đặt (override) toàn bộ abstract method kế thừa được, hoặc chính lớp con đó cũng phải khai báo abstract.","citations":["day05-src-9"]},{"id":"day05-blk-14","type":"paragraph","text":"Nên dùng abstract class khi muốn dùng chung code (field, method đã cài đặt sẵn) giữa các lớp con có quan hệ họ hàng gần, đồng thời định nghĩa một phần API bắt buộc lớp con phải tự cài đặt — tận dụng cả kế thừa lẫn đa hình trong cùng một thiết kế.","citations":["day05-src-10"]},{"id":"day05-blk-15","type":"code","language":"java","code":"abstract class Vehicle {\n    protected final String plateNumber;\n\n    protected Vehicle(String plateNumber) {\n        this.plateNumber = plateNumber;\n    }\n\n    public abstract double calculateTollFee(); // bat buoc lop con cai dat\n\n    public String getPlateNumber() { // code dung chung, khong can override\n        return plateNumber;\n    }\n}\n\nclass Motorbike extends Vehicle {\n    public Motorbike(String plateNumber) {\n        super(plateNumber);\n    }\n\n    @Override\n    public double calculateTollFee() {\n        return 5000.0;\n    }\n}\n","compile":true,"citations":["day05-src-8","day05-src-9"]}]}],"commonMistakes":["Ép kiểu downcast trực tiếp mà không kiểm tra instanceof trước, gây ClassCastException khi đối tượng thực sự không phải kiểu đích.","Nhầm lẫn method overloading với method overriding — ví dụ tưởng đổi kiểu trả về hoặc chỉ đổi tên tham số (không đổi kiểu/số lượng) là overloading hợp lệ.","Quên rằng field bị 'che' (hidden) theo kiểu khai báo của biến (không có polymorphism động cho field như với method), dẫn tới đọc nhầm giá trị khi dùng biến kiểu lớp cha để truy cập field."],"practices":[{"id":"day05-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Nếu một class khai báo ít nhất một abstract method, điều gì bắt buộc phải đúng?","choices":[{"id":"day05-prac-1-a","text":"Class đó cũng phải được khai báo abstract"},{"id":"day05-prac-1-b","text":"Class đó có thể khởi tạo trực tiếp bằng new nếu cần"},{"id":"day05-prac-1-c","text":"Chỉ lớp con mới cần abstract, lớp khai báo method thì không"},{"id":"day05-prac-1-d","text":"Method đó phải có thân (body) rỗng {}"}],"correctChoiceIds":["day05-prac-1-a"],"hint":"Nhớ ràng buộc song song giữa abstract method và abstract class.","solution":"Class đó cũng phải được khai báo abstract.","explanation":"Java bắt buộc: nếu một class có ít nhất một abstract method (method chỉ có chữ ký, không thân), bản thân class đó phải abstract, vì việc khởi tạo một đối tượng thiếu cài đặt cho một method là không hợp lệ. Vì vậy class đó không thể khởi tạo trực tiếp (đáp án B sai), quy tắc áp dụng cho chính class khai báo method chứ không chỉ lớp con (đáp án C sai), và abstract method không có thân {} chứ không phải thân rỗng (đáp án D sai — abstract method kết thúc bằng dấu chấm phẩy, không có cặp ngoặc nhọn nào).","rubric":"Chọn đúng đáp án A và giải thích được vì sao ba lựa chọn còn lại sai.","sourceUsage":["day05-src-9"]},{"id":"day05-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Cho hai class:\nclass Base { int level = 1; }\nclass Advanced extends Base { int level = 2;\n    void print() {\n        System.out.println(this.level + \",\" + super.level);\n    }\n}\nGọi new Advanced().print() in ra gì?","choices":[{"id":"day05-prac-2-a","text":"1,1"},{"id":"day05-prac-2-b","text":"2,2"},{"id":"day05-prac-2-c","text":"2,1"},{"id":"day05-prac-2-d","text":"1,2"}],"correctChoiceIds":["day05-prac-2-c"],"hint":"this luôn trỏ tới thành viên của chính lớp con hiện tại, super luôn trỏ tới thành viên của lớp cha bị che.","solution":"2,1 — this.level lấy field level = 2 của Advanced, super.level lấy field level = 1 của Base.","explanation":"Advanced khai báo field level riêng (che field level của Base, đây là field hiding chứ không phải override vì field không có tính đa hình runtime như method). this.level luôn truy cập field của chính đối tượng hiện tại (Advanced) nên là 2. super.level tường minh yêu cầu lấy field level của lớp cha Base, cho ra 1. Kết quả in ra là 2,1.","rubric":"Chọn đúng 2,1 và giải thích được this/super trỏ tới field của đúng lớp nào.","sourceUsage":["day05-src-4"]},{"id":"day05-prac-3","type":"concept","interaction":"self-check","prompt":"Giải thích ngắn gọn sự khác nhau giữa method overloading và method overriding, mỗi loại được giải quyết ở giai đoạn nào (compile-time hay runtime)?","choices":[],"correctChoiceIds":[],"hint":"Overloading liên quan tới nhiều method cùng tên khác tham số; overriding liên quan tới lớp con định nghĩa lại method của lớp cha.","solution":"Overloading: nhiều method cùng tên nhưng khác danh sách tham số trong cùng một class, được giải quyết lúc biên dịch (compile-time/polymorphism tĩnh) dựa trên kiểu tham số truyền vào. Overriding: lớp con định nghĩa lại đúng chữ ký một method đã có ở lớp cha, được giải quyết lúc chạy (runtime/polymorphism động) dựa trên kiểu thực sự của đối tượng.","explanation":"Câu trả lời tốt cần nêu đúng: overloading = compile-time, khác tham số, cùng class; overriding = runtime, cùng chữ ký, quan hệ lớp cha-con.","rubric":"Đạt yêu cầu nếu phân biệt đúng cả giai đoạn giải quyết (compile-time vs runtime) lẫn điều kiện áp dụng (khác tham số vs cùng chữ ký).","sourceUsage":["day05-src-5","day05-src-6"]},{"id":"day05-prac-4","type":"coding","interaction":"self-check","prompt":"Thiết kế một abstract class Employee với abstract method calculateBonus(), và một class con cụ thể override phương thức đó. Viết đoạn code minh họa việc gọi calculateBonus() qua một biến khai báo kiểu Employee (upcast) để thể hiện đúng polymorphism động.","choices":[],"correctChoiceIds":[],"hint":"Xem lại ví dụ Vehicle/Motorbike ở phần Abstract class — abstract method bắt buộc lớp con cài đặt, biến khai báo kiểu lớp cha nhưng gọi đúng phiên bản lớp con lúc runtime.","solution":"public abstract class Employee {\n    public abstract double calculateBonus();\n}\n\npublic class SalesEmployee extends Employee {\n    @Override\n    public double calculateBonus() {\n        return 1000.0;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Employee e = new SalesEmployee(); // upcast\n        System.out.println(e.calculateBonus()); // goi dung SalesEmployee luc runtime\n    }\n}","explanation":"Lời giải mẫu định nghĩa đúng abstract method không thân trong Employee, class con override đầy đủ, và minh họa upcast (biến kiểu Employee nhưng gọi đúng phiên bản đã override lúc runtime).","rubric":"Đạt yêu cầu nếu abstract class có abstract method hợp lệ, class con override đúng, và đoạn main thể hiện đúng polymorphism động qua biến khai báo kiểu lớp cha.","sourceUsage":["day05-src-8","day05-src-9","day05-src-6"]}],"syllabusAssignments":[],"enhancedExercises":["Thêm một lớp con thứ hai cho Vehicle (ví dụ Car) với công thức tính toll fee khác, rồi viết một List\u003cVehicle\u003e chứa cả Motorbike và Car để quan sát polymorphism động khi lặp qua danh sách.","Thử bỏ từ khóa abstract khỏi calculateTollFee() trong Vehicle và quan sát lỗi biên dịch xảy ra, để hiểu rõ hơn ràng buộc giữa abstract class và abstract method."],"references":[{"id":"day05-ref-1","type":"external","resourceId":"res-aad15fef0599","citationId":"day05-src-1","url":"https://www.baeldung.com/java-inheritance","label":"Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Inheritance in Java | Baeldung","limitation":null},{"id":"day05-ref-2","type":"external","resourceId":"res-36a8d5deef22","citationId":"day05-src-5","url":"https://www.baeldung.com/java-polymorphism","label":"Polymorphism","checkStatus":"ok","readStatus":"read","pageTitle":"Polymorphism in Java | Baeldung","limitation":null},{"id":"day05-ref-3","type":"external","resourceId":"res-b5dd43254a15","citationId":"day05-src-8","url":"https://www.baeldung.com/java-abstract-class","label":"Abstract Class","checkStatus":"ok","readStatus":"read","pageTitle":"Abstract Classes in Java | Baeldung","limitation":null},{"id":"day05-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-06","unitId":"unit-02","group":"java","kind":"project","title":"- Assignment 2: Employee Management System","summary":"Assignment 2: xây dựng hệ thống quản lý lương nhân viên (Employee/Developer/Manager/PayrollService/EmployeeDTO) áp dụng abstract class, kế thừa, polymorphism và record — tổng hợp toàn bộ kiến thức Day 4-5.","durationMinutes":150.0,"objectives":["LO2"],"prerequisites":["Đã hoàn thành Day 4 (class, constructor, encapsulation) và Day 5 (kế thừa, polymorphism, abstract class)."],"outcomes":["Thiết kế đúng một abstract base class với abstract method và các subclass override đầy đủ.","Dùng polymorphism động để xử lý một danh sách đối tượng đa hình mà không cần if-else theo loại cụ thể.","Khai báo và sử dụng đúng record cho một DTO bất biến.","Viết unit test xác nhận đúng hành vi của từng subclass và của tầng service dùng polymorphism."],"sections":[{"id":"day06-sec-brief","title":"Đề bài: Employee Management System","blocks":[{"id":"day06-blk-1","type":"deliverable","text":"- Assignment 2: Employee Management System\n  - Base `Employee` abstract (id, name, baseSalary) + method `calculateSalary()` abstract\n  - Subclass: `Developer` (overtimeHours, bonusRate), `Manager` (teamSize, kpiMultiplier)\n  - `PayrollService` calculates total salary using polymorphism\n  - Uses a Record for `EmployeeDTO`\n  - Unit tests verify the correctness of each salary type","citations":[]},{"id":"day06-blk-2","type":"note","text":"Assignment này tổng hợp trực tiếp các khái niệm đã học ở Day 4 (class, constructor, encapsulation) và Day 5 (kế thừa, polymorphism, abstract class). Đọc lại hai bài đó trước khi bắt đầu nếu chưa nắm chắc extends/abstract/override.","citations":[]}]},{"id":"day06-sec-decomposition","title":"Phân rã thiết kế (guided decomposition)","blocks":[{"id":"day06-blk-3","type":"paragraph","text":"Hệ thống gồm 5 kiểu: Employee (abstract), Developer và Manager (kế thừa Employee), PayrollService (dùng polymorphism để tính lương hàng loạt), và EmployeeDTO (record dùng để trả dữ liệu ra ngoài tầng service). Việc tách abstract base class + hai subclass cụ thể phản ánh đúng cấu trúc class/object đã học: field chung nằm ở lớp cha, hành vi khác biệt nằm ở lớp con.","citations":["day06-src-1"]},{"id":"day06-blk-4","type":"important","text":"Employee phải là abstract class với abstract method calculateSalary() không có thân — vì lớp khai báo ít nhất một abstract method thì bản thân lớp đó bắt buộc phải abstract. Developer và Manager bắt buộc phải override đầy đủ calculateSalary(), nếu không bản thân chúng cũng phải là abstract.","citations":["day06-src-7","day06-src-8"]},{"id":"day06-blk-5","type":"paragraph","text":"Developer và Manager kế thừa Employee bằng extends (Java chỉ hỗ trợ đơn kế thừa lớp), thừa hưởng các field protected của Employee (id, name, baseSalary) và chỉ cần khai báo thêm field riêng (overtimeHours/bonusRate cho Developer, teamSize/kpiMultiplier cho Manager). Constructor của lớp con gọi super(id, name, baseSalary) để khởi tạo phần dữ liệu chung ở lớp cha.","citations":["day06-src-2","day06-src-3","day06-src-4"]},{"id":"day06-blk-6","type":"paragraph","text":"PayrollService không cần biết cụ thể từng nhân viên là Developer hay Manager: chỉ cần lặp qua một List\u003cEmployee\u003e và gọi employee.calculateSalary(), JVM sẽ tự gọi đúng phiên bản đã override của từng đối tượng lúc runtime — đây chính là polymorphism động, lý do abstract class + override được chọn thay vì if-else kiểm tra loại nhân viên.","citations":["day06-src-5","day06-src-6"]},{"id":"day06-blk-7","type":"note","text":"EmployeeDTO nên khai báo dưới dạng record (cú pháp Java 17: record EmployeeDTO(String id, String name, double totalSalary) {}) — record tự sinh constructor, getter dạng id()/name()/totalSalary(), equals()/hashCode()/toString(), phù hợp cho một đối tượng bất biến chỉ mang dữ liệu ra khỏi PayrollService, không cần logic nghiệp vụ riêng.","citations":[]}]},{"id":"day06-sec-implementation","title":"Cài đặt tham khảo","blocks":[{"id":"day06-blk-8","type":"code","language":"java","code":"import java.util.List;\n\nabstract class Employee {\n    protected final String id;\n    protected final String name;\n    protected final double baseSalary;\n\n    protected Employee(String id, String name, double baseSalary) {\n        this.id = id;\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    public abstract double calculateSalary();\n\n    public String getId() {\n        return id;\n    }\n\n    public String getName() {\n        return name;\n    }\n}\n\nclass Developer extends Employee {\n    private final double overtimeHours;\n    private final double bonusRate;\n\n    public Developer(String id, String name, double baseSalary,\n                      double overtimeHours, double bonusRate) {\n        super(id, name, baseSalary);\n        this.overtimeHours = overtimeHours;\n        this.bonusRate = bonusRate;\n    }\n\n    @Override\n    public double calculateSalary() {\n        return baseSalary + (overtimeHours * bonusRate);\n    }\n}\n\nclass Manager extends Employee {\n    private final int teamSize;\n    private final double kpiMultiplier;\n\n    public Manager(String id, String name, double baseSalary,\n                    int teamSize, double kpiMultiplier) {\n        super(id, name, baseSalary);\n        this.teamSize = teamSize;\n        this.kpiMultiplier = kpiMultiplier;\n    }\n\n    @Override\n    public double calculateSalary() {\n        return (baseSalary + teamSize * 200.0) * kpiMultiplier;\n    }\n}\n\nrecord EmployeeDTO(String id, String name, double totalSalary) {\n}\n\nclass PayrollService {\n    public List\u003cEmployeeDTO\u003e runPayroll(List\u003cEmployee\u003e employees) {\n        return employees.stream()\n                .map(e -\u003e new EmployeeDTO(e.getId(), e.getName(), e.calculateSalary()))\n                .toList();\n    }\n}\n","compile":true,"citations":["day06-src-7","day06-src-8","day06-src-6"]}]},{"id":"day06-sec-tests","title":"Test case gợi ý và rubric","blocks":[{"id":"day06-blk-9","type":"table","columns":["Test case","Loại nhân viên","Input","calculateSalary() mong đợi"],"rows":[["TC1","Developer","baseSalary=10,000,000; overtimeHours=10; bonusRate=50,000","10,500,000"],["TC2","Manager","baseSalary=20,000,000; teamSize=5; kpiMultiplier=1.1","22,000,000"],["TC3","PayrollService.runPayroll","List gồm 1 Developer + 1 Manager (TC1+TC2)","List\u003cEmployeeDTO\u003e có 2 phần tử, đúng totalSalary từng người"]],"citations":["day06-src-5","day06-src-6"]},{"id":"day06-blk-10","type":"warning","text":"Viết unit test cho từng subclass riêng (DeveloperTest, ManagerTest) để cô lập công thức tính lương, và ít nhất một test cho PayrollService xác nhận polymorphism hoạt động đúng khi danh sách trộn lẫn nhiều loại Employee — không chỉ test với một loại duy nhất, vì lỗi override sai chữ ký sẽ không lộ ra nếu danh sách chỉ có một kiểu.","citations":["day06-src-6"]}]}],"commonMistakes":["Dùng if (employee instanceof Developer) ... else if (employee instanceof Manager) ... trong PayrollService thay vì để calculateSalary() tự đa hình — làm mất hết lợi ích của polymorphism và phải sửa PayrollService mỗi khi thêm loại nhân viên mới.","Quên khai báo Employee là abstract hoặc quên override đầy đủ calculateSalary() ở subclass, dẫn tới lỗi biên dịch.","Chỉ viết test cho từng subclass riêng lẻ mà không có test nào xác nhận PayrollService xử lý đúng danh sách trộn nhiều loại nhân viên."],"practices":[{"id":"day06-prac-1","type":"applied","interaction":"self-check","prompt":"Cài đặt đầy đủ Employee (abstract), Developer, Manager, PayrollService và EmployeeDTO (record) theo đúng đề bài, kèm ít nhất 3 unit test xác nhận calculateSalary() đúng cho từng loại nhân viên.","choices":[],"correctChoiceIds":[],"hint":"Bắt đầu từ Employee abstract với đúng 3 field yêu cầu (id, name, baseSalary) và abstract method calculateSalary(); dùng cài đặt tham khảo trong bài làm khung sườn, sau đó tự viết test.","solution":"Xem mục 'Cài đặt tham khảo' ở trên; công thức lương trong lời giải mẫu chỉ là ví dụ minh họa, có thể điều chỉnh miễn giữ đúng cấu trúc class/kế thừa/abstract method theo đề bài.","explanation":"Không có lời giải cố định — đánh giá theo mức độ đúng cấu trúc OOP.","rubric":"Đạt yêu cầu khi: Employee là abstract với abstract method đúng chữ ký; Developer/Manager override đầy đủ và kế thừa đúng field chung; EmployeeDTO là record; PayrollService dùng polymorphism (không if-else theo loại lớp); có test cho từng subclass và cho PayrollService.","sourceUsage":[]},{"id":"day06-prac-2","type":"concept","interaction":"multiple-choice","prompt":"Vì sao Employee bắt buộc phải là abstract class trong thiết kế này?","choices":[{"id":"day06-prac-2-a","text":"Vì nó khai báo ít nhất một abstract method (calculateSalary()) không có thân"},{"id":"day06-prac-2-b","text":"Vì abstract class chạy nhanh hơn class thường"},{"id":"day06-prac-2-c","text":"Vì Java bắt buộc mọi lớp cha phải là abstract"},{"id":"day06-prac-2-d","text":"Vì Employee không có field nào"}],"correctChoiceIds":["day06-prac-2-a"],"hint":"Nhớ lại ràng buộc song song giữa abstract method và abstract class đã học ở Day 5.","solution":"Vì nó khai báo ít nhất một abstract method (calculateSalary()) không có thân.","explanation":"Employee khai báo calculateSalary() chỉ với chữ ký, không có thân phương thức — theo quy tắc Java, một lớp có ít nhất một abstract method thì bản thân lớp đó bắt buộc phải khai báo abstract, nếu không trình biên dịch sẽ báo lỗi. Đây không liên quan tới hiệu năng (đáp án B sai), không phải mọi lớp cha đều phải abstract (đáp án C sai, chỉ khi có abstract method), và Employee vẫn có 3 field id/name/baseSalary (đáp án D sai).","rubric":"Chọn đúng đáp án A và giải thích được vì sao B, C, D sai.","sourceUsage":["day06-src-7","day06-src-8"]},{"id":"day06-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một unit test (JUnit-style, không cần chạy được, chỉ cần đúng cấu trúc) xác nhận PayrollService.runPayroll() trả về đúng totalSalary cho một danh sách trộn lẫn 1 Developer và 1 Manager.","choices":[],"correctChoiceIds":[],"hint":"Tạo danh sách List\u003cEmployee\u003e gồm cả hai loại, gọi runPayroll(), rồi so sánh từng EmployeeDTO.totalSalary() với giá trị tính tay.","solution":"@Test\nvoid runPayroll_mixedEmployees_returnsCorrectTotals() {\n    Employee dev = new Developer(\"E1\", \"An\", 10_000_000, 10, 50_000);\n    Employee mgr = new Manager(\"E2\", \"Binh\", 20_000_000, 5, 1.1);\n    PayrollService service = new PayrollService();\n\n    List\u003cEmployeeDTO\u003e result = service.runPayroll(List.of(dev, mgr));\n\n    assertEquals(2, result.size());\n    assertEquals(10_500_000.0, result.get(0).totalSalary());\n    assertEquals(22_000_000.0, result.get(1).totalSalary());\n}","explanation":"Lời giải mẫu tạo danh sách trộn hai loại Employee, gọi runPayroll() một lần, và assert đúng totalSalary cho từng phần tử — thể hiện đúng việc test polymorphism thay vì test từng subclass riêng lẻ.","rubric":"Đạt yêu cầu nếu test tạo được danh sách trộn ≥2 loại Employee, gọi đúng API PayrollService, và assert giá trị totalSalary khớp công thức đã cài đặt.","sourceUsage":["day06-src-6"]}],"syllabusAssignments":[{"row":12,"text":"- Assignment 2: Employee Management System\n  - Base `Employee` abstract (id, name, baseSalary) + method `calculateSalary()` abstract\n  - Subclass: `Developer` (overtimeHours, bonusRate), `Manager` (teamSize, kpiMultiplier)\n  - `PayrollService` calculates total salary using polymorphism\n  - Uses a Record for `EmployeeDTO`\n  - Unit tests verify the correctness of each salary type"}],"enhancedExercises":["Thêm một loại nhân viên thứ ba (ví dụ Intern với stipend cố định) chỉ bằng cách thêm một subclass mới của Employee, không sửa PayrollService — minh chứng lợi ích thực sự của polymorphism.","Thêm phương thức toString() có ý nghĩa cho EmployeeDTO (record đã tự sinh toString() mặc định, thử so sánh với việc override lại)."],"references":[{"id":"day06-ref-1","type":"external","resourceId":"res-ae202f300a2b","citationId":"day06-src-1","url":"https://docs.oracle.com/javase/tutorial/java/javaOO/index.html","label":"OOP Concepts","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Classes and Objects (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day06-ref-2","type":"external","resourceId":"res-aad15fef0599","citationId":"day06-src-2","url":"https://www.baeldung.com/java-inheritance","label":"Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Inheritance in Java | Baeldung","limitation":null},{"id":"day06-ref-3","type":"external","resourceId":"res-36a8d5deef22","citationId":"day06-src-5","url":"https://www.baeldung.com/java-polymorphism","label":"Polymorphism","checkStatus":"ok","readStatus":"read","pageTitle":"Polymorphism in Java | Baeldung","limitation":null},{"id":"day06-ref-4","type":"external","resourceId":"res-b5dd43254a15","citationId":"day06-src-7","url":"https://www.baeldung.com/java-abstract-class","label":"Abstract Class","checkStatus":"ok","readStatus":"read","pageTitle":"Abstract Classes in Java | Baeldung","limitation":null},{"id":"day06-ref-5","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-07","unitId":"unit-03","group":"java","kind":"theory","title":"Interface, Inner Classes \u0026 Enums","summary":"Interface la 'hop dong' API cho phep da-implement (khac abstract class chi don-extends); Inner Classes, Enums va SOLID Principles duoc gioi thieu o muc chuan Java 17 de hoan thien nen tang OOP truoc khi hoc generics/collections/exception o Day 8-9.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Da hoan thanh Day 5 (extends, this/super, polymorphism, abstract class) va Day 6 (Employee Management System)."],"outcomes":["Phan biet dung khi nao dung interface, khi nao dung abstract class.","Su dung dung static nested class, inner class va anonymous class.","Khai bao va su dung enum voi constructor/field/method rieng.","Nhan dien duoc 5 nguyen tac SOLID trong mot thiet ke lop cu the."],"sections":[{"id":"day07-sec-interface","title":"Interface","blocks":[{"id":"day07-blk-1","type":"paragraph","text":"Interface la mot kieu tham chieu trong Java, dong vai tro nhu mot 'hop dong' (contract) ve API: interface khai bao cac phuong thuc ma lop implement no bat buoc phai cung cap phan cai dat cu the. Bai hoc Interfaces and Inheritance cua Oracle trinh bay interface o dung vi tri nay trong chuong trinh hoc, tiep noi ngay sau phan ke thua (extends) da hoc o Day 5.","citations":["day07-src-1"]},{"id":"day07-blk-2","type":"code","language":"java","code":"interface Payable {\n    double calculateAmount();\n\n    default String describe() {\n        return \"Amount due: \" + calculateAmount();\n    }\n}\n\nclass Invoice implements Payable {\n    private final double baseAmount;\n    private final double taxRate;\n\n    Invoice(double baseAmount, double taxRate) {\n        this.baseAmount = baseAmount;\n        this.taxRate = taxRate;\n    }\n\n    @Override\n    public double calculateAmount() {\n        return baseAmount * (1 + taxRate);\n    }\n}\n","compile":true,"citations":["day07-src-1"]}]},{"id":"day07-sec-abstract-vs-interface","title":"Abstract class vs Interface","blocks":[{"id":"day07-blk-3","type":"paragraph","text":"Interface va abstract class (da hoc o Day 5) giong nhau o mot diem cot loi: ca hai deu co the khai bao phuong thuc chua co phan cai dat, buoc lop con/lop implement phai tu hoan thien. Diem khac biet lon nhat nam o quan he ke thua: mot lop chi duoc extends dung mot abstract class (don ke thua), nhung co the implements nhieu interface cung luc - day chinh la co che Java dung de mo phong da ke thua hanh vi.","citations":["day07-src-1"]},{"id":"day07-blk-4","type":"table","columns":["Tieu chi","Abstract class","Interface"],"rows":[["Ke thua/implement","extends - chi mot abstract class (don ke thua)","implements - nhieu interface cung luc"],["Method chua cai dat","Co the co (abstract method)","Co (method truu tuong mac dinh, tru default/static method)"],["Field/constructor","Co the co field non-static, non-final va constructor rieng","Truoc Java 8 chi co hang so static final, khong co constructor"]],"citations":["day07-src-1"]}]},{"id":"day07-sec-inner-classes","title":"Inner Classes","blocks":[{"id":"day07-blk-5","type":"note","text":"Chu de nay khong co nguon trich dan chuyen sau trong bo tai lieu cua khoa hoc (xem authoring.limitations); noi dung duoi day trinh bay theo kien thuc Java 17 chuan, pham vi vua du de hoc vien nhan dien va su dung dung cac loai lop long nhau.","citations":[]},{"id":"day07-blk-6","type":"paragraph","text":"Java co bon loai lop long nhau (nested class): static nested class (khai bao voi tu khoa static ben trong lop ngoai, khong giu tham chieu toi instance cua lop ngoai), inner class (khong static, moi instance gan voi mot instance cu the cua lop ngoai va co the truy cap truc tiep field/method cua lop ngoai), local class (khai bao ben trong than mot phuong thuc, chi dung duoc trong pham vi phuong thuc do), va anonymous class (lop khong ten, khai bao va khoi tao cung luc, thuong dung de cai dat nhanh mot interface hoac ke thua mot lop de tao doi tuong dung mot lan). Vi du: `class Outer { class Inner { ... } static class StaticHelper { ... } Runnable r = new Runnable() { public void run() { ... } }; }` the hien lan luot inner class, static nested class va anonymous class ben trong mot lop Outer.","citations":[]}]},{"id":"day07-sec-enums","title":"Enums","blocks":[{"id":"day07-blk-8","type":"note","text":"Tuong tu Inner Classes, Enums khong co nguon trich dan chuyen sau trong bo tai lieu cua khoa hoc; noi dung duoi day theo kien thuc Java 17 chuan (xem authoring.limitations).","citations":[]},{"id":"day07-blk-9","type":"paragraph","text":"Enum trong Java la mot kieu du lieu dac biet dung de bieu dien mot tap gia tri co dinh, huu han (vi du: cac ngay trong tuan, cac trang thai don hang). Ngoai cac hang so don gian, enum co the co constructor rieng (luon private hoac package-private), field, va method - moi hang so enum thuc chat la mot instance duy nhat cua chinh kieu enum do. Enum cung dung duoc truc tiep trong switch (ca dang classic va dang arrow da hoc o Day 2). Vi du: `enum OrderStatus { NEW(false), PROCESSING(false), SHIPPED(true), CANCELLED(true); private final boolean terminal; OrderStatus(boolean terminal) { this.terminal = terminal; } boolean isTerminal() { return terminal; } }` ket hop voi `switch (status) { case NEW -\u003e ...; case SHIPPED, CANCELLED -\u003e ...; }` cho thay enum co constructor/field/method rieng va dung truc tiep trong switch expression.","citations":[]}]},{"id":"day07-sec-solid","title":"SOLID Principles","blocks":[{"id":"day07-blk-11","type":"note","text":"Chu de nay khong co nguon trich dan trong bo tai lieu cua khoa hoc; noi dung duoi day tom tat theo kien thuc thiet ke huong doi tuong chuan, o muc do gioi thieu (xem authoring.limitations).","citations":[]},{"id":"day07-blk-12","type":"paragraph","text":"SOLID la 5 nguyen tac thiet ke huong doi tuong pho bien: Single Responsibility (moi lop chi nen co mot ly do de thay doi), Open/Closed (mo de mo rong, dong de sua doi - uu tien them lop/interface moi thay vi sua lop cu), Liskov Substitution (lop con phai thay the duoc lop cha ma khong lam sai lech hanh vi mong doi - lien quan truc tiep den polymorphism da hoc o Day 5), Interface Segregation (nhieu interface nho, chuyen biet tot hon mot interface lon, om dom), va Dependency Inversion (module cap cao nen phu thuoc vao abstraction/interface, khong phu thuoc truc tiep vao lop cu the).","citations":[]}]}],"commonMistakes":["Dung interface chi de khai bao hang so static final (anti-pattern 'constant interface') thay vi dung mot lop hang so thong thuong.","Quen rang inner class (khong static) luon giu tham chieu ngam toi instance cua lop ngoai, de gay ro ri bo nho neu giu inner class song lau hon lop ngoai can thiet.","Khai bao enum constructor la public (enum constructor luon phai la private hoac package-private, khong the la public/protected)."],"practices":[{"id":"day07-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Diem khac biet co ban nhat giua abstract class va interface ve kha nang ke thua/implement la gi?","choices":[{"id":"day07-prac-1-a","text":"Mot lop chi extends duoc mot abstract class, nhung implements duoc nhieu interface cung luc"},{"id":"day07-prac-1-b","text":"Interface khong the co method, con abstract class thi co"},{"id":"day07-prac-1-c","text":"Abstract class khong the co constructor, con interface thi co"},{"id":"day07-prac-1-d","text":"Ca hai deu cho phep da ke thua khong gioi han"}],"correctChoiceIds":["day07-prac-1-a"],"hint":"Xem lai bang so sanh Abstract class vs Interface.","solution":"day07-prac-1-a","explanation":"extends la don ke thua (mot abstract class), implements la da nang (nhieu interface cung luc) - day la ly do interface duoc dung de mo phong da ke thua hanh vi trong Java.","rubric":"Chon dung dap an ve don ke thua vs da implement.","sourceUsage":["day07-src-1"]},{"id":"day07-prac-2","type":"concept","interaction":"self-check","prompt":"Giai thich nguyen tac Single Responsibility (SRP) bang mot vi du cu the: mot lop OrderService dang vua xu ly logic don hang vua tu ghi log ra file thi vi pham SRP nhu the nao, va nen tach lai sao cho dung.","choices":[],"correctChoiceIds":[],"hint":"SRP noi ve 'mot ly do de thay doi' - dem xem lop dang co bao nhieu ly do khac nhau khien no phai sua.","solution":"Tach OrderService (chi xu ly nghiep vu don hang) va mot lop rieng nhu OrderLogger/AuditWriter (chi lo ghi log). Moi lop chi con mot ly do de thay doi: OrderService thay doi khi nghiep vu don hang thay doi, OrderLogger thay doi khi cach ghi log thay doi.","explanation":"SRP giup lop de bao tri va test hon vi moi lop chi tap trung mot trach nhiem.","rubric":"Danh gia hoc vien co nhan dien dung 'nhieu ly do thay doi' va de xuat tach lop hop ly hay khong.","sourceUsage":[]},{"id":"day07-prac-3","type":"coding","interaction":"self-check","prompt":"Viet mot enum Season voi 4 gia tri (SPRING, SUMMER, AUTUMN, WINTER) va mot phuong thuc tinh fromMonth(int month) tra ve Season tuong ung (thang 12, 1, 2 la WINTER; 3, 4, 5 la SPRING; 6, 7, 8 la SUMMER; con lai la AUTUMN), dung switch expression dang arrow da hoc o Day 2.","choices":[],"correctChoiceIds":[],"hint":"Dung switch expression voi case gop nhieu gia tri (vi du: case 12, 1, 2 -\u003e).","solution":"enum Season { SPRING, SUMMER, AUTUMN, WINTER;\n    static Season fromMonth(int month) {\n        return switch (month) {\n            case 12, 1, 2 -\u003e WINTER;\n            case 3, 4, 5 -\u003e SPRING;\n            case 6, 7, 8 -\u003e SUMMER;\n            default -\u003e AUTUMN;\n        };\n    }\n}","explanation":"Enum ket hop switch expression cho phep bieu dien logic anh xa gon va an toan kieu.","rubric":"Danh gia enum co du 4 gia tri, phuong thuc tinh (static) dung switch expression dang arrow, va logic anh xa thang dung.","sourceUsage":[]},{"id":"day07-prac-4","type":"coding","interaction":"self-check","prompt":"Viet mot interface Shape2D voi method double area(); sau do viet mot lop Rectangle implements Shape2D, va mot inner class ben trong Rectangle ten Diagonal co method double length() tinh duong cheo hinh chu nhat.","choices":[],"correctChoiceIds":[],"hint":"Inner class truy cap truc tiep field cua lop ngoai (Rectangle) ma khong can truyen tham so.","solution":"interface Shape2D { double area(); }\nclass Rectangle implements Shape2D {\n    private final double width, height;\n    Rectangle(double width, double height) { this.width = width; this.height = height; }\n    public double area() { return width * height; }\n    class Diagonal {\n        double length() { return Math.sqrt(width * width + height * height); }\n    }\n}","explanation":"Bai tap ket hop interface (Day 7) va inner class (Day 7) trong cung mot thiet ke nho.","rubric":"Danh gia interface duoc implement dung, inner class truy cap dung field cua lop ngoai, cong thuc duong cheo chinh xac.","sourceUsage":[]}],"syllabusAssignments":[{"row":14,"text":"Assignment"}],"enhancedExercises":["Refactor mot lop 'God class' vi pham SRP (vi du: lop vua doc file, vua tinh toan, vua ghi log) thanh nhieu lop nho theo tung trach nhiem.","Chuyen mot anonymous class Runnable thanh mot lambda expression tuong duong (chuan bi truoc cho Day 10 - Functional Interface \u0026 Lambda)."],"references":[{"id":"day07-ref-1","type":"external","resourceId":"res-0196dd00302a","citationId":"day07-src-1","url":"https://docs.oracle.com/javase/tutorial/java/IandI/index.html","label":"Interface \u0026 Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Interfaces and Inheritance (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day07-ref-2","type":"internal","resourceId":null,"citationId":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-08","unitId":"unit-03","group":"java","kind":"theory","title":"Generics, Collections \u0026 Exception Handling","summary":"Generics giup kiem tra kieu luc bien dich (bounded type, wildcard, type erasure); Collections Framework to chuc du lieu qua List/Set/Map; Exception hierarchy phan biet checked/unchecked va try-with-resources tu dong dong resource theo thu tu nguoc khai bao.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Da hoan thanh Day 7 (Interface, Inner Classes, Enums, SOLID Principles)."],"outcomes":["Viet duoc generic method voi bounded type parameter.","Chon dung cai dat List/Set/Map phu hop tung tinh huong.","Phan biet checked va unchecked exception, thiet ke exception hierarchy hop ly.","Dung try-with-resources thay cho finally thu cong khi lam viec voi AutoCloseable."],"sections":[{"id":"day08-sec-generics","title":"Generics","blocks":[{"id":"day08-blk-1","type":"paragraph","text":"Generics cho phep mot lop, interface hoac method thao tac tren kieu du lieu duoc tham so hoa, giup trinh bien dich phat hien loi ve kieu ngay luc bien dich thay vi de loi roi den runtime moi phat hien.","citations":["day08-src-1"]},{"id":"day08-blk-2","type":"paragraph","text":"Truoc khi co generics, cac collection (nhu List) luu Object va lap trinh vien phai ep kieu tuong minh moi khi lay phan tu ra - de gay ClassCastException luc runtime neu ep sai kieu. Khai bao generic nhu List\u003cInteger\u003e giup trinh bien dich kiem tra kieu ngay tai diem them/lay phan tu, loai bo hoan toan nhu cau ep kieu thu cong.","citations":["day08-src-2"]},{"id":"day08-blk-3","type":"code","language":"java","code":"class BoundedMathUtil {\n    static \u003cT extends Comparable\u003cT\u003e\u003e T max(T a, T b) {\n        return a.compareTo(b) \u003e= 0 ? a : b;\n    }\n}\n","compile":true,"citations":["day08-src-3"]},{"id":"day08-blk-4","type":"important","text":"Wildcard '?' dung khi khong can quan tam kieu cu the: '? extends T' (upper bounded) cho phep doc phan tu kieu T tro len nhung khong duoc them vao (producer); '? super T' (lower bounded) cho phep them phan tu kieu T tro xuong (consumer).","citations":["day08-src-4"]},{"id":"day08-blk-5","type":"note","text":"Type erasure: trinh bien dich Java xoa toan bo thong tin kieu generic sau khi bien dich xong (bytecode khong con biet List\u003cInteger\u003e khac List\u003cString\u003e) - day cung la ly do generics khong dung truc tiep duoc voi kieu nguyen thuy (int, double...), chi dung duoc voi kieu tham chieu (Integer, Double...).","citations":["day08-src-5"]}]},{"id":"day08-sec-collections","title":"Collections Framework: List, Set, Map","blocks":[{"id":"day08-blk-6","type":"paragraph","text":"Java Collections Framework (theo Trail chinh thuc cua Oracle) gom cac interface goc nhu Collection, List, Set, Map cung cac lop cai dat va thuat toan di kem, cung cap mot kien truc thong nhat de luu tru va thao tac tren nhom doi tuong.","citations":["day08-src-6"]},{"id":"day08-blk-7","type":"paragraph","text":"Theo cach phan nhom cua Java Collections Series, cac cai dat pho bien duoc chia theo tung nhom interface: List (ArrayList, LinkedList), Set (HashSet, LinkedHashSet, TreeSet), Map (HashMap, LinkedHashMap, TreeMap), moi nhom co dac diem rieng ve thu tu va trung lap.","citations":["day08-src-7"]},{"id":"day08-blk-8","type":"table","columns":["Interface","Cho phep phan tu trung lap?","Co thu tu?","Cai dat tieu bieu"],"rows":[["List","Co","Co (theo chi so index)","ArrayList, LinkedList"],["Set","Khong","Tuy cai dat (HashSet: khong; LinkedHashSet/TreeSet: co)","HashSet, LinkedHashSet, TreeSet"],["Map","Key khong trung, value co the trung","Tuy cai dat (HashMap: khong; LinkedHashMap/TreeMap: co)","HashMap, LinkedHashMap, TreeMap"]],"citations":["day08-src-6","day08-src-7"]}]},{"id":"day08-sec-exceptions","title":"Exception Hierarchy","blocks":[{"id":"day08-blk-9","type":"paragraph","text":"Bai hoc Exceptions trinh bay co che xu ly loi cua Java: khi mot doi tuong exception duoc nem (throw) trong luc thuc thi mot method, luong thuc thi binh thuong bi ngat va JVM tim kiem noi xu ly (catch) phu hop.","citations":["day08-src-8"]},{"id":"day08-blk-10","type":"important","text":"Phan cap exception bat dau tu Throwable, chia thanh hai nhanh chinh: Exception (bao gom checked exception va nhanh con RuntimeException la unchecked exception) va Error (loi nghiem trong cua JVM, khong nen tu catch de xu ly).","citations":["day08-src-9"]},{"id":"day08-blk-11","type":"paragraph","text":"Checked exception (ke thua truc tiep tu Exception, khong qua RuntimeException) bat buoc phai duoc khai bao trong chu ky throws hoac xu ly bang try-catch, kiem tra ngay luc bien dich. Unchecked exception (ke thua tu RuntimeException) khong bi kiem tra luc bien dich, thuong dai dien cho loi lap trinh (vi du: NullPointerException).","citations":["day08-src-10"]},{"id":"day08-blk-12","type":"code","language":"java","code":"class InsufficientBalanceException extends Exception {\n    InsufficientBalanceException(String message) {\n        super(message);\n    }\n}\n\nclass InvalidAmountException extends RuntimeException {\n    InvalidAmountException(String message) {\n        super(message);\n    }\n}\n\nclass Account {\n    private double balance;\n\n    Account(double balance) {\n        this.balance = balance;\n    }\n\n    void withdraw(double amount) throws InsufficientBalanceException {\n        if (amount \u003c= 0) {\n            throw new InvalidAmountException(\"amount must be positive\");\n        }\n        if (amount \u003e balance) {\n            throw new InsufficientBalanceException(\"not enough balance\");\n        }\n        balance -= amount;\n    }\n}\n","compile":true,"citations":["day08-src-9","day08-src-10"]},{"id":"day08-blk-13","type":"warning","text":"Hai anti-pattern pho bien can tranh: (1) 'nuot' exception bang mot catch block rong khong lam gi ca, khien loi bien mat khong dau vet; (2) dung return hoac throw ben trong khoi finally, vi no se ghi de (che khuat) hoan toan gia tri return hoac exception dang duoc nem tu khoi try/catch tuong ung.","citations":["day08-src-11"]}]},{"id":"day08-sec-try-with-resources","title":"try-with-resources","blocks":[{"id":"day08-blk-14","type":"paragraph","text":"Cu phap try-with-resources (tu Java 7) cho phep khai bao resource (kieu AutoCloseable) ngay trong ngoac don sau tu khoa try; resource se duoc tu dong dong (goi close()) khi khoi try ket thuc, ke ca khi co exception xay ra, khong can khoi finally thu cong.","citations":["day08-src-12"]},{"id":"day08-blk-15","type":"paragraph","text":"Mot khoi try-with-resources co the khai bao nhieu resource cung luc, phan cach nhau bang dau cham phay.","citations":["day08-src-13"]},{"id":"day08-blk-16","type":"code","language":"java","code":"import java.util.ArrayList;\nimport java.util.List;\n\nclass LogBuffer implements AutoCloseable {\n    private final List\u003cString\u003e lines = new ArrayList\u003c\u003e();\n    private boolean closed = false;\n\n    void write(String line) {\n        lines.add(line);\n    }\n\n    List\u003cString\u003e lines() {\n        return lines;\n    }\n\n    boolean isClosed() {\n        return closed;\n    }\n\n    @Override\n    public void close() {\n        closed = true;\n    }\n}\n\nclass MultiResourceDemo {\n    void run() {\n        try (LogBuffer first = new LogBuffer();\n             LogBuffer second = new LogBuffer()) {\n            first.write(\"a\");\n            second.write(\"b\");\n        }\n    }\n}\n","compile":true,"citations":["day08-src-14","day08-src-13"]},{"id":"day08-blk-17","type":"note","text":"Thu tu dong resource nguoc voi thu tu khai bao: resource khai bao sau cung se duoc dong truoc, resource khai bao dau tien duoc dong sau cung.","citations":["day08-src-15"]}]}],"commonMistakes":["Bat exception chung chung bang catch (Exception e) roi bo qua (nuot loi) thay vi xu ly hoac re-throw dung loai exception cu the.","Dung return/throw ben trong khoi finally, vo tinh che mat gia tri hoac exception that su cua khoi try/catch.","Khai bao kieu nguyen thuy (int, double) lam type argument cho generic (vi du List\u003cint\u003e) - Java khong cho phep vi type erasure chi hoat dong voi kieu tham chieu."],"practices":[{"id":"day08-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Dieu gi phan biet checked exception voi unchecked exception (RuntimeException)?","choices":[{"id":"day08-prac-1-a","text":"Checked exception bat buoc khai bao throws hoac try-catch, duoc kiem tra luc bien dich; unchecked thi khong"},{"id":"day08-prac-1-b","text":"Checked exception chi xay ra luc runtime, unchecked chi xay ra luc bien dich"},{"id":"day08-prac-1-c","text":"Unchecked exception khong the duoc catch bang catch block"},{"id":"day08-prac-1-d","text":"Khong co su khac biet nao, day chi la quy uoc dat ten"}],"correctChoiceIds":["day08-prac-1-a"],"hint":"Xem lai phan phan cap Throwable -\u003e Exception -\u003e RuntimeException.","solution":"day08-prac-1-a","explanation":"Checked exception (ke thua Exception, khong qua RuntimeException) bi trinh bien dich bat buoc xu ly; unchecked exception (ke thua RuntimeException) thi khong.","rubric":"Chon dung dinh nghia checked vs unchecked.","sourceUsage":["day08-src-10"]},{"id":"day08-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Trong mot khoi try-with-resources khai bao 'try (A a = new A(); B b = new B()) { ... }', resource nao duoc dong (close()) truoc?","choices":[{"id":"day08-prac-2-a","text":"b (resource khai bao sau cung duoc dong truoc)"},{"id":"day08-prac-2-b","text":"a (resource khai bao dau tien duoc dong truoc)"},{"id":"day08-prac-2-c","text":"Ca hai dong dong thoi, khong co thu tu xac dinh"},{"id":"day08-prac-2-d","text":"Khong resource nao duoc tu dong dong"}],"correctChoiceIds":["day08-prac-2-a"],"hint":"Thu tu dong nguoc voi thu tu khai bao.","solution":"day08-prac-2-a","explanation":"try-with-resources dong resource theo thu tu nguoc lai voi thu tu khai bao: b duoc dong truoc, a duoc dong sau.","rubric":"Chon dung resource duoc dong truoc.","sourceUsage":["day08-src-15"]},{"id":"day08-prac-3","type":"coding","interaction":"self-check","prompt":"Viet mot generic method 'static \u003cT extends Comparable\u003cT\u003e\u003e T min(List\u003cT\u003e items)' tra ve phan tu nho nhat trong danh sach (gia dinh danh sach khong rong).","choices":[],"correctChoiceIds":[],"hint":"Dung compareTo() de so sanh tung phan tu, giu lai phan tu nho nhat da thay.","solution":"static \u003cT extends Comparable\u003cT\u003e\u003e T min(List\u003cT\u003e items) {\n    T smallest = items.get(0);\n    for (T item : items) {\n        if (item.compareTo(smallest) \u003c 0) {\n            smallest = item;\n        }\n    }\n    return smallest;\n}","explanation":"Bounded generic method dam bao T co the so sanh duoc (Comparable\u003cT\u003e) tai thoi diem bien dich.","rubric":"Danh gia method dung bounded type parameter dung, duyet toan bo danh sach, tra ve dung phan tu nho nhat.","sourceUsage":[]},{"id":"day08-prac-4","type":"concept","interaction":"self-check","prompt":"Giai thich type erasure anh huong the nao toi viec khong the tao 'new T[10]' hoac 'new ArrayList\u003cInteger\u003e()[5]' (mang cua kieu generic) trong Java.","choices":[],"correctChoiceIds":[],"hint":"Sau type erasure, trinh bien dich khong con biet T la kieu gi luc runtime nen khong the cap phat mang dung kieu.","solution":"Vi type erasure xoa het thong tin kieu generic cu the sau khi bien dich, JVM luc runtime khong biet T thuc su la kieu gi de tao mang dung kieu do (mang trong Java can biet kieu phan tu cu the luc tao) - nen Java cam truc tiep 'new T[]' va 'new List\u003cX\u003e[]'.","explanation":"Type erasure la ly do sau xa cua nhieu han che ky la trong generics ma lap trinh vien Java hay gap.","rubric":"Danh gia hoc vien lien ket dung type erasure voi han che tao mang generic.","sourceUsage":[]}],"syllabusAssignments":[],"enhancedExercises":["Viet mot custom exception hierarchy 3 tang (vi du: AppException -\u003e ValidationException -\u003e MissingFieldException) va mot method minh hoa catch dung tung tang.","Viet mot lop tu tao cai dat AutoCloseable, mo mot 'ket noi' gia lap trong constructor va dong no trong close(), roi dung trong try-with-resources voi 3 resource cung luc."],"references":[{"id":"day08-ref-1","type":"external","resourceId":"res-e3b2dcb60e96","citationId":"day08-src-1","url":"https://docs.oracle.com/javase/tutorial/java/generics/index.html","label":"Generics","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Generics (Updated) (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day08-ref-2","type":"external","resourceId":"res-8abee0bfd5a7","citationId":"day08-src-3","url":"https://www.baeldung.com/java-generics","label":"Java Generics","checkStatus":"ok","readStatus":"read","pageTitle":"The Basics of Java Generics | Baeldung","limitation":null},{"id":"day08-ref-3","type":"external","resourceId":"res-899383bc8d09","citationId":"day08-src-6","url":"https://docs.oracle.com/javase/tutorial/collections/index.html","label":"Collections","checkStatus":"ok","readStatus":"read","pageTitle":"Trail: Collections (The Java Tutorials)","limitation":null},{"id":"day08-ref-4","type":"external","resourceId":"res-30d834f8fef0","citationId":"day08-src-9","url":"https://www.baeldung.com/java-exceptions","label":"Java Exceptions","checkStatus":"ok","readStatus":"read","pageTitle":"Exception Handling in Java | Baeldung","limitation":null},{"id":"day08-ref-5","type":"external","resourceId":"res-9762250d04d9","citationId":"day08-src-12","url":"https://www.baeldung.com/java-try-with-resources","label":"Try-with-resources","checkStatus":"ok","readStatus":"read","pageTitle":"Java – Try with Resources | Baeldung","limitation":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-09","unitId":"unit-03","group":"java","kind":"lab","title":"- Lab 3: Custom Collection \u0026 Exception Framework","summary":"Lab 3: tu cai dat SimpleArrayList\u003cE\u003e (mang dong) va SimpleHashMap\u003cK,V\u003e (separate chaining) cung mot he thong exception rieng cho tang truy cap du lieu, tong hop generics/collections/exception da hoc o Day 8.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Da hoan thanh Day 8 (Generics, Collections Framework, Exception hierarchy, try-with-resources)."],"outcomes":["Tu cai dat mot cau truc du lieu generic (dynamic array) tu dau.","Tu cai dat mot hash map don gian dung separate chaining.","Thiet ke mot exception hierarchy rieng cho mot tang ung dung cu the.","Viet bo test dat do bao phu cao, gom ca nhanh loi."],"sections":[{"id":"day09-sec-brief","title":"De bai: Custom Collection \u0026 Exception Framework","blocks":[{"id":"day09-blk-1","type":"deliverable","text":"- Lab 3: Custom Collection \u0026 Exception Framework\n  - Implement `SimpleArrayList\u003cE\u003e` with dynamic array (add, get, remove, size, iterator)\n  - Implement `SimpleHashMap\u003cK,V\u003e` with separate chaining\n  - Custom exception hierarchy: `DataAccessException` → `DuplicatedKeyException`, `KeyNotFoundException`\n  - Test coverage ≥ 80%","citations":[]},{"id":"day09-blk-2","type":"note","text":"Lab nay tong hop truc tiep kien thuc Day 8: generics (SimpleArrayList\u003cE\u003e, SimpleHashMap\u003cK,V\u003e phai la kieu tham so hoa), Collections Framework (cai dat lai mot phan hanh vi cua List/Map tu dau) va exception hierarchy (thiet ke rieng mot nhanh exception cho tang truy cap du lieu).","citations":[]}]},{"id":"day09-sec-design","title":"Phan ra thiet ke (guided decomposition)","blocks":[{"id":"day09-blk-3","type":"paragraph","text":"SimpleArrayList\u003cE\u003e nen dung generic type parameter E giong cach cac generic method/class da hoc o Day 8, de trinh bien dich kiem tra kieu phan tu ngay luc them/lay ra thay vi phai ep kieu tu Object.","citations":["day09-src-1"]},{"id":"day09-blk-4","type":"note","text":"Chu de 'separate chaining' (moi bucket cua hash map la mot danh sach lien ket cac Node\u003cK,V\u003e) la chi tiet cai dat noi bo cua hash table, khong duoc mo ta trong cac trang mo dau/muc luc Collections ma Day 9 duoc gan (Trail: Collections va Collections Series deu la trang tong quan cap interface, khong di sau vao thuat toan noi bo tung cai dat) - xem authoring.limitations. Thiet ke goi y: mot mang cac 'bucket' (Node\u003cK,V\u003e[]), voi index bucket tinh tu key.hashCode(); moi bucket la mot danh sach lien ket don de xu ly dung do (collision) khi nhieu key roi vao cung mot bucket.","citations":[]},{"id":"day09-blk-5","type":"important","text":"Exception rieng cua tang truy cap du lieu (DataAccessException va hai lop con DuplicatedKeyException/KeyNotFoundException) nen ke thua RuntimeException (unchecked) chu khong phai Exception (checked): day la loi logic nghiep vu luc runtime (thao tac tren key khong hop le), khong phai loi ngoai canh bat buoc goi phai xu ly ngay tai moi diem goi nhu IOException.","citations":["day09-src-4","day09-src-5"]}]},{"id":"day09-sec-implementation","title":"Cai dat tham khao","blocks":[{"id":"day09-blk-6","type":"code","language":"java","code":"import java.util.Iterator;\nimport java.util.NoSuchElementException;\n\nclass DataAccessException extends RuntimeException {\n    DataAccessException(String message) {\n        super(message);\n    }\n}\n\nclass DuplicatedKeyException extends DataAccessException {\n    DuplicatedKeyException(String message) {\n        super(message);\n    }\n}\n\nclass KeyNotFoundException extends DataAccessException {\n    KeyNotFoundException(String message) {\n        super(message);\n    }\n}\n\nclass SimpleArrayList\u003cE\u003e implements Iterable\u003cE\u003e {\n    private Object[] elements = new Object[8];\n    private int size = 0;\n\n    void add(E element) {\n        if (size == elements.length) {\n            elements = java.util.Arrays.copyOf(elements, elements.length * 2);\n        }\n        elements[size++] = element;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    E get(int index) {\n        checkIndex(index);\n        return (E) elements[index];\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    E remove(int index) {\n        checkIndex(index);\n        E removed = (E) elements[index];\n        int numMoved = size - index - 1;\n        if (numMoved \u003e 0) {\n            System.arraycopy(elements, index + 1, elements, index, numMoved);\n        }\n        elements[--size] = null;\n        return removed;\n    }\n\n    int size() {\n        return size;\n    }\n\n    private void checkIndex(int index) {\n        if (index \u003c 0 || index \u003e= size) {\n            throw new IndexOutOfBoundsException(\"index=\" + index + \", size=\" + size);\n        }\n    }\n\n    @Override\n    public Iterator\u003cE\u003e iterator() {\n        return new Iterator\u003cE\u003e() {\n            private int cursor = 0;\n\n            @Override\n            public boolean hasNext() {\n                return cursor \u003c size;\n            }\n\n            @Override\n            public E next() {\n                if (!hasNext()) {\n                    throw new NoSuchElementException();\n                }\n                return get(cursor++);\n            }\n        };\n    }\n}\n\nclass SimpleHashMap\u003cK, V\u003e {\n    private static class Node\u003cK, V\u003e {\n        final K key;\n        V value;\n        Node\u003cK, V\u003e next;\n\n        Node(K key, V value, Node\u003cK, V\u003e next) {\n            this.key = key;\n            this.value = value;\n            this.next = next;\n        }\n    }\n\n    private Node\u003cK, V\u003e[] buckets;\n    private int size = 0;\n\n    @SuppressWarnings(\"unchecked\")\n    SimpleHashMap() {\n        buckets = new Node[16];\n    }\n\n    void put(K key, V value) {\n        int index = indexOf(key);\n        for (Node\u003cK, V\u003e node = buckets[index]; node != null; node = node.next) {\n            if (node.key.equals(key)) {\n                throw new DuplicatedKeyException(\"Key already exists: \" + key);\n            }\n        }\n        buckets[index] = new Node\u003c\u003e(key, value, buckets[index]);\n        size++;\n    }\n\n    V get(K key) {\n        int index = indexOf(key);\n        for (Node\u003cK, V\u003e node = buckets[index]; node != null; node = node.next) {\n            if (node.key.equals(key)) {\n                return node.value;\n            }\n        }\n        throw new KeyNotFoundException(\"Key not found: \" + key);\n    }\n\n    int size() {\n        return size;\n    }\n\n    private int indexOf(K key) {\n        return Math.floorMod(key.hashCode(), buckets.length);\n    }\n}\n","compile":true,"citations":["day09-src-1","day09-src-4","day09-src-5"]}]},{"id":"day09-sec-tests","title":"Danh sach test can co","blocks":[{"id":"day09-blk-7","type":"table","columns":["Test case","Muc tieu","Ket qua mong doi"],"rows":[["add() + get() lien tiep tren SimpleArrayList","Xac nhan phan tu duoc them va lay dung thu tu","get(i) tra ve dung phan tu da add o vi tri i"],["get()/remove() voi index ngoai pham vi","Xac nhan validate bien","Nem IndexOutOfBoundsException"],["put() voi key da ton tai","Xac nhan rang buoc khong trung key","Nem DuplicatedKeyException"],["get() voi key khong ton tai","Xac nhan xu ly truy van sai","Nem KeyNotFoundException"]],"citations":["day09-src-4","day09-src-5"]},{"id":"day09-blk-8","type":"warning","text":"Test coverage \u003e= 80% (theo de bai) can bao phu ca nhanh loi (index/key khong hop le) chu khong chi nhanh thanh cong - cac exception rieng (DuplicatedKeyException, KeyNotFoundException, IndexOutOfBoundsException) can co it nhat mot test rieng cho tung loai.","citations":["day09-src-4","day09-src-5"]}]}],"commonMistakes":["Dung Object[] lam mang noi bo nhung quen ep kieu (E) khi tra ve tu get(), dan toi loi bien dich hoac ClassCastException khong ro rang.","Quen tang buckets khi so phan tu vuot mot nguong (load factor) - cai dat trong bai co the bo qua resize de don gian, nhung can ghi ro gioi han nay neu khong lam.","Cho ca ba loai exception ke thua truc tiep RuntimeException thay vi cho DuplicatedKeyException/KeyNotFoundException ke thua DataAccessException - lam mat kha nang catch chung ca nhom bang mot khoi catch (DataAccessException e)."],"practices":[{"id":"day09-prac-1","type":"applied","interaction":"self-check","prompt":"Cai dat day du SimpleArrayList\u003cE\u003e, SimpleHashMap\u003cK,V\u003e va he thong exception (DataAccessException, DuplicatedKeyException, KeyNotFoundException) theo dung de bai, kem bo test dat test coverage \u003e= 80%.","choices":[],"correctChoiceIds":[],"hint":"Bat dau tu SimpleArrayList (don gian hon) truoc, viet test ngay sau moi method; SimpleHashMap va exception hierarchy lam sau.","solution":"Xem muc 'Cai dat tham khao' o tren; day la mot cach cai dat hop le, co the dieu chinh chi tiet noi bo (vi du kich thuoc mang ban dau) mien giu dung API cong khai theo de bai.","explanation":"Khong co loi giai co dinh - danh gia theo do dung API va do bao phu test.","rubric":"Dat yeu cau khi: SimpleArrayList co du add/get/remove/size/iterator; SimpleHashMap dung separate chaining va nem dung exception; ca ba loai exception deu ke thua dung nhanh DataAccessException; test bao phu ca nhanh loi.","sourceUsage":[]},{"id":"day09-prac-2","type":"concept","interaction":"multiple-choice","prompt":"Tai sao DataAccessException trong lab nay nen ke thua RuntimeException (unchecked) thay vi Exception (checked)?","choices":[{"id":"day09-prac-2-a","text":"Vi day la loi logic nghiep vu phat sinh luc runtime khi thao tac key khong hop le, khong phai loi ngoai canh bat buoc moi noi goi phai xu ly ngay"},{"id":"day09-prac-2-b","text":"Vi RuntimeException chay nhanh hon Exception"},{"id":"day09-prac-2-c","text":"Vi checked exception khong the co constructor nhan String message"},{"id":"day09-prac-2-d","text":"Vi Java khong cho phep tu tao checked exception"}],"correctChoiceIds":["day09-prac-2-a"],"hint":"Xem lai phan phan biet checked vs unchecked o Day 8.","solution":"day09-prac-2-a","explanation":"Checked exception phu hop voi loi ngoai canh khong the tranh duoc du code dung (vi du IOException); loi truy cap du lieu sai (key trung, key khong ton tai) la loi logic co the tranh duoc bang kiem tra dieu kien truoc, phu hop lam unchecked exception.","rubric":"Chon dung ly do RuntimeException phu hop hon Exception cho truong hop nay.","sourceUsage":["day09-src-5"]},{"id":"day09-prac-3","type":"coding","interaction":"self-check","prompt":"Viet mot unit test (dang JUnit-style, chi can viet than method test, khong can day du annotation) cho SimpleHashMap.put(): tao map, put mot key, roi put lai chinh key do lan nua va xac nhan ket qua nem DuplicatedKeyException.","choices":[],"correctChoiceIds":[],"hint":"Dung assertThrows(DuplicatedKeyException.class, () -\u003e ...) kieu JUnit 5.","solution":"void putDuplicateKey_throwsDuplicatedKeyException() {\n    SimpleHashMap\u003cString, Integer\u003e map = new SimpleHashMap\u003c\u003e();\n    map.put(\"a\", 1);\n    assertThrows(DuplicatedKeyException.class, () -\u003e map.put(\"a\", 2));\n}","explanation":"Test truc tiep xac nhan hop dong (contract) cua exception rieng da thiet ke.","rubric":"Danh gia test tao du lieu dung, goi put() hai lan cung key, va assert dung loai exception duoc nem.","sourceUsage":[]}],"syllabusAssignments":[{"row":17,"text":"- Lab 3: Custom Collection \u0026 Exception Framework\n  - Implement `SimpleArrayList\u003cE\u003e` with dynamic array (add, get, remove, size, iterator)\n  - Implement `SimpleHashMap\u003cK,V\u003e` with separate chaining\n  - Custom exception hierarchy: `DataAccessException` → `DuplicatedKeyException`, `KeyNotFoundException`\n  - Test coverage ≥ 80%"}],"enhancedExercises":["Them phuong thuc remove(K key) cho SimpleHashMap, nem KeyNotFoundException neu key khong ton tai.","Do thoi gian chay get()/put() cua SimpleHashMap voi so luong phan tu lon dan (100, 1000, 10000) de quan sat truc quan hieu ung cua hash collision khi khong resize buckets."],"references":[{"id":"day09-ref-1","type":"external","resourceId":"res-e3b2dcb60e96","citationId":"day09-src-1","url":"https://docs.oracle.com/javase/tutorial/java/generics/index.html","label":"Generics","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Generics (Updated) (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day09-ref-2","type":"external","resourceId":"res-30d834f8fef0","citationId":"day09-src-4","url":"https://www.baeldung.com/java-exceptions","label":"Java Exceptions","checkStatus":"ok","readStatus":"read","pageTitle":"Exception Handling in Java | Baeldung","limitation":null},{"id":"day09-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-10","unitId":"unit-04","group":"java","kind":"theory","title":"Lambda \u0026 Stream API Chuyên Sâu","summary":"Lambda expression la cach viet gon cai dat functional interface; Stream.filter() loc phan tu qua Predicate (ke ca nhieu dieu kien va xu ly checked exception); Collectors, Optional va Parallel Stream duoc gioi thieu o muc chuan Java 17 de hoan thien buc tranh Stream API.","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Da hoan thanh Day 8-9 (Generics, Collections Framework, Exception hierarchy)."],"outcomes":["Viet duoc lambda expression cho cac functional interface chuan (Predicate, Function, Consumer, Supplier).","Xay dung duoc mot Stream pipeline loc theo nhieu dieu kien bang filter().","Su dung dung Collectors.toList()/groupingBy()/toMap() de gom ket qua stream.","Giai thich duoc vi sao Optional an toan hon tra ve null va khi nao parallel stream co loi."],"sections":[{"id":"day10-sec-lambda","title":"Lambda \u0026 Functional Interface","blocks":[{"id":"day10-blk-1","type":"note","text":"Chu de nay khong co nguon trich dan chuyen sau trong resourceIds cua Day 10 (xem authoring.limitations); noi dung duoi day theo kien thuc Java 17 chuan, tap trung vao phan lam nen tang cho Stream API.","citations":[]},{"id":"day10-blk-2","type":"paragraph","text":"Functional interface la mot interface chi co dung mot phuong thuc truu tuong (abstract method) - vi du Predicate\u003cT\u003e (co method boolean test(T t)), Function\u003cT,R\u003e (R apply(T t)), Consumer\u003cT\u003e (void accept(T t)), Supplier\u003cT\u003e (T get()). Lambda expression la cach viet gon mot cai dat cho functional interface: cu phap tong quat la `(tham so) -\u003e bieu thuc hoac khoi lenh`, vi du `Predicate\u003cInteger\u003e isEven = n -\u003e n % 2 == 0;` tuong duong voi viet mot lop an danh cai dat Predicate nhung ngan gon hon rat nhieu.","citations":[]}]},{"id":"day10-sec-pipeline","title":"Stream pipeline va Stream.filter()","blocks":[{"id":"day10-blk-3","type":"paragraph","text":"Stream.filter() la mot intermediate operation cua Stream, nhan vao mot Predicate\u003cT\u003e va tra ve mot stream moi chi gom cac phan tu thoa dieu kien; co the truyen vao bang lambda expression hoac method reference.","citations":["day10-src-1"]},{"id":"day10-blk-4","type":"code","language":"java","code":"import java.util.List;\nimport java.util.stream.Collectors;\n\nclass ProductFilterDemo {\n    record Product(String name, double price, boolean inStock) {}\n\n    List\u003cProduct\u003e availableUnder(List\u003cProduct\u003e products, double maxPrice) {\n        return products.stream()\n                .filter(p -\u003e p.inStock() \u0026\u0026 p.price() \u003c= maxPrice)\n                .collect(Collectors.toList());\n    }\n}\n","compile":true,"citations":["day10-src-1","day10-src-2"]},{"id":"day10-blk-5","type":"paragraph","text":"Co the ket hop nhieu dieu kien loc trong cung mot lambda bang toan tu \u0026\u0026 (nhu vi du tren ket hop inStock() va gioi han gia) thay vi goi filter() nhieu lan lien tiep.","citations":["day10-src-2"]},{"id":"day10-blk-6","type":"note","text":"Functional interface chuan cua Java (nhu Predicate) khong khai bao checked exception trong chu ky phuong thuc, nen mot method reference nem checked exception se bi loi bien dich khi dung truc tiep trong filter(); cach xu ly pho bien la boc try-catch ben trong than lambda roi chuyen checked exception thanh unchecked (hoac tra ve gia tri mac dinh) truoc khi tra ve boolean.","citations":["day10-src-3"]},{"id":"day10-blk-7","type":"table","columns":["Nhom","Vi du thao tac","Vai tro trong pipeline"],"rows":[["Stream Basics","Stream.of, list.stream()","Khoi tao nguon du lieu cho pipeline"],["Operations with Streams","filter, map/flatMap, reduce, parallel stream","Bien doi/loc/tong hop du lieu qua stream"],["Stream Collectors","Collectors (toList, groupingBy, toMap)","Gom ket qua cuoi pipeline thanh cau truc du lieu cu the"]],"citations":["day10-src-4"]}]},{"id":"day10-sec-collectors","title":"Collectors","blocks":[{"id":"day10-blk-8","type":"note","text":"Chu de nay khong co nguon trich dan chi tiet trong resourceIds cua Day 10 - bang o muc truoc (c4) chi xac nhan Collectors la mot nhom chu de trong Streams Series, khong mo ta chi tiet tung phuong thuc (xem authoring.limitations). Noi dung duoi day theo kien thuc Java 17 chuan.","citations":[]},{"id":"day10-blk-9","type":"paragraph","text":"Collectors la lop tien ich cung cap cac 'chien luoc gom ket qua' de dung voi Stream.collect(): Collectors.toList()/toSet() gom thanh collection; Collectors.groupingBy(keyFn) nhom phan tu theo mot khoa thanh Map\u003cK, List\u003cT\u003e\u003e; Collectors.toMap(keyFn, valueFn) gom truc tiep thanh Map\u003cK, V\u003e; Collectors.joining(delimiter) noi cac phan tu String lai voi nhau.","citations":[]}]},{"id":"day10-sec-optional","title":"Optional","blocks":[{"id":"day10-blk-10","type":"note","text":"Chu de nay khong co nguon trich dan trong resourceIds cua Day 10 (xem authoring.limitations); noi dung duoi day theo kien thuc Java 17 chuan.","citations":[]},{"id":"day10-blk-11","type":"paragraph","text":"Optional\u003cT\u003e la mot kieu wrapper bieu dien 'co the co hoac khong co gia tri', dung de thay the viec tra ve null truc tiep va buoc noi goi phai xu ly tuong minh truong hop rong: Optional.ofNullable(x) tao Optional co the rong; isPresent()/isEmpty() kiem tra; get() lay gia tri (nem NoSuchElementException neu rong, nen tranh dung truc tiep); orElse(default)/orElseGet(supplier) cung cap gia tri thay the an toan hon; map(fn) bien doi gia tri ben trong neu co.","citations":[]}]},{"id":"day10-sec-parallel","title":"Parallel Stream","blocks":[{"id":"day10-blk-12","type":"note","text":"Chu de nay khong co nguon trich dan chi tiet trong resourceIds cua Day 10 - bang c4 chi xac nhan 'parallel stream' la mot thao tac duoc liet ke trong nhom Operations with Streams, khong mo ta co che hoat dong (xem authoring.limitations). Noi dung duoi day theo kien thuc Java 17 chuan.","citations":[]},{"id":"day10-blk-13","type":"note","text":"list.stream().parallel() (hoac list.parallelStream()) chia cong viec cho nhieu thread trong ForkJoinPool.commonPool(), chi nen dung khi tap du lieu du lon va thao tac tren moi phan tu du 'nang' de bu duoc chi phi dieu phoi song song; voi tap du lieu nho hoac thao tac don gian, parallel stream co the CHAM HON stream tuan tu. Ngoai ra thao tac ben trong parallel stream phai stateless va khong gay side-effect tren du lieu chia se, neu khong se dan toi ket qua sai lech ngau nhien.","citations":[]}]}],"commonMistakes":["Goi get() truc tiep tren Optional ma khong kiem tra isPresent() truoc, dan toi NoSuchElementException khi Optional rong - mat het loi ich an toan cua Optional.","Dung method reference nem checked exception truc tiep trong filter()/map() ma khong boc try-catch, gay loi bien dich vi functional interface chuan khong khai bao checked exception.","Dung parallel stream cho tap du lieu nho hoac thao tac don gian, khien code cham hon va kho doan ket qua vi chi phi dieu phoi song song lon hon loi ich."],"practices":[{"id":"day10-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Stream.filter() nhan vao tham so kieu gi va lam gi voi stream nguon?","choices":[{"id":"day10-prac-1-a","text":"Nhan mot Predicate\u003cT\u003e, tra ve stream moi chi gom cac phan tu thoa dieu kien Predicate"},{"id":"day10-prac-1-b","text":"Nhan mot Function\u003cT,R\u003e, bien doi tung phan tu sang kieu moi"},{"id":"day10-prac-1-c","text":"Nhan mot Comparator\u003cT\u003e, sap xep lai stream"},{"id":"day10-prac-1-d","text":"Nhan mot Consumer\u003cT\u003e, in ra tung phan tu roi tra ve stream rong"}],"correctChoiceIds":["day10-prac-1-a"],"hint":"Xem lai dinh nghia filter() la intermediate operation loc phan tu.","solution":"day10-prac-1-a","explanation":"filter() la intermediate operation, luon nhan Predicate\u003cT\u003e (dieu kien tra ve boolean) va giu lai nhung phan tu thoa dieu kien do.","rubric":"Chon dung kieu tham so va hanh vi cua filter().","sourceUsage":["day10-src-1"]},{"id":"day10-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Cho `List\u003cInteger\u003e nums = List.of(1, 2, 3, 4, 5, 6);` va `nums.stream().filter(n -\u003e n % 2 == 0 \u0026\u0026 n \u003e 2).collect(Collectors.toList())`. Ket qua tra ve la gi?","choices":[{"id":"day10-prac-2-a","text":"[4, 6]"},{"id":"day10-prac-2-b","text":"[2, 4, 6]"},{"id":"day10-prac-2-c","text":"[1, 3, 5]"},{"id":"day10-prac-2-d","text":"[3, 4, 5, 6]"}],"correctChoiceIds":["day10-prac-2-a"],"hint":"Ap dung ca hai dieu kien \u0026\u0026 cung luc cho tung phan tu.","solution":"day10-prac-2-a","explanation":"Dieu kien ket hop 'n % 2 == 0 \u0026\u0026 n \u003e 2' chi giu lai cac so chan va lon hon 2: trong day [1..6] chi co 4 va 6 thoa ca hai dieu kien.","rubric":"Danh gia dung ket qua loc theo nhieu dieu kien ket hop bang \u0026\u0026.","sourceUsage":["day10-src-2"]},{"id":"day10-prac-3","type":"coding","interaction":"self-check","prompt":"Cho record Employee(String name, String department, double salary). Viet mot method tra ve danh sach ten (String) cac Employee co department la \"IT\" va salary \u003e= 20000000, dung Stream API.","choices":[],"correctChoiceIds":[],"hint":"Ket hop filter() voi dieu kien \u0026\u0026 roi map() sang String ten truoc khi collect.","solution":"List\u003cString\u003e filterItStaff(List\u003cEmployee\u003e employees) {\n    return employees.stream()\n            .filter(e -\u003e e.department().equals(\"IT\") \u0026\u0026 e.salary() \u003e= 20000000)\n            .map(Employee::name)\n            .collect(Collectors.toList());\n}","explanation":"Bai tap ket hop filter() (loc nhieu dieu kien) va map() trong cung mot pipeline.","rubric":"Danh gia dung thu tu filter() truoc map(), dieu kien loc dung, ket qua la danh sach ten (khong con nguyen Employee).","sourceUsage":["day10-src-2"]},{"id":"day10-prac-4","type":"concept","interaction":"self-check","prompt":"Vi sao nen dung Optional\u003cT\u003e lam kieu tra ve thay vi tra ve null truc tiep cho mot method 'tim kiem, co the khong thay'?","choices":[],"correctChoiceIds":[],"hint":"Nghi ve dieu gi xay ra o phia noi goi neu ho quen kiem tra null.","solution":"Tra ve null buoc noi goi phai tu nho kiem tra null, de quen la NullPointerException; Optional\u003cT\u003e lam ro rang trong chu ky phuong thuc rang gia tri co the khong ton tai, buoc noi goi phai xu ly tuong minh (qua isPresent/orElse/map...) thay vi vo tinh bo quen.","explanation":"Optional bien 'kha nang thieu gia tri' thanh mot phan cua kieu du lieu, giam nguy co NullPointerException khong duoc kiem soat.","rubric":"Danh gia hoc vien neu dung ly do ve tinh tuong minh/an toan kieu cua Optional so voi null.","sourceUsage":[]}],"syllabusAssignments":[{"row":19,"text":"Assignment"}],"enhancedExercises":["Viet mot pipeline dung Collectors.groupingBy() de nhom danh sach Employee theo department, sau do tinh luong trung binh tung phong ban bang Collectors.averagingDouble().","So sanh thoi gian chay giua stream() va parallelStream() tren mot danh sach 1 trieu phan tu voi mot phep tinh don gian (vi du cong don) de tu quan sat khi nao parallel that su co loi."],"references":[{"id":"day10-ref-1","type":"external","resourceId":"res-713a3e371ba0","citationId":"day10-src-1","url":"https://www.baeldung.com/java-stream-filter-lambda","label":"Stream Filter \u0026 Lambda","checkStatus":"ok","readStatus":"read","pageTitle":"Java Stream Filter with Lambda Expression | Baeldung","limitation":null},{"id":"day10-ref-2","type":"external","resourceId":"res-55e66ec50cc0","citationId":"day10-src-4","url":"https://www.baeldung.com/java-streams","label":"Java Streams","checkStatus":"ok","readStatus":"read","pageTitle":"Java Streams Series | Baeldung","limitation":null},{"id":"day10-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-11","unitId":"unit-04","group":"java","kind":"theory","title":"Concurrency \u0026 File I/O","summary":"Vong doi Thread (6 trang thai), synchronized/volatile de ngan race condition va dam bao memory visibility, ExecutorService de tach quan ly thread khoi tac vu, NIO.2 Path/Files cho thao tac file, va Serialization de luu/truyen trang thai object - day la bai giau nguon trich dan nhat trong Unit 4 voi ca 9 resourceIds deu da doc duoc.","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Da hoan thanh Day 10 (Lambda \u0026 Stream API Chuyen Sau)."],"outcomes":["Liet ke va giai thich dung 6 trang thai vong doi cua Thread.","Dung synchronized dung cach de ngan race condition, hieu duoc tinh reentrant cua khoa.","Giai thich duoc vai tro cua volatile va happens-before trong memory visibility.","Dung ExecutorService thay vi tu quan ly Thread thu cong.","Thao tac file/thu muc bang java.nio.file.Path/Files va tu cai dat serialization dung cach (serialVersionUID, transient)."],"sections":[{"id":"day11-sec-thread","title":"Thread fundamentals: vong doi Thread","blocks":[{"id":"day11-blk-1","type":"paragraph","text":"java.lang.Thread dinh nghia enum State voi 6 trang thai vong doi: NEW (da tao, chua goi start()), RUNNABLE (dang chay hoac dang cho duoc cap CPU), BLOCKED (dang cho de vao mot synchronized method/block), WAITING (cho vo thoi han hanh dong cua thread khac), TIMED_WAITING (cho co gioi han thoi gian) va TERMINATED (da ket thuc thuc thi).","citations":["day11-src-1"]},{"id":"day11-blk-2","type":"paragraph","text":"Mot thread roi vao BLOCKED khi co vao mot synchronized method/block dang bi thread khac giu khoa monitor. Nguoc lai, WAITING xay ra khi goi object.wait(), thread.join() hoac LockSupport.park() khong kem timeout; TIMED_WAITING xay ra khi cac phuong thuc tuong tu duoc goi kem timeout, vi du Thread.sleep(millis).","citations":["day11-src-2","day11-src-3"]},{"id":"day11-blk-3","type":"code","language":"java","code":"class ThreadLifecycleDemo {\n    static void run() throws Interrup
