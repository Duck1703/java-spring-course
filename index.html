<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Khóa học Java 17 và Spring Boot 3.x theo lộ trình thực hành.">
  <title>Java Spring Boot Course</title>
  <style id="app-styles">
    /* ============================================================
       Design tokens — Java Spring Boot Course
       Palette: cold paper canvas, ink text; Java orange and Spring
       green are semantic group accents only. Code blocks stay dark
       in both themes (the signature reading surface).
       ============================================================ */
    :root {
      --java: #f89820;
      --java-soft: rgba(248, 152, 32, .14);
      --spring: #6db33f;
      --spring-soft: rgba(109, 179, 63, .14);
      --completion: #64748b;
      --completion-soft: rgba(100, 116, 139, .14);
      --ink: #172033;
      --muted: #667085;
      --canvas: #f5f7f8;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --line: #dfe4e8;
      --line-strong: #c6ced6;
      --ok: #15803d;
      --info: #2563eb;
      --danger: #dc2626;
      --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
      --code-head: rgba(127, 127, 127, .09);
      --code-bg: #111827;
      --code-ink: #e5edf7;
      --focus: #2563eb;
      --header-h: 4rem;
      --sidebar-w: 19rem;
      --content-max: 48rem;
      --radius-sm: .5rem;
      --radius-md: .875rem;
      --shadow-float: 0 18px 50px rgb(15 23 42 / .12);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --java-soft: rgba(248, 152, 32, .18);
      --spring-soft: rgba(109, 179, 63, .18);
      --completion-soft: rgba(100, 116, 139, .22);
      --ink: #edf2f7;
      --muted: #a8b3c2;
      --canvas: #0d1117;
      --surface: #121922;
      --surface-raised: #17202b;
      --line: #2a3543;
      --line-strong: #43505f;
      --ok: #4ade80;
      --info: #60a5fa;
      --danger: #f87171;
      --code-head: rgba(127, 127, 127, .14);
      --code-bg: #080c12;
      --code-ink: #e6edf3;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      background: var(--canvas);
      color: var(--ink);
    }
    code, pre, kbd {
      font-family: "Cascadia Code", "Consolas", ui-monospace, monospace;
    }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 200;
      background: var(--surface-raised);
      color: var(--ink);
      padding: .6rem 1rem;
      border-radius: 0 0 var(--radius-sm) 0;
      border: 1px solid var(--line);
    }
    .skip-link:focus { left: 0; }

    /* ============ Header ============ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: .75rem;
      height: var(--header-h);
      padding-inline: 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    /* Brand mark: two stacked blocks — Java orange over Spring green —
       a literal nod to the layered platform stack. */
    .brand-mark {
      width: 1.35rem;
      height: 1.35rem;
      flex-shrink: 0;
    }
    .brand-mark span { display: block; height: 50%; }
    .brand-mark .mark-top { background: var(--java); border-radius: 3px 3px 0 0; }
    .brand-mark .mark-bottom { background: var(--spring); border-radius: 0 0 3px 3px; }
    .header-search { margin-left: auto; position: relative; }
    .header-search label {
      position: absolute;
      left: -9999px;
    }
    .header-search input {
      width: min(16rem, 42vw);
      padding: .45rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--canvas);
      color: var(--ink);
      font: inherit;
      font-size: .875rem;
    }
    #header-progress { display: flex; align-items: center; gap: .5rem; }
    .progress-meter {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress-meter meter {
      width: 6rem;
      height: .5rem;
      accent-color: var(--spring);
    }
    .theme-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
    }

    /* ============ Frame ============ */
    .app-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 120rem;
      margin-inline: auto;
    }

    /* Sidebar / curriculum rail */
    .course-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    #curriculum-nav { padding: .75rem .75rem 2rem; }
    .group-label {
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.25rem .5rem .35rem;
    }
    .module-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      width: 100%;
      padding: .5rem .625rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: .875rem;
      text-align: left;
      cursor: pointer;
    }
    .module-toggle:hover { background: var(--canvas); }
    .module-toggle .chevron { transition: transform .15s ease; }
    .module-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .lesson-list { list-style: none; margin: .15rem 0 .35rem; padding: 0; }
    .lesson-link {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      padding: .35rem .625rem .35rem 1.4rem;
      border-radius: var(--radius-sm);
      color: var(--ink);
      text-decoration: none;
      font-size: .8438rem;
      line-height: 1.4;
    }
    .lesson-link:hover { background: var(--canvas); }
    .lesson-link[aria-current="page"] {
      background: var(--canvas);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent, var(--focus));
    }
    .lesson-state {
      flex-shrink: 0;
      font-size: .75rem;
      line-height: 1;
    }
    .lesson-state[data-done="true"] { color: var(--spring); }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Drawer backdrop */
    .drawer-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgb(15 23 42 / .45);
      z-index: 90;
      border: 0;
      padding: 0;
    }

    main#main-content { outline: none; }
    #route-view { padding-block: 1.5rem 4rem; }

    /* ============ Responsive ============ */
    @media (min-width: 64rem) {
      .menu-button { display: none; }
      .drawer-backdrop { display: none !important; }
      .app-frame { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
      .course-sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100dvh - var(--header-h));
        overflow-y: auto;
      }
      .lesson-shell { padding-inline: clamp(1.5rem, 4vw, 3rem); }
    }
    @media (max-width: 63.999rem) {
      .course-sidebar {
        position: fixed;
        top: var(--header-h);
        bottom: 0;
        left: 0;
        width: min(20rem, 85vw);
        z-index: 95;
        overflow-y: auto;
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--shadow-float);
      }
      body.drawer-open .course-sidebar { transform: translateX(0); }
      body.drawer-open { overflow: hidden; }
      .lesson-shell { padding-inline: clamp(1rem, 4vw, 2rem); }
    }
    /* Desktop never shows drawer state even if body class lingers */
    @media (min-width: 64rem) {
      body.drawer-open { overflow: auto; }
      body.drawer-open .drawer-backdrop { display: none; }
    }
    @media (max-width: 30rem) {
      .progress-meter .progress-text-long { display: none; }
      .header-search input { width: 9rem; }
      .brand .brand-name-long { display: none; }
    }

    pre { max-width: 100%; overflow-x: auto; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .app-header, .course-sidebar, .drawer-backdrop, #toast-region { display: none !important; }
      .app-frame { display: block; }
      .lesson-shell { max-width: none; padding: 0; }
      .ref-url { display: inline !important; }
    }

    /* Toast */
    #toast-region {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: var(--canvas);
      padding: .55rem 1rem;
      border-radius: 999px;
      font-size: .8438rem;
      box-shadow: var(--shadow-float);
    }

    /* Lesson body (Site Task 4) */
    .lesson-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: .375rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: .75rem;
    }
    .lesson-breadcrumb a { color: var(--muted); text-decoration: none; }
    .lesson-breadcrumb a:hover { color: var(--accent, var(--spring)); text-decoration: underline; }
    .lesson-header { margin-bottom: 2rem; }
    .lesson-title {
      font-size: 1.75rem;
      line-height: 1.25;
      margin: 0 0 .625rem;
      letter-spacing: -0.01em;
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .chip {
      display: inline-block;
      padding: .1875rem .5625rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: .75rem;
      color: var(--ink);
      background: var(--surface);
    }
    .lesson-summary {
      border-left: 3px solid var(--accent, var(--spring));
      padding: .75rem 1rem;
      background: var(--surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: .9375rem;
      line-height: 1.65;
      color: var(--muted);
    }
    .lesson-columns { display: grid; gap: 1.5rem; grid-template-columns: 1fr; margin-bottom: 2rem; }
    @media (min-width: 48rem) { .lesson-columns.twocol { grid-template-columns: 1fr 1fr; } }
    .lesson-column h2 {
      font-size: .8125rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .5rem;
    }
    .lesson-column ul { margin: 0; padding-left: 1.125rem; font-size: .875rem; line-height: 1.65; }
    .section-block { margin-bottom: 2.5rem; }
    .section-heading {
      font-size: 1.25rem;
      margin: 0 0 1rem;
      padding-bottom: .375rem;
      border-bottom: 1px solid var(--line);
    }
    .prose > p { margin: 0 0 1rem; line-height: 1.7; }
    .callout {
      border-left: 3px solid var(--muted);
      background: var(--surface);
      padding: .75rem 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 0 0 1rem;
      font-size: .9063rem;
      line-height: 1.65;
    }
    .callout--note { border-left-color: var(--info); }
    .callout--important { border-left-color: var(--java); }
    .callout--warning { border-left-color: var(--danger); }
    .code-sample { margin: 0 0 1rem; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
    .code-sample figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      padding: .4375rem .75rem;
      background: var(--code-head, rgba(127,127,127,.08));
      border-bottom: 1px solid var(--line);
      font-size: .7813rem;
      color: var(--muted);
    }
    .code-sample pre {
      margin: 0;
      padding: .875rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      font-size: .8438rem;
      line-height: 1.55;
      tab-size: 2;
    }
    .copy-btn {
      flex-shrink: 0;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .75rem;
      padding: .1875rem .5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--spring); color: var(--spring); }
    .data-table-wrap { overflow-x: auto; margin: 0 0 1rem; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8438rem; line-height: 1.55; }
    .data-table caption { text-align: left; font-weight: 600; padding: 0 0 .5rem; color: var(--muted); font-size: .8125rem; }
    .data-table th, .data-table td { border: 1px solid var(--line); padding: .4375rem .625rem; text-align: left; vertical-align: top; }
    .data-table th { background: var(--surface); }
    .citation-link {
      font-size: .6875rem;
      vertical-align: super;
      text-decoration: none;
      margin-left: .0625rem;
      color: var(--accent, var(--spring));
      font-family: var(--mono);
    }
    .authoring-warning {
      border: 1px dashed var(--danger);
      color: var(--danger);
      background: transparent;
      padding: .625rem .875rem;
      border-radius: var(--radius-sm);
      font-size: .8438rem;
      margin: 0 0 1rem;
    }
    /* Practice cards */
    .practice-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin: 0 0 1rem;
      overflow: hidden;
    }
    .practice-head { padding: .875rem 1rem .5rem; }
    .practice-kind {
      display: inline-block;
      font-size: .6875rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent, var(--spring));
      font-weight: 700;
      margin-bottom: .375rem;
    }
    .practice-prompt { margin: 0; font-size: .9375rem; line-height: 1.6; font-weight: 500; }
    .practice-body { padding: 0 1rem 1rem; }
    .practice-starter pre {
      margin: 0 0 .75rem;
      padding: .75rem 1rem;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      overflow-x: auto;
    }
    .practice-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .625rem; }
    .disclosure-btn {
      border: 1px solid var(--line-strong);
      background: var(--canvas);
      color: var(--ink);
      font-size: .8125rem;
      padding: .375rem .75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .disclosure-btn[aria-expanded="true"] { background: var(--surface-strong, var(--line)); }
    .disclosure-panel { margin-top: .625rem; font-size: .875rem; line-height: 1.65; }
    .disclosure-panel[hidden] { display: none; }
    .choice-list { list-style: none; margin: 0 0 .625rem; padding: 0; display: grid; gap: .375rem; }
    .choice-item label {
      display: flex;
      gap: .5rem;
      align-items: baseline;
      padding: .4375rem .625rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .875rem;
      line-height: 1.5;
    }
    .choice-item input { accent-color: var(--spring); }
    .choice-item.is-correct label { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
    .choice-item.is-wrong label { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
    .check-feedback { margin: .625rem 0 0; font-size: .875rem; line-height: 1.6; padding: .5625rem .75rem; border-radius: var(--radius-sm); }
    .check-feedback.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid var(--ok); }
    .check-feedback.wrong { background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid var(--danger); }
    /* Assignments */
    .assignments-block { margin: 2.5rem 0; }
    .assignments-block h2 { font-size: 1.125rem; margin: 0 0 .75rem; }
    .assignment-item {
      border: 1px solid var(--line);
      border-left: 3px solid var(--java);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--surface);
      padding: .75rem 1rem;
      margin-bottom: .625rem;
      font-size: .875rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .assignment-origin {
      display: inline-block;
      font-size: .6875rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: .375rem;
    }
    /* References */
    .references-block h2 { font-size: 1.125rem; margin: 0 0 .75rem; }
    .ref-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: .75rem 1rem;
      margin-bottom: .625rem;
      font-size: .875rem;
      scroll-margin-top: 5rem;
    }
    .ref-card-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .25rem; }
    .ref-num { color: var(--accent, var(--spring)); font-weight: 700; font-family: var(--mono); font-size: .8125rem; }
    .ref-card a { color: var(--spring); word-break: break-all; }
    .badge-read {
      display: inline-block;
      font-size: .6875rem;
      padding: .125rem .5rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ok) 15%, transparent);
      color: var(--ok);
      border: 1px solid var(--ok);
      font-weight: 600;
    }
    .badge-domain { font-size: .6875rem; color: var(--muted); }
    .ref-locators { margin: .375rem 0 0; padding-left: 1.125rem; color: var(--muted); font-size: .7813rem; }
    details.ref-unavailable { margin-top: 1rem; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: .625rem .875rem; }
    details.ref-unavailable summary { cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--muted); }
    details.ref-unavailable .ref-card { border-style: dashed; }
    /* Lesson footer nav */
    .lesson-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .625rem;
      align-items: stretch;
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }
    .lesson-nav a, .lesson-nav button {
      font-size: .8438rem;
      padding: .5625rem .75rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
    }
    .lesson-nav a:hover, .lesson-nav button:hover { border-color: var(--spring); }
    .lesson-nav .nav-next { text-align: right; }
    .lesson-nav .nav-complete {
      white-space: nowrap;
      min-width: 7rem;
      text-align: center;
    }
    .lesson-nav .nav-complete[aria-pressed="true"] {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .nav-label { display: block; font-size: .6875rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

    /* Dashboard settings (Site Task 5) */
    .settings-block { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    .settings-block details { margin-bottom: .625rem; }
    .settings-block summary {
      cursor: pointer;
      font-size: .9063rem;
      font-weight: 600;
      color: var(--muted);
    }
    .settings-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 0 0; }
    .settings-btn {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .8125rem;
      padding: .4375rem .8125rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .settings-btn:hover { border-color: var(--spring); color: var(--spring); }
    .settings-btn--danger:hover { border-color: var(--danger); color: var(--danger); }
    .import-preview {
      margin-top: .625rem;
      padding: .625rem .75rem;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      line-height: 1.6;
    }
    .import-preview[hidden] { display: none; }
  </style>
  <script>
    /* Theme bootstrap: runs before first paint to avoid a light/dark flash. */
    (function() {

  <script id="course-data" type="application/json">{"schemaVersion":1,"app":"java-spring-course","builtAt":"2026-08-23T14:52:32.230493+00:00","units":[{"id":"unit-01","number":1,"title":"Java Platform \u0026 Language Basics","group":"java","lessonIds":["day-01","day-02","day-03"]},{"id":"unit-02","number":2,"title":"OOP in Java","group":"java","lessonIds":["day-04","day-05","day-06"]},{"id":"unit-03","number":3,"title":"Interface, Generics, Collections \u0026 Exception","group":"java","lessonIds":["day-07","day-08","day-09"]},{"id":"unit-04","number":4,"title":"Stream API, Concurrency \u0026 File I/O","group":"java","lessonIds":["day-10","day-11","day-12"]},{"id":"unit-05","number":5,"title":"Spring Boot Core \u0026 IoC Container","group":"spring","lessonIds":["day-13","day-14","day-15"]},{"id":"unit-06","number":6,"title":"Spring MVC — In-Depth REST API","group":"spring","lessonIds":["day-16","day-17","day-18"]},{"id":"unit-07","number":7,"title":"Spring Data JPA \u0026 Database","group":"spring","lessonIds":["day-19","day-20","day-21"]},{"id":"unit-08","number":8,"title":"Spring Security \u0026 JPA Performance","group":"spring","lessonIds":["day-22","day-23","day-24"]},{"id":"unit-09","number":9,"title":"Caching, Async, File Handling \u0026 External API","group":"spring","lessonIds":["day-25","day-26","day-27"]},{"id":"unit-10","number":10,"title":"Testing, Documentation, Monitoring \u0026 Docker","group":"spring","lessonIds":["day-28","day-29","day-30"]},{"id":"unit-11","number":11,"title":"Project Planning \u0026 Implementation","group":"spring","lessonIds":["day-31","day-32","day-33"]},{"id":"unit-12","number":12,"title":"Implementation Sprint \u0026 Final Defense","group":"spring","lessonIds":["day-34","day-35","day-36"]},{"id":"unit-13","number":13,"title":"Final test","group":"completion","lessonIds":["day-37","day-38"]},{"id":"unit-14","number":14,"title":"OJT Phase","group":"completion","lessonIds":["day-39-64"]},{"id":"unit-15","number":15,"title":"Evaluation Phase","group":"completion","lessonIds":["day-65-66"]}],"lessons":[{"id":"day-01","unitId":"unit-01","group":"java","kind":"theory","title":"JVM, JRE, JDK \u0026 Data Types","summary":"Bài học nền tảng giải thích kiến trúc JVM, phân biệt JRE/JDK, và đi sâu vào kiểu nguyên thủy/wrapper cùng String Pool — những khái niệm chi phối cách chương trình Java thực sự chạy trong bộ nhớ.","durationMinutes":150.0,"objectives":["LO1"],"prerequisites":["Đã cài JDK 17 và biết biên dịch/chạy chương trình Java từ dòng lệnh (javac, java).","Biết đọc cú pháp Java cơ bản: khai báo biến, phương thức main."],"outcomes":["Giải thích được vai trò của JVM, JRE, JDK và phân biệt rõ ba khái niệm này.","Mô tả được các vùng dữ liệu runtime chính của JVM (method area, heap, stack, pc register) và vai trò của frame trong JVM Stack.","Phân biệt kiểu nguyên thủy và lớp bọc, giải thích autoboxing/unboxing và rủi ro NullPointerException liên quan.","Giải thích String Pool, tính bất biến của String và biết khi nào nên dùng == so với equals()."],"sections":[{"id":"day01-sec-intro","title":"Vì sao phải hiểu JVM trước khi học sâu Java","blocks":[{"id":"day01-blk-1","type":"paragraph","text":"Mọi chương trình Java, dù chạy trên server Spring Boot hay một ứng dụng console đơn giản, đều được thực thi bởi Java Virtual Machine (JVM) chứ không chạy trực tiếp trên hệ điều hành. Hiểu JVM giúp bạn giải thích được vì sao Java 'viết một lần, chạy mọi nơi', vì sao chương trình có thể bị OutOfMemoryError, và vì sao các kiểu dữ liệu trong Java hoạt động theo đúng cách mà chúng hoạt động.","citations":[]},{"id":"day01-blk-2","type":"paragraph","text":"JVM là một máy ảo trừu tượng: nó nạp (load) các lớp đã biên dịch, lưu thông tin lớp vào vùng nhớ riêng, rồi thực thi bytecode do trình biên dịch javac sinh ra. Nói cách khác, mã nguồn .java được biên dịch thành .class (bytecode) trung lập nền tảng, và JVM trên từng hệ điều hành chịu trách nhiệm dịch bytecode đó thành lệnh máy thực sự.","citations":["day01-src-1"]}]},{"id":"day01-sec-runtime-areas","title":"Kiến trúc JVM: các vùng dữ liệu runtime","blocks":[{"id":"day01-blk-3","type":"paragraph","text":"Khi chạy, JVM chia bộ nhớ quản lý thành nhiều vùng dữ liệu runtime khác nhau, mỗi vùng có vòng đời và mục đích riêng: một số vùng dùng chung cho toàn bộ ứng dụng, một số vùng thuộc riêng từng thread.","citations":["day01-src-2","day01-src-3"]},{"id":"day01-blk-4","type":"table","columns":["Vùng nhớ","Phạm vi","Vai trò chính"],"rows":[["Method Area","Toàn JVM (dùng chung)","Lưu thông tin lớp đã nạp, hằng số, constant pool"],["Heap","Toàn JVM (dùng chung)","Cấp phát instance đối tượng và mảng (array)"],["JVM Stack","Theo từng thread","Lưu các frame — mỗi lời gọi phương thức một frame"],["PC Register","Theo từng thread","Lưu địa chỉ lệnh bytecode đang thực thi của thread"],["Native Method Stack","Theo từng thread","Hỗ trợ các phương thức native (mã ngoài JVM)"]],"citations":["day01-src-2","day01-src-3"]},{"id":"day01-blk-5","type":"paragraph","text":"Mỗi lần một phương thức được gọi, JVM tạo một frame mới và đẩy vào JVM Stack của thread gọi. Frame chứa một mảng biến cục bộ (local variables) riêng cho lời gọi đó, và một operand stack kiểu LIFO (vào sau ra trước) dùng để lưu kết quả tạm thời cũng như truyền tham số giữa các lệnh bytecode bên trong phương thức.","citations":["day01-src-4"]},{"id":"day01-blk-6","type":"important","text":"JVM không có lệnh bytecode dành riêng cho kiểu boolean: biểu thức boolean trong mã Java được trình biên dịch dịch thành các lệnh thao tác trên giá trị kiểu int của JVM (true/false biểu diễn tương tự 1/0), ngoại trừ mảng boolean[] có hai lệnh riêng baload/bastore. Đây là lý do một số công cụ phân tích bytecode hiển thị boolean như int.","citations":["day01-src-5"]}]},{"id":"day01-sec-jre-jdk","title":"JRE và JDK khác nhau ra sao","blocks":[{"id":"day01-blk-7","type":"paragraph","text":"JRE (Java Runtime Environment) là bộ phần mềm tối thiểu để chạy một ứng dụng Java: nó gồm một cài đặt JVM cùng các lớp lõi bắt buộc (bootstrap classes, extension classes) và các file cấu hình cần thiết để thực thi chương trình đã biên dịch sẵn.","citations":["day01-src-6"]},{"id":"day01-blk-8","type":"paragraph","text":"JDK (Java Development Kit) bao gồm toàn bộ JRE cộng thêm bộ công cụ phát triển: javac để biên dịch mã nguồn thành bytecode, java để chạy ứng dụng, javadoc để sinh tài liệu từ comment trong code. Muốn viết, biên dịch và debug chương trình Java, bạn cần JDK chứ không chỉ JRE.","citations":["day01-src-7"]},{"id":"day01-blk-9","type":"table","columns":["Thành phần","JRE","JDK"],"rows":[["Cài đặt JVM","Có","Có"],["Lớp lõi (bootstrap/extension classes)","Có","Có"],["Trình biên dịch javac","Không","Có"],["Công cụ sinh tài liệu javadoc","Không","Có"],["Mục đích chính","Chạy ứng dụng đã biên dịch","Viết, biên dịch, debug ứng dụng"]],"citations":["day01-src-6","day01-src-7"]}]},{"id":"day01-sec-types","title":"Kiểu nguyên thủy, lớp bọc (wrapper) và autoboxing/unboxing","blocks":[{"id":"day01-blk-10","type":"paragraph","text":"Java có 8 kiểu nguyên thủy (primitive) và mỗi kiểu có một lớp bọc (wrapper class) tương ứng để dùng khi cần một đối tượng thay vì giá trị thô — ví dụ khi thêm phần tử vào List\u003cInteger\u003e, các Collection trong Java chỉ chấp nhận kiểu tham chiếu (object), không chấp nhận kiểu nguyên thủy.","citations":["day01-src-8"]},{"id":"day01-blk-11","type":"table","columns":["Kiểu nguyên thủy","Lớp bọc (wrapper)"],"rows":[["boolean","Boolean"],["byte","Byte"],["char","Character"],["float","Float"],["int","Integer"],["long","Long"],["short","Short"],["double","Double"]],"citations":["day01-src-10"]},{"id":"day01-blk-12","type":"paragraph","text":"Autoboxing là việc trình biên dịch tự động chuyển một giá trị nguyên thủy (ví dụ int) thành đối tượng lớp bọc tương ứng (Integer) khi ngữ cảnh yêu cầu một đối tượng. Unboxing là chiều ngược lại: chuyển đối tượng lớp bọc về giá trị nguyên thủy khi gán cho biến nguyên thủy hoặc truyền cho tham số kiểu nguyên thủy.","citations":["day01-src-8","day01-src-9"]},{"id":"day01-blk-13","type":"code","language":"java","code":"import java.util.ArrayList;\nimport java.util.List;\n\nclass AutoboxingDemo {\n    public static void main(String[] args) {\n        List\u003cInteger\u003e scores = new ArrayList\u003c\u003e();\n        scores.add(90);          // autoboxing: int -\u003e Integer\n        scores.add(85);\n\n        int first = scores.get(0); // unboxing: Integer -\u003e int\n        System.out.println(\"first = \" + first);\n    }\n}\n","compile":true,"citations":["day01-src-8","day01-src-9"]},{"id":"day01-blk-14","type":"warning","text":"Unboxing một tham chiếu Integer đang null (ví dụ giá trị trả về từ Map.get(key) khi key không tồn tại) sẽ ném NullPointerException ngay tại thời điểm JVM cố gắng lấy ra giá trị int nguyên thủy — vì unboxing thực chất là JVM tự sinh lời gọi intValue() trên đối tượng, gọi phương thức trên tham chiếu null luôn ném lỗi.","citations":["day01-src-9"]}]},{"id":"day01-sec-string","title":"String, String Pool và tính bất biến","blocks":[{"id":"day01-blk-15","type":"paragraph","text":"String trong Java là một đối tượng bất biến (immutable): một khi đã tạo, nội dung ký tự bên trong không thể thay đổi; mọi phương thức trông như 'sửa' chuỗi (ví dụ concat, replace) thực chất trả về một đối tượng String mới.","citations":["day01-src-11"]},{"id":"day01-blk-16","type":"paragraph","text":"Để tiết kiệm bộ nhớ, JVM duy trì một vùng gọi là String Pool: mỗi String literal chỉ được lưu một lần duy nhất trong pool. Khi mã nguồn gán một chuỗi mới bằng literal, JVM tìm trong pool trước — nếu đã tồn tại một chuỗi giống hệt, tham chiếu tới chuỗi có sẵn được tái sử dụng thay vì cấp phát bộ nhớ mới (interning).","citations":["day01-src-12"]},{"id":"day01-blk-17","type":"paragraph","text":"Ngược lại, dùng toán tử new String(\"...\") luôn tạo một đối tượng String mới trên heap, nằm ngoài String Pool — dù nội dung ký tự giống hệt một chuỗi literal đã có, so sánh bằng == giữa hai tham chiếu này vẫn trả về false vì chúng trỏ tới hai vùng nhớ khác nhau.","citations":["day01-src-13"]},{"id":"day01-blk-18","type":"important","text":"Có thể gọi phương thức intern() trên một String được tạo bằng new để đưa nội dung của nó vào String Pool (nếu chưa có) và lấy về tham chiếu dùng chung trong pool; sau intern(), so sánh == với một literal cùng nội dung mới trả về true.","citations":["day01-src-14"]},{"id":"day01-blk-19","type":"note","text":"Trước Java 7, String Pool nằm trong vùng PermGen và không được Garbage Collector dọn dẹp, dễ gây OutOfMemoryError nếu interning quá nhiều chuỗi. Từ Java 7 trở đi, pool được chuyển sang Heap nên các chuỗi interned có thể được GC thu hồi như đối tượng bình thường.","citations":["day01-src-15"]},{"id":"day01-blk-20","type":"code","language":"java","code":"class StringPoolDemo {\n    public static void main(String[] args) {\n        String a = \"hello\";\n        String b = \"hello\";           // lấy lại tham chiếu trong pool\n        String c = new String(\"hello\"); // đối tượng mới trên heap\n\n        System.out.println(a == b);        // true: cùng tham chiếu pool\n        System.out.println(a == c);        // false: khác vùng nhớ\n        System.out.println(a.equals(c));   // true: so sánh nội dung\n        System.out.println(a == c.intern()); // true: c.intern() trả tham chiếu pool\n    }\n}\n","compile":true,"citations":["day01-src-12","day01-src-13","day01-src-14"]}]},{"id":"day01-sec-arrays","title":"Mảng (array) và varargs — cú pháp cần biết","blocks":[{"id":"day01-blk-21","type":"paragraph","text":"Mảng trong Java là một đối tượng có kích thước cố định, lưu các phần tử cùng kiểu liên tiếp trong bộ nhớ, khai báo bằng cặp ngoặc vuông, ví dụ int[] numbers = {1, 2, 3}; hoặc String[] names = new String[5];. Vì mảng cũng là đối tượng nên nó được cấp phát trên Heap giống mọi instance khác, và biến mảng chỉ là một tham chiếu tới vùng nhớ đó.","citations":[]},{"id":"day01-blk-22","type":"paragraph","text":"Varargs (viết tắt của variable arguments) cho phép một phương thức nhận số lượng tham số cùng kiểu không cố định, khai báo bằng dấu ba chấm, ví dụ int sum(int... numbers). Bên trong phương thức, tham số varargs được xử lý như một mảng bình thường (numbers.length, numbers[0]...); một phương thức chỉ được khai báo tối đa một tham số varargs và nó luôn phải là tham số cuối cùng.","citations":[]}]}],"commonMistakes":["So sánh hai chuỗi bằng == thay vì equals(), dẫn tới kết quả sai khi một trong hai chuỗi được tạo bằng new String().","Unbox một Integer đang null (ví dụ lấy từ Map.get() với key không tồn tại) gây NullPointerException ngay tại phép gán.","Cài JRE rồi thắc mắc vì sao máy không có lệnh javac để biên dịch — nhầm lẫn JRE (chạy) với JDK (viết + biên dịch + chạy)."],"practices":[{"id":"day01-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Mỗi lần một phương thức được gọi, JVM tạo một frame mới và đẩy frame đó vào vùng nhớ nào?","choices":[{"id":"day01-prac-1-a","text":"Heap"},{"id":"day01-prac-1-b","text":"JVM Stack của thread đang gọi phương thức"},{"id":"day01-prac-1-c","text":"Method Area"},{"id":"day01-prac-1-d","text":"Native Method Stack"}],"correctChoiceIds":["day01-prac-1-b"],"hint":"Nghĩ tới vòng đời của frame: nó chỉ tồn tại trong lúc phương thức đang chạy và thuộc riêng một thread.","solution":"JVM Stack — mỗi lời gọi phương thức tạo một frame mới, chứa local variables và operand stack riêng, được đẩy vào JVM Stack của đúng thread gọi nó và gỡ ra khi phương thức kết thúc.","explanation":"Đáp án đúng là JVM Stack vì frame gắn liền với một lời gọi phương thức cụ thể và có vòng đời ngắn theo thread. Heap dùng để cấp phát instance/mảng dùng chung toàn JVM, không phải nơi lưu frame. Method Area lưu thông tin lớp đã nạp (constant pool, metadata), không lưu frame runtime. Native Method Stack chỉ phục vụ các phương thức native, không phải phương thức Java thông thường.","rubric":"Chọn đúng JVM Stack và giải thích được vì sao ba lựa chọn còn lại sai.","sourceUsage":["day01-src-2","day01-src-4"]},{"id":"day01-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Cho đoạn code:\nString a = \"java\";\nString b = new String(\"java\");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));\nKết quả in ra lần lượt là gì?","choices":[{"id":"day01-prac-2-a","text":"true rồi true"},{"id":"day01-prac-2-b","text":"false rồi true"},{"id":"day01-prac-2-c","text":"true rồi false"},{"id":"day01-prac-2-d","text":"false rồi false"}],"correctChoiceIds":["day01-prac-2-b"],"hint":"== so sánh tham chiếu (địa chỉ vùng nhớ), equals() so sánh nội dung ký tự.","solution":"false rồi true — a trỏ vào String Pool, b trỏ vào một đối tượng mới trên heap do new String() tạo ra nên == cho false; nhưng nội dung ký tự giống hệt nhau nên equals() cho true.","explanation":"a được gán bằng literal nên nằm trong String Pool. b được tạo bằng new String(\"java\") nên luôn là một đối tượng mới nằm ngoài pool, dù nội dung giống hệt a. Vì vậy == (so sánh tham chiếu) trả về false. equals() so sánh nội dung ký tự từng phần tử, và nội dung của a và b hoàn toàn giống nhau nên trả về true.","rubric":"Chọn đúng false/true và giải thích được sự khác biệt giữa == (tham chiếu) và equals() (nội dung).","sourceUsage":["day01-src-12","day01-src-13"]},{"id":"day01-prac-3","type":"concept","interaction":"self-check","prompt":"Bằng lời của bạn, hãy giải thích cho một người mới học vì sao cài JRE là không đủ để viết và biên dịch chương trình Java, và JDK giải quyết vấn đề đó như thế nào.","choices":[],"correctChoiceIds":[],"hint":"Nhớ lại vai trò của javac trong việc biến .java thành .class.","solution":"JRE chỉ gồm JVM cùng các lớp lõi và cấu hình cần thiết để CHẠY một chương trình .class đã biên dịch sẵn — nó không có javac nên không thể biên dịch mã nguồn .java. JDK bao gồm toàn bộ JRE cộng thêm javac (biên dịch), java (chạy) và javadoc (sinh tài liệu), nên người viết và biên dịch chương trình bắt buộc phải cài JDK.","explanation":"Câu trả lời tốt cần nêu rõ: JRE thiếu javac nên không biên dịch được, và JDK = JRE + bộ công cụ phát triển.","rubric":"Đạt yêu cầu nếu nêu đúng JRE thiếu javac và JDK bao gồm JRE cộng công cụ phát triển; không cần thuộc lòng nguyên văn.","sourceUsage":["day01-src-6","day01-src-7"]},{"id":"day01-prac-4","type":"coding","interaction":"self-check","prompt":"Viết một đoạn Java ngắn minh họa rủi ro NullPointerException khi unbox một Integer đang null (ví dụ lấy từ một Map không có key tương ứng), sau đó giải thích JVM đã thực hiện thao tác gì gây ra lỗi.","choices":[],"correctChoiceIds":[],"hint":"Unboxing tương đương JVM tự sinh một lời gọi phương thức intValue() trên đối tượng wrapper — gọi phương thức trên tham chiếu null luôn ném lỗi.","solution":"import java.util.HashMap;\nimport java.util.Map;\n\npublic class UnboxingNpeDemo {\n    public static void main(String[] args) {\n        Map\u003cString, Integer\u003e ages = new HashMap\u003c\u003e();\n        Integer missing = ages.get(\"khong-ton-tai\"); // trả về null\n        int age = missing; // NullPointerException khi unboxing\n        System.out.println(age);\n    }\n}\nGiải thích: dòng 'int age = missing;' buộc JVM unbox missing thành int, tương đương gọi missing.intValue(); vì missing đang null nên lời gọi phương thức đó ném NullPointerException trước khi phép gán xảy ra.","explanation":"Lời giải mẫu minh họa đúng tình huống Map.get() trả về null rồi unbox trực tiếp; giải thích unboxing = lời gọi intValue() ẩn của trình biên dịch, gọi trên null nên ném NPE.","rubric":"Đạt yêu cầu nếu code biên dịch được, thực sự tạo ra tình huống unbox null, và lời giải thích nêu đúng cơ chế intValue() ẩn gây NPE.","sourceUsage":["day01-src-9"]}],"syllabusAssignments":[{"row":4,"text":"Assignment"}],"enhancedExercises":["Viết đoạn code minh họa sự khác biệt bộ nhớ giữa String tạo bằng literal và bằng new String(): so sánh == trước và sau khi gọi intern().","Dùng jconsole hoặc VisualVM (nếu có sẵn) để quan sát vùng Heap khi chạy một chương trình tạo nhiều đối tượng String bằng new."],"references":[{"id":"day01-ref-1","type":"external","resourceId":"res-99801d0b7043","citationId":"day01-src-1","url":"https://www.baeldung.com/jvm-vs-jre-vs-jdk","label":"JVM vs JRE vs JDK","checkStatus":"ok","readStatus":"read","pageTitle":"Difference Between JVM, JRE, and JDK | Baeldung","limitation":null},{"id":"day01-ref-2","type":"external","resourceId":"res-acff7fd27edc","citationId":"day01-src-2","url":"https://docs.oracle.com/javase/specs/jvms/se17/html/jvms-2.html","label":"JVM Architecture","checkStatus":"ok","readStatus":"read","pageTitle":"Chapter 2. The Structure of the Java Virtual Machine (Java Virtual Machine Specification, SE 17)","limitation":null},{"id":"day01-ref-3","type":"external","resourceId":"res-9d76570d9362","citationId":"day01-src-8","url":"https://docs.oracle.com/javase/tutorial/java/data/autoboxing.html","label":"Autoboxing","checkStatus":"ok","readStatus":"read","pageTitle":"Autoboxing and Unboxing (The Java Tutorials \u003e Learning the Java Language \u003e Numbers and Strings)","limitation":null},{"id":"day01-ref-4","type":"external","resourceId":"res-1cec64c5e683","citationId":"day01-src-12","url":"https://www.baeldung.com/java-string-pool","label":"String \u0026 String Pool","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Java String Pool | Baeldung","limitation":null},{"id":"day01-ref-5","type":"external","resourceId":"res-f7cc3f86702d","citationId":"day01-src-11","url":"https://docs.oracle.com/javase/tutorial/java/data/index.html","label":"Data Types","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Numbers and Strings (The Java Tutorials \u003e Learning the Java Language)","limitation":null}],"unitNumber":1,"unitTitle":"Java Platform \u0026 Language Basics"},{"id":"day-02","unitId":"unit-01","group":"java","kind":"theory","title":"Operators \u0026 Control Flow","summary":"Bài học về toán tử và độ ưu tiên, ba nhóm câu lệnh điều khiển luồng, switch statement/expression/pattern matching theo chuẩn Java 17, vòng lặp for/enhanced-for, và một cái nhìn giới thiệu về Stream.","durationMinutes":150.0,"objectives":["LO1"],"prerequisites":["Đã hoàn thành Day 1 (JVM, kiểu dữ liệu, String Pool).","Biết khai báo biến, viết phương thức main, biên dịch/chạy chương trình Java."],"outcomes":["Đọc và giải thích được thứ tự ưu tiên khi một biểu thức chứa nhiều toán tử.","Phân biệt ba nhóm câu lệnh điều khiển luồng: quyết định, lặp, rẽ nhánh.","Viết đúng switch statement kiểu cũ và switch expression kiểu Java 17, giải thích được fall-through và cách tránh nó.","Dùng pattern matching với instanceof để thay thế ép kiểu thủ công.","Viết vòng lặp for/enhanced-for đúng cú pháp và biết Stream API dùng để làm gì."],"sections":[{"id":"day02-sec-operators","title":"Toán tử và thứ tự ưu tiên","blocks":[{"id":"day02-blk-1","type":"paragraph","text":"Java có nhiều nhóm toán tử: số học, so sánh, logic, gán... Khi một biểu thức chứa nhiều toán tử, JVM/trình biên dịch cần một quy tắc rõ ràng để quyết định toán tử nào được áp dụng trước — đó là độ ưu tiên (precedence).","citations":["day02-src-1"]},{"id":"day02-blk-2","type":"table","columns":["Nhóm toán tử","Ví dụ","Ưu tiên tương đối"],"rows":[["Postfix","expr++, expr--","Cao nhất"],["Unary","++expr, --expr, +expr, -expr, !","Cao"],["Nhân chia, phần dư","*, /, %","Trung bình-cao"],["Cộng trừ","+, -","Trung bình"],["So sánh quan hệ","\u003c, \u003e, \u003c=, \u003e=, instanceof","Trung bình-thấp"],["Logic (AND/OR)","\u0026\u0026, ||","Thấp"],["Gán","=, +=, -=, *=, /=","Thấp nhất"]],"citations":["day02-src-1"]},{"id":"day02-blk-3","type":"paragraph","text":"Hầu hết toán tử hai ngôi (binary) được đánh giá từ trái sang phải; ngoại lệ đáng chú ý là các toán tử gán (=, +=, ...) được đánh giá từ phải sang trái, đó là lý do a = b = c hợp lệ và gán c cho b rồi gán b cho a.","citations":["day02-src-2"]}]},{"id":"day02-sec-control-flow","title":"Ba nhóm câu lệnh điều khiển luồng","blocks":[{"id":"day02-blk-4","type":"paragraph","text":"Java chia các câu lệnh điều khiển luồng thành ba nhóm: nhóm quyết định (if-then, if-then-else, switch) chọn một trong nhiều nhánh thực thi; nhóm lặp (for, while, do-while) lặp lại một khối lệnh; nhóm rẽ nhánh (break, continue, return) thay đổi thứ tự thực thi bình thường.","citations":["day02-src-3"]}]},{"id":"day02-sec-switch","title":"switch: statement, switch expression và pattern matching","blocks":[{"id":"day02-blk-5","type":"paragraph","text":"switch làm việc với các kiểu byte, short, char, int (và lớp bọc tương ứng), kiểu enum và String. Cú pháp switch block có hai dạng: switch rule dùng mũi tên -\u003e (mỗi nhánh dẫn tới một biểu thức, một block, hoặc throw, không fall-through), và switch labeled statement group kiểu cũ dùng dấu hai chấm (:), có fall-through nếu thiếu break.","citations":["day02-src-4","day02-src-7","day02-src-8"]},{"id":"day02-blk-6","type":"code","language":"java","code":"class SwitchClassicDemo {\n    public static void main(String[] args) {\n        int month = 3;\n        String season;\n        switch (month) {\n            case 12:\n            case 1:\n            case 2:\n                season = \"Winter\";\n                break;\n            case 3:\n            case 4:\n            case 5:\n                season = \"Spring\";\n                break;\n            default:\n                season = \"Unknown\";\n        }\n        System.out.println(season); // Spring\n    }\n}\n","compile":true,"citations":["day02-src-4","day02-src-9"]},{"id":"day02-blk-7","type":"warning","text":"Trong switch labeled statement kiểu cũ (dùng dấu hai chấm), nếu quên break, thực thi sẽ 'rơi tiếp' (fall-through) xuống case ngay bên dưới và tiếp tục chạy các lệnh ở đó cho tới khi gặp break hoặc hết block — một nguồn lỗi rất phổ biến với người mới.","citations":["day02-src-5","day02-src-9"]},{"id":"day02-blk-8","type":"code","language":"java","code":"class SwitchExpressionDemo {\n    public static void main(String[] args) {\n        int month = 3;\n        String season = switch (month) {\n            case 12, 1, 2 -\u003e \"Winter\";\n            case 3, 4, 5 -\u003e \"Spring\";\n            default -\u003e {\n                yield \"Unknown\";\n            }\n        };\n        System.out.println(season); // Spring\n    }\n}\n","compile":true,"citations":["day02-src-7"]},{"id":"day02-blk-9","type":"paragraph","text":"Từ Java SE 7, biểu thức switch cũng có thể là một String, so khớp bằng String.equals() với từng nhãn case — ví dụ chuyển tên tháng thành số thứ tự tháng.","citations":["day02-src-6"]},{"id":"day02-blk-10","type":"note","text":"Pattern matching cơ bản: một type pattern kiểm tra một giá trị có phải instance của kiểu chỉ định hay không; nếu khớp, một biến pattern được khởi tạo với giá trị đó để dùng tiếp ngay trong biểu thức, không cần ép kiểu thủ công.","citations":["day02-src-10"]},{"id":"day02-blk-11","type":"code","language":"java","code":"class PatternMatchingDemo {\n    static String describe(Object value) {\n        if (value instanceof String s) {\n            return \"String co do dai \" + s.length();\n        } else if (value instanceof Integer i) {\n            return \"Integer gap doi la \" + (i * 2);\n        }\n        return \"Khong xac dinh\";\n    }\n\n    public static void main(String[] args) {\n        System.out.println(describe(\"java\"));\n        System.out.println(describe(21));\n    }\n}\n","compile":true,"citations":["day02-src-10"]}]},{"id":"day02-sec-loops","title":"Vòng lặp for, enhanced for và giới thiệu Stream","blocks":[{"id":"day02-blk-12","type":"paragraph","text":"Vòng lặp for cơ bản gồm ba phần trong dấu ngoặc đơn: khởi tạo (chạy một lần trước khi lặp), điều kiện dừng (kiểm tra trước mỗi vòng, còn true thì tiếp tục lặp) và biểu thức tăng/giảm (chạy sau mỗi vòng lặp).","citations":["day02-src-11"]},{"id":"day02-blk-13","type":"code","language":"java","code":"class ForLoopDemo {\n    public static void main(String[] args) {\n        int[] numbers = {1, 2, 3, 4, 5};\n        int sum = 0;\n        for (int i = 0; i \u003c numbers.length; i++) {\n            sum += numbers[i];\n        }\n        System.out.println(\"sum(for) = \" + sum);\n\n        int sumEnhanced = 0;\n        for (int n : numbers) {\n            sumEnhanced += n;\n        }\n        System.out.println(\"sum(enhanced for) = \" + sumEnhanced);\n    }\n}\n","compile":true,"citations":["day02-src-11","day02-src-12"]},{"id":"day02-blk-14","type":"paragraph","text":"Dạng for nâng cao (enhanced for / for-each) dùng để duyệt mảng hoặc Collection mà không cần quản lý chỉ số thủ công, được khuyến nghị dùng khi có thể vì code ngắn gọn và ít lỗi off-by-one hơn.","citations":["day02-src-12"]},{"id":"day02-blk-15","type":"paragraph","text":"Java Stream API (gói java.util.stream) cung cấp một cách khai báo (declarative) để xử lý dãy phần tử — ví dụ numbers.stream().filter(n -\u003e n % 2 == 0).sum() thay cho một vòng for thủ công. Ngày 2 chỉ giới thiệu khái niệm để so sánh với vòng lặp truyền thống; Stream API sẽ được học sâu ở các buổi Collections/Streams của Unit sau.","citations":[]}]}],"commonMistakes":["Quên break trong switch labeled statement kiểu cũ, khiến chương trình vô tình chạy xuyên qua các case tiếp theo (fall-through).","Nhầm độ ưu tiên toán tử khi viết biểu thức phức tạp (ví dụ quên ngoặc quanh phép so sánh trước \u0026\u0026/||), dẫn tới kết quả logic sai.","Ép kiểu thủ công (cast) sau khi đã kiểm tra instanceof thay vì dùng pattern variable có sẵn từ instanceof pattern, khiến code dài dòng và dễ ClassCastException nếu điều kiện kiểm tra sai đối tượng."],"practices":[{"id":"day02-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Trong một switch labeled statement kiểu cũ (dùng dấu hai chấm), điều gì xảy ra nếu một nhánh case thiếu lệnh break?","choices":[{"id":"day02-prac-1-a","text":"Chương trình báo lỗi biên dịch"},{"id":"day02-prac-1-b","text":"switch tự động dừng lại như có break"},{"id":"day02-prac-1-c","text":"Thực thi rơi tiếp (fall-through) xuống case kế tiếp cho tới khi gặp break hoặc hết block"},{"id":"day02-prac-1-d","text":"Chỉ default được thực thi"}],"correctChoiceIds":["day02-prac-1-c"],"hint":"Nhớ từ khóa 'fall-through' được nhắc trong bài.","solution":"Thực thi rơi tiếp (fall-through) xuống case kế tiếp cho tới khi gặp break hoặc hết block.","explanation":"Đây là hành vi mặc định của switch labeled statement kiểu cũ: các case chỉ là nhãn (label) đánh dấu điểm bắt đầu, không phải rào chắn — thiếu break thì luồng thực thi tiếp tục chạy xuyên qua các case tiếp theo. Không có lỗi biên dịch, không tự dừng, và không chỉ chạy default.","rubric":"Chọn đúng đáp án fall-through và giải thích được vì sao case chỉ là nhãn chứ không phải rào chắn.","sourceUsage":["day02-src-5","day02-src-9"]},{"id":"day02-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"switch expression sau trả về giá trị gì cho season khi month = 7?\nString season = switch (month) {\n    case 12, 1, 2 -\u003e \"Winter\";\n    case 3, 4, 5 -\u003e \"Spring\";\n    case 6, 7, 8 -\u003e \"Summer\";\n    default -\u003e \"Unknown\";\n};","choices":[{"id":"day02-prac-2-a","text":"\"Spring\""},{"id":"day02-prac-2-b","text":"\"Summer\""},{"id":"day02-prac-2-c","text":"\"Unknown\""},{"id":"day02-prac-2-d","text":"Lỗi biên dịch vì thiếu break"}],"correctChoiceIds":["day02-prac-2-b"],"hint":"Trong switch rule dùng mũi tên -\u003e, mỗi case chỉ khớp đúng danh sách nhãn của nó, không cần break và không fall-through.","solution":"\"Summer\" — case 6, 7, 8 khớp với month = 7.","explanation":"switch rule (mũi tên -\u003e) không có fall-through: mỗi nhánh chỉ thực thi khi giá trị khớp đúng danh sách nhãn của nó, month = 7 khớp case 6, 7, 8 nên trả về \"Summer\". Cú pháp arrow cũng không cần và không dùng break.","rubric":"Chọn đúng \"Summer\" và giải thích được switch rule không fall-through nên không cần break.","sourceUsage":["day02-src-7"]},{"id":"day02-prac-3","type":"concept","interaction":"self-check","prompt":"So sánh ngắn gọn switch statement kiểu cũ (dùng dấu hai chấm) và switch expression mới (dùng mũi tên -\u003e): nêu ít nhất hai điểm khác biệt.","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về fall-through, từ khóa yield, và việc gán trực tiếp kết quả cho một biến.","solution":"(1) switch kiểu cũ có thể fall-through nếu thiếu break, switch rule dùng -\u003e không fall-through. (2) switch expression có thể trả về giá trị trực tiếp để gán cho biến (dùng yield trong block phức tạp), còn switch statement kiểu cũ chỉ thực thi lệnh, không tự trả giá trị.","explanation":"Câu trả lời tốt nêu được ít nhất: khác biệt về fall-through, và khác biệt về khả năng trả giá trị trực tiếp (yield) của switch expression.","rubric":"Đạt yêu cầu nếu nêu đúng ít nhất hai khác biệt thực chất, không chỉ nói 'cú pháp khác nhau' chung chung.","sourceUsage":["day02-src-7","day02-src-9"]},{"id":"day02-prac-4","type":"coding","interaction":"self-check","prompt":"Viết một phương thức Java dùng pattern matching với instanceof (không ép kiểu thủ công bằng cast) để nhận một Object và trả về một String mô tả: nếu là String thì trả về độ dài, nếu là Integer thì trả về giá trị nhân đôi, còn lại trả về \"Khong xac dinh\".","choices":[],"correctChoiceIds":[],"hint":"Cú pháp: if (value instanceof String s) { ... dùng s trực tiếp ... }","solution":"static String describe(Object value) {\n    if (value instanceof String s) {\n        return \"do dai \" + s.length();\n    } else if (value instanceof Integer i) {\n        return \"gap doi \" + (i * 2);\n    }\n    return \"Khong xac dinh\";\n}","explanation":"Lời giải mẫu dùng đúng cú pháp type pattern (instanceof String s) để vừa kiểm tra kiểu vừa khởi tạo biến pattern dùng ngay, không cast thủ công kiểu (String) value.","rubric":"Đạt yêu cầu nếu dùng đúng cú pháp instanceof pattern (không cast thủ công) và xử lý đúng cả ba nhánh String/Integer/khác.","sourceUsage":["day02-src-10"]}],"syllabusAssignments":[],"enhancedExercises":["Viết lại đoạn switch kiểu cũ (dùng dấu hai chấm) ở phần switch sang switch expression dùng mũi tên -\u003e và so sánh độ dài/độ rõ ràng của code.","Viết một vòng for cơ bản và một enhanced for cùng tính tổng một mảng int, đo thử bằng System.nanoTime() để cảm nhận không có khác biệt hiệu năng đáng kể ở quy mô nhỏ."],"references":[{"id":"day02-ref-1","type":"external","resourceId":"res-df903793f0b9","citationId":"day02-src-1","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html","label":"Operators","checkStatus":"ok","readStatus":"read","pageTitle":"Operators (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null},{"id":"day02-ref-2","type":"external","resourceId":"res-82c961b7a92a","citationId":"day02-src-3","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/flow.html","label":"Control Flow","checkStatus":"ok","readStatus":"read","pageTitle":"Control Flow Statements (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null},{"id":"day02-ref-3","type":"external","resourceId":"res-28fe8d3fda30","citationId":"day02-src-4","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/switch.html","label":"Switch Expressions","checkStatus":"ok","readStatus":"read","pageTitle":"The switch Statement (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null},{"id":"day02-ref-4","type":"external","resourceId":"res-284db3d782e6","citationId":"day02-src-7","url":"https://docs.oracle.com/javase/specs/jls/se17/html/jls-14.html","label":"Pattern Matching (JLS)","checkStatus":"ok","readStatus":"read","pageTitle":"Chapter 14. Blocks, Statements, and Patterns (Java Language Specification, SE 17)","limitation":null},{"id":"day02-ref-5","type":"external","resourceId":"res-740a979a150e","citationId":"day02-src-11","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/for.html","label":"For/While Loops","checkStatus":"ok","readStatus":"read","pageTitle":"The for Statement (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null}],"unitNumber":1,"unitTitle":"Java Platform \u0026 Language Basics"},{"id":"day-03","unitId":"unit-01","group":"java","kind":"lab","title":"- Lab 1: Implement `StringCalculator` applying String immutability and primitive optimization","summary":"Lab 1: cài đặt StringCalculator phân tích biểu thức cộng/trừ đơn giản từ một chuỗi, áp dụng trực tiếp tính bất biến của String (Day 1) để chọn cách tích lũy số bằng kiểu nguyên thủy thay vì nối chuỗi trong vòng lặp.","durationMinutes":150.0,"objectives":["LO1"],"prerequisites":["Đã hoàn thành Day 1 (String, String Pool, tính bất biến) và Day 2 (toán tử, độ ưu tiên, vòng lặp for)."],"outcomes":["Implement được một trình phân tích biểu thức cộng/trừ đơn giản từ chuỗi.","Giải thích và áp dụng được lý do tránh nối String trong vòng lặp, dùng biến nguyên thủy để tích lũy giá trị thay thế.","Tự thiết kế và kiểm tra được các test case biên ngoài các ví dụ đã cho."],"sections":[{"id":"day03-sec-brief","title":"Đề bài Lab 1: StringCalculator","blocks":[{"id":"day03-blk-1","type":"deliverable","text":"Yêu cầu đề bài (nguyên văn từ syllabus, xem thêm mục syllabusAssignments của lesson này): implement StringCalculator áp dụng tính bất biến của String và tối ưu bằng kiểu nguyên thủy. Input: một chuỗi chứa biểu thức số học đơn giản (cộng/trừ). Output: kết quả nguyên (integer).","citations":[]},{"id":"day03-blk-2","type":"note","text":"Setup: tạo class StringCalculator với một phương thức public static int calculate(String expression). Viết unit test (JUnit hoặc chương trình main tự kiểm tra) đối chiếu với bảng acceptance examples ở mục dưới trước khi coi bài lab hoàn thành.","citations":[]}]},{"id":"day03-sec-immutability","title":"Vì sao 'primitive optimization' quan trọng khi parse chuỗi","blocks":[{"id":"day03-blk-3","type":"paragraph","text":"String trong Java bất biến: mỗi lần bạn 'nối chuỗi' bằng +, JVM thực chất tạo ra một đối tượng String mới. Nếu StringCalculator dựng dần số bằng cách nối từng ký tự vào một String bên trong vòng lặp, mỗi ký tự đọc được sẽ sinh ra một đối tượng String trung gian mới — lãng phí bộ nhớ và chậm hơn hẳn so với dùng biến int/StringBuilder để tích lũy giá trị.","citations":["day03-src-1","day03-src-2"]},{"id":"day03-blk-4","type":"important","text":"'Primitive optimization' trong đề bài nghĩa là: khi dựng số từ các ký tự chữ số, hãy tích lũy trực tiếp vào một biến int (digit = digit * 10 + (c - '0')) thay vì nối ký tự vào một String rồi Integer.parseInt() ở cuối. Cách này tránh tạo hàng loạt đối tượng String tạm thời không cần thiết trong vòng lặp phân tích chuỗi.","citations":["day03-src-1"]},{"id":"day03-blk-5","type":"paragraph","text":"Phép cộng/trừ trong biểu thức được đánh giá theo đúng độ ưu tiên và thứ tự toán tử của Java: + và - cùng một nhóm ưu tiên và được đánh giá từ trái sang phải, vì vậy thuật toán chỉ cần quét chuỗi một lần từ trái sang phải, gặp dấu nào thì áp dụng dấu đó cho số tiếp theo, không cần xử lý ngoặc hay ưu tiên nhân/chia phức tạp.","citations":["day03-src-3","day03-src-4"]}]},{"id":"day03-sec-design","title":"Thiết kế thuật toán phân tích và mẫu code","blocks":[{"id":"day03-blk-6","type":"paragraph","text":"Thuật toán đề xuất: duyệt qua từng ký tự của chuỗi (một dạng câu lệnh lặp), dùng một biến int currentNumber tích lũy chữ số hiện tại và một biến int sign giữ dấu (+1 hoặc -1) áp dụng cho số sắp hoàn tất; khi gặp ký tự '+' hoặc '-' hoặc hết chuỗi, cộng sign * currentNumber vào tổng rồi reset currentNumber về 0 và cập nhật sign mới.","citations":["day03-src-5"]},{"id":"day03-blk-7","type":"code","language":"java","code":"class StringCalculator {\n\n    public static int calculate(String expression) {\n        if (expression == null || expression.isBlank()) {\n            throw new IllegalArgumentException(\"expression must not be blank\");\n        }\n        String trimmed = expression.replaceAll(\"\\\\s+\", \"\");\n        int total = 0;\n        int currentNumber = 0;\n        int sign = 1;\n\n        for (int i = 0; i \u003c trimmed.length(); i++) {\n            char c = trimmed.charAt(i);\n            if (Character.isDigit(c)) {\n                currentNumber = currentNumber * 10 + (c - '0');\n            } else if (c == '+' || c == '-') {\n                total += sign * currentNumber;\n                currentNumber = 0;\n                sign = (c == '+') ? 1 : -1;\n            } else {\n                throw new IllegalArgumentException(\"unexpected character: \" + c);\n            }\n        }\n        total += sign * currentNumber;\n        return total;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(calculate(\"3+5\"));   // 8\n        System.out.println(calculate(\"10-2+1\")); // 9\n        System.out.println(calculate(\"0-3\"));    // -3\n    }\n}\n","compile":true,"citations":["day03-src-1","day03-src-4"]}]},{"id":"day03-sec-edge-cases","title":"Edge case cần xử lý và acceptance examples","blocks":[{"id":"day03-blk-8","type":"warning","text":"Chuỗi có thể chứa khoảng trắng ('3 + 5'), số có nhiều chữ số ('10-2'), dấu trừ ở đầu biểu thức ('-3+5'), hoặc chuỗi rỗng/null — tất cả phải được xử lý nhất quán vì đánh giá toán tử +/- luôn thực hiện tuần tự từ trái sang phải, không có toán tử nào được ưu tiên đặc biệt bỏ qua.","citations":["day03-src-4"]},{"id":"day03-blk-9","type":"table","columns":["Input","Output mong đợi","Ghi chú"],"rows":[["\"3+5\"","8","Trường hợp cơ bản"],["\"10-2+1\"","9","Nhiều toán tử, số nhiều chữ số"],["\"7\"","7","Không có toán tử nào"],["\"0-3\"","-3","Kết quả âm"],["\"3 + 5 - 2\"","6","Có khoảng trắng xen giữa"],["\"\" hoặc null","ném IllegalArgumentException","Input rỗng/null là lỗi, không phải 0"]],"citations":["day03-src-4"]}]}],"commonMistakes":["Dựng số bằng cách nối ký tự vào một biến String trong vòng lặp (number += c) thay vì tích lũy bằng biến int, làm mất đúng ý 'primitive optimization' của đề bài.","Không xử lý dấu trừ ở đầu biểu thức (ví dụ '-3+5'), khiến sign ban đầu luôn mặc định là dương và cho ra kết quả sai.","Trả về 0 thay vì ném lỗi rõ ràng khi input rỗng hoặc null, khiến lỗi dữ liệu đầu vào bị nuốt âm thầm thay vì được phát hiện sớm."],"practices":[{"id":"day03-prac-1","type":"applied","interaction":"self-check","prompt":"Hoàn thành lab: implement đầy đủ StringCalculator.calculate(String) áp dụng tính bất biến của String và tối ưu bằng kiểu nguyên thủy, đảm bảo pass toàn bộ các dòng trong bảng acceptance examples ở mục Edge case.","choices":[],"correctChoiceIds":[],"hint":"Bắt đầu từ mẫu thiết kế ở phần 'Thiết kế thuật toán phân tích và mẫu code', bổ sung xử lý khoảng trắng và input rỗng/null.","solution":"Lời giải tham khảo là khối code Java trong block day03-blk-7 (StringCalculator.calculate), đã xử lý số nhiều chữ số, dấu +/-, và ném IllegalArgumentException cho input rỗng/null hoặc ký tự không hợp lệ.","explanation":"Lời giải cần: (1) không nối String trong vòng lặp để dựng số — dùng biến int tích lũy; (2) xử lý đúng cả 6 dòng trong bảng acceptance examples; (3) ném lỗi rõ ràng cho input rỗng/null thay vì trả về 0.","rubric":"Đạt yêu cầu nếu code biên dịch, pass toàn bộ acceptance examples, và không dùng String concatenation để tích lũy chữ số trong vòng lặp.","sourceUsage":["day03-src-1","day03-src-4"]},{"id":"day03-prac-2","type":"coding","interaction":"self-check","prompt":"Viết thêm hai test case biên (edge case) ngoài bảng acceptance examples đã cho (ví dụ: biểu thức chỉ toàn số 0, hoặc số rất lớn gần giới hạn int) và nêu expected output cho từng test case.","choices":[],"correctChoiceIds":[],"hint":"Nghĩ tới những input hợp lệ nhưng bất thường: toàn số 0, số lớn, nhiều dấu +/- liên tiếp không hợp lệ.","solution":"Ví dụ: calculate(\"0-0+0\") phải trả về 0; calculate(\"999999999\") (gần Integer.MAX_VALUE) phải trả đúng giá trị đó và không tràn số nếu không cộng thêm; calculate(\"1++2\") nên ném IllegalArgumentException vì hai dấu + liên tiếp không hợp lệ theo thiết kế ở trên.","explanation":"Lời giải mẫu minh họa test case hợp lệ (toàn số 0, số lớn) và ít nhất một test case phải ném lỗi (chuỗi không hợp lệ), cùng expected output rõ ràng cho từng test.","rubric":"Đạt yêu cầu nếu đề xuất được ít nhất 2 test case thực sự khác biệt so với bảng acceptance examples và nêu đúng expected output/hành vi lỗi.","sourceUsage":[]},{"id":"day03-prac-3","type":"concept","interaction":"multiple-choice","prompt":"Vì sao nên tránh nối chuỗi (String +=) để dựng dần một số nguyên trong vòng lặp phân tích chuỗi của StringCalculator?","choices":[{"id":"day03-prac-3-a","text":"Vì cú pháp += không hợp lệ với kiểu String trong Java"},{"id":"day03-prac-3-b","text":"Vì String bất biến nên mỗi lần nối sẽ tạo một đối tượng String mới, lãng phí bộ nhớ/thời gian so với tích lũy bằng biến int"},{"id":"day03-prac-3-c","text":"Vì String Pool sẽ tự động chặn không cho tạo chuỗi mới"},{"id":"day03-prac-3-d","text":"Vì vòng lặp for không cho phép dùng biến String bên trong"}],"correctChoiceIds":["day03-prac-3-b"],"hint":"Liên hệ lại tính bất biến của String đã học ở Day 1/đầu bài lab này.","solution":"Vì String bất biến nên mỗi lần nối sẽ tạo một đối tượng String mới, lãng phí bộ nhớ/thời gian so với tích lũy bằng biến int.","explanation":"String += hợp lệ về cú pháp (đáp án A sai). String Pool chỉ tối ưu việc tái sử dụng literal giống hệt nhau, không 'chặn' việc tạo chuỗi mới (đáp án C sai). Vòng lặp for hoàn toàn cho phép dùng biến String (đáp án D sai). Lý do đúng là String bất biến: mỗi phép nối tạo ra một đối tượng String hoàn toàn mới thay vì sửa đối tượng cũ, nên tích lũy bằng biến int nguyên thủy nhanh và tiết kiệm bộ nhớ hơn hẳn trong một vòng lặp chạy nhiều lần.","rubric":"Chọn đúng đáp án B và giải thích đúng cơ chế bất biến gây lãng phí khi nối chuỗi lặp lại.","sourceUsage":["day03-src-1","day03-src-2"]}],"syllabusAssignments":[{"row":7,"text":"- Lab 1: Implement `StringCalculator` applying String immutability and primitive optimization\n  - Input: a string containing a simple arithmetic expression (addition/subtraction)\n  - Output: integer result"}],"enhancedExercises":["Stretch goal (tùy chọn, không bắt buộc): mở rộng StringCalculator hỗ trợ thêm phép nhân/chia với đúng độ ưu tiên toán tử (nhân/chia trước cộng/trừ) — không thay đổi yêu cầu gốc của đề bài, chỉ là bài tập nâng cao thêm.","Viết bộ unit test JUnit đầy đủ cho bảng acceptance examples thay vì kiểm tra thủ công bằng System.out.println trong main."],"references":[{"id":"day03-ref-1","type":"external","resourceId":"res-1cec64c5e683","citationId":"day03-src-1","url":"https://www.baeldung.com/java-string-pool","label":"String \u0026 String Pool","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Java String Pool | Baeldung","limitation":null},{"id":"day03-ref-2","type":"external","resourceId":"res-df903793f0b9","citationId":"day03-src-4","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html","label":"Operators","checkStatus":"ok","readStatus":"read","pageTitle":"Operators (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null},{"id":"day03-ref-3","type":"external","resourceId":"res-82c961b7a92a","citationId":"day03-src-5","url":"https://docs.oracle.com/javase/tutorial/java/nutsandbolts/flow.html","label":"Control Flow","checkStatus":"ok","readStatus":"read","pageTitle":"Control Flow Statements (The Java Tutorials \u003e Learning the Java Language \u003e Language Basics)","limitation":null},{"id":"day03-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":1,"unitTitle":"Java Platform \u0026 Language Basics"},{"id":"day-04","unitId":"unit-02","group":"java","kind":"theory","title":"Classes, Objects, Encapsulation","summary":"Bài học về cấu trúc class/object, các dạng constructor (mặc định, có tham số, chained qua this()), bốn mức access modifier, cách áp dụng chúng để đạt encapsulation, cùng giới thiệu cú pháp record và super.","durationMinutes":150.0,"objectives":["LO2"],"prerequisites":["Đã hoàn thành Unit 1 (Day 1-3): kiểu dữ liệu, toán tử, điều khiển luồng, và biết viết một class Java đơn giản với phương thức main."],"outcomes":["Mô tả được cấu trúc một class Java: field, method, constructor.","Viết đúng constructor mặc định, constructor có tham số, và chained constructor bằng this().","Áp dụng đúng 4 mức access modifier và giải thích khác biệt giữa quy tắc cho lớp top-level và cho thành viên bên trong lớp.","Thiết kế một class áp dụng encapsulation: field private, constructor xác thực dữ liệu, getter/setter có kiểm soát."],"sections":[{"id":"day04-sec-structure","title":"Cấu trúc một class trong Java","blocks":[{"id":"day04-blk-1","type":"paragraph","text":"Một class Java thường gồm ba nhóm thành viên: field (trạng thái, biến instance/static), method (hành vi), và constructor (cách khởi tạo đối tượng). Một object là một instance cụ thể được tạo ra từ class đó bằng từ khóa new, mỗi object có vùng nhớ field riêng nhưng dùng chung định nghĩa method.","citations":["day04-src-1"]}]},{"id":"day04-sec-constructors","title":"Constructor: mặc định, có tham số, và chained qua this()","blocks":[{"id":"day04-blk-2","type":"paragraph","text":"Nếu một class không khai báo constructor nào, trình biên dịch tự động thêm một constructor không tham số (no-argument constructor) gán giá trị mặc định cho các field (null cho tham chiếu, 0 cho số, false cho boolean).","citations":["day04-src-2"]},{"id":"day04-blk-3","type":"paragraph","text":"Constructor có tham số cho phép khởi tạo trạng thái ban đầu của đối tượng ngay khi tạo, thay vì phải gọi thêm các setter sau khi tạo xong — điều này giúp duy trì tính đóng gói (encapsulation) tốt hơn vì đối tượng không bao giờ tồn tại ở trạng thái 'chưa hợp lệ'.","citations":["day04-src-3"]},{"id":"day04-blk-4","type":"important","text":"Một constructor có thể gọi một constructor khác trong cùng class bằng this(...), gọi là chained constructor; lời gọi this(...) (hoặc super(...) gọi constructor lớp cha) bắt buộc phải là câu lệnh đầu tiên trong thân constructor.","citations":["day04-src-4"]},{"id":"day04-blk-5","type":"code","language":"java","code":"class Book {\n    private final String title;\n    private final String author;\n    private final int totalPages;\n\n    public Book(String title, String author, int totalPages) {\n        this.title = title;\n        this.author = author;\n        this.totalPages = totalPages;\n    }\n\n    // chained constructor: tac gia mac dinh 'Unknown'\n    public Book(String title, int totalPages) {\n        this(title, \"Unknown\", totalPages);\n    }\n\n    public String getTitle() {\n        return title;\n    }\n}\n","compile":true,"citations":["day04-src-3","day04-src-4"]}]},{"id":"day04-sec-access","title":"Access modifier và tính đóng gói (encapsulation)","blocks":[{"id":"day04-blk-6","type":"paragraph","text":"Java có bốn mức truy cập: public (mọi nơi truy cập được), protected (cùng package cộng với lớp con dù khác package), default/package-private — không ghi từ khóa nào (chỉ truy cập được trong cùng package), và private (chỉ trong chính class đó).","citations":["day04-src-5"]},{"id":"day04-blk-7","type":"table","columns":["Modifier","Cùng class","Cùng package","Lớp con khác package","Nơi khác"],"rows":[["public","Có","Có","Có","Có"],["protected","Có","Có","Có","Không"],["default (không ghi)","Có","Có","Không","Không"],["private","Có","Không","Không","Không"]],"citations":["day04-src-5"]},{"id":"day04-blk-8","type":"paragraph","text":"Một lớp top-level chỉ được khai báo public hoặc default; protected và private chỉ áp dụng cho các thành viên bên trong một lớp (field, method, constructor, nested class), không áp dụng cho chính lớp top-level đó.","citations":["day04-src-6"]},{"id":"day04-blk-9","type":"note","text":"JLS khuyến nghị thứ tự chính tắc khi viết modifier: annotation trước, rồi access modifier (public/protected/private), sau đó static/abstract, cuối cùng là final và các từ khóa khác — ví dụ @Override public static final int MAX. Thứ tự này không bắt buộc để biên dịch nhưng là quy ước phong cách nên tuân theo.","citations":["day04-src-7"]},{"id":"day04-blk-10","type":"important","text":"Encapsulation trong thực hành là: khai báo field private để ngăn truy cập trực tiếp từ bên ngoài, rồi cung cấp constructor/getter (và setter có kiểm tra hợp lệ, nếu cần cho phép thay đổi) ở mức public — như class Book ở trên: title/author/totalPages đều private, chỉ có thể đọc qua getter, không có cách nào gán trực tiếp field từ bên ngoài class.","citations":["day04-src-5"]}]},{"id":"day04-sec-records-super","title":"Records và từ khóa super — cú pháp cần biết","blocks":[{"id":"day04-blk-11","type":"paragraph","text":"record là một dạng class đặc biệt (từ Java 16) dùng để khai báo gọn một 'data carrier' bất biến: record Point(int x, int y) {} tự động sinh constructor, các getter (x(), y()), cùng equals()/hashCode()/toString() dựa trên các field khai báo trong phần header, giúp giảm code lặp lại so với viết một class thông thường chỉ để gói dữ liệu.","citations":[]},{"id":"day04-blk-12","type":"paragraph","text":"Từ khóa super dùng để truy cập tường minh thành viên của lớp cha (superclass) từ lớp con: super.tenField hoặc super.tenMethod() gọi đúng phiên bản của lớp cha khi lớp con có thành viên trùng tên; super(...) ở dòng đầu tiên của constructor lớp con gọi constructor tương ứng của lớp cha. Chi tiết về kế thừa và super sẽ được học sâu ở Day 5.","citations":[]}]}],"commonMistakes":["Đặt lời gọi this(...) không phải câu lệnh đầu tiên trong constructor, gây lỗi biên dịch 'call to this must be first statement'.","Khai báo field public trực tiếp thay vì private + getter/setter, phá vỡ encapsulation vì code bên ngoài có thể gán giá trị bất hợp lệ mà không qua kiểm tra nào.","Cố khai báo một lớp top-level là protected hoặc private, dẫn tới lỗi biên dịch vì hai modifier này chỉ hợp lệ cho thành viên bên trong lớp."],"practices":[{"id":"day04-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Trong một constructor, lời gọi this(...) để gọi một constructor khác cùng class phải nằm ở đâu?","choices":[{"id":"day04-prac-1-a","text":"Ở bất kỳ vị trí nào trong thân constructor"},{"id":"day04-prac-1-b","text":"Là câu lệnh đầu tiên trong thân constructor"},{"id":"day04-prac-1-c","text":"Là câu lệnh cuối cùng trong thân constructor"},{"id":"day04-prac-1-d","text":"Chỉ được phép trong constructor không tham số"}],"correctChoiceIds":["day04-prac-1-b"],"hint":"Nhớ quy tắc chained constructor đã nêu trong bài.","solution":"Là câu lệnh đầu tiên trong thân constructor.","explanation":"Java yêu cầu lời gọi this(...) (hoặc super(...)) luôn là câu lệnh đầu tiên trong constructor, để đảm bảo constructor được gọi chỉ chạy đúng một lần khởi tạo trước khi phần thân còn lại của constructor hiện tại thực thi. Đặt ở vị trí khác, ở cuối, hoặc giới hạn chỉ constructor không tham số đều không đúng với quy tắc này.","rubric":"Chọn đúng đáp án B và giải thích được vì sao Java bắt buộc vị trí đó.","sourceUsage":["day04-src-4"]},{"id":"day04-prac-2","type":"concept","interaction":"multiple-choice","prompt":"Một lớp top-level (không phải nested class) trong Java được phép khai báo với access modifier nào?","choices":[{"id":"day04-prac-2-a","text":"public hoặc default (không ghi modifier)"},{"id":"day04-prac-2-b","text":"public, protected, hoặc default"},{"id":"day04-prac-2-c","text":"private hoặc protected"},{"id":"day04-prac-2-d","text":"Bất kỳ trong 4 mức truy cập"}],"correctChoiceIds":["day04-prac-2-a"],"hint":"Phân biệt rõ quy tắc áp dụng cho lớp top-level và quy tắc áp dụng cho thành viên bên trong lớp.","solution":"public hoặc default (không ghi modifier).","explanation":"protected và private chỉ áp dụng cho thành viên bên trong một lớp (field, method, constructor, nested class), không áp dụng cho chính lớp top-level. Vì vậy một lớp top-level chỉ có hai lựa chọn hợp lệ: public (mọi nơi truy cập được) hoặc default/package-private (chỉ cùng package).","rubric":"Chọn đúng đáp án A và giải thích được vì sao protected/private không áp dụng cho lớp top-level.","sourceUsage":["day04-src-6"]},{"id":"day04-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một class Java khác (ví dụ BankAccount với field private balance) áp dụng encapsulation: field private, một constructor xác thực giá trị khởi tạo hợp lệ (ví dụ balance không âm), và chỉ cung cấp getter (không cung cấp setter trực tiếp cho balance).","choices":[],"correctChoiceIds":[],"hint":"Xem lại ví dụ class Book ở phần Access modifier — field private, constructor gán giá trị, getter public trả về giá trị.","solution":"public class BankAccount {\n    private final double balance;\n\n    public BankAccount(double initialBalance) {\n        if (initialBalance \u003c 0) {\n            throw new IllegalArgumentException(\"balance khong duoc am\");\n        }\n        this.balance = initialBalance;\n    }\n\n    public double getBalance() {\n        return balance;\n    }\n}","explanation":"Lời giải mẫu khai báo field private, xác thực dữ liệu ngay trong constructor (ném lỗi nếu không hợp lệ), và chỉ cung cấp getter, không có setter trực tiếp — đúng tinh thần encapsulation.","rubric":"Đạt yêu cầu nếu field là private, constructor có xác thực dữ liệu đầu vào, và không có setter public cho phép gán trực tiếp giá trị không qua kiểm tra.","sourceUsage":["day04-src-5"]}],"syllabusAssignments":[{"row":9,"text":"Assignment"}],"enhancedExercises":["Viết lại class Book ở phần Constructor dưới dạng record (record Book(String title, String author, int totalPages) {}) và so sánh số dòng code cùng hành vi equals()/toString() sinh tự động.","Thêm một constructor chained thứ ba cho BankAccount (constructor không tham số, mặc định balance = 0) và kiểm tra vẫn giữ nguyên tính bất biến."],"references":[{"id":"day04-ref-1","type":"external","resourceId":"res-ae202f300a2b","citationId":"day04-src-1","url":"https://docs.oracle.com/javase/tutorial/java/javaOO/index.html","label":"OOP Concepts","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Classes and Objects (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day04-ref-2","type":"external","resourceId":"res-4f42c781654a","citationId":"day04-src-4","url":"https://www.baeldung.com/java-constructors","label":"Constructors","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide to Constructors in Java | Baeldung","limitation":null},{"id":"day04-ref-3","type":"external","resourceId":"res-563d80135c91","citationId":"day04-src-5","url":"https://www.baeldung.com/java-access-modifiers","label":"Access Modifiers","checkStatus":"ok","readStatus":"read","pageTitle":"Access Modifiers in Java | Baeldung","limitation":null},{"id":"day04-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-05","unitId":"unit-02","group":"java","kind":"theory","title":"Inheritance, Polymorphism \u0026 Abstract","summary":"Bài học về kế thừa lớp bằng extends, this/super khi trùng tên thành viên, phân biệt method overloading (tĩnh) và overriding (động), upcast/downcast an toàn với instanceof, và thiết kế abstract class.","durationMinutes":150.0,"objectives":["LO2"],"prerequisites":["Đã hoàn thành Day 4 (class, object, constructor, access modifier, encapsulation)."],"outcomes":["Viết đúng cú pháp kế thừa lớp bằng extends và gọi constructor lớp cha bằng super(...).","Dùng đúng this/super để phân biệt thành viên bị che (hidden member) giữa lớp con và lớp cha.","Phân biệt method overloading (compile-time) và method overriding (runtime), giải thích được polymorphism tĩnh và động.","Downcast an toàn bằng instanceof, tránh ClassCastException.","Thiết kế được một abstract class với abstract method và code dùng chung."],"sections":[{"id":"day05-sec-inheritance","title":"Kế thừa (Inheritance) với extends","blocks":[{"id":"day05-blk-1","type":"paragraph","text":"Một lớp kế thừa lớp k
