 diện đúng vì sao User.withDefaultPasswordEncoder() không an toàn cho production."],"sections":[{"id":"day22-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day22-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day22-blk-2","type":"note","text":"Bài học mở đầu Unit 8 (bảo mật): xác thực stateless bằng JWT qua Spring Security OAuth2 Resource Server, cấu hình session stateless, và mã hoá mật khẩu an toàn bằng DelegatingPasswordEncoder. Assignment không có đề bài chi tiết riêng (lịch chỉ ghi 'Assignment') - học viên ôn tập và thực hành lại các cấu hình trong bài để chuẩn bị cho Lab 8 (Auth Service) ở Day 24.","citations":[]}]},{"id":"day22-sec-architecture","title":"Kiến trúc xác thực JWT với Spring Security","blocks":[{"id":"day22-blk-3","type":"note","text":"Kiến trúc filter chain tổng quát của Spring Security (thứ tự các filter mặc định, SecurityContextHolder) không có resource nào trong resourceIds của Day 22 mô tả trực tiếp (xem authoring.limitations) - phần dưới đây tập trung vào phần kiến trúc có nguồn: xác thực JWT qua cơ chế OAuth2 Resource Server.","citations":[]},{"id":"day22-blk-4","type":"paragraph","text":"Khi cấu hình oauth2ResourceServer().jwt() với một issuer-uri, Spring Security tự động suy ra địa chỉ JWK Set endpoint của authorization server (theo chuẩn OpenID Connect Discovery) và tải bộ khoá công khai ngay khi ứng dụng khởi động - đây là quy trình 'startup expectations'. Nếu authorization server không sẵn sàng lúc khởi động, Spring Security vẫn cho phép ứng dụng khởi động thành công nhưng sẽ thử tải lại JWK Set khi có request đầu tiên cần xác thực.","citations":["day22-src-1","day22-src-2"]},{"id":"day22-blk-5","type":"paragraph","text":"Ở thời điểm runtime, với mỗi request mang Bearer token, JwtAuthenticationProvider chịu trách nhiệm giải mã và xác thực chữ ký JWT bằng khoá công khai đã tải, kiểm tra các claim bắt buộc (như exp - thời điểm hết hạn, iss - issuer), rồi tạo ra một đối tượng Authentication đã xác thực để lưu vào SecurityContext cho phần còn lại của request xử lý.","citations":["day22-src-3","day22-src-4"]},{"id":"day22-blk-6","type":"warning","text":"Không bao giờ tự viết logic 'giải mã JWT' thủ công mà bỏ qua bước xác thực chữ ký (signature verification) - một JWT chỉ đáng tin khi chữ ký được xác minh khớp với khoá công khai của authorization server và các claim bắt buộc (đặc biệt exp) được kiểm tra còn hiệu lực. Luôn để JwtAuthenticationProvider (hoặc cơ chế tương đương của Spring Security) đảm nhiệm việc xác thực này thay vì parse JWT bằng tay rồi tin tưởng payload mà không kiểm tra chữ ký.","citations":["day22-src-3","day22-src-4"]}]},{"id":"day22-sec-stateless","title":"Stateless Session","blocks":[{"id":"day22-blk-7","type":"paragraph","text":"Với xác thực dựa trên JWT, mỗi request tự chứa đủ thông tin xác thực trong token nên không cần Spring Security tạo hoặc duy trì HttpSession phía server - cấu hình sessionCreationPolicy(SessionCreationPolicy.STATELESS) tắt hoàn toàn việc tạo mới session cho request, giúp ứng dụng dễ scale ngang (không cần sticky session hay session replication giữa các instance).","citations":["day22-src-9"]},{"id":"day22-blk-8","type":"code","language":"java","code":"import org.springframework.context.annotation.Bean;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\nimport org.springframework.security.config.http.SessionCreationPolicy;\nimport org.springframework.security.web.SecurityFilterChain;\n\nclass SecurityConfig {\n\n    @Bean\n    SecurityFilterChain filterChain(HttpSecurity http) throws Exception {\n        return http\n            .sessionManagement(session -\u003e session\n                .sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n            .oauth2ResourceServer(oauth2 -\u003e oauth2.jwt(jwt -\u003e {}))\n            .build();\n    }\n}\n","compile":false,"citations":["day22-src-9"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day22-blk-9","type":"note","text":"Từ Spring Security 6, requireExplicitSave mặc định là true - SecurityContext chỉ được lưu vào session (nếu có) khi có yêu cầu tường minh, thay vì tự động lưu như các phiên bản trước; điều này phù hợp tự nhiên với kiến trúc stateless vì không có session nào để lưu vào. Bảo vệ session fixation (đổi session ID sau khi đăng nhập thành công) vẫn là kiến thức nền tảng quan trọng cho các phần của hệ thống còn dùng session truyền thống (ví dụ trang quản trị dùng cookie), dù không áp dụng trực tiếp cho luồng API stateless bằng JWT.","citations":["day22-src-10","day22-src-11"]}]},{"id":"day22-sec-password","title":"Mã hoá mật khẩu với DelegatingPasswordEncoder","blocks":[{"id":"day22-blk-10","type":"paragraph","text":"Cách lưu mật khẩu đã tiến hoá qua nhiều giai đoạn: từ lưu plaintext (không an toàn), sang hash một chiều đơn giản như MD5/SHA (dễ bị tấn công bằng rainbow table), tới các thuật toán hash chuyên biệt cho mật khẩu có salt và chi phí tính toán cao như BCrypt, PBKDF2, SCrypt, Argon2 - các thuật toán này cố tình làm chậm quá trình hash để tăng chi phí tấn công brute-force.","citations":["day22-src-5"]},{"id":"day22-blk-11","type":"paragraph","text":"DelegatingPasswordEncoder là PasswordEncoder mặc định của Spring Security (tạo qua PasswordEncoderFactories.createDelegatingPasswordEncoder()): mật khẩu được lưu theo định dạng {id}encodedPassword, trong đó {id} là tiền tố xác định thuật toán đã dùng (ví dụ {bcrypt}). Khi kiểm tra đăng nhập, DelegatingPasswordEncoder đọc tiền tố này để chọn đúng encoder tương ứng xác minh mật khẩu - cho phép hệ thống hỗ trợ nhiều định dạng hash cùng lúc (ví dụ khi nâng cấp thuật toán mà không cần migrate toàn bộ dữ liệu ngay lập tức).","citations":["day22-src-6","day22-src-7"]},{"id":"day22-blk-12","type":"important","text":"User.withDefaultPasswordEncoder() chỉ được tài liệu Spring Security giới thiệu cho mục đích 'getting started' (thử nghiệm nhanh, demo) - KHÔNG được dùng trong môi trường production vì mật khẩu mẫu được hash bằng một khoá cố định công khai trong mã nguồn Spring Security, hoàn toàn không an toàn khi dùng cho tài khoản thật. Trong production, luôn dùng PasswordEncoderFactories.createDelegatingPasswordEncoder() (hoặc BCryptPasswordEncoder tường minh) và không bao giờ dùng NoOpPasswordEncoder.","citations":["day22-src-8"]},{"id":"day22-blk-13","type":"code","language":"java","code":"import org.springframework.security.crypto.factory.PasswordEncoderFactories;\nimport org.springframework.security.crypto.password.PasswordEncoder;\n\nclass PasswordConfig {\n\n    PasswordEncoder passwordEncoder() {\n        return PasswordEncoderFactories.createDelegatingPasswordEncoder();\n    }\n\n    void registerExample(PasswordEncoder encoder) {\n        String stored = encoder.encode(\"my-plain-password\");\n        // stored co dang \"{bcrypt}$2a$10$...\" - tien to {id} xac dinh\n        // encoder nao da dung, DelegatingPasswordEncoder tu chon lai\n        // dung encoder khi kiem tra matches().\n    }\n}\n","compile":false,"citations":["day22-src-6","day22-src-7"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]}],"commonMistakes":["Tự viết logic giải mã JWT thủ công mà bỏ qua bước xác thực chữ ký hoặc kiểm tra claim exp.","Dùng User.withDefaultPasswordEncoder() hoặc NoOpPasswordEncoder trong môi trường production.","Bật session thông thường (không STATELESS) cho một API chỉ dùng JWT, gây tốn tài nguyên và khó scale ngang không cần thiết."],"practices":[{"id":"day22-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao xác thực bằng JWT thường kết hợp với SessionCreationPolicy.STATELESS?","choices":[{"id":"day22-prac-1-a","text":"Vì mỗi JWT đã tự chứa đủ thông tin xác thực, không cần server tạo/duy trì HttpSession, giúp dễ scale ngang"},{"id":"day22-prac-1-b","text":"Vì JWT bắt buộc phải dùng chung với HttpSession để lưu chữ ký"},{"id":"day22-prac-1-c","text":"Vì STATELESS làm JWT không cần xác thực chữ ký nữa"},{"id":"day22-prac-1-d","text":"Vì STATELESS chỉ áp dụng được khi không dùng Spring Security"}],"correctChoiceIds":["day22-prac-1-a"],"hint":"Xem lại phần Stateless Session trong bài.","solution":"day22-prac-1-a","explanation":"JWT tự chứa đủ thông tin xác thực trong token nên không cần server tạo/duy trì session; SessionCreationPolicy.STATELESS tắt việc tạo session, giúp ứng dụng dễ scale ngang mà không cần sticky session.","rubric":"Chọn đúng lý do kỹ thuật (JWT tự chứa thông tin) thay vì nhầm lẫn về vai trò của session.","sourceUsage":["day22-src-9"]},{"id":"day22-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một @Bean SecurityFilterChain cấu hình sessionCreationPolicy STATELESS và bật oauth2ResourceServer().jwt() với cấu hình mặc định.","choices":[],"correctChoiceIds":[],"hint":"Kết hợp sessionManagement(...) và oauth2ResourceServer(...) trên cùng builder HttpSecurity.","solution":"@Bean\nSecurityFilterChain filterChain(HttpSecurity http) throws Exception {\n    return http\n        .sessionManagement(s -\u003e s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n        .oauth2ResourceServer(oauth2 -\u003e oauth2.jwt(jwt -\u003e {}))\n        .build();\n}","explanation":"Áp dụng lại mẫu cấu hình stateless + JWT resource server đã học trong bài.","rubric":"Đánh giá đúng: sessionCreationPolicy là STATELESS, oauth2ResourceServer bật jwt().","sourceUsage":["day22-src-9","day22-src-3"]},{"id":"day22-prac-3","type":"concept","interaction":"self-check","prompt":"Định dạng {id}encodedPassword của DelegatingPasswordEncoder giải quyết vấn đề gì khi hệ thống cần nâng cấp thuật toán hash mật khẩu?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc hệ thống có thể có mật khẩu cũ được hash bằng thuật toán khác mật khẩu mới.","solution":"Tiền tố {id} cho biết mật khẩu được hash bằng thuật toán nào (ví dụ {bcrypt}); khi kiểm tra đăng nhập, DelegatingPasswordEncoder đọc tiền tố này để chọn đúng encoder xác minh, nên hệ thống có thể hỗ trợ nhiều định dạng hash song song - mật khẩu cũ vẫn xác thực được bằng encoder cũ, còn mật khẩu mới dùng encoder mới, không cần migrate toàn bộ dữ liệu ngay lập tức.","explanation":"Liên hệ tới khả năng cùng tồn tại nhiều định dạng hash trong cùng hệ thống.","rubric":"Đánh giá học viên nêu đúng cơ chế tiền tố {id} cho phép hỗ trợ song song nhiều thuật toán hash.","sourceUsage":["day22-src-6","day22-src-7"]},{"id":"day22-prac-4","type":"concept","interaction":"multiple-choice","prompt":"Vì sao User.withDefaultPasswordEncoder() không được dùng trong production?","choices":[{"id":"day22-prac-4-a","text":"Vì mật khẩu mẫu được hash bằng một khoá cố định công khai trong mã nguồn Spring Security, không an toàn cho tài khoản thật"},{"id":"day22-prac-4-b","text":"Vì phương thức này đã bị xoá khỏi Spring Security 6"},{"id":"day22-prac-4-c","text":"Vì phương thức này chỉ hoạt động với database, không hoạt động với in-memory user"},{"id":"day22-prac-4-d","text":"Vì phương thức này không tương thích với DelegatingPasswordEncoder"}],"correctChoiceIds":["day22-prac-4-a"],"hint":"Xem lại khối important về User.withDefaultPasswordEncoder() trong bài.","solution":"day22-prac-4-a","explanation":"Tài liệu Spring Security xác nhận User.withDefaultPasswordEncoder() chỉ dành cho mục đích getting-started/demo; mật khẩu mẫu được hash bằng khoá cố định công khai trong mã nguồn, hoàn toàn không an toàn để dùng cho tài khoản thật trong production.","rubric":"Chọn đúng lý do bảo mật (khoá cố định công khai) thay vì các lý do kỹ thuật không chính xác.","sourceUsage":["day22-src-8"]}],"syllabusAssignments":[{"row":39,"text":"Assignment"}],"enhancedExercises":["Viết một filter tuỳ chỉnh kiểm tra thêm claim 'roles' trong JWT trước khi cho phép truy cập endpoint /admin/**.","Thử đăng ký một mật khẩu bằng BCryptPasswordEncoder tường minh, in ra chuỗi kết quả, và so sánh tiền tố {id} với kết quả từ DelegatingPasswordEncoder mặc định."],"references":[{"id":"day22-ref-1","type":"external","resourceId":"res-65703b737426","citationId":"day22-src-3","url":"https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html","label":"JWT with Spring Security","checkStatus":"ok","readStatus":"read","pageTitle":"OAuth 2.0 Resource Server JWT :: Spring Security","limitation":null},{"id":"day22-ref-2","type":"external","resourceId":"res-d5aebfb9d1ed","citationId":"day22-src-6","url":"https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html","label":"Password Storage","checkStatus":"ok","readStatus":"read","pageTitle":"Password Storage :: Spring Security","limitation":null},{"id":"day22-ref-3","type":"external","resourceId":"res-f301a3d0645a","citationId":"day22-src-9","url":"https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html","label":"Stateless Session","checkStatus":"ok","readStatus":"read","pageTitle":"Session Management :: Spring Security","limitation":null},{"id":"day22-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":8,"unitTitle":"Spring Security \u0026 JPA Performance"},{"id":"day-23","unitId":"unit-08","group":"spring","kind":"theory","title":"Authorization \u0026 JPA Performance","summary":"Method Security (@EnableMethodSecurity, @PreAuthorize/@PostAuthorize/@PreFilter/@PostFilter, hạn chế self-invocation, test bằng @WithMockUser); CORS/CSRF và quyết định bật/tắt CSRF phụ thuộc cơ chế xác thực; và vấn đề hiệu năng N+1 - vì sao cả FetchType.EAGER lẫn LAZY đều không tự động tránh được.","durationMinutes":150.0,"objectives":["LO8"],"prerequisites":["Đã hoàn thành Day 22 (Authentication with Spring Security + JWT) - bài này xây tiếp authorization trên nền xác thực JWT đã cấu hình, và Day 19-20 (entity/fetch/relationship) để hiểu vấn đề N+1."],"outcomes":["Cấu hình đúng @PreAuthorize/@PostAuthorize/@PreFilter/@PostFilter và biết hạn chế self-invocation.","Quyết định đúng khi nào cần/không cần bật CSRF dựa trên cơ chế xác thực đang dùng.","Giải thích đúng vì sao FetchType không tự tránh được N+1 và nhận diện N+1 trong code."],"sections":[{"id":"day23-sec-brief","title":"Phạm vi buổi Guides/Review","blocks":[{"id":"day23-blk-1","type":"note","text":"Ngày học không có Assignment riêng (lịch chỉ ghi 'Guides/Review') - buổi ôn tập tổng hợp Method Security (@PreAuthorize/@PostAuthorize/@PreFilter/@PostFilter), CORS/CSRF, và vấn đề hiệu năng N+1 - cả ba mảng kiến thức sẽ được áp dụng trực tiếp vào Lab 8 (Auth Service + Performance Optimization) ở Day 24.","citations":[]}]},{"id":"day23-sec-method-security","title":"Method Security: @PreAuthorize, @PostAuthorize, @PreFilter, @PostFilter","blocks":[{"id":"day23-blk-2","type":"paragraph","text":"Method Security cho phép kiểm soát truy cập ở mức method thay vì chỉ ở mức URL; phải bật tường minh bằng @EnableMethodSecurity trên một class cấu hình trước khi các annotation bảo mật trên method có hiệu lực. @PreAuthorize đánh giá biểu thức SpEL (ví dụ \"hasRole('ADMIN')\") trước khi method được gọi, chặn hoàn toàn lời gọi nếu điều kiện không thoả; @PostAuthorize đánh giá sau khi method đã chạy xong, dựa trên cả kết quả trả về (biến 'returnObject') - phù hợp khi quyền truy cập phụ thuộc vào chính dữ liệu vừa được nạp.","citations":["day23-src-1","day23-src-2"]},{"id":"day23-blk-3","type":"paragraph","text":"@PreFilter lọc bớt phần tử khỏi một collection tham số trước khi method thực thi (dựa trên biểu thức SpEL với biến 'filterObject' đại diện từng phần tử); @PostFilter lọc bớt phần tử khỏi collection kết quả trả về sau khi method chạy xong. Cả hai đều hữu ích khi quyền truy cập áp dụng ở mức từng phần tử trong danh sách, thay vì chặn/cho phép toàn bộ lời gọi method.","citations":["day23-src-3"]},{"id":"day23-blk-4","type":"code","language":"java","code":"import org.springframework.security.access.prepost.PreAuthorize;\nimport org.springframework.security.access.prepost.PreFilter;\n\nclass ProductAdminService {\n\n    @PreAuthorize(\"hasRole('ADMIN')\")\n    void deleteProduct(Long productId) {\n        // chi ADMIN moi goi duoc method nay tu ben ngoai bean\n    }\n\n    @PreFilter(\"filterObject.ownerId == authentication.name\")\n    void bulkUpdate(java.util.List\u003cOrderEntity\u003e orders) {\n        // orders bi loc truoc, chi giu phan tu ma\n        // filterObject.ownerId khop voi nguoi dang dang nhap\n    }\n}\n","compile":false,"citations":["day23-src-2","day23-src-3"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day23-blk-5","type":"warning","text":"Method Security dựa trên cơ chế AOP proxy của Spring - annotation bảo mật chỉ có hiệu lực khi method được gọi từ BÊN NGOÀI bean (qua proxy), không có hiệu lực khi một method trong cùng class tự gọi method khác của chính nó (self-invocation) vì lời gọi nội bộ bỏ qua proxy hoàn toàn. Không nên giả định @PreAuthorize luôn được kiểm tra - cần thiết kế lại (ví dụ tách logic ra bean riêng) nếu có self-invocation cần bảo vệ.","citations":["day23-src-4"]},{"id":"day23-blk-6","type":"note","text":"Có thể kiểm thử method security bằng annotation @WithMockUser trên test method (khai báo username/roles giả lập) kết hợp Spring Security Test, cho phép xác minh @PreAuthorize/@PostAuthorize chặn hoặc cho phép đúng theo vai trò mà không cần dựng toàn bộ luồng xác thực JWT thật trong test.","citations":["day23-src-5"]}]},{"id":"day23-sec-cors-csrf","title":"CORS và CSRF","blocks":[{"id":"day23-blk-7","type":"note","text":"Cấu hình CORS (Cross-Origin Resource Sharing) qua CorsConfigurationSource để cho phép front-end ở domain khác gọi API không có resource nào trong resourceIds của Day 23 mô tả trực tiếp (xem authoring.limitations) - trình bày bằng kiến thức chuẩn của Spring: khai báo allowedOrigins/allowedMethods/allowedHeaders trong một @Bean CorsConfigurationSource, rồi bật http.cors() trong SecurityFilterChain.","citations":[]},{"id":"day23-blk-8","type":"paragraph","text":"CSRF (Cross-Site Request Forgery) là tấn công lừa trình duyệt của nạn nhân (đã đăng nhập, còn cookie session hợp lệ) gửi một request không mong muốn tới ứng dụng - có thể qua form ẩn tự submit (POST) hoặc qua request GET có side-effect (ví dụ link GET /transfer?amount=1000 nhúng trong ảnh). Spring Security bật bảo vệ CSRF theo mặc định từ phiên bản 4.x cho các request có side-effect (POST/PUT/DELETE), yêu cầu một CSRF token hợp lệ kèm theo request.","citations":["day23-src-6","day23-src-7"]},{"id":"day23-blk-9","type":"warning","text":"Việc có cần bật CSRF hay không phụ thuộc vào cơ chế xác thực: CSRF là rủi ro khi trình duyệt tự động đính kèm thông tin xác thực (cookie session) vào mọi request tới domain đó, kể cả request do trang khác khởi tạo. Với API stateless xác thực bằng Bearer token (JWT gửi qua header Authorization, không dùng cookie), trình duyệt KHÔNG tự đính kèm token này nên CSRF không còn là vector tấn công khả thi - lúc đó tắt CSRF (http.csrf().disable()) là hợp lý. Ngược lại, nếu ứng dụng còn dùng cookie/session ở bất kỳ phần nào (kể cả một endpoint quản trị dùng session truyền thống), tắt CSRF cho toàn bộ ứng dụng chỉ vì API chính dùng JWT là một quyết định KHÔNG an toàn - đây là quyết định phụ thuộc ngữ cảnh xác thực thực tế, không phải một mẹo 'tắt CSRF cho gọn' áp dụng chung cho mọi API.","citations":["day23-src-8"]},{"id":"day23-blk-10","type":"note","text":"Với ứng dụng vẫn cần CSRF, CsrfFilter kết hợp với CsrfTokenRequestHandler để sinh và xác minh token; CsrfTokenRepository chịu trách nhiệm lưu trữ token (mặc định trong HttpSession, có thể đổi sang CookieCsrfTokenRepository). Để chống lại tấn công BREACH (suy luận token qua độ dài response khi nén), Spring Security khuyến nghị dùng XorCsrfTokenRequestAttributeHandler - XOR token thật với một giá trị ngẫu nhiên trước khi đưa vào response, khiến độ dài token quan sát được không còn tương quan trực tiếp với giá trị token thật.","citations":["day23-src-9","day23-src-10","day23-src-11"]}]},{"id":"day23-sec-n1","title":"Vấn đề hiệu năng N+1","blocks":[{"id":"day23-blk-11","type":"paragraph","text":"Vấn đề N+1 xảy ra khi code thực thi 1 câu truy vấn để lấy N bản ghi, rồi thực thi thêm N câu truy vấn riêng lẻ (một cho mỗi bản ghi) để lấy dữ liệu liên kết - tổng cộng N+1 câu truy vấn thay vì có thể gộp lại chỉ còn 1-2 câu. Đây là một trong những nguyên nhân phổ biến nhất gây chậm hiệu năng ứng dụng dùng ORM khi làm việc với danh sách lớn.","citations":["day23-src-12"]},{"id":"day23-blk-12","type":"table","columns":["FetchType","Có tự tránh N+1 không?"],"rows":[["EAGER","Không - vẫn có thể gây N+1 nếu Hibernate chọn chiến lược nạp riêng lẻ (select) cho từng bản ghi thay vì join"],["LAZY","Không - chỉ trì hoãn thời điểm nạp, nếu code truy cập field lazy trong vòng lặp thì vẫn phát sinh N truy vấn riêng lẻ"]],"citations":["day23-src-13","day23-src-14"]},{"id":"day23-blk-13","type":"code","language":"java","code":"import jakarta.persistence.*;\nimport java.util.List;\n\nclass N1ProblemDemo {\n\n    // Neu category la @ManyToOne(fetch = FetchType.LAZY), vong lap\n    // duoi day van gay N+1: 1 query lay danh sach Product, roi\n    // them 1 query rieng cho moi lan p.getCategory().getName() duoc\n    // goi lan dau (proxy lazy tu tai du lieu ngay khi truy cap).\n    void printCategoryNamesNaively(List\u003cProductEntity\u003e products) {\n        for (ProductEntity p : products) {\n            System.out.println(p.getCategory().getName());\n        }\n    }\n}\n","compile":false,"citations":["day23-src-13","day23-src-14"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day23-blk-14","type":"note","text":"Cả FetchType.EAGER lẫn FetchType.LAZY đều KHÔNG tự động giải quyết N+1 - FetchType chỉ quyết định thời điểm nạp (ngay lập tức hay trì hoãn), không quyết định chiến lược nạp (join một lần hay truy vấn riêng lẻ nhiều lần). Cách khắc phục thực sự (JOIN FETCH, @EntityGraph, batch fetching) sẽ được trình bày ở Day 24 khi áp dụng trực tiếp vào việc sửa N+1 cho API danh sách sản phẩm trong Lab 8.","citations":[]}]}],"commonMistakes":["Giả định @PreAuthorize luôn được kiểm tra kể cả khi method tự gọi method khác trong cùng class (self-invocation bỏ qua AOP proxy).","Tắt CSRF cho toàn bộ ứng dụng chỉ vì API chính dùng JWT, trong khi vẫn còn phần dùng session/cookie.","Cho rằng đổi FetchType từ EAGER sang LAZY là đã giải quyết xong N+1, mà không kiểm tra cách field lazy được truy cập trong vòng lặp."],"practices":[{"id":"day23-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Khác biệt chính giữa @PreAuthorize và @PostAuthorize là gì?","choices":[{"id":"day23-prac-1-a","text":"@PreAuthorize đánh giá trước khi method chạy (chặn hoàn toàn nếu không thoả); @PostAuthorize đánh giá sau khi method chạy, có thể dựa vào kết quả trả về"},{"id":"day23-prac-1-b","text":"@PreAuthorize chỉ dùng cho method void, @PostAuthorize chỉ dùng cho method có giá trị trả về"},{"id":"day23-prac-1-c","text":"Hai annotation này hoàn toàn tương đương, chỉ khác tên gọi"},{"id":"day23-prac-1-d","text":"@PostAuthorize chạy trước @PreAuthorize theo thứ tự bảng chữ cái"}],"correctChoiceIds":["day23-prac-1-a"],"hint":"Xem lại phần Method Security trong bài.","solution":"day23-prac-1-a","explanation":"@PreAuthorize đánh giá biểu thức SpEL trước khi method được gọi, chặn hoàn toàn lời gọi nếu không thoả; @PostAuthorize đánh giá sau khi method đã chạy xong, có thể dựa vào cả kết quả trả về (returnObject) - phù hợp khi quyền truy cập phụ thuộc chính dữ liệu vừa nạp.","rubric":"Chọn đúng mốc thời điểm đánh giá (trước/sau khi method chạy) và khả năng dùng returnObject.","sourceUsage":["day23-src-2"]},{"id":"day23-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một method deleteOrder(Long orderId) chỉ cho phép role ADMIN gọi, dùng @PreAuthorize.","choices":[],"correctChoiceIds":[],"hint":"Dùng biểu thức SpEL hasRole('ADMIN') trong @PreAuthorize.","solution":"@PreAuthorize(\"hasRole('ADMIN')\")\nvoid deleteOrder(Long orderId) {\n    // chi ADMIN moi goi duoc\n}","explanation":"Áp dụng lại mẫu @PreAuthorize(\"hasRole(...)\") đã học trong bài vào một method mới.","rubric":"Đánh giá đúng: có @PreAuthorize với biểu thức hasRole('ADMIN') trên method.","sourceUsage":["day23-src-2"]},{"id":"day23-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao không nên tắt CSRF cho toàn bộ ứng dụng chỉ vì API chính dùng JWT, nếu ứng dụng vẫn còn một phần dùng session/cookie?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc CSRF khai thác cookie mà trình duyệt tự động đính kèm, không liên quan tới Bearer token.","solution":"CSRF là rủi ro khi trình duyệt tự động đính kèm cookie session vào request, kể cả request do trang khác khởi tạo. Phần dùng JWT qua header Authorization không bị ảnh hưởng vì trình duyệt không tự đính kèm header đó, nhưng phần còn dùng cookie/session vẫn có nguy cơ bị giả mạo request nếu tắt CSRF toàn cục - CSRF cần được bật/tắt theo đúng cơ chế xác thực của từng phần, không phải một quyết định áp dụng chung cho toàn ứng dụng.","explanation":"Liên hệ CSRF với cơ chế trình duyệt tự động đính kèm cookie, không phải header Authorization.","rubric":"Đánh giá học viên nêu đúng lý do CSRF gắn với cookie/session, không phải Bearer token qua header.","sourceUsage":["day23-src-8"]},{"id":"day23-prac-4","type":"concept","interaction":"multiple-choice","prompt":"FetchType.LAZY có tự động tránh được vấn đề N+1 không?","choices":[{"id":"day23-prac-4-a","text":"Không - LAZY chỉ trì hoãn thời điểm nạp; nếu code truy cập field lazy bên trong vòng lặp thì vẫn phát sinh N truy vấn riêng lẻ"},{"id":"day23-prac-4-b","text":"Có - LAZY luôn gộp tất cả truy vấn liên kết thành một câu JOIN duy nhất"},{"id":"day23-prac-4-c","text":"Có, nhưng chỉ khi dùng chung với @Transactional"},{"id":"day23-prac-4-d","text":"N+1 chỉ xảy ra với FetchType.EAGER, không bao giờ xảy ra với LAZY"}],"correctChoiceIds":["day23-prac-4-a"],"hint":"Xem lại bảng so sánh FetchType và N+1 trong bài.","solution":"day23-prac-4-a","explanation":"FetchType chỉ quyết định thời điểm nạp (ngay lập tức hay trì hoãn), không quyết định chiến lược nạp; LAZY vẫn gây N+1 nếu code truy cập field lazy của từng phần tử bên trong vòng lặp, vì mỗi lần truy cập lần đầu sẽ phát sinh một truy vấn riêng.","rubric":"Phân biệt rõ 'thời điểm nạp' (FetchType) với 'chiến lược nạp' (nguyên nhân thực sự của N+1).","sourceUsage":["day23-src-13","day23-src-14"]}],"syllabusAssignments":[],"enhancedExercises":["Viết một test dùng @WithMockUser(roles = \"ADMIN\") xác minh deleteOrder() cho phép ADMIN gọi và một test khác xác minh vai trò khác bị chặn.","Cấu hình CookieCsrfTokenRepository thay cho lưu trong HttpSession, và giải thích khi nào lựa chọn này phù hợp hơn cho một front-end SPA."],"references":[{"id":"day23-ref-1","type":"external","resourceId":"res-fa00cc21947b","citationId":"day23-src-2","url":"https://www.baeldung.com/spring-security-method-security","label":"Method Security","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to Spring Method Security | Baeldung","limitation":null},{"id":"day23-ref-2","type":"external","resourceId":"res-d1d09e3813e4","citationId":"day23-src-8","url":"https://www.baeldung.com/spring-security-csrf","label":"CSRF Protection","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide to CSRF Protection in Spring Security | Baeldung","limitation":null},{"id":"day23-ref-3","type":"external","resourceId":"res-ce09de5e928a","citationId":"day23-src-12","url":"https://vladmihalcea.com/n-plus-1-query-problem/","label":"N+1 Problem","checkStatus":"ok","readStatus":"read","pageTitle":"N+1 query problem with JPA and Hibernate - Vlad Mihalcea","limitation":null},{"id":"day23-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":8,"unitTitle":"Spring Security \u0026 JPA Performance"},{"id":"day-24","unitId":"unit-08","group":"spring","kind":"lab","title":"- Lab 8: Auth Service + Performance Optimization","summary":"Lab 8 - Auth Service + Performance Optimization: ghép luồng Register/Login/Refresh/Logout (Redis blacklist) trên nền JWT đã học, phân quyền CUSTOMER/ADMIN bằng @PreAuthorize, sửa N+1 cho Product list API bằng JOIN FETCH/@EntityGraph kết hợp @NotFound cho quan hệ có soft delete, cấu hình batch fetching (hibernate.jdbc.batch_size, order_inserts/order_updates), và benchmark trước/sau tối ưu.","durationMinutes":150.0,"objectives":["LO8"],"prerequisites":["Đã hoàn thành Day 22 (Authentication with Spring Security + JWT) và Day 23 (Authorization \u0026 JPA Performance) - Lab 8 ghép toàn bộ kiến thức xác thực, phân quyền, và N+1 của cả hai bài thành một Auth Service hoàn chỉnh có tối ưu hiệu năng."],"outcomes":["Triển khai được luồng Register/Login/Refresh/Logout với blacklist thu hồi token trước hạn.","Áp dụng đúng @PreAuthorize để phân quyền CUSTOMER và ADMIN.","Sửa được N+1 cho API danh sách bằng JOIN FETCH/@EntityGraph, xử lý đúng @NotFound cho quan hệ có soft delete.","Cấu hình đúng batch fetching và đo được benchmark trước/sau tối ưu."],"sections":[{"id":"day24-sec-brief","title":"Đề bài Lab 8","blocks":[{"id":"day24-blk-1","type":"deliverable","text":"- Lab 8: Auth Service + Performance Optimization\n  - Register + Login + Refresh + Logout (Redis blacklist)\n  - @PreAuthorize role-based: CUSTOMER vs ADMIN\n  - Product list API: fix N+1 when load category\n  - Benchmark before/after optimize\n  - Security integration test with @WithMockUser","citations":[]},{"id":"day24-blk-2","type":"note","text":"Lab 8 tổng hợp trực tiếp kiến thức xác thực JWT đã học ở Day 22, authorization/N+1 đã học ở Day 23, và bổ sung hai chủ đề mới: soft delete (@SoftDelete của Hibernate 6.4) và batch fetching - để hoàn thiện một Auth Service có tối ưu hiệu năng thực tế.","citations":[]}]},{"id":"day24-sec-auth-flow","title":"Register, Login, Refresh, Logout","blocks":[{"id":"day24-blk-3","type":"paragraph","text":"Luồng Register/Login áp dụng lại cấu hình DelegatingPasswordEncoder đã học ở Day 22 để lưu mật khẩu an toàn; luồng xác thực mỗi request mang access token áp dụng lại đúng cơ chế JwtAuthenticationProvider - xác minh chữ ký và claim (đặc biệt exp) trước khi tạo Authentication đã xác thực, không được bỏ qua bước xác minh chữ ký dù đây là access token do chính hệ thống phát hành.","citations":["day24-src-1","day24-src-2"]},{"id":"day24-blk-4","type":"note","text":"Refresh token và Logout với Redis blacklist (lưu token đã bị thu hồi vào Redis, kiểm tra blacklist trước khi chấp nhận một access/refresh token, cho tới khi token đó tự hết hạn) không có resource nào trong resourceIds của Day 24 mô tả trực tiếp (xem authoring.limitations) - JWT theo thiết kế là stateless và không tự hỗ trợ thu hồi (revoke) trước hạn, nên việc thêm một danh sách đen (blacklist) ngoài Redis là kỹ thuật bổ sung phổ biến để xử lý logout/thu hồi token sớm.","citations":[]}]},{"id":"day24-sec-authorization","title":"Authorization: CUSTOMER và ADMIN","blocks":[{"id":"day24-blk-5","type":"paragraph","text":"Phân quyền CUSTOMER và ADMIN áp dụng lại nguyên mẫu @PreAuthorize(\"hasRole(...)\") đã học ở Day 23 (resource cụ thể về Method Security thuộc resourceIds của Day 23, không lặp lại trong resourceIds của Day 24 - xem authoring.limitations): các endpoint quản trị (xoá sản phẩm, xem toàn bộ đơn hàng) dùng @PreAuthorize(\"hasRole('ADMIN')\"), còn các endpoint của khách hàng (xem đơn hàng của chính mình) có thể kết hợp thêm điều kiện so khớp id người dùng hiện tại trong biểu thức SpEL.","citations":[]}]},{"id":"day24-sec-n1-fix","title":"Sửa N+1 cho Product list API","blocks":[{"id":"day24-blk-6","type":"paragraph","text":"Áp dụng đúng vấn đề N+1 đã học ở Day 23 vào API danh sách sản phẩm: khi trả về danh sách Product kèm tên Category, nếu code lặp qua từng Product rồi gọi product.getCategory().getName(), mỗi lần truy cập category lazy lần đầu sẽ phát sinh một truy vấn riêng - N sản phẩm sinh ra N truy vấn bổ sung. Cách khắc phục là gộp việc nạp Category vào cùng một câu truy vấn bằng JOIN FETCH (JPQL) hoặc @EntityGraph (khai báo, không cần viết JPQL thủ công) - cả hai đều nạp Category cùng lúc với Product trong đúng một câu SQL.","citations":["day24-src-3"]},{"id":"day24-blk-7","type":"code","language":"java","code":"import jakarta.persistence.*;\nimport org.springframework.data.jpa.repository.EntityGraph;\nimport org.springframework.data.jpa.repository.Query;\nimport java.util.List;\n\ninterface ProductRepository extends org.springframework.data.repository.Repository\u003cProductEntity, Long\u003e {\n\n    // JOIN FETCH nap Category cung mot cau truy van duy nhat,\n    // thay vi de proxy lazy tu phat sinh N truy van rieng le.\n    @Query(\"select p from ProductEntity p join fetch p.category\")\n    List\u003cProductEntity\u003e findAllWithCategory();\n\n    // Tuong duong bang @EntityGraph, khong can viet JPQL thu cong.\n    @EntityGraph(attributePaths = \"category\")\n    List\u003cProductEntity\u003e findAll();\n}\n\n@Entity\nclass ProductEntity {\n\n    @Id\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"category_id\")\n    @NotFound(action = NotFoundAction.IGNORE)\n    private CategoryEntity category;\n}\n","compile":false,"citations":["day24-src-3","day24-src-5","day24-src-6"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day24-blk-8","type":"note","text":"Nếu Category có thể bị soft-delete (dùng @SoftDelete của Hibernate 6.4 - cơ chế UPDATE một cột đánh dấu thay vì DELETE thật), một Product vẫn có thể trỏ tới category_id của một Category đã bị đánh dấu xoá; khi đó proxy lazy mặc định sẽ ném EntityNotFoundException khi cố nạp Category không còn 'sống'. @NotFound(action = NotFoundAction.IGNORE) trên field @ManyToOne LAZY khiến Hibernate trả về null thay vì ném exception trong tình huống này - cần thiết khi entity liên kết dùng soft delete.","citations":["day24-src-5","day24-src-6"]},{"id":"day24-blk-9","type":"important","text":"second-level cache (bộ nhớ đệm cấp hai của Hibernate, dùng chung giữa nhiều persistence context) KHÔNG tự động giải quyết N+1: nếu cache chưa được 'làm nóng' (warm up) với dữ liệu liên quan, lượt truy vấn đầu tiên vẫn phát sinh đủ N+1 câu truy vấn như bình thường; cache chỉ giúp các lượt gọi sau đó nhanh hơn nếu dữ liệu chưa đổi - không thay thế được việc sửa đúng chiến lược nạp (JOIN FETCH/@EntityGraph) ngay từ câu truy vấn gốc.","citations":["day24-src-4"]}]},{"id":"day24-sec-benchmark","title":"Batch Fetching và Benchmark","blocks":[{"id":"day24-blk-10","type":"paragraph","text":"Mặc định, Hibernate KHÔNG tự động gộp (batch) các câu lệnh INSERT/UPDATE thành một lô gửi xuống database - mỗi thao tác lưu một entity là một round-trip riêng biệt, dù đang trong cùng một giao dịch. Bật hibernate.jdbc.batch_size (ví dụ 30) cho phép Hibernate gộp nhiều INSERT/UPDATE cùng cấu trúc thành các lô, giảm đáng kể số round-trip tới database khi lưu số lượng lớn bản ghi (ví dụ khi seed dữ liệu hoặc xử lý đơn hàng hàng loạt).","citations":["day24-src-7","day24-src-8"]},{"id":"day24-blk-11","type":"paragraph","text":"hibernate.order_inserts và hibernate.order_updates sắp xếp lại thứ tự các câu lệnh INSERT/UPDATE theo entity type trước khi gửi xuống database - điều kiện cần thiết để Hibernate thực sự gộp được các câu lệnh liền kề cùng loại vào một batch (nếu thứ tự bị xen kẽ giữa các loại entity khác nhau, JDBC driver không gộp batch được hiệu quả).","citations":["day24-src-9"]},{"id":"day24-blk-12","type":"code","language":"properties","code":"# application.properties - bat batch insert/update cho Hibernate\nspring.jpa.properties.hibernate.jdbc.batch_size=30\nspring.jpa.properties.hibernate.order_inserts=true\nspring.jpa.properties.hibernate.order_updates=true\n","compile":false,"citations":["day24-src-8","day24-src-9"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day24-blk-13","type":"note","text":"Đo benchmark trước/sau khi bật batch_size và order_inserts/order_updates cho thấy hiệu năng cải thiện rõ rệt khi lưu số lượng lớn bản ghi cùng loại - mức cải thiện cụ thể phụ thuộc vào số lượng bản ghi, cấu hình batch_size, và loại database đang dùng; nên tự đo trên chính schema và dữ liệu mẫu của Lab 8 thay vì áp dụng một con số cố định từ tài liệu tham khảo.","citations":["day24-src-10"]}]},{"id":"day24-sec-testing","title":"Security Integration Test với @WithMockUser","blocks":[{"id":"day24-blk-14","type":"note","text":"Viết integration test cho Auth Service áp dụng lại đúng mẫu @WithMockUser đã học ở Day 23 (resource cụ thể thuộc resourceIds của Day 23, không lặp lại trong resourceIds của Day 24 - xem authoring.limitations): khai báo @WithMockUser(roles = \"ADMIN\") hoặc @WithMockUser(roles = \"CUSTOMER\") trên từng test method để xác minh @PreAuthorize chặn/cho phép đúng theo vai trò, kết hợp @DataJpaTest hoặc @SpringBootTest tuỳ phạm vi test cần kiểm tra.","citations":[]}]}],"commonMistakes":["Chỉ xoá token phía client khi logout mà không có blacklist phía server, khiến token bị lộ trước đó vẫn dùng được tới khi hết hạn.","Sửa N+1 bằng cách đổi sang FetchType.EAGER thay vì dùng JOIN FETCH/@EntityGraph - vẫn gây N+1 nếu Hibernate chọn chiến lược nạp riêng lẻ.","Bật hibernate.jdbc.batch_size mà quên bật order_inserts/order_updates, khiến batch không gộp được hiệu quả do thứ tự câu lệnh xen kẽ.","Quên @NotFound(action = NotFoundAction.IGNORE) cho quan hệ @ManyToOne LAZY trỏ tới entity có thể bị soft-delete, gây EntityNotFoundException runtime."],"practices":[{"id":"day24-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao cần một cơ chế blacklist (ví dụ lưu trong Redis) khi logout với xác thực JWT stateless, thay vì chỉ xoá token phía client?","choices":[{"id":"day24-prac-1-a","text":"Vì JWT tự xác thực bằng chữ ký, server không lưu trạng thái phiên nào - nếu chỉ xoá token phía client, token đó (nếu bị đánh cắp trước đó) vẫn còn hợp lệ tới khi hết hạn tự nhiên"},{"id":"day24-prac-1-b","text":"Vì Spring Security tự động vô hiệu hoá mọi JWT khi client gọi API logout"},{"id":"day24-prac-1-c","text":"Vì JWT bắt buộc phải lưu trong Redis mới hoạt động được"},{"id":"day24-prac-1-d","text":"Vì xoá token phía client sẽ tự động xoá luôn token đó khỏi mọi server khác"}],"correctChoiceIds":["day24-prac-1-a"],"hint":"Nhớ lại đặc điểm stateless của JWT đã học ở Day 22 - server không lưu trạng thái phiên.","solution":"day24-prac-1-a","explanation":"JWT tự xác thực bằng chữ ký và không có trạng thái phía server; chỉ xoá token ở client không ngăn được ai đó dùng token đó (nếu đã bị lộ) cho tới khi nó tự hết hạn - cần một blacklist phía server (ví dụ Redis, tra cứu nhanh và tự hết hạn theo TTL) để chủ động thu hồi trước hạn.","rubric":"Liên hệ tới đặc điểm stateless của JWT đã học ở Day 22.","sourceUsage":["day24-src-1"]},{"id":"day24-prac-2","type":"coding","interaction":"self-check","prompt":"Sửa một repository method đang gây N+1 khi nạp Product kèm Category bằng @EntityGraph.","choices":[],"correctChoiceIds":[],"hint":"Dùng @EntityGraph(attributePaths = \"category\") trên method findAll().","solution":"@EntityGraph(attributePaths = \"category\")\nList\u003cProductEntity\u003e findAll();","explanation":"Áp dụng lại mẫu @EntityGraph đã học trong bài để gộp việc nạp Category vào cùng truy vấn Product.","rubric":"Đánh giá đúng: có @EntityGraph với attributePaths trỏ đúng field category.","sourceUsage":["day24-src-3"]},{"id":"day24-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao hibernate.order_inserts/order_updates cần bật cùng với hibernate.jdbc.batch_size để batch thực sự hiệu quả?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc JDBC driver chỉ gộp được batch khi các câu lệnh liền kề cùng loại entity.","solution":"batch_size chỉ cho phép Hibernate gộp các câu lệnh INSERT/UPDATE thành lô, nhưng nếu thứ tự các câu lệnh bị xen kẽ giữa nhiều loại entity khác nhau, JDBC driver không gộp được các câu lệnh không liền kề cùng loại vào một batch hiệu quả. order_inserts/order_updates sắp xếp lại thứ tự theo entity type trước khi gửi xuống database, đảm bảo các câu lệnh cùng loại đứng liền kề để batch_size phát huy tác dụng.","explanation":"Liên hệ giữa 'sắp xếp thứ tự theo loại' và khả năng JDBC driver gộp batch hiệu quả.","rubric":"Đánh giá học viên nêu đúng vai trò sắp xếp liền kề của order_inserts/order_updates với batch_size.","sourceUsage":["day24-src-7","day24-src-9"]},{"id":"day24-prac-4","type":"concept","interaction":"multiple-choice","prompt":"@NotFound(action = NotFoundAction.IGNORE) trên một @ManyToOne LAZY dùng để làm gì?","choices":[{"id":"day24-prac-4-a","text":"Trả về null thay vì ném EntityNotFoundException khi entity liên kết không còn tồn tại/đã bị soft-delete"},{"id":"day24-prac-4-b","text":"Tự động xoá bản ghi cha nếu entity liên kết không tồn tại"},{"id":"day24-prac-4-c","text":"Chuyển field đó từ LAZY sang EAGER"},{"id":"day24-prac-4-d","text":"Bỏ qua hoàn toàn việc kiểm tra khoá ngoại ở tầng database"}],"correctChoiceIds":["day24-prac-4-a"],"hint":"Xem lại phần soft delete và @NotFound trong bài.","solution":"day24-prac-4-a","explanation":"Khi entity liên kết có thể bị soft-delete (@SoftDelete của Hibernate 6.4), proxy lazy mặc định sẽ ném EntityNotFoundException nếu bản ghi không còn 'sống'; @NotFound(action = NotFoundAction.IGNORE) khiến Hibernate trả về null thay vì ném exception trong tình huống này.","rubric":"Liên hệ @NotFound với tình huống entity liên kết bị soft-delete, không phải xoá cứng khỏi database.","sourceUsage":["day24-src-5","day24-src-6"]}],"syllabusAssignments":[{"row":42,"text":"- Lab 8: Auth Service + Performance Optimization\n  - Register + Login + Refresh + Logout (Redis blacklist)\n  - @PreAuthorize role-based: CUSTOMER vs ADMIN\n  - Product list API: fix N+1 when load category\n  - Benchmark before/after optimize\n  - Security integration test with @WithMockUser"}],"enhancedExercises":["Thêm TTL cho từng entry trong Redis blacklist đúng bằng thời gian còn lại tới exp của token, tránh blacklist phình to vô hạn.","Đo và ghi lại số câu truy vấn SQL (qua log Hibernate) trước và sau khi áp dụng @EntityGraph cho Product list API với 100 sản phẩm mẫu."],"references":[{"id":"day24-ref-1","type":"external","resourceId":"res-65703b737426","citationId":"day24-src-1","url":"https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html","label":"JWT with Spring Security","checkStatus":"ok","readStatus":"read","pageTitle":"OAuth 2.0 Resource Server JWT :: Spring Security","limitation":null},{"id":"day24-ref-2","type":"external","resourceId":"res-ce09de5e928a","citationId":"day24-src-3","url":"https://vladmihalcea.com/n-plus-1-query-problem/","label":"N+1 Problem","checkStatus":"ok","readStatus":"read","pageTitle":"N+1 query problem with JPA and Hibernate - Vlad Mihalcea","limitation":null},{"id":"day24-ref-3","type":"external","resourceId":"res-8437fa16cd25","citationId":"day24-src-5","url":"https://vladmihalcea.com/hibernate-softdelete-annotation/","label":"Hibernate Soft Delete","checkStatus":"ok","readStatus":"read","pageTitle":"Hibernate SoftDelete annotation - Vlad Mihalcea","limitation":null},{"id":"day24-ref-4","type":"external","resourceId":"res-28c8c8bc71df","citationId":"day24-src-7","url":"https://vladmihalcea.com/how-to-batch-insert-and-update-statements-with-hibernate/","label":"Batch Insert/Update","checkStatus":"ok","readStatus":"read","pageTitle":"How to batch INSERT and UPDATE statements with Hibernate - Vlad Mihalcea","limitation":null},{"id":"day24-ref-5","type":"internal","resourceId":null,"citationId":null}],"unitNumber":8,"unitTitle":"Spring Security \u0026 JPA Performance"},{"id":"day-25","unitId":"unit-09","group":"spring","kind":"theory","title":"Caching \u0026 Async Processing","summary":"Spring Cache abstraction (@Cacheable/@CachePut/@CacheEvict, cache có điều kiện qua SpEL), Redis làm backend cache (RedisCacheManager, RedisCacheConfiguration, TTL/TTI), và giới thiệu khái niệm @Async/@Scheduled sẽ được áp dụng có trích dẫn ở Assignment 9 (Day 27).","durationMinutes":150.0,"objectives":["LO9"],"prerequisites":["Đã hoàn thành Unit 7-8 (JPA, Spring Security) - bài này chuyển sang chủ đề tối ưu hiệu năng và tích hợp bên ngoài của Unit 9."],"outcomes":["Phân biệt đúng @Cacheable/@CachePut/@CacheEvict và biết dùng condition/unless.","Cấu hình được RedisCacheManager với TTL/TTI phù hợp.","Giải thích được vai trò của @Async và @Scheduled trong việc tách xử lý khỏi luồng request chính."],"sections":[{"id":"day25-sec-brief","title":"Pham vi buoi hoc","blocks":[{"id":"day25-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day25-blk-2","type":"note","text":"Bài học mở đầu Unit 9 (tối ưu hiệu năng/tích hợp bên ngoài): cơ chế cache của Spring, backend Redis cho cache, và xử lý bất đồng bộ/định kỳ (@Async/@Scheduled). Assignment không có đề bài chi tiết riêng (lịch chỉ ghi 'Assignment') - học viên ôn tập và thực hành lại các kỹ thuật trong bài để chuẩn bị cho Assignment 9 (Product \u0026 Order Features) ở Day 27.","citations":[]}]},{"id":"day25-sec-cache","title":"Spring Cache Abstraction","blocks":[{"id":"day25-blk-3","type":"paragraph","text":"Spring Boot tự đăng ký một CacheManager mặc định (ConcurrentMapCacheManager, dựa trên ConcurrentHashMap trong bộ nhớ tiến trình) chỉ cần có starter cache trên classpath cùng @EnableCaching - không cần cấu hình thêm gì cho môi trường phát triển/demo.","citations":["day25-src-1","day25-src-6"]},{"id":"day25-blk-4","type":"paragraph","text":"Ba annotation cache chính có ngữ nghĩa khác nhau: @Cacheable kiểm tra cache trước, nếu đã có dữ liệu thì BỎ QUA không gọi method (phù hợp truy vấn đọc); @CachePut LUÔN gọi method rồi cập nhật kết quả vào cache, dùng khi cần đảm bảo dữ liệu cache mới nhất sau mỗi lần ghi; @CacheEvict xoá entry (hoặc toàn bộ cache với allEntries=true) khi dữ liệu gốc thay đổi lớn. Cả ba đều hỗ trợ tham số condition (SpEL, đánh giá trước khi gọi method, dựa trên input) và unless (SpEL, đánh giá sau khi có kết quả, dựa trên output như #result) để chỉ cache khi thoả điều kiện cụ thể.","citations":["day25-src-2","day25-src-3","day25-src-4","day25-src-5"]},{"id":"day25-blk-5","type":"code","language":"java","code":"import org.springframework.cache.annotation.CacheEvict;\nimport org.springframework.cache.annotation.CachePut;\nimport org.springframework.cache.annotation.Cacheable;\nimport org.springframework.stereotype.Service;\n\n@Service\nclass ProductQueryService {\n\n    // Kiem tra cache truoc; neu co du lieu thi BO QUA khong goi method.\n    @Cacheable(value = \"products\", key = \"#id\", unless = \"#result == null\")\n    public ProductDTO findById(Long id) {\n        return loadFromDatabase(id);\n    }\n\n    // LUON goi method, roi cap nhat ket qua vao cache - dung khi ghi du lieu.\n    @CachePut(value = \"products\", key = \"#result.id\")\n    public ProductDTO update(ProductDTO updated) {\n        return saveToDatabase(updated);\n    }\n\n    // Xoa toan bo entry trong cache \"products\" khi can lam moi hang loat.\n    @CacheEvict(value = \"products\", allEntries = true)\n    public void evictAllProducts() {\n        // Spring xoa cache SAU KHI method chay xong; khong can code them trong body.\n    }\n\n    private ProductDTO loadFromDatabase(Long id) { return null; }\n\n    private ProductDTO saveToDatabase(ProductDTO dto) { return dto; }\n}\n","compile":false,"citations":["day25-src-2","day25-src-3","day25-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day25-sec-redis","title":"Redis lam backend cache","blocks":[{"id":"day25-blk-6","type":"paragraph","text":"Chỉ cần thêm spring-boot-starter-data-redis và spring-boot-starter-cache vào classpath cùng @EnableCaching, Spring Boot tự động cấu hình RedisCacheManager kết nối Redis mặc định tại localhost:6379 - có thể tuỳ chỉnh sâu hơn bằng RedisCacheManager.builder(connectionFactory) kết hợp RedisCacheConfiguration (entryTtl, disableCachingNullValues, prefixCacheNameWith).","citations":["day25-src-7","day25-src-8","day25-src-10"]},{"id":"day25-blk-7","type":"code","language":"java","code":"import java.time.Duration;\nimport org.springframework.cache.annotation.EnableCaching;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.data.redis.cache.RedisCacheConfiguration;\nimport org.springframework.data.redis.cache.RedisCacheManager;\nimport org.springframework.data.redis.connection.RedisConnectionFactory;\n\n@Configuration\n@EnableCaching\nclass CacheConfig {\n\n    @Bean\n    public RedisCacheManager cacheManager(RedisConnectionFactory factory) {\n        RedisCacheConfiguration defaults = RedisCacheConfiguration.defaultCacheConfig()\n                .entryTtl(Duration.ofMinutes(10))   // TTL: het han 10 phut sau lan ghi/cap nhat gan nhat\n                .disableCachingNullValues();          // khong cache gia tri null\n\n        return RedisCacheManager.builder(factory)\n                .cacheDefaults(defaults)\n                .transactionAware()\n                .build();\n    }\n}\n","compile":false,"citations":["day25-src-7","day25-src-8"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day25-blk-8","type":"note","text":"TTL (entryTtl) được reset mỗi khi ghi/cập nhật entry, còn TTI (time-to-idle, bật qua enableTimeToIdle()) cần Redis từ 6.2.0 trở lên vì Spring Data Redis dùng lệnh GETEX để reset TTL mỗi lần đọc, tạo hiệu ứng 'gần giống' time-to-idle chứ Redis không có TTI gốc.","citations":["day25-src-9"]},{"id":"day25-blk-9","type":"note","text":"Mặc định RedisCacheWriter dùng lệnh KEYS+DEL để xoá cache (có thể chậm với keyspace lớn); có thể đổi sang BatchStrategies.scan(batchSize) để dùng SCAN, nhưng Jedis chỉ hỗ trợ SCAN ở chế độ non-cluster.","citations":["day25-src-9"]}]},{"id":"day25-sec-async","title":"@Async - xu ly bat dong bo","blocks":[{"id":"day25-blk-10","type":"note","text":"@Async (kích hoạt bằng @EnableAsync trên class cấu hình, cho phép một method chạy trên luồng khác thay vì chặn luồng xử lý request chính) không có resource nào trong resourceIds của Day 25 mô tả trực tiếp - resource về @Async thuộc resourceIds của Day 27, nơi kỹ thuật này được áp dụng trực tiếp (gửi email xác nhận đơn hàng, cập nhật tồn kho) và có trích dẫn đầy đủ. Trình bày khái niệm tổng quan ở đây trong khối note không yêu cầu trích dẫn.","citations":[]}]},{"id":"day25-sec-scheduled","title":"@Scheduled - tac vu dinh ky","blocks":[{"id":"day25-blk-11","type":"note","text":"@Scheduled (kích hoạt bằng @EnableScheduling, method phải trả về void và không nhận tham số; fixedDelay tính khoảng cách từ lúc KẾT THÚC lần chạy trước, fixedRate chạy theo chu kỳ cố định không quan tâm lần trước đã xong hay chưa, hoặc dùng biểu thức cron cho lịch phức tạp hơn) cũng không có resource nào trong resourceIds của Day 25 mô tả trực tiếp - resource tương ứng thuộc resourceIds của Day 27, nơi kỹ thuật này được áp dụng trực tiếp (huỷ đơn hàng chờ quá 30 phút) và có trích dẫn đầy đủ. Trình bày khái niệm tổng quan ở đây trong khối note không yêu cầu trích dẫn.","citations":[]}]}],"commonMistakes":["Dùng @Cacheable cho method ghi dữ liệu (insert/update) khiến lần ghi đầu tiên bị bỏ qua nếu cache đã có key trùng - phải dùng @CachePut cho thao tác ghi.","Quên @EnableCaching trên class cấu hình, khiến mọi @Cacheable/@CachePut/@CacheEvict bị bỏ qua hoàn toàn mà không có lỗi rõ ràng.","Dùng CacheManager mặc định (trong bộ nhớ) cho ứng dụng chạy nhiều instance, dẫn tới dữ liệu cache không nhất quán giữa các instance."],"practices":[{"id":"day25-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Khác biệt cốt lõi giữa @Cacheable và @CachePut là gì?","choices":[{"id":"day25-prac-1-a","text":"@Cacheable bỏ qua việc gọi method nếu cache đã có dữ liệu; @CachePut luôn gọi method rồi cập nhật kết quả vào cache"},{"id":"day25-prac-1-b","text":"@Cacheable dùng cho Redis, @CachePut chỉ dùng cho cache trong bộ nhớ"},{"id":"day25-prac-1-c","text":"@CachePut xoá cache, còn @Cacheable ghi cache"},{"id":"day25-prac-1-d","text":"Không có khác biệt, hai annotation này tương đương nhau"}],"correctChoiceIds":["day25-prac-1-a"],"hint":"So sánh hành vi khi cache đã có sẵn dữ liệu cho key đang truy vấn.","solution":"day25-prac-1-a","explanation":"@Cacheable kiểm tra cache trước; nếu đã có dữ liệu thì bỏ qua việc gọi method (phù hợp đọc dữ liệu). @CachePut luôn thực thi method rồi mới cập nhật kết quả vào cache, đảm bảo cache phản ánh đúng dữ liệu vừa ghi.","rubric":"Liên hệ đúng: @Cacheable = đọc có điều kiện bỏ qua, @CachePut = luôn ghi.","sourceUsage":["day25-src-2"]},{"id":"day25-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một method dùng @CacheEvict để xoá toàn bộ entry trong cache 'categories' khi danh mục sản phẩm bị xoá.","choices":[],"correctChoiceIds":[],"hint":"Dùng allEntries = true trên @CacheEvict.","solution":"@CacheEvict(value = \"categories\", allEntries = true)\npublic void evictAllCategories() {\n}","explanation":"Áp dụng lại mẫu @CacheEvict(allEntries = true) đã học trong bài để làm mới toàn bộ cache liên quan.","rubric":"Đánh giá đúng: có @CacheEvict với allEntries = true, value trỏ đúng cache name.","sourceUsage":["day25-src-3"]},{"id":"day25-prac-3","type":"concept","interaction":"multiple-choice","prompt":"Vì sao TTI (time-to-idle) trong Spring Data Redis cần Redis từ phiên bản 6.2.0 trở lên?","choices":[{"id":"day25-prac-3-a","text":"Vì Spring Data Redis dùng lệnh GETEX (có từ Redis 6.2.0) để reset TTL mỗi lần đọc, tạo hiệu ứng gần giống time-to-idle"},{"id":"day25-prac-3-b","text":"Vì Redis chỉ hỗ trợ TTL, không có khái niệm TTI nên phải nâng cấp phiên bản để bổ sung tính năng mới"},{"id":"day25-prac-3-c","text":"Vì RedisCacheManager.builder chỉ hoạt động từ Redis 6.2.0"},{"id":"day25-prac-3-d","text":"Vì Spring Boot yêu cầu tối thiểu Redis 6.2.0 cho mọi tính năng cache"}],"correctChoiceIds":["day25-prac-3-a"],"hint":"Nhớ lại lệnh Redis nào được dùng để vừa đọc vừa reset thời hạn.","solution":"day25-prac-3-a","explanation":"Redis không có TTI (time-to-idle) như một khái niệm gốc; Spring Data Redis mô phỏng nó bằng cách gọi GETEX (lệnh đọc kèm reset TTL) mỗi lần đọc entry, và GETEX chỉ có từ Redis 6.2.0.","rubric":"Liên hệ đúng lệnh GETEX với yêu cầu phiên bản Redis tối thiểu.","sourceUsage":["day25-src-9"]},{"id":"day25-prac-4","type":"concept","interaction":"self-check","prompt":"Vì sao CacheManager mặc định (ConcurrentMapCacheManager) không phù hợp khi ứng dụng chạy nhiều instance?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về nơi lưu trữ dữ liệu cache của ConcurrentMapCacheManager.","solution":"ConcurrentMapCacheManager lưu cache trong bộ nhớ (ConcurrentHashMap) của TỪNG tiến trình JVM riêng lẻ - mỗi instance có một bản cache độc lập, không chia sẻ được, dẫn tới dữ liệu không nhất quán giữa các instance. Cần một backend cache chia sẻ ngoài tiến trình như Redis để mọi instance đọc/ghi cùng một nơi.","explanation":"Liên hệ giữa 'cache trong bộ nhớ tiến trình' và bài toán nhất quán khi scale ngang nhiều instance.","rubric":"Đánh giá học viên nêu đúng lý do: cache cục bộ theo tiến trình không chia sẻ được giữa nhiều instance.","sourceUsage":["day25-src-1"]}],"syllabusAssignments":[{"row":44,"text":"Assignment"}],"enhancedExercises":["Thêm condition/unless SpEL vào @Cacheable(\"products\") để chỉ cache khi sản phẩm đang ở trạng thái ACTIVE.","Đo thời gian phản hồi trước/sau khi bật cache Redis cho một truy vấn danh mục sản phẩm."],"references":[{"id":"day25-ref-1","type":"external","resourceId":"res-e95ba2d69401","citationId":"day25-src-2","url":"https://www.baeldung.com/spring-cache-tutorial","label":"Spring Cache","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide To Caching in Spring (Baeldung)","limitation":null},{"id":"day25-ref-2","type":"external","resourceId":"res-347895e9400e","citationId":"day25-src-5","url":"https://spring.io/guides/gs/caching/","label":"Getting Started with Caching","checkStatus":"redirected","readStatus":"read","pageTitle":"Caching Data with Spring (spring.io guide, redirected)","limitation":null},{"id":"day25-ref-3","type":"external","resourceId":"res-710573bd4385","citationId":"day25-src-7","url":"https://docs.spring.io/spring-data/redis/reference/redis/redis-cache.html","label":"Redis Cache (Spring Data)","checkStatus":"ok","readStatus":"read","pageTitle":"Redis Cache reference (Spring Data Redis, docs.spring.io)","limitation":null},{"id":"day25-ref-4","type":"external","resourceId":"res-1c6109c5ec54","citationId":"day25-src-10","url":"https://www.baeldung.com/spring-boot-redis-cache","label":"Redis Cache","checkStatus":"ok","readStatus":"read","pageTitle":"Spring Boot Cache With Redis (Baeldung)","limitation":null},{"id":"day25-ref-5","type":"internal","resourceId":null,"citationId":null}],"unitNumber":9,"unitTitle":"Caching, Async, File Handling \u0026 External API"},{"id":"day-26","unitId":"unit-09","group":"spring","kind":"theory","title":"File Upload/Download \u0026 External API","summary":"Upload/download file với MultipartFile (kèm phòng chống path traversal), gọi API bên ngoài bằng WebClient, khái niệm Retry/Circuit Breaker để chịu lỗi, và xuất dữ liệu CSV - các kỹ thuật sẽ áp dụng trực tiếp vào Assignment 9 (Day 27).","durationMinutes":150.0,"objectives":["LO9"],"prerequisites":["Đã học Spring Cache/Redis ở Day 25 - bài này tiếp tục chủ đề tích hợp bên ngoài của Unit 9."],"outcomes":["Xây dựng được endpoint upload/download file an toàn (chống path traversal).","Gọi được API bên ngoài bằng WebClient và giải thích khi nào dùng Retry so với Circuit Breaker.","Xuất được dữ liệu ra CSV với escaping đúng chuẩn."],"sections":[{"id":"day26-sec-brief","title":"Pham vi buoi hoc","blocks":[{"id":"day26-blk-1","type":"note","text":"Buổi Guides/Review - lịch không ghi assignment riêng cho ngày này. Nội dung tập trung vào bốn kỹ thuật sẽ được áp dụng trực tiếp (có trích dẫn đầy đủ) vào Assignment 9 ở Day 27: upload/download file, gọi API bên ngoài bằng WebClient kèm khả năng chịu lỗi (Retry/Circuit Breaker), và xuất dữ liệu ra CSV.","citations":[]}]},{"id":"day26-sec-upload","title":"Upload file voi MultipartFile","blocks":[{"id":"day26-blk-2","type":"paragraph","text":"Spring MVC nhận file tải lên qua tham số @RequestParam kiểu MultipartFile (đại diện cho một phần dữ liệu multipart/form-data); để nhận nhiều file cùng lúc, khai báo tham số kiểu mảng MultipartFile[] ứng với nhiều input file cùng name trong form. Spring Boot cấu hình sẵn multipart resolver, chỉ cần chỉnh giới hạn dung lượng qua spring.servlet.multipart.max-file-size và spring.servlet.multipart.max-request-size khi cần.","citations":["day26-src-1","day26-src-2","day26-src-3","day26-src-6"]},{"id":"day26-blk-3","type":"warning","text":"Không bao giờ dùng trực tiếp originalFilename từ client để ghép đường dẫn lưu file - tên file có thể chứa \"../\" để ghi đè file ngoài ý muốn (path traversal). Phải chuẩn hoá (normalize) đường dẫn đích rồi kiểm tra nó thực sự nằm bên trong thư mục gốc được phép trước khi ghi.","citations":["day26-src-5"]},{"id":"day26-blk-4","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.multipart.MultipartFile;\n\n@Service\nclass FileSystemStorageService {\n\n    private final Path rootLocation;\n\n    FileSystemStorageService(Path rootLocation) {\n        this.rootLocation = rootLocation;\n    }\n\n    public void store(MultipartFile file) {\n        try {\n            if (file.isEmpty()) {\n                throw new StorageException(\"Khong the luu file rong\");\n            }\n            // Chuan hoa duong dan dich, roi kiem tra no PHAI nam trong rootLocation\n            // de chong tan cong path traversal (vi du ten file \"../../etc/passwd\").\n            Path destination = rootLocation.resolve(file.getOriginalFilename()).normalize().toAbsolutePath();\n            if (!destination.getParent().equals(rootLocation.toAbsolutePath())) {\n                throw new StorageException(\"Khong the luu file ngoai thu muc duoc phep\");\n            }\n            try (var inputStream = file.getInputStream()) {\n                Files.copy(inputStream, destination);\n            }\n        } catch (IOException e) {\n            throw new StorageException(\"That bai khi luu file\", e);\n        }\n    }\n\n    static class StorageException extends RuntimeException {\n        StorageException(String message) { super(message); }\n        StorageException(String message, Throwable cause) { super(message, cause); }\n    }\n}\n","compile":false,"citations":["day26-src-5"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day26-blk-5","type":"note","text":"Có thể kiểm thử luồng upload mà không cần chạy server thật, bằng MockMvc kết hợp MockMultipartFile để giả lập một file tải lên trong request test.","citations":["day26-src-7"]}]},{"id":"day26-sec-download","title":"Download file","blocks":[{"id":"day26-blk-6","type":"paragraph","text":"Endpoint tải file trả về ResponseEntity\u003cResource\u003e kèm header Content-Disposition: attachment để trình duyệt hiểu đây là file cần tải xuống (không hiển thị trực tiếp) - cùng controller có thể có thêm endpoint liệt kê danh sách file và endpoint tải lên trong một chỗ.","citations":["day26-src-4"]},{"id":"day26-blk-7","type":"code","language":"java","code":"import org.springframework.core.io.Resource;\nimport org.springframework.http.HttpHeaders;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.RestController;\n\n@RestController\nclass FileDownloadController {\n\n    private final StorageService storageService;\n\n    FileDownloadController(StorageService storageService) {\n        this.storageService = storageService;\n    }\n\n    @GetMapping(\"/files/{filename:.+}\")\n    public ResponseEntity\u003cResource\u003e serveFile(@PathVariable String filename) {\n        Resource file = storageService.loadAsResource(filename);\n        return ResponseEntity.ok()\n                .header(HttpHeaders.CONTENT_DISPOSITION, \"attachment; filename=\\\"\" + file.getFilename() + \"\\\"\")\n                .body(file);\n    }\n\n    interface StorageService {\n        Resource loadAsResource(String filename);\n    }\n}\n","compile":false,"citations":["day26-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day26-sec-webclient","title":"Goi API ben ngoai voi WebClient","blocks":[{"id":"day26-blk-8","type":"paragraph","text":"WebClient là HTTP client reactive được Spring giới thiệu để thay thế RestTemplate (đã ở chế độ bảo trì); tạo instance qua WebClient.create(), WebClient.create(baseUrl), hoặc WebClient.builder() để cấu hình sâu hơn (base URL, header mặc định, timeout).","citations":["day26-src-8","day26-src-9"]},{"id":"day26-blk-9","type":"code","language":"java","code":"import java.time.Duration;\nimport org.springframework.web.reactive.function.client.WebClient;\n\nclass ProductPriceClient {\n\n    private final WebClient webClient;\n\n    ProductPriceClient(WebClient.Builder builder) {\n        this.webClient = builder\n                .baseUrl(\"https://supplier.example.com/api\")\n                .build();\n    }\n\n    public PriceDTO fetchPrice(String sku) {\n        return webClient.get()\n                .uri(\"/prices/{sku}\", sku)\n                .header(\"X-Api-Key\", \"demo-key\")\n                .retrieve()\n                .bodyToMono(PriceDTO.class)\n                .timeout(Duration.ofSeconds(3))\n                .block();\n    }\n\n    record PriceDTO(String sku, java.math.BigDecimal price) {}\n}\n","compile":false,"citations":["day26-src-10"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day26-blk-10","type":"note","text":"Có thể kiểm thử code gọi WebClient bằng WebTestClient mà không cần gọi API thật.","citations":["day26-src-11"]}]},{"id":"day26-sec-resilience","title":"Chiu loi khi goi API ben ngoai","blocks":[{"id":"day26-blk-11","type":"paragraph","text":"Circuit Breaker có 3 trạng thái: Closed (bình thường, request đi qua như thường lệ), Open (sau khi tỉ lệ lỗi vượt ngưỡng, mọi request bị chặn ngay lập tức không gọi tới hệ thống đích), và Half-Open (sau một khoảng thời gian, cho thử một số request để kiểm tra hệ thống đích đã hồi phục chưa).","citations":["day26-src-12"]},{"id":"day26-blk-12","type":"table","columns":["Tieu chi","Retry","Circuit Breaker"],"rows":[["Trang thai","Khong luu trang thai (stateless) - moi loi xu ly doc lap","Co trang thai (Closed/Open/Half-Open) theo doi ti le loi qua thoi gian"],["Muc dich","Thu lai ngay khi loi la tam thoi (mang chap chon)","Ngan chan goi lien tuc toi he thong dang gap su co"],["Rui ro neu dung sai","Thu lai qua nhieu lam nang them he thong dang loi","Khong phu hop voi loi tam thoi ngan han, don gian mot lan retry la du"]],"citations":["day26-src-13"]}]},{"id":"day26-sec-csv","title":"Xuat du lieu CSV/Excel","blocks":[{"id":"day26-blk-13","type":"paragraph","text":"Có thể ghi CSV thuần Java bằng PrintWriter, nối các trường bằng dấu phẩy và dòng bằng Collectors.joining; theo quy ước CSV/RFC 4180, trường nào chứa dấu phẩy, dấu nháy kép hoặc ký tự xuống dòng phải được bao trong dấu nháy kép và nhân đôi mọi dấu nháy kép bên trong. Với nhu cầu phức tạp hơn (nhiều cột động, escape đầy đủ theo chuẩn), các thư viện bên thứ ba như Apache Commons CSV, OpenCSV hoặc Jackson dataformat CSV thường được dùng thay vì tự viết logic ghi file.","citations":["day26-src-14","day26-src-15","day26-src-16"]},{"id":"day26-blk-14","type":"code","language":"java","code":"import java.io.PrintWriter;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\nclass CsvExporter {\n\n    void writeOrders(PrintWriter writer, List\u003cOrderRow\u003e rows) {\n        writer.println(\"id,customer,total\");\n        String body = rows.stream()\n                .map(r -\u003e String.join(\",\",\n                        escape(r.id()), escape(r.customer()), escape(r.total())))\n                .collect(Collectors.joining(\"\\n\"));\n        writer.println(body);\n    }\n\n    // Neu truong chua dau phay, dau nhay kep, hoac xuong dong: bao trong nhay kep\n    // va nhan doi moi dau nhay kep ben trong (theo quy uoc CSV/RFC 4180).\n    private String escape(String value) {\n        if (value.contains(\",\") || value.contains(\"\\\"\") || value.contains(\"\\n\")) {\n            return \"\\\"\" + value.replace(\"\\\"\", \"\\\"\\\"\") + \"\\\"\";\n        }\n        return value;\n    }\n\n    record OrderRow(String id, String customer, String total) {}\n}\n","compile":false,"citations":["day26-src-14","day26-src-15"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day26-blk-15","type":"note","text":"Xuất Excel (.xlsx) không nằm trong resourceIds của bài này - không có tài liệu tham khảo nào trong bộ nguồn của khoá học mô tả thư viện xử lý Excel (ví dụ Apache POI). Nếu cần xuất Excel thay vì CSV, học viên tự tham khảo tài liệu chính thức của thư viện được chọn; nội dung này không được trình bày có trích dẫn ở đây.","citations":[]}]}],"commonMistakes":["Ghép trực tiếp originalFilename từ client vào đường dẫn lưu file mà không chuẩn hoá/kiểm tra - mở lỗ hổng path traversal.","Dùng block() trên WebClient trong luồng reactive mà không hiểu đây là thao tác chặn (blocking) - chỉ chấp nhận được trong code không-reactive (MVC truyền thống).","Ghi CSV bằng cách nối chuỗi thủ công mà quên escape dấu phẩy/dấu nháy kép trong dữ liệu, làm hỏng cấu trúc file khi mở bằng Excel."],"practices":[{"id":"day26-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao FileSystemStorageService phải kiểm tra đường dẫn đích thực sự nằm trong rootLocation trước khi ghi file?","choices":[{"id":"day26-prac-1-a","text":"Để chống tấn công path traversal (tên file như \"../../etc/passwd\" có thể ghi đè file ngoài thư mục cho phép)"},{"id":"day26-prac-1-b","text":"Để tăng tốc độ ghi file"},{"id":"day26-prac-1-c","text":"Vì Spring Boot bắt buộc phải có bước kiểm tra này mới khởi động được"},{"id":"day26-prac-1-d","text":"Để tự động nén file trước khi lưu"}],"correctChoiceIds":["day26-prac-1-a"],"hint":"Nghĩ về việc tên file gốc (originalFilename) đến từ client, không đáng tin cậy.","solution":"day26-prac-1-a","explanation":"originalFilename do client gửi lên, không đáng tin cậy - nếu ghép trực tiếp vào đường dẫn lưu mà không chuẩn hoá và kiểm tra, kẻ tấn công có thể dùng \"../\" để ghi file ra ngoài thư mục được phép (path traversal).","rubric":"Liên hệ đúng rủi ro bảo mật path traversal với bước kiểm tra rootLocation.","sourceUsage":["day26-src-5"]},{"id":"day26-prac-2","type":"coding","interaction":"self-check","prompt":"Viết chữ ký method controller nhận nhiều file tải lên cùng lúc từ cùng một tên input 'files'.","choices":[],"correctChoiceIds":[],"hint":"Dùng MultipartFile[] thay vì MultipartFile đơn.","solution":"@PostMapping(\"/upload-many\")\npublic ResponseEntity\u003cVoid\u003e uploadMany(@RequestParam(\"files\") MultipartFile[] files) {\n    return ResponseEntity.ok().build();\n}","explanation":"Áp dụng lại mẫu MultipartFile[] đã học để nhận nhiều file cùng name trong form.","rubric":"Đánh giá đúng: tham số kiểu MultipartFile[] gắn @RequestParam đúng tên input.","sourceUsage":["day26-src-2"]},{"id":"day26-prac-3","type":"concept","interaction":"multiple-choice","prompt":"Khác biệt cốt lõi giữa Retry và Circuit Breaker là gì?","choices":[{"id":"day26-prac-3-a","text":"Retry không lưu trạng thái (thử lại ngay khi lỗi tạm thời), còn Circuit Breaker theo dõi trạng thái theo thời gian để chặn hẳn khi hệ thống đích đang gặp sự cố"},{"id":"day26-prac-3-b","text":"Retry chỉ dùng cho WebClient, Circuit Breaker chỉ dùng cho RestTemplate"},{"id":"day26-prac-3-c","text":"Circuit Breaker luôn thử lại vô hạn, Retry chỉ thử một lần duy nhất"},{"id":"day26-prac-3-d","text":"Không có khác biệt, hai khái niệm này tương đương nhau"}],"correctChoiceIds":["day26-prac-3-a"],"hint":"So sánh việc có/không lưu trạng thái theo thời gian giữa hai cơ chế.","solution":"day26-prac-3-a","explanation":"Retry stateless, xử lý từng lỗi độc lập, phù hợp lỗi tạm thời ngắn hạn. Circuit Breaker có trạng thái (Closed/Open/Half-Open), theo dõi tỉ lệ lỗi qua thời gian để chủ động chặn request khi hệ thống đích đang gặp sự cố kéo dài, tránh làm nặng thêm.","rubric":"Liên hệ đúng khái niệm stateless vs có trạng thái theo thời gian.","sourceUsage":["day26-src-13"]},{"id":"day26-prac-4","type":"coding","interaction":"self-check","prompt":"Theo quy ước CSV/RFC 4180, một trường dữ liệu chứa dấu phẩy cần được xử lý escape như thế nào trước khi ghi vào file CSV?","choices":[],"correctChoiceIds":[],"hint":"Nhớ lại cách CsvExporter.escape xử lý trường có dấu phẩy/dấu nháy kép.","solution":"Bao toàn bộ giá trị trong dấu nháy kép (\"...\"); nếu bên trong giá trị đã có dấu nháy kép thì phải nhân đôi mỗi dấu nháy kép đó (\" thành \"\") trước khi ghi.","explanation":"Áp dụng lại logic escape đã học: bọc trong dấu nháy kép + nhân đôi dấu nháy kép bên trong.","rubric":"Đánh giá đúng hai bước: bọc dấu nháy kép và nhân đôi dấu nháy kép bên trong giá trị.","sourceUsage":["day26-src-15"]}],"syllabusAssignments":[],"enhancedExercises":["Thêm kiểm tra loại file (whitelist content-type) trước khi lưu trong FileSystemStorageService.","Cấu hình WebClient với retry (spring-retry hoặc Resilience4j) khi gọi API bên ngoài thất bại tạm thời."],"references":[{"id":"day26-ref-1","type":"external","resourceId":"res-74d398e3d23c","citationId":"day26-src-2","url":"https://www.baeldung.com/spring-file-upload","label":"File Upload","checkStatus":"ok","readStatus":"read","pageTitle":"File Upload with Spring MVC (Baeldung)","limitation":null},{"id":"day26-ref-2","type":"external","resourceId":"res-6543ba492a80","citationId":"day26-src-5","url":"https://spring.io/guides/gs/uploading-files/","label":"Uploading Files Guide","checkStatus":"redirected","readStatus":"read","pageTitle":"Uploading Files (spring.io guide, redirected)","limitation":null},{"id":"day26-ref-3","type":"external","resourceId":"res-b8b29a249f37","citationId":"day26-src-10","url":"https://www.baeldung.com/spring-5-webclient","label":"WebClient","checkStatus":"ok","readStatus":"read","pageTitle":"Spring WebClient (Baeldung)","limitation":null},{"id":"day26-ref-4","type":"external","resourceId":"res-f6c8ab355f09","citationId":"day26-src-13","url":"https://www.baeldung.com/spring-boot-circuit-breaker-vs-retry","label":"Circuit Breaker","checkStatus":"ok","readStatus":"read","pageTitle":"Difference Between Circuit Breaker and Retry in Spring Boot (Baeldung)","limitation":null},{"id":"day26-ref-5","type":"external","resourceId":"res-ea68bcb99823","citationId":"day26-src-15","url":"https://www.baeldung.com/java-csv","label":"Java CSV","checkStatus":"ok","readStatus":"read","pageTitle":"How to Write to a CSV File in Java (Baeldung)","limitation":null},{"id":"day26-ref-6","type":"internal","resourceId":null,"citationId":null}],"unitNumber":9,"unitTitle":"Caching, Async, File Handling \u0026 External API"},{"id":"day-27","unitId":"unit-09","group":"spring","kind":"project","title":"- Assignment 9: Product \u0026 Order Features","summary":"Assignment 9: áp dụng cache Redis, @Async, @Scheduled, upload ảnh sản phẩm, gọi payment gateway (mock) qua WebClient với Circuit Breaker, và xuất CSV vào tính năng Product \u0026 Order của dự án e-commerce.","durationMinutes":150.0,"objectives":["LO9"],"prerequisites":["Đã học Spring Cache/Redis, @Async, @Scheduled (Day 25) và upload file, WebClient, resilience pattern, CSV (Day 26)."],"outcomes":["Áp dụng đúng @Cacheable/@CacheEvict cho dữ liệu danh sách sản phẩm/danh mục.","Triển khai được xử lý bất đồng bộ (@Async) và tác vụ định kỳ (@Scheduled) trong luồng nghiệp vụ đơn hàng.","Gọi được dịch vụ bên ngoài có khả năng chịu lỗi bằng WebClient + Circuit Breaker."],"sections":[{"id":"day27-sec-brief","title":"De bai Assignment 9","blocks":[{"id":"day27-blk-1","type":"deliverable","text":"- Assignment 9: Product \u0026 Order Features\n  - Cache product list, category tree. Evict on create/update/delete.\n  - @Async: order confirmation email, inventory update\n  - @Scheduled: cancel pending orders \u003e 30 min\n  - Product image upload + thumbnail\n  - WebClient call payment gateway (mock) with circuit breaker\n  - Export orders CSV (admin)","citations":[]},{"id":"day27-blk-2","type":"note","text":"Assignment tổng hợp mọi kỹ thuật đã học ở Day 25 (cache/Redis, @Async, @Scheduled) và Day 26 (upload file, WebClient, resilience pattern, CSV) - áp dụng trực tiếp vào tính năng Product \u0026 Order của dự án e-commerce đang xây dựng xuyên suốt khoá học.","citations":[]}]},{"id":"day27-sec-cache","title":"Cache danh sach san pham \u0026 cay danh muc","blocks":[{"id":"day27-blk-3","type":"paragraph","text":"Danh sách sản phẩm và cây danh mục là dữ liệu đọc nhiều, ghi ít - ứng viên lý tưởng cho @Cacheable. Bất kỳ thao tác tạo/sửa/xoá sản phẩm hoặc danh mục nào cũng cần làm mới toàn bộ cache liên quan bằng @CacheEvict(allEntries = true), vì việc tính toán chính xác key nào cần xoá riêng lẻ (theo trang, theo bộ lọc) phức tạp hơn nhiều so với lợi ích mang lại.","citations":["day27-src-1","day27-src-2","day27-src-3"]},{"id":"day27-blk-4","type":"code","language":"java","code":"import org.springframework.cache.annotation.CacheEvict;\nimport org.springframework.cache.annotation.Cacheable;\nimport org.springframework.stereotype.Service;\nimport java.util.List;\n\n@Service\nclass ProductCatalogService {\n\n    // Cache theo tung trang danh sach san pham (key gom ca tham so phan trang).\n    @Cacheable(value = \"products\", key = \"#page + '-' + #size\")\n    public List\u003cProductDTO\u003e listProducts(int page, int size) {\n        return queryProducts(page, size);\n    }\n\n    @Cacheable(value = \"categoryTree\")\n    public List\u003cCategoryDTO\u003e categoryTree() {\n        return buildCategoryTree();\n    }\n\n    // Bat ky thay doi nao ve san pham/danh muc deu lam cache \"products\" cu -\n    // xoa toan bo thay vi tinh toan xoa tung key rieng le.\n    @CacheEvict(value = \"products\", allEntries = true)\n    public void onProductChanged() {\n    }\n\n    @CacheEvict(value = \"categoryTree\", allEntries = true)\n    public void onCategoryChanged() {\n    }\n\n    private List\u003cProductDTO\u003e queryProducts(int page, int size) { return List.of(); }\n    private List\u003cCategoryDTO\u003e buildCategoryTree() { return List.of(); }\n\n    record ProductDTO(Long id, String name) {}\n    record CategoryDTO(Long id, String name) {}\n}\n","compile":false,"citations":["day27-src-1","day27-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day27-sec-async","title":"Async: gui email xac nhan va cap nhat ton kho","blocks":[{"id":"day27-blk-5","type":"paragraph","text":"Gửi email xác nhận đơn hàng không cần chặn luồng xử lý request tạo đơn hàng - đánh dấu @Async để chạy trên luồng khác. Khi cần biết kết quả của một tác vụ bất đồng bộ (ví dụ cập nhật tồn kho có thành công hay không), method @Async phải trả về CompletableFuture thay vì kiểu dữ liệu thông thường.","citations":["day27-src-4","day27-src-5"]},{"id":"day27-blk-6","type":"code","language":"java","code":"import java.util.concurrent.CompletableFuture;\nimport org.springframework.scheduling.annotation.Async;\nimport org.springframework.stereotype.Service;\n\n@Service\nclass OrderNotificationService {\n\n    // Khong chan luong xu ly request tao don hang - gui email chay tren luong khac.\n    @Async\n    public void sendConfirmationEmail(Long orderId) {\n        emailClient.send(orderId);\n    }\n\n    // Method @Async tra ve gia tri phai dung CompletableFuture (khong duoc tra ve kieu thuong).\n    @Async\n    public CompletableFuture\u003cBoolean\u003e updateInventory(Long orderId) {\n        boolean updated = inventoryClient.reserve(orderId);\n        return CompletableFuture.completedFuture(updated);\n    }\n\n    private final EmailClient emailClient = new EmailClient();\n    privat
