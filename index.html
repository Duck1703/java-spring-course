 = \"application/json\")\n    ResponseEntity\u003cjava.util.List\u003cProduct\u003e\u003e search(\n            @RequestParam(required = false) String category) {\n        var results = category == null\n                ? repository.findAll()\n                : repository.findByCategory(category);\n        return ResponseEntity.ok(results);\n    }\n\n    @PostMapping(consumes = \"application/json\")\n    ResponseEntity\u003cProduct\u003e create(@RequestBody Product product) {\n        Product saved = repository.save(product);\n        return ResponseEntity.status(201).body(saved);\n    }\n}\n","compile":false,"citations":["day16-src-1","day16-src-3","day16-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day16-sec-params","title":"Xử lý tham số: @PathVariable và @RequestParam","blocks":[{"id":"day16-blk-6","type":"paragraph","text":"@PathVariable bắt một hoặc nhiều phần của URI (ví dụ /foos/{fooid}/bar/{barid}) và tự động chuyển kiểu (int, long, Date, ...), ném TypeMismatchException nếu không chuyển được; @RequestParam(\"id\") trích giá trị query parameter trực tiếp. @RequestMapping cũng có thể khai báo thêm params=\"id\" hoặc params={\"id\",\"second\"} để chỉ khớp khi request có (các) parameter đó; request khớp nhiều điều kiện nhất sẽ được chọn.","citations":["day16-src-5","day16-src-6"]},{"id":"day16-blk-7","type":"warning","text":"Khi hai method có cùng HTTP method, URL, parameters, headers và media type, Spring ném IllegalStateException báo ambiguous mapping ngay lúc khởi động ứng dụng (không phải lúc gọi request) — khắc phục bằng cách phân biệt qua produces/consumes khác nhau hoặc đổi URL của một trong hai method.","citations":["day16-src-7"]}]},{"id":"day16-sec-response","title":"ResponseEntity và content negotiation","blocks":[{"id":"day16-blk-8","type":"paragraph","text":"ResponseEntity đại diện cho toàn bộ HTTP response gồm status code, headers và body; controller trả về ResponseEntity để Spring tự động dựng response tương ứng, kiểu generic nên body có thể là bất kỳ kiểu nào. ResponseEntity cung cấp các phương thức tĩnh tiện dụng như ok(), badRequest(), notFound(), status(HttpStatus) kết hợp .body(T) để dựng response ngắn gọn thay vì gọi constructor trực tiếp.","citations":["day16-src-8","day16-src-9"]},{"id":"day16-blk-9","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\nclass OrderQueryController {\n\n    // @ResponseStatus phù hợp khi chỉ cần đặt mã trạng thái cố định cho\n    // response thành công, không cần dùng cả ResponseEntity.\n    @GetMapping(\"/api/orders/{id}/status\")\n    @ResponseStatus(HttpStatus.OK)\n    @ResponseBody\n    String status(@PathVariable String id) {\n        return \"PENDING\";\n    }\n}\n","compile":false,"citations":["day16-src-10"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day16-blk-10","type":"note","text":"Không nên lạm dụng ResponseEntity cho mọi trường hợp: dùng @ResponseBody khi chỉ cần trả dữ liệu (không cần kiểm soát status code/headers), dùng @ResponseStatus khi chỉ cần đặt mã trạng thái tùy chỉnh cho response thành công hoặc exception handler. Thuộc tính consumes thu hẹp mapping theo Content-Type của request, produces thu hẹp theo Accept header/kiểu nội dung trả về; cả hai hỗ trợ phủ định (ví dụ !text/plain) và khi khai báo ở method sẽ override (không cộng dồn) giá trị khai báo ở class.","citations":["day16-src-4","day16-src-10"]}]}],"commonMistakes":["Khai báo hai method mapping trùng hoàn toàn (cùng method/URL/params/headers/media type), gây IllegalStateException lúc khởi động.","Dùng @PathVariable mà không ràng buộc kiểu, nhận TypeMismatchException khi client gửi giá trị sai kiểu.","Lạm dụng ResponseEntity cho mọi endpoint đơn giản thay vì @ResponseBody/@ResponseStatus."],"practices":[{"id":"day16-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Pattern URI nào chỉ khớp đúng một biến path segment được dùng kiểu số (ví dụ chỉ chấp nhận /products/42, không chấp nhận /products/abc)?","choices":[{"id":"day16-prac-1-a","text":"/products/{id:[\\d]+}"},{"id":"day16-prac-1-b","text":"/products/*"},{"id":"day16-prac-1-c","text":"/products/**"},{"id":"day16-prac-1-d","text":"/products/?"}],"correctChoiceIds":["day16-prac-1-a"],"hint":"Đọc lại bảng cú pháp URI pattern trong bài.","solution":"day16-prac-1-a","explanation":"{name:regex} bắt biến path segment theo biểu thức chính quy; {id:[\\d]+} chỉ khớp giá trị gồm toàn chữ số, các lựa chọn còn lại (*, **, ?) chỉ khớp ký tự/segment bất kỳ, không ràng buộc kiểu dữ liệu.","rubric":"Chọn đúng cú pháp {name:regex}, phân biệt với các wildcard * ** ? không ràng buộc kiểu.","sourceUsage":["day16-src-2","day16-src-3"]},{"id":"day16-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một method controller GET /api/products/{id} trả về ResponseEntity\u003cProduct\u003e: 200 kèm body nếu tìm thấy, 404 rỗng nếu không.","choices":[],"correctChoiceIds":[],"hint":"Dùng repository.findById(id) trả về Optional rồi map/orElseGet như ví dụ trong bài.","solution":"@GetMapping(\"/{id}\")\nResponseEntity\u003cProduct\u003e findById(@PathVariable long id) {\n    return repository.findById(id)\n            .map(ResponseEntity::ok)\n            .orElseGet(() -\u003e ResponseEntity.notFound().build());\n}","explanation":"Áp dụng lại mẫu map(ResponseEntity::ok).orElseGet(() -\u003e ResponseEntity.notFound().build()) từ ví dụ trong bài.","rubric":"Đánh giá đúng: có @PathVariable, trả 200 kèm body khi tìm thấy, 404 rỗng khi không tìm thấy.","sourceUsage":["day16-src-8","day16-src-9"]},{"id":"day16-prac-3","type":"concept","interaction":"self-check","prompt":"Hai method controller cùng nhận GET /api/items, không khác gì về params/headers/media type. Điều gì xảy ra lúc khởi động ứng dụng và cách khắc phục?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần cảnh báo về Ambiguous Mapping trong bài.","solution":"Spring ném IllegalStateException báo ambiguous mapping ngay lúc khởi động ứng dụng. Khắc phục bằng cách phân biệt hai method qua produces/consumes khác nhau, hoặc đổi URL của một trong hai method để chúng không còn trùng nhau hoàn toàn.","explanation":"Nhớ lại lỗi ambiguous mapping xảy ra lúc khởi động, không phải lúc gọi request.","rubric":"Đánh giá học viên nêu đúng thời điểm lỗi xảy ra và ít nhất một cách khắc phục hợp lý.","sourceUsage":["day16-src-7"]},{"id":"day16-prac-4","type":"concept","interaction":"self-check","prompt":"Khi nào nên dùng @ResponseStatus + @ResponseBody thay vì ResponseEntity cho một endpoint?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần 'Không nên lạm dụng ResponseEntity' trong bài.","solution":"Nên dùng khi endpoint chỉ cần trả dữ liệu với một mã trạng thái cố định, không cần kiểm soát động (per-request) status code hay headers tùy chỉnh — dùng @ResponseBody để trả dữ liệu và @ResponseStatus để đặt mã trạng thái cố định cho response thành công.","explanation":"Liên kết với khuyến nghị không lạm dụng ResponseEntity đã nêu trong bài.","rubric":"Đánh giá học viên nêu đúng điều kiện: status cố định, không cần điều chỉnh động theo từng request.","sourceUsage":["day16-src-10"]}],"syllabusAssignments":[{"row":29,"text":"Assignment"}],"enhancedExercises":["Thêm consumes/produces cho ProductController.create để chỉ chấp nhận application/json và trả lỗi 415 với Content-Type khác.","Viết test gọi hai endpoint gây ambiguous mapping có chủ ý và sửa bằng produces khác nhau."],"references":[{"id":"day16-ref-1","type":"external","resourceId":"res-2aefb097db80","citationId":"day16-src-1","url":"https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html","label":"Request Mapping","checkStatus":"ok","readStatus":"read","pageTitle":"Mapping Requests :: Spring Framework (docs.spring.io — Annotated Controllers)","limitation":null},{"id":"day16-ref-2","type":"external","resourceId":"res-06dd51e41e25","citationId":"day16-src-8","url":"https://www.baeldung.com/spring-response-entity","label":"ResponseEntity","checkStatus":"ok","readStatus":"read","pageTitle":"Using Spring ResponseEntity to Manipulate the HTTP Response | Baeldung","limitation":null},{"id":"day16-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":6,"unitTitle":"Spring MVC — In-Depth REST API"},{"id":"day-17","unitId":"unit-06","group":"spring","kind":"theory","title":"Validation \u0026 Exception Handling","summary":"Bean Validation với @Valid/jakarta.validation.constraints, xử lý MethodArgumentNotValidException; định nghĩa custom validator (@Constraint + ConstraintValidator, kể cả validate cấp class); @RestControllerAdvice và ProblemDetail (RFC 7807) để chuẩn hóa response lỗi, kèm ghi chú về tên gọi RFC 9457 sau này.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Đã học Day 16 (controller, @RequestBody, ResponseEntity) — validation và exception handling áp dụng trực tiếp lên các controller đã xây dựng."],"outcomes":["Gắn đúng constraint Bean Validation và dùng @Valid trên @RequestBody.","Viết được custom validator (annotation + ConstraintValidator), kể cả validate cấp class.","Xử lý lỗi tập trung bằng @RestControllerAdvice thay vì try/catch rải rác từng controller.","Trả về ProblemDetail chuẩn hóa theo RFC 7807 cho các lỗi API."],"sections":[{"id":"day17-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day17-blk-1","type":"deliverable","text":"Guides/Review","citations":[]},{"id":"day17-blk-2","type":"note","text":"Bài học về Bean Validation (jakarta.validation), custom validator, xử lý lỗi tập trung bằng @RestControllerAdvice, và ProblemDetail (định dạng lỗi chuẩn hóa). Lịch học ngày nay ghi 'Guides/Review' — học viên ôn tập và thực hành lại ví dụ.","citations":[]}]},{"id":"day17-sec-bean-validation","title":"Bean Validation với @Valid","blocks":[{"id":"day17-blk-3","type":"paragraph","text":"Các trường của đối tượng request được gắn constraint như @NotBlank(message=...) để yêu cầu giá trị không rỗng sau khi trim; Hibernate Validator là cài đặt tham chiếu chuẩn Bean Validation mà Spring Boot dùng mặc định. Từ Spring Boot 2.3, phải khai báo tường minh dependency spring-boot-starter-validation (ngoài spring-boot-starter-web) thì Bean Validation mới hoạt động được.","citations":["day17-src-1","day17-src-4"]},{"id":"day17-blk-4","type":"code","language":"java","code":"import jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\n\nrecord CreateUserRequest(\n        @NotBlank(message = \"username không được để trống\") String username,\n        @Email(message = \"email không hợp lệ\") String email) {\n}\n\nimport jakarta.validation.Valid;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/users\")\nclass UserController {\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    UserView create(@Valid @RequestBody CreateUserRequest request) {\n        return new UserView(request.username(), request.email());\n    }\n}\n\nrecord UserView(String username, String email) {\n}\n","compile":false,"citations":["day17-src-1","day17-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day17-blk-5","type":"paragraph","text":"Khi tham số @RequestBody của phương thức controller được gắn @Valid, Spring Boot tự bootstrap Hibernate Validator để kiểm tra; nếu đối tượng không hợp lệ, Spring Boot ném MethodArgumentNotValidException. Một phương thức gắn @ExceptionHandler(MethodArgumentNotValidException.class) cùng @ResponseStatus(BAD_REQUEST) có thể duyệt ex.getBindingResult().getAllErrors() để gom tên trường và thông điệp lỗi vào Map trả về client dạng JSON.","citations":["day17-src-2","day17-src-3"]}]},{"id":"day17-sec-custom-validator","title":"Custom Validator","blocks":[{"id":"day17-blk-6","type":"paragraph","text":"Một constraint tùy chỉnh được định nghĩa bằng @interface gắn @Constraint(validatedBy = ...Validator.class), kèm các thuộc tính chuẩn message()/groups()/payload() theo quy ước Bean Validation. Lớp validator implement ConstraintValidator\u003cAnnotation, KieuDuLieu\u003e và override isValid(value, context) để trả về true/false theo quy tắc tự định nghĩa.","citations":["day17-src-5","day17-src-6"]},{"id":"day17-blk-7","type":"code","language":"java","code":"import jakarta.validation.Constraint;\nimport jakarta.validation.Payload;\nimport java.lang.annotation.*;\n\n@Target({ElementType.FIELD, ElementType.PARAMETER})\n@Retention(RetentionPolicy.RUNTIME)\n@Constraint(validatedBy = PhoneNumberValidator.class)\n@interface ValidPhoneNumber {\n    String message() default \"số điện thoại không hợp lệ\";\n    Class\u003c?\u003e[] groups() default {};\n    Class\u003c? extends Payload\u003e[] payload() default {};\n}\n\nimport jakarta.validation.ConstraintValidator;\nimport jakarta.validation.ConstraintValidatorContext;\n\nclass PhoneNumberValidator implements ConstraintValidator\u003cValidPhoneNumber, String\u003e {\n    @Override\n    public boolean isValid(String value, ConstraintValidatorContext context) {\n        return value != null \u0026\u0026 value.matches(\"\\\\d{9,11}\");\n    }\n}\n","compile":false,"citations":["day17-src-5","day17-src-6"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day17-blk-8","type":"note","text":"Một annotation gắn ở @Target(TYPE) như FieldsValueMatch cho phép so sánh giá trị của hai field trong cùng lớp (ví dụ password và verifyPassword phải khớp nhau), dùng BeanWrapperImpl để đọc giá trị field theo tên trong isValid() — hữu ích khi một constraint cần xét nhiều field cùng lúc thay vì từng field riêng lẻ.","citations":["day17-src-7"]}]},{"id":"day17-sec-problem-detail","title":"@RestControllerAdvice và ProblemDetail (RFC 7807)","blocks":[{"id":"day17-blk-9","type":"paragraph","text":"ProblemDetail là một phần của chuẩn RFC 7807, định nghĩa cấu trúc phản hồi lỗi thống nhất gồm các trường type, title, status, detail, instance — giúp client hiểu và xử lý lỗi nhất quán giữa nhiều API. Trước khi có ProblemDetail, các dự án thường tự định nghĩa cấu trúc response lỗi riêng bằng custom exception handler/response entity, dẫn tới thiếu nhất quán giữa các API và nhiều code lặp lại.","citations":["day17-src-8","day17-src-11"]},{"id":"day17-blk-10","type":"note","text":"Mục syllabus ghi 'ProblemDetail (RFC 9457)'; tuy nhiên nguồn tài liệu đã đọc cho Day 17 mô tả ProblemDetail theo RFC 7807 (chưa có fact nào trong resourceIds của Day 17 nhắc RFC 9457) — bài này trích dẫn đúng theo nội dung nguồn (RFC 7807). Ghi chú thêm (không cần trích dẫn vì đây không phải một khẳng định kỹ thuật cần nguồn riêng — chỉ là bối cảnh đặt tên chuẩn): RFC 9457 là bản cập nhật sau này thay thế/obsolete RFC 7807 cho cùng đặc tả ProblemDetail.","citations":[]},{"id":"day17-blk-11","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.web.bind.MethodArgumentNotValidException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\nclass GlobalExceptionHandler {\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ProblemDetail handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.BAD_REQUEST, \"Dữ liệu request không hợp lệ\");\n        problem.setTitle(\"Validation failed\");\n        return problem;\n    }\n}\n","compile":false,"citations":["day17-src-10"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day17-blk-12","type":"important","text":"Có thể đặt spring.mvc.problemdetails.enabled=true (ứng dụng servlet/MVC) hoặc spring.webflux.problemdetails.enabled=true (ứng dụng reactive) để Spring Boot tự trả lỗi theo định dạng ProblemDetail mà không cần code thêm; khi tự viết, một class @RestControllerAdvice kế thừa ResponseEntityExceptionHandler có thể định nghĩa method @ExceptionHandler trả về ProblemDetail dựng bằng ProblemDetail.forStatusAndDetail(status, message), có thể gọi thêm setInstance(URI) để chỉ rõ ngữ cảnh lỗi.","citations":["day17-src-9","day17-src-10"]}]}],"commonMistakes":["Quên dependency spring-boot-starter-validation nên @Valid không có tác dụng.","Xử lý lỗi validate rải rác trong từng controller thay vì gom vào @RestControllerAdvice.","Tự định nghĩa cấu trúc JSON lỗi riêng cho mỗi API thay vì dùng ProblemDetail chuẩn hóa."],"practices":[{"id":"day17-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Từ Spring Boot 2.3, dependency nào phải được khai báo tường minh để Bean Validation hoạt động (ngoài spring-boot-starter-web)?","choices":[{"id":"day17-prac-1-a","text":"spring-boot-starter-validation"},{"id":"day17-prac-1-b","text":"spring-boot-starter-actuator"},{"id":"day17-prac-1-c","text":"spring-boot-starter-security"},{"id":"day17-prac-1-d","text":"spring-boot-starter-aop"}],"correctChoiceIds":["day17-prac-1-a"],"hint":"Đọc lại fact về 'Dependency cần thiết từ Boot 2.3' trong bài.","solution":"day17-prac-1-a","explanation":"Tài liệu xác nhận từ Spring Boot 2.3, phải khai báo tường minh spring-boot-starter-validation thì Bean Validation mới hoạt động.","rubric":"Chọn đúng tên starter, không nhầm với các starter khác không liên quan validation.","sourceUsage":["day17-src-4"]},{"id":"day17-prac-2","type":"coding","interaction":"self-check","prompt":"Sửa CreateUserRequest để thêm field age (int) với ràng buộc giá trị tối thiểu là 18 tuổi.","choices":[],"correctChoiceIds":[],"hint":"Dùng @Min(18) của jakarta.validation.constraints trên tham số age.","solution":"record CreateUserRequest(\n        @NotBlank String username,\n        @Email String email,\n        @jakarta.validation.constraints.Min(18) int age) {\n}","explanation":"Áp dụng đúng annotation @Min(18) từ jakarta.validation.constraints, giữ nguyên 2 field có sẵn.","rubric":"Đánh giá đúng: thêm field age kiểu int với @Min(18), không làm mất @NotBlank/@Email ở hai field cũ.","sourceUsage":["day17-src-1"]},{"id":"day17-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao nên trả lỗi bằng ProblemDetail thay vì tự định nghĩa một cấu trúc JSON lỗi riêng cho từng API?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần so sánh với cách xử lý lỗi truyền thống trong bài.","solution":"Vì trước khi có ProblemDetail, các dự án thường tự định nghĩa cấu trúc response lỗi riêng, dẫn tới thiếu nhất quán giữa các API và nhiều code lặp lại; ProblemDetail chuẩn hóa cấu trúc (type, title, status, detail, instance) theo RFC 7807, giúp client xử lý lỗi nhất quán giữa nhiều API khác nhau.","explanation":"Nêu đúng lý do nhất quán/tái sử dụng, dựa vào so sánh với cách làm truyền thống.","rubric":"Đánh giá học viên nêu đúng vấn đề của cách làm truyền thống (thiếu nhất quán, lặp code) mà ProblemDetail giải quyết.","sourceUsage":["day17-src-8","day17-src-11"]},{"id":"day17-prac-4","type":"concept","interaction":"self-check","prompt":"Một constraint cần so sánh hai field password và verifyPassword trong cùng một lớp. Nên gắn @Target ở đâu và cần kỹ thuật gì để đọc giá trị field theo tên trong isValid()?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần Validate ở cấp class trong bài.","solution":"Gắn @Target(TYPE) trên annotation (áp dụng cho cả lớp, không phải từng field riêng lẻ); trong isValid(), dùng BeanWrapperImpl để đọc giá trị từng field theo tên rồi so sánh, thay vì validator chỉ nhận được giá trị của một field đơn lẻ.","explanation":"Nhớ lại ví dụ FieldsValueMatch và kỹ thuật BeanWrapperImpl trong bài.","rubric":"Đánh giá đúng cả hai ý: @Target(TYPE) và BeanWrapperImpl.","sourceUsage":["day17-src-7"]}],"syllabusAssignments":[],"enhancedExercises":["Viết một @Constraint cấp class FieldsValueMatch cho password/verifyPassword và áp dụng vào CreateUserRequest.","Bật spring.mvc.problemdetails.enabled=true và so sánh response lỗi mặc định với ProblemDetail tự viết trong GlobalExceptionHandler."],"references":[{"id":"day17-ref-1","type":"external","resourceId":"res-1f904f56cc5a","citationId":"day17-src-1","url":"https://www.baeldung.com/spring-boot-bean-validation","label":"Bean Validation","checkStatus":"ok","readStatus":"read","pageTitle":"Validation in Spring Boot | Baeldung","limitation":null},{"id":"day17-ref-2","type":"external","resourceId":"res-8a73cd80ad49","citationId":"day17-src-8","url":"https://www.baeldung.com/spring-boot-return-errors-problemdetail","label":"ProblemDetail (RFC 9457)","checkStatus":"ok","readStatus":"read","pageTitle":"Returning Errors Using ProblemDetail in Spring Boot | Baeldung","limitation":null},{"id":"day17-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":6,"unitTitle":"Spring MVC — In-Depth REST API"},{"id":"day-18","unitId":"unit-06","group":"spring","kind":"lab","title":"- Lab 6: User \u0026 Task Management API","summary":"Lab 6 — User \u0026 Task Management API: CRUD Task (title/description/status/priority/dueDate) với @RequestMapping/@PathVariable, validation cơ bản (title notBlank, dueDate future) kết hợp custom validator @ValidStatusTransition (validate cấp class kiểm tra chuyển trạng thái hợp lệ), và global exception handler trả về ProblemDetail.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Đã học Day 16 (controller/mapping/ResponseEntity) và Day 17 (Bean Validation, custom validator, @RestControllerAdvice, ProblemDetail)."],"outcomes":["Xây dựng đầy đủ CRUD endpoint cho Task với mapping/path variable đúng quy ước đã học.","Kết hợp Bean Validation cơ bản với một custom validator cấp class cho logic nghiệp vụ riêng (chuyển trạng thái).","Tập trung xử lý lỗi bằng @RestControllerAdvice trả về ProblemDetail nhất quán.","Mô tả được quy trình xuất Postman collection để chia sẻ/kiểm thử API."],"sections":[{"id":"day18-sec-brief","title":"Đề bài Lab 6","blocks":[{"id":"day18-blk-1","type":"deliverable","text":"- Lab 6: User \u0026 Task Management API\n  - CRUD Task: title, description, status (TODO/IN_PROGRESS/DONE), priority, dueDate\n  - Validation: title notBlank, dueDate in future, valid status transition\n  - Custom validator: @ValidStatusTransition\n  - Global exception handler ProblemDetail\n  - Postman collection export","citations":[]}]},{"id":"day18-sec-crud","title":"CRUD Task với @RequestMapping/@PathVariable","blocks":[{"id":"day18-blk-2","type":"paragraph","text":"TaskController dùng @RequestMapping cấp class ('/api/tasks') và các shortcut theo HTTP method (@GetMapping/@PostMapping/@PutMapping) cho từng thao tác CRUD; biến path {id} được bắt qua @PathVariable, ràng buộc {id:[\\d]+} để chỉ khớp id dạng số, tương tự mẫu đã học ở Day 16.","citations":["day18-src-1","day18-src-2"]},{"id":"day18-blk-3","type":"code","language":"java","code":"import jakarta.validation.constraints.Future;\nimport jakarta.validation.constraints.NotBlank;\nimport java.time.LocalDate;\n\nenum TaskStatus { TODO, IN_PROGRESS, DONE }\n\nenum TaskPriority { LOW, MEDIUM, HIGH }\n\n// title không được để trống, dueDate phải là ngày trong tương lai.\nrecord TaskRequest(\n        @NotBlank(message = \"title không được để trống\") String title,\n        String description,\n        TaskStatus status,\n        TaskPriority priority,\n        @Future(message = \"dueDate phải ở tương lai\") LocalDate dueDate) {\n}\n","compile":false,"citations":["day18-src-3"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day18-blk-4","type":"code","language":"java","code":"import jakarta.validation.Valid;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/tasks\")\nclass TaskController {\n\n    private final TaskRepository repository;\n\n    TaskController(TaskRepository repository) {\n        this.repository = repository;\n    }\n\n    @GetMapping(\"/{id:[\\\\d]+}\")\n    ResponseEntity\u003cTask\u003e findById(@PathVariable long id) {\n        return repository.findById(id)\n                .map(ResponseEntity::ok)\n                .orElseGet(() -\u003e ResponseEntity.notFound().build());\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    Task create(@Valid @RequestBody TaskRequest request) {\n        return repository.save(Task.from(request));\n    }\n\n    @PutMapping(\"/{id:[\\\\d]+}/status\")\n    Task updateStatus(@PathVariable long id,\n            @Valid @RequestBody StatusUpdateRequest request) {\n        return repository.updateStatus(id, request.status());\n    }\n}\n","compile":false,"citations":["day18-src-1","day18-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day18-blk-5","type":"note","text":"Ràng buộc cơ bản title notBlank (@NotBlank) và dueDate phải ở tương lai (@Future) dùng annotation Bean Validation chuẩn của jakarta.validation.constraints; hai annotation này không có resource nào trong resourceIds của riêng Day 18 mô tả (chúng thuộc resourceIds của Day 17, nơi Bean Validation cơ bản đã được trích dẫn đầy đủ) — Day 18 tập trung trích dẫn phần validate cấp class và ProblemDetail, là phần mới so với Day 17.","citations":[]}]},{"id":"day18-sec-custom-validator","title":"Custom validator @ValidStatusTransition","blocks":[{"id":"day18-blk-6","type":"paragraph","text":"Một constraint tùy chỉnh được định nghĩa bằng @interface gắn @Constraint(validatedBy = ...Validator.class); lớp validator implement ConstraintValidator\u003cAnnotation, KieuDuLieu\u003e và override isValid(value, context). @ValidStatusTransition áp dụng tương tự: gắn @Target(TYPE) để constraint có thể đọc đồng thời cả currentStatus và status từ cùng một request, rồi kiểm tra chuyển trạng thái có nằm trong tập chuyển hợp lệ hay không (TODO -\u003e IN_PROGRESS -\u003e DONE, cho phép lùi IN_PROGRESS -\u003e TODO, không cho chuyển tiếp từ DONE).","citations":["day18-src-3","day18-src-4"]},{"id":"day18-blk-7","type":"code","language":"java","code":"import jakarta.validation.Constraint;\nimport jakarta.validation.ConstraintValidator;\nimport jakarta.validation.ConstraintValidatorContext;\nimport jakarta.validation.Payload;\nimport java.lang.annotation.*;\nimport java.util.Map;\nimport java.util.Set;\n\n@Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@Constraint(validatedBy = StatusTransitionValidator.class)\n@interface ValidStatusTransition {\n    String message() default \"chuyển trạng thái không hợp lệ\";\n    Class\u003c?\u003e[] groups() default {};\n    Class\u003c? extends Payload\u003e[] payload() default {};\n}\n\nrecord StatusUpdateRequest(TaskStatus currentStatus, TaskStatus status) {\n}\n\n// @Target(TYPE): constraint xét cả hai field currentStatus và status\n// của cùng một đối tượng, không thể xét từng field riêng lẻ.\n@ValidStatusTransition\nclass StatusTransitionValidator\n        implements ConstraintValidator\u003cValidStatusTransition, StatusUpdateRequest\u003e {\n\n    private static final Map\u003cTaskStatus, Set\u003cTaskStatus\u003e\u003e ALLOWED = Map.of(\n            TaskStatus.TODO, Set.of(TaskStatus.IN_PROGRESS),\n            TaskStatus.IN_PROGRESS, Set.of(TaskStatus.DONE, TaskStatus.TODO),\n            TaskStatus.DONE, Set.of());\n\n    @Override\n    public boolean isValid(StatusUpdateRequest value, ConstraintValidatorContext context) {\n        if (value == null || value.currentStatus() == null || value.status() == null) {\n            return false;\n        }\n        return ALLOWED.getOrDefault(value.currentStatus(), Set.of()).contains(value.status());\n    }\n}\n","compile":false,"citations":["day18-src-3","day18-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day18-sec-exception-handler","title":"Global exception handler với ProblemDetail","blocks":[{"id":"day18-blk-8","type":"paragraph","text":"TaskExceptionHandler là một @RestControllerAdvice tập trung xử lý lỗi cho toàn bộ TaskController: dùng ProblemDetail.forStatusAndDetail(status, message) để dựng phản hồi lỗi thống nhất (type/title/status/detail/instance) thay vì tự định nghĩa cấu trúc JSON lỗi riêng cho từng trường hợp, áp dụng đúng mẫu đã học ở Day 17.","citations":["day18-src-5","day18-src-6"]},{"id":"day18-blk-9","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.web.bind.MethodArgumentNotValidException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\nclass TaskExceptionHandler {\n\n    @ExceptionHandler(TaskNotFoundException.class)\n    ProblemDetail handleNotFound(TaskNotFoundException ex) {\n        return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, ex.getMessage());\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ProblemDetail handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.BAD_REQUEST, \"Dữ liệu Task không hợp lệ\");\n        problem.setTitle(\"Task validation failed\");\n        return problem;\n    }\n}\n\nclass TaskNotFoundException extends RuntimeException {\n    TaskNotFoundException(long id) {\n        super(\"Không tìm thấy Task với id=\" + id);\n    }\n}\n","compile":false,"citations":["day18-src-5"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day18-sec-postman","title":"Postman collection export","blocks":[{"id":"day18-blk-10","type":"note","text":"Yêu cầu xuất Postman collection không có resource nào trong resourceIds của Day 18 mô tả (xem authoring.limitations). Cách làm phổ biến: gọi thử từng endpoint CRUD Task trong Postman, gom các request lại thành một Collection, dùng tính năng 'Export' của Postman để xuất file .json chứa toàn bộ request/ví dụ response, lưu kèm repository để nhóm khác/CI có thể import lại và chạy smoke test.","citations":[]}]}],"commonMistakes":["Gắn @ValidStatusTransition ở @Target(FIELD) khiến validator không đọc được cả hai field cần so sánh.","Quên xử lý TaskNotFoundException trong @RestControllerAdvice, để lỗi 500 mặc định lộ ra ngoài thay vì ProblemDetail 404 rõ ràng.","Cho phép chuyển trạng thái tùy ý (ví dụ DONE -\u003e TODO) mà không kiểm tra qua ALLOWED map."],"practices":[{"id":"day18-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Theo StatusTransitionValidator trong bài, chuyển trạng thái nào dưới đây là KHÔNG hợp lệ?","choices":[{"id":"day18-prac-1-a","text":"DONE -\u003e IN_PROGRESS"},{"id":"day18-prac-1-b","text":"TODO -\u003e IN_PROGRESS"},{"id":"day18-prac-1-c","text":"IN_PROGRESS -\u003e DONE"},{"id":"day18-prac-1-d","text":"IN_PROGRESS -\u003e TODO"}],"correctChoiceIds":["day18-prac-1-a"],"hint":"Xem lại bảng ALLOWED trong StatusTransitionValidator.","solution":"day18-prac-1-a","explanation":"Trong ALLOWED map của ví dụ, TaskStatus.DONE ánh xạ tới Set.of() (tập rỗng) — nghĩa là từ DONE không được phép chuyển sang bất kỳ trạng thái nào khác, nên DONE -\u003e IN_PROGRESS là không hợp lệ.","rubric":"Đối chiếu từng lựa chọn với Map ALLOWED trong code ví dụ; đánh giá đúng nếu nhận ra DONE là trạng thái cuối (không có chuyển tiếp hợp lệ).","sourceUsage":["day18-src-3","day18-src-4"]},{"id":"day18-prac-2","type":"coding","interaction":"self-check","prompt":"Thêm một @GetMapping('') trên TaskController trả về ResponseEntity\u003cList\u003cTask\u003e\u003e toàn bộ task, tương tự mẫu search ở Day 16.","choices":[],"correctChoiceIds":[],"hint":"Dùng @GetMapping không tham số, gọi repository.findAll(), bọc trong ResponseEntity.ok().","solution":"@GetMapping\nResponseEntity\u003cjava.util.List\u003cTask\u003e\u003e findAll() {\n    return ResponseEntity.ok(repository.findAll());\n}","explanation":"Áp dụng lại mẫu ResponseEntity.ok(...) đã học ở Day 16 vào TaskController.","rubric":"Đánh giá đúng: có @GetMapping cấp class, trả ResponseEntity.ok với danh sách Task.","sourceUsage":["day18-src-1"]},{"id":"day18-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao @ValidStatusTransition được gắn @Target(ElementType.TYPE) thay vì @Target(ElementType.FIELD) như @ValidPhoneNumber ở Day 17?","choices":[],"correctChoiceIds":[],"hint":"So sánh số field mà constraint cần đọc để kiểm tra.","solution":"Vì constraint cần đọc đồng thời hai field (currentStatus và status) từ cùng một đối tượng StatusUpdateRequest để so sánh chuyển trạng thái có hợp lệ hay không; @Target(FIELD) chỉ cho phép validator xét giá trị của một field đơn lẻ, không đủ để kiểm tra quan hệ giữa hai field.","explanation":"Liên kết với lý do dùng @Target(TYPE) cho validate cấp class đã học ở Day 17.","rubric":"Đánh giá học viên nêu đúng lý do cần đọc nhiều field cùng lúc.","sourceUsage":["day18-src-3","day18-src-4"]},{"id":"day18-prac-4","type":"concept","interaction":"self-check","prompt":"TaskExceptionHandler nên trả về HTTP status nào cho TaskNotFoundException và vì sao dùng ProblemDetail thay vì tự định nghĩa một Map lỗi riêng?","choices":[],"correctChoiceIds":[],"hint":"Xem lại code handleNotFound trong bài và lý do dùng ProblemDetail chuẩn hóa.","solution":"Nên trả về HTTP 404 (NOT_FOUND), dùng ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, ex.getMessage()) để đảm bảo cấu trúc lỗi (type/title/status/detail/instance) thống nhất với các lỗi khác trong cùng API, thay vì mỗi loại lỗi lại có một định dạng JSON riêng gây khó cho client xử lý.","explanation":"Kết nối với HTTP status 404 chuẩn cho 'không tìm thấy tài nguyên' và lợi ích chuẩn hóa của ProblemDetail.","rubric":"Đánh giá đúng cả hai ý: status 404 và lý do chọn ProblemDetail (nhất quán cấu trúc lỗi).","sourceUsage":["day18-src-5","day18-src-6"]}],"syllabusAssignments":[{"row":32,"text":"- Lab 6: User \u0026 Task Management API\n  - CRUD Task: title, description, status (TODO/IN_PROGRESS/DONE), priority, dueDate\n  - Validation: title notBlank, dueDate in future, valid status transition\n  - Custom validator: @ValidStatusTransition\n  - Global exception handler ProblemDetail\n  - Postman collection export"}],"enhancedExercises":["Thêm endpoint DELETE /api/tasks/{id} và xử lý TaskNotFoundException nhất quán với các endpoint còn lại.","Viết test cho StatusTransitionValidator bao phủ cả chuyển hợp lệ và không hợp lệ cho cả 3 trạng thái."],"references":[{"id":"day18-ref-1","type":"external","resourceId":"res-2aefb097db80","citationId":"day18-src-1","url":"https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html","label":"Request Mapping","checkStatus":"ok","readStatus":"read","pageTitle":"Mapping Requests :: Spring Framework (docs.spring.io — Annotated Controllers)","limitation":null},{"id":"day18-ref-2","type":"external","resourceId":"res-8a73cd80ad49","citationId":"day18-src-5","url":"https://www.baeldung.com/spring-boot-return-errors-problemdetail","label":"ProblemDetail (RFC 9457)","checkStatus":"ok","readStatus":"read","pageTitle":"Returning Errors Using ProblemDetail in Spring Boot | Baeldung","limitation":null},{"id":"day18-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":6,"unitTitle":"Spring MVC — In-Depth REST API"},{"id":"day-19","unitId":"unit-07","group":"spring","kind":"theory","title":"Entity Design \u0026 Relationships","summary":"Entity mapping trong JPA: @Entity/@Id/@Table/@Column, @Transient/@Temporal/@Enumerated, quan hệ một chiều và hai chiều (bao gồm @ManyToMany với @JoinTable), CascadeType và orphanRemoval, và FetchType (eager/lazy) cùng cơ chế proxy lazy loading của Hibernate.","durationMinutes":150.0,"objectives":["LO7"],"prerequisites":["Đã hoàn thành Unit 6 (Spring Data JPA cơ bản: Repository, @Query, kết nối database) - bài này đào sâu vào entity mapping và quan hệ mà Unit 6 giả định đã biết ở mức cơ bản."],"outcomes":["Ánh xạ đúng entity JPA bằng @Entity/@Id/@GeneratedValue/@Table/@Column.","Thiết kế đúng quan hệ một chiều, hai chiều, và @ManyToMany với @JoinTable.","Chọn đúng CascadeType và biết khi nào an toàn dùng orphanRemoval.","Giải thích đúng FetchType mặc định theo từng loại quan hệ và rủi ro LazyInitializationException."],"sections":[{"id":"day19-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day19-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day19-blk-2","type":"note","text":"Bài học mở đầu Unit 7 (JPA/Hibernate nâng cao): entity mapping bằng các annotation JPA cốt lõi, các kiểu quan hệ một chiều/hai chiều (bao gồm @ManyToMany), cascade type và orphan removal, và chiến lược fetch (eager/lazy). Assignment của ngày này không có đề bài chi tiết riêng (lịch học chỉ ghi 'Assignment') - học viên ôn tập và thực hành lại các ví dụ trong bài để chuẩn bị cho Assignment 7 (E-Commerce Data Layer) ở Day 21.","citations":[]}]},{"id":"day19-sec-entity","title":"Entity Mapping: @Entity, @Id, @Table, @Column","blocks":[{"id":"day19-blk-3","type":"paragraph","text":"Annotation @Entity đánh dấu một class POJO là entity JPA - class phải có constructor không tham số (public hoặc protected), không được là final, và mọi persistent field/property nên có getter/setter phù hợp. Mỗi entity bắt buộc có annotation @Id để xác định trường khóa chính; chiến lược sinh giá trị khóa chính được khai báo qua @GeneratedValue với các strategy như IDENTITY (dựa vào cột auto-increment của database), SEQUENCE, TABLE, hoặc AUTO (để provider tự chọn chiến lược phù hợp với database đang dùng).","citations":["day19-src-1","day19-src-2"]},{"id":"day19-blk-4","type":"paragraph","text":"@Table cho phép chỉ định tên bảng thực tế trong database khi tên này khác tên class (mặc định nếu không khai báo, provider dùng tên entity làm tên bảng); @Column tuỳ chỉnh ánh xạ một field tới cột cụ thể - tên cột, độ dài, nullable, và các ràng buộc khác. @Transient đánh dấu một field không được persist xuống database (ví dụ giá trị cache tính toán tạm thời); @Temporal chỉ định độ chính xác lưu trữ (DATE/TIME/TIMESTAMP) cho các field kiểu java.util.Date/Calendar; @Enumerated chọn cách lưu enum xuống database - ORDINAL (lưu số thứ tự, dễ vỡ khi thêm/sắp xếp lại hằng số enum) hoặc STRING (lưu tên hằng số, an toàn hơn khi tiến hoá schema).","citations":["day19-src-3","day19-src-4"]},{"id":"day19-blk-5","type":"code","language":"java","code":"import jakarta.persistence.*;\n\n@Entity\n@Table(name = \"products\")\npublic class Product {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(name = \"name\", nullable = false, length = 150)\n    private String name;\n\n    @Column(name = \"unit_price\", nullable = false)\n    private java.math.BigDecimal unitPrice;\n\n    @Temporal(TemporalType.TIMESTAMP)\n    @Column(name = \"created_at\")\n    private java.util.Date createdAt;\n\n    @Enumerated(EnumType.STRING)\n    @Column(name = \"status\", nullable = false)\n    private ProductStatus status;\n\n    @Transient\n    private java.math.BigDecimal discountedPriceCache;\n\n    protected Product() {\n    }\n}\n","compile":false,"citations":["day19-src-1","day19-src-2","day19-src-3","day19-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day19-sec-relationships","title":"Quan hệ một chiều, hai chiều và @ManyToMany","blocks":[{"id":"day19-blk-6","type":"paragraph","text":"Quan hệ một chiều (unidirectional) chỉ có một phía entity biết về entity còn lại - ví dụ ProductEntity giữ tham chiếu tới Category qua @ManyToOne và @JoinColumn, nhưng Category không có field nào trỏ ngược lại danh sách Product. Quan hệ hai chiều (bidirectional) khai báo cả hai phía, và phía 'inverse' (thường là phía @OneToMany) dùng thuộc tính mappedBy để chỉ ra field ở phía sở hữu (owning side) chịu trách nhiệm ánh xạ khoá ngoại - tránh JPA tạo nhầm bảng join trung gian không cần thiết.","citations":["day19-src-5","day19-src-6"]},{"id":"day19-blk-7","type":"paragraph","text":"Với quan hệ nhiều-nhiều (@ManyToMany), một bảng join trung gian là bắt buộc để lưu các cặp khoá ngoại; phía sở hữu khai báo @JoinTable với joinColumns (khoá ngoại trỏ về entity hiện tại) và inverseJoinColumns (khoá ngoại trỏ về entity phía kia), còn phía nghịch đảo chỉ cần mappedBy trỏ về field @ManyToMany của phía sở hữu. So với quan hệ một chiều, quan hệ hai chiều linh hoạt hơn khi cần truy vấn từ cả hai phía nhưng đòi hỏi lập trình viên tự đồng bộ cả hai field khi thêm/xoá phần tử (ví dụ qua các helper method addProduct()/removeProduct()) để tránh trạng thái không nhất quán giữa hai phía trong bộ nhớ.","citations":["day19-src-7","day19-src-8"]},{"id":"day19-blk-8","type":"code","language":"java","code":"import jakarta.persistence.*;\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\npublic class Category {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @OneToMany(mappedBy = \"category\", cascade = CascadeType.PERSIST, orphanRemoval = true)\n    private List\u003cProduct\u003e products = new ArrayList\u003c\u003e();\n}\n\n@Entity\nclass ProductEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"category_id\")\n    private Category category;\n\n    @ManyToMany\n    @JoinTable(\n        name = \"product_tag\",\n        joinColumns = @JoinColumn(name = \"product_id\"),\n        inverseJoinColumns = @JoinColumn(name = \"tag_id\")\n    )\n    private List\u003cTagEntity\u003e tags = new ArrayList\u003c\u003e();\n}\n\n@Entity\nclass TagEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToMany(mappedBy = \"tags\")\n    private List\u003cProductEntity\u003e products = new ArrayList\u003c\u003e();\n}\n","compile":false,"citations":["day19-src-5","day19-src-6","day19-src-7"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day19-sec-cascade","title":"Cascade Type và Orphan Removal","blocks":[{"id":"day19-blk-9","type":"paragraph","text":"CascadeType điều khiển việc một thao tác persistence trên entity cha có được lan truyền (cascade) sang các entity con liên kết hay không. Jakarta Persistence chuẩn hoá sáu loại: ALL (lan truyền mọi thao tác), PERSIST, MERGE, REMOVE, REFRESH, và DETACH. CascadeType.PERSIST lan truyền việc lưu entity con khi entity cha được persist (tiện lợi khi tạo cha-con trong cùng một giao dịch), còn CascadeType.REMOVE lan truyền việc xoá entity con khi entity cha bị xoá - cần cân nhắc kỹ vì có thể xoá nhầm dữ liệu vẫn còn được tham chiếu ở nơi khác.","citations":["day19-src-9","day19-src-10"]},{"id":"day19-blk-10","type":"table","columns":["CascadeType","Ý nghĩa"],"rows":[["ALL","Lan truyền mọi thao tác persistence sang entity con"],["PERSIST","Lan truyền thao tác lưu (persist/save) mới"],["MERGE","Lan truyền thao tác merge trạng thái detached"],["REMOVE","Lan truyền thao tác xoá entity con khi cha bị xoá"],["REFRESH","Lan truyền thao tác nạp lại dữ liệu từ database"],["DETACH","Lan truyền thao tác tách entity khỏi persistence context"]],"citations":["day19-src-9"]},{"id":"day19-blk-11","type":"warning","text":"orphanRemoval = true (thuộc tính riêng của @OneToMany/@OneToOne, không phải một CascadeType) khiến provider tự xoá entity con khỏi database ngay khi nó bị gỡ khỏi collection của entity cha - kể cả khi không gọi remove() tường minh trên entity con. Kết hợp CascadeType.REMOVE với orphanRemoval=true trên một quan hệ có nhiều entity cha có thể trỏ tới cùng entity con (ví dụ quan hệ chia sẻ) sẽ xoá nhầm dữ liệu vẫn đang được entity cha khác tham chiếu - chỉ nên dùng khi entity con thực sự chỉ thuộc về một entity cha duy nhất (quan hệ composition, không phải aggregation).","citations":["day19-src-9","day19-src-10"]}]},{"id":"day19-sec-fetch","title":"FetchType: Eager và Lazy Loading","blocks":[{"id":"day19-blk-12","type":"paragraph","text":"FetchType quyết định thời điểm dữ liệu liên kết được nạp: EAGER nạp ngay cùng lúc với entity chủ (một hoặc nhiều câu SQL bổ sung được thực thi ngay lập tức), còn LAZY trì hoãn việc nạp tới khi field đó thực sự được truy cập lần đầu trong code. Jakarta Persistence quy định FetchType mặc định khác nhau theo loại quan hệ: @ManyToOne và @OneToOne mặc định là EAGER, còn @OneToMany và @ManyToMany mặc định là LAZY - vì quan hệ 'nhiều' tiềm ẩn nguy cơ nạp một tập dữ liệu rất lớn nếu nạp eager.","citations":["day19-src-11","day19-src-12"]},{"id":"day19-blk-13","type":"note","text":"Hibernate hiện thực lazy loading bằng cách trả về một proxy (hoặc collection wrapper) thay vì entity/tập dữ liệu thật; proxy này chỉ truy vấn database khi một phương thức trên nó được gọi lần đầu. Vì cơ chế này gắn với persistence context đang mở, truy cập một field lazy sau khi session/EntityManager đã đóng sẽ ném LazyInitializationException - một trong những lỗi runtime phổ biến nhất khi làm việc với JPA/Hibernate.","citations":["day19-src-13"]}]}],"commonMistakes":["Dùng CascadeType.REMOVE hoặc orphanRemoval=true trên quan hệ mà entity con thực chất được nhiều entity cha chia sẻ (aggregation, không phải composition).","Truy cập field @ManyToOne/@OneToMany LAZY sau khi persistence context đã đóng, gây LazyInitializationException.","Không đồng bộ cả hai phía của quan hệ hai chiều khi thêm/xoá phần tử, dẫn tới trạng thái không nhất quán trong bộ nhớ dù database đã đúng."],"practices":[{"id":"day19-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Trong quan hệ @OneToMany/@ManyToOne hai chiều, thuộc tính mappedBy được khai báo ở đâu và có ý nghĩa gì?","choices":[{"id":"day19-prac-1-a","text":"Khai báo ở phía @OneToMany (phía nghịch đảo), trỏ tên field ở phía sở hữu (@ManyToOne) chịu trách nhiệm ánh xạ khoá ngoại"},{"id":"day19-prac-1-b","text":"Khai báo ở phía @ManyToOne, trỏ tên cột khoá ngoại trong database"},{"id":"day19-prac-1-c","text":"mappedBy chỉ dùng cho @ManyToMany, không dùng cho @OneToMany"},{"id":"day19-prac-1-d","text":"mappedBy thay thế hoàn toàn cho @JoinColumn ở cả hai phía"}],"correctChoiceIds":["day19-prac-1-a"],"hint":"Xem lại phần so sánh quan hệ một chiều và hai chiều trong bài.","solution":"day19-prac-1-a","explanation":"mappedBy được khai báo ở phía nghịch đảo (thường là @OneToMany) và trỏ tới tên field ở phía sở hữu quan hệ (thường là @ManyToOne cùng @JoinColumn) - phía sở hữu mới là phía JPA dùng để ánh xạ khoá ngoại thực tế.","rubric":"Chọn đúng phía khai báo mappedBy và vai trò 'chỉ tên field phía sở hữu' thay vì nhầm với tên cột database.","sourceUsage":["day19-src-6"]},{"id":"day19-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một entity Order có quan hệ @OneToMany hai chiều tới entity OrderItem (mappedBy phù hợp), dùng CascadeType.PERSIST và orphanRemoval=true vì OrderItem chỉ thuộc về đúng một Order.","choices":[],"correctChoiceIds":[],"hint":"OrderItem là composition của Order (không entity cha nào khác chia sẻ nó) nên orphanRemoval an toàn ở đây.","solution":"@Entity\nclass Order {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @OneToMany(mappedBy = \"order\", cascade = CascadeType.PERSIST, orphanRemoval = true)\n    private List\u003cOrderItem\u003e items = new ArrayList\u003c\u003e();\n}\n\n@Entity\nclass OrderItem {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"order_id\")\n    private Order order;\n}","explanation":"Áp dụng lại mẫu quan hệ hai chiều mappedBy kèm cascade/orphanRemoval đã học trong bài.","rubric":"Đánh giá đúng: mappedBy trỏ đúng field 'order' ở OrderItem, orphanRemoval=true chỉ dùng vì quan hệ composition, @ManyToOne khai báo fetch LAZY tường minh.","sourceUsage":["day19-src-6","day19-src-9"]},{"id":"day19-prac-3","type":"concept","interaction":"self-check","prompt":"orphanRemoval khác CascadeType.REMOVE ở điểm nào, và tại sao kết hợp cả hai lại nguy hiểm với entity con được nhiều entity cha chia sẻ?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về sự khác biệt giữa 'entity cha bị xoá' và 'entity con bị gỡ khỏi collection'.","solution":"CascadeType.REMOVE chỉ lan truyền việc xoá entity con khi chính entity cha bị xoá; orphanRemoval xoá entity con ngay khi nó bị gỡ khỏi collection của cha, kể cả khi cha không bị xoá. Nếu entity con thực chất được nhiều entity cha tham chiếu (aggregation thay vì composition), kết hợp cả hai sẽ xoá nhầm dữ liệu đang còn được cha khác dùng chỉ vì nó bị gỡ khỏi collection của một cha.","explanation":"Phân biệt rõ mốc kích hoạt: xoá cha (CascadeType.REMOVE) so với gỡ khỏi collection (orphanRemoval).","rubric":"Đánh giá học viên nêu đúng hai mốc kích hoạt khác nhau và rủi ro với quan hệ chia sẻ.","sourceUsage":["day19-src-9","day19-src-10"]},{"id":"day19-prac-4","type":"concept","interaction":"multiple-choice","prompt":"Theo Jakarta Persistence, FetchType mặc định của @OneToMany và @ManyToMany là gì, và vì sao?","choices":[{"id":"day19-prac-4-a","text":"LAZY, vì quan hệ 'nhiều' có thể chứa tập dữ liệu lớn nên tránh nạp toàn bộ ngay lập tức"},{"id":"day19-prac-4-b","text":"EAGER, giống hệt @ManyToOne và @OneToOne"},{"id":"day19-prac-4-c","text":"Không có mặc định, bắt buộc phải khai báo fetch tường minh"},{"id":"day19-prac-4-d","text":"LAZY chỉ áp dụng cho @ManyToMany, còn @OneToMany mặc định EAGER"}],"correctChoiceIds":["day19-prac-4-a"],"hint":"Đối chiếu bảng FetchType mặc định theo từng loại quan hệ trong bài.","solution":"day19-prac-4-a","explanation":"Jakarta Persistence quy định @OneToMany và @ManyToMany mặc định LAZY (khác với @ManyToOne/@OneToOne mặc định EAGER) vì phía 'nhiều' tiềm ẩn nguy cơ nạp một tập dữ liệu rất lớn nếu nạp eager ngay lập tức.","rubric":"Chọn đúng giá trị mặc định LAZY và lý do liên quan tới kích thước tập dữ liệu tiềm năng.","sourceUsage":["day19-src-12"]}],"syllabusAssignments":[{"row":34,"text":"Assignment"}],"enhancedExercises":["Viết helper method addProduct()/removeProduct() trên Category để đồng bộ cả hai phía của quan hệ @OneToMany/@ManyToOne khi thêm/xoá.","Thử đổi @Enumerated từ STRING sang ORDINAL trên một entity có sẵn, thêm một hằng số enum mới vào giữa danh sách, và quan sát dữ liệu cũ bị đọc sai nghĩa."],"references":[{"id":"day19-ref-1","type":"external","resourceId":"res-01d4c9bc1c9c","citationId":"day19-src-1","url":"https://www.baeldung.com/jpa-entities","label":"JPA Entities","checkStatus":"ok","readStatus":"read","pageTitle":"Defining JPA Entities | Baeldung","limitation":null},{"id":"day19-ref-2","type":"external","resourceId":"res-d20f2a5470d7","citationId":"day19-src-5","url":"https://www.baeldung.com/jpa-hibernate-associations","label":"JPA Associations","checkStatus":"ok","readStatus":"read","pageTitle":"Understanding JPA/Hibernate Associations | Baeldung","limitation":null},{"id":"day19-ref-3","type":"external","resourceId":"res-cf695e39df80","citationId":"day19-src-9","url":"https://www.baeldung.com/jpa-cascade-types","label":"JPA Cascade Types","checkStatus":"ok","readStatus":"read","pageTitle":"Overview of JPA/Hibernate Cascade Types. | Baeldung","limitation":null},{"id":"day19-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":7,"unitTitle":"Spring Data JPA \u0026 Database"},{"id":"day-20","unitId":"unit-07","group":"spring","kind":"theory","title":"Query, Transaction \u0026 Patterns","summary":"Repository nâng cao với PagingAndSortingRepository, PageRequest/Pageable, so sánh Page\u003cT\u003e và Slice\u003cT\u003e; nền tảng quản lý giao dịch bằng @Transactional; và ba cách ghi lại lịch sử thay đổi dữ liệu (callback JPA thuần, Spring Data JPA auditing, Hibernate Envers).","durationMinutes":150.0,"objectives":["LO7"],"prerequisites":["Đã hoàn thành Day 19 (Entity Design \u0026 Relationships) - bài này dùng lại các entity/quan hệ đã thiết kế để minh hoạ truy vấn, giao dịch, và auditing."],"outcomes":["Viết đúng repository dùng PagingAndSortingRepository và chọn Page\u003cT\u003e hoặc Slice\u003cT\u003e phù hợp ngữ cảnh.","Giải thích đúng vai trò của @Transactional và quy tắc rollback mặc định của Spring.","So sánh được ba cách auditing (callback JPA, Spring Data auditing, Envers) và biết khi nào dùng cách nào."],"sections":[{"id":"day20-sec-brief","title":"Phạm vi buổi Guides/Review","blocks":[{"id":"day20-blk-1","type":"note","text":"Ngày học không có Assignment riêng (lịch chỉ ghi 'Guides/Review') - đây là buổi ôn tập có trainer đồng hành, tổng hợp lại các mẫu truy vấn/giao dịch/auditing sẽ dùng trực tiếp trong Assignment 7 (E-Commerce Data Layer) ở Day 21: repository nâng cao với phân trang/sắp xếp, quản lý giao dịch với @Transactional, và các chiến lược ghi lại lịch sử thay đổi dữ liệu (auditing).","citations":[]}]},{"id":"day20-sec-repository","title":"Repository nâng cao: Pagination và Sorting","blocks":[{"id":"day20-blk-2","type":"paragraph","text":"PagingAndSortingRepository mở rộng CrudRepository, bổ sung khả năng truy vấn theo trang thông qua tham số Pageable - một đối tượng gói số trang (page, bắt đầu từ 0), kích thước trang (size), và tuỳ chọn sắp xếp (Sort). PageRequest.of(page, size, sort) là cách phổ biến nhất để tạo Pageable; kết quả trả về kiểu Page\u003cT\u003e mang theo cả nội dung trang hiện tại lẫn metadata (tổng số phần tử, tổng số trang) - để tính được tổng số trang, Page\u003cT\u003e phải thực thi thêm một câu truy vấn COUNT.","citations":["day20-src-1","day20-src-2"]},{"id":"day20-blk-3","type":"paragraph","text":"Slice\u003cT\u003e là lựa chọn nhẹ hơn Page\u003cT\u003e khi không cần biết tổng số phần tử/trang: Slice chỉ truy vấn thêm đúng một phần tử để biết 'còn trang tiếp theo hay không' (hasNext()), tránh câu truy vấn COUNT tốn kém trên bảng lớn - phù hợp cho các giao diện 'tải thêm' (infinite scroll) thay vì hiển thị số trang cụ thể. Có thể kết hợp Sort trực tiếp vào PageRequest.of(...) hoặc truyền riêng Sort.by(...).ascending()/descending() khi cần sắp xếp nhiều tiêu chí.","citations":["day20-src-3","day20-src-4"]},{"id":"day20-blk-4","type":"code","language":"java","code":"import org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.data.domain.Pageable;\nimport org.springframework.data.domain.Sort;\nimport org.springframework.data.repository.PagingAndSortingRepository;\n\ninterface ProductRepository extends PagingAndSortingRepository\u003cProduct, Long\u003e {\n    Page\u003cProduct\u003e findByCategoryId(Long categoryId, Pageable pageable);\n}\n\nclass ProductQueryService {\n    private final ProductRepository repository;\n\n    ProductQueryService(ProductRepository repository) {\n        this.repository = repository;\n    }\n\n    Page\u003cProduct\u003e topOfCategory(Long categoryId, int page, int size) {\n        Pageable pageable = PageRequest.of(page, size, Sort.by(\"unitPrice\").descending());\n        return repository.findByCategoryId(categoryId, pageable);\n    }\n}\n","compile":false,"citations":["day20-src-1","day20-src-2","day20-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day20-sec-transaction","title":"Quản lý giao dịch với @Transactional","blocks":[{"id":"day20-blk-5","type":"note","text":"Chủ đề @Transactional (ranh giới giao dịch, propagation, isolation, quy tắc rollback) không có resource nào trong resourceIds của Day 20 mô tả trực tiếp (xem authoring.limitations). Kiến thức chuẩn của Spring: @Transactional đặt trên method (hoặc class) của tầng service để Spring tự mở giao dịch trước khi method chạy và commit/rollback sau khi method kết thúc; mặc định Spring rollback khi gặp RuntimeException hoặc Error (không tự rollback với checked exception trừ khi khai báo rollbackFor tường minh). Propagation mặc định là REQUIRED (tham gia giao dịch hiện có nếu có, hoặc tạo mới nếu chưa có); các giá trị khác như REQUIRES_NEW (luôn tạo giao dịch mới, tạm dừng giao dịch hiện tại) phù hợp khi cần một thao tác ghi log độc lập, không bị rollback theo giao dịch cha.","citations":[]},{"id":"day20-blk-6","type":"important","text":"CascadeType.LOCK là một giá trị mở rộng riêng của Hibernate (không thuộc chuẩn Jakarta Persistence), dùng để lan truyền thao tác lock (khoá bi quan) sang entity con trong cùng một persistence context. Vì đây là API riêng của Hibernate, dùng nó sẽ làm giảm khả năng chuyển đổi provider JPA khác nếu cần trong tương lai - nên cân nhắc dùng khoá tường minh qua EntityManager.lock() thay vì gắn cứng CascadeType.LOCK vào định nghĩa quan hệ khi không thực sự cần lan truyền tự động.","citations":["day20-src-8"]}]},{"id":"day20-sec-auditing","title":"Auditing: callback JPA, Spring Data, và Envers","blocks":[{"id":"day20-blk-7","type":"paragraph","text":"JPA chuẩn cung cấp các callback vòng đời entity @PrePersist, @PreUpdate, @PreRemove - có thể dùng để tự set field created_at/updated_at ngay trước khi entity được lưu/cập nhật, không cần thư viện bổ sung. Spring Data JPA cung cấp một lớp tiện lợi hơn: bật @EnableJpaAuditing, gắn @EntityListeners(AuditingEntityListener.class) lên entity, rồi dùng @CreatedDate/@LastModifiedDate (và @CreatedBy/@LastModifiedBy khi tích hợp với Spring Security để ghi lại người thực hiện thay đổi) - Spring tự động điền các field này mà không cần viết callback thủ công.","citations":["day20-src-5","day20-src-6"]},{"id":"day20-blk-8","type":"note","text":"Khi cần lưu lại toàn bộ lịch sử thay đổi của một entity (không chỉ lần thay đổi gần nhất) - ví dụ để phục vụ audit log chi tiết hoặc khôi phục dữ liệu về một phiên bản trước - Hibernate Envers cung cấp cơ chế versioning tự động: mỗi lần entity được insert/update/delete, Envers tạo một bản ghi 'revision' trong bảng audit riêng (thường có hậu tố _AUD), cho phép truy vấn lại trạng thái entity tại bất kỳ revision nào trong quá khứ.","citations":["day20-src-7"]},{"id":"day20-blk-9","type":"code","language":"java","code":"import jakarta.persistence.*;\nimport org.springframework.data.annotation.CreatedDate;\nimport org.springframework.data.annotation.LastModifiedDate;\nimport org.springframework.data.jpa.domain.support.AuditingEntityListener;\nimport java.time.Instant;\n\n@Entity\n@EntityListeners(AuditingEntityListener.class)\nclass Order {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @CreatedDate\n    @Column(name = \"created_at\", updatable = false)\n    private Instant createdAt;\n\n    @LastModifiedDate\n    @Column(name = \"updated_at\")\n    private Instant updatedAt;\n}\n","compile":false,"citations":["day20-src-6"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]}],"commonMistakes":["Luôn dùng Page\u003cT\u003e ngay cả khi không cần tổng số trang, gây câu truy vấn COUNT không cần thiết trên bảng lớn.","Kỳ vọng Spring tự rollback với checked exception mà không khai báo rollbackFor tường minh trên @Transactional.","Dùng callback @PrePersist/@PreUpdate khi thực chất cần lưu lại toàn bộ lịch sử thay đổi - chỉ Envers mới lưu từng revision."],"practices":[{"id":"day20-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Khác biệt chính giữa Page\u003cT\u003e và Slice\u003cT\u003e trong Spring Data JPA là gì?","choices":[{"id":"day20-prac-1-a","text":"Page\u003cT\u003e chạy thêm một câu truy vấn COUNT để biết tổng số phần tử/trang; Slice\u003cT\u003e chỉ kiểm tra 'còn trang tiếp theo hay không' nên rẻ hơn"},{"id":"day20-prac-1-b","text":"Slice\u003cT\u003e chỉ dùng được với @Query, còn Page\u003cT\u003e chỉ dùng được với derived query method"},{"id":"day20-prac-1-c","text":"Page\u003cT\u003e và Slice\u003cT\u003e hoàn toàn giống nhau, chỉ khác tên kiểu trả về"},{"id":"day20-prac-1-d","text":"Slice\u003cT\u003e luôn trả về toàn bộ dữ liệu, không phân trang thật"}],"correctChoiceIds":["day20-prac-1-a"],"hint":"Xem lại phần so sánh Page\u003cT\u003e và Slice\u003cT\u003e trong bài.","solution":"day20-prac-1-a","explanation":"Page\u003cT\u003e cần biết tổng số phần tử/trang nên phải chạy thêm truy vấn COUNT; Slice\u003cT\u003e chỉ truy vấn thêm đúng một phần tử để biết hasNext(), tránh COUNT tốn kém trên bảng lớn.","rubric":"Chọn đúng lý do kỹ thuật (truy vấn COUNT bổ sung) thay vì nhầm lẫn về cách khai báo repository.","sourceUsage":["day20-src-3"]},{"id":"day20-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một phương thức repository trả về Page\u003cOrder\u003e theo customerId, sắp xếp theo createdAt giảm dần, dùng PageRequest.of.","choices":[],"correctChoiceIds":[],"hint":"Kết hợp Sort.by(...).descending() vào PageRequest.of(page, size, sort).","solution":"interface OrderRepository extends PagingAndSortingRepository\u003cOrder, Long\u003e {\n    Page\u003cOrder\u003e findByCustomerId(Long customerId, Pageable pageable);\n}\n\nPageable pageable = PageRequest.of(0, 20, Sort.by(\"createdAt\").descending());\nPage\u003cOrder\u003e result = orderRepository.findByCustomerId(customerId, pageable);","explanation":"Áp dụng lại mẫu PageRequest.of kèm Sort đã học trong bài vào một entity khác (Order thay vì Product).","rubric":"Đánh giá đúng: derived query method nhận Pageable, PageRequest.of có tham số sort theo createdAt descending.","sourceUsage":["day20-src-1","day20-src-4"]},{"id":"day20-prac-3","type":"concept","interaction":"self-check","prompt":"So sánh dùng callback @PrePersist/@PreUpdate thuần JPA với dùng Spring Data JPA auditing (@CreatedDate/@LastModifiedDate) để tự động set thời gian tạo/sửa - khi nào nên chọn cách nào?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc có cần tích hợp với Spring Security (ghi người thực hiện) hay không, và mức độ phụ thuộc Spring Data.","solution":"Callback @PrePersist/@PreUpdate là chuẩn JPA thuần, không phụ thuộc Spring Data - phù hợp khi muốn giữ entity độc lập với framework. Spring Data JPA auditing (@CreatedDate/@LastModifiedDate cùng AuditingEntityListener) tiện lợi hơn khi đã dùng Spring Data, và dễ mở rộng thêm @CreatedBy/@LastModifiedBy để ghi người thực hiện khi tích hợp Spring Security - đổi lại entity phụ thuộc vào Spring Data.","explanation":"So sánh mức độ phụ thuộc framework và khả năng ghi lại tác giả thay đổi.","rubric":"Đánh giá học viên nêu đúng sự đánh đổi giữa tính độc lập framework và tiện ích tích hợp Spring Security.","sourceUsage":["day20-src-5","day20-src-6"]},{"id":"day20-prac-4","type":"concept","interaction":"self-check","prompt":"Vì sao Hibernate Envers phù hợp hơn callback @PrePersist/@PreUpdate khi cần xem lại toàn bộ lịch sử thay đổi (không chỉ lần sửa gần nhất) của một entity?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc callback chỉ ghi đè field trên chính bản ghi hiện tại, không lưu bản sao từng phiên bản.","solution":"Callback @PrePersist/@PreUpdate chỉ set giá trị lên chính bản ghi hiện tại (mỗi lần update sẽ ghi đè giá trị cũ) nên không giữ được lịch sử các phiên bản trước. Hibernate Envers tạo một bản ghi 'revision' riêng trong bảng audit (_AUD) cho mỗi lần insert/update/delete, cho phép truy vấn lại trạng thái entity tại bất kỳ revision nào trong quá khứ.","explanation":"So sánh 'ghi đè tại chỗ' của callback với 'lưu từng revision riêng' của Envers.","rubric":"Đánh giá học viên nêu đúng cơ chế bảng _AUD lưu từng revision thay vì chỉ ghi đè.","sourceUsage":["day20-src-7"]}],"syllabusAssignments":[],"enhancedExercises":["Thêm interface-based projection (ví dụ ProductSummary chỉ có getName()/getUnitPrice()) cho một derived query method và so sánh SQL sinh ra với việc trả về full entity.","Cấu hình Hibernate Envers cho entity Order, thực hiện vài lần update, rồi truy vấn lại lịch sử các revision bằng AuditReader."],"references":[{"id":"day20-ref-1","type":"external","resourceId":"res-2e4a3dd62ec7","citationId":"day20-src-1","url":"https://www.baeldung.com/spring-data-jpa-pagination-sorting","label":"JPA Pagination \u0026 Sorting","checkStatus":"ok","readStatus":"read","pageTitle":"Pagination and Sorting using Spring Data JPA | Baeldung","limitation":null},{"id":"day20-ref-2","type":"external","resourceId":"res-82b36b19c96f","citationId":"day20-src-5","url":"https://www.baeldung.com/database-auditing-jpa","label":"Database Auditing","checkStatus":"ok","readStatus":"read","pageTitle":"Auditing with JPA, Hibernate, and Spring Data JPA | Baeldung","limitation":null},{"id":"day20-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":7,"unitTitle":"Spring Data JPA \u0026 Database"},{"id":"day-21","unitId":"unit-07","group":"spring","kind":"project","title":"- Assignment 7: E-Commerce Data Layer","summary":"Assignment 7 - E-Commerce Data Layer: thiết kế 5 entity (User, Product, Category, Order, OrderItem) với quan hệ và cascade đúng, viết repository query nghiệp vụ (top-selling, theo khoảng ngày, lịch sử user), quản lý schema bằng Flyway migration, và kiểm thử bằng @DataJpaTest.","durationMinutes":150.0,"objectives":["LO7"],"prerequisites":["Đã hoàn thành Day 19 (Entity Design \u0026 Relationships) và Day 20 (Query, Transaction \u0026 Patterns) - Assignment 7 áp dụng trực tiếp toàn bộ kiến thức entity/quan hệ/cascade/repository/pagination/auditing của cả hai bài."],"outcomes":["Thiết kế đúng 5 entity với quan hệ và CascadeType/orphanRemoval phù hợp theo tiêu chí composition/aggregation.","Viết được repository query nghiệp vụ có phân trang cho các yêu cầu top-selling, theo khoảng ngày, và lịch sử user.","Áp dụng đúng quy trình Flyway migration (V1__init.sql, V2__seed_data.sql).","Viết được integration test bằng @DataJpaTest cho các truy vấn đã xây dựng."],"sections":[{"id":"day21-sec-brief","title":"Đề bài Assignment 7","blocks":[{"id":"day21-blk-1","type":"deliverable","text":"- Assignment 7: E-Commerce Data Layer\n  - Entities: User, Product, Category, Order, OrderItem\n  - Full relationships + cascade correct\n  - Repository query: top-selling products, orders by date range, user history\n  - Flyway migration (V1__init.sql → V2__seed_data.sql)\n  - @DataJpaTest integration test","citations":[]},{"id":"day21-blk-2","type":"note","text":"Assignment 7 tổng hợp trực tiếp các mẫu entity/quan hệ/cascade đã học ở Day 19, và các mẫu repository/pagination/auditing đã học ở Day 20, áp dụng vào một mô hình dữ liệu thương mại điện tử hoàn chỉnh: 5 entity (User, Product, Category, Order, OrderItem), các truy vấn nghiệp vụ cụ thể, migration bằng Flyway, và integration test bằng @DataJpaTest.","citations":[]}]},{"id":"day21-sec-entities","title":"Thiết kế entity và quan hệ","blocks":[{"id":"day21-blk-3","type":"paragraph","text":"Mô hình gồm 5 entity với các quan hệ: Category có quan hệ @OneToMany tới Product (một danh mục có nhiều sản phẩm); User có quan hệ @OneToMany tới Order (một người dùng có nhiều đơn hàng); Order có quan hệ @OneToMany hai chiều tới OrderItem (dùng mappedBy, CascadeType.PERSIST và orphanRemoval=true vì OrderItem chỉ thuộc về đúng một Order - đây là quan hệ composition, không phải aggregation); OrderItem có hai quan hệ @ManyToOne LAZY tới Order và Product. Việc chọn đúng CascadeType và orphanRemoval theo tiêu chí composition/aggregation áp dụng lại trực tiếp nguyên tắc đã học ở Day 19.","citations":[]},{"id":"day21-blk-4","type":"template","text":"import jakarta.persistence.*;\nimport java.math.BigDecimal;\nimport java.util.ArrayList;\nimport java.util.List;\n\n@Entity\nclass OrderEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"user_id\", nullable = false)\n    private UserEntity user;\n\n    @OneToMany(mappedBy = \"order\", cascade = CascadeType.PERSIST, orphanRemoval = true)\n    private List\u003cOrderItemEntity\u003e items = new ArrayList\u003c\u003e();\n}\n\n@Entity\nclass OrderItemEntity {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"order_id\", nullable = false)\n    private OrderEntity order;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"product_id\", nullable = false)\n    private ProductEntity product;\n\n    private int quantity;\n    private BigDecimal unitPriceAtOrder;\n}\n","citations":[]},{"id":"day21-blk-5","type":"note","text":"OrderItem lưu lại unitPriceAtOrder (giá tại thời điểm đặt hàng) thay vì chỉ tham chiếu tới Product.unitPrice hiện tại - một nguyên tắc thiết kế dữ liệu thương mại điện tử phổ biến để giá trên hoá đơn cũ không bị thay đổi khi Product được cập nhật giá sau này. Đây là kiến thức thiết kế domain chuẩn, không có resource nào trong resourceIds của Day 21 mô tả trực tiếp (xem authoring.limitations).","citations":[]}]},{"id":"day21-sec-queries","title":"Repository query nghiệp vụ","blocks":[{"id":"day21-blk-6","type":"paragraph","text":"Ba truy vấn nghiệp vụ được yêu cầu - top-selling products, đơn hàng theo khoảng ngày, và lịch sử đơn hàng của một người dùng - đều áp dụng lại mẫu PagingAndSortingRepository và PageRequest.of đã học ở Day 20: mỗi truy vấn nhận một tham số Pageable để tránh nạp toàn bộ dữ liệu, dùng derived query method (findByUserId, findByCreatedAtBetween) khi có thể, và @Query tường minh cho truy vấn tổng hợp (group by/order by) như top-selling.","citations":["day21-src-1","day21-src-2"]},{"id":"day21-blk-7","type":"code","language":"java","code":"import org.springframework.data.domain.Page;\nimport org.springframework.data.domain.Pageable;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\nimport java.time.LocalDate;\n\ninterface OrderRepository extends PagingAndSortingRepository\u003cOrderEntity, Long\u003e {\n\n    @Query(\"select oi.product.id, sum(oi.quantity) as totalQty \"\n         + \"from OrderItemEntity oi group by oi.product.id order by totalQty desc\")\n    Page\u003cObject[]\u003e topSellingProducts(Pageable pageable);\n\n    Page\u003cOrderEntity\u003e findByCreatedAtBetween(\n        @Param(\"from\") LocalDate from, @Param(\"to\") LocalDate to, Pageable pageable);\n\n    Page\u003cOrderEntity\u003e findByUserId(@Param(\"userId\") Long userId, Pageable pageable);\n}\n","compile":false,"citations":["day21-src-1","day21-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day21-sec-migration","title":"Flyway Migration và @DataJpaTest","blocks":[{"id":"day21-blk-8","type":"note","text":"Quy trình Flyway (đặt tên file migration theo chuẩn V{version}__{description}.sql, chạy tuần tự và ghi lại lịch sử trong bảng flyway_schema_history) và @DataJpaTest (slice test chỉ nạp cấu hình liên quan JPA, mặc định dùng database nhúng trong bộ nhớ và rollback sau mỗi test) không có resource nào trong resourceIds của Day 21 mô tả - resource res-553bbd92e5d0 dự kiến cho chủ đề này hiện không thể truy cập (xem authoring.limitations). Quy trình chuẩn: V1__init.sql tạo schema (bảng users, categories, products, orders, order_items cùng khoá ngoại), V2__seed_data.sql chèn dữ liệu mẫu để kiểm thử thủ công; @DataJpaTest kết hợp @Autowired TestEntityManager và repository để kiểm tra các truy vấn nghiệp vụ ở trên hoạt động đúng trên schema thật.","citations":[]}]}],"commonMistakes":["Dùng orphanRemoval=true cho một quan hệ mà entity con thực chất được nhiều entity cha chia sẻ (ví dụ nhầm áp dụng cho Product-Category thay vì chỉ Order-OrderItem).","Để OrderItem tham chiếu trực tiếp Product.unitPrice thay vì lưu unitPriceAtOrder, khiến lịch sử đơn hàng cũ hiển thị sai giá khi Product đổi giá.","Đặt sai thứ tự version trong tên file migration Flyway (ví dụ V2 trước V1), khiến Flyway báo lỗi hoặc bỏ qua migration."],"practices":[{"id":"day21-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao OrderItem nên dùng CascadeType.PERSIST kèm orphanRemoval=true trong quan hệ với Order, thay vì để rời rạc không cascade?","choices":[{"id":"day21-prac-1-a","text":"Vì OrderItem là quan hệ composition - chỉ thuộc về đúng một Order, nên lưu/xoá Order nên lan truyền sang OrderItem tương ứng"},{"id":"day21-prac-1-b","text":"Vì OrderItem cần được nhiều Order khác nhau tham chiếu cùng lúc"},{"id":"day21-prac-1-c","text":"Vì CascadeType chỉ có tác dụng với @ManyToOne, không có tác dụng với @OneToMany"},{"id":"day21-prac-1-d","text":"Vì orphanRemoval bắt buộc phải đi cùng CascadeType.REMOVE, không thể dùng với PERSIST"}],"correctChoiceIds":["day21-prac-1-a"],"hint":"Xem lại tiêu chí composition/aggregation đã học ở Day 19 để chọn CascadeType phù hợp.","solution":"day21-prac-1-a","explanation":"OrderItem chỉ thuộc về đúng một Order (composition), nên CascadeType.PERSIST giúp lưu Order sẽ tự lưu luôn các OrderItem con, và orphanRemoval=true đảm bảo gỡ một OrderItem khỏi collection của Order sẽ xoá nó khỏi database - an toàn vì không entity Order nào khác chia sẻ OrderItem đó.","rubric":"Áp dụng lại tiêu chí composition/aggregation đã học ở Day 19 vào một cặp entity cụ thể của Assignment 7.","sourceUsage":[]},{"id":"day21-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một repository method trả về Page\u003cOrderEntity\u003e cho lịch sử đơn hàng của một user cụ thể, sắp xếp theo thời gian tạo giảm dần.","choices":[],"correctChoiceIds":[],"hint":"Kết hợp derived query method findByUserId với Pageable chứa Sort như đã học ở Day 20.","solution":"interface OrderRepository extends PagingAndSortingRepository\u003cOrderEntity, Long\u003e {\n    Page\u003cOrderEntity\u003e findByUserId(Long userId, Pageable pageable);\n}\n\nPageable pageable = PageRequest.of(0, 10, Sort.by(\"createdAt\").descending());\nPage\u003cOrderEntity\u003e history = orderRepository.findByUserId(userId, pageable);","explanation":"Áp dụng lại mẫu PageRequest.of kèm Sort đã học ở Day 20 vào truy vấn lịch sử đơn hàng của Assignment 7.","rubric":"Đánh giá đúng: derived query method nhận Pageable, PageRequest.of có sort theo createdAt descending.","sourceUsage":["day21-src-1"]},{"id":"day21-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao OrderItem nên lưu lại unitPriceAtOrder thay vì chỉ tham chiếu Product.unitPrice hiện tại khi hiển thị lại một đơn hàng cũ?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc giá Product có thể thay đổi sau khi đơn hàng đã được đặt.","solution":"Nếu OrderItem chỉ tham chiếu Product và đọc unitPrice hiện tại, khi Product được cập nhật giá sau này, các đơn hàng cũ sẽ hiển thị sai giá đã thực sự thanh toán tại thời điểm đặt hàng. Lưu unitPriceAtOrder ngay trên OrderItem đảm bảo dữ liệu lịch sử giao dịch bất biến, không phụ thuộc vào thay đổi giá sau này của Product.","explanation":"Liên hệ tới nguyên tắc dữ liệu giao dịch (transactional data) cần bất biến theo thời gian.","rubric":"Đánh giá học viên nêu đúng lý do bất biến dữ liệu lịch sử giao dịch khi Product thay đổi giá.","sourceUsage":[]},{"id":"day21-prac-4","type":"concept","interaction":"self-check","prompt":"Nêu quy ước đặt tên file migration Flyway và vai trò của bảng flyway_schema_history.","choices":[],"correctChoiceIds":[],"hint":"Nhớ lại định dạng V{version}__{description}.sql đã nêu trong bài.","solution":"File migration Flyway đặt tên theo định dạng V{version}__{description}.sql (ví dụ V1__init.sql, V2__seed_data.sql), được Flyway chạy tuần tự theo số version tăng dần khi ứng dụng khởi động. Bảng flyway_schema_history được Flyway tự tạo trong database để ghi lại migration nào đã chạy, tránh chạy lại một migration đã áp dụng.","explanation":"Nhớ lại quy ước đặt tên và mục đích của bảng lịch sử migration.","rubric":"Đánh giá học viên nêu đúng định dạng tên file và vai trò chống chạy lại của flyway_schema_history.","sourceUsage":[]}],"syllabusAssignments":[{"row":37,"text":"- Assignment 7: E-Commerce Data Layer\n  - Entities: User, Product, Category, Order, OrderItem\n  - Full relationships + cascade correct\n  - Repository query: top-selling products, orders by date range, user history\n  - Flyway migration (V1__init.sql → V2__seed_data.sql)\n  - @DataJpaTest integration test"}],"enhancedExercises":["Thêm truy vấn 'sản phẩm sắp hết hàng' (tồn kho dưới ngưỡng) dùng derived query method kết hợp Pageable.","Viết thêm một migration V3__add_index.sql tạo index trên order_items(product_id) và đo lại thời gian chạy truy vấn top-selling trước/sau khi có index."],"references":[{"id":"day21-ref-1","type":"external","resourceId":"res-2e4a3dd62ec7","citationId":"day21-src-1","url":"https://www.baeldung.com/spring-data-jpa-pagination-sorting","label":"JPA Pagination \u0026 Sorting","checkStatus":"ok","readStatus":"read","pageTitle":"Pagination and Sorting using Spring Data JPA | Baeldung","limitation":null},{"id":"day21-ref-2","type":"external","resourceId":"res-82b36b19c96f","citationId":"day21-src-3","url":"https://www.baeldung.com/database-auditing-jpa","label":"Database Auditing","checkStatus":"ok","readStatus":"read","pageTitle":"Auditing with JPA, Hibernate, and Spring Data JPA | Baeldung","limitation":null},{"id":"day21-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":7,"unitTitle":"Spring Data JPA \u0026 Database"},{"id":"day-22","unitId":"unit-08","group":"spring","kind":"theory","title":"Authentication with Spring Security + JWT","summary":"Xác thực stateless bằng JWT qua Spring Security OAuth2 Resource Server: quy trình discovery JWK Set, JwtAuthenticationProvider xác thực mỗi request, cấu hình SessionCreationPolicy.STATELESS, và mã hoá mật khẩu an toàn bằng DelegatingPasswordEncoder.","durationMinutes":150.0,"objectives":["LO8"],"prerequisites":["Đã hoàn thành Unit 5-7 (Spring Boot, DI, Spring MVC, Spring Data JPA) - bài này bắt đầu Unit 8 (bảo mật), giả định đã quen với cấu hình @Bean và @Configuration của Spring."],"outcomes":["Giải thích đúng luồng xác thực JWT qua OAuth2 Resource Server (discovery, JwtAuthenticationProvider, kiểm tra claim).","Cấu hình đúng SessionCreationPolicy.STATELESS cho API xác thực bằng JWT.","Cấu hình đúng DelegatingPasswordEncoder và giải thích định dạng {id}encodedPassword.","Nhận
