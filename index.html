e final InventoryClient inventoryClient = new InventoryClient();\n\n    static class EmailClient { void send(Long orderId) {} }\n    static class InventoryClient { boolean reserve(Long orderId) { return true; } }\n}\n","compile":false,"citations":["day27-src-4","day27-src-5"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day27-sec-scheduled","title":"Scheduled job: huy don hang cho qua 30 phut","blocks":[{"id":"day27-blk-7","type":"paragraph","text":"Job định kỳ quét các đơn hàng ở trạng thái PENDING quá 30 phút và tự động huỷ; dùng fixedDelay (tính từ lúc lần chạy trước KẾT THÚC) vì job này chỉ cần chạy định kỳ đều đặn, không bắt buộc đúng giờ tuyệt đối và không nên chồng lấp giữa các lần chạy.","citations":["day27-src-6","day27-src-7"]},{"id":"day27-blk-8","type":"code","language":"java","code":"import java.time.Instant;\nimport java.time.temporal.ChronoUnit;\nimport java.util.List;\nimport org.springframework.scheduling.annotation.Scheduled;\nimport org.springframework.stereotype.Component;\n\n@Component\nclass PendingOrderCleanupJob {\n\n    // Chay lai sau moi 5 phut TINH TU LUC LAN CHAY TRUOC KET THUC -\n    // phu hop vi job nay khong can chay dung gio tuyet doi, chi can dinh ky.\n    @Scheduled(fixedDelay = 5 * 60 * 1000)\n    public void cancelStalePendingOrders() {\n        Instant threshold = Instant.now().minus(30, ChronoUnit.MINUTES);\n        List\u003cLong\u003e staleOrderIds = findPendingOrdersOlderThan(threshold);\n        staleOrderIds.forEach(this::cancelOrder);\n    }\n\n    private List\u003cLong\u003e findPendingOrdersOlderThan(Instant threshold) { return List.of(); }\n    private void cancelOrder(Long orderId) { }\n}\n","compile":false,"citations":["day27-src-6","day27-src-7"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day27-sec-upload","title":"Upload anh san pham + thumbnail","blocks":[{"id":"day27-blk-9","type":"paragraph","text":"Ảnh sản phẩm được nhận qua @RequestParam MultipartFile, áp dụng lại đúng mẫu kiểm tra và lưu file an toàn đã học ở Day 26 (chuẩn hoá đường dẫn, kiểm tra nằm trong thư mục gốc).","citations":["day27-src-8"]},{"id":"day27-blk-10","type":"note","text":"Tạo thumbnail (ảnh thu nhỏ) từ ảnh gốc sau khi upload là một yêu cầu thực tế của đề bài, nhưng không có resource nào trong bộ nguồn của khoá học (không riêng Day 27, toàn bộ course-catalog) mô tả kỹ thuật xử lý ảnh trong Java (ví dụ ImageIO/BufferedImage hoặc thư viện Thumbnailator). Đây là khoảng trống kiến thức thật sự - trình bày như một ghi chú không trích dẫn, học viên tự tham khảo tài liệu thư viện xử lý ảnh khi triển khai.","citations":[]}]},{"id":"day27-sec-payment","title":"Goi payment gateway (mock) qua WebClient + Circuit Breaker","blocks":[{"id":"day27-blk-11","type":"paragraph","text":"Gọi cổng thanh toán (mock) là một lời gọi HTTP ra ngoài có thể thất bại hoặc chậm bất thường - dùng WebClient để gọi và bọc trong Circuit Breaker (Resilience4j) với fallbackMethod để xử lý khi cổng thanh toán không phản hồi, thay vì để lỗi lan ra toàn bộ luồng tạo đơn hàng.","citations":["day27-src-9","day27-src-10"]},{"id":"day27-blk-12","type":"code","language":"java","code":"import io.github.resilience4j.circuitbreaker.annotation.CircuitBreaker;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.reactive.function.client.WebClient;\n\n@Service\nclass PaymentGatewayClient {\n\n    private final WebClient webClient;\n\n    PaymentGatewayClient(WebClient.Builder builder) {\n        this.webClient = builder.baseUrl(\"https://payments.example.com\").build();\n    }\n\n    @CircuitBreaker(name = \"paymentGateway\", fallbackMethod = \"paymentUnavailable\")\n    public PaymentResult charge(Long orderId, java.math.BigDecimal amount) {\n        return webClient.post()\n                .uri(\"/charge\")\n                .bodyValue(new ChargeRequest(orderId, amount))\n                .retrieve()\n                .bodyToMono(PaymentResult.class)\n                .block();\n    }\n\n    // Fallback PHAI cung chu ky tra ve + them tham so Throwable o cuoi.\n    private PaymentResult paymentUnavailable(Long orderId, java.math.BigDecimal amount, Throwable t) {\n        return new PaymentResult(orderId, \"PENDING_MANUAL_REVIEW\");\n    }\n\n    record ChargeRequest(Long orderId, java.math.BigDecimal amount) {}\n    record PaymentResult(Long orderId, String status) {}\n}\n","compile":false,"citations":["day27-src-9","day27-src-10"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day27-sec-export","title":"Xuat don hang ra CSV (tinh nang admin)","blocks":[{"id":"day27-blk-13","type":"note","text":"Xuất danh sách đơn hàng ra CSV cho tính năng quản trị áp dụng lại đúng mẫu ghi CSV + escape ký tự đặc biệt đã học có trích dẫn ở Day 26 (resource về CSV thuộc resourceIds của Day 26, không lặp lại trong resourceIds của Day 27 theo nguyên tắc không mượn citation chéo giữa các bài) - không lặp lại code mẫu ở đây.","citations":[]}]}],"commonMistakes":["Đánh @CachePut riêng cho từng sản phẩm thay đổi trong khi cache danh sách được key theo trang/bộ lọc - dữ liệu cache cũ vẫn còn hiển thị sai.","Method @Async khai báo trả về kiểu thường (không phải CompletableFuture) - Spring bỏ qua giá trị trả về, gây khó debug khi cần biết kết quả tác vụ bất đồng bộ.","Không có fallbackMethod cho @CircuitBreaker - khi payment gateway lỗi, exception lan thẳng ra và làm hỏng toàn bộ request tạo đơn hàng."],"practices":[{"id":"day27-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao dùng @CacheEvict(allEntries = true) trên toàn bộ cache 'products' khi tạo/sửa/xoá sản phẩm, thay vì @CachePut cho từng sản phẩm thay đổi?","choices":[{"id":"day27-prac-1-a","text":"Vì cache danh sách được key theo trang/bộ lọc - việc tính chính xác những key nào bị ảnh hưởng bởi một thay đổi phức tạp hơn nhiều so với việc xoá toàn bộ và để lần đọc kế tiếp nạp lại"},{"id":"day27-prac-1-b","text":"Vì @CachePut không tồn tại trong Spring Cache"},{"id":"day27-prac-1-c","text":"Vì allEntries = true chạy nhanh hơn nên luôn nên dùng thay cho mọi annotation khác"},{"id":"day27-prac-1-d","text":"Vì Redis không hỗ trợ @CachePut"}],"correctChoiceIds":["day27-prac-1-a"],"hint":"Nghĩ về việc cache 'products' được key theo trang/bộ lọc, không theo từng sản phẩm riêng lẻ.","solution":"day27-prac-1-a","explanation":"Cache danh sách sản phẩm được key theo tham số phân trang/bộ lọc, không theo từng ID sản phẩm - một thay đổi (tạo/sửa/xoá) có thể ảnh hưởng tới nhiều key khác nhau, nên xoá toàn bộ cache đơn giản và an toàn hơn nhiều so với cố tính chính xác key nào cần cập nhật.","rubric":"Liên hệ đúng lý do: cache theo trang/bộ lọc khiến việc evict chọn lọc phức tạp không đáng.","sourceUsage":["day27-src-2"]},{"id":"day27-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một method @Async trả về CompletableFuture\u003cVoid\u003e dùng để gửi email xác nhận đơn hàng.","choices":[],"correctChoiceIds":[],"hint":"Method @Async trả về giá trị (kể cả Void) phải dùng CompletableFuture.","solution":"@Async\npublic CompletableFuture\u003cVoid\u003e sendConfirmationEmailAsync(Long orderId) {\n    emailClient.send(orderId);\n    return CompletableFuture.completedFuture(null);\n}","explanation":"Áp dụng lại mẫu @Async trả về CompletableFuture đã học trong bài.","rubric":"Đánh giá đúng: có @Async, chữ ký trả về CompletableFuture\u003cVoid\u003e, gọi completedFuture(null) ở cuối.","sourceUsage":["day27-src-5"]},{"id":"day27-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao job huỷ đơn hàng chờ quá 30 phút nên dùng fixedDelay thay vì fixedRate?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về việc job này có cần chạy đúng giờ tuyệt đối, và điều gì xảy ra nếu một lần chạy mất nhiều thời gian hơn chu kỳ.","solution":"fixedDelay tính khoảng cách kể từ lúc lần chạy TRƯỚC kết thúc, nên đảm bảo không có hai lần chạy chồng lấp nhau - phù hợp với job quét/dọn dẹp định kỳ không cần đúng giờ tuyệt đối. fixedRate có thể khởi động lần chạy mới trong khi lần trước chưa xong nếu xử lý mất nhiều thời gian hơn chu kỳ, gây chồng lấp không mong muốn.","explanation":"Liên hệ đúng đặc điểm không chồng lấp của fixedDelay với bản chất job dọn dẹp định kỳ.","rubric":"Đánh giá học viên nêu đúng: fixedDelay tránh chồng lấp giữa các lần chạy, phù hợp job dọn dẹp không cần đúng giờ tuyệt đối.","sourceUsage":["day27-src-7"]},{"id":"day27-prac-4","type":"concept","interaction":"multiple-choice","prompt":"fallbackMethod trong @CircuitBreaker dùng để làm gì?","choices":[{"id":"day27-prac-4-a","text":"Cung cấp hành vi thay thế khi lời gọi tới payment gateway thất bại hoặc circuit đang ở trạng thái Open, thay vì để lỗi lan ra toàn bộ luồng tạo đơn hàng"},{"id":"day27-prac-4-b","text":"Tự động thử lại lời gọi vô hạn lần cho tới khi thành công"},{"id":"day27-prac-4-c","text":"Ghi log lỗi rồi vẫn ném exception như bình thường"},{"id":"day27-prac-4-d","text":"Tăng timeout của WebClient lên gấp đôi"}],"correctChoiceIds":["day27-prac-4-a"],"hint":"Nhớ lại vai trò của Circuit Breaker: ngăn lỗi từ hệ thống ngoài lan rộng.","solution":"day27-prac-4-a","explanation":"fallbackMethod cung cấp một đường xử lý thay thế (ví dụ đánh dấu đơn hàng cần review thủ công) khi lời gọi payment gateway thất bại hoặc circuit đang mở, giúp luồng tạo đơn hàng không bị crash toàn bộ vì một dịch vụ bên ngoài gặp sự cố.","rubric":"Liên hệ đúng vai trò cách ly lỗi của fallbackMethod.","sourceUsage":["day27-src-10"]}],"syllabusAssignments":[{"row":47,"text":"- Assignment 9: Product \u0026 Order Features\n  - Cache product list, category tree. Evict on create/update/delete.\n  - @Async: order confirmation email, inventory update\n  - @Scheduled: cancel pending orders \u003e 30 min\n  - Product image upload + thumbnail\n  - WebClient call payment gateway (mock) with circuit breaker\n  - Export orders CSV (admin)"}],"enhancedExercises":["Thêm health check định kỳ cho payment gateway bằng @Scheduled, cập nhật trạng thái circuit breaker vào bảng giám sát nội bộ.","Viết test cho fallbackMethod bằng cách giả lập payment gateway trả lỗi (WireMock hoặc MockWebServer)."],"references":[{"id":"day27-ref-1","type":"external","resourceId":"res-e95ba2d69401","citationId":"day27-src-1","url":"https://www.baeldung.com/spring-cache-tutorial","label":"Spring Cache","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide To Caching in Spring (Baeldung)","limitation":null},{"id":"day27-ref-2","type":"external","resourceId":"res-1c6109c5ec54","citationId":"day27-src-3","url":"https://www.baeldung.com/spring-boot-redis-cache","label":"Redis Cache","checkStatus":"ok","readStatus":"read","pageTitle":"Spring Boot Cache With Redis (Baeldung)","limitation":null},{"id":"day27-ref-3","type":"external","resourceId":"res-033c4bfa05f5","citationId":"day27-src-5","url":"https://www.baeldung.com/spring-async","label":"@Async","checkStatus":"ok","readStatus":"read","pageTitle":"How To Do @Async in Spring (Baeldung)","limitation":null},{"id":"day27-ref-4","type":"external","resourceId":"res-97fce5fda99a","citationId":"day27-src-7","url":"https://www.baeldung.com/spring-scheduled-tasks","label":"@Scheduled","checkStatus":"ok","readStatus":"read","pageTitle":"The @Scheduled Annotation in Spring (Baeldung)","limitation":null},{"id":"day27-ref-5","type":"external","resourceId":"res-74d398e3d23c","citationId":"day27-src-8","url":"https://www.baeldung.com/spring-file-upload","label":"File Upload","checkStatus":"ok","readStatus":"read","pageTitle":"File Upload with Spring MVC (Baeldung)","limitation":null},{"id":"day27-ref-6","type":"external","resourceId":"res-b8b29a249f37","citationId":"day27-src-9","url":"https://www.baeldung.com/spring-5-webclient","label":"WebClient","checkStatus":"ok","readStatus":"read","pageTitle":"Spring WebClient (Baeldung)","limitation":null},{"id":"day27-ref-7","type":"external","resourceId":"res-4b45b7c76586","citationId":"day27-src-10","url":"https://www.baeldung.com/spring-boot-resilience4j","label":"Resilience4j","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Resilience4j With Spring Boot (Baeldung)","limitation":null},{"id":"day27-ref-8","type":"internal","resourceId":null,"citationId":null}],"unitNumber":9,"unitTitle":"Caching, Async, File Handling \u0026 External API"},{"id":"day-28","unitId":"unit-10","group":"spring","kind":"theory","title":"Testing Spring Boot","summary":"Nền tảng JUnit 5 (vòng đời, assertion, exception testing), các slice test của Spring Boot (@WebMvcTest, @DataJpaTest, @JsonTest), và @SpringBootTest với các chế độ webEnvironment (MOCK/RANDOM_PORT) - nền tảng cho bộ test tích hợp Testcontainers ở Lab 10 (Day 30).","durationMinutes":150.0,"objectives":["LO10"],"prerequisites":["Đã hoàn thành Assignment 9 (Day 27) - bài này viết test cho các tính năng vừa xây dựng."],"outcomes":["Viết được unit test với JUnit 5 (vòng đời, assertion, exception testing).","Phân biệt và sử dụng đúng các slice test: @WebMvcTest, @DataJpaTest, @JsonTest.","Chọn đúng chế độ webEnvironment của @SpringBootTest cho từng loại test tích hợp."],"sections":[{"id":"day28-sec-brief","title":"Pham vi buoi hoc","blocks":[{"id":"day28-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day28-blk-2","type":"note","text":"Assignment không có đề bài chi tiết riêng (lịch chỉ ghi 'Assignment') - học viên viết test cho các tính năng đã xây dựng ở Assignment 9 (Day 27) bằng các kỹ thuật trong bài này, chuẩn bị cho Lab 10 - Production Readiness ở Day 30 (nơi Testcontainers được áp dụng đầy đủ vào bộ test tích hợp cuối cùng).","citations":[]}]},{"id":"day28-sec-junit5","title":"Nen tang JUnit 5","blocks":[{"id":"day28-blk-3","type":"paragraph","text":"JUnit 5 gồm 3 module chính: JUnit Platform (nền tảng chạy test, kết nối IDE/build tool), JUnit Jupiter (API viết test mới, các annotation @Test/@BeforeEach...), và JUnit Vintage (chạy tương thích test JUnit 3/4 cũ). Vòng đời một test class dùng @BeforeAll/@AfterAll (chạy một lần, method phải static trừ khi dùng @TestInstance(PER_CLASS)) và @BeforeEach/@AfterEach (chạy trước/sau mỗi test); @DisplayName đặt tên hiển thị dễ đọc, @Disabled tạm tắt một test.","citations":["day28-src-1","day28-src-2"]},{"id":"day28-blk-4","type":"paragraph","text":"assertAll gom nhiều assertion vào một khối - tất cả đều được chạy và báo cáo lỗi cùng lúc thay vì dừng lại ở assertion đầu tiên thất bại; assumeTrue bỏ qua toàn bộ test nếu điều kiện giả định không đúng (thay vì báo lỗi). assertThrows kiểm tra một đoạn code có ném đúng loại exception mong đợi hay không; @TestFactory kết hợp DynamicTest cho phép sinh test động tại runtime.","citations":["day28-src-3","day28-src-4"]},{"id":"day28-blk-5","type":"code","language":"java","code":"import org.junit.jupiter.api.AfterEach;\nimport org.junit.jupiter.api.Assertions;\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.DisplayName;\nimport org.junit.jupiter.api.Test;\n\n@DisplayName(\"OrderCalculator\")\nclass OrderCalculatorTest {\n\n    private OrderCalculator calculator;\n\n    @BeforeEach\n    void setUp() {\n        calculator = new OrderCalculator();\n    }\n\n    @AfterEach\n    void tearDown() {\n        calculator = null;\n    }\n\n    @Test\n    @DisplayName(\"tinh tong don hang hop le\")\n    void calculatesTotalCorrectly() {\n        // assertAll gom nhieu assertion trong mot test - tat ca deu duoc chay\n        // va bao cao, khong dung lai o assertion loi dau tien.\n        Assertions.assertAll(\"order total\",\n                () -\u003e Assertions.assertEquals(100, calculator.total(),\n                        \"tong phai la 100\"),\n                () -\u003e Assertions.assertTrue(calculator.isValid(),\n                        \"don hang phai hop le\"));\n    }\n\n    @Test\n    void throwsWhenQuantityNegative() {\n        Assertions.assertThrows(IllegalArgumentException.class,\n                () -\u003e calculator.addItem(-1, 10));\n    }\n\n    static class OrderCalculator {\n        int total() { return 100; }\n        boolean isValid() { return true; }\n        void addItem(int quantity, int price) {\n            if (quantity \u003c 0) throw new IllegalArgumentException(\"quantity \u003c 0\");\n        }\n    }\n}\n","compile":false,"citations":["day28-src-2","day28-src-3","day28-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day28-sec-webmvctest","title":"@WebMvcTest + MockMvc","blocks":[{"id":"day28-blk-6","type":"paragraph","text":"@WebMvcTest(Controller.class) chỉ khởi tạo controller được chỉ định cùng hạ tầng MVC liên quan (không nạp toàn bộ Spring context, không có Service/Repository thật) - nhanh hơn nhiều so với @SpringBootTest. Các bean phụ thuộc (như Service) cần được thay thế bằng @MockBean (hoặc @MockitoBean/@MockitoSpyBean từ Spring Boot 3.4 trở đi, do @MockBean/@SpyBean đã deprecated). MockMvc được khởi tạo tự động qua SpringExtension + @WebAppConfiguration + MockMvcBuilders để giả lập request HTTP mà không cần mở cổng mạng thật.","citations":["day28-src-5","day28-src-6","day28-src-7","day28-src-8"]},{"id":"day28-blk-7","type":"code","language":"java","code":"import org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;\nimport org.springframework.boot.test.mock.mockito.MockBean;\nimport org.springframework.test.web.servlet.MockMvc;\n\nimport static org.mockito.BDDMockito.given;\nimport static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;\nimport static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;\nimport static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;\n\n// Chi khoi tao ProductController va cac thanh phan lien quan toi MVC\n// (khong nap toan bo Spring context nhu @SpringBootTest).\n@WebMvcTest(ProductController.class)\nclass ProductControllerTest {\n\n    @Autowired\n    private MockMvc mockMvc;\n\n    // Thay the ProductService that bang mot mock, vi @WebMvcTest khong tao bean tang service/repository.\n    @MockBean\n    private ProductService productService;\n\n    @Test\n    void returnsProductByIdAsJson() throws Exception {\n        given(productService.findById(1L)).willReturn(new ProductDTO(1L, \"Ban phim\"));\n\n        mockMvc.perform(get(\"/api/products/1\"))\n                .andExpect(status().isOk())\n                .andExpect(jsonPath(\"$.name\").value(\"Ban phim\"));\n    }\n\n    interface ProductService { ProductDTO findById(Long id); }\n    interface ProductController {}\n    record ProductDTO(Long id, String name) {}\n}\n","compile":false,"citations":["day28-src-5","day28-src-6","day28-src-9"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day28-blk-8","type":"note","text":"MockMvc mô phỏng tầng Servlet trong bộ nhớ, không thực sự mở kết nối mạng - vì vậy không kiểm tra được các vấn đề chỉ xảy ra ở tầng HTTP thật (ví dụ cấu hình cổng, SSL, hoặc hành vi filter/server container thực tế). Với những trường hợp đó cần dùng @SpringBootTest kèm webEnvironment thật.","citations":["day28-src-10"]}]},{"id":"day28-sec-datajpatest","title":"@DataJpaTest","blocks":[{"id":"day28-blk-9","type":"paragraph","text":"@DataJpaTest chỉ khởi tạo các thành phần liên quan tới JPA (entity, repository), tự động cấu hình H2 in-memory database - cùng nguyên lý 'chỉ nạp slice cần thiết' như @WebMvcTest, giúp test chạy nhanh hơn nhiều so với @SpringBootTest đầy đủ. TestEntityManager cung cấp các thao tác tiện lợi cho test (ví dụ persistAndFlush) không có trong EntityManager thông thường.","citations":["day28-src-11","day28-src-12"]},{"id":"day28-blk-10","type":"code","language":"java","code":"import org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.autoconfigure.orm.jpa.DataJpaTest;\nimport org.springframework.boot.test.autoconfigure.orm.jpa.TestEntityManager;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\n// Chi khoi tao lop JPA (entity, repository) voi H2 in-memory tu dong cau hinh,\n// khong nap Controller/Service - nhanh hon nhieu so voi @SpringBootTest day du.\n@DataJpaTest\nclass ProductRepositoryTest {\n\n    @Autowired\n    private TestEntityManager entityManager;\n\n    @Autowired\n    private ProductRepository productRepository;\n\n    @Test\n    void findsProductBySku() {\n        Product saved = entityManager.persistAndFlush(new Product(\"SKU-001\", \"Ban phim\"));\n\n        Product found = productRepository.findBySku(\"SKU-001\").orElseThrow();\n\n        assertEquals(saved.getId(), found.getId());\n    }\n\n    interface ProductRepository {\n        java.util.Optional\u003cProduct\u003e findBySku(String sku);\n    }\n\n    static class Product {\n        private Long id;\n        private final String sku;\n        private final String name;\n        Product(String sku, String name) { this.sku = sku; this.name = name; }\n        Long getId() { return id; }\n    }\n}\n","compile":false,"citations":["day28-src-11"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day28-sec-springboottest","title":"@SpringBootTest va webEnvironment","blocks":[{"id":"day28-blk-11","type":"paragraph","text":"@SpringBootTest nạp toàn bộ Spring context như ứng dụng thật - tham số webEnvironment quyết định môi trường web: MOCK (mặc định, dùng DispatcherServlet giả lập, không mở cổng mạng thật), RANDOM_PORT (khởi động server HTTP thật trên cổng ngẫu nhiên), DEFINED_PORT (dùng cổng cấu hình sẵn), hoặc NONE (không có môi trường web). Với RANDOM_PORT, có thể gọi API bằng client HTTP thật như RestAssured để kiểm tra toàn bộ luồng từ tầng mạng trở xuống.","citations":["day28-src-13","day28-src-14","day28-src-15"]},{"id":"day28-blk-12","type":"code","language":"java","code":"import io.restassured.RestAssured;\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.Test;\nimport org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.boot.test.web.server.LocalServerPort;\n\nimport static io.restassured.RestAssured.given;\nimport static org.hamcrest.Matchers.equalTo;\n\n// RANDOM_PORT: khoi dong mot server HTTP that tren cong ngau nhien,\n// cho phep goi API qua HTTP client that (RestAssured) thay vi MockMvc gia lap.\n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\nclass ProductApiIntegrationTest {\n\n    @LocalServerPort\n    private int port;\n\n    @BeforeEach\n    void setUp() {\n        RestAssured.port = port;\n    }\n\n    @Test\n    void getProductReturnsOkStatus() {\n        given()\n                .when().get(\"/api/products/1\")\n                .then()\n                .statusCode(200)\n                .body(\"name\", equalTo(\"Ban phim\"));\n    }\n}\n","compile":false,"citations":["day28-src-15"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day28-sec-testcontainers","title":"Testcontainers (gioi thieu)","blocks":[{"id":"day28-blk-13","type":"note","text":"Testcontainers (chạy database thật trong Docker container cho test tích hợp, thay vì H2 in-memory) không có resource nào trong resourceIds của Day 28 - resource tương ứng thuộc resourceIds của Day 29/30, nơi kỹ thuật này được áp dụng trực tiếp vào bộ test tích hợp của Lab 10. Trình bày khái niệm tổng quan trong khối note không yêu cầu trích dẫn ở đây.","citations":[]}]},{"id":"day28-sec-slices","title":"Bang tham khao: cac slice test khac","blocks":[{"id":"day28-blk-14","type":"table","columns":["Annotation","Pham vi khoi tao"],"rows":[["@WebMvcTest","Controller + MVC infrastructure (khong nap Service/Repository)"],["@DataJpaTest","Entity + Repository voi H2 in-memory (khong nap Controller/Service)"],["@JsonTest","Chi khoi tao JacksonTester/GsonTester/JsonbTester de test serialize/deserialize JSON"],["@WebFluxTest, @JdbcTest, @DataMongoTest, @DataRedisTest, @RestClientTest","Cac slice test tuong ung cho WebFlux, JDBC thuan, MongoDB, Redis, REST client"]],"citations":["day28-src-16","day28-src-17"]}]}],"commonMistakes":["Dùng @SpringBootTest cho mọi test (kể cả test controller đơn giản) thay vì @WebMvcTest - làm test chạy chậm không cần thiết vì nạp toàn bộ context.","Quên @MockBean/@MockitoBean cho dependency trong @WebMvcTest, khiến Spring không khởi tạo được context vì thiếu bean.","Dùng MockMvc để kiểm tra hành vi chỉ xảy ra ở tầng HTTP thật (ví dụ SSL, cấu hình server) - MockMvc không mở kết nối mạng thật nên không phát hiện được các vấn đề này."],"practices":[{"id":"day28-prac-1","type":"concept","interaction":"multiple-choice","prompt":"@WebMvcTest khác @SpringBootTest ở điểm nào?","choices":[{"id":"day28-prac-1-a","text":"@WebMvcTest chỉ khởi tạo controller + hạ tầng MVC (nhanh hơn), còn @SpringBootTest nạp toàn bộ Spring context như ứng dụng thật"},{"id":"day28-prac-1-b","text":"@WebMvcTest chạy chậm hơn @SpringBootTest vì phải mở cổng mạng thật"},{"id":"day28-prac-1-c","text":"Hai annotation này hoàn toàn tương đương nhau"},{"id":"day28-prac-1-d","text":"@SpringBootTest chỉ dùng được cho ứng dụng không có controller"}],"correctChoiceIds":["day28-prac-1-a"],"hint":"Nghĩ về khái niệm 'chỉ nạp slice cần thiết' đã học trong bài.","solution":"day28-prac-1-a","explanation":"@WebMvcTest chỉ khởi tạo controller được chỉ định cùng hạ tầng MVC liên quan, không nạp Service/Repository thật - nhanh hơn nhiều. @SpringBootTest nạp toàn bộ Spring context giống ứng dụng chạy thật, phù hợp kiểm tra tích hợp đầu-cuối.","rubric":"Liên hệ đúng khái niệm slice test (nạp một phần) với full context (nạp toàn bộ).","sourceUsage":["day28-src-5","day28-src-13"]},{"id":"day28-prac-2","type":"coding","interaction":"self-check","prompt":"Viết khung một test class dùng @DataJpaTest với TestEntityManager để kiểm tra một repository.","choices":[],"correctChoiceIds":[],"hint":"Nhớ @Autowired cả TestEntityManager và repository cần test.","solution":"@DataJpaTest\nclass ProductRepositoryTest {\n\n    @Autowired\n    private TestEntityManager entityManager;\n\n    @Autowired\n    private ProductRepository productRepository;\n\n    @Test\n    void findsProductBySku() {\n        // persistAndFlush du lieu test roi goi productRepository...\n    }\n}","explanation":"Áp dụng lại khung @DataJpaTest + TestEntityManager đã học trong bài.","rubric":"Đánh giá đúng: có @DataJpaTest trên class, @Autowired cả TestEntityManager và repository.","sourceUsage":["day28-src-11"]},{"id":"day28-prac-3","type":"concept","interaction":"multiple-choice","prompt":"assertThrows trong JUnit 5 dùng để làm gì?","choices":[{"id":"day28-prac-3-a","text":"Kiểm tra một đoạn code có ném đúng loại exception mong đợi hay không"},{"id":"day28-prac-3-b","text":"Bỏ qua test nếu điều kiện giả định không đúng"},{"id":"day28-prac-3-c","text":"Gom nhiều assertion để chạy và báo cáo cùng lúc"},{"id":"day28-prac-3-d","text":"Sinh test động tại runtime"}],"correctChoiceIds":["day28-prac-3-a"],"hint":"Nhớ lại các dòng khối code kiểm tra exception trong ví dụ OrderCalculatorTest.","solution":"day28-prac-3-a","explanation":"assertThrows(ExceptionClass.class, executable) kiểm tra rằng đoạn code trong executable ném ra đúng loại exception được chỉ định, thất bại nếu không có exception nào hoặc sai loại.","rubric":"Liên hệ đúng mục đích kiểm tra exception của assertThrows.","sourceUsage":["day28-src-4"]},{"id":"day28-prac-4","type":"coding","interaction":"self-check","prompt":"webEnvironment nào của @SpringBootTest nên dùng khi cần gọi API qua RestAssured tới một server HTTP thật?","choices":[],"correctChoiceIds":[],"hint":"Nhớ lại 4 giá trị webEnvironment và ý nghĩa của từng loại.","solution":"SpringBootTest.WebEnvironment.RANDOM_PORT - khởi động server HTTP thật trên một cổng ngẫu nhiên, cho phép client HTTP thật (RestAssured) gọi vào.","explanation":"Áp dụng lại kiến thức về 4 chế độ webEnvironment đã học trong bài.","rubric":"Đánh giá đúng: chọn RANDOM_PORT và giải thích được lý do (cần server HTTP thật, không phải MockMvc giả lập).","sourceUsage":["day28-src-15"]}],"syllabusAssignments":[{"row":49,"text":"Assignment"}],"enhancedExercises":["Viết bộ test đầy đủ 3 tầng (unit @WebMvcTest, integration @DataJpaTest, end-to-end @SpringBootTest RANDOM_PORT) cho một endpoint của Assignment 9.","Thêm @TestFactory với DynamicTest để sinh nhiều test case kiểm tra validate input theo bảng dữ liệu."],"references":[{"id":"day28-ref-1","type":"external","resourceId":"res-bccebfeaf062","citationId":"day28-src-2","url":"https://www.baeldung.com/junit-5","label":"JUnit 5","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide to JUnit 5+ (Baeldung)","limitation":null},{"id":"day28-ref-2","type":"external","resourceId":"res-ae66be8c9f5f","citationId":"day28-src-5","url":"https://www.baeldung.com/spring-boot-testing","label":"Spring Boot Testing","checkStatus":"ok","readStatus":"read","pageTitle":"Testing in Spring Boot (Baeldung)","limitation":null},{"id":"day28-ref-3","type":"external","resourceId":"res-31a2e0685799","citationId":"day28-src-14","url":"https://docs.spring.io/spring-boot/reference/testing/spring-boot-applications.html","label":"Testing Spring Boot Applications","checkStatus":"ok","readStatus":"read","pageTitle":"Testing Spring Boot Applications (docs.spring.io)","limitation":null},{"id":"day28-ref-4","type":"external","resourceId":"res-3807593857d1","citationId":"day28-src-15","url":"https://www.baeldung.com/integration-testing-in-spring","label":"Integration Testing","checkStatus":"ok","readStatus":"read","pageTitle":"Integration Testing in Spring (Baeldung)","limitation":null},{"id":"day28-ref-5","type":"internal","resourceId":null,"citationId":null}],"unitNumber":10,"unitTitle":"Testing, Documentation, Monitoring \u0026 Docker"},{"id":"day-29","unitId":"unit-10","group":"spring","kind":"theory","title":"Documentation, Logging, Monitoring \u0026 Docker","summary":"Tài liệu API tự động với OpenAPI/Swagger, structured logging (ECS/GELF/Logstash + MDC), Actuator (health indicator, health group, expose mặc định giới hạn), và Testcontainers (quản lý container thật cho test tích hợp) - nền tảng cho Lab 10 (Day 30).","durationMinutes":150.0,"objectives":["LO10"],"prerequisites":["Đã học các kỹ thuật testing ở Day 28 - bài này mở rộng sang tài liệu hoá, giám sát, và container hoá cho môi trường production."],"outcomes":["Tích hợp được tài liệu API tự động (OpenAPI/Swagger) vào ứng dụng Spring Boot.","Bật được structured logging và thêm trường tuỳ chỉnh qua MDC.","Viết được HealthIndicator tuỳ chỉnh và hiểu phạm vi expose mặc định của Actuator.","Dùng được Testcontainers (@Testcontainers, @ServiceConnection, @DynamicPropertySource) cho test tích hợp."],"sections":[{"id":"day29-sec-brief","title":"Pham vi buoi hoc","blocks":[{"id":"day29-blk-1","type":"note","text":"Không có assignment riêng cho ngày này - nội dung là các kỹ thuật 'production readiness' (tài liệu API, logging có cấu trúc, giám sát, container hoá) sẽ được áp dụng đầy đủ, có trích dẫn, vào Lab 10 ở Day 30.","citations":[]}]},{"id":"day29-sec-openapi","title":"Tai lieu API voi OpenAPI/Swagger","blocks":[{"id":"day29-blk-2","type":"paragraph","text":"Thêm springdoc-openapi-starter-webmvc-ui vào classpath, Spring Boot tự động sinh tài liệu OpenAPI tại /v3/api-docs (JSON) và giao diện Swagger UI tại /swagger-ui.html - không cần viết tài liệu API thủ công. Có thể tích hợp thông tin OpenAPI vào endpoint Actuator, và lọc/loại trừ những endpoint không muốn xuất hiện trong tài liệu qua springdoc.packages-to-scan/springdoc.paths-to-match.","citations":["day29-src-1","day29-src-2","day29-src-3","day29-src-4"]},{"id":"day29-blk-3","type":"code","language":"text","code":"# pom.xml: them dependency springdoc-openapi-starter-webmvc-ui\n# \u003cdependency\u003e\n#   \u003cgroupId\u003eorg.springdoc\u003c/groupId\u003e\n#   \u003cartifactId\u003espringdoc-openapi-starter-webmvc-ui\u003c/artifactId\u003e\n#   \u003cversion\u003e2.6.0\u003c/version\u003e\n# \u003c/dependency\u003e\n\n# application.properties - mac dinh khong can cau hinh gi them:\n#   /v3/api-docs        -\u003e JSON dac ta OpenAPI\n#   /swagger-ui.html     -\u003e giao dien Swagger UI\n\n# Loc bot endpoint duoc dua vao tai lieu, chi lay nhung API cong khai:\nspringdoc.packages-to-scan=com.example.shop.api\nspringdoc.paths-to-match=/api/**\n\n# Tat han che documentation cho mot nhom endpoint noi bo:\n# springdoc.show-actuator=false\n","compile":false,"citations":["day29-src-1","day29-src-2","day29-src-4"],"partialReason":"Tep cau hinh application.properties/pom.xml, khong phai ma nguon Java bien dich duoc."}]},{"id":"day29-sec-logging","title":"Structured logging","blocks":[{"id":"day29-blk-4","type":"paragraph","text":"Từ Spring Boot 3.4.0, có thể bật structured logging (log dạng JSON, dễ phân tích bằng công cụ log tập trung) chỉ bằng một dòng cấu hình logging.structured.format.console, với 3 định dạng dựng sẵn: ecs (Elastic Common Schema), gelf (Graylog Extended Log Format), logstash. MDC (Mapped Diagnostic Context) cho phép thêm trường tuỳ chỉnh (như orderId, customerId) vào mọi dòng log ghi trong phạm vi đang xử lý.","citations":["day29-src-5","day29-src-6","day29-src-7"]},{"id":"day29-blk-5","type":"code","language":"text","code":"# application.properties - bat structured logging dinh dang ECS cho console (Spring Boot 3.4+)\nlogging.structured.format.console=ecs\n\n# Cac dinh dang dung san khac: gelf, logstash\n# logging.structured.format.console=logstash\n","compile":false,"citations":["day29-src-5","day29-src-6"],"partialReason":"Tep cau hinh application.properties, khong phai ma nguon Java bien dich duoc."},{"id":"day29-blk-6","type":"code","language":"java","code":"import org.slf4j.MDC;\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\nclass OrderProcessingService {\n\n    private static final Logger log = LoggerFactory.getLogger(OrderProcessingService.class);\n\n    void process(Long orderId, String customerId) {\n        // Them truong tuy chinh vao MDC - se tu dong xuat hien trong moi\n        // dong log structured (JSON) ghi ra trong pham vi nay.\n        MDC.put(\"orderId\", String.valueOf(orderId));\n        MDC.put(\"customerId\", customerId);\n        try {\n            log.info(\"Bat dau xu ly don hang\");\n            // ... xu ly nghiep vu ...\n            log.info(\"Xu ly don hang thanh cong\");\n        } finally {\n            MDC.clear();\n        }\n    }\n}\n","compile":false,"citations":["day29-src-7"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day29-blk-7","type":"note","text":"Việc lan truyền traceId xuyên suốt một request qua nhiều service (distributed tracing, ví dụ với Micrometer Tracing) không có resource nào trong resourceIds của Day 29 (hay bất kỳ lesson nào khác trong bộ nguồn hiện có) mô tả - đây là khoảng trống kiến thức thật sự. Trình bày dưới dạng ghi chú không trích dẫn.","citations":[]}]},{"id":"day29-sec-actuator","title":"Actuator va giam sat","blocks":[{"id":"day29-blk-8","type":"paragraph","text":"Spring Boot Actuator cung cấp các endpoint sẵn có để theo dõi và quản lý ứng dụng đang chạy (health, metrics, env, loggers...) qua HTTP hoặc JMX. Mặc định chỉ expose /health và /info qua HTTP (vì lý do bảo mật) - cần bật thêm các endpoint khác qua management.endpoints.web.exposure.include khi cần. Có thể viết HealthIndicator tuỳ chỉnh để kiểm tra tình trạng của một phụ thuộc cụ thể (như payment gateway), và nhóm các health indicator liên quan lại bằng health group (ví dụ readiness/liveness).","citations":["day29-src-8","day29-src-9","day29-src-10","day29-src-11"]},{"id":"day29-blk-9","type":"code","language":"java","code":"import org.springframework.boot.actuate.health.Health;\nimport org.springframework.boot.actuate.health.HealthIndicator;\nimport org.springframework.stereotype.Component;\n\n// Actuator mac dinh chi expose /health va /info; can bat them cac endpoint\n// khac qua management.endpoints.web.exposure.include neu can (vi du /metrics,/loggers).\n@Component\nclass PaymentGatewayHealthIndicator implements HealthIndicator {\n\n    @Override\n    public Health health() {\n        boolean reachable = pingPaymentGateway();\n        if (reachable) {\n            return Health.up().withDetail(\"paymentGateway\", \"reachable\").build();\n        }\n        return Health.down().withDetail(\"paymentGateway\", \"unreachable\").build();\n    }\n\n    private boolean pingPaymentGateway() {\n        return true;\n    }\n}\n\n// application.properties tuong ung:\n// management.endpoints.web.exposure.include=health,info,metrics\n// management.endpoint.health.group.readiness.include=paymentGateway,db\n","compile":false,"citations":["day29-src-9","day29-src-11"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day29-blk-10","type":"note","text":"Xuất metrics theo định dạng Prometheus (thường qua micrometer-registry-prometheus và endpoint /actuator/prometheus) không có resource nào trong resourceIds của Day 29 (hay Day 30) mô tả - đây là khoảng trống kiến thức thật sự trong bộ nguồn hiện có. Trình bày dưới dạng ghi chú không trích dẫn.","citations":[]}]},{"id":"day29-sec-docker","title":"Docker va docker-compose (gioi thieu)","blocks":[{"id":"day29-blk-11","type":"note","text":"Đóng gói ứng dụng bằng Docker (layered jar, Dockerfile) và chạy phụ thuộc (DB, Redis) bằng docker-compose không có resource nào trong resourceIds của Day 29 - hai resource tương ứng thuộc resourceIds của Day 30, nơi kỹ thuật này được áp dụng trực tiếp vào Lab 10 và có trích dẫn đầy đủ. Trình bày khái niệm tổng quan trong khối note không yêu cầu trích dẫn ở đây.","citations":[]}]},{"id":"day29-sec-testcontainers","title":"Testcontainers","blocks":[{"id":"day29-blk-12","type":"paragraph","text":"Testcontainers chạy các phụ thuộc thật (database, message broker...) trong Docker container dành riêng cho test tích hợp, thay vì H2 in-memory hay mock - đảm bảo test chạy sát với môi trường production hơn. @Testcontainers kết hợp @Container quản lý vòng đời container theo vòng đời test class (JUnit Extension). @ServiceConnection tự động tạo ConnectionDetails và trỏ Spring Boot vào container mà không cần cấu hình thủ công; @DynamicPropertySource chỉ cần dùng cho những cấu hình mà @ServiceConnection chưa hỗ trợ sẵn.","citations":["day29-src-12","day29-src-13","day29-src-14"]},{"id":"day29-blk-13","type":"code","language":"java","code":"import org.junit.jupiter.api.Test;\nimport org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.boot.testcontainers.service.connection.ServiceConnection;\nimport org.springframework.test.context.DynamicPropertyRegistry;\nimport org.springframework.test.context.DynamicPropertySource;\nimport org.testcontainers.containers.PostgreSQLContainer;\nimport org.testcontainers.junit.jupiter.Container;\nimport org.testcontainers.junit.jupiter.Testcontainers;\n\n// @Testcontainers quan ly vong doi container (start/stop) theo vong doi test class.\n@Testcontainers\n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\nclass OrderApiIntegrationTest {\n\n    // @ServiceConnection tu dong tao ConnectionDetails va tro Spring Boot vao\n    // container nay - khong can @DynamicPropertySource thu cong cho cau hinh datasource pho bien.\n    @Container\n    @ServiceConnection\n    static PostgreSQLContainer\u003c?\u003e postgres = new PostgreSQLContainer\u003c\u003e(\"postgres:16-alpine\");\n\n    // Chi can dung @DynamicPropertySource cho cau hinh KHONG duoc @ServiceConnection ho tro san.\n    @DynamicPropertySource\n    static void extraProperties(DynamicPropertyRegistry registry) {\n        registry.add(\"app.feature-flag.new-checkout\", () -\u003e \"true\");\n    }\n\n    @Test\n    void containerStartsAndAppConnects() {\n        // RestAssured/WebTestClient goi API that qua RANDOM_PORT o day.\n    }\n}\n","compile":false,"citations":["day29-src-12","day29-src-13","day29-src-15","day29-src-16"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]}],"commonMistakes":["Bật toàn bộ endpoint Actuator (management.endpoints.web.exposure.include=*) trên môi trường production mà không kiểm soát truy cập - lộ thông tin nhạy cảm như biến môi trường, bean nội bộ.","Dùng @DynamicPropertySource thủ công cho mọi container thay vì @ServiceConnection khi container đó đã được hỗ trợ sẵn - dư thừa code không cần thiết.","Quên MDC.clear() sau khi xử lý xong, khiến trường log của request trước rò rỉ sang request/luồng xử lý sau (đặc biệt khi dùng thread pool tái sử dụng luồng)."],"practices":[{"id":"day29-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Mặc định, Actuator expose những endpoint HTTP nào?","choices":[{"id":"day29-prac-1-a","text":"Chỉ /health và /info"},{"id":"day29-prac-1-b","text":"Tất cả endpoint (bao gồm /beans, /env, /loggers)"},{"id":"day29-prac-1-c","text":"Chỉ /metrics"},{"id":"day29-prac-1-d","text":"Không expose endpoint nào cho tới khi được bật thủ công"}],"correctChoiceIds":["day29-prac-1-a"],"hint":"Nhớ lại lý do bảo mật khiến Spring Boot không mở rộng mặc định.","solution":"day29-prac-1-a","explanation":"Vì lý do bảo mật, Actuator mặc định chỉ expose /health và /info qua HTTP - các endpoint nhạy cảm hơn (như /env, /beans, /loggers) cần được bật rõ ràng qua management.endpoints.web.exposure.include.","rubric":"Liên hệ đúng lý do bảo mật với việc giới hạn expose mặc định.","sourceUsage":["day29-src-9"]},{"id":"day29-prac-2","type":"coding","interaction":"self-check","prompt":"Viết khung một HealthIndicator tuỳ chỉnh kiểm tra kết nối tới một dịch vụ bên ngoài.","choices":[],"correctChoiceIds":[],"hint":"Implement interface HealthIndicator, trả về Health.up()/Health.down().","solution":"@Component\nclass ExternalServiceHealthIndicator implements HealthIndicator {\n    @Override\n    public Health health() {\n        return isReachable() ? Health.up().build() : Health.down().build();\n    }\n}","explanation":"Áp dụng lại khung HealthIndicator đã học trong bài.","rubric":"Đánh giá đúng: implements HealthIndicator, override health(), trả về Health.up()/down().","sourceUsage":["day29-src-11"]},{"id":"day29-prac-3","type":"concept","interaction":"multiple-choice","prompt":"@ServiceConnection khác @DynamicPropertySource ở điểm nào?","choices":[{"id":"day29-prac-3-a","text":"@ServiceConnection tự động tạo ConnectionDetails cho các loại container phổ biến (không cần cấu hình thủ công), @DynamicPropertySource cần khai báo tay từng property"},{"id":"day29-prac-3-b","text":"@DynamicPropertySource chỉ dùng được với PostgreSQL, @ServiceConnection dùng cho mọi database"},{"id":"day29-prac-3-c","text":"Hai annotation này không thể dùng cùng lúc trong một test class"},{"id":"day29-prac-3-d","text":"@ServiceConnection chỉ hoạt động khi không dùng @Testcontainers"}],"correctChoiceIds":["day29-prac-3-a"],"hint":"Nghĩ về việc annotation nào tự động hoá, annotation nào cần khai báo thủ công từng property.","solution":"day29-prac-3-a","explanation":"@ServiceConnection nhận diện loại container (Postgres, Redis, Neo4j...) và tự động tạo ConnectionDetails phù hợp, trỏ Spring Boot vào container mà không cần khai báo property thủ công. @DynamicPropertySource vẫn cần thiết cho những cấu hình mà @ServiceConnection chưa hỗ trợ sẵn.","rubric":"Liên hệ đúng mức độ tự động hoá giữa hai cơ chế.","sourceUsage":["day29-src-13","day29-src-14"]},{"id":"day29-prac-4","type":"coding","interaction":"self-check","prompt":"Viết dòng cấu hình bật structured logging định dạng ECS cho console.","choices":[],"correctChoiceIds":[],"hint":"Property bắt đầu bằng logging.structured.format.","solution":"logging.structured.format.console=ecs","explanation":"Áp dụng lại đúng property đã học trong bài.","rubric":"Đánh giá đúng: property logging.structured.format.console với giá trị ecs.","sourceUsage":["day29-src-5"]}],"syllabusAssignments":[],"enhancedExercises":["Thêm health group 'readiness' gồm HealthIndicator của database và payment gateway, kiểm tra qua /actuator/health/readiness.","Cấu hình springdoc để ẩn hoàn toàn các endpoint nội bộ (packagesToScan chỉ trỏ vào package api công khai)."],"references":[{"id":"day29-ref-1","type":"external","resourceId":"res-79cbefdda273","citationId":"day29-src-2","url":"https://springdoc.org/","label":"OpenAPI / SpringDoc","checkStatus":"redirected","readStatus":"read","pageTitle":"springdoc-openapi (springdoc.org, redirected)","limitation":null},{"id":"day29-ref-2","type":"external","resourceId":"res-93813d9b62f4","citationId":"day29-src-6","url":"https://www.baeldung.com/spring-boot-structured-logging","label":"Structured Logging","checkStatus":"ok","readStatus":"read","pageTitle":"Structured Logging in Spring Boot (Baeldung)","limitation":null},{"id":"day29-ref-3","type":"external","resourceId":"res-fa57300ac53c","citationId":"day29-src-9","url":"https://www.baeldung.com/spring-boot-actuators","label":"Actuator","checkStatus":"ok","readStatus":"read","pageTitle":"Spring Boot Actuator (Baeldung)","limitation":null},{"id":"day29-ref-4","type":"external","resourceId":"res-be79b4f73d01","citationId":"day29-src-13","url":"https://docs.spring.io/spring-boot/reference/testing/testcontainers.html","label":"Testcontainers for Spring Boot","checkStatus":"ok","readStatus":"read","pageTitle":"Testcontainers reference (Spring Boot, docs.spring.io)","limitation":null},{"id":"day29-ref-5","type":"external","resourceId":"res-84fc38d27c0a","citationId":"day29-src-15","url":"https://testcontainers.com/guides/testing-spring-boot-rest-api-using-testcontainers/","label":"Testcontainers","checkStatus":"ok","readStatus":"read","pageTitle":"Getting started with Testcontainers in a Java Spring Boot Project (testcontainers.com guide)","limitation":null},{"id":"day29-ref-6","type":"internal","resourceId":null,"citationId":null}],"unitNumber":10,"unitTitle":"Testing, Documentation, Monitoring \u0026 Docker"},{"id":"day-30","unitId":"unit-10","group":"spring","kind":"lab","title":"- Lab 10: Production Readiness","summary":"Lab tổng hợp Unit 10: unit/integration test với Testcontainers, JaCoCo coverage, tài liệu OpenAPI cho toàn bộ endpoint, structured logging, Actuator/Prometheus/HealthIndicator, Dockerfile + docker-compose (layered jar), và pipeline GitHub Actions CI - đưa dự án e-commerce đạt chuẩn production readiness.","durationMinutes":150.0,"objectives":["LO10"],"prerequisites":["Đã học testing (Day 28) và tài liệu/logging/giám sát/Testcontainers (Day 29) - Lab này tổng hợp toàn bộ vào dự án e-commerce."],"outcomes":["Xây dựng được bộ test hai tầng (unit @WebMvcTest + integration Testcontainers) cho service.","Đóng gói ứng dụng bằng Dockerfile layered jar và chạy phụ thuộc qua docker-compose.","Tích hợp tài liệu OpenAPI cho toàn bộ endpoint REST của dự án.","Nhận diện đúng những mảng cấu hình production readiness còn là khoảng trống kiến thức (JaCoCo, traceId, Prometheus, CI) cần tự nghiên cứu thêm."],"sections":[{"id":"day30-sec-brief","title":"De bai Lab 10","blocks":[{"id":"day30-blk-1","type":"deliverable","text":"- Lab 10: Production Readiness\n  - Unit test + Integration test (Testcontainers) for all service\n  - JaCoCo coverage report ≥ 75%\n  - OpenAPI doc for all endpoint\n  - JSON structured logging + traceId propagation\n  - Actuator + Prometheus metrics + custom HealthIndicator\n  - Dockerfile + docker-compose.yml (app + DB + Redis)\n  - GitHub Actions CI: build → test → docker build","citations":[]},{"id":"day30-blk-2","type":"note","text":"Lab tổng hợp cuối Unit 10 - đưa dự án e-commerce đã xây dựng xuyên suốt khoá học đạt chuẩn 'production readiness' bằng cách áp dụng đầy đủ các kỹ thuật testing (Day 28), tài liệu/logging/giám sát/Testcontainers (Day 29), và container hoá.","citations":[]}]},{"id":"day30-sec-testing","title":"Unit test + Integration test (Testcontainers)","blocks":[{"id":"day30-blk-3","type":"paragraph","text":"Mỗi service cần cả hai tầng test: unit test tầng controller bằng @WebMvcTest (nhanh, không cần container), và integration test bằng @SpringBootTest kết hợp Testcontainers - @ServiceConnection trỏ Spring Boot vào một PostgreSQLContainer thật, còn @DynamicPropertySource dùng cho cấu hình chưa được hỗ trợ sẵn; RestAssured qua webEnvironment RANDOM_PORT gọi API thật để xác nhận toàn bộ luồng từ HTTP tới database hoạt động đúng.","citations":["day30-src-1","day30-src-3","day30-src-4","day30-src-5"]},{"id":"day30-blk-4","type":"code","language":"java","code":"import org.junit.jupiter.api.Test;\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;\nimport org.springframework.boot.test.mock.mockito.MockBean;\nimport org.springframework.test.web.servlet.MockMvc;\n\nimport static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.get;\nimport static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;\n\n// Unit test tang controller - nhanh, khong can container that.\n@WebMvcTest(OrderController.class)\nclass OrderControllerTest {\n\n    @Autowired\n    private MockMvc mockMvc;\n\n    @MockBean\n    private OrderService orderService;\n\n    @Test\n    void listOrdersReturnsOk() throws Exception {\n        mockMvc.perform(get(\"/api/orders\")).andExpect(status().isOk());\n    }\n\n    interface OrderService {}\n    interface OrderController {}\n}\n","compile":false,"citations":["day30-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day30-blk-5","type":"code","language":"java","code":"import io.restassured.RestAssured;\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.Test;\nimport org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.boot.test.web.server.LocalServerPort;\nimport org.springframework.boot.testcontainers.service.connection.ServiceConnection;\nimport org.testcontainers.containers.PostgreSQLContainer;\nimport org.testcontainers.junit.jupiter.Container;\nimport org.testcontainers.junit.jupiter.Testcontainers;\n\nimport static io.restassured.RestAssured.given;\n\n// Test tich hop that: container Postgres that + server HTTP that tren cong ngau nhien.\n@Testcontainers\n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\nclass OrderApiIntegrationTest {\n\n    @Container\n    @ServiceConnection\n    static PostgreSQLContainer\u003c?\u003e postgres = new PostgreSQLContainer\u003c\u003e(\"postgres:16-alpine\");\n\n    @LocalServerPort\n    private int port;\n\n    @BeforeEach\n    void setUp() {\n        RestAssured.port = port;\n    }\n\n    @Test\n    void listsOrdersFromRealDatabase() {\n        given()\n                .when().get(\"/api/orders\")\n                .then()\n                .statusCode(200);\n    }\n}\n","compile":false,"citations":["day30-src-3","day30-src-4","day30-src-5"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day30-blk-6","type":"note","text":"Cơ chế Testcontainers chi tiết (@Testcontainers, @Container, @ServiceConnection tự động cho từng loại container) đã có trích dẫn đầy đủ ở Day 29 - resource tương ứng (res-be79b4f73d01) thuộc resourceIds của Day 29, không lặp lại trong resourceIds của Day 30 theo nguyên tắc không mượn citation chéo. Ở đây áp dụng lại nguyên mẫu đã học vào ví dụ PostgreSQLContainer cụ thể (được trích dẫn qua resource riêng của Day 30).","citations":[]}]},{"id":"day30-sec-jacoco","title":"JaCoCo coverage report \u003e= 75%","blocks":[{"id":"day30-blk-7","type":"note","text":"Đo độ phủ test (code coverage) bằng JaCoCo và thiết lập ngưỡng tối thiểu (ví dụ 75%) qua jacoco-maven-plugin không có resource nào trong toàn bộ course-catalog mô tả - đây là khoảng trống kiến thức thật sự. Học viên tự tham khảo tài liệu chính thức của jacoco-maven-plugin (mục tiêu report và check với rule minimum coverage) khi triển khai; nội dung này không được trình bày có trích dẫn ở đây.","citations":[]}]},{"id":"day30-sec-openapi","title":"OpenAPI doc cho toan bo endpoint","blocks":[{"id":"day30-blk-8","type":"paragraph","text":"Áp dụng lại đúng cấu hình springdoc-openapi đã học ở Day 29 - resource này (res-79cbefdda273) nằm trong resourceIds của cả Day 29 và Day 30 nên được trích dẫn hợp lệ ở đây: thêm springdoc-openapi-starter-webmvc-ui, tài liệu tự sinh tại /v3/api-docs và giao diện Swagger UI tại /swagger-ui.html cho toàn bộ endpoint REST của dự án.","citations":["day30-src-6","day30-src-7"]}]},{"id":"day30-sec-logging","title":"JSON structured logging + traceId propagation","blocks":[{"id":"day30-blk-9","type":"note","text":"Bật structured logging (logging.structured.format.console=ecs) áp dụng lại đúng cấu hình đã học có trích dẫn ở Day 29 - resource tương ứng (res-93813d9b62f4) thuộc resourceIds của Day 29, không lặp lại trong resourceIds của Day 30. Riêng việc lan truyền traceId xuyên suốt nhiều service (distributed tracing) là khoảng trống kiến thức thật sự - không có resource nào trong toàn bộ course-catalog mô tả chủ đề này. Cả hai nội dung được trình bày không trích dẫn ở đây.","citations":[]}]},{"id":"day30-sec-actuator","title":"Actuator + Prometheus + custom HealthIndicator","blocks":[{"id":"day30-blk-10","type":"note","text":"HealthIndicator tuỳ chỉnh và phạm vi expose mặc định của Actuator (chỉ /health, /info) áp dụng lại đúng mẫu đã học có trích dẫn ở Day 29 - resource tương ứng (res-fa57300ac53c) thuộc resourceIds của Day 29, không lặp lại trong resourceIds của Day 30. Riêng việc xuất metrics theo định dạng Prometheus (micrometer-registry-prometheus, endpoint /actuator/prometheus) là khoảng trống kiến thức thật sự - không có resource nào trong toàn bộ course-catalog mô tả chủ đề này. Cả hai nội dung được trình bày không trích dẫn ở đây.","citations":[]}]},{"id":"day30-sec-docker","title":"Dockerfile + docker-compose.yml","blocks":[{"id":"day30-blk-11","type":"paragraph","text":"Fat jar truyền thống (một layer JAR duy nhất) khiến mỗi lần build lại Docker image phải build lại toàn bộ layer kể cả khi chỉ code ứng dụng thay đổi (dependency không đổi) - lãng phí thời gian và băng thông. Layered jar tách JAR thành 4 layer mặc định (dependencies, snapshot-dependencies, spring-boot-loader, application), cho phép Docker cache riêng từng layer; lệnh java -Djarmode=layertools -jar app.jar extract trong Dockerfile nhiều giai đoạn (multi-stage) trích các layer này ra để COPY riêng lẻ.","citations":["day30-src-8","day30-src-9","day30-src-10"]},{"id":"day30-blk-12","type":"code","language":"text","code":"# Dockerfile - multi-stage build su dung layered jar (Spring Boot Buildpacks/layertools)\nFROM eclipse-temurin:17-jre-alpine AS builder\nWORKDIR /application\nCOPY target/*.jar application.jar\n# Tach jar thanh 4 layer mac dinh: dependencies, spring-boot-loader,\n# snapshot-dependencies, application - de Docker cache rieng tung layer,\n# chi rebuild lai layer \"application\" (code cua chung ta) khi code thay doi.\nRUN java -Djarmode=layertools -jar application.jar extract\n\nFROM eclipse-temurin:17-jre-alpine\nWORKDIR /application\nCOPY --from=builder /application/dependencies/ ./\nCOPY --from=builder /application/spring-boot-loader/ ./\nCOPY --from=builder /application/snapshot-dependencies/ ./\nCOPY --from=builder /application/application/ ./\nENTRYPOINT [\"java\", \"org.springframework.boot.loader.launch.JarLauncher\"]\n","compile":false,"citations":["day30-src-9","day30-src-10"],"partialReason":"Dockerfile, khong phai ma nguon Java bien dich duoc."},{"id":"day30-blk-13","type":"paragraph","text":"docker-compose.yml định nghĩa toàn bộ dịch vụ (app, database, Redis) chạy cùng nhau; với spring-boot-docker-compose trên classpath, Spring Boot tự động chạy docker compose up/down khi khởi động/tắt ứng dụng ở chế độ dev, và tự động tạo ConnectionDetails cho các service phổ biến (cùng cơ chế Service Connections như Testcontainers) - image tuỳ chỉnh cần gắn nhãn org.springframework.boot.service-connection để được nhận diện đúng loại dịch vụ.","citations":["day30-src-11","day30-src-12","day30-src-13"]},{"id":"day30-blk-14","type":"code","language":"text","code":"# docker-compose.yml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n    depends_on:\n      - db\n      - redis\n\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: shop\n      POSTGRES_PASSWORD: secret\n    ports:\n      - \"5432:5432\"\n\n  redis:\n    image: redis:7-alpine\n    ports:\n      - \"6379:6379\"\n\n# Voi spring-boot-docker-compose tren classpath, Spring Boot tu dong chay\n# \"docker compose up\" khi khoi dong ung dung o che do dev, va tu dong tao\n# ConnectionDetails cho db/redis qua co che Service Connections (nhu Testcontainers).\n","compile":false,"citations":["day30-src-11","day30-src-12"],"partialReason":"docker-compose.yml, khong phai ma nguon Java bien dich duoc."}]},{"id":"day30-sec-ci","title":"GitHub Actions CI: build -\u003e test -\u003e docker build","blocks":[{"id":"day30-blk-15","type":"note","text":"Thiết lập pipeline GitHub Actions gồm 3 bước tuần tự (build → test → docker build) không có resource nào trong toàn bộ course-catalog mô tả - đây là khoảng trống kiến thức thật sự. Học viên tự tham khảo tài liệu chính thức của GitHub Actions (actions/setup-java, mvn verify, docker/build-push-action) khi triển khai; nội dung này không được trình bày có trích dẫn ở đây.","citations":[]}]}],"commonMistakes":["Chỉ viết unit test (@WebMvcTest) mà bỏ qua integration test với Testcontainers - không phát hiện được lỗi ở tầng persistence (query SQL sai, ràng buộc database).","Copy toàn bộ project vào Docker image thay vì dùng layered jar/multi-stage build - image nặng và build chậm không cần thiết mỗi khi code thay đổi.","Đặt bước docker build TRƯỚC bước test trong pipeline CI - lãng phí thời gian đóng gói image từ code chưa được kiểm chứng, và có thể publish image lỗi."],"practices":[{"id":"day30-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao layered jar giúp Docker build nhanh hơn khi chỉ code ứng dụng thay đổi?","choices":[{"id":"day30-prac-1-a","text":"Vì 4 layer (dependencies/snapshot-dependencies/loader/application) được cache riêng - Docker chỉ cần rebuild lại layer application thay vì toàn bộ jar"},{"id":"day30-prac-1-b","text":"Vì layered jar nhỏ hơn fat jar về dung lượng đĩa"},{"id":"day30-prac-1-c","text":"Vì layered jar không cần JDK để chạy"},{"id":"day30-prac-1-d","text":"Vì Docker tự động nén layered jar tốt hơn fat jar"}],"correctChoiceIds":["day30-prac-1-a"],"hint":"Nghĩ về việc Docker cache layer nào không đổi giữa các lần build.","solution":"day30-prac-1-a","explanation":"Layered jar tách jar thành 4 layer riêng biệt; layer dependencies hiếm khi đổi nên Docker cache lại, chỉ layer application (code của chúng ta) cần rebuild khi code thay đổi - nhanh hơn nhiều so với việc phải build lại toàn bộ fat jar một layer duy nhất.","rubric":"Liên hệ đúng cơ chế cache theo layer của Docker với cấu trúc 4 layer mặc định.","sourceUsage":["day30-src-9"]},{"id":"day30-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một service trong docker-compose.yml chạy Redis cho ứng dụng, expose cổng mặc định.","choices":[],"correctChoiceIds":[],"hint":"Dùng image chính thức redis, map cổng 6379.","solution":"redis:\n  image: redis:7-alpine\n  ports:\n    - \"6379:6379\"","explanation":"Áp dụng lại mẫu docker-compose.yml đã học trong bài.","rubric":"Đánh giá đúng: service dùng image redis, map cổng 6379:6379.","sourceUsage":["day30-src-11"]},{"id":"day30-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao test tích hợp dùng PostgreSQLContainer (Testcontainers) đáng tin cậy hơn dùng H2 in-memory để kiểm tra tầng persistence?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về sự khác biệt hành vi SQL giữa H2 và PostgreSQL thật.","solution":"H2 mô phỏng hành vi của nhiều loại database khác nhau nhưng không hoàn toàn giống PostgreSQL thật (khác biệt về kiểu dữ liệu, hàm SQL, ràng buộc) - test có thể pass trên H2 nhưng lỗi khi chạy trên PostgreSQL thật ở production. PostgreSQLContainer chạy đúng phiên bản PostgreSQL thật trong Docker, nên test tích hợp phản ánh chính xác hành vi production hơn.","explanation":"Liên hệ đúng rủi ro khác biệt hành vi SQL giữa database giả lập và database thật.","rubric":"Đánh giá học viên nêu đúng: PostgreSQLContainer chạy database thật, tránh sai khác hành vi SQL so với H2 giả lập.","sourceUsage":["day30-src-3"]},{"id":"day30-prac-4","type":"concept","interaction":"multiple-choice","prompt":"Theo đề bài Lab 10, thứ tự đúng của pipeline GitHub Actions CI là gì?","choices":[{"id":"day30-prac-4-a","text":"build -\u003e test -\u003e docker build"},{"id":"day30-prac-4-b","text":"docker build -\u003e build -\u003e test"},{"id":"day30-prac-4-c","text":"test -\u003e docker build -\u003e build"},{"id":"day30-prac-4-d","text":"Thứ tự không quan trọng, có thể chạy song song hoàn toàn"}],"correctChoiceIds":["day30-prac-4-a"],"hint":"Nhớ lại đúng thứ tự được ghi trong đề bài Lab 10.","solution":"day30-prac-4-a","explanation":"Pipeline chạy tuần tự: build (biên dịch) trước, rồi test (chỉ test code đã build thành công), cuối cùng mới docker build (chỉ đóng gói image khi test đã pass) - tránh lãng phí thời gian đóng gói image từ code chưa được kiểm chứng.","rubric":"Liên hệ đúng thứ tự build -\u003e test -\u003e docker build như đề bài yêu cầu.","sourceUsage":[]}],"syllabusAssignments":[{"row":52,"text":"- Lab 10: Production Readiness\n  - Unit test + Integration test (Testcontainers) for all service\n  - JaCoCo coverage report ≥ 75%\n  - OpenAPI doc for all endpoint\n  - JSON structured logging + traceId propagation\n  - Actuator + Prometheus metrics + custom HealthIndicator\n  - Dockerfile + docker-compose.yml (app + DB + Redis)\n  - GitHub Actions CI: build → test → docker build"}],"enhancedExercises":["Thêm health group 'readiness' vào docker-compose healthcheck để container app chỉ được coi là sẵn sàng khi database/Redis đã kết nối được.","Đo thử JaCoCo coverage hiện tại của dự án và xác định những class nào cần thêm test để đạt ngưỡng 75%."],"references":[{"id":"day30-ref-1","type":"external","resourceId":"res-ae66be8c9f5f","citationId":"day30-src-2","url":"https://www.baeldung.com/spring-boot-testing","label":"Spring Boot Testing","checkStatus":"ok","rea     function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      return { view: "dashboard" };
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    const STATE_VERSION = 1;

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      escapeHtml, safeExternalUrl,
    });
    /* COURSE_CORE_END */

    /* ============================================================

    (function () {

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {

      /* ---- route render ---------------------------------------------- */

      }
      window.addEventListener('hashchange', function(){ routeRender(); });

      /* ---- dashboard ------------------------------------------------- */
      function renderDashboard(container) {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var jp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'java');

        /* Continue learning */
        var unfinished = courseData.lessons.find(function(l){return state.completed.indexOf(l.id)===-1;});
        var target = (state.lastLessonId && lessonsById.has(state.lastLessonId) && state.completed.indexOf(state.lastLessonId)===-1) ? state.lastLessonId : (unfinished ? unfinished.id : 'day-01');

        /* Reactor summary — one row per unit, in the vernacular of a
