hong rang buoc kieu, nhan TypeMismatchException khi client gui gia tri sai kieu.","Lam dung ResponseEntity cho moi endpoint don gian thay vi @ResponseBody/@ResponseStatus."],"practices":[{"id":"day16-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Pattern URI nao chi khop dung mot bien path segment duoc dung kieu so (vi du chi chap nhan /products/42, khong chap nhan /products/abc)?","choices":[{"id":"day16-prac-1-a","text":"/products/{id:[\\d]+}"},{"id":"day16-prac-1-b","text":"/products/*"},{"id":"day16-prac-1-c","text":"/products/**"},{"id":"day16-prac-1-d","text":"/products/?"}],"correctChoiceIds":["day16-prac-1-a"],"hint":"Doc lai bang cu phap URI pattern trong bai.","solution":"day16-prac-1-a","explanation":"{name:regex} bat bien path segment theo bieu thuc chinh quy; {id:[\\d]+} chi khop gia tri gom toan chu so, cac lua chon con lai (*, **, ?) chi khop ky tu/segment bat ky, khong rang buoc kieu du lieu.","rubric":"Chon dung cu phap {name:regex}, phan biet voi cac wildcard * ** ? khong rang buoc kieu.","sourceUsage":["day16-src-2","day16-src-3"]},{"id":"day16-prac-2","type":"coding","interaction":"self-check","prompt":"Viet mot method controller GET /api/products/{id} tra ve ResponseEntity\u003cProduct\u003e: 200 kem body neu tim thay, 404 rong neu khong.","choices":[],"correctChoiceIds":[],"hint":"Dung repository.findById(id) tra ve Optional roi map/orElseGet nhu vi du trong bai.","solution":"@GetMapping(\"/{id}\")\nResponseEntity\u003cProduct\u003e findById(@PathVariable long id) {\n    return repository.findById(id)\n            .map(ResponseEntity::ok)\n            .orElseGet(() -\u003e ResponseEntity.notFound().build());\n}","explanation":"Ap dung lai mau map(ResponseEntity::ok).orElseGet(() -\u003e ResponseEntity.notFound().build()) tu vi du trong bai.","rubric":"Danh gia dung: co @PathVariable, tra 200 kem body khi tim thay, 404 rong khi khong tim thay.","sourceUsage":["day16-src-8","day16-src-9"]},{"id":"day16-prac-3","type":"concept","interaction":"self-check","prompt":"Hai method controller cung nhan GET /api/items, khong khac gi ve params/headers/media type. Dieu gi xay ra luc khoi dong ung dung va cach khac phuc?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan canh bao ve Ambiguous Mapping trong bai.","solution":"Spring nem IllegalStateException bao ambiguous mapping ngay luc khoi dong ung dung. Khac phuc bang cach phan biet hai method qua produces/consumes khac nhau, hoac doi URL cua mot trong hai method de chung khong con trung nhau hoan toan.","explanation":"Nho lai loi ambiguous mapping xay ra luc khoi dong, khong phai luc goi request.","rubric":"Danh gia hoc vien neu dung thoi diem loi xay ra va it nhat mot cach khac phuc hop ly.","sourceUsage":["day16-src-7"]},{"id":"day16-prac-4","type":"concept","interaction":"self-check","prompt":"Khi nao nen dung @ResponseStatus + @ResponseBody thay vi ResponseEntity cho mot endpoint?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan 'Khong nen lam dung ResponseEntity' trong bai.","solution":"Nen dung khi endpoint chi can tra du lieu voi mot ma trang thai co dinh, khong can kiem soat dong (per-request) status code hay headers tuy bien - dung @ResponseBody de tra du lieu va @ResponseStatus de dat ma trang thai co dinh cho response thanh cong.","explanation":"Lien ket voi khuyen nghi khong lam dung ResponseEntity da neu trong bai.","rubric":"Danh gia hoc vien neu dung dieu kien: status co dinh, khong can dieu chinh dong theo tung request.","sourceUsage":["day16-src-10"]}],"syllabusAssignments":[{"row":29,"text":"Assignment"}],"enhancedExercises":["Them consumes/produces cho ProductController.create de chi chap nhan application/json va tra loi 415 voi Content-Type khac.","Viet test goi hai endpoint gay ambiguous mapping co chu y va sua bang produces khac nhau."],"references":[{"id":"day16-ref-1","type":"external","resourceId":"res-2aefb097db80","citationId":"day16-src-1","url":"https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html","label":"Request Mapping","checkStatus":"ok","readStatus":"read","pageTitle":"Mapping Requests :: Spring Framework (docs.spring.io — Annotated Controllers)","limitation":null},{"id":"day16-ref-2","type":"external","resourceId":"res-06dd51e41e25","citationId":"day16-src-8","url":"https://www.baeldung.com/spring-response-entity","label":"ResponseEntity","checkStatus":"ok","readStatus":"read","pageTitle":"Using Spring ResponseEntity to Manipulate the HTTP Response | Baeldung","limitation":null},{"id":"day16-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":6,"unitTitle":"Spring MVC — In-Depth REST API"},{"id":"day-17","unitId":"unit-06","group":"spring","kind":"theory","title":"Validation \u0026 Exception Handling","summary":"Bean Validation voi @Valid/jakarta.validation.constraints, xu ly MethodArgumentNotValidException; dinh nghia custom validator (@Constraint + ConstraintValidator, ke ca validate cap class); @RestControllerAdvice va ProblemDetail (RFC 7807) de chuan hoa response loi, kem ghi chu ve ten goi RFC 9457 sau nay.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Da hoc Day 16 (controller, @RequestBody, ResponseEntity) - validation va exception handling ap dung truc tiep len cac controller da xay dung."],"outcomes":["Gan dung constraint Bean Validation va dung @Valid tren @RequestBody.","Viet duoc custom validator (annotation + ConstraintValidator), ke ca validate cap class.","Xu ly loi tap trung bang @RestControllerAdvice thay vi try/catch rai rac tung controller.","Tra ve ProblemDetail chuan hoa theo RFC 7807 cho cac loi API."],"sections":[{"id":"day17-sec-brief","title":"De bai va pham vi bai hoc","blocks":[{"id":"day17-blk-1","type":"deliverable","text":"Guides/Review","citations":[]},{"id":"day17-blk-2","type":"note","text":"Bai hoc ve Bean Validation (jakarta.validation), custom validator, xu ly loi tap trung bang @RestControllerAdvice, va ProblemDetail (dinh dang loi chuan hoa). Lich hoc ngay nay ghi 'Guides/Review' - hoc vien on tap va thuc hanh lai vi du.","citations":[]}]},{"id":"day17-sec-bean-validation","title":"Bean Validation voi @Valid","blocks":[{"id":"day17-blk-3","type":"paragraph","text":"Cac truong cua doi tuong request duoc gan constraint nhu @NotBlank(message=...) de yeu cau gia tri khong rong sau khi trim; Hibernate Validator la cai dat tham chieu chuan Bean Validation ma Spring Boot dung mac dinh. Tu Spring Boot 2.3, phai khai bao tuong minh dependency spring-boot-starter-validation (ngoai spring-boot-starter-web) thi Bean Validation moi hoat dong duoc.","citations":["day17-src-1","day17-src-4"]},{"id":"day17-blk-4","type":"code","language":"java","code":"import jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\n\nrecord CreateUserRequest(\n        @NotBlank(message = \"username khong duoc de trong\") String username,\n        @Email(message = \"email khong hop le\") String email) {\n}\n\nimport jakarta.validation.Valid;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/users\")\nclass UserController {\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    UserView create(@Valid @RequestBody CreateUserRequest request) {\n        return new UserView(request.username(), request.email());\n    }\n}\n\nrecord UserView(String username, String email) {\n}\n","compile":false,"citations":["day17-src-1","day17-src-2"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day17-blk-5","type":"paragraph","text":"Khi tham so @RequestBody cua phuong thuc controller duoc gan @Valid, Spring Boot tu bootstrap Hibernate Validator de kiem tra; neu doi tuong khong hop le, Spring Boot nem MethodArgumentNotValidException. Mot phuong thuc gan @ExceptionHandler(MethodArgumentNotValidException.class) cung @ResponseStatus(BAD_REQUEST) co the duyet ex.getBindingResult().getAllErrors() de gom ten truong va thong diep loi vao Map tra ve client dang JSON.","citations":["day17-src-2","day17-src-3"]}]},{"id":"day17-sec-custom-validator","title":"Custom Validator","blocks":[{"id":"day17-blk-6","type":"paragraph","text":"Mot constraint tuy chinh duoc dinh nghia bang @interface gan @Constraint(validatedBy = ...Validator.class), kem cac thuoc tinh chuan message()/groups()/payload() theo quy uoc Bean Validation. Lop validator implement ConstraintValidator\u003cAnnotation, KieuDuLieu\u003e va override isValid(value, context) de tra ve true/false theo quy tac tu dinh nghia.","citations":["day17-src-5","day17-src-6"]},{"id":"day17-blk-7","type":"code","language":"java","code":"import jakarta.validation.Constraint;\nimport jakarta.validation.Payload;\nimport java.lang.annotation.*;\n\n@Target({ElementType.FIELD, ElementType.PARAMETER})\n@Retention(RetentionPolicy.RUNTIME)\n@Constraint(validatedBy = PhoneNumberValidator.class)\n@interface ValidPhoneNumber {\n    String message() default \"so dien thoai khong hop le\";\n    Class\u003c?\u003e[] groups() default {};\n    Class\u003c? extends Payload\u003e[] payload() default {};\n}\n\nimport jakarta.validation.ConstraintValidator;\nimport jakarta.validation.ConstraintValidatorContext;\n\nclass PhoneNumberValidator implements ConstraintValidator\u003cValidPhoneNumber, String\u003e {\n    @Override\n    public boolean isValid(String value, ConstraintValidatorContext context) {\n        return value != null \u0026\u0026 value.matches(\"\\\\d{9,11}\");\n    }\n}\n","compile":false,"citations":["day17-src-5","day17-src-6"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day17-blk-8","type":"note","text":"Mot annotation gan o @Target(TYPE) nhu FieldsValueMatch cho phep so sanh gia tri cua hai field trong cung lop (vi du password va verifyPassword phai khop nhau), dung BeanWrapperImpl de doc gia tri field theo ten trong isValid() - huu ich khi mot constraint can xet nhieu field cung luc thay vi tung field rieng le.","citations":["day17-src-7"]}]},{"id":"day17-sec-problem-detail","title":"@RestControllerAdvice va ProblemDetail (RFC 7807)","blocks":[{"id":"day17-blk-9","type":"paragraph","text":"ProblemDetail la mot phan cua chuan RFC 7807, dinh nghia cau truc phan hoi loi thong nhat gom cac truong type, title, status, detail, instance - giup client hieu va xu ly loi nhat quan giua nhieu API. Truoc khi co ProblemDetail, cac du an thuong tu dinh nghia cau truc response loi rieng bang custom exception handler/response entity, dan toi thieu nhat quan giua cac API va nhieu code lap lai.","citations":["day17-src-8","day17-src-11"]},{"id":"day17-blk-10","type":"note","text":"Muc syllabus ghi 'ProblemDetail (RFC 9457)'; tuy nhien nguon tai lieu da doc cho Day 17 mo ta ProblemDetail theo RFC 7807 (chua co fact nao trong resourceIds cua Day 17 nhac RFC 9457) - bai nay trich dan dung theo noi dung nguon (RFC 7807). Ghi chu them (khong can trich dan vi day khong phai mot khang dinh ky thuat can nguon rieng - chi la boi canh dat ten chuan): RFC 9457 la ban cap nhat sau nay thay the/obsolete RFC 7807 cho cung dac ta ProblemDetail.","citations":[]},{"id":"day17-blk-11","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.web.bind.MethodArgumentNotValidException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\nclass GlobalExceptionHandler {\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ProblemDetail handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.BAD_REQUEST, \"Du lieu request khong hop le\");\n        problem.setTitle(\"Validation failed\");\n        return problem;\n    }\n}\n","compile":false,"citations":["day17-src-10"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day17-blk-12","type":"important","text":"Co the dat spring.mvc.problemdetails.enabled=true (ung dung servlet/MVC) hoac spring.webflux.problemdetails.enabled=true (ung dung reactive) de Spring Boot tu tra loi theo dinh dang ProblemDetail ma khong can code them; khi tu viet, mot class @RestControllerAdvice ke thua ResponseEntityExceptionHandler co the dinh nghia method @ExceptionHandler tra ve ProblemDetail dung bang ProblemDetail.forStatusAndDetail(status, message), co the goi them setInstance(URI) de chi ro ngu canh loi.","citations":["day17-src-9","day17-src-10"]}]}],"commonMistakes":["Quen dependency spring-boot-starter-validation nen @Valid khong co tac dung.","Xu ly loi validate rai rac trong tung controller thay vi gom vao @RestControllerAdvice.","Tu dinh nghia cau truc JSON loi rieng cho moi API thay vi dung ProblemDetail chuan hoa."],"practices":[{"id":"day17-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Tu Spring Boot 2.3, dependency nao phai duoc khai bao tuong minh de Bean Validation hoat dong (ngoai spring-boot-starter-web)?","choices":[{"id":"day17-prac-1-a","text":"spring-boot-starter-validation"},{"id":"day17-prac-1-b","text":"spring-boot-starter-actuator"},{"id":"day17-prac-1-c","text":"spring-boot-starter-security"},{"id":"day17-prac-1-d","text":"spring-boot-starter-aop"}],"correctChoiceIds":["day17-prac-1-a"],"hint":"Doc lai fact ve 'Dependency can thiet tu Boot 2.3' trong bai.","solution":"day17-prac-1-a","explanation":"Tai lieu xac nhan tu Spring Boot 2.3, phai khai bao tuong minh spring-boot-starter-validation thi Bean Validation moi hoat dong.","rubric":"Chon dung ten starter, khong nham voi cac starter khac khong lien quan validation.","sourceUsage":["day17-src-4"]},{"id":"day17-prac-2","type":"coding","interaction":"self-check","prompt":"Sua CreateUserRequest de them field age (int) voi rang buoc gia tri toi thieu la 18 tuoi.","choices":[],"correctChoiceIds":[],"hint":"Dung @Min(18) cua jakarta.validation.constraints tren tham so age.","solution":"record CreateUserRequest(\n        @NotBlank String username,\n        @Email String email,\n        @jakarta.validation.constraints.Min(18) int age) {\n}","explanation":"Ap dung dung annotation @Min(18) tu jakarta.validation.constraints, giu nguyen 2 field co san.","rubric":"Danh gia dung: them field age kieu int voi @Min(18), khong lam mat @NotBlank/@Email o hai field cu.","sourceUsage":["day17-src-1"]},{"id":"day17-prac-3","type":"concept","interaction":"self-check","prompt":"Vi sao nen tra loi bang ProblemDetail thay vi tu dinh nghia mot cau truc JSON loi rieng cho tung API?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan so sanh voi cach xu ly loi truyen thong trong bai.","solution":"Vi truoc khi co ProblemDetail, cac du an thuong tu dinh nghia cau truc response loi rieng, dan toi thieu nhat quan giua cac API va nhieu code lap lai; ProblemDetail chuan hoa cau truc (type, title, status, detail, instance) theo RFC 7807, giup client xu ly loi nhat quan giua nhieu API khac nhau.","explanation":"Neu dung ly do nhat quan/tai su dung, dua vao so sanh voi cach lam truyen thong.","rubric":"Danh gia hoc vien neu dung van de cua cach lam truyen thong (thieu nhat quan, lap code) ma ProblemDetail giai quyet.","sourceUsage":["day17-src-8","day17-src-11"]},{"id":"day17-prac-4","type":"concept","interaction":"self-check","prompt":"Mot constraint can so sanh hai field password va verifyPassword trong cung mot lop. Nen gan @Target o dau va can ky thuat gi de doc gia tri field theo ten trong isValid()?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan Validate o cap class trong bai.","solution":"Gan @Target(TYPE) tren annotation (ap dung cho ca lop, khong phai tung field rieng le); trong isValid(), dung BeanWrapperImpl de doc gia tri tung field theo ten roi so sanh, thay vi validator chi nhan duoc gia tri cua mot field don le.","explanation":"Nho lai vi du FieldsValueMatch va ky thuat BeanWrapperImpl trong bai.","rubric":"Danh gia dung ca hai y: @Target(TYPE) va BeanWrapperImpl.","sourceUsage":["day17-src-7"]}],"syllabusAssignments":[],"enhancedExercises":["Viet mot @Constraint cap class FieldsValueMatch cho password/verifyPassword va ap dung vao CreateUserRequest.","Bat spring.mvc.problemdetails.enabled=true va so sanh response loi mac dinh voi ProblemDetail tu viet trong GlobalExceptionHandler."],"references":[{"id":"day17-ref-1","type":"external","resourceId":"res-1f904f56cc5a","citationId":"day17-src-1","url":"https://www.baeldung.com/spring-boot-bean-validation","label":"Bean Validation","checkStatus":"ok","readStatus":"read","pageTitle":"Validation in Spring Boot | Baeldung","limitation":null},{"id":"day17-ref-2","type":"external","resourceId":"res-8a73cd80ad49","citationId":"day17-src-8","url":"https://www.baeldung.com/spring-boot-return-errors-problemdetail","label":"ProblemDetail (RFC 9457)","checkStatus":"ok","readStatus":"read","pageTitle":"Returning Errors Using ProblemDetail in Spring Boot | Baeldung","limitation":null},{"id":"day17-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":6,"unitTitle":"Spring MVC — In-Depth REST API"},{"id":"day-18","unitId":"unit-06","group":"spring","kind":"lab","title":"- Lab 6: User \u0026 Task Management API","summary":"Lab 6 - User \u0026 Task Management API: CRUD Task (title/description/status/priority/dueDate) voi @RequestMapping/@PathVariable, validation co ban (title notBlank, dueDate future) ket hop custom validator @ValidStatusTransition (validate cap class kiem tra chuyen trang thai hop le), va global exception handler tra ve ProblemDetail.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Da hoc Day 16 (controller/mapping/ResponseEntity) va Day 17 (Bean Validation, custom validator, @RestControllerAdvice, ProblemDetail)."],"outcomes":["Xay dung day du CRUD endpoint cho Task voi mapping/path variable dung quy uoc da hoc.","Ket hop Bean Validation co ban voi mot custom validator cap class cho logic nghiep vu rieng (chuyen trang thai).","Tap trung xu ly loi bang @RestControllerAdvice tra ve ProblemDetail nhat quan.","Mo ta duoc quy trinh xuat Postman collection de chia se/kiem thu API."],"sections":[{"id":"day18-sec-brief","title":"De bai Lab 6","blocks":[{"id":"day18-blk-1","type":"deliverable","text":"- Lab 6: User \u0026 Task Management API\n  - CRUD Task: title, description, status (TODO/IN_PROGRESS/DONE), priority, dueDate\n  - Validation: title notBlank, dueDate in future, valid status transition\n  - Custom validator: @ValidStatusTransition\n  - Global exception handler ProblemDetail\n  - Postman collection export","citations":[]}]},{"id":"day18-sec-crud","title":"CRUD Task voi @RequestMapping/@PathVariable","blocks":[{"id":"day18-blk-2","type":"paragraph","text":"TaskController dung @RequestMapping cap class ('/api/tasks') va cac shortcut theo HTTP method (@GetMapping/@PostMapping/@PutMapping) cho tung thao tac CRUD; bien path {id} duoc bat qua @PathVariable, rang buoc {id:[\\d]+} de chi khop id dang so, tuong tu mau da hoc o Day 16.","citations":["day18-src-1","day18-src-2"]},{"id":"day18-blk-3","type":"code","language":"java","code":"import jakarta.validation.constraints.Future;\nimport jakarta.validation.constraints.NotBlank;\nimport java.time.LocalDate;\n\nenum TaskStatus { TODO, IN_PROGRESS, DONE }\n\nenum TaskPriority { LOW, MEDIUM, HIGH }\n\n// title khong duoc de trong, dueDate phai la ngay trong tuong lai.\nrecord TaskRequest(\n        @NotBlank(message = \"title khong duoc de trong\") String title,\n        String description,\n        TaskStatus status,\n        TaskPriority priority,\n        @Future(message = \"dueDate phai o tuong lai\") LocalDate dueDate) {\n}\n","compile":false,"citations":["day18-src-3"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day18-blk-4","type":"code","language":"java","code":"import jakarta.validation.Valid;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/tasks\")\nclass TaskController {\n\n    private final TaskRepository repository;\n\n    TaskController(TaskRepository repository) {\n        this.repository = repository;\n    }\n\n    @GetMapping(\"/{id:[\\\\d]+}\")\n    ResponseEntity\u003cTask\u003e findById(@PathVariable long id) {\n        return repository.findById(id)\n                .map(ResponseEntity::ok)\n                .orElseGet(() -\u003e ResponseEntity.notFound().build());\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    Task create(@Valid @RequestBody TaskRequest request) {\n        return repository.save(Task.from(request));\n    }\n\n    @PutMapping(\"/{id:[\\\\d]+}/status\")\n    Task updateStatus(@PathVariable long id,\n            @Valid @RequestBody StatusUpdateRequest request) {\n        return repository.updateStatus(id, request.status());\n    }\n}\n","compile":false,"citations":["day18-src-1","day18-src-2"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day18-blk-5","type":"note","text":"Rang buoc co ban title notBlank (@NotBlank) va dueDate phai o tuong lai (@Future) dung annotation Bean Validation chuan cua jakarta.validation.constraints; hai annotation nay khong co resource nao trong resourceIds cua rieng Day 18 mo ta (chung thuoc resourceIds cua Day 17, noi Bean Validation co ban da duoc trich dan day du) - Day 18 tap trung trich dan phan validate cap class va ProblemDetail, la phan moi so voi Day 17.","citations":[]}]},{"id":"day18-sec-custom-validator","title":"Custom validator @ValidStatusTransition","blocks":[{"id":"day18-blk-6","type":"paragraph","text":"Mot constraint tuy chinh duoc dinh nghia bang @interface gan @Constraint(validatedBy = ...Validator.class); lop validator implement ConstraintValidator\u003cAnnotation, KieuDuLieu\u003e va override isValid(value, context). @ValidStatusTransition ap dung tuong tu: gan @Target(TYPE) de constraint co the doc dong thoi ca currentStatus va status tu cung mot request, roi kiem tra chuyen trang thai co nam trong tap chuyen hop le hay khong (TODO -\u003e IN_PROGRESS -\u003e DONE, cho phep lui IN_PROGRESS -\u003e TODO, khong cho chuyen tiep tu DONE).","citations":["day18-src-3","day18-src-4"]},{"id":"day18-blk-7","type":"code","language":"java","code":"import jakarta.validation.Constraint;\nimport jakarta.validation.ConstraintValidator;\nimport jakarta.validation.ConstraintValidatorContext;\nimport jakarta.validation.Payload;\nimport java.lang.annotation.*;\nimport java.util.Map;\nimport java.util.Set;\n\n@Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@Constraint(validatedBy = StatusTransitionValidator.class)\n@interface ValidStatusTransition {\n    String message() default \"chuyen trang thai khong hop le\";\n    Class\u003c?\u003e[] groups() default {};\n    Class\u003c? extends Payload\u003e[] payload() default {};\n}\n\nrecord StatusUpdateRequest(TaskStatus currentStatus, TaskStatus status) {\n}\n\n// @Target(TYPE): constraint xet ca hai field currentStatus va status\n// cua cung mot doi tuong, khong the xet tung field rieng le.\n@ValidStatusTransition\nclass StatusTransitionValidator\n        implements ConstraintValidator\u003cValidStatusTransition, StatusUpdateRequest\u003e {\n\n    private static final Map\u003cTaskStatus, Set\u003cTaskStatus\u003e\u003e ALLOWED = Map.of(\n            TaskStatus.TODO, Set.of(TaskStatus.IN_PROGRESS),\n            TaskStatus.IN_PROGRESS, Set.of(TaskStatus.DONE, TaskStatus.TODO),\n            TaskStatus.DONE, Set.of());\n\n    @Override\n    public boolean isValid(StatusUpdateRequest value, ConstraintValidatorContext context) {\n        if (value == null || value.currentStatus() == null || value.status() == null) {\n            return false;\n        }\n        return ALLOWED.getOrDefault(value.currentStatus(), Set.of()).contains(value.status());\n    }\n}\n","compile":false,"citations":["day18-src-3","day18-src-4"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."}]},{"id":"day18-sec-exception-handler","title":"Global exception handler voi ProblemDetail","blocks":[{"id":"day18-blk-8","type":"paragraph","text":"TaskExceptionHandler la mot @RestControllerAdvice tap trung xu ly loi cho toan bo TaskController: dung ProblemDetail.forStatusAndDetail(status, message) de dung phan hoi loi thong nhat (type/title/status/detail/instance) thay vi tu dinh nghia cau truc JSON loi rieng cho tung truong hop, ap dung dung mau da hoc o Day 17.","citations":["day18-src-5","day18-src-6"]},{"id":"day18-blk-9","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.web.bind.MethodArgumentNotValidException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\n@RestControllerAdvice\nclass TaskExceptionHandler {\n\n    @ExceptionHandler(TaskNotFoundException.class)\n    ProblemDetail handleNotFound(TaskNotFoundException ex) {\n        return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, ex.getMessage());\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ProblemDetail handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.BAD_REQUEST, \"Du lieu Task khong hop le\");\n        problem.setTitle(\"Task validation failed\");\n        return problem;\n    }\n}\n\nclass TaskNotFoundException extends RuntimeException {\n    TaskNotFoundException(long id) {\n        super(\"Khong tim thay Task voi id=\" + id);\n    }\n}\n","compile":false,"citations":["day18-src-5"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."}]},{"id":"day18-sec-postman","title":"Postman collection export","blocks":[{"id":"day18-blk-10","type":"note","text":"Yeu cau xuat Postman collection khong co resource nao trong resourceIds cua Day 18 mo ta (xem authoring.limitations). Cach lam pho bien: goi thu tung endpoint CRUD Task trong Postman, gom cac request lai thanh mot Collection, dung tinh nang 'Export' cua Postman de xuat file .json chua toan bo request/vi du response, luu kem repository de nhom khac/CI co the import lai va chay smoke test.","citations":[]}]}],"commonMistakes":["Gan @ValidStatusTransition o @Target(FIELD) khien validator khong doc duoc ca hai field can so sanh.","Quen xu ly TaskNotFoundException trong @RestControllerAdvice, de loi 500 mac dinh lo ra ngoai thay vi ProblemDetail 404 ro rang.","Cho phep chuyen trang thai tuy y (vi du DONE -\u003e TODO) ma khong kiem tra qua ALLOWED map."],"practices":[{"id":"day18-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Theo StatusTransitionValidator trong bai, chuyen trang thai nao duoi day la KHONG hop le?","choices":[{"id":"day18-prac-1-a","text":"DONE -\u003e IN_PROGRESS"},{"id":"day18-prac-1-b","text":"TODO -\u003e IN_PROGRESS"},{"id":"day18-prac-1-c","text":"IN_PROGRESS -\u003e DONE"},{"id":"day18-prac-1-d","text":"IN_PROGRESS -\u003e TODO"}],"correctChoiceIds":["day18-prac-1-a"],"hint":"Xem lai bang ALLOWED trong StatusTransitionValidator.","solution":"day18-prac-1-a","explanation":"Trong ALLOWED map cua vi du, TaskStatus.DONE anh xa toi Set.of() (tap rong) - nghia la tu DONE khong duoc phep chuyen sang bat ky trang thai nao khac, nen DONE -\u003e IN_PROGRESS la khong hop le.","rubric":"Doi chieu tung lua chon voi Map ALLOWED trong code vi du; danh gia dung neu nhan ra DONE la trang thai cuoi (khong co chuyen tiep hop le).","sourceUsage":["day18-src-3","day18-src-4"]},{"id":"day18-prac-2","type":"coding","interaction":"self-check","prompt":"Them mot @GetMapping('') tren TaskController tra ve ResponseEntity\u003cList\u003cTask\u003e\u003e toan bo task, tuong tu mau search o Day 16.","choices":[],"correctChoiceIds":[],"hint":"Dung @GetMapping khong tham so, goi repository.findAll(), boc trong ResponseEntity.ok().","solution":"@GetMapping\nResponseEntity\u003cjava.util.List\u003cTask\u003e\u003e findAll() {\n    return ResponseEntity.ok(repository.findAll());\n}","explanation":"Ap dung lai mau ResponseEntity.ok(...) da hoc o Day 16 vao TaskController.","rubric":"Danh gia dung: co @GetMapping cap class, tra ResponseEntity.ok voi danh sach Task.","sourceUsage":["day18-src-1"]},{"id":"day18-prac-3","type":"concept","interaction":"self-check","prompt":"Vi sao @ValidStatusTransition duoc gan @Target(ElementType.TYPE) thay vi @Target(ElementType.FIELD) nhu @ValidPhoneNumber o Day 17?","choices":[],"correctChoiceIds":[],"hint":"So sanh so field ma constraint can doc de kiem tra.","solution":"Vi constraint can doc dong thoi hai field (currentStatus va status) tu cung mot doi tuong StatusUpdateRequest de so sanh chuyen trang thai co hop le hay khong; @Target(FIELD) chi cho phep validator xet gia tri cua mot field don le, khong du de kiem tra quan he giua hai field.","explanation":"Lien ket voi ly do dung @Target(TYPE) cho validate cap class da hoc o Day 17.","rubric":"Danh gia hoc vien neu dung ly do can doc nhieu field cung luc.","sourceUsage":["day18-src-3","day18-src-4"]},{"id":"day18-prac-4","type":"concept","interaction":"self-check","prompt":"TaskExceptionHandler nen tra ve HTTP status nao cho TaskNotFoundException va vi sao dung ProblemDetail thay vi tu dinh nghia mot Map loi rieng?","choices":[],"correctChoiceIds":[],"hint":"Xem lai code handleNotFound trong bai va ly do dung ProblemDetail chuan hoa.","solution":"Nen tra ve HTTP 404 (NOT_FOUND), dung ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, ex.getMessage()) de dam bao cau truc loi (type/title/status/detail/instance) thong nhat voi cac loi khac trong cung API, thay vi moi loai loi lai co mot dinh dang JSON rieng gay kho cho client xu ly.","explanation":"Ket noi voi HTTP status 404 chuan cho 'khong tim thay tai nguyen' va loi ich chuan hoa cua ProblemDetail.","rubric":"Danh gia dung ca hai y: status 404 va ly do chon ProblemDetail (nhat quan cau truc loi).","sourceUsage":["day18-src-5","day18-src-6"]}],"syllabusAssignments":[{"row":32,"text":"- Lab 6: User \u0026 Task Management API\n  - CRUD Task: title, description, status (TODO/IN_PROGRESS/DONE), priority, dueDate\n  - Validation: title notBlank, dueDate in future, valid status transition\n  - Custom validator: @ValidStatusTransition\n  - Global exception handler ProblemDetail\n  - Postman collection export"}],"enhancedExercises":["Them endpoint DELETE /api/tasks/{id} va xu ly TaskNotFoundException nhat quan voi cac endpoint con lai.","Viet test cho StatusTransitionValidator bao phu ca chuyen hop le va khong hop le cho ca 3 trang thai."],"references":[{"id":"day18-ref-1","type":"external","resourceId":"res-2aefb097db80","citationId":"day18-src-1","url":"https://docs.spring.io/spring-framework/reference/web/webm   <script id="app-script">
    /* ============================================================
*/ /* COURSE_CORE_START */ /*
       pure logic, no DOM access.
       Tested by tests/site_core.test.js in node:vm.
       ============================================================ */
    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      return { view: "dashboard" };
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    const STATE_VERSION = 1;

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      escapeHtml, safeExternalUrl,
    });
    /* COURSE_CORE_END */

    /* ============================================================
       App bootstrap: data parse, indices, shell rendering, routing,
       curriculum navigation, dashboard, search panel (Site Task 3).
       ============================================================ */
    (function () {
      /* ---- data parse ------------------------------------------------ */
      let courseData;
      try {
        courseData = JSON.parse(document.getElementById("course-data").textContent);
      } catch(e) {
        document.getElementById("app").innerHTML = '<pre style="padding:2rem;color:red;">Loi tai du lieu khoa hoc.</pre>';
        throw e;
      }
      const lessonsById = new Map(courseData.lessons.map(function(l){return [l.id,l];}));
      const unitsById = new Map(courseData.units.map(function(u){return [u.id,u];}));

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {
        (l.practices || []).forEach(function(p) { acc.push(p.id); });
        return acc;
      }, []));
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? CourseCore.sanitizeState(JSON.parse(raw), LESSON_IDS, UNIT_IDS, PRACTICE_IDS) : null;
        } catch(e) { return null; }
      }
      function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
      var loaded = loadState();
      if (loaded) state = loaded;

      /* ---- render helpers -------------------------------------------- */
      function updateProgress() {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var bar = document.getElementById('progress-bar');
        if (bar) { bar.value = String(p.completed); bar.setAttribute('max', String(p.total || 1)); }
        var txt = document.querySelector('.progress-text-long');
        if (txt) txt.textContent = p.completed + '/' + p.total + ' bai';
      }
      function setAriaCurrent(id) {
        document.querySelectorAll('.lesson-link[aria-current]').forEach(function(a){a.removeAttribute('aria-current');});
        var link = document.querySelector('.lesson-link[data-lesson-id="' + id + '"]');
        if (link) link.setAttribute('aria-current', 'page');
      }

      /* ---- curriculum nav ------------------------------------------- */
      function renderSidebar() {
        var nav = document.getElementById('curriculum-nav');
        if (!nav) return;
        nav.textContent = '';
        var GROUPS = [{key:'java',label:'Java'},{key:'spring',label:'Spring Boot'},{key:'completion',label:'Hoan thanh'}];
        var ACCENT = {java:'var(--java)',spring:'var(--spring)',completion:'var(--completion)'};
        GROUPS.forEach(function(g) {
          var units = courseData.units.filter(function(u){return u.group===g.key;});
          if (!units.length) return;
          var label = document.createElement('div');
          label.className = 'group-label';
          label.textContent = g.label;
          nav.appendChild(label);
          units.forEach(function(unit) {
            var toggle = document.createElement('button');
            toggle.className = 'module-toggle';
            toggle.setAttribute('aria-expanded', state.collapsedUnits.indexOf(unit.id)===-1 ? 'true' : 'false');
            toggle.setAttribute('aria-controls', 'lessons-' + unit.id);
            toggle.setAttribute('data-unit-id', unit.id);
            toggle.innerHTML = '<span>' + unit.number + '. ' + unit.title + '</span><span class="chevron" aria-hidden="true">&#9660;</span>';
            toggle.onclick = function() {
              var expanded = toggle.getAttribute('aria-expanded')==='true';
              toggle.setAttribute('aria-expanded', expanded?'false':'true');
              var list = document.getElementById('lessons-' + unit.id);
              if (list) list.hidden = expanded;
              if (expanded) { if (state.collapsedUnits.indexOf(unit.id)===-1) state.collapsedUnits.push(unit.id); }
              else { state.collapsedUnits = state.collapsedUnits.filter(function(x){return x!==unit.id;}); }
              saveState();
            };
            nav.appendChild(toggle);
            var list = document.createElement('ul');
            list.className = 'lesson-list';
            list.id = 'lessons-' + unit.id;
            list.setAttribute('role', 'list');
            (unit.lessonIds||[]).forEach(function(lid) {
              var lesson = lessonsById.get(lid);
              if (!lesson) return;
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.className = 'lesson-link';
              a.href = '#lesson/' + lid;
              a.setAttribute('data-lesson-id', lid);
              a.style.setProperty('--accent', ACCENT[lesson.group] || ACCENT.completion);
              var done = state.completed.indexOf(lid) !== -1;
              a.innerHTML = '<span class="lesson-state" data-done="' + done + '">&#' + (done ? '9745;' : '9711;') + '</span><span>' + (lesson.title || lid) + '</span>';
              a.onclick = function() { closeDrawer(); };
              li.appendChild(a);
              list.appendChild(li);
            });
            nav.appendChild(list);
          });
        });
        setAriaCurrent(state.lastLessonId);
      }

      /* ---- route render ---------------------------------------------- */
      function routeRender() {
        var route = CourseCore.parseRoute(window.location.hash);
        var view = document.getElementById('route-view');
        if (!view) return;
        view.textContent = '';
        if (route.view === 'lesson') renderLessonView(view, route.lessonId);
        else if (route.view === 'resources') renderResourcesView(view);
        else renderDashboard(view);
        setAriaCurrent(route.lessonId || state.lastLessonId);
      }
      window.addEventListener('hashchange', function(){ routeRender(); });

      /* ---- settings: export / import / reset (Site Task 5) -------------- */
      var APP_SCHEMA = { app: "java-spring-course", schemaVersion: 1 };

      function downloadProgress() {
        var payload = {
          app: APP_SCHEMA.app,
          schemaVersion: APP_SCHEMA.schemaVersion,
          exportedAt: new Date().toISOString(),
          state: state,
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = el("a");
        a.href = url;
        a.download = "java-spring-course-tien-do.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        showToast("Đã tải tệp tiến độ");
      }

      function importProgressText(text, previewEl, confirmBtn) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không phải JSON hợp lệ.";
          return;
        }
        if (!parsed || parsed.app !== APP_SCHEMA.app || parsed.schemaVersion !== APP_SCHEMA.schemaVersion) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không đúng định dạng tiến độ của khóa học (app/schemaVersion không khớp).";
          return;
        }
        var cleaned = CourseCore.sanitizeState(parsed.state, LESSON_IDS, UNIT_IDS, PRACTICE_IDS);
        previewEl.hidden = false;
        previewEl.textContent = "Sẵn sàng nhập: " + cleaned.completed.length + "/" + courseData.lessons.length +
          " bài đã hoàn thành. Nhấn “Xác nhận nhập” để thay thế tiến độ hiện tại.";
        confirmBtn.hidden = false;
        confirmBtn.onclick = function() {
          state = cleaned;
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          previewEl.textContent = "Đã nhập tiến độ thành công.";
          confirmBtn.hidden = true;
          showToast("Tiến độ đã được nhập");
        };
      }

      function renderSettingsBlock(container) {
        var block = el("div", "settings-block");
        var details = el("details");
        details.appendChild(el("summary", null, "Cài đặt dữ liệu học tập"));
        var actions = el("div", "settings-actions");

        var exportBtn = el("button", "settings-btn", "Tải tiến độ (.json)");
        exportBtn.type = "button";
        exportBtn.setAttribute("data-action", "export-progress");
        exportBtn.addEventListener("click", downloadProgress);
        actions.appendChild(exportBtn);

        var importLabel = el("label", "settings-btn", "Nhập tiến độ (.json)");
        var fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".json,application/json";
        fileInput.style.display = "none";
        importLabel.appendChild(fileInput);
        actions.appendChild(importLabel);

        var resetBtn = el("button", "settings-btn settings-btn--danger", "Đặt lại tiến độ");
        resetBtn.type = "button";
        resetBtn.setAttribute("data-action", "reset-progress");
        actions.appendChild(resetBtn);

        var preview = el("div", "import-preview");
        preview.hidden = true;
        var confirmBtn = el("button", "settings-btn", "Xác nhận nhập");
        confirmBtn.type = "button";
        confirmBtn.hidden = true;

        fileInput.addEventListener("change", function() {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { importProgressText(String(reader.result), preview, confirmBtn); };
          reader.onerror = function() {
            preview.hidden = false;
            preview.textContent = "Không đọc được tệp đã chọn.";
          };
          reader.readAsText(file);
          fileInput.value = "";
        });

        resetBtn.addEventListener("click", function() {
          if (!window.confirm("Đặt lại toàn bộ tiến độ? Hành động này xóa trạng thái hoàn thành, bài đang học và cài đặt giao diện đã lưu trên máy bạn.")) return;
          state = CourseCore.defaultState();
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          showToast("Đã đặt lại tiến độ");
        });

        details.appendChild(actions);
        details.appendChild(preview);
        details.appendChild(confirmBtn);
        block.appendChild(details);
        container.appendChild(block);
      }

      /* ---- lesson renderer (Site Task 4) ------------------------------ */
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      var GROUP_LABELS = { java: "Java", spring: "Spring Boot", completion: "Hoàn thành" };
      var PRACTICE_KIND_LABELS = {
        "concept": "Khái niệm",
        "predict-output": "Dự đoán kết quả",
        "coding": "Luyện code",
        "applied": "Vận dụng"
      };
      var CALLOUT_CLASS = { note: "callout--note", important: "callout--important", warning: "callout--warning" };
      var ALLOWED_BLOCK_TYPES = ["paragraph", "note", "important", "warning", "code", "table"];
      var currentLessonId = null;

      function lessonIdSlug(id) {
        return String(id).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      /* Citations -> numbered superscript links pointing at the reference cards. */
      function appendCitations(parent, citations, refIndexById) {
        if (!citations || !citations.length) return;
        citations.forEach(function(cid, i) {
          var key = String(cid).toLowerCase();
          var idx = refIndexById.get(key);
          var a = el("a", "citation-link", "[" + (idx != null ? idx : "?") + "]");
          a.href = "#ref-" + lessonIdSlug(currentLessonId) + "-" + (idx != null ? idx : key);
          a.setAttribute("aria-label", "Nguồn tham chiếu " + (idx != null ? idx : cid));
          parent.appendChild(a);
          if (i < citations.length - 1) parent.appendChild(document.createTextNode(" "));
        });
      }

      function proseParagraph(text, citations, refIndexById) {
        var p = el("p");
        p.appendChild(document.createTextNode(text == null ? "" : String(text)));
        appendCitations(p, citations, refIndexById);
        return p;
      }

      function renderBlock(container, block, refIndexById) {
        var type = block.type;
        if (ALLOWED_BLOCK_TYPES.indexOf(type) === -1) {
          container.appendChild(el("div", "authoring-warning",
            "[Cảnh báo biên soạn] Khối nội dung không hỗ trợ: \"" + type + "\" — đã ẩn để tránh hiển thị sai."));
          return;
        }
        if (type === "code") {
          var fig = el("figure", "code-sample");
          var cap = el("figcaption");
          cap.appendChild(el("span", null, block.language ? block.language.toUpperCase() + (block.compile === false && block.partialReason ? " — không biên dịch độc lập" : "") : ""));
          var copyBtn = el("button", "copy-btn", "Sao chép mã");
          copyBtn.type = "button";
          copyBtn.setAttribute("data-action", "copy-code");
          copyBtn.setAttribute("aria-label", "Sao chép mã mẫu vào clipboard");
          copyBtn.addEventListener("click", function() {
            copyText(block.code || "").then(function() { showToast("Đã sao chép mã"); },
              function() { showToast("Không thể sao chép tự động — hãy chọn mã và sao chép thủ công."); });
          });
          cap.appendChild(copyBtn);
          fig.appendChild(cap);
          var pre = el("pre");
          pre.appendChild(el("code", null, block.code || ""));
          fig.appendChild(pre);
          container.appendChild(fig);
          return;
        }
        if (type === "table") {
          var wrap = el("div", "data-table-wrap");
          var table = el("table", "data-table");
          var cols = block.columns || [];
          table.appendChild(el("caption", null, cols.join(" · ")));
          var thead = el("thead");
          var hr = el("tr");
          cols.forEach(function(c) { hr.appendChild(el("th", null, c)); });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tbody = el("tbody");
          (block.rows || []).forEach(function(row) {
            var tr = el("tr");
            row.forEach(function(cell, ci) {
              var td = el(ci < cols.length - 1 ? "td" : "td");
              td.appendChild(document.createTextNode(cell == null ? "" : String(cell)));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          return;
        }
        if (type === "note" || type === "important" || type === "warning") {
          var aside = el("aside", "callout " + (CALLOUT_CLASS[type] || ""));
          aside.setAttribute("role", type === "warning" ? "alert" : "note");
          var labelSpan = el("strong", null, (type === "note" ? "Ghi chú: " : type === "important" ? "Quan trọng: " : "Lưu ý: "));
          aside.appendChild(labelSpan);
          aside.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
          appendCitations(aside, block.citations, refIndexById);
          container.appendChild(aside);
          return;
        }
        /* paragraph */
        container.appendChild(proseParagraph(block.text, block.citations, refIndexById));
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function() { return "clipboard"; });
        }
        return new Promise(function(resolve, reject) {
          var area = Object.assign(document.createElement("textarea"), { value: text });
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          area.remove();
          if (!ok) reject(new Error("copy unavailable")); else resolve("fallback");
        });
      }

      function showToast(message) {
        var region = document.getElementById("toast-region");
        if (!region) return;
        var t = el("div", "toast", message);
        region.appendChild(t);
        setTimeout(function() { t.remove(); }, 2600);
      }

      function renderLessonHeader(container, lesson, refIndexById) {

        g.href = "#dashboard";
        crumb.appendChild(g);
        crumb.appendChild(el("span", null, "/"));
        var unit = courseData.units.find(function(x){ return x.id === lesson.unitId; });
        var u = el("a", null, "Unit " + lesson.unitNumber + ": " + (lesson.unitTitle || ""));
        if (unit && unit.lessonIds && unit.lessonIds.length) u.href = "#lesson/" + unit.lessonIds[0];
        crumb.appendChild(u);
        crumb.appendChild(el("span", null, "/"));
        crumb.appendChild(el("span", null, lesson.title));
        container.appendChild(crumb);

        var header = el("header", "lesson-header");
        header.appendChild(el("h1", "lesson-title", lesson.title));

        if (lesson.durationMinutes) meta.appendChild(el("span", "chip", "~" + lesson.durationMinutes + " phút"));
        header.appendChild(meta);

        /* Prerequisites / outcomes columns */

                      (lesson.outcomes && lesson.outcomes.length);
