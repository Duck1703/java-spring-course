tedException {\n        Thread worker = new Thread(() -\u003e {\n            try {\n                Thread.sleep(50);\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n            }\n        });\n        System.out.println(\"Before start: \" + worker.getState());\n        worker.start();\n        System.out.println(\"After start: \" + worker.getState());\n        worker.join();\n        System.out.println(\"After join: \" + worker.getState());\n    }\n}\n","compile":true,"citations":["day11-src-1","day11-src-3"]}]},{"id":"day11-sec-synchronized","title":"synchronized va race condition","blocks":[{"id":"day11-blk-4","type":"paragraph","text":"Race condition xay ra khi nhieu thread cung cap nhat du lieu chia se co the thay doi (mutable) dong thoi ma khong dong bo, dan toi ket qua sai lech khong nhat quan. Cac thread chu yeu giao tiep qua viec chia se field/object, cach nay hieu qua nhung co the gay hai loai loi: thread interference (xen ke thao tac gay sai lech) va memory consistency error (thay gia tri khong nhat quan) - synchronization la cong cu de ngan ca hai.","citations":["day11-src-4","day11-src-10"]},{"id":"day11-blk-5","type":"code","language":"java","code":"class Counter {\n    private int count = 0;\n\n    synchronized void increment() {\n        count++;\n    }\n\n    synchronized int get() {\n        return count;\n    }\n}\n\nclass RaceConditionDemo {\n    static void run() throws InterruptedException {\n        Counter counter = new Counter();\n        Runnable task = () -\u003e {\n            for (int i = 0; i \u003c 1000; i++) {\n                counter.increment();\n            }\n        };\n        Thread t1 = new Thread(task);\n        Thread t2 = new Thread(task);\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n        System.out.println(counter.get());\n    }\n}\n","compile":true,"citations":["day11-src-4","day11-src-5"]},{"id":"day11-blk-6","type":"note","text":"synchronized instance method khoa theo doi tuong instance (increment() va get() o tren khoa theo tung Counter rieng); synchronized static method se khoa theo doi tuong Class thay vi tung instance, nen chi mot thread chay duoc bat ke co bao nhieu instance. Khoa cua synchronized la reentrant: mot thread dang giu khoa co the tiep tuc lay lai chinh khoa do nhieu lan long nhau ma khong bi deadlock voi chinh minh.","citations":["day11-src-5","day11-src-6"]},{"id":"day11-blk-7","type":"paragraph","text":"Trang Synchronization cua Oracle liet ke cac chu de con lien quan: Thread Interference, Memory Consistency Errors, Synchronized Methods (idiom don gian de chong ca hai loi tren), Implicit Locks and Synchronization, va Atomic Access.","citations":["day11-src-11"]}]},{"id":"day11-sec-volatile","title":"Memory visibility va volatile","blocks":[{"id":"day11-blk-8","type":"paragraph","text":"Trong he nhieu loi, moi thread co the giu ban sao bien trong cache rieng; neu khong dong bo, thread khac co the khong thay gia tri vua cap nhat (memory visibility) hoac thay cac thay doi theo thu tu khac voi thu tu chuong trinh goc (reordering).","citations":["day11-src-7"]},{"id":"day11-blk-9","type":"code","language":"java","code":"class VolatileFlagDemo {\n    private volatile boolean running = true;\n\n    void stop() {\n        running = false;\n    }\n\n    void loopUntilStopped() {\n        while (running) {\n            // cong viec lap, luon doc gia tri moi nhat tu bo nho chinh\n        }\n    }\n}\n","compile":true,"citations":["day11-src-8"]},{"id":"day11-blk-10","type":"note","text":"Danh dau bien volatile buoc runtime/processor khong duoc sap xep lai cac lenh lien quan toi bien do va luon ghi/doc gia tri moi nhat tu bo nho chinh, dam bao moi thread thay gia tri nhat quan - nhung khong cap mutual exclusion nhu synchronized (khong thay the duoc synchronized khi can dam bao mot khoi thao tac la nguyen tu). Theo Java Memory Model, mot lan ghi vao bien volatile luon happens-before moi lan doc tiep theo cua cung bien do, nen cac gia tri thread A thay truoc khi ghi volatile cung duoc thread B thay sau khi doc volatile do.","citations":["day11-src-9"]}]},{"id":"day11-sec-executor","title":"ExecutorService","blocks":[{"id":"day11-blk-11","type":"paragraph","text":"Trong ung dung lon, nen tach viec quan ly/tao thread ra khoi phan dinh nghia tac vu (Runnable); cac doi tuong dong goi viec quan ly nay goi la executor, thay vi gan chat Runnable voi mot Thread cu the nhu cach lam don gian truoc do.","citations":["day11-src-12"]},{"id":"day11-blk-12","type":"code","language":"java","code":"import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.TimeUnit;\n\nclass ExecutorDemo {\n    static void run() throws InterruptedException {\n        ExecutorService executor = Executors.newFixedThreadPool(2);\n        executor.submit(() -\u003e System.out.println(\"task 1\"));\n        executor.submit(() -\u003e System.out.println(\"task 2\"));\n        executor.shutdown();\n        executor.awaitTermination(1, TimeUnit.SECONDS);\n    }\n}\n","compile":true,"citations":["day11-src-12","day11-src-13"]},{"id":"day11-blk-13","type":"note","text":"Chu de Executor chia lam ba phan: Executor Interfaces (dinh nghia 3 kieu doi tuong executor), Thread Pools (loai cai dat executor pho bien nhat, nhu newFixedThreadPool o vi du tren) va Fork/Join (framework tan dung nhieu bo xu ly).","citations":["day11-src-13"]}]},{"id":"day11-sec-fileio","title":"NIO.2 va File I/O","blocks":[{"id":"day11-blk-14","type":"paragraph","text":"Goi java.nio.file cung cap Path lam entry point chinh (dai dien cho duong dan) va lop Files chua cac phuong thuc tinh thao tac tren Path nhu exists(), isReadable(), isWritable() de kiem tra file/thu muc; day cung la noi dung mo dau cua bai hoc File I/O (Featuring NIO.2).","citations":["day11-src-14","day11-src-16"]},{"id":"day11-blk-15","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.StandardCopyOption;\n\nclass FileOpsDemo {\n    static void run(Path source, Path target) throws IOException {\n        if (!Files.exists(source)) {\n            Files.createFile(source);\n        }\n        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING);\n        Files.deleteIfExists(source);\n    }\n}\n","compile":true,"citations":["day11-src-17","day11-src-18"]},{"id":"day11-blk-16","type":"paragraph","text":"Files.createFile()/createDirectory() tao file hoac thu muc (doi hoi cac thanh phan duong dan cha da ton tai, khac voi createDirectories() tao de quy); Files.delete() xoa va nem exception neu khong ton tai, con deleteIfExists() thi khong. Files.copy()/Files.move() thao tac tuong tu copy/cut-paste; mac dinh that bai neu file dich da ton tai tru khi truyen StandardCopyOption.REPLACE_EXISTING; copy thu muc khong de quy noi dung ben trong.","citations":["day11-src-17","day11-src-18"]},{"id":"day11-blk-17","type":"note","text":"Java IO Series cua Baeldung phan loai cac bai viet File I/O theo ba nhom: thao tac file co ban (doc/ghi/xoa/doi ten), Java IO APIs (OutputStream, BufferedReader kieu cu) va Java NIO APIs (NIO2 File API, Path, WatchService, Selector) - Day 11 tap trung vao nhom NIO APIs qua Path/Files.","citations":["day11-src-15"]}]},{"id":"day11-sec-serialization","title":"Serialization","blocks":[{"id":"day11-blk-18","type":"paragraph","text":"Serialization la chuyen trang thai cua mot object thanh chuoi byte de luu hoac truyen qua mang; deserialization lam nguoc lai. Lop muon serialize duoc phai implement interface danh dau Serializable.","citations":["day11-src-19"]},{"id":"day11-blk-19","type":"code","language":"java","code":"import java.io.IOException;\nimport java.io.ObjectInputStream;\nimport java.io.ObjectOutputStream;\nimport java.io.Serializable;\n\nclass Address implements Serializable {\n    private static final long serialVersionUID = 1L;\n\n    private final String city;\n\n    Address(String city) {\n        this.city = city;\n    }\n}\n\nclass Employee implements Serializable {\n    private static final long serialVersionUID = 1L;\n\n    private final String name;\n    private final Address address;\n    private transient String cachedDisplayName;\n\n    Employee(String name, Address address) {\n        this.name = name;\n        this.address = address;\n    }\n\n    private void writeObject(ObjectOutputStream out) throws IOException {\n        out.defaultWriteObject();\n    }\n\n    private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException {\n        in.defaultReadObject();\n        cachedDisplayName = name.toUpperCase();\n    }\n}\n","compile":true,"citations":["day11-src-19","day11-src-20","day11-src-21","day11-src-22"]},{"id":"day11-blk-20","type":"note","text":"Khi mot lop implements Serializable, moi lop con cung serializable theo; neu mot object tham chieu toi object khac (nhu Employee tham chieu Address o tren), object duoc tham chieu cung phai serializable rieng, neu khong se nem NotSerializableException.","citations":["day11-src-20"]},{"id":"day11-blk-21","type":"paragraph","text":"JVM gan mot so hieu phien ban (serialVersionUID) cho moi lop serializable de xac nhan object luu va object doc lai co cung cau truc; nen khai bao tuong minh vi so tu sinh phu thuoc trinh bien dich, co the gay InvalidClassException khi khac moi truong. Co the override writeObject/readObject de tu dinh nghia cach serialize field khong serializable duoc; field danh dau transient se bi bo qua khi serialize mac dinh.","citations":["day11-src-21","day11-src-22"]}]}],"commonMistakes":["Chi dong bo (synchronized) method ghi (vi du increment()) ma quen dong bo ca method doc (get()) tren cung field - van co the doc phai gia tri cu do memory visibility, du khong con mat du lieu do ghi chong ghi.","Dung volatile de thay the synchronized khi can dam bao mot chuoi thao tac (nhu doc-sua-ghi) la nguyen tu - volatile chi dam bao visibility, khong dam bao mutual exclusion.","Danh dau mot field tham chieu toi object khong implement Serializable trong mot lop da Serializable ma khong danh dau transient - se nem NotSerializableException luc runtime thay vi loi luc bien dich."],"practices":[{"id":"day11-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Diem khac biet chinh giua trang thai BLOCKED va WAITING cua Thread la gi?","choices":[{"id":"day11-prac-1-a","text":"BLOCKED la dang cho de vao mot synchronized method/block bi khoa; WAITING la cho vo thoi han mot hanh dong cua thread khac (vi du wait()/join() khong timeout)"},{"id":"day11-prac-1-b","text":"BLOCKED va WAITING la mot, chi khac ten goi"},{"id":"day11-prac-1-c","text":"BLOCKED xay ra sau TERMINATED, WAITING xay ra truoc NEW"},{"id":"day11-prac-1-d","text":"BLOCKED chi danh cho synchronized static method, WAITING chi danh cho synchronized instance method"}],"correctChoiceIds":["day11-prac-1-a"],"hint":"Xem lai dinh nghia tung trang thai trong 6 trang thai vong doi Thread.","solution":"day11-prac-1-a","explanation":"BLOCKED gan voi viec cho khoa monitor de vao synchronized; WAITING gan voi viec cho mot hanh dong tu thread khac (khong co timeout).","rubric":"Chon dung nguyen nhan dan toi tung trang thai.","sourceUsage":[]},{"id":"day11-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Trong RaceConditionDemo o tren, hai thread t1/t2 cung goi counter.increment() 1000 lan qua method synchronized. Gia tri counter.get() sau khi ca hai thread join() la bao nhieu?","choices":[{"id":"day11-prac-2-a","text":"Luon la 2000"},{"id":"day11-prac-2-b","text":"Co the nho hon 2000 do race condition"},{"id":"day11-prac-2-c","text":"Luon la 1000"},{"id":"day11-prac-2-d","text":"Khong xac dinh duoc, co the la bat ky so nao"}],"correctChoiceIds":["day11-prac-2-a"],"hint":"increment() va get() deu la synchronized instance method tren cung mot Counter.","solution":"day11-prac-2-a","explanation":"Vi ca increment() va get() deu synchronized tren cung mot instance Counter, moi lan goi increment() la nguyen tu (atomic) doi voi field count - khong con race condition, nen ket qua luon dung 2000 (2 thread x 1000 lan).","rubric":"Danh gia hoc vien hieu dung synchronized loai bo race condition trong vi du nay.","sourceUsage":[]},{"id":"day11-prac-3","type":"coding","interaction":"self-check","prompt":"Viet mot lop ThreadSafeAccumulator voi field long total va mot phuong thuc synchronized void add(long amount) cong don vao total, cung phuong thuc synchronized long getTotal() tra ve gia tri hien tai.","choices":[],"correctChoiceIds":[],"hint":"Ap dung dung mau Counter da hoc: ca hai method deu synchronized tren cung instance.","solution":"class ThreadSafeAccumulator {\n    private long total = 0;\n\n    synchronized void add(long amount) {\n        total += amount;\n    }\n\n    synchronized long getTotal() {\n        return total;\n    }\n}","explanation":"Accumulator dung chung nhieu thread can dong bo dung dan tren field mutable de tranh race condition.","rubric":"Danh gia ca hai method deu duoc danh dau synchronized va thao tac dung tren field total.","sourceUsage":[]},{"id":"day11-prac-4","type":"coding","interaction":"self-check","prompt":"Viet mot method dung java.nio.file.Files de: kiem tra file dau vao co ton tai khong, neu co thi copy sang mot duong dan dich (ghi de neu dich da ton tai).","choices":[],"correctChoiceIds":[],"hint":"Dung Files.exists() de kiem tra, Files.copy() voi StandardCopyOption.REPLACE_EXISTING de ghi de.","solution":"void copyIfExists(Path source, Path target) throws IOException {\n    if (Files.exists(source)) {\n        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING);\n    }\n}","explanation":"Bai tap ap dung truc tiep Files.exists()/Files.copy() da hoc trong bai.","rubric":"Danh gia co kiem tra ton tai truoc khi copy va dung dung REPLACE_EXISTING de cho phep ghi de.","sourceUsage":[]}],"syllabusAssignments":[],"enhancedExercises":["Viet lai RaceConditionDemo nhung bo synchronized o increment() de tu quan sat ket qua counter.get() sai lech (\u003c 2000) do race condition, roi so sanh voi ban co synchronized.","Viet mot chuong trinh dung ExecutorService voi newFixedThreadPool(4) de xu ly song song viec doc noi dung nhieu file bang Files.readString(), roi tong hop ket qua vao mot danh sach dung chung (co dong bo dung cach)."],"references":[{"id":"day11-ref-1","type":"external","resourceId":"res-3393c8cbdaaf","citationId":"day11-src-1","url":"https://www.baeldung.com/java-thread-lifecycle","label":"Thread Fundamentals","checkStatus":"ok","readStatus":"read","pageTitle":"Life Cycle of a Thread in Java | Baeldung","limitation":null},{"id":"day11-ref-2","type":"external","resourceId":"res-a553d0d4478d","citationId":"day11-src-4","url":"https://www.baeldung.com/java-synchronized","label":"Synchronized","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to the Synchronized Keyword in Java | Baeldung","limitation":null},{"id":"day11-ref-3","type":"external","resourceId":"res-9a6cde117315","citationId":"day11-src-7","url":"https://www.baeldung.com/java-volatile","label":"Volatile","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to the Volatile Keyword in Java | Baeldung","limitation":null},{"id":"day11-ref-4","type":"external","resourceId":"res-fc9869512a5f","citationId":"day11-src-10","url":"https://docs.oracle.com/javase/tutorial/essential/concurrency/sync.html","label":"Synchronization (Oracle)","checkStatus":"ok","readStatus":"read","pageTitle":"Synchronization (The Java Tutorials \u003e Essential Java Classes \u003e Concurrency)","limitation":null},{"id":"day11-ref-5","type":"external","resourceId":"res-fe3cc9768091","citationId":"day11-src-12","url":"https://docs.oracle.com/javase/tutorial/essential/concurrency/executors.html","label":"ExecutorService","checkStatus":"ok","readStatus":"read","pageTitle":"Executors (The Java Tutorials \u003e Essential Java Classes \u003e Concurrency)","limitation":null},{"id":"day11-ref-6","type":"external","resourceId":"res-543deb939f9e","citationId":"day11-src-14","url":"https://docs.oracle.com/javase/tutorial/essential/io/fileio.html","label":"File I/O","checkStatus":"ok","readStatus":"read","pageTitle":"File I/O (Featuring NIO.2) (The Java Tutorials \u003e Essential Java Classes \u003e Basic I/O)","limitation":null},{"id":"day11-ref-7","type":"external","resourceId":"res-88adadc6f2f4","citationId":"day11-src-15","url":"https://www.baeldung.com/java-io","label":"Java I/O","checkStatus":"ok","readStatus":"read","pageTitle":"Java IO Series | Baeldung","limitation":null},{"id":"day11-ref-8","type":"external","resourceId":"res-d6607fed4419","citationId":"day11-src-16","url":"https://www.baeldung.com/java-nio-2-file-api","label":"NIO.2 File API","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Java NIO2 File API | Baeldung","limitation":null},{"id":"day11-ref-9","type":"external","resourceId":"res-0c7109cb4fa8","citationId":"day11-src-19","url":"https://www.baeldung.com/java-serialization","label":"Serialization","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to Java Serialization | Baeldung","limitation":null},{"id":"day11-ref-10","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-12","unitId":"unit-04","group":"java","kind":"project","title":"- Assignment 4: Data Processing Pipeline","summary":"Assignment 4 tong hop Stream API (Day 10), NIO.2 File I/O va synchronized (Day 11) thanh mot pipeline xu ly du lieu hoan chinh: doc CSV lon bang Files.lines(), bien doi/nhom/tong hop/sap xep bang Stream, do hieu nang parallel vs sequential bang JMH, dam bao an toan luong khi can, va xuat bao cao ra JSON bang Files.writeString().","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Da hoan thanh Day 10 (Lambda \u0026 Stream API Chuyen Sau) va Day 11 (Concurrency \u0026 File I/O)."],"outcomes":["Doc file lon hieu qua bang Files.lines() (Stream\u003cString\u003e lazy).","Xay dung pipeline Stream hoan chinh: loc, nhom, tong hop, sap xep, gioi han top-N.","Hieu duoc vi sao can do hieu nang bang cong cu chuyen dung (JMH) thay vi tu do thu cong.","Nhan dien dung khi nao that su can mot accumulator dong bo rieng khi dung parallel stream.","Xuat du lieu ra file bang Files.writeString()."],"sections":[{"id":"day12-sec-brief","title":"De bai: Data Processing Pipeline","blocks":[{"id":"day12-blk-1","type":"deliverable","text":"- Assignment 4: Data Processing Pipeline\n  - Read file CSV 500K rows (simulated sales data)\n  - Stream transform: filter invalid → group by category → aggregate revenue → sort top 10\n  - Parallel vs sequential benchmark (JMH)\n  - Thread-safe result accumulator\n  - Export report ra JSON","citations":[]},{"id":"day12-blk-2","type":"note","text":"Assignment nay tong hop Stream API (Day 10) va NIO.2 File I/O (Day 11) thanh mot pipeline xu ly du lieu hoan chinh: doc file CSV lon, bien doi/tong hop bang Stream, do hieu nang parallel vs sequential, dam bao an toan luong khi gom ket qua, va xuat bao cao ra JSON.","citations":[]}]},{"id":"day12-sec-fileio","title":"Doc CSV va xuat bao cao bang NIO.2","blocks":[{"id":"day12-blk-3","type":"paragraph","text":"Goi java.nio.file cung cap Path lam duong dan va lop Files chua cac phuong thuc tinh thao tac tren Path; Files.lines(path) tra ve mot Stream\u003cString\u003e doc tung dong cua file mot cach lazy, phu hop de doc file CSV lon (500K dong) ma khong can tai toan bo noi dung vao bo nho cung luc.","citations":["day12-src-1","day12-src-3"]},{"id":"day12-blk-4","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\nclass SalesCsvReader {\n    record SalesRow(String category, double revenue, boolean valid) {}\n\n    List\u003cSalesRow\u003e readValidRows(Path csvFile) throws IOException {\n        try (var lines = Files.lines(csvFile)) {\n            return lines.skip(1)\n                    .map(SalesCsvReader::parseLine)\n                    .filter(SalesRow::valid)\n                    .collect(Collectors.toList());\n        }\n    }\n\n    private static SalesRow parseLine(String line) {\n        String[] cols = line.split(\",\", -1);\n        if (cols.length \u003c 2) {\n            return new SalesRow(\"\", 0, false);\n        }\n        try {\n            double revenue = Double.parseDouble(cols[1].trim());\n            return new SalesRow(cols[0].trim(), revenue, revenue \u003e= 0);\n        } catch (NumberFormatException e) {\n            return new SalesRow(cols[0].trim(), 0, false);\n        }\n    }\n}\n","compile":true,"citations":["day12-src-1","day12-src-3"]},{"id":"day12-blk-5","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\nimport java.util.Map;\n\nclass TopCategoryReportExporter {\n    void exportToJson(Path target, List\u003cMap.Entry\u003cString, Double\u003e\u003e topCategories) throws IOException {\n        StringBuilder json = new StringBuilder(\"[\\n\");\n        for (int i = 0; i \u003c topCategories.size(); i++) {\n            var entry = topCategories.get(i);\n            json.append(\"  {\\\"category\\\": \\\"\").append(entry.getKey())\n                    .append(\"\\\", \\\"revenue\\\": \").append(entry.getValue()).append(\"}\");\n            json.append(i \u003c topCategories.size() - 1 ? \",\\n\" : \"\\n\");\n        }\n        json.append(\"]\\n\");\n        Files.writeString(target, json.toString());\n    }\n}\n","compile":true,"citations":["day12-src-3","day12-src-4"]},{"id":"day12-blk-6","type":"note","text":"Files.writeString() (tu Java 11) cung la mot phuong thuc tinh cua Files thao tac tren Path, tuong tu nhom Files.createFile()/delete() da neu trong bai hoc File I/O - o day dung de ghi truc tiep noi dung JSON da dung san thanh String ra file bao cao.","citations":["day12-src-1","day12-src-4"]}]},{"id":"day12-sec-pipeline","title":"Stream transform: loc, nhom, tong hop, sap xep","blocks":[{"id":"day12-blk-7","type":"note","text":"Chu de nay khong co nguon trich dan trong resourceIds cua rieng Day 12 (2 trong 5 resourceIds la unavailable, 3 con lai chi la nguon File I/O); nguon Stream API chi tiet thuoc ve resourceIds cua Day 10, khong duoc gan cho Day 12 nen khong the trich dan cheo giua hai bai (xem authoring.limitations). Noi dung duoi day ap dung Stream API da hoc o Day 10 bang kien thuc Java 17 chuan.","citations":[]},{"id":"day12-blk-8","type":"paragraph","text":"Pipeline goi y gom bon buoc noi tiep tren stream cac SalesRow da doc duoc: (1) loc bo dong khong hop le bang `.filter(SalesRow::valid)` (da thuc hien ngay trong luc doc CSV); (2) nhom theo category bang `.collect(Collectors.groupingBy(SalesRow::category, Collectors.summingDouble(SalesRow::revenue)))` de vua nhom vua cong don revenue trong cung mot buoc, tra ve Map\u003cString, Double\u003e; (3) chuyen Map thanh danh sach entry va sap xep giam dan theo revenue bang `.entrySet().stream().sorted(Map.Entry.\u003cString, Double\u003ecomparingByValue().reversed())`; (4) lay 10 phan tu dau bang `.limit(10)` roi collect thanh danh sach de xuat bao cao.","citations":[]}]},{"id":"day12-sec-benchmark","title":"Parallel vs sequential benchmark (JMH)","blocks":[{"id":"day12-blk-9","type":"note","text":"Chu de JMH (Java Microbenchmark Harness) khong co nguon trich dan nao trong toan bo bo tai lieu duoc gan cho khoa hoc (khong resourceId nao cua Day 7-12 de cap JMH) - xem authoring.limitations. Noi dung duoi day trinh bay o muc gioi thieu, du de hoc vien bat dau do hieu nang dung dan.","citations":[]},{"id":"day12-blk-10","type":"paragraph","text":"JMH la thu vien chuyen dung de do hieu nang (micro-benchmark) cho Java, tranh cac sai lam pho bien khi tu do thoi gian bang System.currentTimeMillis() (nhu JIT warm-up chua on dinh, dead code elimination cua trinh bien dich xoa mat doan code khong dung ket qua). Y tuong co ban: danh dau phuong thuc can do bang @Benchmark, chay nhieu vong 'warm-up' truoc khi do that su, va so sanh thoi gian trung binh giua phien ban stream() (sequential) va parallelStream() (song song) tren cung mot tap du lieu 500K dong.","citations":[]},{"id":"day12-blk-11","type":"note","text":"Voi tap du lieu 500K dong va thao tac tinh toan don gian (cong don revenue), parallel stream chua chac nhanh hon sequential - dung JMH de do that su thay vi doan, va doi chieu voi luu y ve parallel stream da hoc o Day 10.","citations":[]}]},{"id":"day12-sec-accumulator","title":"Thread-safe result accumulator","blocks":[{"id":"day12-blk-12","type":"note","text":"Chu de dong bo/thread-safety khong co nguon trich dan trong resourceIds cua rieng Day 12 - nguon synchronized/concurrency chi tiet thuoc ve resourceIds cua Day 11, khong duoc gan cho Day 12 nen khong the trich dan cheo giua hai bai (xem authoring.limitations). Noi dung duoi day ap dung lai mau thiet ke synchronized da hoc o Day 11.","citations":[]},{"id":"day12-blk-13","type":"paragraph","text":"Neu benchmark o tren dung parallelStream() va can gom ket qua vao mot cau truc du lieu dung chung (vi du: dem so dong loi gap phai trong luc xu ly song song), cau truc do phai duoc dong bo dung cach (giong mau ThreadSafeAccumulator voi cac method synchronized da viet o Day 11), hoac uu tien dung cac Collector tu thiet ke sao cho khong can chia se trang thai mutable giua cac thread (cach an toan va don gian hon la de rieng Stream API tu quan ly gom ket qua qua collect(), khong tu tao bien dem chia se thu cong khi khong that su can thiet).","citations":[]}]}],"commonMistakes":["Doc toan bo 500K dong vao mot List\u003cString\u003e bang Files.readAllLines() roi moi xu ly, thay vi dung Files.lines() de xu ly lazy tung dong.","Tu tao bien dem chia se (vi du int errorCount) va cap nhat truc tiep ben trong lambda cua parallelStream() ma khong dong bo - gay race condition ngay ca khi logic chinh da dung Collectors an toan.","So sanh hieu nang parallel vs sequential bang mot lan do don le voi System.currentTimeMillis(), khong warm-up JIT truoc, dan toi ket luan sai lech ve viec parallel co thuc su nhanh hon hay khong."],"practices":[{"id":"day12-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vi sao Files.lines(path) phu hop de doc mot file CSV 500K dong hon la doc toan bo noi dung file vao mot String/List roi moi xu ly?","choices":[{"id":"day12-prac-1-a","text":"Vi Files.lines() tra ve Stream\u003cString\u003e lazy, doc tung dong khi can thay vi tai toan bo file vao bo nho cung luc"},{"id":"day12-prac-1-b","text":"Vi Files.lines() tu dong chay song song tren nhieu thread"},{"id":"day12-prac-1-c","text":"Vi Files.lines() khong can dong (close) sau khi dung"},{"id":"day12-prac-1-d","text":"Vi Files.lines() tu dong bo qua cac dong loi"}],"correctChoiceIds":["day12-prac-1-a"],"hint":"Xem lai dac diem lazy cua Stream tra ve tu Files.lines().","solution":"day12-prac-1-a","explanation":"Files.lines() tra ve mot Stream\u003cString\u003e lazy: cac dong chi thuc su duoc doc khi terminal operation (nhu collect()) duoc goi, giup tranh tai toan bo file lon vao bo nho cung mot luc.","rubric":"Chon dung ly do lien quan toi tinh lazy cua Stream.","sourceUsage":["day12-src-3"]},{"id":"day12-prac-2","type":"coding","interaction":"self-check","prompt":"Viet mot method dung Stream de tu danh sach SalesRow da loc hop le, nhom theo category va cong don revenue, tra ve Map\u003cString, Double\u003e.","choices":[],"correctChoiceIds":[],"hint":"Dung Collectors.groupingBy() ket hop Collectors.summingDouble() trong cung mot buoc collect().","solution":"Map\u003cString, Double\u003e aggregateByCategory(List\u003cSalesRow\u003e rows) {\n    return rows.stream()\n            .collect(Collectors.groupingBy(SalesRow::category, Collectors.summingDouble(SalesRow::revenue)));\n}","explanation":"Ap dung Collectors.groupingBy() ket hop downstream collector summingDouble() da hoc o Day 10 vao du lieu thuc te.","rubric":"Danh gia dung ham nhom (category) va ham tong hop (summingDouble tren revenue) duoc chon dung, ket qua la Map\u003cString, Double\u003e.","sourceUsage":[]},{"id":"day12-prac-3","type":"concept","interaction":"self-check","prompt":"Vi sao can can nhac ky truoc khi tu tao mot bien dem/accumulator dung chung giua cac thread khi dung parallelStream(), thay vi luon mac dinh can mot accumulator dong bo thu cong?","choices":[],"correctChoiceIds":[],"hint":"Nghi ve cach Stream API tu gom ket qua qua collect() ma khong can chia se trang thai mutable.","solution":"Neu logic co the dien dat hoan toan bang collect()/reduce() (nhu aggregateByCategory o tren), Stream API da tu dam bao an toan luong khi gom ket qua ma khong can bien chia se thu cong. Chi khi that su can mot hieu ung phu (side-effect) ngoai pipeline (vi du dem loi song song) moi can mot accumulator dong bo rieng, va phai dong bo dung cach (nhu ThreadSafeAccumulator o Day 11) de tranh race condition.","explanation":"Uu tien cach tiep can khai bao (Stream/Collector) truoc khi tu quan ly trang thai chia se thu cong.","rubric":"Danh gia hoc vien nhan dien duoc khi nao thuc su can accumulator dong bo rieng.","sourceUsage":[]},{"id":"day12-prac-4","type":"coding","interaction":"self-check","prompt":"Viet mot method dung Files.writeString(Path, String) de ghi mot chuoi noi dung JSON da dung san ra file bao cao.","choices":[],"correctChoiceIds":[],"hint":"Files.writeString() nhan truc tiep Path va String, tu dong tao/ghi de file.","solution":"void writeReport(Path target, String jsonContent) throws IOException {\n    Files.writeString(target, jsonContent);\n}","explanation":"Ap dung truc tiep Files.writeString() (mot phuong thuc tinh khac cua Files) da gioi thieu trong bai.","rubric":"Danh gia goi dung Files.writeString() voi hai tham so Path va String, khai bao throws IOException.","sourceUsage":[]}],"syllabusAssignments":[{"row":22,"text":"- Assignment 4: Data Processing Pipeline\n  - Read file CSV 500K rows (simulated sales data)\n  - Stream transform: filter invalid → group by category → aggregate revenue → sort top 10\n  - Parallel vs sequential benchmark (JMH)\n  - Thread-safe result accumulator\n  - Export report ra JSON"}],"enhancedExercises":["Them buoc ghi lai danh sach cac dong CSV bi loai (invalid) ra mot file rieng, dung Collectors.partitioningBy() de tach song song hai nhom hop le/khong hop le trong cung mot lan duyet.","Viet ban JMH @Benchmark thuc su (neu co san thu vien JMH trong project) cho ca hai phien ban stream()/parallelStream() cua buoc nhom-tong-hop, va ghi lai ket qua do duoc."],"references":[{"id":"day12-ref-1","type":"external","resourceId":"res-543deb939f9e","citationId":"day12-src-1","url":"https://docs.oracle.com/javase/tutorial/essential/io/fileio.html","label":"File I/O","checkStatus":"ok","readStatus":"read","pageTitle":"File I/O (Featuring NIO.2) (The Java Tutorials \u003e Essential Java Classes \u003e Basic I/O)","limitation":null},{"id":"day12-ref-2","type":"external","resourceId":"res-d6607fed4419","citationId":"day12-src-3","url":"https://www.baeldung.com/java-nio-2-file-api","label":"NIO.2 File API","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Java NIO2 File API | Baeldung","limitation":null},{"id":"day12-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-13","unitId":"unit-05","group":"spring","kind":"theory","title":"Spring Boot Fundamentals \u0026 Bean Lifecycle","summary":"Nen tang Spring Boot va IoC container: kien truc Spring Boot o muc tong quan, BeanFactory/ApplicationContext, khai niem bean, 6 bean scope (singleton/prototype/request/session/application/websocket), scoped proxy, bean lifecycle callback (@PostConstruct/@PreDestroy) va cac stereotype annotation (@Component/@Service/@Repository/@Controller).","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Da hoan thanh Unit 3-4 (Java OOP, generics, collections, exception, stream, concurrency) - Spring xay dung tren nen OOP va DI thuan Java."],"outcomes":["Giai thich duoc IoC/DI theo dinh nghia Spring va vai tro cua BeanFactory/ApplicationContext.","Phan biet dung 6 bean scope va biet khi nao can scoped proxy.","Mo ta duoc thu tu callback khoi tao/huy trong bean lifecycle.","Nhan dien dung stereotype annotation phu hop cho tung tang kien truc."],"sections":[{"id":"day13-sec-brief","title":"De bai va pham vi bai hoc","blocks":[{"id":"day13-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day13-blk-2","type":"note","text":"Bai hoc mo dau don vi Spring: kien truc Spring Boot o muc tong quan, IoC container, bean scope, bean lifecycle va cac stereotype annotation dung de danh dau bean. Assignment cua ngay nay khong co de bai chi tiet rieng (chi ghi 'Assignment' trong lich hoc) - hoc vien on tap va thuc hanh lai cac vi du trong bai.","citations":[]}]},{"id":"day13-sec-architecture","title":"Spring Boot Architecture (tong quan)","blocks":[{"id":"day13-blk-3","type":"note","text":"Kien truc chi tiet cua Spring Boot (auto-configuration, starter dependency, embedded server, opinionated defaults) khong co resource nao trong resourceIds cua rieng Day 13 mo ta truc tiep - resource duy nhat lien quan (Learn Spring Boot Series) chi la trang muc luc lien ket toi cac bai con, khong phai bai viet sau ve kien truc (xem authoring.limitations). Noi dung duoi day trinh bay o muc gioi thieu bang kien thuc chuan cua Spring Boot: ung dung Spring Boot dong goi mot embedded server (Tomcat mac dinh), tu dong cau hinh bean dua tren classpath (auto-configuration - se hoc chi tiet o Day 14), va cung cap cac starter dependency (spring-boot-starter-web, ...) de gom nhom cac thu vien lien quan.","citations":[]},{"id":"day13-blk-4","type":"note","text":"Trang Learn Spring Boot Series cua Baeldung la mot muc luc tong hop, phan theo cac cum chu de: Basics, Properties, Customization, Testing, Under the Hood, Persistence, DevOps Tools, va Integration With Other Libraries - la diem bat dau tot de tra cuu sau hon ve tung khia canh cua Spring Boot.","citations":["day13-src-9"]}]},{"id":"day13-sec-ioc","title":"IoC Container: BeanFactory, ApplicationContext, Bean","blocks":[{"id":"day13-blk-5","type":"paragraph","text":"Spring dinh nghia Dependency Injection la mot dang chuyen biet cua Inversion of Control, trong do doi tuong khai bao dependency cua no chi qua constructor argument, tham so cua factory method, hoac property duoc set sau khi doi tuong duoc khoi tao; container tiem cac dependency nay khi tao bean. Hai goi org.springframework.beans va org.springframework.context la nen tang cua IoC container: BeanFactory cung cap co che cau hinh co ban, con ApplicationContext la sub-interface cua BeanFactory bo sung tich hop AOP, xu ly message resource (i18n), publish event, va cac context chuyen biet nhu WebApplicationContext. Mot bean la doi tuong duoc khoi tao, lap rap (assemble) va quan ly boi Spring IoC container.","citations":["day13-src-1","day13-src-2","day13-src-3"]},{"id":"day13-blk-6","type":"code","language":"java","code":"import org.springframework.context.annotation.AnnotationConfigApplicationContext;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\n\n@Configuration\nclass AppConfig {\n\n    @Bean\n    GreetingService greetingService() {\n        return new GreetingService(\"Xin chao\");\n    }\n}\n\nclass GreetingService {\n    private final String prefix;\n\n    GreetingService(String prefix) {\n        this.prefix = prefix;\n    }\n\n    String greet(String name) {\n        return prefix + \", \" + name;\n    }\n}\n\nclass BeanLookupDemo {\n    public static void main(String[] args) {\n        var context = new AnnotationConfigApplicationContext(AppConfig.class);\n        GreetingService service = context.getBean(GreetingService.class);\n        System.out.println(service.greet(\"Spring\"));\n        context.close();\n    }\n}\n","compile":false,"citations":["day13-src-1","day13-src-2","day13-src-3"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."}]},{"id":"day13-sec-scopes","title":"Bean Scopes","blocks":[{"id":"day13-blk-7","type":"paragraph","text":"Spring Framework ho tro 6 scope: singleton (mac dinh, mot instance cho toan container), prototype (moi lan request la mot instance moi), va bon scope chi dung duoc trong web-aware ApplicationContext: request, session, application, websocket; ngoai ra co the tao custom scope. Singleton cua Spring la per-container va per-bean (mot bean definition trong mot container tao dung mot instance), khac voi singleton pattern GoF von hard-code mot instance duy nhat cho moi ClassLoader.","citations":["day13-src-4","day13-src-5"]},{"id":"day13-blk-8","type":"table","columns":["Scope","Mo ta"],"rows":[["singleton","Mac dinh; mot instance duy nhat cho toan container, dung chung cho moi lan request bean"],["prototype","Container tao instance moi cho moi lan request bean; container khong quan ly destruction callback"],["request","Mot instance cho moi HTTP request; chi hop le trong web-aware ApplicationContext"],["session","Mot instance cho moi HTTP session; chi hop le trong web-aware ApplicationContext"],["application","Mot instance cho vong doi ServletContext; chi hop le trong web-aware ApplicationContext"],["websocket","Mot instance cho vong doi WebSocket session; chi hop le trong web-aware ApplicationContext"]],"citations":["day13-src-4"]},{"id":"day13-blk-9","type":"code","language":"java","code":"import org.springframework.beans.factory.config.ConfigurableBeanFactory;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.context.annotation.Scope;\n\n@Configuration\nclass ReportConfig {\n\n    @Bean\n    @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n    ReportBuilder reportBuilder() {\n        return new ReportBuilder();\n    }\n}\n\nclass ReportBuilder {\n    private final StringBuilder content = new StringBuilder();\n\n    ReportBuilder append(String line) {\n        content.append(line).append('\\n');\n        return this;\n    }\n\n    String build() {\n        return content.toString();\n    }\n}\n","compile":false,"citations":["day13-src-5","day13-src-6"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day13-blk-10","type":"note","text":"Voi prototype scope, container tao instance moi cho moi lan request bean nhung khong quan ly toan bo vong doi: callback khoi tao van duoc goi nhung destruction callback da cau hinh khong duoc goi, client code phai tu don dep tai nguyen cua bean prototype. Co the gan bean vao scope request/session/application bang annotation @RequestScope, @SessionScope, @ApplicationScope; cac scope nay chi hop le trong web-aware ApplicationContext, neu dung ngoai ngu canh do se nem IllegalStateException.","citations":["day13-src-6","day13-src-7"]},{"id":"day13-blk-11","type":"note","text":"Khi tiem mot bean scope ngan hon (nhu request-scoped) vao bean scope dai hon (singleton), can dung scoped proxy de Spring tao mot proxy: proxy giu cung interface cong khai nhung lay doi tuong that tu scope tuong ung tai thoi diem goi method, tranh viec singleton chi giu mai mot instance duoc tiem luc khoi tao.","citations":["day13-src-8"]}]},{"id":"day13-sec-lifecycle","title":"Bean Lifecycle (gioi thieu)","blocks":[{"id":"day13-blk-12","type":"note","text":"Chu de bean lifecycle (thu tu goi cac callback khoi tao/huy) khong co resource nao trong resourceIds cua rieng Day 13 mo ta (xem authoring.limitations). Kien thuc chuan cua Spring: mot bean co the khai bao callback khoi tao bang annotation `@PostConstruct` (goi sau khi moi dependency da duoc tiem) hoac bang cach implement interface `InitializingBean` (override `afterPropertiesSet()`); tuong tu, callback huy dung `@PreDestroy` hoac implement `DisposableBean` (override `destroy()`). Voi bean scope singleton, container goi callback huy khi container dong; voi prototype, nhu da neu o phan scope, container khong tu goi callback huy.","citations":[]}]},{"id":"day13-sec-stereotypes","title":"Stereotype Annotations (gioi thieu)","blocks":[{"id":"day13-blk-13","type":"note","text":"Chu de cac stereotype annotation (`@Component`, `@Service`, `@Repository`, `@Controller`) khong co resource nao trong resourceIds cua rieng Day 13 mo ta (xem authoring.limitations). Kien thuc chuan cua Spring: `@Component` la annotation goc, danh dau mot class de component scanning tu dong dang ky no thanh bean; `@Service`, `@Repository`, `@Controller` la cac annotation chuyen biet hoa cua `@Component` cho tung tang kien truc (nghiep vu, truy cap du lieu, dieu khien web) - ve mat co che chung deu la mot bean nhu nhau, diem khac biet la ngu nghia va mot so xu ly them (vi du `@Repository` tu dong dich exception tang persistence).","citations":[]}]}],"commonMistakes":["Tiem truc tiep mot request/session-scoped bean vao singleton bean ma khong dung scoped proxy.","Nham lan singleton cua Spring (per-container/per-bean) voi singleton pattern GoF (mot instance cho ca ung dung).","Ky vong container tu goi destruction callback cho bean scope prototype giong nhu singleton."],"practices":[{"id":"day13-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Singleton scope cua Spring khac gi so voi Singleton Pattern kinh dien (GoF)?","choices":[{"id":"day13-prac-1-a","text":"Singleton cua Spring la per-container va per-bean definition, khong phai mot instance duy nhat cho toan JVM/ClassLoader nhu GoF"},{"id":"day13-prac-1-b","text":"Singleton cua Spring luon thread-safe con GoF thi khong"},{"id":"day13-prac-1-c","text":"Singleton cua Spring khong the co constructor"},{"id":"day13-prac-1-d","text":"Singleton cua Spring va GoF hoan toan giong nhau"}],"correctChoiceIds":["day13-prac-1-a"],"hint":"Doc lai dinh nghia scope trong tai lieu Spring Bean Scopes.","solution":"day13-prac-1-a","explanation":"Tai lieu Spring xac dinh singleton scope la per-container va per-bean: mot bean definition trong mot container Spring tao dung mot instance, khac voi singleton pattern GoF von hard-code mot instance duy nhat cho moi ClassLoader.","rubric":"Chon dung diem khac biet ve pham vi (container/bean) thay vi nham lan voi thread-safety hay cu phap.","sourceUsage":["day13-src-5"]},{"id":"day13-prac-2","type":"coding","interaction":"self-check","prompt":"Viet mot @Configuration class dinh nghia mot @Bean scope prototype ten la 'taskBuilder' tra ve mot doi tuong TaskBuilder tuy y.","choices":[],"correctChoiceIds":[],"hint":"Dung @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE) tren method @Bean.","solution":"@Configuration\nclass TaskConfig {\n    @Bean\n    @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n    TaskBuilder taskBuilder() {\n        return new TaskBuilder();\n    }\n}","explanation":"Ap dung lai mau @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE) da hoc trong bai vao mot bean moi.","rubric":"Danh gia dung: co @Configuration tren class, @Bean tren method, va @Scope voi hang so SCOPE_PROTOTYPE (hoac chuoi \"prototype\").","sourceUsage":["day13-src-6"]},{"id":"day13-prac-3","type":"concept","interaction":"self-check","prompt":"Vi sao khong nen tiem truc tiep mot request-scoped bean vao mot singleton bean ma khong dung scoped proxy?","choices":[],"correctChoiceIds":[],"hint":"Nghi ve thoi diem container tao va tiem singleton bean - chi mot lan duy nhat.","solution":"Vi singleton bean chi duoc container tao va tiem dependency dung mot lan luc khoi dong; neu tiem truc tiep instance request-scoped hien tai vao lucdo, singleton se giu mai instance cua request dau tien thay vi lay instance dung cho tung request sau nay. Scoped proxy giai quyet van de nay bang cach tiem mot proxy giu nguyen interface nhung lay doi tuong that tu scope tuong ung tai thoi diem goi method.","explanation":"Giai thich vong doi khoi tao singleton chi dien ra mot lan.","rubric":"Danh gia hoc vien noi dung duoc ly do lien quan toi thoi diem khoi tao/tiem cua singleton bean.","sourceUsage":["day13-src-8"]},{"id":"day13-prac-4","type":"concept","interaction":"self-check","prompt":"Neu mot bean can chay logic don dep tai nguyen (dong ket noi, xoa file tam) khi container dong, nen dung callback nao va vi sao khong nen dung scope prototype cho bean nay?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan Bean Lifecycle va phan Prototype scope trong bai.","solution":"Nen dung @PreDestroy (hoac implement DisposableBean) va khai bao bean o scope singleton (mac dinh); container chi tu goi destruction callback voi bean singleton. Neu dung scope prototype, container tao instance moi cho moi lan request nhung khong quan ly toan bo vong doi - destruction callback se khong duoc container tu goi, client code phai tu don dep tai nguyen.","explanation":"Lien ket callback huy voi scope da hoc: chi singleton duoc container tu goi callback huy.","rubric":"Danh gia hoc vien ket noi dung kien thuc bean lifecycle voi kien thuc prototype scope da hoc trong cung bai.","sourceUsage":["day13-src-6"]}],"syllabusAssignments":[{"row":24,"text":"Assignment"}],"enhancedExercises":["Viet mot custom scope don gian (implement org.springframework.beans.factory.config.Scope) va dang ky bang ConfigurableBeanFactory.registerScope().","Thu nghiem @PostConstruct/@PreDestroy tren mot bean singleton va quan sat thu tu goi so voi constructor."],"references":[{"id":"day13-ref-1","type":"external","resourceId":"res-bb04db80cab2","citationId":"day13-src-1","url":"https://docs.spring.io/spring-framework/reference/core/beans/introduction.html","label":"IoC Container","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Spring IoC Container and Beans :: Spring Framework (docs.spring.io)","limitation":null},{"id":"day13-ref-2","type":"external","resourceId":"res-bf1095022eae","citationId":"day13-src-4","url":"https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html","label":"Bean Scopes","checkStatus":"ok","readStatus":"read","pageTitle":"Bean Scopes :: Spring Framework (docs.spring.io)","limitation":null},{"id":"day13-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-14","unitId":"unit-05","group":"spring","kind":"theory","title":"Dependency Injection \u0026 Configuration","summary":"Ba kieu Dependency Injection (constructor/setter/field) va thu tu @Autowired resolve dependency; @Configuration/@Bean phoi hop voi auto-configuration cua Spring Boot (classpath-based, non-invasive, exclude, --debug conditions report); on lai lien he DI-scope; gioi thieu @ConfigurationProperties va Profiles cho Day 15.","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Da hoc Day 13 (IoC container, bean, bean scope, bean lifecycle, stereotype annotations)."],"outcomes":["Phan biet dung 3 kieu Dependency Injection va chon kieu phu hop theo tinh bat buoc/tuy chon cua dependency.","Giai thich duoc thu tu Spring resolve dependency (type, ten, index).","Mo ta duoc quan he giua @Bean tu viet va auto-configuration cua Spring Boot (non-invasive/back-away).","Biet cach loai tru mot auto-configuration class va xem conditions report bang --debug."],"sections":[{"id":"day14-sec-brief","title":"De bai va pham vi bai hoc","blocks":[{"id":"day14-blk-1","type":"deliverable","text":"Guides/Review","citations":[]},{"id":"day14-blk-2","type":"note","text":"Bai hoc noi tiep Day 13, di sau vao 3 kieu Dependency Injection va co che @Autowired resolve dependency, cach @Configuration/@Bean phoi hop voi auto-configuration cua Spring Boot, va gioi thieu @ConfigurationProperties/Profiles (se hoc chi tiet o Day 15 cung Assignment 5). Lich hoc ngay nay ghi 'Guides/Review' - hoc vien on tap ly thuyet va thuc hanh lai vi du.","citations":[]}]},{"id":"day14-sec-di-types","title":"Ba kieu Dependency Injection","blocks":[{"id":"day14-blk-3","type":"paragraph","text":"Inversion of Control la nguyen ly chuyen quyen kiem soat viec tao/luong chuong trinh tu code tu viet sang mot container/framework; framework goi nguoc lai code cua minh thay vi code tu goi thu vien. Spring ho tro 3 kieu Dependency Injection: constructor injection (container goi constructor co tham so, moi tham so ung voi mot dependency), setter injection (container goi constructor khong tham so roi goi cac setter de gan dependency), va field injection (dung @Autowired truc tiep tren field, dung reflection de gan gia tri).","citations":["day14-src-1","day14-src-2","day14-src-3","day14-src-4"]},{"id":"day14-blk-4","type":"table","columns":["Kieu DI","Co che","Khuyen nghi"],"rows":[["Constructor injection","Container goi constructor co tham so tuong ung dependency","Khuyen nghi cho dependency bat buoc"],["Setter injection","Container goi constructor khong tham so roi goi setter","Khuyen nghi cho dependency tuy chon"],["Field injection","Dung @Autowired truc tiep tren field qua reflection","Khong khuyen nghi: reflection ton chi phi hon, de khien lop ganh qua nhieu dependency, vi pham Single Responsibility Principle"]],"citations":["day14-src-2","day14-src-3","day14-src-4"]},{"id":"day14-blk-5","type":"code","language":"java","code":"interface PricingPolicy {\n    double priceFor(int quantity);\n}\n\nclass DiscountPricingPolicy implements PricingPolicy {\n    private static final double UNIT_PRICE = 10.0;\n\n    @Override\n    public double priceFor(int quantity) {\n        double total = quantity * UNIT_PRICE;\n        return quantity \u003e= 10 ? total * 0.9 : total;\n    }\n}\n\nimport org.springframework.stereotype.Service;\n\n@Service\nclass OrderService {\n\n    private final PricingPolicy pricingPolicy;\n\n    // Constructor injection: Spring resolve theo type truoc; neu co nhieu\n    // bean cung type thi theo ten tham so; cuoi cung theo index de phan biet.\n    OrderService(PricingPolicy pricingPolicy) {\n        this.pricingPolicy = pricingPolicy;\n    }\n\n    double quote(int quantity) {\n        return pricingPolicy.priceFor(quantity);\n    }\n}\n","compile":false,"citations":["day14-src-2"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day14-blk-6","type":"note","text":"Ve thu tu resolve dependency: voi constructor injection, Spring resolve theo type truoc; neu co nhieu bean cung type, Spring xet tiep theo ten thuoc tinh (thuong ket hop voi @Qualifier); cuoi cung moi xet theo index de phan biet cac tham so cung type.","citations":["day14-src-2"]}]},{"id":"day14-sec-configuration-bean","title":"@Configuration, @Bean va Auto-configuration","blocks":[{"id":"day14-blk-7","type":"paragraph","text":"Nhu da thay o Day 13, mot class @Configuration khai bao method @Bean de dang ky bean thu cong voi container. Spring Boot bo sung them auto-configuration: ung dung tu dong cau hinh dua tren cac jar dependency co mat tren classpath (vi du neu co HSQLDB va chua cau hinh DataSource bean thu cong thi Spring Boot tu cau hinh mot database trong bo nho); tinh nang nay phai duoc bat ro rang bang @EnableAutoConfiguration hoac @SpringBootApplication.","citations":["day14-src-5"]},{"id":"day14-blk-8","type":"important","text":"Auto-configuration khong xam lan (non-invasive): no lui lai (back away) ngay khi ung dung tu dinh nghia bean cua rieng minh cho cung vai tro - vi du neu tu khai bao mot @Bean DataSource trong @Configuration class thi cau hinh database nhung mac dinh cua Spring Boot se khong con duoc ap dung nua. Day la ly do @Bean tu viet luon duoc uu tien hon auto-configuration mac dinh.","citations":["day14-src-6"]},{"id":"day14-blk-9","type":"note","text":"Co the loai tru mot auto-configuration class khong mong muon bang thuoc tinh exclude cua @SpringBootApplication/@EnableAutoConfiguration (hoac excludeName neu class khong co tren classpath), hoac qua property spring.autoconfigure.exclude. De xem auto-configuration nao dang duoc ap dung va ly do, chay ung dung voi co --debug: Spring Boot se in ra console mot conditions report.","citations":["day14-src-7","day14-src-8"]}]},{"id":"day14-sec-scope-recap","title":"DI va Bean Scope (on lai)","blocks":[{"id":"day14-blk-10","type":"note","text":"DI va bean scope lien quan chat che: khi mot dependency co scope ngan hon (vi du request-scoped) can duoc tiem vao mot bean scope dai hon (singleton, la truong hop pho bien nhat khi dung constructor injection), phai dung scoped proxy - Spring tao mot proxy giu cung interface cong khai nhung lay doi tuong that tu scope tuong ung tai thoi diem goi method, thay vi giu mai instance duoc tiem luc khoi tao. Chi tiet ve cac scope da hoc o Day 13.","citations":["day14-src-9"]}]},{"id":"day14-sec-configprops-profiles","title":"@ConfigurationProperties va Profiles (gioi thieu)","blocks":[{"id":"day14-blk-11","type":"note","text":"Chu de @ConfigurationProperties (gom property lien quan vao mot POJO co kieu, thay vi doc tung property rieng le bang @Value) va Profiles (kich hoat cau hinh khac nhau theo moi truong: dev/test/prod) khong co resource nao trong resourceIds cua rieng Day 14 mo ta chi tiet (xem authoring.limitations) - hai chu de nay se duoc hoc sau, co trich dan day du, trong Day 15 cung voi Assignment 5 Multi-module Notification Service.","citations":[]}]}],"commonMistakes":["Lam dung field injection cho moi dependency, khien lop kho test va ganh qua nhieu trach nhiem.","Tuong nham auto-configuration va @Bean tu viet xung dot, thay vi hieu dung co che back-away.","Khong biet dung --debug de chan doan vi sao mot auto-configuration khong duoc ap dung nhu mong doi."],"practices":[{"id":"day14-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vi sao field injection (dung @Autowired truc tiep tren field) khong duoc khuyen nghi so voi constructor injection?","choices":[{"id":"day14-prac-1-a","text":"Vi field injection dung reflection ton chi phi hon va de khien lop ganh qua nhieu dependency, vi pham Single Responsibility Principle"},{"id":"day14-prac-1-b","text":"Vi field injection khong the dung voi @Service"},{"id":"day14-prac-1-c","text":"Vi field injection chi hoat dong voi bean scope prototype"},{"id":"day14-prac-1-d","text":"Vi field injection yeu cau moi field phai la final"}],"correctChoiceIds":["day14-prac-1-a"],"hint":"Doc lai bang so sanh 3 kieu DI trong bai.","solution":"day14-prac-1-a","explanation":"Tai lieu xac dinh field injection dung reflection de gan gia tri, ton chi phi hon cach goi truc tiep, va de khien lop ganh qua nhieu dependency ma khong bi phat hien (vi khong co constructor/setter rang buoc), vi pham Single Responsibility Principle.","rubric":"Chon dung ly do lien quan reflection/SRP, khong nham voi cac ly do khong co trong tai lieu.","sourceUsage":["day14-src-4"]},{"id":"day14-prac-2","type":"coding","interaction":"self-check","prompt":"Chuyen doi OrderService trong bai tu constructor injection sang setter injection cho dependency PricingPolicy.","choices":[],"correctChoiceIds":[],"hint":"Bo constructor tham so, them setter co @Autowired.","solution":"class OrderService {\n    private PricingPolicy pricingPolicy;\n\n    @Autowired\n    void setPricingPolicy(PricingPolicy pricingPolicy) {\n        this.pricingPolicy = pricingPolicy;\n    }\n\n    double quote(int quantity) {\n        return pricingPolicy.priceFor(quantity);\n    }\n}","explanation":"Ap dung dung mo hinh setter injection: constructor khong tham so, setter co @Autowired de container goi sau khi khoi tao.","rubric":"Danh gia dung: field khong con final, co setter voi @Autowired, khong con constructor nhan PricingPolicy.","sourceUsage":["day14-src-3"]},{"id":"day14-prac-3","type":"concept","interaction":"self-check","prompt":"Ung dung dinh nghia mot @Bean DataSource cua rieng minh trong mot @Configuration class. Dieu gi se xay ra voi cau hinh database nhung mac dinh cua Spring Boot auto-configuration?","choices":[],"correctChoiceIds":[],"hint":"Nghi ve tinh chat non-invasive cua auto-configuration.","solution":"Auto-configuration se lui lai (back away): vi ung dung da tu dinh nghia bean DataSource cho cung vai tro, cau hinh database nhung mac dinh se khong con duoc ap dung nua - bean tu viet duoc uu tien hon.","explanation":"Lien ket voi tinh chat non-invasive/back-away da hoc trong bai.","rubric":"Danh gia hoc vien noi dung duoc co che back-away, khong nham lan voi loi hoac xung dot bean.","sourceUsage":["day14-src-6"]},{"id":"day14-prac-4","type":"concept","interaction":"self-check","prompt":"Khi debug mot ung dung Spring Boot va muon biet chinh xac auto-configuration nao dang duoc ap dung va ly do, nen lam gi?","choices":[],"correctChoiceIds":[],"hint":"Xem lai phan Auto-configuration trong bai.","solution":"Chay ung dung voi co --debug de bat log debug cho mot nhom logger loi va in ra console mot conditions report cho biet auto-configuration nao dang duoc ap dung va ly do (hoac vi sao mot auto-configuration bi bo qua).","explanation":"Nho lai co --debug da neu trong bai.","rubric":"Danh gia hoc vien nhac dung co --debug va muc dich conditions report.","sourceUsage":["day14-src-8"]}],"syllabusAssignments":[],"enhancedExercises":["Viet lai OrderService bang ca 3 kieu DI (constructor/setter/field) va so sanh kha nang viet unit test cho tung kieu.","Thu exclude mot auto-configuration class that (vi du DataSourceAutoConfiguration) va chay voi --debug de doc conditions report."],"references":[{"id":"day14-ref-1","type":"external","resourceId":"res-02399daadb94","citationId":"day14-src-2","url":"https://www.baeldung.com/inversion-control-and-dependency-injection-in-spring","label":"IoC \u0026 DI","checkStatus":"ok","readStatus":"read","pageTitle":"Intro to Inversion of Control and Dependency Injection with Spring | Baeldung","limitation":null},{"id":"day14-ref-2","type":"external","resourceId":"res-b6fc716e051f","citationId":"day14-src-5","url":"https://docs.spring.io/spring-boot/reference/using/auto-configuration.html","label":"Auto-configuration","checkStatus":"ok","readStatus":"read","pageTitle":"Auto-configuration :: Spring Boot (docs.spring.io)","limitation":null},{"id":"day14-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-15","unitId":"unit-05","group":"spring","kind":"project","title":"- Assignment 5: Multi-module Notification Service","summary":"Assignment 5 - Multi-module Notification Service: interface NotificationService voi 3 implementation (Email/Sms/Push), chon implementation bang @Qualifier/@Profile, cau hinh tung sender bang @ConfigurationProperties (record + constructor binding + Bean Validation), Factory pattern chon sender theo NotificationType, va retry logic khi gui that bai.","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Da hoc Day 13-14 (IoC container, bean scope, DI types, @Autowired resolution, @Configuration/@Bean)."],"outcomes":["Dinh nghia duoc lop @ConfigurationProperties bat bien (record + constructor binding) co validate bang Bean Validation.","Chon dung giua @Qualifier va @Profile de lua implementation phu hop ngu canh.","Ap dung Factory pattern de chon sender theo loai thong bao ma khong dung chuoi if/else.","Thiet ke duoc retry logic co gioi han so lan thu khi gui that bai."],"sections":[{"id":"day15-sec-brief","title":"De bai Assignment 5","blocks":[{"id":"day15-blk-1","type":"deliverable","text":"- Assignment 5: Multi-module Notification Service\n  - Interface `NotificationService` → EmailSender, SmsSender, PushSender\n  - @Qualifier or @Profile select implementation \n  - @ConfigurationProperties for each config (SMTP, Twilio, Firebase)\n  - Retry logic when send fail\n  - The Factory pattern creates the correct sender based on the notification type.","citations":[]}]},{"id":"day15-sec-configprops","title":"@ConfigurationProperties cho tung cau hinh","blocks":[{"id":"day15-blk-2","type":"paragraph","text":"Danh dau mot lop @ConfigurationProperties(prefix = \"...\") de Spring tu gan moi property co tien to tuong ung vao cac field/tham so cung ten nho chuan Java bean setter (hoac constructor binding voi record). @ConfigurationProperties ho tro property long nhau duoi dang List, Map va doi tuong long, giup gom nhom cau hinh SMTP/Twilio/Firebase thanh cac lop rieng biet thay vi doc tung property le bang @Value.","citations":["day15-src-1","day15-src-2"]},{"id":"day15-blk-3","type":"code","language":"java","code":"import jakarta.validation.constraints.Min;\nimport jakarta.validation.constraints.NotBlank;\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\n@ConfigurationProperties(prefix = \"notification.smtp\")\nrecord SmtpProperties(\n        @NotBlank String host,\n        @Min(1) int port,\n        @NotBlank String username,\n        @NotBlank String password) {\n}\n","compile":false,"citations":["day15-src-1","day15-src-4"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day15-blk-4","type":"important","text":"Nen dung constructor binding (mot Java record voi mot constructor duy nhat co the dung truc tiep lam @ConfigurationProperties tu Spring Boot 2.6 tro len, khong can them @ConstructorBinding) de tao lop cau hinh bat bien (final field, khong setter) cho SmtpProperties/TwilioProperties/FirebaseProperties. Co the gan them constraint nhu @NotBlank, @Min/@Max ngay tren field/tham so; neu validate that bai, ung dung se khong khoi dong duoc va nem IllegalStateException.","citations":["day15-src-3","day15-src-4","day15-src-7"]},{"id":"day15-blk-5","type":"note","text":"Spring Boot chap nhan nhieu bien the ten property khi bind: kebab-case (smtp.user-name), camelCase (smtp.userName), underscore (smtp.user_name) trong file properties/YAML, va UPPER_CASE voi dau gach duoi khi doc tu bien moi truong he thong (relaxed binding) - huu ich khi cau hinh Twilio/Firebase tu bien moi truong trong container.","citations":["day15-src-6"]}]},{"id":"day15-sec-qualifier-profile","title":"@Qualifier / @Profile de chon implementation","blocks":[{"id":"day15-blk-6","type":"paragraph","text":"Voi 3 implementation cung interface NotificationService (EmailSender, SmsSender, PushSender), Spring can biet chon bean nao khi tiem: DI la mot dang chuyen biet cua IoC, trong do container tiem dependency qua constructor argument dua tren cau hinh metadata (nhu ten bean khai bao trong @Component/@Qualifier).","citations":["day15-src-8"]},{"id":"day15-blk-7","type":"code","language":"java","code":"interface NotificationService {\n    void send(String recipient, String message);\n}\n\nimport org.springframework.beans.factory.annotation.Qualifier;\nimport org.springframework.stereotype.Component;\n\n@Component(\"emailSender\")\nclass EmailSender implements NotificationService {\n    @Override\n    public void send(String recipient, String message) {\n        System.out.println(\"[email] to=\" + recipient + \" msg=\" + message);\n    }\n}\n\n@Component(\"smsSender\")\nclass SmsSender implements NotificationService {\n    @Override\n    public void send(String recipient, String message) {\n        System.out.println(\"[sms] to=\" + recipient + \" msg=\" + message);\n    }\n}\n\nclass NotificationClient {\n\n    private final NotificationService emailSender;\n\n    // @Qualifier chon dung bean khi co nhieu implementation cua cung mot\n    // interface - Spring resolve theo type truoc (nhu hoc o Day 14), roi\n    // dung ten @Qualifier de phan biet giua cac ung vien cung type.\n    NotificationClient(@Qualifier(\"emailSender\") NotificationService emailSender) {\n        this.emailSender = emailSender;\n    }\n}\n","compile":false,"citations":["day15-src-8"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day15-blk-8","type":"note","text":"Ngoai @Qualifier (chon theo ten bean tuong minh), co the dung @Profile(\"twilio\")/@Profile(\"firebase\") tren tung implementation de Spring chi dang ky bean tuong ung khi profile do dang active - huu ich khi muon doi nha cung cap SMS/Push theo moi truong (dev dung fake sender, prod dung Twilio/Firebase that) ma khong sua code goi.","citations":[]}]},{"id":"day15-sec-factory","title":"Factory Pattern chon sender theo NotificationType","blocks":[{"id":"day15-blk-9","type":"code","language":"java","code":"enum NotificationType { EMAIL, SMS, PUSH }\n\nimport java.util.Map;\nimport org.springframework.stereotype.Component;\n\n@Component\nclass NotificationSenderFactory {\n\n    private final Map\u003cNotificationType, NotificationService\u003e senders;\n\n    // Spring tiem toan bo cac bean NotificationService vao Map, key la\n    // ten bean; Factory tu anh xa ten bean sang NotificationType de chon\n    // dung sender ma khong can chuoi if/else theo type.\n    NotificationSenderFactory(Map\u003cString, NotificationService\u003e beansByName) {\n        this.senders = Map.of(\n                NotificationType.EMAIL, beansByName.get(\"emailSender\"),\n                NotificationType.SMS, beansByName.get(\"smsSender\"));\n    }\n\n    NotificationService senderFor(NotificationType type) {\n        NotificationService sender = senders.get(type);\n        if (sender == null) {\n            throw new IllegalArgumentException(\"Khong co sender cho: \" + type);\n        }\n        return sender;\n    }\n}\n","compile":false,"citations":["day15-src-8"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day15-blk-10","type":"note","text":"Factory nhan Map\u003cString, NotificationService\u003e (Spring tu tiem toan bo bean cung interface vao Map, key la ten bean) roi tu anh xa sang NotificationType, tranh chuoi if/else lien tiep va de mo rong khi them loai thong bao moi.","citations":[]}]},{"id":"day15-sec-retry","title":"Retry logic khi gui that bai","blocks":[{"id":"day15-blk-11","type":"note","text":"Yeu cau retry logic khi send that bai khong co resource nao trong resourceIds cua Day 15 mo ta chi tiet (xem authoring.limitations). Cach lam pho bien: boc loi gui trong vong lap thu lai toi da N lan voi backoff (vi du delay tang dan giua cac lan thu), hoac dung @Retryable cua Spring Retry (thu vien rieng, khong nam trong resourceIds da doc) neu duoc phep them dependency; neu vuot qua so lan thu, ghi log/nem exception nghiep vu de tang gui that bai o cap cao hon xu ly.","citations":[]}]}],"commonMistakes":["Dat property SMTP/Twilio/Firebase rai rac bang nhieu @Value thay vi gom vao lop @ConfigurationProperties rieng cho tung nha cung cap.","Quen validate property cau hinh (vi du accountSid rong) khien loi chi xuat hien luc goi API thay vi luc khoi dong ung dung.","Retry vo han lan khong co gioi han, khien request treo khi nha cung cap thong bao that bai lien tuc."],"practices":[{"id":"day15-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Tu Spring Boot 2.6, cach nao duoc dung truc tiep lam lop @ConfigurationProperties bat bien ma khong can them @ConstructorBinding?","choices":[{"id":"day15-prac-1-a","text":"Mot Java record voi mot constructor duy nhat"},{"id":"day15-prac-1-b","text":"Mot interface voi default method"},{"id":"day15-prac-1-c","text":"Mot enum voi field tinh"},{"id":"day15-prac-1-d","text":"Mot lop abstract voi constructor protected"}],"correctChoiceIds":["day15-prac-1-a"],"hint":"Doc lai phan Constructor binding va Java record trong bai.","solution":"day15-prac-1-a","explanation":"Tai lieu xac nhan tu Spring Boot 2.6, mot Java record voi mot constructor duy nhat co the dung truc tiep lam @ConfigurationProperties ma khong can them @ConstructorBinding, tao ra lop cau hinh bat bien.","rubric":"Chon dung 'Java record' thay vi cac kieu khong ho tro constructor binding tu dong.","sourceUsage":["day15-src-4","day15-src-7"]},{"id":"day15-prac-2","type":"coding","interaction":"self-check","prompt":"Viet mot record TwilioProperties voi @ConfigurationProperties(prefix = \"notification.twilio\") gom accountSid, authToken, fromNumber, moi field bat buoc khong duoc rong.","choices":[],"correctChoiceIds":[],"hint":"Ap dung lai mau SmtpProperties trong bai, doi field va prefix.","solution":"@ConfigurationProperties(prefix = \"notification.twilio\")\nrecord TwilioProperties(\n        @NotBlank String accountSid,\n        @NotBlank String authToken,\n        @NotBlank String fromNumber) {\n}","explanation":"Dung dung prefix theo yeu cau va @NotBlank cho ca 3 field.","rubric":"Danh gia dung: la record, co @ConfigurationProperties voi prefix chinh xac, ca 3 field deu @NotBlank.","sourceUsage":["day15-src-1","day15-src-3"]},{"id":"day15-prac-3","type":"concept","interaction":"self-check","prompt":"Neu muon moi truong dev dung mot FakePushSender (khong goi Firebase that) con moi truong prod dung FirebasePushSender that, nen dung co che nao cua Spring va vi sao?","choices":[],"correctChoiceIds":[],"hint":"Nghi ve annotation gan bean voi mot moi truong cu the.","solution":"Nen dung @Profile: gan @Profile(\"dev\") cho FakePushSender va @Profile(\"prod\") cho FirebasePushSender - Spring chi dang ky bean tuong ung voi profile dang active, tranh phai sua code goi hay dung if/else theo moi truong.","explanation":"Lien ket voi noi dung @Profile chon implementation da hoc trong bai.","rubric":"Danh gia hoc vien neu dung @Profile va giai thich duoc loi ich (khong sua code goi, tach theo moi truong).","sourceUsage":[]},{"id":"day15-prac-4","type":"concept","interaction":"self-check","prompt":"Trong ham khoi tao cua NotificationSenderFactory, vi sao Factory nhan Map\u003cString, NotificationService\u003e thay vi tung sender rieng le qua tung tham so constructor?","choices":[],"correctChoiceIds":[],"hint":"Xem lai code NotificationSenderFactory trong bai.","solution":"Vi Spring tu dong tiem toan bo bean cung interface NotificationService vao mot Map voi key la ten bean, giup Factory khong can liet ke tung tham so rieng cho tung loai sender va de dang mo rong khi them loai thong bao moi (chi can them mot bean @Component moi, khong can sua constructor cua Factory).","explanation":"Giai thich loi ich mo rong (extensibility) khi dung Map thay vi tham so rieng le.","rubric":"Danh gia hoc vien neu dung co che tiem Map va loi ich mo rong.","sourceUsage":[]}],"syllabusAssignments":[{"row":27,"text":"- Assignment 5: Multi-module Notification Service\n  - Interface `NotificationService` → EmailSender, SmsSender, PushSender\n  - @Qualifier or @Profile select implementation \n  - @ConfigurationProperties for each config (SMTP, Twilio, Firebase)\n  - Retry logic when send fail\n  - The Factory pattern creates the correct sender based on the notification type."}],"enhancedExercises":["Them mot NotificationType moi (vi du SLACK) va mot implementation tuong ung ma khong sua NotificationSenderFactory ngoai phan khoi tao Map.","Viet test kiem tra @ConfigurationProperties validate that bai (accountSid rong) khien context khoi dong that bai."],"references":[{"id":"day15-ref-1","type":"external","resourceId":"res-7bf1b25b2e6b","citationId":"day15-src-1","url":"https://www.baeldung.com/configuration-properties-in-spring-boot","label":"@ConfigurationProperties","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to @ConfigurationProperties in Spring Boot | Baeldung","limitation":null},{"id":"day15-ref-2","type":"external","resourceId":"res-aee8bfb64b8c","citationId":"day15-src-5","url":"https://docs.spring.io/spring-boot/reference/features/external-config.html","label":"External Config","checkStatus":"ok","readStatus":"read","pageTitle":"Externalized Configuration :: Spring Boot (docs.spring.io)","limitation":null},{"id":"day15-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-16","unitId":"unit-06","group":"spring","kind":"theory","title":"Controller \u0026 Request/Response","summary":"Xay dung REST controller voi @RestController/@RequestMapping va cac shortcut theo HTTP method; cu phap URI pattern va @PathVariable; @RequestParam va params attribute; loi Ambiguous Mapping; ResponseEntity va cac builder tinh; content negotiation qua consumes/produces; khi nao dung @ResponseBody/@ResponseStatus thay vi ResponseEntity.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Da hoc Day 13-15 (IoC, DI, @Configuration/@Bean, @ConfigurationProperties) - controller cung la bean duoc Spring quan ly."],"outcomes":["Khai bao dung mapping bang @RequestMapping va cac shortcut theo HTTP method.","Bat va rang buoc kieu bien path/query bang @PathVariable/@RequestParam, tranh loi Ambiguous Mapping.","Dung ResponseEntity de kiem soat status/headers/body cua response.","Chon dung giua ResponseEntity, @ResponseBody, @ResponseStatus theo tung tinh huong."],"sections":[{"id":"day16-sec-brief","title":"De bai va pham vi bai hoc","blocks":[{"id":"day16-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day16-blk-2","type":"note","text":"Bai mo dau Unit 6 (Spring MVC/REST): xay dung controller voi @RestController, khai bao mapping bang @RequestMapping va cac shortcut theo HTTP method, xu ly tham so tu path/query, dung ResponseEntity de kiem soat toan bo HTTP response, va content negotiation qua consumes/produces. Lich hoc ngay nay ghi 'Assignment' nhung khong co de bai chi tiet rieng - hoc vien on tap va thuc hanh lai vi du trong bai.","citations":[]}]},{"id":"day16-sec-mapping","title":"@RequestMapping va cac shortcut","blocks":[{"id":"day16-blk-3","type":"paragraph","text":"@RequestMapping co the dat o cap class (mapping dung chung, vi du prefix /api/products) hoac method (endpoint cu the); cac annotation rut gon @GetMapping/@PostMapping/@PutMapping/@DeleteMapping/@PatchMapping duoc cung cap vi phan lon method nen gan voi mot HTTP method cu the thay vi khop moi method nhu @RequestMapping mac dinh. Neu khong chi dinh method, mapping se khop voi moi HTTP method gui toi path do.","citations":["day16-src-1","day16-src-5"]},{"id":"day16-blk-4","type":"table","columns":["Ky hieu","Y nghia"],"rows":[["?","Khop dung mot ky tu bat ky trong mot segment"],["*","Khop khong hoac nhieu ky tu trong mot segment"],["**","Khop khong hoac nhieu segment"],["{name}","Bat bien path segment, truy cap qua @PathVariable"],["{name:regex}","Bat bien path segment theo bieu thuc chinh quy, vi du {id:[\\d]+} chi khop gia tri so"]],"citations":["day16-src-2","day16-src-3","day16-src-5"]},{"id":"day16-blk-5","type":"code","language":"java","code":"import org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/products\")\nclass ProductController {\n\n    private final ProductRepository repository;\n\n    ProductController(ProductRepository repository) {\n        this.repository = repository;\n    }\n\n    // {id:[\\d]+} rang buoc bien path chi khop gia tri so.\n    @GetMapping(\"/{id:[\\\\d]+}\")\n    ResponseEntity\u003cProduct\u003e findById(@PathVariable long id) {\n        return repository.findById(id)\n                .map(ResponseEntity::ok)\n                .orElseGet(() -\u003e ResponseEntity.notFound().build());\n    }\n\n    @GetMapping(produces = \"application/json\")\n    ResponseEntity\u003cjava.util.List\u003cProduct\u003e\u003e search(\n            @RequestParam(required = false) String category) {\n        var results = category == null\n                ? repository.findAll()\n                : repository.findByCategory(category);\n        return ResponseEntity.ok(results);\n    }\n\n    @PostMapping(consumes = \"application/json\")\n    ResponseEntity\u003cProduct\u003e create(@RequestBody Product product) {\n        Product saved = repository.save(product);\n        return ResponseEntity.status(201).body(saved);\n    }\n}\n","compile":false,"citations":["day16-src-1","day16-src-3","day16-src-4"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."}]},{"id":"day16-sec-params","title":"Xu ly tham so: @PathVariable va @RequestParam","blocks":[{"id":"day16-blk-6","type":"paragraph","text":"@PathVariable bat mot hoac nhieu phan cua URI (vi du /foos/{fooid}/bar/{barid}) va tu dong chuyen kieu (int, long, Date, ...), nem TypeMismatchException neu khong chuyen duoc; @RequestParam(\"id\") trich gia tri query parameter truc tiep. @RequestMapping cung co the khai bao them params=\"id\" hoac params={\"id\",\"second\"} de chi khop khi request co (cac) parameter do; request khop nhieu dieu kien nhat se duoc chon.","citations":["day16-src-5","day16-src-6"]},{"id":"day16-blk-7","type":"warning","text":"Khi hai method co cung HTTP method, URL, parameters, headers va media type, Spring nem IllegalStateException bao ambiguous mapping ngay luc khoi dong ung dung (khong phai luc goi request) - khac phuc bang cach phan biet qua produces/consumes khac nhau hoac doi URL cua mot trong hai method.","citations":["day16-src-7"]}]},{"id":"day16-sec-response","title":"ResponseEntity va content negotiation","blocks":[{"id":"day16-blk-8","type":"paragraph","text":"ResponseEntity dai dien cho toan bo HTTP response gom status code, headers va body; controller tra ve ResponseEntity de Spring tu dong dung response tuong ung, kieu generic nen body co the la bat ky kieu nao. ResponseEntity cung cap cac phuong thuc tinh tien dung nhu ok(), badRequest(), notFound(), status(HttpStatus) ket hop .body(T) de dung response ngan gon thay vi goi constructor truc tiep.","citations":["day16-src-8","day16-src-9"]},{"id":"day16-blk-9","type":"code","language":"java","code":"import org.springframework.http.HttpStatus;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\nclass OrderQueryController {\n\n    // @ResponseStatus phu hop khi chi can dat ma trang thai co dinh cho\n    // response thanh cong, khong can dung ca ResponseEntity.\n    @GetMapping(\"/api/orders/{id}/status\")\n    @ResponseStatus(HttpStatus.OK)\n    @ResponseBody\n    String status(@PathVariable String id) {\n        return \"PENDING\";\n    }\n}\n","compile":false,"citations":["day16-src-10"],"partialReason":"Minh hoa cach dung Spring/Jakarta API; khong bien dich doc lap duoc vi moi truong javac --release 17 cua pipeline nay khong co Spring Framework/Jakarta jar tren classpath (chi co JDK chuan)."},{"id":"day16-blk-10","type":"note","text":"Khong nen lam dung ResponseEntity cho moi truong hop: dung @ResponseBody khi chi can tra du lieu (khong can kiem soat status code/headers), dung @ResponseStatus khi chi can dat ma trang thai tuy bien cho response thanh cong hoac exception handler. Thuoc tinh consumes thu hep mapping theo Content-Type cua request, produces thu hep theo Accept header/kieu noi dung tra ve; ca hai ho tro phu dinh (vi du !text/plain) va khi khai bao o method se override (khong cong don) gia tri khai bao o class.","citations":["day16-src-4","day16-src-10"]}]}],"commonMistakes":["Khai bao hai method mapping trung hoan toan (cung method/URL/params/headers/media type), gay IllegalStateException luc khoi dong.","Dung @PathVariable ma k
