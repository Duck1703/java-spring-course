003cT\u003e làm kiểu trả về thay vì trả về null trực tiếp cho một method 'tìm kiếm, có thể không thấy'?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về điều gì xảy ra ở phía nơi gọi nếu họ quên kiểm tra null.","solution":"Trả về null buộc nơi gọi phải tự nhớ kiểm tra null, để quên là NullPointerException; Optional\u003cT\u003e làm rõ ràng trong chữ ký phương thức rằng giá trị có thể không tồn tại, buộc nơi gọi phải xử lý tường minh (qua isPresent/orElse/map...) thay vì vô tình bỏ quên.","explanation":"Optional biến 'khả năng thiếu giá trị' thành một phần của kiểu dữ liệu, giảm nguy cơ NullPointerException không được kiểm soát.","rubric":"Đánh giá học viên nêu đúng lý do về tính tường minh/an toàn kiểu của Optional so với null.","sourceUsage":[]}],"syllabusAssignments":[{"row":19,"text":"Assignment"}],"enhancedExercises":["Viết một pipeline dùng Collectors.groupingBy() để nhóm danh sách Employee theo department, sau đó tính lương trung bình từng phòng ban bằng Collectors.averagingDouble().","So sánh thời gian chạy giữa stream() và parallelStream() trên một danh sách 1 triệu phần tử với một phép tính đơn giản (ví dụ cộng dồn) để tự quan sát khi nào parallel thật sự có lợi."],"references":[{"id":"day10-ref-1","type":"external","resourceId":"res-713a3e371ba0","citationId":"day10-src-1","url":"https://www.baeldung.com/java-stream-filter-lambda","label":"Stream Filter \u0026 Lambda","checkStatus":"ok","readStatus":"read","pageTitle":"Java Stream Filter with Lambda Expression | Baeldung","limitation":null},{"id":"day10-ref-2","type":"external","resourceId":"res-55e66ec50cc0","citationId":"day10-src-4","url":"https://www.baeldung.com/java-streams","label":"Java Streams","checkStatus":"ok","readStatus":"read","pageTitle":"Java Streams Series | Baeldung","limitation":null},{"id":"day10-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-11","unitId":"unit-04","group":"java","kind":"theory","title":"Concurrency \u0026 File I/O","summary":"Vòng đời Thread (6 trạng thái), synchronized/volatile để ngăn race condition và đảm bảo memory visibility, ExecutorService để tách quản lý thread khỏi tác vụ, NIO.2 Path/Files cho thao tác file, và Serialization để lưu/truyền trạng thái object — đây là bài giàu nguồn trích dẫn nhất trong Unit 4 với cả 9 resourceIds đều đã đọc được.","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Đã hoàn thành Day 10 (Lambda \u0026 Stream API Chuyên Sâu)."],"outcomes":["Liệt kê và giải thích đúng 6 trạng thái vòng đời của Thread.","Dùng synchronized đúng cách để ngăn race condition, hiểu được tính reentrant của khóa.","Giải thích được vai trò của volatile và happens-before trong memory visibility.","Dùng ExecutorService thay vì tự quản lý Thread thủ công.","Thao tác file/thư mục bằng java.nio.file.Path/Files và tự cài đặt serialization đúng cách (serialVersionUID, transient)."],"sections":[{"id":"day11-sec-thread","title":"Thread fundamentals: vòng đời Thread","blocks":[{"id":"day11-blk-1","type":"paragraph","text":"java.lang.Thread định nghĩa enum State với 6 trạng thái vòng đời: NEW (đã tạo, chưa gọi start()), RUNNABLE (đang chạy hoặc đang chờ được cấp CPU), BLOCKED (đang chờ để vào một synchronized method/block), WAITING (chờ vô thời hạn hành động của thread khác), TIMED_WAITING (chờ có giới hạn thời gian) và TERMINATED (đã kết thúc thực thi).","citations":["day11-src-1"]},{"id":"day11-blk-2","type":"paragraph","text":"Một thread rơi vào BLOCKED khi cố vào một synchronized method/block đang bị thread khác giữ khóa monitor. Ngược lại, WAITING xảy ra khi gọi object.wait(), thread.join() hoặc LockSupport.park() không kèm timeout; TIMED_WAITING xảy ra khi các phương thức tương tự được gọi kèm timeout, ví dụ Thread.sleep(millis).","citations":["day11-src-2","day11-src-3"]},{"id":"day11-blk-3","type":"code","language":"java","code":"class ThreadLifecycleDemo {\n    static void run() throws InterruptedException {\n        Thread worker = new Thread(() -\u003e {\n            try {\n                Thread.sleep(50);\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n            }\n        });\n        System.out.println(\"Before start: \" + worker.getState());\n        worker.start();\n        System.out.println(\"After start: \" + worker.getState());\n        worker.join();\n        System.out.println(\"After join: \" + worker.getState());\n    }\n}\n","compile":true,"citations":["day11-src-1","day11-src-3"]}]},{"id":"day11-sec-synchronized","title":"synchronized và race condition","blocks":[{"id":"day11-blk-4","type":"paragraph","text":"Race condition xảy ra khi nhiều thread cùng cập nhật dữ liệu chia sẻ có thể thay đổi (mutable) đồng thời mà không đồng bộ, dẫn tới kết quả sai lệch không nhất quán. Các thread chủ yếu giao tiếp qua việc chia sẻ field/object, cách này hiệu quả nhưng có thể gây hai loại lỗi: thread interference (xen kẽ thao tác gây sai lệch) và memory consistency error (thấy giá trị không nhất quán) — synchronization là công cụ để ngăn cả hai.","citations":["day11-src-4","day11-src-10"]},{"id":"day11-blk-5","type":"code","language":"java","code":"class Counter {\n    private int count = 0;\n\n    synchronized void increment() {\n        count++;\n    }\n\n    synchronized int get() {\n        return count;\n    }\n}\n\nclass RaceConditionDemo {\n    static void run() throws InterruptedException {\n        Counter counter = new Counter();\n        Runnable task = () -\u003e {\n            for (int i = 0; i \u003c 1000; i++) {\n                counter.increment();\n            }\n        };\n        Thread t1 = new Thread(task);\n        Thread t2 = new Thread(task);\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n        System.out.println(counter.get());\n    }\n}\n","compile":true,"citations":["day11-src-4","day11-src-5"]},{"id":"day11-blk-6","type":"note","text":"synchronized instance method khóa theo đối tượng instance (increment() và get() ở trên khóa theo từng Counter riêng); synchronized static method sẽ khóa theo đối tượng Class thay vì từng instance, nên chỉ một thread chạy được bất kể có bao nhiêu instance. Khóa của synchronized là reentrant: một thread đang giữ khóa có thể tiếp tục lấy lại chính khóa đó nhiều lần lồng nhau mà không bị deadlock với chính mình.","citations":["day11-src-5","day11-src-6"]},{"id":"day11-blk-7","type":"paragraph","text":"Trang Synchronization của Oracle liệt kê các chủ đề con liên quan: Thread Interference, Memory Consistency Errors, Synchronized Methods (idiom đơn giản để chống cả hai lỗi trên), Implicit Locks and Synchronization, và Atomic Access.","citations":["day11-src-11"]}]},{"id":"day11-sec-volatile","title":"Memory visibility và volatile","blocks":[{"id":"day11-blk-8","type":"paragraph","text":"Trong hệ nhiều lõi, mỗi thread có thể giữ bản sao biến trong cache riêng; nếu không đồng bộ, thread khác có thể không thấy giá trị vừa cập nhật (memory visibility) hoặc thấy các thay đổi theo thứ tự khác với thứ tự chương trình gốc (reordering).","citations":["day11-src-7"]},{"id":"day11-blk-9","type":"code","language":"java","code":"class VolatileFlagDemo {\n    private volatile boolean running = true;\n\n    void stop() {\n        running = false;\n    }\n\n    void loopUntilStopped() {\n        while (running) {\n            // công việc lặp, luôn đọc giá trị mới nhất từ bộ nhớ chính\n        }\n    }\n}\n","compile":true,"citations":["day11-src-8"]},{"id":"day11-blk-10","type":"note","text":"Đánh dấu biến volatile buộc runtime/processor không được sắp xếp lại các lệnh liên quan tới biến đó và luôn ghi/đọc giá trị mới nhất từ bộ nhớ chính, đảm bảo mọi thread thấy giá trị nhất quán — nhưng không cấp mutual exclusion như synchronized (không thay thế được synchronized khi cần đảm bảo một khối thao tác là nguyên tử). Theo Java Memory Model, một lần ghi vào biến volatile luôn happens-before mọi lần đọc tiếp theo của cùng biến đó, nên các giá trị thread A thấy trước khi ghi volatile cũng được thread B thấy sau khi đọc volatile đó.","citations":["day11-src-9"]}]},{"id":"day11-sec-executor","title":"ExecutorService","blocks":[{"id":"day11-blk-11","type":"paragraph","text":"Trong ứng dụng lớn, nên tách việc quản lý/tạo thread ra khỏi phần định nghĩa tác vụ (Runnable); các đối tượng đóng gói việc quản lý này gọi là executor, thay vì gắn chặt Runnable với một Thread cụ thể như cách làm đơn giản trước đó.","citations":["day11-src-12"]},{"id":"day11-blk-12","type":"code","language":"java","code":"import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.TimeUnit;\n\nclass ExecutorDemo {\n    static void run() throws InterruptedException {\n        ExecutorService executor = Executors.newFixedThreadPool(2);\n        executor.submit(() -\u003e System.out.println(\"task 1\"));\n        executor.submit(() -\u003e System.out.println(\"task 2\"));\n        executor.shutdown();\n        executor.awaitTermination(1, TimeUnit.SECONDS);\n    }\n}\n","compile":true,"citations":["day11-src-12","day11-src-13"]},{"id":"day11-blk-13","type":"note","text":"Chủ đề Executor chia làm ba phần: Executor Interfaces (định nghĩa 3 kiểu đối tượng executor), Thread Pools (loại cài đặt executor phổ biến nhất, như newFixedThreadPool ở ví dụ trên) và Fork/Join (framework tận dụng nhiều bộ xử lý).","citations":["day11-src-13"]}]},{"id":"day11-sec-fileio","title":"NIO.2 va File I/O","blocks":[{"id":"day11-blk-14","type":"paragraph","text":"Gói java.nio.file cung cấp Path làm entry point chính (đại diện cho đường dẫn) và lớp Files chứa các phương thức tĩnh thao tác trên Path như exists(), isReadable(), isWritable() để kiểm tra file/thư mục; đây cũng là nội dung mở đầu của bài học File I/O (Featuring NIO.2).","citations":["day11-src-14","day11-src-16"]},{"id":"day11-blk-15","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.StandardCopyOption;\n\nclass FileOpsDemo {\n    static void run(Path source, Path target) throws IOException {\n        if (!Files.exists(source)) {\n            Files.createFile(source);\n        }\n        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING);\n        Files.deleteIfExists(source);\n    }\n}\n","compile":true,"citations":["day11-src-17","day11-src-18"]},{"id":"day11-blk-16","type":"paragraph","text":"Files.createFile()/createDirectory() tạo file hoặc thư mục (đòi hỏi các thành phần đường dẫn cha đã tồn tại, khác với createDirectories() tạo đệ quy); Files.delete() xóa và ném exception nếu không tồn tại, còn deleteIfExists() thì không. Files.copy()/Files.move() thao tác tương tự copy/cut-paste; mặc định thất bại nếu file đích đã tồn tại trừ khi truyền StandardCopyOption.REPLACE_EXISTING; copy thư mục không đệ quy nội dung bên trong.","citations":["day11-src-17","day11-src-18"]},{"id":"day11-blk-17","type":"note","text":"Java IO Series của Baeldung phân loại các bài viết File I/O theo ba nhóm: thao tác file cơ bản (đọc/ghi/xóa/đổi tên), Java IO APIs (OutputStream, BufferedReader kiểu cũ) và Java NIO APIs (NIO2 File API, Path, WatchService, Selector) — Day 11 tập trung vào nhóm NIO APIs qua Path/Files.","citations":["day11-src-15"]}]},{"id":"day11-sec-serialization","title":"Serialization","blocks":[{"id":"day11-blk-18","type":"paragraph","text":"Serialization là chuyển trạng thái của một object thành chuỗi byte để lưu hoặc truyền qua mạng; deserialization làm ngược lại. Lớp muốn serialize được phải implement interface đánh dấu Serializable.","citations":["day11-src-19"]},{"id":"day11-blk-19","type":"code","language":"java","code":"import java.io.IOException;\nimport java.io.ObjectInputStream;\nimport java.io.ObjectOutputStream;\nimport java.io.Serializable;\n\nclass Address implements Serializable {\n    private static final long serialVersionUID = 1L;\n\n    private final String city;\n\n    Address(String city) {\n        this.city = city;\n    }\n}\n\nclass Employee implements Serializable {\n    private static final long serialVersionUID = 1L;\n\n    private final String name;\n    private final Address address;\n    private transient String cachedDisplayName;\n\n    Employee(String name, Address address) {\n        this.name = name;\n        this.address = address;\n    }\n\n    private void writeObject(ObjectOutputStream out) throws IOException {\n        out.defaultWriteObject();\n    }\n\n    private void readObject(ObjectInputStream in) throws IOException, ClassNotFoundException {\n        in.defaultReadObject();\n        cachedDisplayName = name.toUpperCase();\n    }\n}\n","compile":true,"citations":["day11-src-19","day11-src-20","day11-src-21","day11-src-22"]},{"id":"day11-blk-20","type":"note","text":"Khi một lớp implements Serializable, mọi lớp con cũng serializable theo; nếu một object tham chiếu tới object khác (như Employee tham chiếu Address ở trên), object được tham chiếu cũng phải serializable riêng, nếu không sẽ ném NotSerializableException.","citations":["day11-src-20"]},{"id":"day11-blk-21","type":"paragraph","text":"JVM gán một số hiệu phiên bản (serialVersionUID) cho mỗi lớp serializable để xác nhận object lưu và object đọc lại có cùng cấu trúc; nên khai báo tường minh vì số tự sinh phụ thuộc trình biên dịch, có thể gây InvalidClassException khi khác môi trường. Có thể override writeObject/readObject để tự định nghĩa cách serialize field không serializable được; field đánh dấu transient sẽ bị bỏ qua khi serialize mặc định.","citations":["day11-src-21","day11-src-22"]}]}],"commonMistakes":["Chỉ đồng bộ (synchronized) method ghi (ví dụ increment()) mà quên đồng bộ cả method đọc (get()) trên cùng field — vẫn có thể đọc phải giá trị cũ do memory visibility, dù không còn mất dữ liệu do ghi đè ghi.","Dùng volatile để thay thế synchronized khi cần đảm bảo một chuỗi thao tác (như đọc-sửa-ghi) là nguyên tử — volatile chỉ đảm bảo visibility, không đảm bảo mutual exclusion.","Đánh dấu một field tham chiếu tới object không implement Serializable trong một lớp đã Serializable mà không đánh dấu transient — sẽ ném NotSerializableException lúc runtime thay vì lỗi lúc biên dịch."],"practices":[{"id":"day11-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Điểm khác biệt chính giữa trạng thái BLOCKED và WAITING của Thread là gì?","choices":[{"id":"day11-prac-1-a","text":"BLOCKED là đang chờ để vào một synchronized method/block bị khóa; WAITING là chờ vô thời hạn một hành động của thread khác (ví dụ wait()/join() không timeout)"},{"id":"day11-prac-1-b","text":"BLOCKED và WAITING là một, chỉ khác tên gọi"},{"id":"day11-prac-1-c","text":"BLOCKED xảy ra sau TERMINATED, WAITING xảy ra trước NEW"},{"id":"day11-prac-1-d","text":"BLOCKED chỉ dành cho synchronized static method, WAITING chỉ dành cho synchronized instance method"}],"correctChoiceIds":["day11-prac-1-a"],"hint":"Xem lại định nghĩa từng trạng thái trong 6 trạng thái vòng đời Thread.","solution":"day11-prac-1-a","explanation":"BLOCKED gắn với việc chờ khóa monitor để vào synchronized; WAITING gắn với việc chờ một hành động từ thread khác (không có timeout).","rubric":"Chọn đúng nguyên nhân dẫn tới từng trạng thái.","sourceUsage":[]},{"id":"day11-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Trong RaceConditionDemo ở trên, hai thread t1/t2 cùng gọi counter.increment() 1000 lần qua method synchronized. Giá trị counter.get() sau khi cả hai thread join() là bao nhiêu?","choices":[{"id":"day11-prac-2-a","text":"Luôn là 2000"},{"id":"day11-prac-2-b","text":"Có thể nhỏ hơn 2000 do race condition"},{"id":"day11-prac-2-c","text":"Luôn là 1000"},{"id":"day11-prac-2-d","text":"Không xác định được, có thể là bất kỳ số nào"}],"correctChoiceIds":["day11-prac-2-a"],"hint":"increment() và get() đều là synchronized instance method trên cùng một Counter.","solution":"day11-prac-2-a","explanation":"Vì cả increment() và get() đều synchronized trên cùng một instance Counter, mỗi lần gọi increment() là nguyên tử (atomic) đối với field count — không còn race condition, nên kết quả luôn đúng 2000 (2 thread × 1000 lần).","rubric":"Đánh giá học viên hiểu đúng synchronized loại bỏ race condition trong ví dụ này.","sourceUsage":[]},{"id":"day11-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một lớp ThreadSafeAccumulator với field long total và một phương thức synchronized void add(long amount) cộng dồn vào total, cùng phương thức synchronized long getTotal() trả về giá trị hiện tại.","choices":[],"correctChoiceIds":[],"hint":"Áp dụng đúng mẫu Counter đã học: cả hai method đều synchronized trên cùng instance.","solution":"class ThreadSafeAccumulator {\n    private long total = 0;\n\n    synchronized void add(long amount) {\n        total += amount;\n    }\n\n    synchronized long getTotal() {\n        return total;\n    }\n}","explanation":"Accumulator dùng chung nhiều thread cần đồng bộ đúng đắn trên field mutable để tránh race condition.","rubric":"Đánh giá cả hai method đều được đánh dấu synchronized và thao tác đúng trên field total.","sourceUsage":[]},{"id":"day11-prac-4","type":"coding","interaction":"self-check","prompt":"Viết một method dùng java.nio.file.Files để: kiểm tra file đầu vào có tồn tại không, nếu có thì copy sang một đường dẫn đích (ghi đè nếu đích đã tồn tại).","choices":[],"correctChoiceIds":[],"hint":"Dùng Files.exists() để kiểm tra, Files.copy() với StandardCopyOption.REPLACE_EXISTING để ghi đè.","solution":"void copyIfExists(Path source, Path target) throws IOException {\n    if (Files.exists(source)) {\n        Files.copy(source, target, StandardCopyOption.REPLACE_EXISTING);\n    }\n}","explanation":"Bài tập áp dụng trực tiếp Files.exists()/Files.copy() đã học trong bài.","rubric":"Đánh giá có kiểm tra tồn tại trước khi copy và dùng đúng REPLACE_EXISTING để cho phép ghi đè.","sourceUsage":[]}],"syllabusAssignments":[],"enhancedExercises":["Viết lại RaceConditionDemo nhưng bỏ synchronized ở increment() để tự quan sát kết quả counter.get() sai lệch (\u003c 2000) do race condition, rồi so sánh với bản có synchronized.","Viết một chương trình dùng ExecutorService với newFixedThreadPool(4) để xử lý song song việc đọc nội dung nhiều file bằng Files.readString(), rồi tổng hợp kết quả vào một danh sách dùng chung (có đồng bộ đúng cách)."],"references":[{"id":"day11-ref-1","type":"external","resourceId":"res-3393c8cbdaaf","citationId":"day11-src-1","url":"https://www.baeldung.com/java-thread-lifecycle","label":"Thread Fundamentals","checkStatus":"ok","readStatus":"read","pageTitle":"Life Cycle of a Thread in Java | Baeldung","limitation":null},{"id":"day11-ref-2","type":"external","resourceId":"res-a553d0d4478d","citationId":"day11-src-4","url":"https://www.baeldung.com/java-synchronized","label":"Synchronized","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to the Synchronized Keyword in Java | Baeldung","limitation":null},{"id":"day11-ref-3","type":"external","resourceId":"res-9a6cde117315","citationId":"day11-src-7","url":"https://www.baeldung.com/java-volatile","label":"Volatile","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to the Volatile Keyword in Java | Baeldung","limitation":null},{"id":"day11-ref-4","type":"external","resourceId":"res-fc9869512a5f","citationId":"day11-src-10","url":"https://docs.oracle.com/javase/tutorial/essential/concurrency/sync.html","label":"Synchronization (Oracle)","checkStatus":"ok","readStatus":"read","pageTitle":"Synchronization (The Java Tutorials \u003e Essential Java Classes \u003e Concurrency)","limitation":null},{"id":"day11-ref-5","type":"external","resourceId":"res-fe3cc9768091","citationId":"day11-src-12","url":"https://docs.oracle.com/javase/tutorial/essential/concurrency/executors.html","label":"ExecutorService","checkStatus":"ok","readStatus":"read","pageTitle":"Executors (The Java Tutorials \u003e Essential Java Classes \u003e Concurrency)","limitation":null},{"id":"day11-ref-6","type":"external","resourceId":"res-543deb939f9e","citationId":"day11-src-14","url":"https://docs.oracle.com/javase/tutorial/essential/io/fileio.html","label":"File I/O","checkStatus":"ok","readStatus":"read","pageTitle":"File I/O (Featuring NIO.2) (The Java Tutorials \u003e Essential Java Classes \u003e Basic I/O)","limitation":null},{"id":"day11-ref-7","type":"external","resourceId":"res-88adadc6f2f4","citationId":"day11-src-15","url":"https://www.baeldung.com/java-io","label":"Java I/O","checkStatus":"ok","readStatus":"read","pageTitle":"Java IO Series | Baeldung","limitation":null},{"id":"day11-ref-8","type":"external","resourceId":"res-d6607fed4419","citationId":"day11-src-16","url":"https://www.baeldung.com/java-nio-2-file-api","label":"NIO.2 File API","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Java NIO2 File API | Baeldung","limitation":null},{"id":"day11-ref-9","type":"external","resourceId":"res-0c7109cb4fa8","citationId":"day11-src-19","url":"https://www.baeldung.com/java-serialization","label":"Serialization","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to Java Serialization | Baeldung","limitation":null},{"id":"day11-ref-10","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-12","unitId":"unit-04","group":"java","kind":"project","title":"- Assignment 4: Data Processing Pipeline","summary":"Assignment 4 tổng hợp Stream API (Day 10), NIO.2 File I/O và synchronized (Day 11) thành một pipeline xử lý dữ liệu hoàn chỉnh: đọc CSV lớn bằng Files.lines(), biến đổi/nhóm/tổng hợp/sắp xếp bằng Stream, đo hiệu năng parallel vs sequential bằng JMH, đảm bảo an toàn luồng khi cần, và xuất báo cáo ra JSON bằng Files.writeString().","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Đã hoàn thành Day 10 (Lambda \u0026 Stream API Chuyên Sâu) và Day 11 (Concurrency \u0026 File I/O)."],"outcomes":["Đọc file lớn hiệu quả bằng Files.lines() (Stream\u003cString\u003e lazy).","Xây dựng pipeline Stream hoàn chỉnh: lọc, nhóm, tổng hợp, sắp xếp, giới hạn top-N.","Hiểu được vì sao cần đo hiệu năng bằng công cụ chuyên dụng (JMH) thay vì tự đo thủ công.","Nhận diện đúng khi nào thật sự cần một accumulator đồng bộ riêng khi dùng parallel stream.","Xuất dữ liệu ra file bằng Files.writeString()."],"sections":[{"id":"day12-sec-brief","title":"Đề bài: Data Processing Pipeline","blocks":[{"id":"day12-blk-1","type":"deliverable","text":"- Assignment 4: Data Processing Pipeline\n  - Read file CSV 500K rows (simulated sales data)\n  - Stream transform: filter invalid → group by category → aggregate revenue → sort top 10\n  - Parallel vs sequential benchmark (JMH)\n  - Thread-safe result accumulator\n  - Export report ra JSON","citations":[]},{"id":"day12-blk-2","type":"note","text":"Assignment này tổng hợp Stream API (Day 10) và NIO.2 File I/O (Day 11) thành một pipeline xử lý dữ liệu hoàn chỉnh: đọc file CSV lớn, biến đổi/tổng hợp bằng Stream, đo hiệu năng parallel vs sequential, đảm bảo an toàn luồng khi gom kết quả, và xuất báo cáo ra JSON.","citations":[]}]},{"id":"day12-sec-fileio","title":"Đọc CSV và xuất báo cáo bằng NIO.2","blocks":[{"id":"day12-blk-3","type":"paragraph","text":"Gói java.nio.file cung cấp Path làm đường dẫn và lớp Files chứa các phương thức tĩnh thao tác trên Path; Files.lines(path) trả về một Stream\u003cString\u003e đọc từng dòng của file một cách lazy, phù hợp để đọc file CSV lớn (500K dòng) mà không cần tải toàn bộ nội dung vào bộ nhớ cùng lúc.","citations":["day12-src-1","day12-src-3"]},{"id":"day12-blk-4","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\nclass SalesCsvReader {\n    record SalesRow(String category, double revenue, boolean valid) {}\n\n    List\u003cSalesRow\u003e readValidRows(Path csvFile) throws IOException {\n        try (var lines = Files.lines(csvFile)) {\n            return lines.skip(1)\n                    .map(SalesCsvReader::parseLine)\n                    .filter(SalesRow::valid)\n                    .collect(Collectors.toList());\n        }\n    }\n\n    private static SalesRow parseLine(String line) {\n        String[] cols = line.split(\",\", -1);\n        if (cols.length \u003c 2) {\n            return new SalesRow(\"\", 0, false);\n        }\n        try {\n            double revenue = Double.parseDouble(cols[1].trim());\n            return new SalesRow(cols[0].trim(), revenue, revenue \u003e= 0);\n        } catch (NumberFormatException e) {\n            return new SalesRow(cols[0].trim(), 0, false);\n        }\n    }\n}\n","compile":true,"citations":["day12-src-1","day12-src-3"]},{"id":"day12-blk-5","type":"code","language":"java","code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\nimport java.util.Map;\n\nclass TopCategoryReportExporter {\n    void exportToJson(Path target, List\u003cMap.Entry\u003cString, Double\u003e\u003e topCategories) throws IOException {\n        StringBuilder json = new StringBuilder(\"[\\n\");\n        for (int i = 0; i \u003c topCategories.size(); i++) {\n            var entry = topCategories.get(i);\n            json.append(\"  {\\\"category\\\": \\\"\").append(entry.getKey())\n                    .append(\"\\\", \\\"revenue\\\": \").append(entry.getValue()).append(\"}\");\n            json.append(i \u003c topCategories.size() - 1 ? \",\\n\" : \"\\n\");\n        }\n        json.append(\"]\\n\");\n        Files.writeString(target, json.toString());\n    }\n}\n","compile":true,"citations":["day12-src-3","day12-src-4"]},{"id":"day12-blk-6","type":"note","text":"Files.writeString() (từ Java 11) cũng là một phương thức tĩnh của Files thao tác trên Path, tương tự nhóm Files.createFile()/delete() đã nêu trong bài học File I/O — ở đây dùng để ghi trực tiếp nội dung JSON đã dựng sẵn thành String ra file báo cáo.","citations":["day12-src-1","day12-src-4"]}]},{"id":"day12-sec-pipeline","title":"Stream transform: lọc, nhóm, tổng hợp, sắp xếp","blocks":[{"id":"day12-blk-7","type":"note","text":"Chủ đề này không có nguồn trích dẫn trong resourceIds của riêng Day 12 (2 trong 5 resourceIds là unavailable, 3 còn lại chỉ là nguồn File I/O); nguồn Stream API chi tiết thuộc về resourceIds của Day 10, không được gắn cho Day 12 nên không thể trích dẫn chéo giữa hai bài (xem authoring.limitations). Nội dung dưới đây áp dụng Stream API đã học ở Day 10 bằng kiến thức Java 17 chuẩn.","citations":[]},{"id":"day12-blk-8","type":"paragraph","text":"Pipeline gợi ý gồm bốn bước nối tiếp trên stream các SalesRow đã đọc được: (1) lọc bỏ dòng không hợp lệ bằng `.filter(SalesRow::valid)` (đã thực hiện ngay trong lúc đọc CSV); (2) nhóm theo category bằng `.collect(Collectors.groupingBy(SalesRow::category, Collectors.summingDouble(SalesRow::revenue)))` để vừa nhóm vừa cộng dồn revenue trong cùng một bước, trả về Map\u003cString, Double\u003e; (3) chuyển Map thành danh sách entry và sắp xếp giảm dần theo revenue bằng `.entrySet().stream().sorted(Map.Entry.\u003cString, Double\u003ecomparingByValue().reversed())`; (4) lấy 10 phần tử đầu bằng `.limit(10)` rồi collect thành danh sách để xuất báo cáo.","citations":[]}]},{"id":"day12-sec-benchmark","title":"Parallel vs sequential benchmark (JMH)","blocks":[{"id":"day12-blk-9","type":"note","text":"Chủ đề JMH (Java Microbenchmark Harness) không có nguồn trích dẫn nào trong toàn bộ bộ tài liệu được gắn cho khóa học (không resourceId nào của Day 7-12 đề cập JMH) — xem authoring.limitations. Nội dung dưới đây trình bày ở mức giới thiệu, đủ để học viên bắt đầu đo hiệu năng đúng đắn.","citations":[]},{"id":"day12-blk-10","type":"paragraph","text":"JMH là thư viện chuyên dụng để đo hiệu năng (micro-benchmark) cho Java, tránh các sai lầm phổ biến khi tự đo thời gian bằng System.currentTimeMillis() (như JIT warm-up chưa ổn định, dead code elimination của trình biên dịch xóa mất đoạn code không dùng kết quả). Ý tưởng cơ bản: đánh dấu phương thức cần đo bằng @Benchmark, chạy nhiều vòng 'warm-up' trước khi đo thật sự, và so sánh thời gian trung bình giữa phiên bản stream() (sequential) và parallelStream() (song song) trên cùng một tập dữ liệu 500K dòng.","citations":[]},{"id":"day12-blk-11","type":"note","text":"Với tập dữ liệu 500K dòng và thao tác tính toán đơn giản (cộng dồn revenue), parallel stream chưa chắc nhanh hơn sequential — dùng JMH để đo thật sự thay vì đoán, và đối chiếu với lưu ý về parallel stream đã học ở Day 10.","citations":[]}]},{"id":"day12-sec-accumulator","title":"Thread-safe result accumulator","blocks":[{"id":"day12-blk-12","type":"note","text":"Chủ đề đồng bộ/thread-safety không có nguồn trích dẫn trong resourceIds của riêng Day 12 — nguồn synchronized/concurrency chi tiết thuộc về resourceIds của Day 11, không được gắn cho Day 12 nên không thể trích dẫn chéo giữa hai bài (xem authoring.limitations). Nội dung dưới đây áp dụng lại mẫu thiết kế synchronized đã học ở Day 11.","citations":[]},{"id":"day12-blk-13","type":"paragraph","text":"Nếu benchmark ở trên dùng parallelStream() và cần gom kết quả vào một cấu trúc dữ liệu dùng chung (ví dụ: đếm số dòng lỗi gặp phải trong lúc xử lý song song), cấu trúc đó phải được đồng bộ đúng cách (giống mẫu ThreadSafeAccumulator với các method synchronized đã viết ở Day 11), hoặc ưu tiên dùng các Collector tự thiết kế sao cho không cần chia sẻ trạng thái mutable giữa các thread (cách an toàn và đơn giản hơn là để riêng Stream API tự quản lý gom kết quả qua collect(), không tự tạo biến đếm chia sẻ thủ công khi không thật sự cần thiết).","citations":[]}]}],"commonMistakes":["Đọc toàn bộ 500K dòng vào một List\u003cString\u003e bằng Files.readAllLines() rồi mới xử lý, thay vì dùng Files.lines() để xử lý lazy từng dòng.","Tự tạo biến đếm chia sẻ (ví dụ int errorCount) và cập nhật trực tiếp bên trong lambda của parallelStream() mà không đồng bộ — gây race condition ngay cả khi logic chính đã dùng Collectors an toàn.","So sánh hiệu năng parallel vs sequential bằng một lần đo đơn lẻ với System.currentTimeMillis(), không warm-up JIT trước, dẫn tới kết luận sai lệch về việc parallel có thực sự nhanh hơn hay không."],"practices":[{"id":"day12-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao Files.lines(path) phù hợp để đọc một file CSV 500K dòng hơn là đọc toàn bộ nội dung file vào một String/List rồi mới xử lý?","choices":[{"id":"day12-prac-1-a","text":"Vì Files.lines() trả về Stream\u003cString\u003e lazy, đọc từng dòng khi cần thay vì tải toàn bộ file vào bộ nhớ cùng lúc"},{"id":"day12-prac-1-b","text":"Vì Files.lines() tự động chạy song song trên nhiều thread"},{"id":"day12-prac-1-c","text":"Vì Files.lines() không cần đóng (close) sau khi dùng"},{"id":"day12-prac-1-d","text":"Vì Files.lines() tự động bỏ qua các dòng lỗi"}],"correctChoiceIds":["day12-prac-1-a"],"hint":"Xem lại đặc điểm lazy của Stream trả về từ Files.lines().","solution":"day12-prac-1-a","explanation":"Files.lines() trả về một Stream\u003cString\u003e lazy: các dòng chỉ thật sự được đọc khi terminal operation (như collect()) được gọi, giúp tránh tải toàn bộ file lớn vào bộ nhớ cùng một lúc.","rubric":"Chọn đúng lý do liên quan tới tính lazy của Stream.","sourceUsage":["day12-src-3"]},{"id":"day12-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một method dùng Stream để từ danh sách SalesRow đã lọc hợp lệ, nhóm theo category và cộng dồn revenue, trả về Map\u003cString, Double\u003e.","choices":[],"correctChoiceIds":[],"hint":"Dùng Collectors.groupingBy() kết hợp Collectors.summingDouble() trong cùng một bước collect().","solution":"Map\u003cString, Double\u003e aggregateByCategory(List\u003cSalesRow\u003e rows) {\n    return rows.stream()\n            .collect(Collectors.groupingBy(SalesRow::category, Collectors.summingDouble(SalesRow::revenue)));\n}","explanation":"Áp dụng Collectors.groupingBy() kết hợp downstream collector summingDouble() đã học ở Day 10 vào dữ liệu thực tế.","rubric":"Đánh giá đúng hàm nhóm (category) và hàm tổng hợp (summingDouble trên revenue) được chọn đúng, kết quả là Map\u003cString, Double\u003e.","sourceUsage":[]},{"id":"day12-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao cần cân nhắc kỹ trước khi tự tạo một biến đếm/accumulator dùng chung giữa các thread khi dùng parallelStream(), thay vì luôn mặc định cần một accumulator đồng bộ thủ công?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về cách Stream API tự gom kết quả qua collect() mà không cần chia sẻ trạng thái mutable.","solution":"Nếu logic có thể diễn đạt hoàn toàn bằng collect()/reduce() (như aggregateByCategory ở trên), Stream API đã tự đảm bảo an toàn luồng khi gom kết quả mà không cần biến chia sẻ thủ công. Chỉ khi thật sự cần một hiệu ứng phụ (side-effect) ngoài pipeline (ví dụ đếm lỗi song song) mới cần một accumulator đồng bộ riêng, và phải đồng bộ đúng cách (như ThreadSafeAccumulator ở Day 11) để tránh race condition.","explanation":"Ưu tiên cách tiếp cận khai báo (Stream/Collector) trước khi tự quản lý trạng thái chia sẻ thủ công.","rubric":"Đánh giá học viên nhận diện được khi nào thật sự cần accumulator đồng bộ riêng.","sourceUsage":[]},{"id":"day12-prac-4","type":"coding","interaction":"self-check","prompt":"Viết một method dùng Files.writeString(Path, String) để ghi một chuỗi nội dung JSON đã dựng sẵn ra file báo cáo.","choices":[],"correctChoiceIds":[],"hint":"Files.writeString() nhận trực tiếp Path và String, tự động tạo/ghi đè file.","solution":"void writeReport(Path target, String jsonContent) throws IOException {\n    Files.writeString(target, jsonContent);\n}","explanation":"Áp dụng trực tiếp Files.writeString() (một phương thức tĩnh khác của Files) đã giới thiệu trong bài.","rubric":"Đánh giá gọi đúng Files.writeString() với hai tham số Path và String, khai báo throws IOException.","sourceUsage":[]}],"syllabusAssignments":[{"row":22,"text":"- Assignment 4: Data Processing Pipeline\n  - Read file CSV 500K rows (simulated sales data)\n  - Stream transform: filter invalid → group by category → aggregate revenue → sort top 10\n  - Parallel vs sequential benchmark (JMH)\n  - Thread-safe result accumulator\n  - Export report ra JSON"}],"enhancedExercises":["Thêm bước ghi lại danh sách các dòng CSV bị loại (invalid) ra một file riêng, dùng Collectors.partitioningBy() để tách song song hai nhóm hợp lệ/không hợp lệ trong cùng một lần duyệt.","Viết bản JMH @Benchmark thật sự (nếu có sẵn thư viện JMH trong project) cho cả hai phiên bản stream()/parallelStream() của bước nhóm-tổng-hợp, và ghi lại kết quả đo được."],"references":[{"id":"day12-ref-1","type":"external","resourceId":"res-543deb939f9e","citationId":"day12-src-1","url":"https://docs.oracle.com/javase/tutorial/essential/io/fileio.html","label":"File I/O","checkStatus":"ok","readStatus":"read","pageTitle":"File I/O (Featuring NIO.2) (The Java Tutorials \u003e Essential Java Classes \u003e Basic I/O)","limitation":null},{"id":"day12-ref-2","type":"external","resourceId":"res-d6607fed4419","citationId":"day12-src-3","url":"https://www.baeldung.com/java-nio-2-file-api","label":"NIO.2 File API","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Java NIO2 File API | Baeldung","limitation":null},{"id":"day12-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":4,"unitTitle":"Stream API, Concurrency \u0026 File I/O"},{"id":"day-13","unitId":"unit-05","group":"spring","kind":"theory","title":"Spring Boot Fundamentals \u0026 Bean Lifecycle","summary":"Nền tảng Spring Boot và IoC container: kiến trúc Spring Boot ở mức tổng quan, BeanFactory/ApplicationContext, khái niệm bean, 6 bean scope (singleton/prototype/request/session/application/websocket), scoped proxy, bean lifecycle callback (@PostConstruct/@PreDestroy) và các stereotype annotation (@Component/@Service/@Repository/@Controller).","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Đã hoàn thành Unit 3-4 (Java OOP, generics, collections, exception, stream, concurrency) — Spring xây dựng trên nền OOP và DI thuần Java."],"outcomes":["Giải thích được IoC/DI theo định nghĩa Spring và vai trò của BeanFactory/ApplicationContext.","Phân biệt đúng 6 bean scope và biết khi nào cần scoped proxy.","Mô tả được thứ tự callback khởi tạo/hủy trong bean lifecycle.","Nhận diện đúng stereotype annotation phù hợp cho từng tầng kiến trúc."],"sections":[{"id":"day13-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day13-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day13-blk-2","type":"note","text":"Bài học mở đầu đơn vị Spring: kiến trúc Spring Boot ở mức tổng quan, IoC container, bean scope, bean lifecycle và các stereotype annotation dùng để đánh dấu bean. Assignment của ngày này không có đề bài chi tiết riêng (chỉ ghi 'Assignment' trong lịch học) — học viên ôn tập và thực hành lại các ví dụ trong bài.","citations":[]}]},{"id":"day13-sec-architecture","title":"Spring Boot Architecture (tổng quan)","blocks":[{"id":"day13-blk-3","type":"note","text":"Kiến trúc chi tiết của Spring Boot (auto-configuration, starter dependency, embedded server, opinionated defaults) không có resource nào trong resourceIds của riêng Day 13 mô tả trực tiếp — resource duy nhất liên quan (Learn Spring Boot Series) chỉ là trang mục lục liên kết tới các bài con, không phải bài viết sâu về kiến trúc (xem authoring.limitations). Nội dung dưới đây trình bày ở mức giới thiệu bằng kiến thức chuẩn của Spring Boot: ứng dụng Spring Boot đóng gói một embedded server (Tomcat mặc định), tự động cấu hình bean dựa trên classpath (auto-configuration — sẽ học chi tiết ở Day 14), và cung cấp các starter dependency (spring-boot-starter-web, ...) để gom nhóm các thư viện liên quan.","citations":[]},{"id":"day13-blk-4","type":"note","text":"Trang Learn Spring Boot Series của Baeldung là một mục lục tổng hợp, phân theo các cụm chủ đề: Basics, Properties, Customization, Testing, Under the Hood, Persistence, DevOps Tools, và Integration With Other Libraries — là điểm bắt đầu tốt để tra cứu sâu hơn về từng khía cạnh của Spring Boot.","citations":["day13-src-9"]}]},{"id":"day13-sec-ioc","title":"IoC Container: BeanFactory, ApplicationContext, Bean","blocks":[{"id":"day13-blk-5","type":"paragraph","text":"Spring định nghĩa Dependency Injection là một dạng chuyên biệt của Inversion of Control, trong đó đối tượng khai báo dependency của nó chỉ qua constructor argument, tham số của factory method, hoặc property được set sau khi đối tượng được khởi tạo; container tiêm các dependency này khi tạo bean. Hai gói org.springframework.beans và org.springframework.context là nền tảng của IoC container: BeanFactory cung cấp cơ chế cấu hình cơ bản, còn ApplicationContext là sub-interface của BeanFactory bổ sung tích hợp AOP, xử lý message resource (i18n), publish event, và các context chuyên biệt như WebApplicationContext. Một bean là đối tượng được khởi tạo, lắp ráp (assemble) và quản lý bởi Spring IoC container.","citations":["day13-src-1","day13-src-2","day13-src-3"]},{"id":"day13-blk-6","type":"code","language":"java","code":"import org.springframework.context.annotation.AnnotationConfigApplicationContext;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\n\n@Configuration\nclass AppConfig {\n\n    @Bean\n    GreetingService greetingService() {\n        return new GreetingService(\"Xin chao\");\n    }\n}\n\nclass GreetingService {\n    private final String prefix;\n\n    GreetingService(String prefix) {\n        this.prefix = prefix;\n    }\n\n    String greet(String name) {\n        return prefix + \", \" + name;\n    }\n}\n\nclass BeanLookupDemo {\n    public static void main(String[] args) {\n        var context = new AnnotationConfigApplicationContext(AppConfig.class);\n        GreetingService service = context.getBean(GreetingService.class);\n        System.out.println(service.greet(\"Spring\"));\n        context.close();\n    }\n}\n","compile":false,"citations":["day13-src-1","day13-src-2","day13-src-3"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."}]},{"id":"day13-sec-scopes","title":"Bean Scopes","blocks":[{"id":"day13-blk-7","type":"paragraph","text":"Spring Framework hỗ trợ 6 scope: singleton (mặc định, một instance cho toàn container), prototype (mỗi lần request là một instance mới), và bốn scope chỉ dùng được trong web-aware ApplicationContext: request, session, application, websocket; ngoài ra có thể tạo custom scope. Singleton của Spring là per-container và per-bean (một bean definition trong một container tạo đúng một instance), khác với singleton pattern GoF vốn hard-code một instance duy nhất cho mỗi ClassLoader.","citations":["day13-src-4","day13-src-5"]},{"id":"day13-blk-8","type":"table","columns":["Scope","Mô tả"],"rows":[["singleton","Mặc định; một instance duy nhất cho toàn container, dùng chung cho mỗi lần request bean"],["prototype","Container tạo instance mới cho mỗi lần request bean; container không quản lý destruction callback"],["request","Một instance cho mỗi HTTP request; chỉ hợp lệ trong web-aware ApplicationContext"],["session","Một instance cho mỗi HTTP session; chỉ hợp lệ trong web-aware ApplicationContext"],["application","Một instance cho vòng đời ServletContext; chỉ hợp lệ trong web-aware ApplicationContext"],["websocket","Một instance cho vòng đời WebSocket session; chỉ hợp lệ trong web-aware ApplicationContext"]],"citations":["day13-src-4"]},{"id":"day13-blk-9","type":"code","language":"java","code":"import org.springframework.beans.factory.config.ConfigurableBeanFactory;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.context.annotation.Scope;\n\n@Configuration\nclass ReportConfig {\n\n    @Bean\n    @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n    ReportBuilder reportBuilder() {\n        return new ReportBuilder();\n    }\n}\n\nclass ReportBuilder {\n    private final StringBuilder content = new StringBuilder();\n\n    ReportBuilder append(String line) {\n        content.append(line).append('\\n');\n        return this;\n    }\n\n    String build() {\n        return content.toString();\n    }\n}\n","compile":false,"citations":["day13-src-5","day13-src-6"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day13-blk-10","type":"note","text":"Với prototype scope, container tạo instance mới cho mỗi lần request bean nhưng không quản lý toàn bộ vòng đời: callback khởi tạo vẫn được gọi nhưng destruction callback đã cấu hình không được gọi, client code phải tự dọn dẹp tài nguyên của bean prototype. Có thể gắn bean vào scope request/session/application bằng annotation @RequestScope, @SessionScope, @ApplicationScope; các scope này chỉ hợp lệ trong web-aware ApplicationContext, nếu dùng ngoài ngữ cảnh đó sẽ ném IllegalStateException.","citations":["day13-src-6","day13-src-7"]},{"id":"day13-blk-11","type":"note","text":"Khi tiêm một bean scope ngắn hơn (như request-scoped) vào bean scope dài hơn (singleton), cần dùng scoped proxy để Spring tạo một proxy: proxy giữ cùng interface công khai nhưng lấy đối tượng thật từ scope tương ứng tại thời điểm gọi method, tránh việc singleton chỉ giữ mãi một instance được tiêm lúc khởi tạo.","citations":["day13-src-8"]}]},{"id":"day13-sec-lifecycle","title":"Bean Lifecycle (giới thiệu)","blocks":[{"id":"day13-blk-12","type":"note","text":"Chủ đề bean lifecycle (thứ tự gọi các callback khởi tạo/hủy) không có resource nào trong resourceIds của riêng Day 13 mô tả (xem authoring.limitations). Kiến thức chuẩn của Spring: một bean có thể khai báo callback khởi tạo bằng annotation `@PostConstruct` (gọi sau khi mọi dependency đã được tiêm) hoặc bằng cách implement interface `InitializingBean` (override `afterPropertiesSet()`); tương tự, callback hủy dùng `@PreDestroy` hoặc implement `DisposableBean` (override `destroy()`). Với bean scope singleton, container gọi callback hủy khi container đóng; với prototype, như đã nêu ở phần scope, container không tự gọi callback hủy.","citations":[]}]},{"id":"day13-sec-stereotypes","title":"Stereotype Annotations (giới thiệu)","blocks":[{"id":"day13-blk-13","type":"note","text":"Chủ đề các stereotype annotation (`@Component`, `@Service`, `@Repository`, `@Controller`) không có resource nào trong resourceIds của riêng Day 13 mô tả (xem authoring.limitations). Kiến thức chuẩn của Spring: `@Component` là annotation gốc, đánh dấu một class để component scanning tự động đăng ký nó thành bean; `@Service`, `@Repository`, `@Controller` là các annotation chuyên biệt hóa của `@Component` cho từng tầng kiến trúc (nghiệp vụ, truy cập dữ liệu, điều khiển web) — về mặt cơ chế chung đều là một bean như nhau, điểm khác biệt là ngữ nghĩa và một số xử lý thêm (ví dụ `@Repository` tự động dịch exception tầng persistence).","citations":[]}]}],"commonMistakes":["Tiêm trực tiếp một request/session-scoped bean vào singleton bean mà không dùng scoped proxy.","Nhầm lẫn singleton của Spring (per-container/per-bean) với singleton pattern GoF (một instance cho cả ứng dụng).","Kỳ vọng container tự gọi destruction callback cho bean scope prototype giống như singleton."],"practices":[{"id":"day13-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Singleton scope của Spring khác gì so với Singleton Pattern kinh điển (GoF)?","choices":[{"id":"day13-prac-1-a","text":"Singleton của Spring là per-container và per-bean definition, không phải một instance duy nhất cho toàn JVM/ClassLoader như GoF"},{"id":"day13-prac-1-b","text":"Singleton của Spring luôn thread-safe còn GoF thì không"},{"id":"day13-prac-1-c","text":"Singleton của Spring không thể có constructor"},{"id":"day13-prac-1-d","text":"Singleton của Spring và GoF hoàn toàn giống nhau"}],"correctChoiceIds":["day13-prac-1-a"],"hint":"Đọc lại định nghĩa scope trong tài liệu Spring Bean Scopes.","solution":"day13-prac-1-a","explanation":"Tài liệu Spring xác định singleton scope là per-container và per-bean: một bean definition trong một container Spring tạo đúng một instance, khác với singleton pattern GoF vốn hard-code một instance duy nhất cho mỗi ClassLoader.","rubric":"Chọn đúng điểm khác biệt về phạm vi (container/bean) thay vì nhầm lẫn với thread-safety hay cú pháp.","sourceUsage":["day13-src-5"]},{"id":"day13-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một @Configuration class định nghĩa một @Bean scope prototype tên là 'taskBuilder' trả về một đối tượng TaskBuilder tùy ý.","choices":[],"correctChoiceIds":[],"hint":"Dùng @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE) trên method @Bean.","solution":"@Configuration\nclass TaskConfig {\n    @Bean\n    @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n    TaskBuilder taskBuilder() {\n        return new TaskBuilder();\n    }\n}","explanation":"Áp dụng lại mẫu @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE) đã học trong bài vào một bean mới.","rubric":"Đánh giá đúng: có @Configuration trên class, @Bean trên method, và @Scope với hằng số SCOPE_PROTOTYPE (hoặc chuỗi \"prototype\").","sourceUsage":["day13-src-6"]},{"id":"day13-prac-3","type":"concept","interaction":"self-check","prompt":"Vì sao không nên tiêm trực tiếp một request-scoped bean vào một singleton bean mà không dùng scoped proxy?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về thời điểm container tạo và tiêm singleton bean — chỉ một lần duy nhất.","solution":"Vì singleton bean chỉ được container tạo và tiêm dependency đúng một lần lúc khởi động; nếu tiêm trực tiếp instance request-scoped hiện tại vào lúc đó, singleton sẽ giữ mãi instance của request đầu tiên thay vì lấy instance đúng cho từng request sau này. Scoped proxy giải quyết vấn đề này bằng cách tiêm một proxy giữ nguyên interface nhưng lấy đối tượng thật từ scope tương ứng tại thời điểm gọi method.","explanation":"Giải thích vòng đời khởi tạo singleton chỉ diễn ra một lần.","rubric":"Đánh giá học viên nói đúng lý do liên quan tới thời điểm khởi tạo/tiêm của singleton bean.","sourceUsage":["day13-src-8"]},{"id":"day13-prac-4","type":"concept","interaction":"self-check","prompt":"Nếu một bean cần chạy logic dọn dẹp tài nguyên (đóng kết nối, xóa file tạm) khi container đóng, nên dùng callback nào và vì sao không nên dùng scope prototype cho bean này?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần Bean Lifecycle và phần Prototype scope trong bài.","solution":"Nên dùng @PreDestroy (hoặc implement DisposableBean) và khai báo bean ở scope singleton (mặc định); container chỉ tự gọi destruction callback với bean singleton. Nếu dùng scope prototype, container tạo instance mới cho mỗi lần request nhưng không quản lý toàn bộ vòng đời — destruction callback sẽ không được container tự gọi, client code phải tự dọn dẹp tài nguyên.","explanation":"Liên kết callback hủy với scope đã học: chỉ singleton được container tự gọi callback hủy.","rubric":"Đánh giá học viên kết nối đúng kiến thức bean lifecycle với kiến thức prototype scope đã học trong cùng bài.","sourceUsage":["day13-src-6"]}],"syllabusAssignments":[{"row":24,"text":"Assignment"}],"enhancedExercises":["Viết một custom scope đơn giản (implement org.springframework.beans.factory.config.Scope) và đăng ký bằng ConfigurableBeanFactory.registerScope().","Thử nghiệm @PostConstruct/@PreDestroy trên một bean singleton và quan sát thứ tự gọi so với constructor."],"references":[{"id":"day13-ref-1","type":"external","resourceId":"res-bb04db80cab2","citationId":"day13-src-1","url":"https://docs.spring.io/spring-framework/reference/core/beans/introduction.html","label":"IoC Container","checkStatus":"ok","readStatus":"read","pageTitle":"Introduction to the Spring IoC Container and Beans :: Spring Framework (docs.spring.io)","limitation":null},{"id":"day13-ref-2","type":"external","resourceId":"res-bf1095022eae","citationId":"day13-src-4","url":"https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html","label":"Bean Scopes","checkStatus":"ok","readStatus":"read","pageTitle":"Bean Scopes :: Spring Framework (docs.spring.io)","limitation":null},{"id":"day13-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-14","unitId":"unit-05","group":"spring","kind":"theory","title":"Dependency Injection \u0026 Configuration","summary":"Ba kiểu Dependency Injection (constructor/setter/field) và thứ tự @Autowired resolve dependency; @Configuration/@Bean phối hợp với auto-configuration của Spring Boot (classpath-based, non-invasive, exclude, --debug conditions report); ôn lại liên hệ DI-scope; giới thiệu @ConfigurationProperties và Profiles cho Day 15.","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Đã học Day 13 (IoC container, bean, bean scope, bean lifecycle, stereotype annotations)."],"outcomes":["Phân biệt đúng 3 kiểu Dependency Injection và chọn kiểu phù hợp theo tính bắt buộc/tùy chọn của dependency.","Giải thích được thứ tự Spring resolve dependency (type, tên, index).","Mô tả được quan hệ giữa @Bean tự viết và auto-configuration của Spring Boot (non-invasive/back-away).","Biết cách loại trừ một auto-configuration class và xem conditions report bằng --debug."],"sections":[{"id":"day14-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day14-blk-1","type":"deliverable","text":"Guides/Review","citations":[]},{"id":"day14-blk-2","type":"note","text":"Bài học nối tiếp Day 13, đi sâu vào 3 kiểu Dependency Injection và cơ chế @Autowired resolve dependency, cách @Configuration/@Bean phối hợp với auto-configuration của Spring Boot, và giới thiệu @ConfigurationProperties/Profiles (sẽ học chi tiết ở Day 15 cùng Assignment 5). Lịch học ngày này ghi 'Guides/Review' — học viên ôn tập lý thuyết và thực hành lại ví dụ.","citations":[]}]},{"id":"day14-sec-di-types","title":"Ba kiểu Dependency Injection","blocks":[{"id":"day14-blk-3","type":"paragraph","text":"Inversion of Control là nguyên lý chuyển quyền kiểm soát việc tạo/luồng chương trình từ code tự viết sang một container/framework; framework gọi ngược lại code của mình thay vì code tự gọi thư viện. Spring hỗ trợ 3 kiểu Dependency Injection: constructor injection (container gọi constructor có tham số, mỗi tham số ứng với một dependency), setter injection (container gọi constructor không tham số rồi gọi các setter để gán dependency), và field injection (dùng @Autowired trực tiếp trên field, dùng reflection để gán giá trị).","citations":["day14-src-1","day14-src-2","day14-src-3","day14-src-4"]},{"id":"day14-blk-4","type":"table","columns":["Kiểu DI","Cơ chế","Khuyến nghị"],"rows":[["Constructor injection","Container gọi constructor có tham số tương ứng dependency","Khuyến nghị cho dependency bắt buộc"],["Setter injection","Container gọi constructor không tham số rồi gọi setter","Khuyến nghị cho dependency tùy chọn"],["Field injection","Dùng @Autowired trực tiếp trên field qua reflection","Không khuyến nghị: reflection tốn chi phí hơn, dễ khiến lớp gánh quá nhiều dependency, vi phạm Single Responsibility Principle"]],"citations":["day14-src-2","day14-src-3","day14-src-4"]},{"id":"day14-blk-5","type":"code","language":"java","code":"interface PricingPolicy {\n    double priceFor(int quantity);\n}\n\nclass DiscountPricingPolicy implements PricingPolicy {\n    private static final double UNIT_PRICE = 10.0;\n\n    @Override\n    public double priceFor(int quantity) {\n        double total = quantity * UNIT_PRICE;\n        return quantity \u003e= 10 ? total * 0.9 : total;\n    }\n}\n\nimport org.springframework.stereotype.Service;\n\n@Service\nclass OrderService {\n\n    private final PricingPolicy pricingPolicy;\n\n    // Constructor injection: Spring resolve theo type trước; nếu có nhiều\n    // bean cùng type thì theo tên tham số; cuối cùng theo index để phân biệt.\n    OrderService(PricingPolicy pricingPolicy) {\n        this.pricingPolicy = pricingPolicy;\n    }\n\n    double quote(int quantity) {\n        return pricingPolicy.priceFor(quantity);\n    }\n}\n","compile":false,"citations":["day14-src-2"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day14-blk-6","type":"note","text":"Về thứ tự resolve dependency: với constructor injection, Spring resolve theo type trước; nếu có nhiều bean cùng type, Spring xét tiếp theo tên thuộc tính (thường kết hợp với @Qualifier); cuối cùng mới xét theo index để phân biệt các tham số cùng type.","citations":["day14-src-2"]}]},{"id":"day14-sec-configuration-bean","title":"@Configuration, @Bean và Auto-configuration","blocks":[{"id":"day14-blk-7","type":"paragraph","text":"Như đã thấy ở Day 13, một class @Configuration khai báo method @Bean để đăng ký bean thủ công với container. Spring Boot bổ sung thêm auto-configuration: ứng dụng tự động cấu hình dựa trên các jar dependency có mặt trên classpath (ví dụ nếu có HSQLDB và chưa cấu hình DataSource bean thủ công thì Spring Boot tự cấu hình một database trong bộ nhớ); tính năng này phải được bật rõ ràng bằng @EnableAutoConfiguration hoặc @SpringBootApplication.","citations":["day14-src-5"]},{"id":"day14-blk-8","type":"important","text":"Auto-configuration không xâm lấn (non-invasive): nó lui lại (back away) ngay khi ứng dụng tự định nghĩa bean của riêng mình cho cùng vai trò — ví dụ nếu tự khai báo một @Bean DataSource trong @Configuration class thì cấu hình database nhúng mặc định của Spring Boot sẽ không còn được áp dụng nữa. Đây là lý do @Bean tự viết luôn được ưu tiên hơn auto-configuration mặc định.","citations":["day14-src-6"]},{"id":"day14-blk-9","type":"note","text":"Có thể loại trừ một auto-configuration class không mong muốn bằng thuộc tính exclude của @SpringBootApplication/@EnableAutoConfiguration (hoặc excludeName nếu class không có trên classpath), hoặc qua property spring.autoconfigure.exclude. Để xem auto-configuration nào đang được áp dụng và lý do, chạy ứng dụng với cờ --debug: Spring Boot sẽ in ra console một conditions report.","citations":["day14-src-7","day14-src-8"]}]},{"id":"day14-sec-scope-recap","title":"DI và Bean Scope (ôn lại)","blocks":[{"id":"day14-blk-10","type":"note","text":"DI và bean scope liên quan chặt chẽ: khi một dependency có scope ngắn hơn (ví dụ request-scoped) cần được tiêm vào một bean scope dài hơn (singleton, là trường hợp phổ biến nhất khi dùng constructor injection), phải dùng scoped proxy — Spring tạo một proxy giữ cùng interface công khai nhưng lấy đối tượng thật từ scope tương ứng tại thời điểm gọi method, thay vì giữ mãi instance được tiêm lúc khởi tạo. Chi tiết về các scope đã học ở Day 13.","citations":["day14-src-9"]}]},{"id":"day14-sec-configprops-profiles","title":"@ConfigurationProperties và Profiles (giới thiệu)","blocks":[{"id":"day14-blk-11","type":"note","text":"Chủ đề @ConfigurationProperties (gom property liên quan vào một POJO có kiểu, thay vì đọc từng property riêng lẻ bằng @Value) và Profiles (kích hoạt cấu hình khác nhau theo môi trường: dev/test/prod) không có resource nào trong resourceIds của riêng Day 14 mô tả chi tiết (xem authoring.limitations) — hai chủ đề này sẽ được học sau, có trích dẫn đầy đủ, trong Day 15 cùng với Assignment 5 Multi-module Notification Service.","citations":[]}]}],"commonMistakes":["Lạm dụng field injection cho mọi dependency, khiến lớp khó test và gánh quá nhiều trách nhiệm.","Tưởng nhầm auto-configuration và @Bean tự viết xung đột, thay vì hiểu đúng cơ chế back-away.","Không biết dùng --debug để chẩn đoán vì sao một auto-configuration không được áp dụng như mong đợi."],"practices":[{"id":"day14-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Vì sao field injection (dùng @Autowired trực tiếp trên field) không được khuyến nghị so với constructor injection?","choices":[{"id":"day14-prac-1-a","text":"Vì field injection dùng reflection tốn chi phí hơn và dễ khiến lớp gánh quá nhiều dependency, vi phạm Single Responsibility Principle"},{"id":"day14-prac-1-b","text":"Vì field injection không thể dùng với @Service"},{"id":"day14-prac-1-c","text":"Vì field injection chỉ hoạt động với bean scope prototype"},{"id":"day14-prac-1-d","text":"Vì field injection yêu cầu mọi field phải là final"}],"correctChoiceIds":["day14-prac-1-a"],"hint":"Đọc lại bảng so sánh 3 kiểu DI trong bài.","solution":"day14-prac-1-a","explanation":"Tài liệu xác định field injection dùng reflection để gán giá trị, tốn chi phí hơn cách gọi trực tiếp, và dễ khiến lớp gánh quá nhiều dependency mà không bị phát hiện (vì không có constructor/setter ràng buộc), vi phạm Single Responsibility Principle.","rubric":"Chọn đúng lý do liên quan reflection/SRP, không nhầm với các lý do không có trong tài liệu.","sourceUsage":["day14-src-4"]},{"id":"day14-prac-2","type":"coding","interaction":"self-check","prompt":"Chuyển đổi OrderService trong bài từ constructor injection sang setter injection cho dependency PricingPolicy.","choices":[],"correctChoiceIds":[],"hint":"Bỏ constructor tham số, thêm setter có @Autowired.","solution":"class OrderService {\n    private PricingPolicy pricingPolicy;\n\n    @Autowired\n    void setPricingPolicy(PricingPolicy pricingPolicy) {\n        this.pricingPolicy = pricingPolicy;\n    }\n\n    double quote(int quantity) {\n        return pricingPolicy.priceFor(quantity);\n    }\n}","explanation":"Áp dụng đúng mô hình setter injection: constructor không tham số, setter có @Autowired để container gọi sau khi khởi tạo.","rubric":"Đánh giá đúng: field không còn final, có setter với @Autowired, không còn constructor nhận PricingPolicy.","sourceUsage":["day14-src-3"]},{"id":"day14-prac-3","type":"concept","interaction":"self-check","prompt":"Ứng dụng định nghĩa một @Bean DataSource của riêng mình trong một @Configuration class. Điều gì sẽ xảy ra với cấu hình database nhúng mặc định của Spring Boot auto-configuration?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về tính chất non-invasive của auto-configuration.","solution":"Auto-configuration sẽ lui lại (back away): vì ứng dụng đã tự định nghĩa bean DataSource cho cùng vai trò, cấu hình database nhúng mặc định sẽ không còn được áp dụng nữa — bean tự viết được ưu tiên hơn.","explanation":"Liên kết với tính chất non-invasive/back-away đã học trong bài.","rubric":"Đánh giá học viên nói đúng được cơ chế back-away, không nhầm lẫn với lỗi hoặc xung đột bean.","sourceUsage":["day14-src-6"]},{"id":"day14-prac-4","type":"concept","interaction":"self-check","prompt":"Khi debug một ứng dụng Spring Boot và muốn biết chính xác auto-configuration nào đang được áp dụng và lý do, nên làm gì?","choices":[],"correctChoiceIds":[],"hint":"Xem lại phần Auto-configuration trong bài.","solution":"Chạy ứng dụng với cờ --debug để bật log debug cho một nhóm logger lõi và in ra console một conditions report cho biết auto-configuration nào đang được áp dụng và lý do (hoặc vì sao một auto-configuration bị bỏ qua).","explanation":"Nhớ lại cờ --debug đã nêu trong bài.","rubric":"Đánh giá học viên nhắc đúng cờ --debug và mục đích conditions report.","sourceUsage":["day14-src-8"]}],"syllabusAssignments":[],"enhancedExercises":["Viết lại OrderService bằng cả 3 kiểu DI (constructor/setter/field) và so sánh khả năng viết unit test cho từng kiểu.","Thử exclude một auto-configuration class thật (ví dụ DataSourceAutoConfiguration) và chạy với --debug để đọc conditions report."],"references":[{"id":"day14-ref-1","type":"external","resourceId":"res-02399daadb94","citationId":"day14-src-2","url":"https://www.baeldung.com/inversion-control-and-dependency-injection-in-spring","label":"IoC \u0026 DI","checkStatus":"ok","readStatus":"read","pageTitle":"Intro to Inversion of Control and Dependency Injection with Spring | Baeldung","limitation":null},{"id":"day14-ref-2","type":"external","resourceId":"res-b6fc716e051f","citationId":"day14-src-5","url":"https://docs.spring.io/spring-boot/reference/using/auto-configuration.html","label":"Auto-configuration","checkStatus":"ok","readStatus":"read","pageTitle":"Auto-configuration :: Spring Boot (docs.spring.io)","limitation":null},{"id":"day14-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-15","unitId":"unit-05","group":"spring","kind":"project","title":"- Assignment 5: Multi-module Notification Service","summary":"Assignment 5 — Multi-module Notification Service: interface NotificationService với 3 implementation (Email/Sms/Push), chọn implementation bằng @Qualifier/@Profile, cấu hình từng sender bằng @ConfigurationProperties (record + constructor binding + Bean Validation), Factory pattern chọn sender theo NotificationType, và retry logic khi gửi thất bại.","durationMinutes":150.0,"objectives":["LO5"],"prerequisites":["Đã học Day 13-14 (IoC container, bean scope, DI types, @Autowired resolution, @Configuration/@Bean)."],"outcomes":["Định nghĩa được lớp @ConfigurationProperties bất biến (record + constructor binding) có validate bằng Bean Validation.","Chọn đúng giữa @Qualifier và @Profile để lựa implementation phù hợp ngữ cảnh.","Áp dụng Factory pattern để chọn sender theo loại thông báo mà không dùng chuỗi if/else.","Thiết kế được retry logic có giới hạn số lần thử khi gửi thất bại."],"sections":[{"id":"day15-sec-brief","title":"Đề bài Assignment 5","blocks":[{"id":"day15-blk-1","type":"deliverable","text":"- Assignment 5: Multi-module Notification Service\n  - Interface `NotificationService` → EmailSender, SmsSender, PushSender\n  - @Qualifier or @Profile select implementation \n  - @ConfigurationProperties for each config (SMTP, Twilio, Firebase)\n  - Retry logic when send fail\n  - The Factory pattern creates the correct sender based on the notification type.","citations":[]}]},{"id":"day15-sec-configprops","title":"@ConfigurationProperties cho từng cấu hình","blocks":[{"id":"day15-blk-2","type":"paragraph","text":"Đánh dấu một lớp @ConfigurationProperties(prefix = \"...\") để Spring tự gán mỗi property có tiền tố tương ứng vào các field/tham số cùng tên nhờ chuẩn Java bean setter (hoặc constructor binding với record). @ConfigurationProperties hỗ trợ property lồng nhau dưới dạng List, Map và đối tượng lồng, giúp gom nhóm cấu hình SMTP/Twilio/Firebase thành các lớp riêng biệt thay vì đọc từng property lẻ bằng @Value.","citations":["day15-src-1","day15-src-2"]},{"id":"day15-blk-3","type":"code","language":"java","code":"import jakarta.validation.constraints.Min;\nimport jakarta.validation.constraints.NotBlank;\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\n@ConfigurationProperties(prefix = \"notification.smtp\")\nrecord SmtpProperties(\n        @NotBlank String host,\n        @Min(1) int port,\n        @NotBlank String username,\n        @NotBlank String password) {\n}\n","compile":false,"citations":["day15-src-1","day15-src-4"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day15-blk-4","type":"important","text":"Nên dùng constructor binding (một Java record với một constructor duy nhất có thể dùng trực tiếp làm @ConfigurationProperties từ Spring Boot 2.6 trở lên, không cần thêm @ConstructorBinding) để tạo lớp cấu hình bất biến (final field, không setter) cho SmtpProperties/TwilioProperties/FirebaseProperties. Có thể gắn thêm constraint như @NotBlank, @Min/@Max ngay trên field/tham số; nếu validate thất bại, ứng dụng sẽ không khởi động được và ném IllegalStateException.","citations":["day15-src-3","day15-src-4","day15-src-7"]},{"id":"day15-blk-5","type":"note","text":"Spring Boot chấp nhận nhiều biến thể tên property khi bind: kebab-case (smtp.user-name), camelCase (smtp.userName), underscore (smtp.user_name) trong file properties/YAML, và UPPER_CASE với dấu gạch dưới khi đọc từ biến môi trường hệ thống (relaxed binding) — hữu ích khi cấu hình Twilio/Firebase từ biến môi trường trong container.","citations":["day15-src-6"]}]},{"id":"day15-sec-qualifier-profile","title":"@Qualifier / @Profile để chọn implementation","blocks":[{"id":"day15-blk-6","type":"paragraph","text":"Với 3 implementation cùng interface NotificationService (EmailSender, SmsSender, PushSender), Spring cần biết chọn bean nào khi tiêm: DI là một dạng chuyên biệt của IoC, trong đó container tiêm dependency qua constructor argument dựa trên cấu hình metadata (như tên bean khai báo trong @Component/@Qualifier).","citations":["day15-src-8"]},{"id":"day15-blk-7","type":"code","language":"java","code":"interface NotificationService {\n    void send(String recipient, String message);\n}\n\nimport org.springframework.beans.factory.annotation.Qualifier;\nimport org.springframework.stereotype.Component;\n\n@Component(\"emailSender\")\nclass EmailSender implements NotificationService {\n    @Override\n    public void send(String recipient, String message) {\n        System.out.println(\"[email] to=\" + recipient + \" msg=\" + message);\n    }\n}\n\n@Component(\"smsSender\")\nclass SmsSender implements NotificationService {\n    @Override\n    public void send(String recipient, String message) {\n        System.out.println(\"[sms] to=\" + recipient + \" msg=\" + message);\n    }\n}\n\nclass NotificationClient {\n\n    private final NotificationService emailSender;\n\n    // @Qualifier chọn đúng bean khi có nhiều implementation của cùng một\n    // interface — Spring resolve theo type trước (như học ở Day 14), rồi\n    // dùng tên @Qualifier để phân biệt giữa các ứng viên cùng type.\n    NotificationClient(@Qualifier(\"emailSender\") NotificationService emailSender) {\n        this.emailSender = emailSender;\n    }\n}\n","compile":false,"citations":["day15-src-8"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day15-blk-8","type":"note","text":"Ngoài @Qualifier (chọn theo tên bean tường minh), có thể dùng @Profile(\"twilio\")/@Profile(\"firebase\") trên từng implementation để Spring chỉ đăng ký bean tương ứng khi profile đó đang active — hữu ích khi muốn đổi nhà cung cấp SMS/Push theo môi trường (dev dùng fake sender, prod dùng Twilio/Firebase thật) mà không sửa code gọi.","citations":[]}]},{"id":"day15-sec-factory","title":"Factory Pattern chọn sender theo NotificationType","blocks":[{"id":"day15-blk-9","type":"code","language":"java","code":"enum NotificationType { EMAIL, SMS, PUSH }\n\nimport java.util.Map;\nimport org.springframework.stereotype.Component;\n\n@Component\nclass NotificationSenderFactory {\n\n    private final Map\u003cNotificationType, NotificationService\u003e senders;\n\n    // Spring tiêm toàn bộ các bean NotificationService vào Map, key là\n    // tên bean; Factory tự ánh xạ tên bean sang NotificationType để chọn\n    // đúng sender mà không cần chuỗi if/else theo type.\n    NotificationSenderFactory(Map\u003cString, NotificationService\u003e beansByName) {\n        this.senders = Map.of(\n                NotificationType.EMAIL, beansByName.get(\"emailSender\"),\n                NotificationType.SMS, beansByName.get(\"smsSender\"));\n    }\n\n    NotificationService senderFor(NotificationType type) {\n        NotificationService sender = senders.get(type);\n        if (sender == null) {\n            throw new IllegalArgumentException(\"Không có sender cho: \" + type);\n        }\n        return sender;\n    }\n}\n","compile":false,"citations":["day15-src-8"],"partialReason":"Minh họa cách dùng Spring/Jakarta API; không biên dịch độc lập được vì môi trường javac --release 17 của pipeline này không có Spring Framework/Jakarta jar trên classpath (chỉ có JDK chuẩn)."},{"id":"day15-blk-10","type":"note","text":"Factory nhận Map\u003cString, NotificationService\u003e (Spring tự tiêm toàn bộ bean cùng interface vào Map, key là tên bean) rồi tự ánh xạ sang NotificationType, tránh chuỗi if/else liên tiếp và dễ mở rộng khi thêm loại thông báo mới.","citations":[]}]},{"id":"day15-sec-retry","title":"Retry logic khi gửi thất bại","blocks":[{"id":"day15-blk-11","type":"note","text":"Yêu cầu retry logic khi send thất bại không có resource nào trong resourceIds của Day 15 mô tả chi tiết (xem authoring.limitations). Cách làm phổ biến: bọc lỗi gửi trong vòng lặp thử lại tối đa N lần với backoff (ví dụ delay tăng dần giữa các lần thử), hoặc dùng @Retryable của Spring Retry (thư viện riêng, không nằm trong resourceIds đã đọc) nếu được phép thêm dependency; nếu vượt quá số lần thử, ghi log/ném exception nghiệp vụ để tầng gửi thất bại ở cấp cao hơn xử lý.","citations":[]}]}],"commonMistakes":["Đặt property SMTP/Twilio/Firebase rải rác bằng nhiều @Value thay vì gom vào lớp @ConfigurationProperties riêng cho từng nhà cung cấp.","Quên validate property cấu hình (ví dụ accountSid rỗng) khiến lỗi chỉ xuất hiện lúc gọi API thay vì lúc khởi động ứng dụng.","Retry vô hạn lần không có giới hạn, khiến request treo khi nhà cung cấp thông báo thất bại liên tục."],"practices":[{"id":"day15-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Từ Spring Boot 2.6, cách nào được dùng trực tiếp làm lớp @ConfigurationProperties bất biến mà không cần thêm @ConstructorBinding?","choices":[{"id":"day15-prac-1-a","text":"Một Java record với một constructor duy nhất"},{"id":"day15-prac-1-b","text":"Một interface với default method"},{"id":"day15-prac-1-c","text":"Một enum với field tĩnh"},{"id":"day15-prac-1-d","text":"Một lớp abstract với constructor protected"}],"correctChoiceIds":["day15-prac-1-a"],"hint":"Đọc lại phần Constructor binding và Java record trong bài.","solution":"day15-prac-1-a","explanation":"Tài liệu xác nhận từ Spring Boot 2.6, một Java record với một constructor duy nhất có thể dùng trực tiếp làm @ConfigurationProperties mà không cần thêm @ConstructorBinding, tạo ra lớp cấu hình bất biến.","rubric":"Chọn đúng 'Java record' thay vì các kiểu không hỗ trợ constructor binding tự động.","sourceUsage":["day15-src-4","day15-src-7"]},{"id":"day15-prac-2","type":"coding","interaction":"self-check","prompt":"Viết một record TwilioProperties với @ConfigurationProperties(prefix = \"notification.twilio\") gồm accountSid, authToken, fromNumber, mỗi field bắt buộc không được rỗng.","choices":[],"correctChoiceIds":[],"hint":"Áp dụng lại mẫu SmtpProperties trong bài, đổi field và prefix.","solution":"@ConfigurationProperties(prefix = \"notification.twilio\")\nrecord TwilioProperties(\n        @NotBlank String accountSid,\n        @NotBlank String authToken,\n        @NotBlank String fromNumber) {\n}","explanation":"Dùng đúng prefix theo yêu cầu và @NotBlank cho cả 3 field.","rubric":"Đánh giá đúng: là record, có @ConfigurationProperties với prefix chính xác, cả 3 field đều @NotBlank.","sourceUsage":["day15-src-1","day15-src-3"]},{"id":"day15-prac-3","type":"concept","interaction":"self-check","prompt":"Nếu muốn môi trường dev dùng một FakePushSender (không gọi Firebase thật) còn môi trường prod dùng FirebasePushSender thật, nên dùng cơ chế nào của Spring và vì sao?","choices":[],"correctChoiceIds":[],"hint":"Nghĩ về annotation gắn bean với một môi trường cụ thể.","solution":"Nên dùng @Profile: gắn @Profile(\"dev\") cho FakePushSender và @Profile(\"prod\") cho FirebasePushSender — Spring chỉ đăng ký bean tương ứng với profile đang active, tránh phải sửa code gọi hay dùng if/else theo môi trường.","explanation":"Liên kết với nội dung @Profile chọn implementation đã học trong bài.","rubric":"Đánh giá học viên nêu đúng @Profile và giải thích được lợi ích (không sửa code gọi, tách theo môi trường).","sourceUsage":[]},{"id":"day15-prac-4","type":"concept","interaction":"self-check","prompt":"Trong hàm khởi tạo của NotificationSenderFactory, vì sao Factory nhận Map\u003cString, NotificationService\u003e thay vì từng sender riêng lẻ qua từng tham số constructor?","choices":[],"correctChoiceIds":[],"hint":"Xem lại code NotificationSenderFactory trong bài.","solution":"Vì Spring tự động tiêm toàn bộ bean cùng interface NotificationService vào một Map với key là tên bean, giúp Factory không cần liệt kê từng tham số riêng cho từng loại sender và dễ dàng mở rộng khi thêm loại thông báo mới (chỉ cần thêm một bean @Component mới, không cần sửa constructor của Factory).","explanation":"Giải thích lợi ích mở rộng (extensibility) khi dùng Map thay vì tham số riêng lẻ.","rubric":"Đánh giá học viên nêu đúng cơ chế tiêm Map và lợi ích mở rộng.","sourceUsage":[]}],"syllabusAssignments":[{"row":27,"text":"- Assignment 5: Multi-module Notification Service\n  - Interface `NotificationService` → EmailSender, SmsSender, PushSender\n  - @Qualifier or @Profile select implementation \n  - @ConfigurationProperties for each config (SMTP, Twilio, Firebase)\n  - Retry logic when send fail\n  - The Factory pattern creates the correct sender based on the notification type."}],"enhancedExercises":["Thêm một NotificationType mới (ví dụ SLACK) và một implementation tương ứng mà không sửa NotificationSenderFactory ngoài phần khởi tạo Map.","Viết test kiểm tra @ConfigurationProperties validate thất bại (accountSid rỗng) khiến context khởi động thất bại."],"references":[{"id":"day15-ref-1","type":"external","resourceId":"res-7bf1b25b2e6b","citationId":"day15-src-1","url":"https://www.baeldung.com/configuration-properties-in-spring-boot","label":"@ConfigurationProperties","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to @ConfigurationProperties in Spring Boot | Baeldung","limitation":null},{"id":"day15-ref-2","type":"external","resourceId":"res-aee8bfb64b8c","citationId":"day15-src-5","url":"https://docs.spring.io/spring-boot/reference/features/external-config.html","label":"External Config","checkStatus":"ok","readStatus":"read","pageTitle":"Externalized Configuration :: Spring Boot (docs.spring.io)","limitation":null},{"id":"day15-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":5,"unitTitle":"Spring Boot Core \u0026 IoC Container"},{"id":"day-16","unitId":"unit-06","group":"spring","kind":"theory","title":"Controller \u0026 Request/Response","summary":"Xây dựng REST controller với @RestController/@RequestMapping và các shortcut theo HTTP method; cú pháp URI pattern và @PathVariable; @RequestParam và params attribute; lỗi Ambiguous Mapping; ResponseEntity và các builder tĩnh; content negotiation qua consumes/produces; khi nào dùng @ResponseBody/@ResponseStatus thay vì ResponseEntity.","durationMinutes":150.0,"objectives":["LO6"],"prerequisites":["Đã học Day 13-15 (IoC, DI, @Configuration/@Bean, @ConfigurationProperties) — controller cũng là bean được Spring quản lý."],"outcomes":["Khai báo đúng mapping bằng @RequestMapping và các shortcut theo HTTP method.","Bắt và ràng buộc kiểu biến path/query bằng @PathVariable/@RequestParam, tránh lỗi Ambiguous Mapping.","Dùng ResponseEntity để kiểm soát status/headers/body của response.","Chọn đúng giữa ResponseEntity, @ResponseBody, @ResponseStatus theo từng tình huống."],"sections":[{"id":"day16-sec-brief","title":"Đề bài và phạm vi bài học","blocks":[{"id":"day16-blk-1","type":"deliverable","text":"Assignment","citations":[]},{"id":"day16-blk-2","type":"note","text":"Bài mở đầu Unit 6 (Spring MVC/REST): xây dựng controller với @RestController, khai báo mapping bằng @RequestMapping và các shortcut theo HTTP method, xử lý tham số từ path/query, dùng ResponseEntity để kiểm soát toàn bộ HTTP response, và content negotiation qua consumes/produces. Lịch học ngày nay ghi 'Assignment' nhưng không có đề bài chi tiết riêng — học viên ôn tập và thực hành lại ví dụ trong bài.","citations":[]}]},{"id":"day16-sec-mapping","title":"@RequestMapping và các shortcut","blocks":[{"id":"day16-blk-3","type":"paragraph","text":"@RequestMapping có thể đặt ở cấp class (mapping dùng chung, ví dụ prefix /api/products) hoặc method (endpoint cụ thể); các annotation rút gọn @GetMapping/@PostMapping/@PutMapping/@DeleteMapping/@PatchMapping được cung cấp vì phần lớn method nên gắn với một HTTP method cụ thể thay vì khớp mọi method như @RequestMapping mặc định. Nếu không chỉ định method, mapping sẽ khớp với mọi HTTP method gửi tới path đó.","citations":["day16-src-1","day16-src-5"]},{"id":"day16-blk-4","type":"table","columns":["Ký hiệu","Ý nghĩa"],"rows":[["?","Khớp đúng một ký tự bất kỳ trong một segment"],["*","Khớp không hoặc nhiều ký tự trong một segment"],["**","Khớp không hoặc nhiều segment"],["{name}","Bắt biến path segment, truy cập qua @PathVariable"],["{name:regex}","Bắt biến path segment theo biểu thức chính quy, ví dụ {id:[\\d]+} chỉ khớp giá trị số"]],"citations":["day16-src-2","day16-src-3","day16-src-5"]},{"id":"day16-blk-5","type":"code","language":"java","code":"import org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\n@RestController\n@RequestMapping(\"/api/products\")\nclass ProductController {\n\n    private final ProductRepository repository;\n\n    ProductController(ProductRepository repository) {\n        this.repository = repository;\n    }\n\n    // {id:[\\d]+} rang buoc bien path chi khop gia tri so.\n    @GetMapping(\"/{id:[\\\\d]+}\")\n    ResponseEntity\u003cProduct\u003e findById(@PathVariable long id) {\n        return repository.findById(id)\n                .map(ResponseEntity::ok)\n                .orElseGet(() -\u003e ResponseEntity.notFound().build());\n    }\n\n    @GetMapping(produces
