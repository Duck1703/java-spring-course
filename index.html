ult/package-private (chỉ cùng package).","rubric":"Chọn đúng đáp án A và giải thích được vì sao protected/private không áp dụng cho lớp top-level.","sourceUsage":["day04-src-6"]},{"id":"day04-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một class Java khác (ví dụ BankAccount với field private balance) áp dụng encapsulation: field private, một constructor xác thực giá trị khởi tạo hợp lệ (ví dụ balance không âm), và chỉ cung cấp getter (không cung cấp setter trực tiếp cho balance).","choices":[],"correctChoiceIds":[],"hint":"Xem lại ví dụ class Book ở phần Access modifier — field private, constructor gán giá trị, getter public trả về giá trị.","solution":"public class BankAccount {\n    private final double balance;\n\n    public BankAccount(double initialBalance) {\n        if (initialBalance \u003c 0) {\n            throw new IllegalArgumentException(\"balance khong duoc am\");\n        }\n        this.balance = initialBalance;\n    }\n\n    public double getBalance() {\n        return balance;\n    }\n}","explanation":"Lời giải mẫu khai báo field private, xác thực dữ liệu ngay trong constructor (ném lỗi nếu không hợp lệ), và chỉ cung cấp getter, không có setter trực tiếp — đúng tinh thần encapsulation.","rubric":"Đạt yêu cầu nếu field là private, constructor có xác thực dữ liệu đầu vào, và không có setter public cho phép gán trực tiếp giá trị không qua kiểm tra.","sourceUsage":["day04-src-5"]}],"syllabusAssignments":[{"row":9,"text":"Assignment"}],"enhancedExercises":["Viết lại class Book ở phần Constructor dưới dạng record (record Book(String title, String author, int totalPages) {}) và so sánh số dòng code cùng hành vi equals()/toString() sinh tự động.","Thêm một constructor chained thứ ba cho BankAccount (constructor không tham số, mặc định balance = 0) và kiểm tra vẫn giữ nguyên tính bất biến."],"references":[{"id":"day04-ref-1","type":"external","resourceId":"res-ae202f300a2b","citationId":"day04-src-1","url":"https://docs.oracle.com/javase/tutorial/java/javaOO/index.html","label":"OOP Concepts","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Classes and Objects (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day04-ref-2","type":"external","resourceId":"res-4f42c781654a","citationId":"day04-src-4","url":"https://www.baeldung.com/java-constructors","label":"Constructors","checkStatus":"ok","readStatus":"read","pageTitle":"A Guide to Constructors in Java | Baeldung","limitation":null},{"id":"day04-ref-3","type":"external","resourceId":"res-563d80135c91","citationId":"day04-src-5","url":"https://www.baeldung.com/java-access-modifiers","label":"Access Modifiers","checkStatus":"ok","readStatus":"read","pageTitle":"Access Modifiers in Java | Baeldung","limitation":null},{"id":"day04-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-05","unitId":"unit-02","group":"java","kind":"theory","title":"Inheritance, Polymorphism \u0026 Abstract","summary":"Bài học về kế thừa lớp bằng extends, this/super khi trùng tên thành viên, phân biệt method overloading (tĩnh) và overriding (động), upcast/downcast an toàn với instanceof, và thiết kế abstract class.","durationMinutes":150.0,"objectives":["LO2"],"prerequisites":["Đã hoàn thành Day 4 (class, object, constructor, access modifier, encapsulation)."],"outcomes":["Viết đúng cú pháp kế thừa lớp bằng extends và gọi constructor lớp cha bằng super(...).","Dùng đúng this/super để phân biệt thành viên bị che (hidden member) giữa lớp con và lớp cha.","Phân biệt method overloading (compile-time) và method overriding (runtime), giải thích được polymorphism tĩnh và động.","Downcast an toàn bằng instanceof, tránh ClassCastException.","Thiết kế được một abstract class với abstract method và code dùng chung."],"sections":[{"id":"day05-sec-inheritance","title":"Kế thừa (Inheritance) với extends","blocks":[{"id":"day05-blk-1","type":"paragraph","text":"Một lớp kế thừa lớp khác bằng từ khóa extends và có thể bổ sung field/method mới bên cạnh những gì thừa hưởng từ lớp cha. Java chỉ hỗ trợ đơn kế thừa với lớp (mỗi lớp chỉ extends được đúng một lớp cha), khác với một số ngôn ngữ cho phép đa kế thừa lớp.","citations":["day05-src-1"]},{"id":"day05-blk-2","type":"paragraph","text":"Lớp con kế thừa các thành viên non-static protected và public của lớp cha; thành viên private và static không được kế thừa (static member vẫn truy cập được qua tên lớp cha, nhưng không phải theo cơ chế kế thừa instance).","citations":["day05-src-2"]},{"id":"day05-blk-3","type":"important","text":"Một lớp chỉ kế thừa được một lớp cha (extends) nhưng có thể implement nhiều interface cùng lúc. Nếu hai interface có default method trùng chữ ký, lớp implement bắt buộc phải tự override lại phương thức đó để giải quyết xung đột — trình biên dịch không tự chọn thay.","citations":["day05-src-3"]},{"id":"day05-blk-4","type":"code","language":"java","code":"class Animal {\n    protected String name;\n\n    public Animal(String name) {\n        this.name = name;\n    }\n\n    public String makeSound() {\n        return name + \" makes a generic sound\";\n    }\n}\n\nclass Dog extends Animal {\n    public Dog(String name) {\n        super(name); // gọi constructor của Animal\n    }\n\n    @Override\n    public String makeSound() {\n        return name + \" barks\"; // truy cập field kế thừa từ Animal\n    }\n}\n","compile":true,"citations":["day05-src-1","day05-src-2"]}]},{"id":"day05-sec-this-super","title":"this và super khi trùng tên thành viên","blocks":[{"id":"day05-blk-5","type":"paragraph","text":"Khi lớp con và lớp cha khai báo biến hoặc phương thức cùng tên (hidden instance member), dùng super.tenThanhVien để truy cập tường minh thành viên của lớp cha, và this.tenThanhVien để truy cập thành viên của lớp con hiện tại — tránh nhầm lẫn giá trị nào đang được dùng.","citations":["day05-src-4"]},{"id":"day05-blk-6","type":"code","language":"java","code":"class Base {\n    protected int level = 1;\n}\n\nclass Advanced extends Base {\n    protected int level = 2; // che field 'level' của Base\n\n    public void printLevels() {\n        System.out.println(\"this.level = \" + this.level);   // 2\n        System.out.println(\"super.level = \" + super.level); // 1\n    }\n}\n","compile":true,"citations":["day05-src-4"]}]},{"id":"day05-sec-polymorphism","title":"Method Overriding, Overloading và Polymorphism","blocks":[{"id":"day05-blk-7","type":"paragraph","text":"Polymorphism (đa hình) trong Java chia làm hai loại: polymorphism tĩnh (static, còn gọi là compile-time) được giải quyết ngay lúc biên dịch — ví dụ method overloading (nhiều method cùng tên khác danh sách tham số); và polymorphism động (dynamic, runtime) được JVM giải quyết khi gọi một phương thức đã được override trên subclass, tùy vào kiểu thực sự của đối tượng lúc chạy.","citations":["day05-src-5"]},{"id":"day05-blk-8","type":"paragraph","text":"Ví dụ điển hình của polymorphism động: nếu một subclass override lại một phương thức của lớp cha rồi được gán cho một biến khai báo kiểu lớp cha, JVM vẫn gọi đúng phiên bản đã override của subclass lúc runtime, nhờ JVM giữ tham chiếu tới kiểu thực sự của đối tượng chứ không dựa vào kiểu khai báo của biến.","citations":["day05-src-6"]},{"id":"day05-blk-9","type":"code","language":"java","code":"class Shape {\n    public double area() {\n        return 0;\n    }\n\n    // method overloading: cung ten describe, khac danh sach tham so\n    public String describe() {\n        return \"Shape with area \" + area();\n    }\n\n    public String describe(String prefix) {\n        return prefix + \": \" + describe();\n    }\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    public Circle(double radius) {\n        this.radius = radius;\n    }\n\n    @Override // method overriding: cùng chữ ký với Shape.area()\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass PolymorphismDemo {\n    public static void main(String[] args) {\n        Shape shape = new Circle(2.0); // bien khai bao kieu Shape\n        System.out.println(shape.describe()); // goi Circle.area() luc runtime\n    }\n}\n","compile":true,"citations":["day05-src-5","day05-src-6"]}]},{"id":"day05-sec-downcast","title":"Upcast, downcast và ClassCastException","blocks":[{"id":"day05-blk-10","type":"warning","text":"Ép kiểu từ lớp cha xuống lớp con (downcast) khi đối tượng thực sự không phải kiểu đó sẽ ném ClassCastException lúc runtime — nên luôn dùng instanceof (hoặc pattern matching instanceof đã học ở Day 2) để kiểm tra trước khi ép kiểu, thay vì ép kiểu 'liều'.","citations":["day05-src-7"]},{"id":"day05-blk-11","type":"code","language":"java","code":"class Shape {\n    public double area() {\n        return 0;\n    }\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    public Circle(double radius) {\n        this.radius = radius;\n    }\n\n    @Override\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass DowncastDemo {\n    public static void main(String[] args) {\n        Shape shape = new Circle(1.5);\n\n        if (shape instanceof Circle circle) { // downcast an toan\n            System.out.println(\"radius-based area: \" + circle.area());\n        } else {\n            System.out.println(\"Khong phai Circle, bo qua downcast\");\n        }\n    }\n}\n","compile":true,"citations":["day05-src-7"]}]},{"id":"day05-sec-abstract","title":"Abstract class","blocks":[{"id":"day05-blk-12","type":"paragraph","text":"Một lớp được khai báo abstract bằng từ khóa abstract; lớp abstract không thể khởi tạo trực tiếp bằng new nhưng có thể được kế thừa để các lớp con cụ thể hóa.","citations":["day05-src-8"]},{"id":"day05-blk-13","type":"important","text":"Nếu một lớp khai báo ít nhất một abstract method (method không có thân, chỉ có chữ ký), bản thân lớp đó cũng bắt buộc phải là abstract. Lớp con phải cài đặt (override) toàn bộ abstract method kế thừa được, hoặc chính lớp con đó cũng phải khai báo abstract.","citations":["day05-src-9"]},{"id":"day05-blk-14","type":"paragraph","text":"Nên dùng abstract class khi muốn dùng chung code (field, method đã cài đặt sẵn) giữa các lớp con có quan hệ họ hàng gần, đồng thời định nghĩa một phần API bắt buộc lớp con phải tự cài đặt — tận dụng cả kế thừa lẫn đa hình trong cùng một thiết kế.","citations":["day05-src-10"]},{"id":"day05-blk-15","type":"code","language":"java","code":"abstract class Vehicle {\n    protected final String plateNumber;\n\n    protected Vehicle(String plateNumber) {\n        this.plateNumber = plateNumber;\n    }\n\n    public abstract double calculateTollFee(); // bat buoc lop con cai dat\n\n    public String getPlateNumber() { // code dùng chung, không cần override\n        return plateNumber;\n    }\n}\n\nclass Motorbike extends Vehicle {\n    public Motorbike(String plateNumber) {\n        super(plateNumber);\n    }\n\n    @Override\n    public double calculateTollFee() {\n        return 5000.0;\n    }\n}\n","compile":true,"citations":["day05-src-8","day05-src-9"]}]}],"commonMistakes":["Ép kiểu downcast trực tiếp mà không kiểm tra instanceof trước, gây ClassCastException khi đối tượng thực sự không phải kiểu đích.","Nhầm lẫn method overloading với method overriding — ví dụ tưởng đổi kiểu trả về hoặc chỉ đổi tên tham số (không đổi kiểu/số lượng) là overloading hợp lệ.","Quên rằng field bị 'che' (hidden) theo kiểu khai báo của biến (không có polymorphism động cho field như với method), dẫn tới đọc nhầm giá trị khi dùng biến kiểu lớp cha để truy cập field."],"practices":[{"id":"day05-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Nếu một class khai báo ít nhất một abstract method, điều gì bắt buộc phải đúng?","choices":[{"id":"day05-prac-1-a","text":"Class đó cũng phải được khai báo abstract"},{"id":"day05-prac-1-b","text":"Class đó có thể khởi tạo trực tiếp bằng new nếu cần"},{"id":"day05-prac-1-c","text":"Chỉ lớp con mới cần abstract, lớp khai báo method thì không"},{"id":"day05-prac-1-d","text":"Method đó phải có thân (body) rỗng {}"}],"correctChoiceIds":["day05-prac-1-a"],"hint":"Nhớ ràng buộc song song giữa abstract method và abstract class.","solution":"Class đó cũng phải được khai báo abstract.","explanation":"Java bắt buộc: nếu một class có ít nhất một abstract method (method chỉ có chữ ký, không thân), bản thân class đó phải abstract, vì việc khởi tạo một đối tượng thiếu cài đặt cho một method là không hợp lệ. Vì vậy class đó không thể khởi tạo trực tiếp (đáp án B sai), quy tắc áp dụng cho chính class khai báo method chứ không chỉ lớp con (đáp án C sai), và abstract method không có thân {} chứ không phải thân rỗng (đáp án D sai — abstract method kết thúc bằng dấu chấm phẩy, không có cặp ngoặc nhọn nào).","rubric":"Chọn đúng đáp án A và giải thích được vì sao ba lựa chọn còn lại sai.","sourceUsage":["day05-src-9"]},{"id":"day05-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Cho hai class:\nclass Base { int level = 1; }\nclass Advanced extends Base { int level = 2;\n    void print() {\n        System.out.println(this.level + \",\" + super.level);\n    }\n}\nGọi new Advanced().print() in ra gì?","choices":[{"id":"day05-prac-2-a","text":"1,1"},{"id":"day05-prac-2-b","text":"2,2"},{"id":"day05-prac-2-c","text":"2,1"},{"id":"day05-prac-2-d","text":"1,2"}],"correctChoiceIds":["day05-prac-2-c"],"hint":"this luôn trỏ tới thành viên của chính lớp con hiện tại, super luôn trỏ tới thành viên của lớp cha bị che.","solution":"2,1 — this.level lấy field level = 2 của Advanced, super.level lấy field level = 1 của Base.","explanation":"Advanced khai báo field level riêng (che field level của Base, đây là field hiding chứ không phải override vì field không có tính đa hình runtime như method). this.level luôn truy cập field của chính đối tượng hiện tại (Advanced) nên là 2. super.level tường minh yêu cầu lấy field level của lớp cha Base, cho ra 1. Kết quả in ra là 2,1.","rubric":"Chọn đúng 2,1 và giải thích được this/super trỏ tới field của đúng lớp nào.","sourceUsage":["day05-src-4"]},{"id":"day05-prac-3","type":"concept","interaction":"self-check","prompt":"Giải thích ngắn gọn sự khác nhau giữa method overloading và method overriding, mỗi loại được giải quyết ở giai đoạn nào (compile-time hay runtime)?","choices":[],"correctChoiceIds":[],"hint":"Overloading liên quan tới nhiều method cùng tên khác tham số; overriding liên quan tới lớp con định nghĩa lại method của lớp cha.","solution":"Overloading: nhiều method cùng tên nhưng khác danh sách tham số trong cùng một class, được giải quyết lúc biên dịch (compile-time/polymorphism tĩnh) dựa trên kiểu tham số truyền vào. Overriding: lớp con định nghĩa lại đúng chữ ký một method đã có ở lớp cha, được giải quyết lúc chạy (runtime/polymorphism động) dựa trên kiểu thực sự của đối tượng.","explanation":"Câu trả lời tốt cần nêu đúng: overloading = compile-time, khác tham số, cùng class; overriding = runtime, cùng chữ ký, quan hệ lớp cha-con.","rubric":"Đạt yêu cầu nếu phân biệt đúng cả giai đoạn giải quyết (compile-time vs runtime) lẫn điều kiện áp dụng (khác tham số vs cùng chữ ký).","sourceUsage":["day05-src-5","day05-src-6"]},{"id":"day05-prac-4","type":"coding","interaction":"self-check","prompt":"Thiết kế một abstract class Employee với abstract method calculateBonus(), và một class con cụ thể override phương thức đó. Viết đoạn code minh họa việc gọi calculateBonus() qua một biến khai báo kiểu Employee (upcast) để thể hiện đúng polymorphism động.","choices":[],"correctChoiceIds":[],"hint":"Xem lại ví dụ Vehicle/Motorbike ở phần Abstract class — abstract method bắt buộc lớp con cài đặt, biến khai báo kiểu lớp cha nhưng gọi đúng phiên bản lớp con lúc runtime.","solution":"public abstract class Employee {\n    public abstract double calculateBonus();\n}\n\npublic class SalesEmployee extends Employee {\n    @Override\n    public double calculateBonus() {\n        return 1000.0;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Employee e = new SalesEmployee(); // upcast\n        System.out.println(e.calculateBonus()); // gọi đúng SalesEmployee lúc runtime\n    }\n}","explanation":"Lời giải mẫu định nghĩa đúng abstract method không thân trong Employee, class con override đầy đủ, và minh họa upcast (biến kiểu Employee nhưng gọi đúng phiên bản đã override lúc runtime).","rubric":"Đạt yêu cầu nếu abstract class có abstract method hợp lệ, class con override đúng, và đoạn main thể hiện đúng polymorphism động qua biến khai báo kiểu lớp cha.","sourceUsage":["day05-src-8","day05-src-9","day05-src-6"]}],"syllabusAssignments":[],"enhancedExercises":["Thêm một lớp con thứ hai cho Vehicle (ví dụ Car) với công thức tính toll fee khác, rồi viết một List\u003cVehicle\u003e chứa cả Motorbike và Car để quan sát polymorphism động khi lặp qua danh sách.","Thử bỏ từ khóa abstract khỏi calculateTollFee() trong Vehicle và quan sát lỗi biên dịch xảy ra, để hiểu rõ hơn ràng buộc giữa abstract class và abstract method."],"references":[{"id":"day05-ref-1","type":"external","resourceId":"res-aad15fef0599","citationId":"day05-src-1","url":"https://www.baeldung.com/java-inheritance","label":"Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Inheritance in Java | Baeldung","limitation":null},{"id":"day05-ref-2","type":"external","resourceId":"res-36a8d5deef22","citationId":"day05-src-5","url":"https://www.baeldung.com/java-polymorphism","label":"Polymorphism","checkStatus":"ok","readStatus":"read","pageTitle":"Polymorphism in Java | Baeldung","limitation":null},{"id":"day05-ref-3","type":"external","resourceId":"res-b5dd43254a15","citationId":"day05-src-8","url":"https://www.baeldung.com/java-abstract-class","label":"Abstract Class","checkStatus":"ok","readStatus":"read","pageTitle":"Abstract Classes in Java | Baeldung","limitation":null},{"id":"day05-ref-4","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-06","unitId":"unit-02","group":"java","kind":"project","title":"- Assignment 2: Employee Management System","summary":"Assignment 2: xây dựng hệ thống quản lý lương nhân viên (Employee/Developer/Manager/PayrollService/EmployeeDTO) áp dụng abstract class, kế thừa, polymorphism và record — tổng hợp toàn bộ kiến thức Day 4-5.","durationMinutes":150.0,"objectives":["LO2"],"prerequisites":["Đã hoàn thành Day 4 (class, constructor, encapsulation) và Day 5 (kế thừa, polymorphism, abstract class)."],"outcomes":["Thiết kế đúng một abstract base class với abstract method và các subclass override đầy đủ.","Dùng polymorphism động để xử lý một danh sách đối tượng đa hình mà không cần if-else theo loại cụ thể.","Khai báo và sử dụng đúng record cho một DTO bất biến.","Viết unit test xác nhận đúng hành vi của từng subclass và của tầng service dùng polymorphism."],"sections":[{"id":"day06-sec-brief","title":"Đề bài: Employee Management System","blocks":[{"id":"day06-blk-1","type":"deliverable","text":"- Assignment 2: Employee Management System\n  - Base `Employee` abstract (id, name, baseSalary) + method `calculateSalary()` abstract\n  - Subclass: `Developer` (overtimeHours, bonusRate), `Manager` (teamSize, kpiMultiplier)\n  - `PayrollService` calculates total salary using polymorphism\n  - Uses a Record for `EmployeeDTO`\n  - Unit tests verify the correctness of each salary type","citations":[]},{"id":"day06-blk-2","type":"note","text":"Assignment này tổng hợp trực tiếp các khái niệm đã học ở Day 4 (class, constructor, encapsulation) và Day 5 (kế thừa, polymorphism, abstract class). Đọc lại hai bài đó trước khi bắt đầu nếu chưa nắm chắc extends/abstract/override.","citations":[]}]},{"id":"day06-sec-decomposition","title":"Phân rã thiết kế (guided decomposition)","blocks":[{"id":"day06-blk-3","type":"paragraph","text":"Hệ thống gồm 5 kiểu: Employee (abstract), Developer và Manager (kế thừa Employee), PayrollService (dùng polymorphism để tính lương hàng loạt), và EmployeeDTO (record dùng để trả dữ liệu ra ngoài tầng service). Việc tách abstract base class + hai subclass cụ thể phản ánh đúng cấu trúc class/object đã học: field chung nằm ở lớp cha, hành vi khác biệt nằm ở lớp con.","citations":["day06-src-1"]},{"id":"day06-blk-4","type":"important","text":"Employee phải là abstract class với abstract method calculateSalary() không có thân — vì lớp khai báo ít nhất một abstract method thì bản thân lớp đó bắt buộc phải abstract. Developer và Manager bắt buộc phải override đầy đủ calculateSalary(), nếu không bản thân chúng cũng phải là abstract.","citations":["day06-src-7","day06-src-8"]},{"id":"day06-blk-5","type":"paragraph","text":"Developer và Manager kế thừa Employee bằng extends (Java chỉ hỗ trợ đơn kế thừa lớp), thừa hưởng các field protected của Employee (id, name, baseSalary) và chỉ cần khai báo thêm field riêng (overtimeHours/bonusRate cho Developer, teamSize/kpiMultiplier cho Manager). Constructor của lớp con gọi super(id, name, baseSalary) để khởi tạo phần dữ liệu chung ở lớp cha.","citations":["day06-src-2","day06-src-3","day06-src-4"]},{"id":"day06-blk-6","type":"paragraph","text":"PayrollService không cần biết cụ thể từng nhân viên là Developer hay Manager: chỉ cần lặp qua một List\u003cEmployee\u003e và gọi employee.calculateSalary(), JVM sẽ tự gọi đúng phiên bản đã override của từng đối tượng lúc runtime — đây chính là polymorphism động, lý do abstract class + override được chọn thay vì if-else kiểm tra loại nhân viên.","citations":["day06-src-5","day06-src-6"]},{"id":"day06-blk-7","type":"note","text":"EmployeeDTO nên khai báo dưới dạng record (cú pháp Java 17: record EmployeeDTO(String id, String name, double totalSalary) {}) — record tự sinh constructor, getter dạng id()/name()/totalSalary(), equals()/hashCode()/toString(), phù hợp cho một đối tượng bất biến chỉ mang dữ liệu ra khỏi PayrollService, không cần logic nghiệp vụ riêng.","citations":[]}]},{"id":"day06-sec-implementation","title":"Cài đặt tham khảo","blocks":[{"id":"day06-blk-8","type":"code","language":"java","code":"import java.util.List;\n\nabstract class Employee {\n    protected final String id;\n    protected final String name;\n    protected final double baseSalary;\n\n    protected Employee(String id, String name, double baseSalary) {\n        this.id = id;\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    public abstract double calculateSalary();\n\n    public String getId() {\n        return id;\n    }\n\n    public String getName() {\n        return name;\n    }\n}\n\nclass Developer extends Employee {\n    private final double overtimeHours;\n    private final double bonusRate;\n\n    public Developer(String id, String name, double baseSalary,\n                      double overtimeHours, double bonusRate) {\n        super(id, name, baseSalary);\n        this.overtimeHours = overtimeHours;\n        this.bonusRate = bonusRate;\n    }\n\n    @Override\n    public double calculateSalary() {\n        return baseSalary + (overtimeHours * bonusRate);\n    }\n}\n\nclass Manager extends Employee {\n    private final int teamSize;\n    private final double kpiMultiplier;\n\n    public Manager(String id, String name, double baseSalary,\n                    int teamSize, double kpiMultiplier) {\n        super(id, name, baseSalary);\n        this.teamSize = teamSize;\n        this.kpiMultiplier = kpiMultiplier;\n    }\n\n    @Override\n    public double calculateSalary() {\n        return (baseSalary + teamSize * 200.0) * kpiMultiplier;\n    }\n}\n\nrecord EmployeeDTO(String id, String name, double totalSalary) {\n}\n\nclass PayrollService {\n    public List\u003cEmployeeDTO\u003e runPayroll(List\u003cEmployee\u003e employees) {\n        return employees.stream()\n                .map(e -\u003e new EmployeeDTO(e.getId(), e.getName(), e.calculateSalary()))\n                .toList();\n    }\n}\n","compile":true,"citations":["day06-src-7","day06-src-8","day06-src-6"]}]},{"id":"day06-sec-tests","title":"Test case gợi ý và rubric","blocks":[{"id":"day06-blk-9","type":"table","columns":["Test case","Loại nhân viên","Input","calculateSalary() mong đợi"],"rows":[["TC1","Developer","baseSalary=10,000,000; overtimeHours=10; bonusRate=50,000","10,500,000"],["TC2","Manager","baseSalary=20,000,000; teamSize=5; kpiMultiplier=1.1","22,000,000"],["TC3","PayrollService.runPayroll","List gồm 1 Developer + 1 Manager (TC1+TC2)","List\u003cEmployeeDTO\u003e có 2 phần tử, đúng totalSalary từng người"]],"citations":["day06-src-5","day06-src-6"]},{"id":"day06-blk-10","type":"warning","text":"Viết unit test cho từng subclass riêng (DeveloperTest, ManagerTest) để cô lập công thức tính lương, và ít nhất một test cho PayrollService xác nhận polymorphism hoạt động đúng khi danh sách trộn lẫn nhiều loại Employee — không chỉ test với một loại duy nhất, vì lỗi override sai chữ ký sẽ không lộ ra nếu danh sách chỉ có một kiểu.","citations":["day06-src-6"]}]}],"commonMistakes":["Dùng if (employee instanceof Developer) ... else if (employee instanceof Manager) ... trong PayrollService thay vì để calculateSalary() tự đa hình — làm mất hết lợi ích của polymorphism và phải sửa PayrollService mỗi khi thêm loại nhân viên mới.","Quên khai báo Employee là abstract hoặc quên override đầy đủ calculateSalary() ở subclass, dẫn tới lỗi biên dịch.","Chỉ viết test cho từng subclass riêng lẻ mà không có test nào xác nhận PayrollService xử lý đúng danh sách trộn nhiều loại nhân viên."],"practices":[{"id":"day06-prac-1","type":"applied","interaction":"self-check","prompt":"Cài đặt đầy đủ Employee (abstract), Developer, Manager, PayrollService và EmployeeDTO (record) theo đúng đề bài, kèm ít nhất 3 unit test xác nhận calculateSalary() đúng cho từng loại nhân viên.","choices":[],"correctChoiceIds":[],"hint":"Bắt đầu từ Employee abstract với đúng 3 field yêu cầu (id, name, baseSalary) và abstract method calculateSalary(); dùng cài đặt tham khảo trong bài làm khung sườn, sau đó tự viết test.","solution":"Xem mục 'Cài đặt tham khảo' ở trên; công thức lương trong lời giải mẫu chỉ là ví dụ minh họa, có thể điều chỉnh miễn giữ đúng cấu trúc class/kế thừa/abstract method theo đề bài.","explanation":"Không có lời giải cố định — đánh giá theo mức độ đúng cấu trúc OOP.","rubric":"Đạt yêu cầu khi: Employee là abstract với abstract method đúng chữ ký; Developer/Manager override đầy đủ và kế thừa đúng field chung; EmployeeDTO là record; PayrollService dùng polymorphism (không if-else theo loại lớp); có test cho từng subclass và cho PayrollService.","sourceUsage":[]},{"id":"day06-prac-2","type":"concept","interaction":"multiple-choice","prompt":"Vì sao Employee bắt buộc phải là abstract class trong thiết kế này?","choices":[{"id":"day06-prac-2-a","text":"Vì nó khai báo ít nhất một abstract method (calculateSalary()) không có thân"},{"id":"day06-prac-2-b","text":"Vì abstract class chạy nhanh hơn class thường"},{"id":"day06-prac-2-c","text":"Vì Java bắt buộc mọi lớp cha phải là abstract"},{"id":"day06-prac-2-d","text":"Vì Employee không có field nào"}],"correctChoiceIds":["day06-prac-2-a"],"hint":"Nhớ lại ràng buộc song song giữa abstract method và abstract class đã học ở Day 5.","solution":"Vì nó khai báo ít nhất một abstract method (calculateSalary()) không có thân.","explanation":"Employee khai báo calculateSalary() chỉ với chữ ký, không có thân phương thức — theo quy tắc Java, một lớp có ít nhất một abstract method thì bản thân lớp đó bắt buộc phải khai báo abstract, nếu không trình biên dịch sẽ báo lỗi. Đây không liên quan tới hiệu năng (đáp án B sai), không phải mọi lớp cha đều phải abstract (đáp án C sai, chỉ khi có abstract method), và Employee vẫn có 3 field id/name/baseSalary (đáp án D sai).","rubric":"Chọn đúng đáp án A và giải thích được vì sao B, C, D sai.","sourceUsage":["day06-src-7","day06-src-8"]},{"id":"day06-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một unit test (JUnit-style, không cần chạy được, chỉ cần đúng cấu trúc) xác nhận PayrollService.runPayroll() trả về đúng totalSalary cho một danh sách trộn lẫn 1 Developer và 1 Manager.","choices":[],"correctChoiceIds":[],"hint":"Tạo danh sách List\u003cEmployee\u003e gồm cả hai loại, gọi runPayroll(), rồi so sánh từng EmployeeDTO.totalSalary() với giá trị tính tay.","solution":"@Test\nvoid runPayroll_mixedEmployees_returnsCorrectTotals() {\n    Employee dev = new Developer(\"E1\", \"An\", 10_000_000, 10, 50_000);\n    Employee mgr = new Manager(\"E2\", \"Binh\", 20_000_000, 5, 1.1);\n    PayrollService service = new PayrollService();\n\n    List\u003cEmployeeDTO\u003e result = service.runPayroll(List.of(dev, mgr));\n\n    assertEquals(2, result.size());\n    assertEquals(10_500_000.0, result.get(0).totalSalary());\n    assertEquals(22_000_000.0, result.get(1).totalSalary());\n}","explanation":"Lời giải mẫu tạo danh sách trộn hai loại Employee, gọi runPayroll() một lần, và assert đúng totalSalary cho từng phần tử — thể hiện đúng việc test polymorphism thay vì test từng subclass riêng lẻ.","rubric":"Đạt yêu cầu nếu test tạo được danh sách trộn ≥2 loại Employee, gọi đúng API PayrollService, và assert giá trị totalSalary khớp công thức đã cài đặt.","sourceUsage":["day06-src-6"]}],"syllabusAssignments":[{"row":12,"text":"- Assignment 2: Employee Management System\n  - Base `Employee` abstract (id, name, baseSalary) + method `calculateSalary()` abstract\n  - Subclass: `Developer` (overtimeHours, bonusRate), `Manager` (teamSize, kpiMultiplier)\n  - `PayrollService` calculates total salary using polymorphism\n  - Uses a Record for `EmployeeDTO`\n  - Unit tests verify the correctness of each salary type"}],"enhancedExercises":["Thêm một loại nhân viên thứ ba (ví dụ Intern với stipend cố định) chỉ bằng cách thêm một subclass mới của Employee, không sửa PayrollService — minh chứng lợi ích thực sự của polymorphism.","Thêm phương thức toString() có ý nghĩa cho EmployeeDTO (record đã tự sinh toString() mặc định, thử so sánh với việc override lại)."],"references":[{"id":"day06-ref-1","type":"external","resourceId":"res-ae202f300a2b","citationId":"day06-src-1","url":"https://docs.oracle.com/javase/tutorial/java/javaOO/index.html","label":"OOP Concepts","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Classes and Objects (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day06-ref-2","type":"external","resourceId":"res-aad15fef0599","citationId":"day06-src-2","url":"https://www.baeldung.com/java-inheritance","label":"Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Guide to Inheritance in Java | Baeldung","limitation":null},{"id":"day06-ref-3","type":"external","resourceId":"res-36a8d5deef22","citationId":"day06-src-5","url":"https://www.baeldung.com/java-polymorphism","label":"Polymorphism","checkStatus":"ok","readStatus":"read","pageTitle":"Polymorphism in Java | Baeldung","limitation":null},{"id":"day06-ref-4","type":"external","resourceId":"res-b5dd43254a15","citationId":"day06-src-7","url":"https://www.baeldung.com/java-abstract-class","label":"Abstract Class","checkStatus":"ok","readStatus":"read","pageTitle":"Abstract Classes in Java | Baeldung","limitation":null},{"id":"day06-ref-5","type":"internal","resourceId":null,"citationId":null}],"unitNumber":2,"unitTitle":"OOP in Java"},{"id":"day-07","unitId":"unit-03","group":"java","kind":"theory","title":"Interface, Inner Classes \u0026 Enums","summary":"Interface là 'hợp đồng' API cho phép đa-implement (khác abstract class chỉ đơn-extends); Inner Classes, Enums và SOLID Principles được giới thiệu ở mức chuẩn Java 17 để hoàn thiện nền tảng OOP trước khi học generics/collections/exception ở Day 8-9.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Đã hoàn thành Day 5 (extends, this/super, polymorphism, abstract class) và Day 6 (Employee Management System)."],"outcomes":["Phân biệt đúng khi nào dùng interface, khi nào dùng abstract class.","Sử dụng đúng static nested class, inner class và anonymous class.","Khai báo và sử dụng enum với constructor/field/method riêng.","Nhận diện được 5 nguyên tắc SOLID trong một thiết kế lớp cụ thể."],"sections":[{"id":"day07-sec-interface","title":"Interface","blocks":[{"id":"day07-blk-1","type":"paragraph","text":"Interface là một kiểu tham chiếu trong Java, đóng vai trò như một 'hợp đồng' (contract) về API: interface khai báo các phương thức mà lớp implement nó bắt buộc phải cung cấp phần cài đặt cụ thể. Bài học Interfaces and Inheritance của Oracle trình bày interface ở đúng vị trí này trong chương trình học, tiếp nối ngay phần kế thừa (extends) đã học ở Day 5.","citations":["day07-src-1"]},{"id":"day07-blk-2","type":"code","language":"java","code":"interface Payable {\n    double calculateAmount();\n\n    default String describe() {\n        return \"Amount due: \" + calculateAmount();\n    }\n}\n\nclass Invoice implements Payable {\n    private final double baseAmount;\n    private final double taxRate;\n\n    Invoice(double baseAmount, double taxRate) {\n        this.baseAmount = baseAmount;\n        this.taxRate = taxRate;\n    }\n\n    @Override\n    public double calculateAmount() {\n        return baseAmount * (1 + taxRate);\n    }\n}\n","compile":true,"citations":["day07-src-1"]}]},{"id":"day07-sec-abstract-vs-interface","title":"Abstract class vs Interface","blocks":[{"id":"day07-blk-3","type":"paragraph","text":"Interface và abstract class (đã học ở Day 5) giống nhau ở một điểm cốt lõi: cả hai đều có thể khai báo phương thức chưa có phần cài đặt, buộc lớp con/lớp implement phải tự hoàn thiện. Điểm khác biệt lớn nhất nằm ở quan hệ kế thừa: một lớp chỉ được extends đúng một abstract class (đơn kế thừa), nhưng có thể implements nhiều interface cùng lúc — đây chính là cơ chế Java dùng để mô phỏng đa kế thừa hành vi.","citations":["day07-src-1"]},{"id":"day07-blk-4","type":"table","columns":["Tiêu chí","Abstract class","Interface"],"rows":[["Kế thừa/implement","extends — chỉ một abstract class (đơn kế thừa)","implements — nhiều interface cùng lúc"],["Method chưa cài đặt","Có thể có (abstract method)","Có (method trừu tượng mặc định, trừ default/static method)"],["Field/constructor","Có thể có field non-static, non-final và constructor riêng","Trước Java 8 chỉ có hằng số static final, không có constructor"]],"citations":["day07-src-1"]}]},{"id":"day07-sec-inner-classes","title":"Inner Classes","blocks":[{"id":"day07-blk-5","type":"note","text":"Chủ đề này không có nguồn trích dẫn chuyên sâu trong bộ tài liệu của khóa học (xem authoring.limitations); nội dung dưới đây trình bày theo kiến thức Java 17 chuẩn, phạm vi vừa đủ để học viên nhận diện và sử dụng đúng các loại lớp lồng nhau.","citations":[]},{"id":"day07-blk-6","type":"paragraph","text":"Java có bốn loại lớp lồng nhau (nested class): static nested class (khai báo với từ khóa static bên trong lớp ngoài, không giữ tham chiếu tới instance của lớp ngoài), inner class (không static, mỗi instance gắn với một instance cụ thể của lớp ngoài và có thể truy cập trực tiếp field/method của lớp ngoài), local class (khai báo bên trong thân một phương thức, chỉ dùng được trong phạm vi phương thức đó), và anonymous class (lớp không tên, khai báo và khởi tạo cùng lúc, thường dùng để cài đặt nhanh một interface hoặc kế thừa một lớp để tạo đối tượng dùng một lần). Ví dụ: `class Outer { class Inner { ... } static class StaticHelper { ... } Runnable r = new Runnable() { public void run() { ... } }; }` thể hiện lần lượt inner class, static nested class và anonymous class bên trong một lớp Outer.","citations":[]}]},{"id":"day07-sec-enums","title":"Enums","blocks":[{"id":"day07-blk-8","type":"note","text":"Tương tự Inner Classes, Enums không có nguồn trích dẫn chuyên sâu trong bộ tài liệu của khóa học; nội dung dưới đây theo kiến thức Java 17 chuẩn (xem authoring.limitations).","citations":[]},{"id":"day07-blk-9","type":"paragraph","text":"Enum trong Java là một kiểu dữ liệu đặc biệt dùng để biểu diễn một tập giá trị cố định, hữu hạn (ví dụ: các ngày trong tuần, các trạng thái đơn hàng). Ngoài các hằng số đơn giản, enum có thể có constructor riêng (luôn private hoặc package-private), field, và method — mỗi hằng số enum thực chất là một instance duy nhất của chính kiểu enum đó. Enum cũng dùng được trực tiếp trong switch (cả dạng classic và dạng arrow đã học ở Day 2). Ví dụ: `enum OrderStatus { NEW(false), PROCESSING(false), SHIPPED(true), CANCELLED(true); private final boolean terminal; OrderStatus(boolean terminal) { this.terminal = terminal; } boolean isTerminal() { return terminal; } }` kết hợp với `switch (status) { case NEW -\u003e ...; case SHIPPED, CANCELLED -\u003e ...; }` cho thấy enum có constructor/field/method riêng và dùng trực tiếp trong switch expression.","citations":[]}]},{"id":"day07-sec-solid","title":"SOLID Principles","blocks":[{"id":"day07-blk-11","type":"note","text":"Chủ đề này không có nguồn trích dẫn trong bộ tài liệu của khóa học; nội dung dưới đây tóm tắt theo kiến thức thiết kế hướng đối tượng chuẩn, ở mức độ giới thiệu (xem authoring.limitations).","citations":[]},{"id":"day07-blk-12","type":"paragraph","text":"SOLID là 5 nguyên tắc thiết kế hướng đối tượng phổ biến: Single Responsibility (mỗi lớp chỉ nên có một lý do để thay đổi), Open/Closed (mở để mở rộng, đóng để sửa đổi — ưu tiên thêm lớp/interface mới thay vì sửa lớp cũ), Liskov Substitution (lớp con phải thay thế được lớp cha mà không làm sai lệch hành vi mong đợi — liên quan trực tiếp đến polymorphism đã học ở Day 5), Interface Segregation (nhiều interface nhỏ, chuyên biệt tốt hơn một interface lớn, ôm đồm), và Dependency Inversion (module cấp cao nên phụ thuộc vào abstraction/interface, không phụ thuộc trực tiếp vào lớp cụ thể).","citations":[]}]}],"commonMistakes":["Dùng interface chỉ để khai báo hằng số static final (anti-pattern 'constant interface') thay vì dùng một lớp hằng số thông thường.","Quên rằng inner class (không static) luôn giữ tham chiếu ngầm tới instance của lớp ngoài, dễ gây rò rỉ bộ nhớ nếu giữ inner class sống lâu hơn lớp ngoài cần thiết.","Khai báo enum constructor là public (enum constructor luôn phải là private hoặc package-private, không thể là public/protected)."],"practices":[{"id":"day07-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Điểm khác biệt cơ bản nhất giữa abstract class và interface về khả năng kế thừa/implement là gì?","choices":[{"id":"day07-prac-1-a","text":"Một lớp chỉ extends được một abstract class, nhưng implements được nhiều interface cùng lúc"},{"id":"day07-prac-1-b","text":"Interface không thể có method, còn abstract class thì có"},{"id":"day07-prac-1-c","text":"Abstract class không thể có constructor, còn interface thì có"},{"id":"day07-prac-1-d","text":"Cả hai đều cho phép đa kế thừa không giới hạn"}],"correctChoiceIds":["day07-prac-1-a"],"hint":"Xem lại bảng so sánh Abstract class vs Interface.","solution":"day07-prac-1-a","explanation":"extends là đơn kế thừa (một abstract class), implements là đa năng (nhiều interface cùng lúc) — đây là lý do interface được dùng để mô phỏng đa kế thừa hành vi trong Java.","rubric":"Chọn đúng đáp án về đơn kế thừa vs đa implement.","sourceUsage":["day07-src-1"]},{"id":"day07-prac-2","type":"concept","interaction":"self-check","prompt":"Giải thích nguyên tắc Single Responsibility (SRP) bằng một ví dụ cụ thể: một lớp OrderService đang vừa xử lý logic đơn hàng vừa tự ghi log ra file thì vi phạm SRP như thế nào, và nên tách lại sao cho đúng.","choices":[],"correctChoiceIds":[],"hint":"SRP nói về 'một lý do để thay đổi' — đếm xem lớp đang có bao nhiêu lý do khác nhau khiến nó phải sửa.","solution":"Tách OrderService (chỉ xử lý nghiệp vụ đơn hàng) và một lớp riêng như OrderLogger/AuditWriter (chỉ lo ghi log). Mỗi lớp chỉ còn một lý do để thay đổi: OrderService thay đổi khi nghiệp vụ đơn hàng thay đổi, OrderLogger thay đổi khi cách ghi log thay đổi.","explanation":"SRP giúp lớp dễ bảo trì và test hơn vì mỗi lớp chỉ tập trung một trách nhiệm.","rubric":"Đánh giá học viên có nhận diện đúng 'nhiều lý do thay đổi' và đề xuất tách lớp hợp lý hay không.","sourceUsage":[]},{"id":"day07-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một enum Season với 4 giá trị (SPRING, SUMMER, AUTUMN, WINTER) và một phương thức tĩnh fromMonth(int month) trả về Season tương ứng (tháng 12, 1, 2 là WINTER; 3, 4, 5 là SPRING; 6, 7, 8 là SUMMER; còn lại là AUTUMN), dùng switch expression dạng arrow đã học ở Day 2.","choices":[],"correctChoiceIds":[],"hint":"Dùng switch expression với case gộp nhiều giá trị (ví dụ: case 12, 1, 2 -\u003e).","solution":"enum Season { SPRING, SUMMER, AUTUMN, WINTER;\n    static Season fromMonth(int month) {\n        return switch (month) {\n            case 12, 1, 2 -\u003e WINTER;\n            case 3, 4, 5 -\u003e SPRING;\n            case 6, 7, 8 -\u003e SUMMER;\n            default -\u003e AUTUMN;\n        };\n    }\n}","explanation":"Enum kết hợp switch expression cho phép biểu diễn logic ánh xạ gọn và an toàn kiểu.","rubric":"Đánh giá enum có đủ 4 giá trị, phương thức tĩnh (static) dùng switch expression dạng arrow, và logic ánh xạ tháng đúng.","sourceUsage":[]},{"id":"day07-prac-4","type":"coding","interaction":"self-check","prompt":"Viết một interface Shape2D với method double area(); sau đó viết một lớp Rectangle implements Shape2D, và một inner class bên trong Rectangle tên Diagonal có method double length() tính đường chéo hình chữ nhật.","choices":[],"correctChoiceIds":[],"hint":"Inner class truy cập trực tiếp field của lớp ngoài (Rectangle) mà không cần truyền tham số.","solution":"interface Shape2D { double area(); }\nclass Rectangle implements Shape2D {\n    private final double width, height;\n    Rectangle(double width, double height) { this.width = width; this.height = height; }\n    public double area() { return width * height; }\n    class Diagonal {\n        double length() { return Math.sqrt(width * width + height * height); }\n    }\n}","explanation":"Bài tập kết hợp interface (Day 7) và inner class (Day 7) trong cùng một thiết kế nhỏ.","rubric":"Đánh giá interface được implement đúng, inner class truy cập đúng field của lớp ngoài, công thức đường chéo chính xác.","sourceUsage":[]}],"syllabusAssignments":[{"row":14,"text":"Assignment"}],"enhancedExercises":["Refactor một lớp 'God class' vi phạm SRP (ví dụ: lớp vừa đọc file, vừa tính toán, vừa ghi log) thành nhiều lớp nhỏ theo từng trách nhiệm.","Chuyển một anonymous class Runnable thành một lambda expression tương đương (chuẩn bị trước cho Day 10 — Functional Interface \u0026 Lambda)."],"references":[{"id":"day07-ref-1","type":"external","resourceId":"res-0196dd00302a","citationId":"day07-src-1","url":"https://docs.oracle.com/javase/tutorial/java/IandI/index.html","label":"Interface \u0026 Inheritance","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Interfaces and Inheritance (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day07-ref-2","type":"internal","resourceId":null,"citationId":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-08","unitId":"unit-03","group":"java","kind":"theory","title":"Generics, Collections \u0026 Exception Handling","summary":"Generics giúp kiểm tra kiểu lúc biên dịch (bounded type, wildcard, type erasure); Collections Framework tổ chức dữ liệu qua List/Set/Map; Exception hierarchy phân biệt checked/unchecked và try-with-resources tự động đóng resource theo thứ tự ngược khai báo.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Đã hoàn thành Day 7 (Interface, Inner Classes, Enums, SOLID Principles)."],"outcomes":["Viết được generic method với bounded type parameter.","Chọn đúng cài đặt List/Set/Map phù hợp từng tình huống.","Phân biệt checked và unchecked exception, thiết kế exception hierarchy hợp lý.","Dùng try-with-resources thay cho finally thủ công khi làm việc với AutoCloseable."],"sections":[{"id":"day08-sec-generics","title":"Generics","blocks":[{"id":"day08-blk-1","type":"paragraph","text":"Generics cho phép một lớp, interface hoặc method thao tác trên kiểu dữ liệu được tham số hóa, giúp trình biên dịch phát hiện lỗi về kiểu ngay lúc biên dịch thay vì để lỗi rơi đến runtime mới phát hiện.","citations":["day08-src-1"]},{"id":"day08-blk-2","type":"paragraph","text":"Trước khi có generics, các collection (như List) lưu Object và lập trình viên phải ép kiểu tường minh mỗi khi lấy phần tử ra — dễ gây ClassCastException lúc runtime nếu ép sai kiểu. Khai báo generic như List\u003cInteger\u003e giúp trình biên dịch kiểm tra kiểu ngay tại điểm thêm/lấy phần tử, loại bỏ hoàn toàn nhu cầu ép kiểu thủ công.","citations":["day08-src-2"]},{"id":"day08-blk-3","type":"code","language":"java","code":"class BoundedMathUtil {\n    static \u003cT extends Comparable\u003cT\u003e\u003e T max(T a, T b) {\n        return a.compareTo(b) \u003e= 0 ? a : b;\n    }\n}\n","compile":true,"citations":["day08-src-3"]},{"id":"day08-blk-4","type":"important","text":"Wildcard '?' dùng khi không cần quan tâm kiểu cụ thể: '? extends T' (upper bounded) cho phép đọc phần tử kiểu T trở lên nhưng không được thêm vào (producer); '? super T' (lower bounded) cho phép thêm phần tử kiểu T trở xuống (consumer).","citations":["day08-src-4"]},{"id":"day08-blk-5","type":"note","text":"Type erasure: trình biên dịch Java xóa toàn bộ thông tin kiểu generic sau khi biên dịch xong (bytecode không còn biết List\u003cInteger\u003e khác List\u003cString\u003e) — đây cũng là lý do generics không dùng trực tiếp được với kiểu nguyên thủy (int, double...), chỉ dùng được với kiểu tham chiếu (Integer, Double...).","citations":["day08-src-5"]}]},{"id":"day08-sec-collections","title":"Collections Framework: List, Set, Map","blocks":[{"id":"day08-blk-6","type":"paragraph","text":"Java Collections Framework (theo Trail chính thức của Oracle) gồm các interface gốc như Collection, List, Set, Map cùng các lớp cài đặt và thuật toán đi kèm, cung cấp một kiến trúc thống nhất để lưu trữ và thao tác trên nhóm đối tượng.","citations":["day08-src-6"]},{"id":"day08-blk-7","type":"paragraph","text":"Theo cách phân nhóm của Java Collections Series, các cài đặt phổ biến được chia theo từng nhóm interface: List (ArrayList, LinkedList), Set (HashSet, LinkedHashSet, TreeSet), Map (HashMap, LinkedHashMap, TreeMap), mỗi nhóm có đặc điểm riêng về thứ tự và trùng lặp.","citations":["day08-src-7"]},{"id":"day08-blk-8","type":"table","columns":["Interface","Cho phép phần tử trùng lặp?","Có thứ tự?","Cài đặt tiêu biểu"],"rows":[["List","Có","Có (theo chỉ số index)","ArrayList, LinkedList"],["Set","Không","Tùy cài đặt (HashSet: không; LinkedHashSet/TreeSet: có)","HashSet, LinkedHashSet, TreeSet"],["Map","Key không trùng, value có thể trùng","Tùy cài đặt (HashMap: không; LinkedHashMap/TreeMap: có)","HashMap, LinkedHashMap, TreeMap"]],"citations":["day08-src-6","day08-src-7"]}]},{"id":"day08-sec-exceptions","title":"Exception Hierarchy","blocks":[{"id":"day08-blk-9","type":"paragraph","text":"Bài học Exceptions trình bày cơ chế xử lý lỗi của Java: khi một đối tượng exception được ném (throw) trong lúc thực thi một method, luồng thực thi bình thường bị ngắt và JVM tìm kiếm nơi xử lý (catch) phù hợp.","citations":["day08-src-8"]},{"id":"day08-blk-10","type":"important","text":"Phân cấp exception bắt đầu từ Throwable, chia thành hai nhánh chính: Exception (bao gồm checked exception và nhánh con RuntimeException là unchecked exception) và Error (lỗi nghiêm trọng của JVM, không nên tự catch để xử lý).","citations":["day08-src-9"]},{"id":"day08-blk-11","type":"paragraph","text":"Checked exception (kế thừa trực tiếp từ Exception, không qua RuntimeException) bắt buộc phải được khai báo trong chữ ký throws hoặc xử lý bằng try-catch, kiểm tra ngay lúc biên dịch. Unchecked exception (kế thừa từ RuntimeException) không bị kiểm tra lúc biên dịch, thường đại diện cho lỗi lập trình (ví dụ: NullPointerException).","citations":["day08-src-10"]},{"id":"day08-blk-12","type":"code","language":"java","code":"class InsufficientBalanceException extends Exception {\n    InsufficientBalanceException(String message) {\n        super(message);\n    }\n}\n\nclass InvalidAmountException extends RuntimeException {\n    InvalidAmountException(String message) {\n        super(message);\n    }\n}\n\nclass Account {\n    private double balance;\n\n    Account(double balance) {\n        this.balance = balance;\n    }\n\n    void withdraw(double amount) throws InsufficientBalanceException {\n        if (amount \u003c= 0) {\n            throw new InvalidAmountException(\"amount must be positive\");\n        }\n        if (amount \u003e balance) {\n            throw new InsufficientBalanceException(\"not enough balance\");\n        }\n        balance -= amount;\n    }\n}\n","compile":true,"citations":["day08-src-9","day08-src-10"]},{"id":"day08-blk-13","type":"warning","text":"Hai anti-pattern phổ biến cần tránh: (1) 'nuốt' exception bằng một catch block rỗng không làm gì cả, khiến lỗi biến mất không dấu vết; (2) dùng return hoặc throw bên trong khối finally, vì nó sẽ ghi đè (che khuất) hoàn toàn giá trị return hoặc exception đang được ném từ khối try/catch tương ứng.","citations":["day08-src-11"]}]},{"id":"day08-sec-try-with-resources","title":"try-with-resources","blocks":[{"id":"day08-blk-14","type":"paragraph","text":"Cú pháp try-with-resources (từ Java 7) cho phép khai báo resource (kiểu AutoCloseable) ngay trong ngoặc đơn sau từ khóa try; resource sẽ được tự động đóng (gọi close()) khi khối try kết thúc, kể cả khi có exception xảy ra, không cần khối finally thủ công.","citations":["day08-src-12"]},{"id":"day08-blk-15","type":"paragraph","text":"Một khối try-with-resources có thể khai báo nhiều resource cùng lúc, phân cách nhau bằng dấu chấm phẩy.","citations":["day08-src-13"]},{"id":"day08-blk-16","type":"code","language":"java","code":"import java.util.ArrayList;\nimport java.util.List;\n\nclass LogBuffer implements AutoCloseable {\n    private final List\u003cString\u003e lines = new ArrayList\u003c\u003e();\n    private boolean closed = false;\n\n    void write(String line) {\n        lines.add(line);\n    }\n\n    List\u003cString\u003e lines() {\n        return lines;\n    }\n\n    boolean isClosed() {\n        return closed;\n    }\n\n    @Override\n    public void close() {\n        closed = true;\n    }\n}\n\nclass MultiResourceDemo {\n    void run() {\n        try (LogBuffer first = new LogBuffer();\n             LogBuffer second = new LogBuffer()) {\n            first.write(\"a\");\n            second.write(\"b\");\n        }\n    }\n}\n","compile":true,"citations":["day08-src-14","day08-src-13"]},{"id":"day08-blk-17","type":"note","text":"Thứ tự đóng resource ngược với thứ tự khai báo: resource khai báo sau cùng sẽ được đóng trước, resource khai báo đầu tiên được đóng sau cùng.","citations":["day08-src-15"]}]}],"commonMistakes":["Bắt exception chung chung bằng catch (Exception e) rồi bỏ qua (nuốt lỗi) thay vì xử lý hoặc re-throw đúng loại exception cụ thể.","Dùng return/throw bên trong khối finally, vô tình che mất giá trị hoặc exception thực sự của khối try/catch.","Khai báo kiểu nguyên thủy (int, double) làm type argument cho generic (ví dụ List\u003cint\u003e) — Java không cho phép vì type erasure chỉ hoạt động với kiểu tham chiếu."],"practices":[{"id":"day08-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Điều gì phân biệt checked exception với unchecked exception (RuntimeException)?","choices":[{"id":"day08-prac-1-a","text":"Checked exception bắt buộc khai báo throws hoặc try-catch, được kiểm tra lúc biên dịch; unchecked thì không"},{"id":"day08-prac-1-b","text":"Checked exception chỉ xảy ra lúc runtime, unchecked chỉ xảy ra lúc biên dịch"},{"id":"day08-prac-1-c","text":"Unchecked exception không thể được catch bằng catch block"},{"id":"day08-prac-1-d","text":"Không có sự khác biệt nào, đây chỉ là quy ước đặt tên"}],"correctChoiceIds":["day08-prac-1-a"],"hint":"Xem lại phần phân cấp Throwable -\u003e Exception -\u003e RuntimeException.","solution":"day08-prac-1-a","explanation":"Checked exception (kế thừa Exception, không qua RuntimeException) bị trình biên dịch bắt buộc xử lý; unchecked exception (kế thừa RuntimeException) thì không.","rubric":"Chọn đúng định nghĩa checked vs unchecked.","sourceUsage":["day08-src-10"]},{"id":"day08-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Trong một khối try-with-resources khai báo 'try (A a = new A(); B b = new B()) { ... }', resource nào được đóng (close()) trước?","choices":[{"id":"day08-prac-2-a","text":"b (resource khai báo sau cùng được đóng trước)"},{"id":"day08-prac-2-b","text":"a (resource khai báo đầu tiên được đóng trước)"},{"id":"day08-prac-2-c","text":"Cả hai đóng đồng thời, không có thứ tự xác định"},{"id":"day08-prac-2-d","text":"Không resource nào được tự động đóng"}],"correctChoiceIds":["day08-prac-2-a"],"hint":"Thứ tự đóng ngược với thứ tự khai báo.","solution":"day08-prac-2-a","explanation":"try-with-resources đóng resource theo thứ tự ngược lại với thứ tự khai báo: b được đóng trước, a được đóng sau.","rubric":"Chọn đúng resource được đóng trước.","sourceUsage":["day08-src-15"]},{"id":"day08-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một generic method 'static \u003cT extends Comparable\u003cT\u003e\u003e T min(List\u003cT\u003e items)' trả về phần tử nhỏ nhất trong danh sách (giả định danh sách không rỗng).","choices":[],"correctChoiceIds":[],"hint":"Dùng compareTo() để so sánh từng phần tử, giữ lại phần tử nhỏ nhất đã thấy.","solution":"static \u003cT extends Comparable\u003cT\u003e\u003e T min(List\u003cT\u003e items) {\n    T smallest = items.get(0);\n    for (T item : items) {\n        if (item.compareTo(smallest) \u003c 0) {\n            smallest = item;\n        }\n    }\n    return smallest;\n}","explanation":"Bounded generic method đảm bảo T có thể so sánh được (Comparable\u003cT\u003e) tại thời điểm biên dịch.","rubric":"Đánh giá method dùng bounded type parameter đúng, duyệt toàn bộ danh sách, trả về đúng phần tử nhỏ nhất.","sourceUsage":[]},{"id":"day08-prac-4","type":"concept","interaction":"self-check","prompt":"Giải thích type erasure ảnh hưởng thế nào tới việc không thể tạo 'new T[10]' hoặc 'new ArrayList\u003cInteger\u003e()[5]' (mảng của kiểu generic) trong Java.","choices":[],"correctChoiceIds":[],"hint":"Sau type erasure, trình biên dịch không còn biết T là kiểu gì lúc runtime nên không thể cấp phát mảng đúng kiểu.","solution":"Vì type erasure xóa hết thông tin kiểu generic cụ thể sau khi biên dịch, JVM lúc runtime không biết T thực sự là kiểu gì để tạo mảng đúng kiểu đó (mảng trong Java cần biết kiểu phần tử cụ thể lúc tạo) — nên Java cấm trực tiếp 'new T[]' và 'new List\u003cX\u003e[]'.","explanation":"Type erasure là lý do sâu xa của nhiều hạn chế kỳ lạ trong generics mà lập trình viên Java hay gặp.","rubric":"Đánh giá học viên liên kết đúng type erasure với hạn chế tạo mảng generic.","sourceUsage":[]}],"syllabusAssignments":[],"enhancedExercises":["Viết một custom exception hierarchy 3 tầng (ví dụ: AppException -\u003e ValidationException -\u003e MissingFieldException) và một method minh họa catch đúng từng tầng.","Viết một lớp tự tạo cài đặt AutoCloseable, mở một 'kết nối' giả lập trong constructor và đóng nó trong close(), rồi dùng trong try-with-resources với 3 resource cùng lúc."],"references":[{"id":"day08-ref-1","type":"external","resourceId":"res-e3b2dcb60e96","citationId":"day08-src-1","url":"https://docs.oracle.com/javase/tutorial/java/generics/index.html","label":"Generics","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Generics (Updated) (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day08-ref-2","type":"external","resourceId":"res-8abee0bfd5a7","citationId":"day08-src-3","url":"https://www.baeldung.com/java-generics","label":"Java Generics","checkStatus":"ok","readStatus":"read","pageTitle":"The Basics of Java Generics | Baeldung","limitation":null},{"id":"day08-ref-3","type":"external","resourceId":"res-899383bc8d09","citationId":"day08-src-6","url":"https://docs.oracle.com/javase/tutorial/collections/index.html","label":"Collections","checkStatus":"ok","readStatus":"read","pageTitle":"Trail: Collections (The Java Tutorials)","limitation":null},{"id":"day08-ref-4","type":"external","resourceId":"res-30d834f8fef0","citationId":"day08-src-9","url":"https://www.baeldung.com/java-exceptions","label":"Java Exceptions","checkStatus":"ok","readStatus":"read","pageTitle":"Exception Handling in Java | Baeldung","limitation":null},{"id":"day08-ref-5","type":"external","resourceId":"res-9762250d04d9","citationId":"day08-src-12","url":"https://www.baeldung.com/java-try-with-resources","label":"Try-with-resources","checkStatus":"ok","readStatus":"read","pageTitle":"Java – Try with Resources | Baeldung","limitation":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-09","unitId":"unit-03","group":"java","kind":"lab","title":"- Lab 3: Custom Collection \u0026 Exception Framework","summary":"Lab 3: tự cài đặt SimpleArrayList\u003cE\u003e (mảng động) và SimpleHashMap\u003cK,V\u003e (separate chaining) cùng một hệ thống exception riêng cho tầng truy cập dữ liệu, tổng hợp generics/collections/exception đã học ở Day 8.","durationMinutes":150.0,"objectives":["LO3"],"prerequisites":["Đã hoàn thành Day 8 (Generics, Collections Framework, Exception hierarchy, try-with-resources)."],"outcomes":["Tự cài đặt một cấu trúc dữ liệu generic (dynamic array) từ đầu.","Tự cài đặt một hash map đơn giản dùng separate chaining.","Thiết kế một exception hierarchy riêng cho một tầng ứng dụng cụ thể.","Viết bộ test đạt độ bao phủ cao, gồm cả nhánh lỗi."],"sections":[{"id":"day09-sec-brief","title":"Đề bài: Custom Collection \u0026 Exception Framework","blocks":[{"id":"day09-blk-1","type":"deliverable","text":"- Lab 3: Custom Collection \u0026 Exception Framework\n  - Implement `SimpleArrayList\u003cE\u003e` with dynamic array (add, get, remove, size, iterator)\n  - Implement `SimpleHashMap\u003cK,V\u003e` with separate chaining\n  - Custom exception hierarchy: `DataAccessException` → `DuplicatedKeyException`, `KeyNotFoundException`\n  - Test coverage ≥ 80%","citations":[]},{"id":"day09-blk-2","type":"note","text":"Lab này tổng hợp trực tiếp kiến thức Day 8: generics (SimpleArrayList\u003cE\u003e, SimpleHashMap\u003cK,V\u003e phải là kiểu tham số hóa), Collections Framework (cài đặt lại một phần hành vi của List/Map từ đầu) và exception hierarchy (thiết kế riêng một nhánh exception cho tầng truy cập dữ liệu).","citations":[]}]},{"id":"day09-sec-design","title":"Phân rã thiết kế (guided decomposition)","blocks":[{"id":"day09-blk-3","type":"paragraph","text":"SimpleArrayList\u003cE\u003e nên dùng generic type parameter E giống cách các generic method/class đã học ở Day 8, để trình biên dịch kiểm tra kiểu phần tử ngay lúc thêm/lấy ra thay vì phải ép kiểu từ Object.","citations":["day09-src-1"]},{"id":"day09-blk-4","type":"note","text":"Chủ đề 'separate chaining' (mỗi bucket của hash map là một danh sách liên kết các Node\u003cK,V\u003e) là chi tiết cài đặt nội bộ của hash table, không được mô tả trong các trang mở đầu/mục lục Collections mà Day 9 được gắn (Trail: Collections và Collections Series đều là trang tổng quan cấp interface, không đi sâu vào thuật toán nội bộ từng cài đặt) — xem authoring.limitations. Thiết kế gợi ý: một mảng các 'bucket' (Node\u003cK,V\u003e[]), với index bucket tính từ key.hashCode(); mỗi bucket là một danh sách liên kết đơn để xử lý đụng độ (collision) khi nhiều key rơi vào cùng một bucket.","citations":[]},{"id":"day09-blk-5","type":"important","text":"Exception riêng của tầng truy cập dữ liệu (DataAccessException và hai lớp con DuplicatedKeyException/KeyNotFoundException) nên kế thừa RuntimeException (unchecked) chứ không phải Exception (checked): đây là lỗi logic nghiệp vụ lúc runtime (thao tác trên key không hợp lệ), không phải lỗi ngoại cảnh bắt buộc gọi phải xử lý ngay tại mỗi điểm gọi như IOException.","citations":["day09-src-4","day09-src-5"]}]},{"id":"day09-sec-implementation","title":"Cài đặt tham khảo","blocks":[{"id":"day09-blk-6","type":"code","language":"java","code":"import java.util.Iterator;\nimport java.util.NoSuchElementException;\n\nclass DataAccessException extends RuntimeException {\n    DataAccessException(String message) {\n        super(message);\n    }\n}\n\nclass DuplicatedKeyException extends DataAccessException {\n    DuplicatedKeyException(String message) {\n        super(message);\n    }\n}\n\nclass KeyNotFoundException extends DataAccessException {\n    KeyNotFoundException(String message) {\n        super(message);\n    }\n}\n\nclass SimpleArrayList\u003cE\u003e implements Iterable\u003cE\u003e {\n    private Object[] elements = new Object[8];\n    private int size = 0;\n\n    void add(E element) {\n        if (size == elements.length) {\n            elements = java.util.Arrays.copyOf(elements, elements.length * 2);\n        }\n        elements[size++] = element;\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    E get(int index) {\n        checkIndex(index);\n        return (E) elements[index];\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    E remove(int index) {\n        checkIndex(index);\n        E removed = (E) elements[index];\n        int numMoved = size - index - 1;\n        if (numMoved \u003e 0) {\n            System.arraycopy(elements, index + 1, elements, index, numMoved);\n        }\n        elements[--size] = null;\n        return removed;\n    }\n\n    int size() {\n        return size;\n    }\n\n    private void checkIndex(int index) {\n        if (index \u003c 0 || index \u003e= size) {\n            throw new IndexOutOfBoundsException(\"index=\" + index + \", size=\" + size);\n        }\n    }\n\n    @Override\n    public Iterator\u003cE\u003e iterator() {\n        return new Iterator\u003cE\u003e() {\n            private int cursor = 0;\n\n            @Override\n            public boolean hasNext() {\n                return cursor \u003c size;\n            }\n\n            @Override\n            public E next() {\n                if (!hasNext()) {\n                    throw new NoSuchElementException();\n                }\n                return get(cursor++);\n            }\n        };\n    }\n}\n\nclass SimpleHashMap\u003cK, V\u003e {\n    private static class Node\u003cK, V\u003e {\n        final K key;\n        V value;\n        Node\u003cK, V\u003e next;\n\n        Node(K key, V value, Node\u003cK, V\u003e next) {\n            this.key = key;\n            this.value = value;\n            this.next = next;\n        }\n    }\n\n    private Node\u003cK, V\u003e[] buckets;\n    private int size = 0;\n\n    @SuppressWarnings(\"unchecked\")\n    SimpleHashMap() {\n        buckets = new Node[16];\n    }\n\n    void put(K key, V value) {\n        int index = indexOf(key);\n        for (Node\u003cK, V\u003e node = buckets[index]; node != null; node = node.next) {\n            if (node.key.equals(key)) {\n                throw new DuplicatedKeyException(\"Key already exists: \" + key);\n            }\n        }\n        buckets[index] = new Node\u003c\u003e(key, value, buckets[index]);\n        size++;\n    }\n\n    V get(K key) {\n        int index = indexOf(key);\n        for (Node\u003cK, V\u003e node = buckets[index]; node != null; node = node.next) {\n            if (node.key.equals(key)) {\n                return node.value;\n            }\n        }\n        throw new KeyNotFoundException(\"Key not found: \" + key);\n    }\n\n    int size() {\n        return size;\n    }\n\n    private int indexOf(K key) {\n        return Math.floorMod(key.hashCode(), buckets.length);\n    }\n}\n","compile":true,"citations":["day09-src-1","day09-src-4","day09-src-5"]}]},{"id":"day09-sec-tests","title":"Danh sách test cần có","blocks":[{"id":"day09-blk-7","type":"table","columns":["Test case","Mục tiêu","Kết quả mong đợi"],"rows":[["add() + get() liên tiếp trên SimpleArrayList","Xác nhận phần tử được thêm và lấy đúng thứ tự","get(i) trả về đúng phần tử đã add ở vị trí i"],["get()/remove() với index ngoài phạm vi","Xác nhận validate biên","Ném IndexOutOfBoundsException"],["put() với key đã tồn tại","Xác nhận ràng buộc không trùng key","Ném DuplicatedKeyException"],["get() với key không tồn tại","Xác nhận xử lý truy vấn sai","Ném KeyNotFoundException"]],"citations":["day09-src-4","day09-src-5"]},{"id":"day09-blk-8","type":"warning","text":"Test coverage ≥ 80% (theo đề bài) cần bao phủ cả nhánh lỗi (index/key không hợp lệ) chứ không chỉ nhánh thành công — các exception riêng (DuplicatedKeyException, KeyNotFoundException, IndexOutOfBoundsException) cần có ít nhất một test riêng cho từng loại.","citations":["day09-src-4","day09-src-5"]}]}],"commonMistakes":["Dùng Object[] làm mảng nội bộ nhưng quên ép kiểu (E) khi trả về từ get(), dẫn tới lỗi biên dịch hoặc ClassCastException không rõ ràng.","Quên tăng buckets khi số phần tử vượt một ngưỡng (load factor) — cài đặt trong bài có thể bỏ qua resize để đơn giản, nhưng cần ghi rõ giới hạn này nếu không làm.","Cho cả ba loại exception kế thừa trực tiếp RuntimeException thay vì cho DuplicatedKeyException/KeyNotFoundException kế thừa DataAccessException — làm mất khả năng catch chung cả nhóm bằng một khối catch (DataAccessException e)."],"practices":[{"id":"day09-prac-1","type":"applied","interaction":"self-check","prompt":"Cài đặt đầy đủ SimpleArrayList\u003cE\u003e, SimpleHashMap\u003cK,V\u003e và hệ thống exception (DataAccessException, DuplicatedKeyException, KeyNotFoundException) theo đúng đề bài, kèm bộ test đạt test coverage ≥ 80%.","choices":[],"correctChoiceIds":[],"hint":"Bắt đầu từ SimpleArrayList (đơn giản hơn) trước, viết test ngay sau mỗi method; SimpleHashMap và exception hierarchy làm sau.","solution":"Xem mục 'Cài đặt tham khảo' ở trên; đây là một cách cài đặt hợp lệ, có thể điều chỉnh chi tiết nội bộ (ví dụ kích thước mảng ban đầu) miễn giữ đúng API công khai theo đề bài.","explanation":"Không có lời giải cố định — đánh giá theo độ đúng API và độ bao phủ test.","rubric":"Đạt yêu cầu khi: SimpleArrayList có đủ add/get/remove/size/iterator; SimpleHashMap dùng separate chaining và ném đúng exception; cả ba loại exception đều kế thừa đúng nhánh DataAccessException; test bao phủ cả nhánh lỗi.","sourceUsage":[]},{"id":"day09-prac-2","type":"concept","interaction":"multiple-choice","prompt":"Tại sao DataAccessException trong lab này nên kế thừa RuntimeException (unchecked) thay vì Exception (checked)?","choices":[{"id":"day09-prac-2-a","text":"Vì đây là lỗi logic nghiệp vụ phát sinh lúc runtime khi thao tác key không hợp lệ, không phải lỗi ngoại cảnh bắt buộc mọi nơi gọi phải xử lý ngay"},{"id":"day09-prac-2-b","text":"Vì RuntimeException chạy nhanh hơn Exception"},{"id":"day09-prac-2-c","text":"Vì checked exception không thể có constructor nhận String message"},{"id":"day09-prac-2-d","text":"Vì Java không cho phép tự tạo checked exception"}],"correctChoiceIds":["day09-prac-2-a"],"hint":"Xem lại phần phân biệt checked vs unchecked ở Day 8.","solution":"day09-prac-2-a","explanation":"Checked exception phù hợp với lỗi ngoại cảnh không thể tránh được dù code đúng (ví dụ IOException); lỗi truy cập dữ liệu sai (key trùng, key không tồn tại) là lỗi logic có thể tránh được bằng kiểm tra điều kiện trước, phù hợp làm unchecked exception.","rubric":"Chọn đúng lý do RuntimeException phù hợp hơn Exception cho trường hợp này.","sourceUsage":["day09-src-5"]},{"id":"day09-prac-3","type":"coding","interaction":"self-check","prompt":"Viết một unit test (dạng JUnit-style, chỉ cần viết thân method test, không cần đầy đủ annotation) cho SimpleHashMap.put(): tạo map, put một key, rồi put lại chính key đó lần nữa và xác nhận kết quả ném DuplicatedKeyException.","choices":[],"correctChoiceIds":[],"hint":"Dùng assertThrows(DuplicatedKeyException.class, () -\u003e ...) kiểu JUnit 5.","solution":"void putDuplicateKey_throwsDuplicatedKeyException() {\n    SimpleHashMap\u003cString, Integer\u003e map = new SimpleHashMap\u003c\u003e();\n    map.put(\"a\", 1);\n    assertThrows(DuplicatedKeyException.class, () -\u003e map.put(\"a\", 2));\n}","explanation":"Test trực tiếp xác nhận hợp đồng (contract) của exception riêng đã thiết kế.","rubric":"Đánh giá test tạo dữ liệu đúng, gọi put() hai lần cùng key, và assert đúng loại exception được ném.","sourceUsage":[]}],"syllabusAssignments":[{"row":17,"text":"- Lab 3: Custom Collection \u0026 Exception Framework\n  - Implement `SimpleArrayList\u003cE\u003e` with dynamic array (add, get, remove, size, iterator)\n  - Implement `SimpleHashMap\u003cK,V\u003e` with separate chaining\n  - Custom exception hierarchy: `DataAccessException` → `DuplicatedKeyException`, `KeyNotFoundException`\n  - Test coverage ≥ 80%"}],"enhancedExercises":["Thêm phương thức remove(K key) cho SimpleHashMap, ném KeyNotFoundException nếu key không tồn tại.","Đo thời gian chạy get()/put() của SimpleHashMap với số lượng phần tử lớn dần (100, 1000, 10000) để quan sát trực quan hiệu ứng của hash collision khi không resize buckets."],"references":[{"id":"day09-ref-1","type":"external","resourceId":"res-e3b2dcb60e96","citationId":"day09-src-1","url":"https://docs.oracle.com/javase/tutorial/java/generics/index.html","label":"Generics","checkStatus":"ok","readStatus":"read","pageTitle":"Lesson: Generics (Updated) (The Java Tutorials \u003e Learning the Java Language)","limitation":null},{"id":"day09-ref-2","type":"external","resourceId":"res-30d834f8fef0","citationId":"day09-src-4","url":"https://www.baeldung.com/java-exceptions","label":"Java Exceptions","checkStatus":"ok","readStatus":"read","pageTitle":"Exception Handling in Java | Baeldung","limitation":null},{"id":"day09-ref-3","type":"internal","resourceId":null,"citationId":null}],"unitNumber":3,"unitTitle":"Interface, Generics, Collections \u0026 Exception"},{"id":"day-10","unitId":"unit-04","group":"java","kind":"theory","title":"Lambda \u0026 Stream API Chuyên Sâu","summary":"Lambda expression là cách viết gọn cài đặt functional interface; Stream.filter() lọc phần tử qua Predicate (kể cả nhiều điều kiện và xử lý checked exception); Collectors, Optional và Parallel Stream được giới thiệu ở mức chuẩn Java 17 để hoàn thiện bức tranh Stream API.","durationMinutes":150.0,"objectives":["LO4"],"prerequisites":["Đã hoàn thành Day 8-9 (Generics, Collections Framework, Exception hierarchy)."],"outcomes":["Viết được lambda expression cho các functional interface chuẩn (Predicate, Function, Consumer, Supplier).","Xây dựng được một Stream pipeline lọc theo nhiều điều kiện bằng filter().","Sử dụng đúng Collectors.toList()/groupingBy()/toMap() để gom kết quả stream.","Giải thích được vì sao Optional an toàn hơn trả về null và khi nào parallel stream có lợi."],"sections":[{"id":"day10-sec-lambda","title":"Lambda \u0026 Functional Interface","blocks":[{"id":"day10-blk-1","type":"note","text":"Chủ đề này không có nguồn trích dẫn chuyên sâu trong resourceIds của Day 10 (xem authoring.limitations); nội dung dưới đây theo kiến thức Java 17 chuẩn, tập trung vào phần làm nền tảng cho Stream API.","citations":[]},{"id":"day10-blk-2","type":"paragraph","text":"Functional interface là một interface chỉ có đúng một phương thức trừu tượng (abstract method) — ví dụ Predicate\u003cT\u003e (có method boolean test(T t)), Function\u003cT,R\u003e (R apply(T t)), Consumer\u003cT\u003e (void accept(T t)), Supplier\u003cT\u003e (T get()). Lambda expression là cách viết gọn một cài đặt cho functional interface: cú pháp tổng quát là `(tham số) -\u003e biểu thức hoặc khối lệnh`, ví dụ `Predicate\u003cInteger\u003e isEven = n -\u003e n % 2 == 0;` tương đương với viết một lớp ẩn danh cài đặt Predicate nhưng ngắn gọn hơn rất nhiều.","citations":[]}]},{"id":"day10-sec-pipeline","title":"Stream pipeline và Stream.filter()","blocks":[{"id":"day10-blk-3","type":"paragraph","text":"Stream.filter() là một intermediate operation của Stream, nhận vào một Predicate\u003cT\u003e và trả về một stream mới chỉ gồm các phần tử thỏa điều kiện; có thể truyền vào bằng lambda expression hoặc method reference.","citations":["day10-src-1"]},{"id":"day10-blk-4","type":"code","language":"java","code":"import java.util.List;\nimport java.util.stream.Collectors;\n\nclass ProductFilterDemo {\n    record Product(String name, double price, boolean inStock) {}\n\n    List\u003cProduct\u003e availableUnder(List\u003cProduct\u003e products, double maxPrice) {\n        return products.stream()\n                .filter(p -\u003e p.inStock() \u0026\u0026 p.price() \u003c= maxPrice)\n                .collect(Collectors.toList());\n    }\n}\n","compile":true,"citations":["day10-src-1","day10-src-2"]},{"id":"day10-blk-5","type":"paragraph","text":"Có thể kết hợp nhiều điều kiện lọc trong cùng một lambda bằng toán tử \u0026\u0026 (như ví dụ trên kết hợp inStock() và giới hạn giá) thay vì gọi filter() nhiều lần liên tiếp.","citations":["day10-src-2"]},{"id":"day10-blk-6","type":"note","text":"Functional interface chuẩn của Java (như Predicate) không khai báo checked exception trong chữ ký phương thức, nên một method reference ném checked exception sẽ bị lỗi biên dịch khi dùng trực tiếp trong filter(); cách xử lý phổ biến là bọc try-catch bên trong thân lambda rồi chuyển checked exception thành unchecked (hoặc trả về giá trị mặc định) trước khi trả về boolean.","citations":["day10-src-3"]},{"id":"day10-blk-7","type":"table","columns":["Nhóm","Ví dụ thao tác","Vai trò trong pipeline"],"rows":[["Stream Basics","Stream.of, list.stream()","Khởi tạo nguồn dữ liệu cho pipeline"],["Operations with Streams","filter, map/flatMap, reduce, parallel stream","Biến đổi/lọc/tổng hợp dữ liệu qua stream"],["Stream Collectors","Collectors (toList, groupingBy, toMap)","Gom kết quả cuối pipeline thành cấu trúc dữ liệu cụ thể"]],"citations":["day10-src-4"]}]},{"id":"day10-sec-collectors","title":"Collectors","blocks":[{"id":"day10-blk-8","type":"note","text":"Chủ đề này không có nguồn trích dẫn chi tiết trong resourceIds của Day 10 — bảng ở mục trước (c4) chỉ xác nhận Collectors là một nhóm chủ đề trong Streams Series, không mô tả chi tiết từng phương thức (xem authoring.limitations). Nội dung dưới đây theo kiến thức Java 17 chuẩn.","citations":[]},{"id":"day10-blk-9","type":"paragraph","text":"Collectors là lớp tiện ích cung cấp các 'chiến lược gom kết quả' để dùng với Stream.collect(): Collectors.toList()/toSet() gom thành collection; Collectors.groupingBy(keyFn) nhóm phần tử theo một khóa thành Map\u003cK, List\u003cT\u003e\u003e; Collectors.toMap(keyFn, valueFn) gom trực tiếp thành Map\u003cK, V\u003e; Collectors.joining(delimiter) nối các phần tử String lại với nhau.","citations":[]}]},{"id":"day10-sec-optional","title":"Optional","blocks":[{"id":"day10-blk-10","type":"note","text":"Chủ đề này không có nguồn trích dẫn trong resourceIds của Day 10 (xem authoring.limitations); nội dung dưới đây theo kiến thức Java 17 chuẩn.","citations":[]},{"id":"day10-blk-11","type":"paragraph","text":"Optional\u003cT\u003e là một kiểu wrapper biểu diễn 'có thể có hoặc không có giá trị', dùng để thay thế việc trả về null trực tiếp và buộc nơi gọi phải xử lý tường minh trường hợp rỗng: Optional.ofNullable(x) tạo Optional có thể rỗng; isPresent()/isEmpty() kiểm tra; get() lấy giá trị (ném NoSuchElementException nếu rỗng, nên tránh dùng trực tiếp); orElse(default)/orElseGet(supplier) cung cấp giá trị thay thế an toàn hơn; map(fn) biến đổi giá trị bên trong nếu có.","citations":[]}]},{"id":"day10-sec-parallel","title":"Parallel Stream","blocks":[{"id":"day10-blk-12","type":"note","text":"Chủ đề này không có nguồn trích dẫn chi tiết trong resourceIds của Day 10 — bảng c4 chỉ xác nhận 'parallel stream' là một thao tác được liệt kê trong nhóm Operations with Streams, không mô tả cơ chế hoạt động (xem authoring.limitations). Nội dung dưới đây theo kiến thức Java 17 chuẩn.","citations":[]},{"id":"day10-blk-13","type":"note","text":"list.stream().parallel() (hoặc list.parallelStream()) chia công việc cho nhiều thread trong ForkJoinPool.commonPool(), chỉ nên dùng khi tập dữ liệu đủ lớn và thao tác trên mỗi phần tử đủ 'nặng' để bù được chi phí điều phối song song; với tập dữ liệu nhỏ hoặc thao tác đơn giản, parallel stream có thể CHẬM HƠN stream tuần tự. Ngoài ra thao tác bên trong parallel stream phải stateless và không gây side-effect trên dữ liệu chia sẻ, nếu không sẽ dẫn tới kết quả sai lệch ngẫu nhiên.","citations":[]}]}],"commonMistakes":["Gọi get() trực tiếp trên Optional mà không kiểm tra isPresent() trước, dẫn tới NoSuchElementException khi Optional rỗng — mất hết lợi ích an toàn của Optional.","Dùng method reference ném checked exception trực tiếp trong filter()/map() mà không bọc try-catch, gây lỗi biên dịch vì functional interface chuẩn không khai báo checked exception.","Dùng parallel stream cho tập dữ liệu nhỏ hoặc thao tác đơn giản, khiến code chậm hơn và khó đoán kết quả vì chi phí điều phối song song lớn hơn lợi ích."],"practices":[{"id":"day10-prac-1","type":"concept","interaction":"multiple-choice","prompt":"Stream.filter() nhận vào tham số kiểu gì và làm gì với stream nguồn?","choices":[{"id":"day10-prac-1-a","text":"Nhận một Predicate\u003cT\u003e, trả về stream mới chỉ gồm các phần tử thỏa điều kiện Predicate"},{"id":"day10-prac-1-b","text":"Nhận một Function\u003cT,R\u003e, biến đổi từng phần tử sang kiểu mới"},{"id":"day10-prac-1-c","text":"Nhận một Comparator\u003cT\u003e, sắp xếp lại stream"},{"id":"day10-prac-1-d","text":"Nhận một Consumer\u003cT\u003e, in ra từng phần tử rồi trả về stream rỗng"}],"correctChoiceIds":["day10-prac-1-a"],"hint":"Xem lại định nghĩa filter() là intermediate operation lọc phần tử.","solution":"day10-prac-1-a","explanation":"filter() là intermediate operation, luôn nhận Predicate\u003cT\u003e (điều kiện trả về boolean) và giữ lại những phần tử thỏa điều kiện đó.","rubric":"Chọn đúng kiểu tham số và hành vi của filter().","sourceUsage":["day10-src-1"]},{"id":"day10-prac-2","type":"predict-output","interaction":"multiple-choice","prompt":"Cho `List\u003cInteger\u003e nums = List.of(1, 2, 3, 4, 5, 6);` và `nums.stream().filter(n -\u003e n % 2 == 0 \u0026\u0026 n \u003e 2).collect(Collectors.toList())`. Kết quả trả về là gì?","choices":[{"id":"day10-prac-2-a","text":"[4, 6]"},{"id":"day10-prac-2-b","text":"[2, 4, 6]"},{"id":"day10-prac-2-c","text":"[1, 3, 5]"},{"id":"day10-prac-2-d","text":"[3, 4, 5, 6]"}],"correctChoiceIds":["day10-prac-2-a"],"hint":"Áp dụng cả hai điều kiện \u0026\u0026 cùng lúc cho từng phần tử.","solution":"day10-prac-2-a","explanation":"Điều kiện kết hợp 'n % 2 == 0 \u0026\u0026 n \u003e 2' chỉ giữ lại các số chẵn và lớn hơn 2: trong dãy [1..6] chỉ có 4 và 6 thỏa cả hai điều kiện.","rubric":"Đánh giá đúng kết quả lọc theo nhiều điều kiện kết hợp bằng \u0026\u0026.","sourceUsage":["day10-src-2"]},{"id":"day10-prac-3","type":"coding","interaction":"self-check","prompt":"Cho record Employee(String name, String department, double salary). Viết một method trả về danh sách tên (String) các Employee có department là \"IT\" và salary \u003e= 20000000, dùng Stream API.","choices":[],"correctChoiceIds":[],"hint":"Kết hợp filter() với điều kiện \u0026\u0026 rồi map() sang String tên trước khi collect.","solution":"List\u003cString\u003e filterItStaff(List\u003cEmployee\u003e employees) {\n    return employees.stream()\n            .filter(e -\u003e e.department().equals(\"IT\") \u0026\u0026 e.salary() \u003e= 20000000)\n            .map(Employee::name)\n            .collect(Collectors.toList());\n}","explanation":"Bài tập kết hợp filter() (lọc nhiều điều kiện) và map() trong cùng một pipeline.","rubric":"Đánh giá đúng thứ tự filter() trước map(), điều kiện lọc đúng, kết quả là danh sách tên (không còn nguyên Employee).","sourceUsage":["day10-src-2"]},{"id":"day10-prac-4","type":"concept","interaction":"self-check","prompt":"Vì sao nên dùng Optional\u
