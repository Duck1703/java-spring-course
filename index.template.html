<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Khóa học Java 17 và Spring Boot 3.x theo lộ trình thực hành.">
  <title>Java Spring Boot Course</title>
  <style id="app-styles">
    /* ============================================================
       Design tokens — Java Spring Boot Course
       Palette: cold paper canvas, ink text; Java orange and Spring
       green are semantic group accents only. Code blocks stay dark
       in both themes (the signature reading surface).
       ============================================================ */
    :root {
      --java: #f89820;
      --java-soft: rgba(248, 152, 32, .14);
      --spring: #6db33f;
      --spring-soft: rgba(109, 179, 63, .14);
      --completion: #64748b;
      --completion-soft: rgba(100, 116, 139, .14);
      --ink: #172033;
      --muted: #667085;
      --canvas: #f5f7f8;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --line: #dfe4e8;
      --line-strong: #c6ced6;
      --ok: #15803d;
      --info: #2563eb;
      --danger: #dc2626;
      --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
      --code-head: rgba(127, 127, 127, .09);
      --code-bg: #111827;
      --code-ink: #e5edf7;
      --focus: #2563eb;
      --header-h: 4rem;
      --sidebar-w: 19rem;
      --content-max: 48rem;
      --radius-sm: .5rem;
      --radius-md: .875rem;
      --shadow-float: 0 18px 50px rgb(15 23 42 / .12);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --java-soft: rgba(248, 152, 32, .18);
      --spring-soft: rgba(109, 179, 63, .18);
      --completion-soft: rgba(100, 116, 139, .22);
      --ink: #edf2f7;
      --muted: #a8b3c2;
      --canvas: #0d1117;
      --surface: #121922;
      --surface-raised: #17202b;
      --line: #2a3543;
      --line-strong: #43505f;
      --ok: #4ade80;
      --info: #60a5fa;
      --danger: #f87171;
      --code-head: rgba(127, 127, 127, .14);
      --code-bg: #080c12;
      --code-ink: #e6edf3;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      background: var(--canvas);
      color: var(--ink);
    }
    code, pre, kbd {
      font-family: "Cascadia Code", "Consolas", ui-monospace, monospace;
    }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 200;
      background: var(--surface-raised);
      color: var(--ink);
      padding: .6rem 1rem;
      border-radius: 0 0 var(--radius-sm) 0;
      border: 1px solid var(--line);
    }
    .skip-link:focus { left: 0; }

    /* ============ Header ============ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: .75rem;
      height: var(--header-h);
      padding-inline: 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    /* Brand mark: two stacked blocks — Java orange over Spring green —
       a literal nod to the layered platform stack. */
    .brand-mark {
      width: 1.35rem;
      height: 1.35rem;
      flex-shrink: 0;
    }
    .brand-mark span { display: block; height: 50%; }
    .brand-mark .mark-top { background: var(--java); border-radius: 3px 3px 0 0; }
    .brand-mark .mark-bottom { background: var(--spring); border-radius: 0 0 3px 3px; }
    .header-search { margin-left: auto; position: relative; }
    .header-search label {
      position: absolute;
      left: -9999px;
    }
    .header-search input {
      width: min(16rem, 42vw);
      padding: .45rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--canvas);
      color: var(--ink);
      font: inherit;
      font-size: .875rem;
    }
    #header-progress { display: flex; align-items: center; gap: .5rem; }
    .progress-meter {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress-meter meter {
      width: 6rem;
      height: .5rem;
      accent-color: var(--spring);
    }
    .theme-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 1rem;
    }

    /* ============ Frame ============ */
    .app-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 120rem;
      margin-inline: auto;
    }

    /* Sidebar / curriculum rail */
    .course-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    #curriculum-nav { padding: .75rem .75rem 2rem; }
    .group-label {
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.25rem .5rem .35rem;
    }
    .module-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      width: 100%;
      padding: .5rem .625rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: .875rem;
      text-align: left;
      cursor: pointer;
    }
    .module-toggle:hover { background: var(--canvas); }
    .module-toggle .chevron { transition: transform .15s ease; }
    .module-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .lesson-list { list-style: none; margin: .15rem 0 .35rem; padding: 0; }
    .lesson-link {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      padding: .35rem .625rem .35rem 1.4rem;
      border-radius: var(--radius-sm);
      color: var(--ink);
      text-decoration: none;
      font-size: .8438rem;
      line-height: 1.4;
    }
    .lesson-link:hover { background: var(--canvas); }
    .lesson-link[aria-current="page"] {
      background: var(--canvas);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent, var(--focus));
    }
    .lesson-state {
      flex-shrink: 0;
      font-size: .75rem;
      line-height: 1;
    }
    .lesson-state[data-done="true"] { color: var(--spring); }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Drawer backdrop */
    .drawer-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgb(15 23 42 / .45);
      z-index: 90;
      border: 0;
      padding: 0;
    }

    main#main-content { outline: none; }
    #route-view { padding-block: 1.5rem 4rem; }

    /* ============ Responsive ============ */
    @media (min-width: 64rem) {
      .menu-button { display: none; }
      .drawer-backdrop { display: none !important; }
      .app-frame { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
      .course-sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100dvh - var(--header-h));
        overflow-y: auto;
      }
      .lesson-shell { padding-inline: clamp(1.5rem, 4vw, 3rem); }
    }
    @media (max-width: 63.999rem) {
      .course-sidebar {
        position: fixed;
        top: var(--header-h);
        bottom: 0;
        left: 0;
        width: min(20rem, 85vw);
        z-index: 95;
        overflow-y: auto;
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--shadow-float);
      }
      body.drawer-open .course-sidebar { transform: translateX(0); }
      body.drawer-open { overflow: hidden; }
      .lesson-shell { padding-inline: clamp(1rem, 4vw, 2rem); }
    }
    /* Desktop never shows drawer state even if body class lingers */
    @media (min-width: 64rem) {
      body.drawer-open { overflow: auto; }
      body.drawer-open .drawer-backdrop { display: none; }
    }
    @media (max-width: 30rem) {
      .progress-meter .progress-text-long { display: none; }
      .header-search input { width: 9rem; }
      .brand .brand-name-long { display: none; }
    }

    pre { max-width: 100%; overflow-x: auto; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .app-header, .course-sidebar, .drawer-backdrop, #toast-region { display: none !important; }
      .app-frame { display: block; }
      .lesson-shell { max-width: none; padding: 0; }
      .ref-url { display: inline !important; }
    }

    /* Toast */
    #toast-region {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: var(--canvas);
      padding: .55rem 1rem;
      border-radius: 999px;
      font-size: .8438rem;
      box-shadow: var(--shadow-float);
    }

    /* Lesson body (Site Task 4) */
    .lesson-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: .375rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: .75rem;
    }
    .lesson-breadcrumb a { color: var(--muted); text-decoration: none; }
    .lesson-breadcrumb a:hover { color: var(--accent, var(--spring)); text-decoration: underline; }
    .lesson-header { margin-bottom: 2rem; }
    .lesson-title {
      font-size: 1.75rem;
      line-height: 1.25;
      margin: 0 0 .625rem;
      letter-spacing: -0.01em;
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .chip {
      display: inline-block;
      padding: .1875rem .5625rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: .75rem;
      color: var(--ink);
      background: var(--surface);
    }
    .lesson-summary {
      border-left: 3px solid var(--accent, var(--spring));
      padding: .75rem 1rem;
      background: var(--surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: .9375rem;
      line-height: 1.65;
      color: var(--muted);
    }
    .lesson-columns { display: grid; gap: 1.5rem; grid-template-columns: 1fr; margin-bottom: 2rem; }
    @media (min-width: 48rem) { .lesson-columns.twocol { grid-template-columns: 1fr 1fr; } }
    .lesson-column h2 {
      font-size: .8125rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .5rem;
    }
    .lesson-column ul { margin: 0; padding-left: 1.125rem; font-size: .875rem; line-height: 1.65; }
    .section-block { margin-bottom: 2.5rem; }
    .section-heading {
      font-size: 1.25rem;
      margin: 0 0 1rem;
      padding-bottom: .375rem;
      border-bottom: 1px solid var(--line);
    }
    .prose > p { margin: 0 0 1rem; line-height: 1.7; }
    .callout {
      border-left: 3px solid var(--muted);
      background: var(--surface);
      padding: .75rem 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 0 0 1rem;
      font-size: .9063rem;
      line-height: 1.65;
    }
    .callout--note { border-left-color: var(--info); }
    .callout--important { border-left-color: var(--java); }
    .callout--warning { border-left-color: var(--danger); }
    .code-sample { margin: 0 0 1rem; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
    .code-sample figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      padding: .4375rem .75rem;
      background: var(--code-head, rgba(127,127,127,.08));
      border-bottom: 1px solid var(--line);
      font-size: .7813rem;
      color: var(--muted);
    }
    .code-sample pre {
      margin: 0;
      padding: .875rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      font-size: .8438rem;
      line-height: 1.55;
      tab-size: 2;
    }
    .copy-btn {
      flex-shrink: 0;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .75rem;
      padding: .1875rem .5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--spring); color: var(--spring); }
    .data-table-wrap { overflow-x: auto; margin: 0 0 1rem; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8438rem; line-height: 1.55; }
    .data-table caption { text-align: left; font-weight: 600; padding: 0 0 .5rem; color: var(--muted); font-size: .8125rem; }
    .data-table th, .data-table td { border: 1px solid var(--line); padding: .4375rem .625rem; text-align: left; vertical-align: top; }
    .data-table th { background: var(--surface); }
    .citation-link {
      font-size: .6875rem;
      vertical-align: super;
      text-decoration: none;
      margin-left: .0625rem;
      color: var(--accent, var(--spring));
      font-family: var(--mono);
    }
    .authoring-warning {
      border: 1px dashed var(--danger);
      color: var(--danger);
      background: transparent;
      padding: .625rem .875rem;
      border-radius: var(--radius-sm);
      font-size: .8438rem;
      margin: 0 0 1rem;
    }
    /* Practice cards */
    .practice-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin: 0 0 1rem;
      overflow: hidden;
    }
    .practice-head { padding: .875rem 1rem .5rem; }
    .practice-kind {
      display: inline-block;
      font-size: .6875rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent, var(--spring));
      font-weight: 700;
      margin-bottom: .375rem;
    }
    .practice-prompt { margin: 0; font-size: .9375rem; line-height: 1.6; font-weight: 500; }
    .practice-body { padding: 0 1rem 1rem; }
    .practice-starter pre {
      margin: 0 0 .75rem;
      padding: .75rem 1rem;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      overflow-x: auto;
    }
    .practice-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .625rem; }
    .disclosure-btn {
      border: 1px solid var(--line-strong);
      background: var(--canvas);
      color: var(--ink);
      font-size: .8125rem;
      padding: .375rem .75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .disclosure-btn[aria-expanded="true"] { background: var(--surface-strong, var(--line)); }
    .disclosure-panel { margin-top: .625rem; font-size: .875rem; line-height: 1.65; }
    .disclosure-panel[hidden] { display: none; }
    .choice-list { list-style: none; margin: 0 0 .625rem; padding: 0; display: grid; gap: .375rem; }
    .choice-item label {
      display: flex;
      gap: .5rem;
      align-items: baseline;
      padding: .4375rem .625rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .875rem;
      line-height: 1.5;
    }
    .choice-item input { accent-color: var(--spring); }
    .choice-item.is-correct label { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
    .choice-item.is-wrong label { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
    .check-feedback { margin: .625rem 0 0; font-size: .875rem; line-height: 1.6; padding: .5625rem .75rem; border-radius: var(--radius-sm); }
    .check-feedback.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid var(--ok); }
    .check-feedback.wrong { background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid var(--danger); }
    /* Assignments */
    .assignments-block { margin: 2.5rem 0; }
    .assignments-block h2 { font-size: 1.125rem; margin: 0 0 .75rem; }
    .assignment-item {
      border: 1px solid var(--line);
      border-left: 3px solid var(--java);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--surface);
      padding: .75rem 1rem;
      margin-bottom: .625rem;
      font-size: .875rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .assignment-origin {
      display: inline-block;
      font-size: .6875rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: .375rem;
    }
    /* References */
    .references-block h2 { font-size: 1.125rem; margin: 0 0 .75rem; }
    .ref-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: .75rem 1rem;
      margin-bottom: .625rem;
      font-size: .875rem;
      scroll-margin-top: 5rem;
    }
    .ref-card-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .25rem; }
    .ref-num { color: var(--accent, var(--spring)); font-weight: 700; font-family: var(--mono); font-size: .8125rem; }
    .ref-card a { color: var(--spring); word-break: break-all; }
    .badge-read {
      display: inline-block;
      font-size: .6875rem;
      padding: .125rem .5rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ok) 15%, transparent);
      color: var(--ok);
      border: 1px solid var(--ok);
      font-weight: 600;
    }
    .badge-domain { font-size: .6875rem; color: var(--muted); }
    .ref-locators { margin: .375rem 0 0; padding-left: 1.125rem; color: var(--muted); font-size: .7813rem; }
    details.ref-unavailable { margin-top: 1rem; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: .625rem .875rem; }
    details.ref-unavailable summary { cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--muted); }
    details.ref-unavailable .ref-card { border-style: dashed; }
    /* Lesson footer nav */
    .lesson-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .625rem;
      align-items: stretch;
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }
    .lesson-nav a, .lesson-nav button {
      font-size: .8438rem;
      padding: .5625rem .75rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
    }
    .lesson-nav a:hover, .lesson-nav button:hover { border-color: var(--spring); }
    .lesson-nav .nav-next { text-align: right; }
    .lesson-nav .nav-complete {
      white-space: nowrap;
      min-width: 7rem;
      text-align: center;
    }
    .lesson-nav .nav-complete[aria-pressed="true"] {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .nav-label { display: block; font-size: .6875rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

    /* Dashboard settings (Site Task 5) */
    .settings-block { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    .settings-block details { margin-bottom: .625rem; }
    .settings-block summary {
      cursor: pointer;
      font-size: .9063rem;
      font-weight: 600;
      color: var(--muted);
    }
    .settings-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 0 0; }
    .settings-btn {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .8125rem;
      padding: .4375rem .8125rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .settings-btn:hover { border-color: var(--spring); color: var(--spring); }
    .settings-btn--danger:hover { border-color: var(--danger); color: var(--danger); }
    .import-preview {
      margin-top: .625rem;
      padding: .625rem .75rem;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      line-height: 1.6;
    }
    .import-preview[hidden] { display: none; }
  </style>
  <script>
    /* Theme bootstrap: runs before first paint to avoid a light/dark flash. */
    (function() {
      try {
        var raw = localStorage.getItem("java-spring-course");
        var theme = raw ? (JSON.parse(raw).theme || "system") : "system";
        var resolved = theme === "dark" ? "dark"
          : theme === "light" ? "light"
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme",
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung</a>
  <div id="app" aria-live="off"></div>
  <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="course-data" type="application/json">{}</script>
  <script id="app-script">
    /* ============================================================
*/ /* COURSE_CORE_START */ /*
       pure logic, no DOM access.
       Tested by tests/site_core.test.js in node:vm.
       ============================================================ */
    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      return { view: "dashboard" };
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    const STATE_VERSION = 1;

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      escapeHtml, safeExternalUrl,
    });
    /* COURSE_CORE_END */

    /* ============================================================
       App bootstrap: data parse, indices, shell rendering, routing,
       curriculum navigation, dashboard, search panel (Site Task 3).
       ============================================================ */
    (function () {
      /* ---- data parse ------------------------------------------------ */
      let courseData;
      try {
        courseData = JSON.parse(document.getElementById("course-data").textContent);
      } catch(e) {
        document.getElementById("app").innerHTML = '<pre style="padding:2rem;color:red;">Loi tai du lieu khoa hoc.</pre>';
        throw e;
      }
      const lessonsById = new Map(courseData.lessons.map(function(l){return [l.id,l];}));
      const unitsById = new Map(courseData.units.map(function(u){return [u.id,u];}));

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {
        (l.practices || []).forEach(function(p) { acc.push(p.id); });
        return acc;
      }, []));
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? CourseCore.sanitizeState(JSON.parse(raw), LESSON_IDS, UNIT_IDS, PRACTICE_IDS) : null;
        } catch(e) { return null; }
      }
      function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
      var loaded = loadState();
      if (loaded) state = loaded;

      /* ---- render helpers -------------------------------------------- */
      function updateProgress() {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var bar = document.getElementById('progress-bar');
        if (bar) { bar.value = String(p.completed); bar.setAttribute('max', String(p.total || 1)); }
        var txt = document.querySelector('.progress-text-long');
        if (txt) txt.textContent = p.completed + '/' + p.total + ' bai';
      }
      function setAriaCurrent(id) {
        document.querySelectorAll('.lesson-link[aria-current]').forEach(function(a){a.removeAttribute('aria-current');});
        var link = document.querySelector('.lesson-link[data-lesson-id="' + id + '"]');
        if (link) link.setAttribute('aria-current', 'page');
      }

      /* ---- curriculum nav ------------------------------------------- */
      function renderSidebar() {
        var nav = document.getElementById('curriculum-nav');
        if (!nav) return;
        nav.textContent = '';
        var GROUPS = [{key:'java',label:'Java'},{key:'spring',label:'Spring Boot'},{key:'completion',label:'Hoan thanh'}];
        var ACCENT = {java:'var(--java)',spring:'var(--spring)',completion:'var(--completion)'};
        GROUPS.forEach(function(g) {
          var units = courseData.units.filter(function(u){return u.group===g.key;});
          if (!units.length) return;
          var label = document.createElement('div');
          label.className = 'group-label';
          label.textContent = g.label;
          nav.appendChild(label);
          units.forEach(function(unit) {
            var toggle = document.createElement('button');
            toggle.className = 'module-toggle';
            toggle.setAttribute('aria-expanded', state.collapsedUnits.indexOf(unit.id)===-1 ? 'true' : 'false');
            toggle.setAttribute('aria-controls', 'lessons-' + unit.id);
            toggle.setAttribute('data-unit-id', unit.id);
            toggle.innerHTML = '<span>' + unit.number + '. ' + unit.title + '</span><span class="chevron" aria-hidden="true">&#9660;</span>';
            toggle.onclick = function() {
              var expanded = toggle.getAttribute('aria-expanded')==='true';
              toggle.setAttribute('aria-expanded', expanded?'false':'true');
              var list = document.getElementById('lessons-' + unit.id);
              if (list) list.hidden = expanded;
              if (expanded) { if (state.collapsedUnits.indexOf(unit.id)===-1) state.collapsedUnits.push(unit.id); }
              else { state.collapsedUnits = state.collapsedUnits.filter(function(x){return x!==unit.id;}); }
              saveState();
            };
            nav.appendChild(toggle);
            var list = document.createElement('ul');
            list.className = 'lesson-list';
            list.id = 'lessons-' + unit.id;
            list.setAttribute('role', 'list');
            (unit.lessonIds||[]).forEach(function(lid) {
              var lesson = lessonsById.get(lid);
              if (!lesson) return;
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.className = 'lesson-link';
              a.href = '#lesson/' + lid;
              a.setAttribute('data-lesson-id', lid);
              a.style.setProperty('--accent', ACCENT[lesson.group] || ACCENT.completion);
              var done = state.completed.indexOf(lid) !== -1;
              a.innerHTML = '<span class="lesson-state" data-done="' + done + '">&#' + (done ? '9745;' : '9711;') + '</span><span>' + (lesson.title || lid) + '</span>';
              a.onclick = function() { closeDrawer(); };
              li.appendChild(a);
              list.appendChild(li);
            });
            nav.appendChild(list);
          });
        });
        setAriaCurrent(state.lastLessonId);
      }

      /* ---- route render ---------------------------------------------- */
      function routeRender() {
        var route = CourseCore.parseRoute(window.location.hash);
        var view = document.getElementById('route-view');
        if (!view) return;
        view.textContent = '';
        if (route.view === 'lesson') renderLessonView(view, route.lessonId);
        else if (route.view === 'resources') renderResourcesView(view);
        else renderDashboard(view);
        setAriaCurrent(route.lessonId || state.lastLessonId);
      }
      window.addEventListener('hashchange', function(){ routeRender(); });

      /* ---- dashboard ------------------------------------------------- */
      function renderDashboard(container) {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var jp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'java');
        var sp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'spring');
        var h1 = document.createElement('h1');
        h1.textContent = 'Tong quan khoa hoc';
        h1.style.fontSize = '1.75rem';
        h1.style.marginBottom = '1rem';
        container.appendChild(h1);
        var stats = document.createElement('div');
        stats.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.75rem;margin-bottom:2rem;';
        [['Tien do chung', p.completed + '/' + p.total + ' bai (' + p.percent + '%)'],
         ['Java', jp.completed + '/' + jp.total + ' bai'],
         ['Spring Boot', sp.completed + '/' + sp.total + ' bai']].forEach(function(s) {
          var card = document.createElement('div');
          card.style.cssText = 'background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1rem;';
          card.innerHTML = '<div style="font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem;">' + s[0] + '</div><div style="font-size:1.25rem;font-weight:700;">' + s[1] + '</div>';
          stats.appendChild(card);
        });
        container.appendChild(stats);

        /* Continue learning */
        var unfinished = courseData.lessons.find(function(l){return state.completed.indexOf(l.id)===-1;});
        var target = (state.lastLessonId && lessonsById.has(state.lastLessonId) && state.completed.indexOf(state.lastLessonId)===-1) ? state.lastLessonId : (unfinished ? unfinished.id : 'day-01');
        var continueBtn = document.createElement('a');
        continueBtn.href = '#lesson/' + target;
        continueBtn.style.cssText = 'display:inline-block;padding:.75rem 1.5rem;background:var(--spring);color:#fff;border-radius:var(--radius-sm);text-decoration:none;font-weight:600;margin-bottom:2rem;';
        continueBtn.textContent = state.completed.length > 0 ? 'Hoc tiep' : 'Bat dau hoc';
        container.appendChild(continueBtn);

        /* Unit overview */
        var uh = document.createElement('h2');
        uh.textContent = 'Don vi hoc tap';
        uh.style.fontSize = '1.125rem';
        uh.style.marginBottom = '.75rem';
        container.appendChild(uh);
        var ug = document.createElement('div');
        ug.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.625rem;';
        courseData.units.forEach(function(u) {
          var uc = document.createElement('a');
          uc.href = '#lesson/' + u.lessonIds[0];
          uc.style.cssText = 'display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.75rem;text-decoration:none;color:var(--ink);font-size:.875rem;';
          uc.innerHTML = '<div style="font-weight:600;margin-bottom:.25rem;">' + u.number + '. ' + u.title + '</div><div style="color:var(--muted);font-size:.75rem;">' + u.lessonIds.length + ' bai hoc</div>';
          ug.appendChild(uc);
        });
        container.appendChild(ug);
        renderSettingsBlock(container);
      }

      /* ---- settings: export / import / reset (Site Task 5) -------------- */
      var APP_SCHEMA = { app: "java-spring-course", schemaVersion: 1 };

      function downloadProgress() {
        var payload = {
          app: APP_SCHEMA.app,
          schemaVersion: APP_SCHEMA.schemaVersion,
          exportedAt: new Date().toISOString(),
          state: state,
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = el("a");
        a.href = url;
        a.download = "java-spring-course-tien-do.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        showToast("Đã tải tệp tiến độ");
      }

      function importProgressText(text, previewEl, confirmBtn) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không phải JSON hợp lệ.";
          return;
        }
        if (!parsed || parsed.app !== APP_SCHEMA.app || parsed.schemaVersion !== APP_SCHEMA.schemaVersion) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không đúng định dạng tiến độ của khóa học (app/schemaVersion không khớp).";
          return;
        }
        var cleaned = CourseCore.sanitizeState(parsed.state, LESSON_IDS, UNIT_IDS, PRACTICE_IDS);
        previewEl.hidden = false;
        previewEl.textContent = "Sẵn sàng nhập: " + cleaned.completed.length + "/" + courseData.lessons.length +
          " bài đã hoàn thành. Nhấn “Xác nhận nhập” để thay thế tiến độ hiện tại.";
        confirmBtn.hidden = false;
        confirmBtn.onclick = function() {
          state = cleaned;
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          previewEl.textContent = "Đã nhập tiến độ thành công.";
          confirmBtn.hidden = true;
          showToast("Tiến độ đã được nhập");
        };
      }

      function renderSettingsBlock(container) {
        var block = el("div", "settings-block");
        var details = el("details");
        details.appendChild(el("summary", null, "Cài đặt dữ liệu học tập"));
        var actions = el("div", "settings-actions");

        var exportBtn = el("button", "settings-btn", "Tải tiến độ (.json)");
        exportBtn.type = "button";
        exportBtn.setAttribute("data-action", "export-progress");
        exportBtn.addEventListener("click", downloadProgress);
        actions.appendChild(exportBtn);

        var importLabel = el("label", "settings-btn", "Nhập tiến độ (.json)");
        var fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".json,application/json";
        fileInput.style.display = "none";
        importLabel.appendChild(fileInput);
        actions.appendChild(importLabel);

        var resetBtn = el("button", "settings-btn settings-btn--danger", "Đặt lại tiến độ");
        resetBtn.type = "button";
        resetBtn.setAttribute("data-action", "reset-progress");
        actions.appendChild(resetBtn);

        var preview = el("div", "import-preview");
        preview.hidden = true;
        var confirmBtn = el("button", "settings-btn", "Xác nhận nhập");
        confirmBtn.type = "button";
        confirmBtn.hidden = true;

        fileInput.addEventListener("change", function() {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { importProgressText(String(reader.result), preview, confirmBtn); };
          reader.onerror = function() {
            preview.hidden = false;
            preview.textContent = "Không đọc được tệp đã chọn.";
          };
          reader.readAsText(file);
          fileInput.value = "";
        });

        resetBtn.addEventListener("click", function() {
          if (!window.confirm("Đặt lại toàn bộ tiến độ? Hành động này xóa trạng thái hoàn thành, bài đang học và cài đặt giao diện đã lưu trên máy bạn.")) return;
          state = CourseCore.defaultState();
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          showToast("Đã đặt lại tiến độ");
        });

        details.appendChild(actions);
        details.appendChild(preview);
        details.appendChild(confirmBtn);
        block.appendChild(details);
        container.appendChild(block);
      }

      /* ---- lesson renderer (Site Task 4) ------------------------------ */
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      var GROUP_LABELS = { java: "Java", spring: "Spring Boot", completion: "Hoàn thành" };
      var PRACTICE_KIND_LABELS = {
        "concept": "Khái niệm",
        "predict-output": "Dự đoán kết quả",
        "coding": "Luyện code",
        "applied": "Vận dụng"
      };
      var CALLOUT_CLASS = { note: "callout--note", important: "callout--important", warning: "callout--warning" };
      var ALLOWED_BLOCK_TYPES = ["paragraph", "note", "important", "warning", "code", "table"];
      var currentLessonId = null;

      function lessonIdSlug(id) {
        return String(id).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      /* Citations -> numbered superscript links pointing at the reference cards. */
      function appendCitations(parent, citations, refIndexById) {
        if (!citations || !citations.length) return;
        citations.forEach(function(cid, i) {
          var key = String(cid).toLowerCase();
          var idx = refIndexById.get(key);
          var a = el("a", "citation-link", "[" + (idx != null ? idx : "?") + "]");
          a.href = "#ref-" + lessonIdSlug(currentLessonId) + "-" + (idx != null ? idx : key);
          a.setAttribute("aria-label", "Nguồn tham chiếu " + (idx != null ? idx : cid));
          parent.appendChild(a);
          if (i < citations.length - 1) parent.appendChild(document.createTextNode(" "));
        });
      }

      function proseParagraph(text, citations, refIndexById) {
        var p = el("p");
        p.appendChild(document.createTextNode(text == null ? "" : String(text)));
        appendCitations(p, citations, refIndexById);
        return p;
      }

      function renderBlock(container, block, refIndexById) {
        var type = block.type;
        if (ALLOWED_BLOCK_TYPES.indexOf(type) === -1) {
          container.appendChild(el("div", "authoring-warning",
            "[Cảnh báo biên soạn] Khối nội dung không hỗ trợ: \"" + type + "\" — đã ẩn để tránh hiển thị sai."));
          return;
        }
        if (type === "code") {
          var fig = el("figure", "code-sample");
          var cap = el("figcaption");
          cap.appendChild(el("span", null, block.language ? block.language.toUpperCase() + (block.compile === false && block.partialReason ? " — không biên dịch độc lập" : "") : ""));
          var copyBtn = el("button", "copy-btn", "Sao chép mã");
          copyBtn.type = "button";
          copyBtn.setAttribute("data-action", "copy-code");
          copyBtn.setAttribute("aria-label", "Sao chép mã mẫu vào clipboard");
          copyBtn.addEventListener("click", function() {
            copyText(block.code || "").then(function() { showToast("Đã sao chép mã"); },
              function() { showToast("Không thể sao chép tự động — hãy chọn mã và sao chép thủ công."); });
          });
          cap.appendChild(copyBtn);
          fig.appendChild(cap);
          var pre = el("pre");
          pre.appendChild(el("code", null, block.code || ""));
          fig.appendChild(pre);
          container.appendChild(fig);
          return;
        }
        if (type === "table") {
          var wrap = el("div", "data-table-wrap");
          var table = el("table", "data-table");
          var cols = block.columns || [];
          table.appendChild(el("caption", null, cols.join(" · ")));
          var thead = el("thead");
          var hr = el("tr");
          cols.forEach(function(c) { hr.appendChild(el("th", null, c)); });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tbody = el("tbody");
          (block.rows || []).forEach(function(row) {
            var tr = el("tr");
            row.forEach(function(cell, ci) {
              var td = el(ci < cols.length - 1 ? "td" : "td");
              td.appendChild(document.createTextNode(cell == null ? "" : String(cell)));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          return;
        }
        if (type === "note" || type === "important" || type === "warning") {
          var aside = el("aside", "callout " + (CALLOUT_CLASS[type] || ""));
          aside.setAttribute("role", type === "warning" ? "alert" : "note");
          var labelSpan = el("strong", null, (type === "note" ? "Ghi chú: " : type === "important" ? "Quan trọng: " : "Lưu ý: "));
          aside.appendChild(labelSpan);
          aside.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
          appendCitations(aside, block.citations, refIndexById);
          container.appendChild(aside);
          return;
        }
        /* paragraph */
        container.appendChild(proseParagraph(block.text, block.citations, refIndexById));
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function() { return "clipboard"; });
        }
        return new Promise(function(resolve, reject) {
          var area = Object.assign(document.createElement("textarea"), { value: text });
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          area.remove();
          if (!ok) reject(new Error("copy unavailable")); else resolve("fallback");
        });
      }

      function showToast(message) {
        var region = document.getElementById("toast-region");
        if (!region) return;
        var t = el("div", "toast", message);
        region.appendChild(t);
        setTimeout(function() { t.remove(); }, 2600);
      }

      function renderLessonHeader(container, lesson, refIndexById) {
        var crumb = el("nav", "lesson-breadcrumb");
        crumb.setAttribute("aria-label", "Đường dẫn bài học");
        var g = el("a", null, GROUP_LABELS[lesson.group] || lesson.group);
        g.href = "#dashboard";
        crumb.appendChild(g);
        crumb.appendChild(el("span", null, "/"));
        var unit = courseData.units.find(function(x){ return x.id === lesson.unitId; });
        var u = el("a", null, "Unit " + lesson.unitNumber + ": " + (lesson.unitTitle || ""));
        if (unit && unit.lessonIds && unit.lessonIds.length) u.href = "#lesson/" + unit.lessonIds[0];
        crumb.appendChild(u);
        crumb.appendChild(el("span", null, "/"));
        crumb.appendChild(el("span", null, lesson.title));
        container.appendChild(crumb);

        var header = el("header", "lesson-header");
        header.appendChild(el("h1", "lesson-title", lesson.title));
        var meta = el("div", "lesson-meta");
        meta.appendChild(el("span", "chip", GROUP_LABELS[lesson.group] || lesson.group));
        if (lesson.durationMinutes) meta.appendChild(el("span", "chip", "~" + lesson.durationMinutes + " phút"));
        header.appendChild(meta);
        if (lesson.summary) {
          var s = el("div", "lesson-summary");
          s.setAttribute("role", "note");
          s.textContent = lesson.summary;
          header.appendChild(s);
        }
        container.appendChild(header);

        /* Prerequisites / outcomes columns */
        var hasCols = (lesson.prerequisites && lesson.prerequisites.length) ||
                      (lesson.outcomes && lesson.outcomes.length);
        if (hasCols) {
          var cols = el("div", "lesson-columns" + ((lesson.prerequisites && lesson.prerequisites.length) ? " twocol" : ""));
          if (lesson.prerequisites && lesson.prerequisites.length) {
            var c0 = el("div", "lesson-column");
            c0.appendChild(el("h2", null, "Yêu cầu trước khi học"));
            var ul0 = el("ul");
            lesson.prerequisites.forEach(function(item) { ul0.appendChild(el("li", null, item)); });
            c0.appendChild(ul0);
            cols.appendChild(c0);
          }
          if (lesson.outcomes && lesson.outcomes.length) {
            var c1 = el("div", "lesson-column");
            c1.appendChild(el("h2", null, "Sau bài này bạn sẽ"));
            var ul1 = el("ul");
            lesson.outcomes.forEach(function(item) { ul1.appendChild(el("li", null, item)); });
            c1.appendChild(ul1);
            cols.appendChild(c1);
          }
          container.appendChild(cols);
        }
      }

      function renderSections(container, lesson, refIndexById) {
        (lesson.sections || []).forEach(function(section) {
          var sec = el("section", "section-block");
          if (section.id) sec.id = section.id;
          sec.appendChild(el("h2", "section-heading", section.title || ""));
          (section.blocks || []).forEach(function(block) { renderBlock(sec, block, refIndexById); });
          container.appendChild(sec);
        });
      }


      /* ---- practice cards --------------------------------------------- */
      function disclosureButton(label, panelId) {
        var b = el("button", "disclosure-btn", label);
        b.type = "button";
        b.setAttribute("aria-expanded", "false");
        b.setAttribute("aria-controls", panelId);
        return b;
      }

      function wireDisclosure(btn, panel) {
        btn.addEventListener("click", function() {
          var open = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", open ? "false" : "true");
          panel.hidden = open;
        });
      }

      function renderPractice(container, practice) {
        var card = el("article", "practice-card");
        card.id = "practice-" + practice.id;
        var head = el("div", "practice-head");
        var kindLabel = PRACTICE_KIND_LABELS[practice.type] || practice.type;
        if (practice.interaction === "multiple-choice") kindLabel += " · trắc nghiệm";
        head.appendChild(el("div", "practice-kind", kindLabel));
        head.appendChild(el("p", "practice-prompt", practice.prompt || ""));
        card.appendChild(head);

        var body = el("div", "practice-body");
        if (practice.starterCode) {
          var starter = el("div", "practice-starter");
          var pre = el("pre");
          pre.appendChild(el("code", null, practice.starterCode));
          starter.appendChild(pre);
          body.appendChild(starter);
        }

        var mc = practice.interaction === "multiple-choice";

        if (mc && practice.choices && practice.choices.length) {
          var isMulti = (practice.correctChoiceIds || []).length > 1;
          var fieldset = el("fieldset");
          fieldset.style.cssText = "margin:0 0 .625rem;padding:0;border:none;";
          var legend = el("legend", "visually-hidden", isMulti ? "Chọn nhiều đáp án" : "Chọn một đáp án");
          fieldset.appendChild(legend);
          var list = el("ul", "choice-list");
          practice.choices.forEach(function(choice) {
            var li = el("li", "choice-item");
            li.setAttribute("data-choice-id", choice.id);
            var input = document.createElement("input");
            input.type = isMulti ? "checkbox" : "radio";
            input.name = "choice-" + practice.id;
            input.value = choice.id;
            input.id = choice.id;
            var label = el("label");
            label.htmlFor = choice.id;
            label.appendChild(input);
            label.appendChild(el("span", null, choice.text));
            li.appendChild(label);
            list.appendChild(li);
          });
          fieldset.appendChild(list);
          body.appendChild(fieldset);

          var checkBtn = el("button", "disclosure-btn", "Kiểm tra đáp án");
          checkBtn.type = "button";
          checkBtn.setAttribute("data-action", "check-practice");
          checkBtn.setAttribute("data-practice-id", practice.id);
          body.appendChild(checkBtn);

          var fb = el("div", "check-feedback");
          fb.id = "feedback-" + practice.id;
          fb.hidden = true;
          body.appendChild(fb);

          checkBtn.addEventListener("click", function() {
            var picked = Array.prototype.slice.call(
              body.querySelectorAll('input[name="choice-' + practice.id + '"]:checked')
            ).map(function(inp) { return inp.value; });
            if (!picked.length) { showToast("Hãy chọn ít nhất một đáp án trước khi kiểm tra."); return; }
            var correct = new Set(practice.correctChoiceIds || []);
            var allCorrect = picked.length === correct.size && picked.every(function(id){ return correct.has(id); });
            /* mark per-choice correctness */
            body.querySelectorAll(".choice-item").forEach(function(li) {
              var cid = li.getAttribute("data-choice-id");
              li.classList.remove("is-correct", "is-wrong");
              if (correct.has(cid)) li.classList.add("is-correct");
              else if (picked.indexOf(cid) !== -1) li.classList.add("is-wrong");
            });
            fb.className = "check-feedback " + (allCorrect ? "ok" : "wrong");
            fb.textContent = (allCorrect ? "Chính xác! " : "Chưa đúng. ") + (practice.explanation || "");
            fb.hidden = false;
            /* persist attempted state */
            state.practice[practice.id] = { attempted: true };
            saveState();
          });
        }

        var actions = el("div", "practice-actions");
        if (practice.hint) {
          var hintPanelId = "hint-" + practice.id;
          var hintBtn = disclosureButton("Gợi ý", hintPanelId);
          var hintPanel = el("div", "disclosure-panel");
          hintPanel.id = hintPanelId;
          hintPanel.hidden = true;
          hintPanel.textContent = practice.hint;
          actions.appendChild(hintBtn);
          body.appendChild(hintPanel);
          wireDisclosure(hintBtn, hintPanel);
        }
        if (practice.solution || (mc && practice.explanation)) {
          var solPanelId = "sol-" + practice.id;
          var solBtn = disclosureButton(mc ? "Xem giải thích" : "Xem lời giải", solPanelId);
          var solPanel = el("div", "disclosure-panel");
          solPanel.id = solPanelId;
          solPanel.hidden = true;
          var solutionText = mc
            ? ((practice.correctChoiceIds || []).join(", ") + (practice.explanation ? " — " + practice.explanation : ""))
            : [practice.solution, practice.explanation].filter(Boolean).join("\n\n");
          solPanel.textContent = solutionText;
          actions.appendChild(solBtn);
          body.appendChild(solPanel);
          wireDisclosure(solBtn, solPanel);
        }
        if (actions.childNodes.length) { body.appendChild(actions); }
        card.appendChild(body);
        container.appendChild(card);
      }

      function renderPractices(container, lesson) {
        if (!lesson.practices || !lesson.practices.length) return;
        var blockEl = el("section", "section-block");
        blockEl.appendChild(el("h2", "section-heading", "Luyện tập"));
        lesson.practices.forEach(function(p) { renderPractice(blockEl, p); });
        container.appendChild(blockEl);
      }


      /* ---- assignments (syllabus original vs enrichment) --------------- */
      function renderAssignments(container, lesson) {
        var syllabus = lesson.syllabusAssignments || [];
        var enhanced = lesson.enhancedExercises || [];
        if (!syllabus.length && !enhanced.length) return;
        var blockEl = el("section", "assignments-block");
        if (syllabus.length) {
          blockEl.appendChild(el("h2", null, "Bài tập trong syllabus"));
          syllabus.forEach(function(a) {
            var item = el("div", "assignment-item");
            item.appendChild(el("span", "assignment-origin", "Nội dung gốc · dòng " + a.row));
            item.appendChild(document.createTextNode("\n" + (a.text || "")));
            blockEl.appendChild(item);
          });
        }
        if (enhanced.length) {
          blockEl.appendChild(el("h2", null, "Luyện tập bổ sung"));
          enhanced.forEach(function(text) {
            var item = el("div", "assignment-item");
            item.style.borderLeftColor = "var(--spring)";
            item.appendChild(el("span", "assignment-origin", "Bổ sung"));
            item.appendChild(document.createTextNode("\n" + text));
            blockEl.appendChild(item);
          });
        }
        container.appendChild(blockEl);
      }

      /* ---- references with transparent read status ---------------------- */
      function renderReferences(container, lesson, refIndexById, refCards) {
        if (!lesson.references || !lesson.references.length) return;
        var blockEl = el("section", "references-block");
        blockEl.id = "references-" + lessonIdSlug(lesson.id);
        blockEl.appendChild(el("h2", null, "Nguồn tham chiếu"));

        lesson.references.forEach(function(ref, i) {
          var num = i + 1;
          refIndexById.set(String(ref.citationId || ref.id).toLowerCase(), num);
          var card = el("article", "ref-card");
          card.id = "ref-" + lessonIdSlug(lesson.id) + "-" + num;
          var headRow = el("div", "ref-card-head");
          headRow.appendChild(el("span", "ref-num", "[" + num + "]"));
          headRow.appendChild(el("strong", null, ref.label || ref.pageTitle || ref.resourceId));
          headRow.appendChild(el("span", "badge-domain", ref.url ? new URL(ref.url).hostname : ""));
          if (ref.readStatus === "read") headRow.appendChild(el("span", "badge-read", "đã đọc"));
          card.appendChild(headRow);
          if (ref.pageTitle) {
            card.appendChild(el("div", null, "Trang: " + ref.pageTitle));
          }
          if (ref.url) {
            var linkP = el("p");
            var a = el("a", "ref-url", ref.safeUrl || ref.url);
            a.href = CourseCore.safeExternalUrl(ref.url) || "#";
            if (a.href !== "#") {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            }
            linkP.appendChild(a);
            card.appendChild(linkP);
          }
          /* section backlink */
          var back = el("a", null, "↑ Về đầu bài học");
          back.href = "#lesson/" + lesson.id;
          back.style.cssText = "font-size:.75rem;color:var(--muted);text-decoration:none;display:inline-block;margin-top:.375rem;";
          back.addEventListener("click", function(ev) {
            ev.preventDefault();
            window.location.hash = "#lesson/" + lesson.id;
            setTimeout(function() { document.getElementById("main-content").focus(); }, 50);
          });
          card.appendChild(back);
          blockEl.appendChild(card);
          refCards.push({ ref: ref, num: num });
        });

        /* Supplied but inaccessible resources — separate disclosure. */
        var unavailable = (lesson.references || []).filter(function(r) { return r.readStatus !== "read"; });
        if (unavailable.length) {
          var details = el("details", "ref-unavailable");
          details.appendChild(el("summary", null,
            "Nguồn được cung cấp nhưng không truy cập được (" + unavailable.length + ")"));
          unavailable.forEach(function(ref) {
            var card = el("article", "ref-card");
            card.appendChild(el("strong", null, ref.label || ref.resourceId));
            card.appendChild(el("div", null, "Trạng thái kiểm tra: " + (ref.checkStatus || "không rõ")));
            if (ref.limitation) card.appendChild(el("div", null, "Giới hạn: " + ref.limitation));
            details.appendChild(card);
          });
          blockEl.appendChild(details);
        }
        container.appendChild(blockEl);
      }

      /* ---- footer navigation -------------------------------------------- */
      function renderLessonNav(container, lesson) {
        var prevId = CourseCore.nextLessonId(courseData.lessons, lesson.id, -1);
        var nextId = CourseCore.nextLessonId(courseData.lessons, lesson.id, 1);
        var nav = el("nav", "lesson-nav");
        nav.setAttribute("aria-label", "Điều hướng bài học");

        if (prevId) {
          var prevLesson = lessonsById.get(prevId);
          var prevA = el("a", "nav-prev");
          prevA.href = "#lesson/" + prevId;
          prevA.innerHTML = '<span class="nav-label">← Bài trước</span><span>' +
            CourseCore.escapeHtml(prevLesson ? prevLesson.title : prevId) + "</span>";
          nav.appendChild(prevA);
        } else {
          nav.appendChild(el("span"));
        }

        var done = state.completed.indexOf(lesson.id) !== -1;
        var toggleBtn = el("button", "nav-complete", done ? "✓ Đã hoàn thành" : "Đánh dấu hoàn thành");
        toggleBtn.type = "button";
        toggleBtn.setAttribute("data-action", "toggle-completion");
        toggleBtn.setAttribute("data-lesson-id", lesson.id);
        toggleBtn.setAttribute("aria-pressed", done ? "true" : "false");
        nav.appendChild(toggleBtn);

        if (nextId) {
          var nextLesson = lessonsById.get(nextId);
          var nextA = el("a", "nav-next");
          nextA.href = "#lesson/" + nextId;
          nextA.innerHTML = '<span class="nav-label">Bài sau →</span><span>' +
            CourseCore.escapeHtml(nextLesson ? nextLesson.title : nextId) + "</span>";
          nav.appendChild(nextA);
        } else {
          nav.appendChild(el("span"));
        }
        container.appendChild(nav);
      }

      /* ---- main lesson view ------------------------------------------------ */
      function renderFullLesson(container, lesson) {
        currentLessonId = lesson.id;
        var refIndexById = new Map();
        var refCards = [];

        renderLessonHeader(container, lesson, refIndexById);
        renderSections(container, lesson, refIndexById);
        renderPractices(container, lesson);
        renderAssignments(container, lesson);
        renderReferences(container, lesson, refIndexById, refCards);
        renderLessonNav(container, lesson);
        container.setAttribute("tabindex", "-1");
      }

      /* ---- route entry for lessons ---------------------------------------- */
      function renderLessonView(container, lessonId) {
        var lesson = lessonsById.get(lessonId);
        if (!lesson) {
          container.innerHTML = '<h1 style="margin:2rem 0;">Không tìm thấy bài học</h1><p>Bài học "' +
            CourseCore.escapeHtml(lessonId) + '" không tồn tại.</p><a href="#dashboard" style="color:var(--spring);">Về dashboard</a>';
          return;
        }
        state.lastLessonId = lessonId;
        saveState();
        if (lesson.kind === 'pending') {
          container.innerHTML = '<div style="padding:3rem 0;text-align:center;"><h1>' +
            CourseCore.escapeHtml(lesson.title) + '</h1>' +
            '<p style="color:var(--muted);margin-top:1rem;">Bài học này đang được biên soạn — nội dung sẽ được bổ sung trong giai đoạn tiếp theo.</p>' +
            '<p><a href="#dashboard" style="color:var(--spring);">← Về tổng quan</a></p></div>';
          return;
        }
        renderFullLesson(container, lesson);
      }

      /* ---- resources view (Site Task 6) ---------------------------------- */
      var RES_FILTERS = [
        { key: "all", label: "Tất cả" },
        { key: "read", label: "Đã đọc" },
        { key: "unavailable", label: "Không truy cập được" }
      ];

      function renderResourcesView(container) {
        var resources = courseData.resources || [];
        var h1 = el("h1", null, "Nguồn tài liệu");
        h1.style.cssText = "font-size:1.75rem;margin:0 0 .5rem;";
        container.appendChild(h1);
        container.appendChild(el("p", "lesson-summary",
          "Tổng hợp mọi nguồn được cung cấp trong giáo trình, kèm trạng thái kiểm tra và đọc minh bạch."));

        /* Filter bar + search */
        var bar = el("div", "res-filterbar");
        bar.style.cssText = "display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.25rem 0;";
        var filterGroup = el("div");
        filterGroup.setAttribute("role", "group");
        filterGroup.setAttribute("aria-label", "Lọc theo trạng thái đọc");
        var activeFilter = "all";
        var searchTerm = "";
        var listWrap = el("div");
        var totalEl = el("span", null, "");
        totalEl.style.cssText = "color:var(--muted);font-size:.8125rem;margin-left:auto;";

        function applyRender() {
          listWrap.textContent = "";
          var q = CourseCore.normalizeSearch(searchTerm);
          var shown = resources.filter(function(r) {
            if (activeFilter === "read" && r.readStatus !== "read") return false;
            if (activeFilter === "unavailable" && r.readStatus === "read") return false;
            if (!q) return true;
            var hay = CourseCore.normalizeSearch([
              r.label, r.pageTitle, r.url, (r.lessonIds || []).join(" "),
            ].join(" \n "));
            return hay.indexOf(q) !== -1;
          });
          totalEl.textContent = shown.length + "/" + resources.length + " nguồn";
          if (!shown.length) {
            listWrap.appendChild(el("p", null, "Không có nguồn nào khớp bộ lọc."));
            return;
          }
          shown.forEach(function(r) { listWrap.appendChild(renderResourceCard(r)); });
        }

        RES_FILTERS.forEach(function(f, i) {
          var b = el("button", "disclosure-btn" + (i === 0 ? " is-active" : ""), f.label);
          b.type = "button";
          b.setAttribute("data-filter", f.key);
          b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
          b.addEventListener("click", function() {
            activeFilter = f.key;
            bar.querySelectorAll("[data-filter]").forEach(function(x) {
              x.setAttribute("aria-pressed", x === b ? "true" : "false");
            });
            applyRender();
          });
          filterGroup.appendChild(b);
        });

        var searchBox = el("input");
        searchBox.type = "search";
        searchBox.placeholder = "Lọc theo tên, trang, bài học…";
        searchBox.setAttribute("aria-label", "Lọc nguồn tài liệu");
        searchBox.style.cssText = "padding:.4375rem .625rem;border:1px solid var(--line-strong);border-radius:var(--radius-sm);font-size:.8438rem;background:var(--surface);color:var(--ink);min-width:12rem;";
        searchBox.addEventListener("input", function() {
          searchTerm = searchBox.value;
          applyRender();
        });

        bar.appendChild(filterGroup);
        bar.appendChild(searchBox);
        bar.appendChild(totalEl);
        container.appendChild(bar);
        container.appendChild(listWrap);
        applyRender();
      }

      function renderResourceCard(r) {
        var card = el("article", "ref-card res-card");
        card.id = "resource-" + r.id;
        var headRow = el("div", "ref-card-head");
        headRow.appendChild(el("strong", null, r.label || r.pageTitle || r.id));
        if (r.readStatus === "read") headRow.appendChild(el("span", "badge-read", "đã đọc"));
        else headRow.appendChild(el("span", "badge-domain", "không truy cập được"));
        card.appendChild(headRow);
        if (r.pageTitle) card.appendChild(el("div", null, "Trang: " + r.pageTitle));
        if (r.url) {
          var p = el("p");
          p.style.margin = ".25rem 0 0";
          var a = el("a", "ref-url", r.url);
          a.href = CourseCore.safeExternalUrl(r.url) || "#";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          p.appendChild(a);
          card.appendChild(p);
        }
        /* Linked lessons */
        var lessonLinks = (r.lessonIds || []).filter(function(lid){ return lessonsById.has(lid); });
        if (lessonLinks.length) {
          var lp = el("p");
          lp.style.margin = ".375rem 0 0";
          lp.appendChild(el("span", "badge-domain", "Bài học: "));
          lessonLinks.forEach(function(lid, i) {
            var la = el("a", null, lid);
            la.href = "#lesson/" + lid;
            la.style.color = "var(--spring)";
            lp.appendChild(la);
            if (i < lessonLinks.length - 1) lp.appendChild(document.createTextNode(", "));
          });
          card.appendChild(lp);
        }
        if (r.limitation) {
          card.appendChild(el("div", null, "Giới hạn: " + r.limitation)).style.cssText =
            "margin-top:.375rem;color:var(--muted);font-size:.8125rem;";
        }
        return card;
      }

      /* ---- search panel ---------------------------------------------- */
      var searchInput = document.getElementById('site-search');
      var searchPanel = document.createElement('div');
      searchPanel.id = 'search-results';
      searchPanel.setAttribute('role', 'listbox');
      searchPanel.style.cssText = 'position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:0 0 var(--radius-md) var(--radius-md);max-height:18rem;overflow-y:auto;display:none;z-index:200;box-shadow:var(--shadow-float);';
      if (searchInput && searchInput.parentElement) {
        searchInput.parentElement.style.position = 'relative';
        searchInput.parentElement.appendChild(searchPanel);
      }
      if (searchInput) {
        searchInput.oninput = function() {
          var hits = CourseCore.searchLessons(courseData.lessons, courseData.units, searchInput.value);
          searchPanel.textContent = '';
          if (!searchInput.value.trim() || !hits.length) { searchPanel.style.display = 'none'; return; }
          searchPanel.style.display = 'block';
          hits.forEach(function(l) {
            var item = document.createElement('a');
            item.href = '#lesson/' + l.id;
            item.className = 'search-result-item';
            item.setAttribute('role', 'option');
            item.style.cssText = 'display:block;padding:.625rem .75rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.875rem;';
            var unit = unitsById.get(l.unitId);
            item.innerHTML = '<span style="color:var(--muted);font-size:.75rem;">' + (unit ? 'Unit ' + unit.number : '') + ' | ' + (l.group||'') + '</span><div>' + (l.title || l.id) + '</div>';
            item.onclick = function() { searchInput.value = ''; searchPanel.style.display = 'none'; closeDrawer(); };
            searchPanel.appendChild(item);
          });
        };
        searchInput.onblur = function(){ setTimeout(function(){ searchPanel.style.display = 'none'; }, 200); };
      }

      /* ---- drawer with focus trap -------------------------------------- */
      var lastFocusedBeforeDrawer = null;

      function drawerFocusables() {
        var sidebar = document.getElementById('course-sidebar');
        if (!sidebar) return [];
        return Array.prototype.filter.call(
          sidebar.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'),
          function(node) { return node.offsetParent !== null || node.getClientRects().length > 0; }
        );
      }

      function openDrawer() {
        var btn = document.querySelector('[data-action="open-drawer"]');
        lastFocusedBeforeDrawer = document.activeElement;
        document.body.classList.add('drawer-open');
        if (btn) btn.setAttribute('aria-expanded', 'true');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = false;
        /* Focus the current lesson link if present, else first focusable */
        var targetLink = document.querySelector('.lesson-link[aria-current="page"]') || drawerFocusables()[0];
        if (targetLink) { targetLink.focus(); return; }
        /* Sidebar may not be rendered yet — focus the sidebar itself */
        var sidebar = document.getElementById('course-sidebar');
        if (sidebar) { sidebar.setAttribute('tabindex', '-1'); sidebar.focus(); }
      }

      function closeDrawer() {
        var wasOpen = document.body.classList.contains('drawer-open');
        document.body.classList.remove('drawer-open');
        var btn = document.querySelector('[data-action="open-drawer"]');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = true;
        if (wasOpen && lastFocusedBeforeDrawer && lastFocusedBeforeDrawer.isConnected) {
          lastFocusedBeforeDrawer.focus();
          lastFocusedBeforeDrawer = null;
        } else if (wasOpen && btn) {
          btn.focus();
        }
      }

      /* Tab cycling inside the open drawer */
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeDrawer(); return; }
        if (e.key !== 'Tab' || !document.body.classList.contains('drawer-open')) return;
        var focusables = drawerFocusables();
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        var active = document.activeElement;
        var inSidebar = active && (active.closest ? active.closest('#course-sidebar') : false);
        if (!inSidebar) {
          e.preventDefault();
          first.focus();
          return;
        }
        if (e.shiftKey && (active === first || !inSidebar)) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        }
      });

      /* Clear drawer state when resizing up to desktop */
      var desktopQuery = window.matchMedia('(min-width: 64rem)');
      function handleBreakpointChange(e) {
        if (e.matches) {
          document.body.classList.remove('drawer-open');
          var btn = document.querySelector('[data-action="open-drawer"]');
          if (btn) btn.setAttribute('aria-expanded', 'false');
          var backdrop = document.querySelector('.drawer-backdrop');
          if (backdrop) backdrop.hidden = true;
        }
      }
      if (desktopQuery.addEventListener) desktopQuery.addEventListener('change', handleBreakpointChange);
      else if (desktopQuery.addListener) desktopQuery.addListener(handleBreakpointChange);

      document.addEventListener('click', function(e) {
        var target = e.target.closest('[data-action]');
        if (!target) return;
        var action = target.getAttribute('data-action');
        if (action === 'open-drawer') openDrawer();
        if (action === 'close-drawer') closeDrawer();
      });

      /* ---- theme ----------------------------------------------------- */
      var THEME_ORDER = ['system', 'light', 'dark'];
      var THEME_LABELS = { system: 'Giao diện: theo hệ thống', light: 'Giao diện: sáng', dark: 'Giao diện: tối' };
      function resolveTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return theme;
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', resolveTheme(theme));
      }
      applyTheme(state.theme);
      /* Follow system changes while in system mode */
      var schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function onSchemeChange() { if (state.theme === 'system') applyTheme('system'); }
      if (schemeQuery.addEventListener) schemeQuery.addEventListener('change', onSchemeChange);
      else if (schemeQuery.addListener) schemeQuery.addListener(onSchemeChange);
      var themeBtn = document.getElementById('theme-toggle');
      if (themeBtn) {
        function syncThemeButton() {
          themeBtn.setAttribute('aria-label', THEME_LABELS[state.theme] || state.theme);
          themeBtn.textContent = state.theme === 'dark' ? '☾' : state.theme === 'light' ? '☀' : '◐';
        }
        syncThemeButton();
        themeBtn.onclick = function() {
          state.theme = THEME_ORDER[(THEME_ORDER.indexOf(state.theme) + 1) % 3];
          applyTheme(state.theme);
          saveState();
          syncThemeButton();
        };
      }

      /* ---- completion toggle ----------------------------------------- */
      document.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action="toggle-completion"]');
        if (!btn) return;
        var lid = btn.getAttribute('data-lesson-id');
        var idx = state.completed.indexOf(lid);
        if (idx === -1) state.completed.push(lid); else state.completed.splice(idx, 1);
        saveState();
        updateProgress();
        renderSidebar();
        routeRender();
      });

      /* ---- app shell --------------------------------------------------- */
      function renderApp() {
        var root = document.getElementById('app');
        root.textContent = '';
        var header = document.createElement('header');
        header.className = 'app-header';
        header.setAttribute('data-testid', 'header');

        var brand = document.createElement('a');
        brand.className = 'brand';
        brand.href = '#dashboard';
        brand.innerHTML = '<span class="brand-mark" aria-hidden="true">J</span><span class="brand-text">Java &amp; Spring Boot</span>';

        var searchWrap = document.createElement('div');
        searchWrap.className = 'header-search';
        var search = document.createElement('input');
        search.id = 'site-search';
        search.type = 'search';
        search.placeholder = 'Tim bai hoc...';
        search.setAttribute('aria-label', 'Tim kiem bai hoc');
        searchWrap.appendChild(search);

        var progress = document.createElement('div');
        progress.className = 'header-progress';
        progress.innerHTML =
          '<progress id="progress-bar" value="0" max="1" aria-label="Tien do khoa hoc"></progress>' +
          '<span class="progress-text-long visually-hidden"></span>';

        var actions = document.createElement('div');
