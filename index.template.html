    const STATE_VERSION = 3;

    // Case A of the progress-migration contract: build-task ids RENAMED between
    // artifact revisions, old id -> new id. Filled by P1 (task-category-enum →
    // task-category-model — the model gains JPA mapping at V0.5, so the id no
    // longer names the mechanism; the work is identical, so completion
    // survives). Without an entry here a renamed id is silently dropped by the
    // validBuildTaskIds filter below, which is correct sanitization and wrong
    // migration.
    const RENAME_MAP = Object.freeze({ "task-category-enum": "task-category-model" });

    /* Migrate a projectProgress object across artifact revisions:
         1. apply RENAME_MAP first, so a renamed task keeps its completion;
         2. partition by the CURRENT artifact — ids it still knows become
            buildTasks, ids it has retired become legacyCompleted;
         3. synthesize nothing. When one task splits into several, the retired id
            is recorded as history and NONE of its successors is marked
            complete: auto-completing them would claim work never done.
       legacyCompleted is history only. It is never an input to a completion
       calculation, and it holds exactly the ids the current artifact does not
       have, so the two lists can never overlap. */
    function migrateProjectProgress(progress, validBuildTaskIds = new Set()) {
      const out = { buildTasks: [], legacyCompleted: [] };
      if (!progress || typeof progress !== "object" || Array.isArray(progress)) return out;
      const kept = new Set();
      const retired = new Set();
      for (const source of [progress.buildTasks, progress.legacyCompleted]) {
        if (!Array.isArray(source)) continue;
        for (const raw of source) {
          if (typeof raw !== "string" || !raw) continue;
          const id = Object.prototype.hasOwnProperty.call(RENAME_MAP, raw) ? RENAME_MAP[raw] : raw;
          (validBuildTaskIds.has(id) ? kept : retired).add(id);
        }
      }
      out.buildTasks = [...kept];
      out.legacyCompleted = [...retired];
      return out;
    }

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
        // Project Progress is tracked independently of Course Progress:
        // completed[] is lesson completion; projectProgress.buildTasks[] is
        // Spendwise build-task completion. Completing a lesson never touches
        // this list, and vice versa.
        projectProgress: { buildTasks: [], legacyCompleted: [] },
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys, validBuildTaskIds = new Set()) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      // Project Progress. A fresh, independent object each call so course
      // fields can never share state with it. A v1 state (no projectProgress)
      // migrates by simply keeping course fields and starting an empty build
      // list; a v2 state (no legacyCompleted) is carried forward by
      // migrateProjectProgress, which preserves renamed ids and records retired
      // ones as history instead of dropping them. version is always normalized
      // to the current STATE_VERSION.
      out.projectProgress = migrateProjectProgress(input.projectProgress, validBuildTaskIds);
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      migrateProjectProgress, RENAME_MAP,
      escapeHtml, safeExternalUrl,
      selectCurrentRelease, selectNextBuildTask,
      calculateReleaseProgress, calculateFeatureProgress,
      deriveMapRows, filterMapRows, deriveDomainEntities,
      orderArchitectureStages, groupReleasesByMilestone,
      orderAllTasks, stepsForTask, estimateTaskMinutes,
      buildMentorPrompt, MENTOR_CONVENTION_CLAUSE, MENTOR_STOP_CLAUSE,
      ARCHITECTURE_CONSTITUTION, CONSTITUTION_GROUPS, constitutionRuleIds,
      resolveRuleTokens, DEFENSE_MATRIX, EVOLUTION_NARRATIVE,
    });
    /* COURSE_CORE_END */

    /* ============================================================
       App bootstrap: data parse, indices, shell rendering, routing,
       curriculum navigation, dashboard, search panel (Site Task 3).
       ============================================================ */
    (function () {
      /* ---- data parse ------------------------------------------------ */
      let courseData;
      try {
        courseData = JSON.parse(document.getElementById("course-data").textContent);
      } catch(e) {
        document.getElementById("app").innerHTML = '<pre style="padding:2rem;color:red;">Loi tai du lieu khoa hoc.</pre>';
        throw e;
      }
      const lessonsById = new Map(courseData.lessons.map(function(l){return [l.id,l];}));
      const unitsById = new Map(courseData.units.map(function(u){return [u.id,u];}));

      /* ---- project data layer (Spendwise) ---------------------------- */
      // The project artifact is optional: the course renders fully without it.
      // All Spendwise content lives here in the data layer (never hard-coded),
      // indexed by stable id so the renderer can look up releases/features/
      // build tasks and the curriculum->project mapping on demand.
      var projectData = (courseData && courseData.project) ? courseData.project : null;
      var releasesById = new Map();
      var featuresById = new Map();
      var buildTasksById = new Map();
      var archStageByReleaseId = new Map();
      var projectByLessonId = new Map();
      if (projectData) {
        (projectData.releases || []).forEach(function(r){ releasesById.set(r.id, r); });
        (projectData.features || []).forEach(function(f){ featuresById.set(f.id, f); });
        (projectData.buildTasks || []).forEach(function(t){ buildTasksById.set(t.id, t); });
        (projectData.architectureStages || []).forEach(function(s){ archStageByReleaseId.set(s.releaseId, s); });
        var lessonMap = projectData.lessonMap || {};
        Object.keys(lessonMap).forEach(function(k){ projectByLessonId.set(k, lessonMap[k]); });
      }
      var BUILD_TASK_IDS = new Set(buildTasksById.keys());

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {
        (l.practices || []).forEach(function(p) { acc.push(p.id); });
        return acc;
      }, []));
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? CourseCore.sanitizeState(JSON.parse(raw), LESSON_IDS, UNIT_IDS, PRACTICE_IDS, BUILD_TASK_IDS) : null;
        } catch(e) { return null; }
      }
      function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
      var loaded = loadState();
      if (loaded) state = loaded;

      // Toggle a Spendwise build task's completion. This mutates ONLY
      // projectProgress.buildTasks — course completion (state.completed) is
      // never touched here, keeping the two progress tracks independent.
      function toggleBuildTask(taskId) {
        if (!BUILD_TASK_IDS.has(taskId)) return false;
        if (!state.projectProgress || typeof state.projectProgress !== 'object') {
          state.projectProgress = { buildTasks: [], legacyCompleted: [] };
        }
        if (!Array.isArray(state.projectProgress.buildTasks)) {
          state.projectProgress.buildTasks = [];
        }
        // legacyCompleted is history about retired ids; a defensive reset here
        // must not invent it away, and toggling never writes to it.
        if (!Array.isArray(state.projectProgress.legacyCompleted)) {
          state.projectProgress.legacyCompleted = [];
        }
        var list = state.projectProgress.buildTasks;
        var idx = list.indexOf(taskId);
        if (idx === -1) { list.push(taskId); } else { list.splice(idx, 1); }
        saveState();
        return idx === -1;
      }

      /* ---- render helpers -------------------------------------------- */
      function updateProgress() {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var bar = document.getElementById('progress-bar');
        if (bar) { bar.value = String(p.completed); bar.setAttribute('max', String(p.total || 1)); }
        var short = document.querySelector('.progress-text-short');
        if (short) short.textContent = p.percent + '%';
        var txt = document.querySelector('.progress-text-long');
        if (txt) txt.textContent = p.completed + '/' + p.total + ' bài';
      }
      function setAriaCurrent(id) {
        document.querySelectorAll('.lesson-link[aria-current]').forEach(function(a){a.removeAttribute('aria-current');});
        var link = document.querySelector('.lesson-link[data-lesson-id="' + id + '"]');
        if (link) link.setAttribute('aria-current', 'page');
      }
      function updateNavActive(view) {
        /* Release Detail has no primary-nav destination of its own — it is
           only ever reached by drilling into a release from the Roadmap
           tab — so it inherits Roadmap's active state rather than leaving
           every tab dark while the learner is still inside that section.
           Map and Architecture are likewise sub-views of the Project Track
           (they are only reachable from the project sub-nav), so they keep
           the "Dự án" tab lit instead of dropping the wayfinding cue
           entirely; the sub-nav then shows the precise position. */
        var navView = view === 'release' ? 'roadmap'
          : view === 'lesson' ? 'dashboard'
          : view === 'task' || view === 'map' || view === 'architecture' ? 'project'
          : view;
        document.querySelectorAll('.primary-nav [data-view]').forEach(function(link) {
          link.removeAttribute('aria-current');
          if (link.getAttribute('data-view') === navView) link.setAttribute('aria-current', 'page');
        });
      }

      function projectCompletedTaskIds() {
        return state.projectProgress && Array.isArray(state.projectProgress.buildTasks)
          ? state.projectProgress.buildTasks
          : [];
      }

      function currentProjectRelease() {
        return projectData ? CourseCore.selectCurrentRelease(projectData.releases || []) : null;
      }

      function currentProjectMilestone(releaseId) {
        if (!projectData || !releaseId) return null;
        return (projectData.milestones || []).find(function(milestone) {
          return (milestone.releaseIds || []).indexOf(releaseId) !== -1;
        }) || null;
      }

      function releaseDisplay(release) {
        return release ? release.version + ' — ' + release.title : '';
      }

      function appendStatusBadge(container, status) {
        container.appendChild(el('span', 'project-status project-status--' + status, status));
      }

      // Personal build progress for one release. Four releases legitimately
      // carry no build tasks yet, and calculateReleaseProgress reports those
      // as 0/0 · 0% — a number that reads like "nothing done" rather than
      // "nothing to do". Mirror createFeatureProgress and state the honest
      // reason instead of drawing an empty bar.
      function createProjectProgress(release, label) {
        var progress = CourseCore.calculateReleaseProgress(
          (projectData && projectData.buildTasks) || [],
          projectCompletedTaskIds(),
          release ? release.id : null
        );
        var text = label || 'Project Progress';
        var wrap = el('div', 'project-progress');
        wrap.appendChild(el('span', 'project-progress-label', text));
        if (!progress.total) {
          wrap.appendChild(el('span', 'project-progress-note', 'Chưa có build task để theo dõi'));
          return wrap;
        }
        wrap.appendChild(el('span', 'project-progress-count', progress.completed + '/' + progress.total + ' · ' + progress.percent + '%'));
        var bar = el('progress');
        bar.max = Math.max(progress.total, 1);
        bar.value = progress.completed;
        bar.setAttribute('aria-label', text + ': ' + progress.completed + '/' + progress.total + ', ' + progress.percent + '%');
        bar.textContent = progress.percent + '%';
        wrap.appendChild(bar);
        return wrap;
      }

      // ASCII architecture diagrams are meaningful content, not decoration:
      // the <pre> keeps its text in the accessibility tree and gains a
      // figure role + name saying which stage it belongs to, because a bare
      // <pre> is announced without any context by a screen reader.
      function createArchitectureDiagram(diagram, label) {
        var pre = el('pre', null, diagram);
        pre.setAttribute('role', 'figure');
        pre.setAttribute('aria-label', label);
        return pre;
      }

      function appendFeatureList(container, featureIds) {
        var features = (featureIds || []).map(function(id) { return featuresById.get(id); }).filter(Boolean);
        if (!features.length) return;
        var list = el('ul', 'feature-list');
        features.forEach(function(feature) { list.appendChild(el('li', null, feature.name)); });
        container.appendChild(list);
      }

      // Per-feature progress widget for the richer Release Detail feature
      // cards. calculateFeatureProgress only counts required tasks; a
      // feature with none tracked yet gets an honest "not tracked" note
      // instead of a fake 0/0 bar.
      function createFeatureProgress(feature) {
        var progress = CourseCore.calculateFeatureProgress(
          (projectData && projectData.buildTasks) || [],
          projectCompletedTaskIds(),
          feature.id
        );
        if (!progress.total) {
          return el('p', 'feature-progress-empty', 'Chưa có build task để theo dõi');
        }
        var wrap = el('div', 'project-progress project-progress--feature');
        wrap.appendChild(el('span', 'project-progress-count', progress.completed + '/' + progress.total + ' · ' + progress.percent + '%'));
        var bar = el('progress');
        bar.max = Math.max(progress.total, 1);
        bar.value = progress.completed;
        bar.setAttribute('aria-label', feature.name + ' progress: ' + progress.completed + '/' + progress.total + ', ' + progress.percent + '%');
        bar.textContent = progress.percent + '%';
        wrap.appendChild(bar);
        return wrap;
      }

      // Richer feature cards used by Release Detail: name, description,
      // domainEntities and per-feature progress — appendFeatureList above
      // stays the plain-name version already used inside lesson pages.
      function appendFeatureDetailList(container, featureIds) {
        var features = (featureIds || []).map(function(id) { return featuresById.get(id); }).filter(Boolean);
        if (!features.length) { container.appendChild(el('p', null, 'Chưa có feature nào gắn với release này.')); return; }
        var list = el('div', 'feature-detail-list');
        features.forEach(function(feature) {
          var card = el('article', 'feature-card');
          card.appendChild(el('h3', null, feature.name));
          if (feature.description) card.appendChild(el('p', null, feature.description));
          if ((feature.domainEntities || []).length) {
            var entRow = el('div', 'feature-entities');
            entRow.appendChild(el('span', 'feature-entities-label', 'Entities: '));
            entRow.appendChild(document.createTextNode(feature.domainEntities.join(', ')));
            card.appendChild(entRow);
          }
          card.appendChild(createFeatureProgress(feature));
          list.appendChild(card);
        });
        container.appendChild(list);
      }

      function createBuildTaskItem(task) {
        var done = projectCompletedTaskIds().indexOf(task.id) !== -1;
        var item = el('article', 'build-task' + (done ? ' build-task--done' : ''));
        var toggle = el('button', 'build-task-toggle');
        toggle.type = 'button';
        toggle.setAttribute('data-action', 'toggle-build-task');
        toggle.setAttribute('data-task-id', task.id);
        toggle.setAttribute('aria-pressed', done ? 'true' : 'false');
        toggle.setAttribute('aria-label', (done ? 'Đánh dấu chưa hoàn thành: ' : 'Đánh dấu hoàn thành: ') + task.title);
        toggle.innerHTML = icon('check');
        toggle.addEventListener('click', function() {
          var completed = toggleBuildTask(task.id);
          toggle.setAttribute('aria-pressed', completed ? 'true' : 'false');
          toggle.setAttribute('aria-label', (completed ? 'Đánh dấu chưa hoàn thành: ' : 'Đánh dấu hoàn thành: ') + task.title);
          item.classList.toggle('build-task--done', completed);
          showToast(completed ? 'Đã hoàn thành build task' : 'Đã mở lại build task');
          routeRender();
        });
        item.appendChild(toggle);
        var body = el('div');
        var title = el('div', 'build-task-title');
        // The title is a link to the task's detail page (P3) — the toggle
        // button beside it keeps its exact role, so completion semantics and
        // every toggle-count assertion are unchanged.
        var titleLink = el('a', 'build-task-title-link', task.title);
        titleLink.href = '#/task/' + task.id;
        title.appendChild(titleLink);
        title.appendChild(el('span', 'task-kind', task.required === false ? 'optional' : 'required'));
        body.appendChild(title);
        if (task.problem) body.appendChild(el('div', 'build-task-meta', task.problem));
        if (task.goal) body.appendChild(el('div', 'build-task-meta', 'Goal: ' + task.goal));
        item.appendChild(body);
        return item;
      }

      function appendBuildTaskList(container, taskIds) {
        var tasks = (taskIds || []).map(function(id) { return buildTasksById.get(id); }).filter(Boolean);
        if (!tasks.length) return;
        var list = el('div', 'build-task-list');
        tasks.forEach(function(task) { list.appendChild(createBuildTaskItem(task)); });
        container.appendChild(list);
      }

      // Appends an optional, compact-by-default disclosure onto a build task
      // <article> with constraints / acceptance criteria / relevant lessons
      // (resolved to real #lesson/<id> links, not raw ids). Reuses the same
      // disclosureButton/wireDisclosure accordion pattern used elsewhere.
      // No-op when a task has none of these authored, so plain tasks stay flat.
      function appendBuildTaskDetails(item, task) {
        var hasConstraints = (task.constraints || []).length > 0;
        var hasCriteria = (task.acceptanceCriteria || []).length > 0;
        var lessons = (task.relevantLessonIds || []).map(function(id) { return lessonsById.get(id); }).filter(Boolean);
        if (!hasConstraints && !hasCriteria && !lessons.length) return;
        var panelId = 'build-task-detail-' + task.id;
        var toggleBtn = disclosureButton('Chi tiết', panelId, 'chevron-down');
        toggleBtn.classList.add('build-task-detail-toggle');
        var panel = el('div', 'build-task-detail');
        panel.id = panelId;
        panel.hidden = true;
        if (hasConstraints) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Constraints'));
          var cList = el('ul');
          task.constraints.forEach(function(c) { cList.appendChild(el('li', null, c)); });
          panel.appendChild(cList);
        }
        if (hasCriteria) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Acceptance Criteria'));
          var aList = el('ul');
          task.acceptanceCriteria.forEach(function(c) { aList.appendChild(el('li', null, c)); });
          panel.appendChild(aList);
        }
        if (lessons.length) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Relevant Lessons'));
          var lList = el('ul');
          lessons.forEach(function(lesson) {
            var li = el('li');
            var a = el('a', 'text-link', lesson.title);
            a.href = '#lesson/' + lesson.id;
            li.appendChild(a);
            lList.appendChild(li);
          });
          panel.appendChild(lList);
        }
        wireDisclosure(toggleBtn, panel);
        item.appendChild(toggleBtn);
        item.appendChild(panel);
      }

      function createExpandableBuildTaskItem(task) {
        var item = createBuildTaskItem(task);
        item.classList.add('build-task--expandable');
        appendBuildTaskDetails(item, task);
        return item;
      }

      // Used by Release Detail's Build Tasks section and the Build Tasks
      // Workspace — both reuse createBuildTaskItem/toggleBuildTask (single
      // shared completion state), only adding the expandable detail panel.
      function appendExpandableBuildTaskList(container, taskIds) {
        var tasks = (taskIds || []).map(function(id) { return buildTasksById.get(id); }).filter(Boolean);
        if (!tasks.length) return;
        var list = el('div', 'build-task-list');
        tasks.forEach(function(task) { list.appendChild(createExpandableBuildTaskItem(task)); });
        container.appendChild(list);
      }

      /* ---- P3: Task Detail + task browse ------------------------------- */
      // Resolved prerequisite rows for a task or step. Returns plain rows so
      // the same builder serves both the page renderer and the prompt.
      function resolvePrereqLessons(lessonIds) {
        return (lessonIds || [])
          .map(function(id) {
            var lesson = lessonsById.get(id);
            return lesson ? { id: id, title: lesson.title || id, done: state.completed.indexOf(id) !== -1 } : null;
          })
          .filter(Boolean);
      }

      function resolvePrereqTasks(taskIds) {
        return (taskIds || [])
          .map(function(id) {
            var task = buildTasksById.get(id);
            if (!task) return null;
            return {
              id: id,
              title: task.title || id,
              done: projectCompletedTaskIds().indexOf(id) !== -1,
              required: task.required !== false,
            };
          })
          .filter(Boolean);
      }

      // Build Tasks Workspace + Task Detail + roadmap ordering all read one
      // canonical task sequence (release order, then release.buildTaskIds).
      // Computed once per render pass from the immutable embedded data; no
      // sort is ever applied to the source arrays themselves.
      function canonicalOrderedTasks() {
        return CourseCore.orderAllTasks((projectData && projectData.releases) || [], (projectData && projectData.buildTasks) || []);
      }

      function stepsByTaskId(taskId) {
        return CourseCore.stepsForTask((projectData && projectData.buildSteps) || [], taskId);
      }

      function appendPrereqLessonList(container, lessons) {
        if (!lessons.length) return;
        var wrap = el('div', 'task-prereq-block');
        wrap.appendChild(el('div', 'task-prereq-label', 'Kiến thức cần có'));
        var list = el('ul', 'task-prereq-list');
        lessons.forEach(function(entry) {
          var li = el('li');
          var a = el('a', 'text-link', entry.title);
          a.href = '#/lesson/' + entry.id;
          li.appendChild(a);
          li.appendChild(el('span', entry.done ? 'prereq-state prereq-state--done' : 'prereq-state prereq-state--open',
            entry.done ? 'đã học' : 'chưa đánh dấu hoàn thành'));
          list.appendChild(li);
        });
        wrap.appendChild(list);
        container.appendChild(wrap);
      }

      function appendPrereqTaskList(container, tasks) {
        if (!tasks.length) return;
        var wrap = el('div', 'task-prereq-block');
        wrap.appendChild(el('div', 'task-prereq-label', 'Artifact cần có trước'));
        var list = el('ul', 'task-prereq-list');
        tasks.forEach(function(entry) {
          var li = el('li');
          var a = el('a', 'text-link', entry.title);
          a.href = '#/task/' + entry.id;
          li.appendChild(a);
          li.appendChild(el('span', entry.done ? 'prereq-state prereq-state--done' : 'prereq-state prereq-state--open',
            (entry.done ? 'đã hoàn thành' : 'chưa hoàn thành') + (entry.required === false ? ' · optional' : '')));
          list.appendChild(li);
        });
        wrap.appendChild(list);
        container.appendChild(wrap);
      }

      // One step card. Every authored field gets a labelled slot; optional
      // fields absent from the data simply render no block (never an empty
      // heading, never "[]"/"undefined"). Labels stay English technical
      // terms where the data names them (doneWhen, verifyCommand, …) so the
      // learner can map the UI back to the artifact fields.
      function createStepCard(step) {
        var card = el('article', 'task-step');
        card.setAttribute('data-step-id', step.id);

        var head = el('div', 'task-step-head');
        head.appendChild(el('span', 'task-step-order', 'Bước ' + step.order));
        head.appendChild(el('h3', 'task-step-title', step.title));
        if (step.estimatedMinutes) {
          head.appendChild(el('span', 'task-step-minutes', '~' + step.estimatedMinutes + ' phút'));
        }
        card.appendChild(head);

        if (step.intent) {
          var intent = el('div', 'task-step-row');
          intent.appendChild(el('span', 'task-step-label', 'Intent'));
          intent.appendChild(el('p', 'task-step-text', step.intent));
          card.appendChild(intent);
        }

        var stepLessons = resolvePrereqLessons(step.knowledgePrereqLessonIds);
        var stepPrereqTasks = resolvePrereqTasks(step.artifactPrereqTaskIds);
        if (stepLessons.length || stepPrereqTasks.length) {
          var prereqs = el('div', 'task-step-row');
          prereqs.appendChild(el('span', 'task-step-label', 'Prerequisites'));
          var prereqBody = el('div', 'task-step-prereqs');
          appendPrereqLessonList(prereqBody, stepLessons);
          appendPrereqTaskList(prereqBody, stepPrereqTasks);
          prereqs.appendChild(prereqBody);
          card.appendChild(prereqs);
        }

        if ((step.filesTouched || []).length) {
          var files = el('div', 'task-step-row');
          files.appendChild(el('span', 'task-step-label', 'Files'));
          var fileList = el('ul', 'task-file-list');
          step.filesTouched.forEach(function(path) {
            fileList.appendChild(el('li', 'task-file-path', path));
          });
          files.appendChild(fileList);
          card.appendChild(files);
        }

        // doneWhen is the step's exit condition — the one field a learner
        // must not miss, so it gets its own emphasized block.
        if (step.doneWhen) {
          var done = el('div', 'task-step-row task-step-row--done');
          done.appendChild(el('span', 'task-step-label', 'Done when'));
          done.appendChild(el('p', 'task-step-text', step.doneWhen));
          card.appendChild(done);
        }

        if (step.verifyCommand) {
          var verify = el('div', 'task-step-row');
          verify.appendChild(el('span', 'task-step-label', 'Verify'));
          var fig = el('figure', 'task-verify');
          var figcap = el('figcaption');
          figcap.appendChild(el('span', null, 'verifyCommand — PowerShell'));
          var copyBtn = el('button', 'copy-btn');
          copyBtn.innerHTML = icon('copy') + '<span>Sao chép lệnh</span>';
          copyBtn.type = 'button';
          copyBtn.setAttribute('data-action', 'copy-verify-command');
          copyBtn.setAttribute('data-command', step.verifyCommand);
          copyBtn.setAttribute('aria-label', 'Sao chép lệnh kiểm tra vào clipboard');
          copyBtn.addEventListener('click', function() {
            copyText(step.verifyCommand).then(function() { showToast('Đã sao chép lệnh'); },
              function() { showToast('Không thể sao chép tự động — hãy chọn lệnh và sao chép thủ công.'); });
          });
          figcap.appendChild(copyBtn);
          fig.appendChild(figcap);
          var pre = el('pre');
          pre.appendChild(el('code', null, step.verifyCommand));
          fig.appendChild(pre);
          verify.appendChild(fig);
          card.appendChild(verify);
        }

        if ((step.architectureRules || []).length) {
          var rules = el('div', 'task-step-row');
          rules.appendChild(el('span', 'task-step-label', 'Architecture rules'));
          var ruleRow = el('div', 'task-rule-row');
          step.architectureRules.forEach(function(ruleId) {
            var chip = el('a', 'task-rule-chip', ruleId);
            chip.href = '#/architecture';
            chip.setAttribute('aria-label', 'Architecture rule ' + ruleId + ' — xem định nghĩa trong Architecture view');
            ruleRow.appendChild(chip);
          });
          ruleRow.appendChild(el('span', 'task-rule-note', 'Định nghĩa đầy đủ trong Architecture view'));
          rules.appendChild(ruleRow);
          card.appendChild(rules);
        }

        if (step.commonMistake) {
          var mistake = el('aside', 'callout task-mistake');
          mistake.setAttribute('role', 'note');
          var mistakeIcon = el('span', 'callout-icon');
          mistakeIcon.setAttribute('aria-hidden', 'true');
          mistakeIcon.innerHTML = icon('alert-triangle');
          mistake.appendChild(mistakeIcon);
          var mistakeBody = el('div', 'callout-body');
          var mistakeHead = el('div', 'callout-head');
          mistakeHead.appendChild(el('strong', 'callout-label', 'Lỗi thường gặp: '));
          mistakeBody.appendChild(mistakeHead);
          mistakeBody.appendChild(document.createTextNode(step.commonMistake));
          mistake.appendChild(mistakeBody);
          card.appendChild(mistake);
        }

        if (step.mentorHint) {
          var hint = el('aside', 'callout task-hint');
          hint.setAttribute('role', 'note');
          var hintIcon = el('span', 'callout-icon');
          hintIcon.setAttribute('aria-hidden', 'true');
          hintIcon.innerHTML = icon('lightbulb');
          hint.appendChild(hintIcon);
          var hintBody = el('div', 'callout-body');
          var hintHead = el('div', 'callout-head');
          hintHead.appendChild(el('strong', 'callout-label', 'Mentor hint: '));
          hintBody.appendChild(hintHead);
          hintBody.appendChild(document.createTextNode(step.mentorHint));
          hint.appendChild(hintBody);
          card.appendChild(hint);
        }

        return card;
      }

      // Mentor Prompt section: one builder (CourseCore.buildMentorPrompt),
      // two scopes. `step` null → task-level prompt. The generated text is
      // shown in a scrollable <pre> (learner can read before copying) and is
      // copied through the shared copyText/showToast path.
      function createMentorPromptSection(task, steps, release, taskLessonRows, taskPrereqRows, ruleIds) {
        var section = el('section', 'project-panel release-section');
        section.setAttribute('aria-labelledby', 'task-mentor-prompt-title');
        section.appendChild(el('h2', null, 'Mentor Prompt')).id = 'task-mentor-prompt-title';
        section.appendChild(el('p', 'task-prompt-intro',
          'Sao chép prompt này dán vào AI mentor bạn đang dùng — nó kèm đúng ngữ cảnh task, boundary kiến thức đã học và các architecture rule đang có hiệu lực. Không có lệnh gọi API nào ở đây; trang chỉ tạo văn bản.'));

        var promptPre = el('pre', 'task-prompt-output');
        promptPre.setAttribute('aria-label', 'Nội dung mentor prompt');
        var promptCode = el('code');
        promptPre.appendChild(promptCode);

        function renderPrompt(scope, step) {
          var text = CourseCore.buildMentorPrompt({
            task: task,
            step: step || null,
            steps: steps,
            release: release,
            lessons: taskLessonRows,
            prereqTasks: taskPrereqRows,
            features: (task.featureIds || []).map(function(id) {
              var f = featuresById.get(id);
              return f ? f.name : null;
            }).filter(Boolean),
            ruleIds: ruleIds,
          });
          promptCode.textContent = text;
          taskButtons.forEach(function(btn) {
            btn.setAttribute('aria-pressed', btn.getAttribute('data-prompt-scope') === scope ? 'true' : 'false');
          });
        }

        // Step scope needs a way to choose the step. A <select> keeps the
        // implementation small and works with keyboard out of the box; the
        // "bước đang chọn" is ephemeral UI state — it never touches progress.
        var stepPickerRow = el('div', 'task-prompt-step-picker');
        var pickerLabel = el('label', null, 'Bước');
        pickerLabel.setAttribute('for', 'task-step-picker');
        var picker = el('select');
        picker.id = 'task-step-picker';
        steps.forEach(function(s) {
          var opt = el('option', null, 'Bước ' + s.order + ' — ' + s.title);
          opt.value = s.id;
          picker.appendChild(opt);
        });
        pickerLabel.appendChild(picker);
        stepPickerRow.appendChild(pickerLabel);
        // Live update while the learner is already in step scope.
        picker.addEventListener('change', function() {
          if (stepPickerRow.hidden) return;
          var selected = steps.find(function(s) { return s.id === picker.value; }) || null;
          renderPrompt('step', selected);
        });

        var taskButtons = [];
        var scopeRow = el('div', 'task-prompt-scope');
        scopeRow.setAttribute('role', 'group');
        scopeRow.setAttribute('aria-label', 'Chọn phạm vi prompt');
        [{ key: 'task', label: 'Prompt cho cả task' },
         { key: 'step', label: 'Prompt cho bước đang chọn' }].forEach(function(item) {
          var btn = el('button', 'map-filter-btn', item.label);
          btn.type = 'button';
          btn.setAttribute('data-prompt-scope', item.key);
          btn.setAttribute('aria-pressed', item.key === 'task' ? 'true' : 'false');
          // One listener per button: renders the matching scope and shows
          // the step picker only for step scope. The picker defaults to the
          // first step, so step scope always has a concrete step to quote.
          btn.addEventListener('click', function() {
            if (item.key === 'step') {
              var selected = steps.find(function(s) { return s.id === picker.value; }) || null;
              stepPickerRow.hidden = false;
              renderPrompt('step', selected);
            } else {
              stepPickerRow.hidden = true;
              renderPrompt('task', null);
            }
          });
          taskButtons.push(btn);
          scopeRow.appendChild(btn);
        });
        section.appendChild(scopeRow);
        section.appendChild(stepPickerRow);
        stepPickerRow.hidden = true;

        section.appendChild(promptPre);
        renderPrompt('task', null);

        var actions = el('div', 'task-prompt-actions');
        var copyBtn = el('button', 'btn btn--primary task-prompt-copy');
        copyBtn.innerHTML = icon('copy') + '<span>Sao chép mentor prompt</span>';
        copyBtn.type = 'button';
        copyBtn.setAttribute('data-action', 'copy-mentor-prompt');
        copyBtn.addEventListener('click', function() {
          copyText(promptCode.textContent).then(function() { showToast('Đã sao chép mentor prompt'); },
            function() { showToast('Không thể sao chép tự động — hãy chọn văn bản và sao chép thủ công.'); });
        });
        actions.appendChild(copyBtn);
        section.appendChild(actions);
        return section;
      }

      // Task Detail (P3). Answers, in order: what am I building → why →
      // what should I know → what artifacts first → constraints → ordered
      // steps → whole-task acceptance → mentor prompt → completion → next.
      function renderTaskDetail(container, taskId) {
        if (!projectData) { renderProjectEmpty(container); return; }
        var task = buildTasksById.get(taskId);
        renderProjectSubNav(container, 'project');
        if (!task) {
          var notFound = el('section', 'project-not-found');
          notFound.appendChild(el('h1', null, 'Không tìm thấy build task'));
          notFound.appendChild(el('p', null, 'Build task “' + taskId + '” không tồn tại trong project data.'));
          var backToTasks = el('a', 'text-link', '← Về danh sách build task');
          backToTasks.href = '#/project';
          notFound.appendChild(backToTasks);
          container.appendChild(notFound);
          return;
        }

        var release = releasesById.get(task.releaseId);
        var releaseTasks = release ? (release.buildTaskIds || []) : [];
        var positionInRelease = releaseTasks.indexOf(task.id);
        var orderedTasks = canonicalOrderedTasks();
        var globalIndex = orderedTasks.findIndex(function(t) { return t.id === task.id; });
        var steps = stepsByTaskId(task.id);
        var done = projectCompletedTaskIds().indexOf(task.id) !== -1;

        var detail = el('div');
        detail.setAttribute('data-task-detail', task.id);

        // ---- header / orientation
        var hero = el('header', 'task-hero');
        var heroLine = el('div', 'project-release-line');
        if (release) {
          var releaseLink = el('a', 'text-link', releaseDisplay(release));
          releaseLink.href = '#/release/' + release.id;
          heroLine.appendChild(releaseLink);
          if (positionInRelease !== -1) {
            heroLine.appendChild(el('span', 'task-position', 'Task ' + (positionInRelease + 1) + '/' + releaseTasks.length + ' của release'));
          }
        }
        heroLine.appendChild(el('span', 'task-kind', task.required === false ? 'optional' : 'required'));
        if (done) heroLine.appendChild(el('span', 'task-done-badge', 'Đã hoàn thành'));
        hero.appendChild(heroLine);
        hero.appendChild(el('h1', 'task-title', task.title));
        var taskEstimate = CourseCore.estimateTaskMinutes(steps);
        if (taskEstimate != null) {
          hero.appendChild(el('p', 'task-estimate', 'Ước lượng: ~' + taskEstimate + ' phút cho ' + steps.length + ' bước (tổng estimatedMinutes của mọi bước).'));
        }
        if (task.problem) {
          var problem = el('p', 'task-hero-problem');
          problem.appendChild(el('strong', null, 'Vấn đề: '));
          problem.appendChild(document.createTextNode(task.problem));
          hero.appendChild(problem);
        }
        if (task.goal) {
          var goalP = el('p', 'task-hero-goal');
          goalP.appendChild(el('strong', null, 'Goal: '));
          goalP.appendChild(document.createTextNode(task.goal));
          hero.appendChild(goalP);
        }
        if ((task.featureIds || []).length) {
          var features = (task.featureIds || []).map(function(id) {
            var f = featuresById.get(id);
            return f ? f.name : null;
          }).filter(Boolean);
          if (features.length) {
            var featRow = el('div', 'task-feature-row');
            featRow.appendChild(el('span', 'task-feature-label', 'Features: '));
            featRow.appendChild(document.createTextNode(features.join(', ')));
            hero.appendChild(featRow);
          }
        }
        detail.appendChild(hero);

        // ---- prerequisites (knowledge + artifact). Artifact prereqs are
        // collected straight from the task's steps (union, first-sighting
        // order) so a prereq id resolves even if it sits outside release
        // ordering; self is excluded.
        var taskLessons = resolvePrereqLessons(task.relevantLessonIds);
        var prereqTaskIdSet = {};
        steps.forEach(function(s) {
          (s.artifactPrereqTaskIds || []).forEach(function(id) {
            if (id !== task.id) prereqTaskIdSet[id] = true;
          });
        });
        var taskPrereqTasks = resolvePrereqTasks(Object.keys(prereqTaskIdSet));
        var prereqsSection = el('section', 'project-panel release-section');
        prereqsSection.appendChild(el('h2', null, 'Trước khi bắt tay'));
        if (taskLessons.length || taskPrereqTasks.length) {
          appendPrereqLessonList(prereqsSection, taskLessons);
          appendPrereqTaskList(prereqsSection, taskPrereqTasks);
        } else {
          prereqsSection.appendChild(el('p', null, 'Task này không khai báo kiến thức hoặc artifact prerequisite riêng.'));
        }
        detail.appendChild(prereqsSection);

        // ---- constraints (what must stay true) — before the steps, per
        // the learner-flow contract; never buried under step content.
        var constraintsSection = null;
        if ((task.constraints || []).length) {
          constraintsSection = el('section', 'project-panel release-section');
          constraintsSection.appendChild(el('h2', null, 'Constraints — điều phải luôn đúng'));
          var cList = el('ul', 'criteria-list');
          task.constraints.forEach(function(c) { cList.appendChild(el('li', null, c)); });
          constraintsSection.appendChild(cList);
          detail.appendChild(constraintsSection);
        }

        // ---- build steps (ordered by `order`, display-only — no step
        // completion state exists and none is invented here)
        var stepsSection = el('section', 'project-panel release-section');
        stepsSection.setAttribute('aria-labelledby', 'task-steps-title');
        stepsSection.appendChild(el('h2', null, 'Build Steps')).id = 'task-steps-title';
        if (!steps.length) {
          stepsSection.appendChild(el('p', null, 'Task này chưa có build step nào được soạn.'));
        } else {
          stepsSection.appendChild(el('p', 'task-steps-note',
            steps.length + ' bước, làm theo thứ tự. Mỗi bước có "Done when" — tiêu chí bước đó xong; hoàn thành cả task là mục Acceptance Criteria bên dưới.'));
          var stepList = el('div', 'task-step-list');
          steps.forEach(function(step) {
            stepList.appendChild(createStepCard(step));
          });
          stepsSection.appendChild(stepList);
        }
        detail.appendChild(stepsSection);

        // ---- whole-task acceptance criteria (distinct block from step
        // doneWhen: this is "task hoàn thành", that is "bước hoàn thành")
        if ((task.acceptanceCriteria || []).length) {
          var acSection = el('section', 'project-panel release-section');
          acSection.appendChild(el('h2', null, 'Acceptance Criteria — hoàn thành cả task'));
          var acList = el('ul', 'criteria-list');
          task.acceptanceCriteria.forEach(function(c) { acList.appendChild(el('li', null, c)); });
          acSection.appendChild(acList);
          detail.appendChild(acSection);
        }

        // ---- mentor prompt
        var ruleIds = [];
        steps.forEach(function(s) { (s.architectureRules || []).forEach(function(r) { if (ruleIds.indexOf(r) === -1) ruleIds.push(r); }); });
        detail.appendChild(createMentorPromptSection(task, steps, release, taskLessons, taskPrereqTasks, ruleIds));

        // ---- completion + prev/next
        var footer = el('section', 'project-panel release-section task-footer');
        footer.appendChild(el('h2', null, 'Hoàn thành task'));
        footer.appendChild(el('p', null, 'Đánh dấu hoàn thành khi mọi bước đã qua và các Acceptance Criteria đạt — danh sách này dùng chung Build Tasks Workspace và Release Detail, không tách bộ lưu trạng thái mới.'));
        var toggle = el('button', 'btn btn--primary task-complete-toggle');
        toggle.type = 'button';
        toggle.setAttribute('data-action', 'toggle-build-task');
        toggle.setAttribute('data-task-id', task.id);
        toggle.setAttribute('aria-pressed', done ? 'true' : 'false');
        toggle.innerHTML = icon('check') + '<span>' + (done ? 'Đã hoàn thành — nhấn để mở lại' : 'Đánh dấu task hoàn thành') + '</span>';
        // Same contract as the workspace toggle: shared toggleBuildTask state,
        // toast feedback, full re-render so the hero badge follows.
        toggle.addEventListener('click', function() {
          var completed = toggleBuildTask(task.id);
          toggle.setAttribute('aria-pressed', completed ? 'true' : 'false');
          toggle.innerHTML = icon('check') + '<span>' + (completed ? 'Đã hoàn thành — nhấn để mở lại' : 'Đánh dấu task hoàn thành') + '</span>';
          showToast(completed ? 'Đã hoàn thành build task' : 'Đã mở lại build task');
          routeRender();
        });
        footer.appendChild(toggle);
        if (globalIndex !== -1) {
          var prevNext = el('nav', 'task-prevnext');
          prevNext.setAttribute('aria-label', 'Chuyển task liền kề');
          if (globalIndex > 0) {
            var prevTask = orderedTasks[globalIndex - 1];
            var prevLink = el('a', 'text-link task-prevnext-link');
            prevLink.href = '#/task/' + prevTask.id;
            prevLink.appendChild(el('span', 'task-prevnext-dir', '← Task trước'));
            prevLink.appendChild(el('span', 'task-prevnext-title',
              prevTask.title + (prevTask.required === false ? ' (optional)' : '')));
            prevNext.appendChild(prevLink);
          }
          if (globalIndex < orderedTasks.length - 1) {
            var nextTask = orderedTasks[globalIndex + 1];
            var nextLink = el('a', 'text-link task-prevnext-link task-prevnext-link--next');
            nextLink.href = '#/task/' + nextTask.id;
            nextLink.appendChild(el('span', 'task-prevnext-dir', 'Task sau →'));
            nextLink.appendChild(el('span', 'task-prevnext-title',
              nextTask.title + (nextTask.required === false ? ' (optional)' : '')));
            prevNext.appendChild(nextLink);
          }
          footer.appendChild(prevNext);
        }
        detail.appendChild(footer);

        container.appendChild(detail);
      }

      // All-task browse surface (P3): every authored task, grouped by
      // release in release order. Compact rows — the task definition itself
      // belongs to Task Detail, this surface is for orientation/navigation.
      function appendAllTaskBrowse(container) {
        var releases = (projectData.releases || [])
          .slice()
          .sort(function(a, b) { return Number(a.order || 0) - Number(b.order || 0); });
        var completed = projectCompletedTaskIds();
        var total = 0;
        var doneRequired = 0;
        var section = el('section', 'project-panel release-section');
        section.setAttribute('aria-labelledby', 'task-browse-title');
        section.appendChild(el('h2', null, 'Tất cả build task')).id = 'task-browse-title';
        section.appendChild(el('p', 'task-steps-note',
          (projectData.buildTasks || []).length + ' task theo ' + releases.length + ' release. Nhấn vào tên task để mở trang chi tiết; tiến độ đặt tên từ trạng thái build của bạn, độc lập với tiến độ học bài.'));
        releases.forEach(function(release) {
          var taskIds = release.buildTaskIds || [];
          if (!taskIds.length) return;
          var group = el('div', 'task-browse-group');
          var head = el('div', 'task-browse-group-head');
          var relLink = el('a', 'text-link', release.version + ' — ' + release.title);
          relLink.href = '#/release/' + release.id;
          head.appendChild(relLink);
          group.appendChild(head);
          var list = el('ul', 'task-browse-list');
          taskIds.forEach(function(id) {
            var task = buildTasksById.get(id);
            if (!task) return;
            total++;
            var isDone = completed.indexOf(id) !== -1;
            if (isDone && task.required !== false) doneRequired++;
            var li = el('li', 'task-browse-item' + (isDone ? ' task-browse-item--done' : ''));
            var row = el('a', 'task-browse-link');
            row.href = '#/task/' + id;
            row.appendChild(el('span', 'task-browse-title', task.title));
            var meta = el('span', 'task-browse-meta');
            meta.appendChild(el('span', 'task-kind', task.required === false ? 'optional' : 'required'));
            if (isDone) meta.appendChild(el('span', 'prereq-state prereq-state--done', 'hoàn thành'));
            row.appendChild(meta);
            li.appendChild(row);
            list.appendChild(li);
          });
          group.appendChild(list);
          section.appendChild(group);
        });
        if (total) {
          var requiredTotal = ((projectData.buildTasks || []).filter(function(t) { return t.required !== false; })).length;
          section.insertBefore(
            el('p', 'task-browse-summary', 'Tiến độ required: ' + doneRequired + '/' + requiredTotal + ' task hoàn thành (task optional không tính vào mốc này).'),
            section.children[1]
          );
        }
        container.appendChild(section);
      }

      // Project-scoped sub-navigation shown under the workspace header on
      // every project-track view. Keeps #/map and #/architecture reachable
      // without adding two more items to the always-visible primary nav
      // (which would crowd the 390px fixed bottom tab bar) — this pill row
      // wraps instead of clipping on narrow viewports.
      function renderProjectSubNav(container, activeView) {
        var nav = el('nav', 'project-subnav');
        nav.setAttribute('aria-label', 'Điều hướng Project Track');
        [
          { view: 'project', href: '#/project', label: 'Tổng quan' },
          /* "Lộ trình release", not a bare "Lộ trình": the primary nav
             already has a top-level "Lộ trình" tab pointing at this same
             route, and an unqualified repeat inside the project sub-nav
             reads like a second, project-scoped roadmap. The qualifier
             matches this destination's own header ("Release Roadmap"). */
          { view: 'roadmap', href: '#/roadmap', label: 'Lộ trình release' },
          { view: 'map', href: '#/map', label: 'Bản đồ' },
          { view: 'architecture', href: '#/architecture', label: 'Kiến trúc' },
        ].forEach(function(item) {
          var link = el('a', null, item.label);
          link.href = item.href;
          link.setAttribute('data-subview', item.view);
          if (item.view === activeView) link.setAttribute('aria-current', 'page');
          nav.appendChild(link);
        });
        container.appendChild(nav);
        return nav;
      }

      function renderProjectEmpty(container) {
        var empty = el('section', 'project-empty');
        empty.appendChild(el('h1', null, 'Project track chưa sẵn sàng'));
        empty.appendChild(el('p', null, 'Thông tin Spendwise hiện chưa sẵn sàng. Learning Track vẫn hoạt động bình thường.'));
        container.appendChild(empty);
      }

      /* ---- curriculum nav ------------------------------------------- */
      function renderSidebar() {
        var nav = document.getElementById('curriculum-nav');
        if (!nav) return;
        nav.textContent = '';
        var GROUP_ORDER = ['java', 'spring', 'completion'];
        var ACCENT = {java:'var(--java)',spring:'var(--spring)',completion:'var(--completion)'};
        var ACCENT_SOFT = {java:'var(--java-soft)',spring:'var(--spring-soft)',completion:'var(--completion-soft)'};
        GROUP_ORDER.forEach(function(groupKey) {
          var units = courseData.units.filter(function(u){return u.group===groupKey;});
          if (!units.length) return;
          var label = document.createElement('div');
          label.className = 'group-label' + (groupKey === 'completion' ? '' : ' group-label--' + groupKey);
          label.textContent = GROUP_LABELS[groupKey] || groupKey;
          nav.appendChild(label);
          units.forEach(function(unit) {
            var lessonIds = unit.lessonIds || [];
            var doneCount = lessonIds.filter(function(lid){ return state.completed.indexOf(lid)!==-1; }).length;
            var collapsed = state.collapsedUnits.indexOf(unit.id) !== -1;
            var toggle = document.createElement('button');
            toggle.className = 'module-toggle';
            toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            toggle.setAttribute('aria-controls', 'lessons-' + unit.id);
            toggle.setAttribute('data-unit-id', unit.id);
            toggle.setAttribute('data-group', groupKey);
            toggle.title = unit.number + '. ' + unit.title;
            toggle.innerHTML = '<span class="module-toggle-label"><span class="module-num">' + unit.number + '</span>' +
              '<span class="module-toggle-title">' + unit.title + '</span></span>' +
              '<span class="module-progress">' + doneCount + '/' + lessonIds.length + '</span>' +
              '<span class="chevron" aria-hidden="true">' + icon('chevron-down') + '</span>';
            toggle.onclick = function() {
              var expanded = toggle.getAttribute('aria-expanded')==='true';
              toggle.setAttribute('aria-expanded', expanded?'false':'true');
              var list = document.getElementById('lessons-' + unit.id);
              if (list) list.hidden = expanded;
              if (expanded) { if (state.collapsedUnits.indexOf(unit.id)===-1) state.collapsedUnits.push(unit.id); }
              else { state.collapsedUnits = state.collapsedUnits.filter(function(x){return x!==unit.id;}); }
              saveState();
            };
            nav.appendChild(toggle);
            var list = document.createElement('ul');
            list.className = 'lesson-list';
            list.id = 'lessons-' + unit.id;
            list.setAttribute('role', 'list');
            list.hidden = collapsed;
            lessonIds.forEach(function(lid) {
              var lesson = lessonsById.get(lid);
              if (!lesson) return;
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.className = 'lesson-link';
              a.href = '#lesson/' + lid;
              a.setAttribute('data-lesson-id', lid);
              a.title = lesson.title || lid;
              a.style.setProperty('--accent', ACCENT[lesson.group] || ACCENT.completion);
              a.style.setProperty('--accent-soft', ACCENT_SOFT[lesson.group] || ACCENT_SOFT.completion);
              var done = state.completed.indexOf(lid) !== -1;
              a.innerHTML = '<span class="lesson-state" data-done="' + done + '">' + (done ? icon('check') : '') + '</span>' +
                '<span class="lesson-link-title">' + (done ? '<span class="visually-hidden">Đã hoàn thành: </span>' : '') + (lesson.title || lid) + '</span>';
              a.onclick = function() { closeDrawer(); };
              li.appendChild(a);
              list.appendChild(li);
            });
            nav.appendChild(list);
          });
        });
        setAriaCurrent(state.lastLessonId);
      }

      /* ---- route render ---------------------------------------------- */
      function routeRender() {
        var route = CourseCore.parseRoute(window.location.hash);
        var view = document.getElementById('route-view');
        if (!view) return;
        view.textContent = '';
        view.classList.toggle('route-view--reading', route.view === 'lesson');
        updateNavActive(route.view);
        if (route.view === 'lesson') renderLessonView(view, route.lessonId);
        else if (route.view === 'resources') renderResourcesView(view);
        else if (route.view === 'project') renderProjectOverview(view);
        else if (route.view === 'roadmap') renderRoadmap(view);
        else if (route.view === 'release') renderReleaseDetail(view, route.releaseId);
        else if (route.view === 'task') renderTaskDetail(view, route.taskId);
        else if (route.view === 'map') renderCourseProjectMap(view);
        else if (route.view === 'architecture') renderArchitecture(view);
        else renderDashboard(view);
        setAriaCurrent(route.lessonId || state.lastLessonId);
      }
      window.addEventListener('hashchange', function() {
        /* In-page anchors (citation links like #ref-day01-2) target
           elements that already exist in the current view — let the
           browser perform its native anchor scroll and skip re-render. */
        var anchorId = window.location.hash.replace(/^#/, '');
        if (anchorId && document.getElementById(anchorId)) return;
        routeRender();
        /* Hash-only SPA navigation never triggers the browser's native
           scroll-to-top, so moving between lessons (sidebar, Bài trước/
           Bài sau) used to keep the previous scroll position. Jump
           instantly — the smooth scroll-behavior on <html> would animate
           through the freshly rendered content. */
        var htmlEl = document.documentElement;
        var prevBehavior = htmlEl.style.scrollBehavior;
        htmlEl.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        htmlEl.style.scrollBehavior = prevBehavior;
      });

      /* ---- dashboard ------------------------------------------------- */
      function renderDashboard(container) {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var jp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'java');
        var sp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'spring');

        var list = el('div', 'curriculum-list');
        courseData.units.forEach(function(u) {
          var lessonIds = u.lessonIds || [];
          var doneCount = lessonIds.filter(function(lid){ return state.completed.indexOf(lid)!==-1; }).length;

      /* ---- settings: export / import / reset (Site Task 5) -------------- */
      var APP_SCHEMA = { app: "java-spring-course", schemaVersion: 2 };
      // Import accepts the current schema and every older one it can migrate:
      // a v1 export (course progress only) is upgraded by sanitizeState, which
      // fills in an empty projectProgress. This keeps old backups importable.
      var SUPPORTED_IMPORT_VERSIONS = new Set([1, 2]);

      function downloadProgress() {
        var payload = {
          app: APP_SCHEMA.app,
          schemaVersion: APP_SCHEMA.schemaVersion,
          exportedAt: new Date().toISOString(),
          state: state,
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = el("a");
        a.href = url;
        a.download = "java-spring-course-tien-do.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        showToast("Đã tải tệp tiến độ");
      }

      function importProgressText(text, previewEl, confirmBtn) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không phải JSON hợp lệ.";
          return;
        }
        if (!parsed || parsed.app !== APP_SCHEMA.app ||
            typeof parsed.schemaVersion !== "number" || !SUPPORTED_IMPORT_VERSIONS.has(parsed.schemaVersion)) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không đúng định dạng tiến độ của khóa học (không phải tệp xuất từ khóa học này, hoặc phiên bản tệp không được hỗ trợ).";
          return;
        }
        var cleaned = CourseCore.sanitizeState(parsed.state, LESSON_IDS, UNIT_IDS, PRACTICE_IDS, BUILD_TASK_IDS);
        previewEl.hidden = false;
        previewEl.textContent = "Sẵn sàng nhập: " + cleaned.completed.length + "/" + courseData.lessons.length +
          " bài đã hoàn thành. Nhấn “Xác nhận nhập” để thay thế tiến độ hiện tại.";
        confirmBtn.hidden = false;
        confirmBtn.onclick = function() {
          state = cleaned;
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          previewEl.textContent = "Đã nhập tiến độ thành công.";
          confirmBtn.hidden = true;
          showToast("Tiến độ đã được nhập");
        };
      }

      function renderSettingsBlock(container) {
        var block = el("div", "settings-block");
        var details = el("details");
        details.appendChild(el("summary", null, "Cài đặt dữ liệu học tập"));
        var actions = el("div", "settings-actions");

        var exportBtn = el("button", "settings-btn");
        exportBtn.innerHTML = icon("download") + '<span>Tải tiến độ (.json)</span>';
        exportBtn.type = "button";
        exportBtn.setAttribute("data-action", "export-progress");
        exportBtn.addEventListener("click", downloadProgress);
        actions.appendChild(exportBtn);

        var importLabel = el("label", "settings-btn");
        importLabel.innerHTML = icon("upload") + '<span>Nhập tiến độ (.json)</span>';
        var fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".json,application/json";
        fileInput.style.display = "none";
        importLabel.appendChild(fileInput);
        actions.appendChild(importLabel);

        var resetBtn = el("button", "settings-btn settings-btn--danger");
        resetBtn.innerHTML = icon("refresh-cw") + '<span>Đặt lại tiến độ</span>';
        resetBtn.type = "button";
        resetBtn.setAttribute("data-action", "reset-progress");
        actions.appendChild(resetBtn);

        var preview = el("div", "import-preview");
        preview.hidden = true;
        var confirmBtn = el("button", "settings-btn");
        confirmBtn.innerHTML = icon("check") + '<span>Xác nhận nhập</span>';
        confirmBtn.type = "button";
        confirmBtn.hidden = true;

        fileInput.addEventListener("change", function() {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { importProgressText(String(reader.result), preview, confirmBtn); };
          reader.onerror = function() {
            preview.hidden = false;
            preview.textContent = "Không đọc được tệp đã chọn.";
          };
          reader.readAsText(file);
          fileInput.value = "";
        });

        resetBtn.addEventListener("click", function() {
          if (!window.confirm("Đặt lại toàn bộ tiến độ? Hành động này xóa trạng thái hoàn thành khóa học, tiến độ build project, bài đang học và cài đặt giao diện đã lưu trên máy bạn.")) return;
          state = CourseCore.defaultState();
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          showToast("Đã đặt lại tiến độ");
        });

        details.appendChild(actions);
        details.appendChild(preview);
        details.appendChild(confirmBtn);
        block.appendChild(details);
        container.appendChild(block);
      }

      var ICON_FILLED = { play: true };
      function icon(name, extraClass) {
        var body = ICONS[name];
        if (!body) return "";
        var filled = !!ICON_FILLED[name];
        var cls = "icon icon-" + name + (extraClass ? " " + extraClass : "");
        return '<svg class="' + cls + '" viewBox="0 0 24 24" width="1em" height="1em" ' +
          'fill="' + (filled ? "currentColor" : "none") + '" stroke="' + (filled ? "none" : "currentColor") + '" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
          body + '</svg>';

        "coding": "Luyện code",
        "applied": "Vận dụng"
      };
      var CALLOUT_CLASS = { note: "callout--note", important: "callout--important", warning: "callout--warning", deliverable: "callout--deliverable" };
      var CALLOUT_LABEL = { note: "Ghi chú: ", important: "Quan trọng: ", warning: "Lưu ý: ", deliverable: "Đề bài: " };
      var CALLOUT_ICON = { note: "info", important: "alert-triangle", warning: "alert-circle", deliverable: "flag" };
      var ALLOWED_BLOCK_TYPES = ["paragraph", "note", "important", "warning", "code", "table", "deliverable"];
      var currentLessonId = null;

      function lessonIdSlug(id) {
        return String(id).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      /* Citations -> numbered superscript links pointing at the reference cards. */
      function appendCitations(parent, citations, refIndexById) {
        if (!citations || !citations.length) return;
        citations.forEach(function(cid, i) {
          var key = String(cid).toLowerCase();
          var idx = refIndexById.get(key);
          var a = el("a", "citation-link", "[" + (idx != null ? idx : "?") + "]");
          a.href = "#ref-" + lessonIdSlug(currentLessonId) + "-" + (idx != null ? idx : key);
          a.setAttribute("aria-label", "Nguồn tham chiếu " + (idx != null ? idx : cid));
          parent.appendChild(a);
          if (i < citations.length - 1) parent.appendChild(document.createTextNode(" "));
        });
      }

      function proseParagraph(text, citations, refIndexById) {
        var p = el("p");
        p.appendChild(document.createTextNode(text == null ? "" : String(text)));
        appendCitations(p, citations, refIndexById);
        return p;
      }

      function renderBlock(container, block, refIndexById) {
        var type = block.type;
        if (ALLOWED_BLOCK_TYPES.indexOf(type) === -1) {
          container.appendChild(el("div", "authoring-warning",
            "[Cảnh báo biên soạn] Khối nội dung không hỗ trợ: \"" + type + "\" — đã ẩn để tránh hiển thị sai."));
          return;
        }
        if (type === "code") {
          var fig = el("figure", "code-sample");
          var cap = el("figcaption");
          cap.appendChild(el("span", null, block.language ? block.language.toUpperCase() + (block.compile === false && block.partialReason ? " — không biên dịch độc lập" : "") : ""));
          var copyBtn = el("button", "copy-btn");
          copyBtn.innerHTML = icon("copy") + '<span>Sao chép mã</span>';
          copyBtn.type = "button";
          copyBtn.setAttribute("data-action", "copy-code");
          copyBtn.setAttribute("aria-label", "Sao chép mã mẫu vào clipboard");
          copyBtn.addEventListener("click", function() {
            copyText(block.code || "").then(function() { showToast("Đã sao chép mã"); },
              function() { showToast("Không thể sao chép tự động — hãy chọn mã và sao chép thủ công."); });
          });
          cap.appendChild(copyBtn);
          fig.appendChild(cap);
          var pre = el("pre");
          pre.appendChild(el("code", null, block.code || ""));
          fig.appendChild(pre);
          container.appendChild(fig);
          return;
        }
        if (type === "table") {
          var wrap = el("div", "data-table-wrap");
          var table = el("table", "data-table");
          var cols = block.columns || [];
          table.appendChild(el("caption", null, cols.join(" · ")));
          var thead = el("thead");
          var hr = el("tr");
          cols.forEach(function(c) { hr.appendChild(el("th", null, c)); });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tbody = el("tbody");
          (block.rows || []).forEach(function(row) {
            var tr = el("tr");
            row.forEach(function(cell, ci) {
              var td = el(ci < cols.length - 1 ? "td" : "td");
              td.appendChild(document.createTextNode(cell == null ? "" : String(cell)));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          return;
        }
        if (type === "note" || type === "important" || type === "warning" || type === "deliverable") {
          var aside = el("aside", "callout " + (CALLOUT_CLASS[type] || ""));
          aside.setAttribute("role", type === "warning" ? "alert" : "note");
          var calloutIcon = el("span", "callout-icon");
          calloutIcon.setAttribute("aria-hidden", "true");
          calloutIcon.innerHTML = icon(CALLOUT_ICON[type] || "info");
          aside.appendChild(calloutIcon);
          var calloutBody = el("div", "callout-body");
          var head = el("div", "callout-head");
          head.appendChild(el("strong", "callout-label", CALLOUT_LABEL[type] || ""));
          calloutBody.appendChild(head);
          /* Deliverable text is often an authored multi-line bullet list — preserve line breaks. */
          if (type === "deliverable") {
            var body = el("span", "deliverable-body");
            body.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
            calloutBody.appendChild(body);
          } else {
            calloutBody.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
          }
          appendCitations(calloutBody, block.citations, refIndexById);
          aside.appendChild(calloutBody);
          container.appendChild(aside);
          return;
        }
        /* paragraph */
        container.appendChild(proseParagraph(block.text, block.citations, refIndexById));
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function() { return "clipboard"; });
        }
        return new Promise(function(resolve, reject) {
          var area = Object.assign(document.createElement("textarea"), { value: text });
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          area.remove();
          if (!ok) reject(new Error("copy unavailable")); else resolve("fallback");
        });
      }

      function showToast(message) {
        var region = document.getElementById("toast-region");
        if (!region) return;
        var t = el("div", "toast", message);
        region.appendChild(t);
        setTimeout(function() { t.remove(); }, 2600);
      }
