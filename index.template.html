      /* ---- practice cards --------------------------------------------- */
      function disclosureButton(label, panelId, iconName) {
        var b = el("button", "disclosure-btn");
        b.innerHTML = (iconName ? icon(iconName) : "") + "<span>" + label + "</span>";
        b.type = "button";
        b.setAttribute("aria-expanded", "false");
        b.setAttribute("aria-controls", panelId);
        return b;
      }

      function wireDisclosure(btn, panel) {
        btn.addEventListener("click", function() {
          var open = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", open ? "false" : "true");
          panel.hidden = open;
        });
      }

      function renderPractice(container, practice) {
        var card = el("article", "practice-card");
        card.id = "practice-" + practice.id;
        var head = el("div", "practice-head");
        var kindLabel = PRACTICE_KIND_LABELS[practice.type] || practice.type;
        if (practice.interaction === "multiple-choice") kindLabel += " · trắc nghiệm";
        head.appendChild(el("div", "practice-kind", kindLabel));
        head.appendChild(el("p", "practice-prompt", practice.prompt || ""));
        card.appendChild(head);

        var body = el("div", "practice-body");
        if (practice.starterCode) {
          var starter = el("div", "practice-starter");
          var pre = el("pre");
          pre.appendChild(el("code", null, practice.starterCode));
          starter.appendChild(pre);
          body.appendChild(starter);
        }

        var mc = practice.interaction === "multiple-choice";

        if (mc && practice.choices && practice.choices.length) {
          var isMulti = (practice.correctChoiceIds || []).length > 1;
          var fieldset = el("fieldset");
          fieldset.style.cssText = "margin:0 0 .625rem;padding:0;border:none;";
          var legend = el("legend", "visually-hidden", isMulti ? "Chọn nhiều đáp án" : "Chọn một đáp án");
          fieldset.appendChild(legend);
          var list = el("ul", "choice-list");
          practice.choices.forEach(function(choice) {
            var li = el("li", "choice-item");
            li.setAttribute("data-choice-id", choice.id);
            var input = document.createElement("input");
            input.type = isMulti ? "checkbox" : "radio";
            input.name = "choice-" + practice.id;
            input.value = choice.id;
            input.id = choice.id;
            var label = el("label");
            label.htmlFor = choice.id;
            label.appendChild(input);
            label.appendChild(el("span", null, choice.text));
            li.appendChild(label);
            list.appendChild(li);
          });
          fieldset.appendChild(list);
          body.appendChild(fieldset);

          var checkBtn = el("button", "disclosure-btn");
          checkBtn.innerHTML = icon("check") + "<span>Kiểm tra đáp án</span>";
          checkBtn.type = "button";
          checkBtn.setAttribute("data-action", "check-practice");
          checkBtn.setAttribute("data-practice-id", practice.id);
          body.appendChild(checkBtn);

          var fb = el("div", "check-feedback");
          fb.id = "feedback-" + practice.id;
          fb.hidden = true;
          body.appendChild(fb);

          checkBtn.addEventListener("click", function() {
            var picked = Array.prototype.slice.call(
              body.querySelectorAll('input[name="choice-' + practice.id + '"]:checked')
            ).map(function(inp) { return inp.value; });
            if (!picked.length) { showToast("Hãy chọn ít nhất một đáp án trước khi kiểm tra."); return; }
            var correct = new Set(practice.correctChoiceIds || []);
            var allCorrect = picked.length === correct.size && picked.every(function(id){ return correct.has(id); });
            /* mark per-choice correctness */
            body.querySelectorAll(".choice-item").forEach(function(li) {
              var cid = li.getAttribute("data-choice-id");
              li.classList.remove("is-correct", "is-wrong");
              if (correct.has(cid)) li.classList.add("is-correct");
              else if (picked.indexOf(cid) !== -1) li.classList.add("is-wrong");
            });
            fb.className = "check-feedback " + (allCorrect ? "ok" : "wrong");
            fb.textContent = (allCorrect ? "Chính xác! " : "Chưa đúng. ") + (practice.explanation || "");
            fb.hidden = false;
            /* persist attempted state */
            state.practice[practice.id] = { attempted: true };
            saveState();
          });
        }

        var actions = el("div", "practice-actions");
        if (practice.hint) {
          var hintPanelId = "hint-" + practice.id;
          var hintBtn = disclosureButton("Gợi ý", hintPanelId, "lightbulb");
          var hintPanel = el("div", "disclosure-panel");
          hintPanel.id = hintPanelId;
          hintPanel.hidden = true;
          hintPanel.textContent = practice.hint;
          actions.appendChild(hintBtn);
          body.appendChild(hintPanel);
          wireDisclosure(hintBtn, hintPanel);
        }
        if (practice.solution || (mc && practice.explanation)) {
          var solPanelId = "sol-" + practice.id;
          var solBtn = disclosureButton(mc ? "Xem giải thích" : "Xem lời giải", solPanelId, "book-open");
          var solPanel = el("div", "disclosure-panel");
          solPanel.id = solPanelId;
          solPanel.hidden = true;
          var solutionText = mc
            ? ((practice.correctChoiceIds || []).join(", ") + (practice.explanation ? " — " + practice.explanation : ""))
            : [practice.solution, practice.explanation].filter(Boolean).join("\n\n");
          solPanel.textContent = solutionText;
          actions.appendChild(solBtn);
          body.appendChild(solPanel);
          wireDisclosure(solBtn, solPanel);
        }
        if (actions.childNodes.length) { body.appendChild(actions); }
        card.appendChild(body);
        container.appendChild(card);
      }

      function renderPractices(container, lesson) {
        if (!lesson.practices || !lesson.practices.length) return;
        var blockEl = el("section", "section-block");
        blockEl.appendChild(el("h2", "section-heading", "Luyện tập"));
        lesson.practices.forEach(function(p) { renderPractice(blockEl, p); });
        container.appendChild(blockEl);
      }


      /* ---- assignments (syllabus original vs enrichment) --------------- */
      function renderAssignments(container, lesson) {
        var syllabus = lesson.syllabusAssignments || [];
        var enhanced = lesson.enhancedExercises || [];
        if (!syllabus.length && !enhanced.length) return;
        var blockEl = el("section", "assignments-block");
        if (syllabus.length) {
          blockEl.appendChild(el("h2", null, "Bài tập trong syllabus"));
          syllabus.forEach(function(a) {
            var item = el("div", "assignment-item");
            item.appendChild(el("span", "assignment-origin", "Nội dung gốc · dòng " + a.row));
            item.appendChild(document.createTextNode("\n" + (a.text || "")));
            blockEl.appendChild(item);
          });
        }
        if (enhanced.length) {
          blockEl.appendChild(el("h2", null, "Luyện tập bổ sung"));
          enhanced.forEach(function(text) {
            var item = el("div", "assignment-item");
            item.style.borderLeftColor = "var(--spring)";
            item.appendChild(el("span", "assignment-origin", "Bổ sung"));
            item.appendChild(document.createTextNode("\n" + text));
            blockEl.appendChild(item);
          });

        container.appendChild(blockEl);
      }

      /* ---- references with transparent read status ---------------------- */
      /* Populates refIndexById (citationId -> 1-based number) ahead of any
         citation rendering. Must run before renderSections()/appendCitations()
         look citations up — renderReferences() itself runs later in page
         composition order (References sits near the bottom of the lesson),
         but the numbering it defines has to be known before the in-body
         superscripts that point at it are built. */
      function buildRefIndex(lesson, refIndexById) {
        (lesson.references || []).forEach(function(ref, i) {
          refIndexById.set(String(ref.citationId || ref.id).toLowerCase(), i + 1);
        });
      }

      function renderReferences(container, lesson, refIndexById, refCards) {
        if (!lesson.references || !lesson.references.length) return;
        var blockEl = el("section", "references-block");
        blockEl.id = "references-" + lessonIdSlug(lesson.id);
        blockEl.appendChild(el("h2", null, "Nguồn tham chiếu"));

        lesson.references.forEach(function(ref, i) {
          var num = refIndexById.get(String(ref.citationId || ref.id).toLowerCase()) || (i + 1);
          var card = el("article", "ref-card");
          card.id = "ref-" + lessonIdSlug(lesson.id) + "-" + num;
          var headRow = el("div", "ref-card-head");
          headRow.appendChild(el("span", "ref-num", "[" + num + "]"));
          if (ref.type === "external") {
            headRow.appendChild(el("strong", null, ref.label || ref.pageTitle || ref.resourceId));
            headRow.appendChild(el("span", "badge-domain", ref.url ? new URL(ref.url).hostname : ""));
            if (ref.readStatus === "read") headRow.appendChild(el("span", "badge-read", "đã đọc"));
          } else {
            /* Internal cross-reference (links back to an earlier lesson's
               content, not an external source) — has no URL/label/read
               status to show, so render its authored description instead
               of leaving the card blank. */
            headRow.appendChild(el("strong", null, "Liên kết nội dung trong khóa học"));
            headRow.appendChild(el("span", "badge-domain", "nội bộ"));
          }
          card.appendChild(headRow);
          if (ref.type === "external") {
            if (ref.pageTitle) {
              card.appendChild(el("div", null, "Trang: " + ref.pageTitle));
            }
            if (ref.url) {
              var linkP = el("p");
              var a = el("a", "ref-url", ref.safeUrl || ref.url);
              a.href = CourseCore.safeExternalUrl(ref.url) || "#";
              if (a.href !== "#") {
                a.target = "_blank";
                a.rel = "noopener noreferrer";
              }
              linkP.appendChild(a);
              card.appendChild(linkP);
            }
          } else if (ref.description) {
            card.appendChild(el("p", null, ref.description));
          }
          /* section backlink */
          var back = el("a", null, "↑ Về đầu bài học");
          back.href = "#lesson/" + lesson.id;
          back.style.cssText = "font-size:.75rem;color:var(--muted);text-decoration:none;display:inline-block;margin-top:.375rem;";
          back.addEventListener("click", function(ev) {
            ev.preventDefault();
            window.location.hash = "#lesson/" + lesson.id;
            setTimeout(function() { document.getElementById("main-content").focus(); }, 50);
          });
          card.appendChild(back);
          blockEl.appendChild(card);
          refCards.push({ ref: ref, num: num });
        });

        /* Supplied but inaccessible resources — separate disclosure.
           Only applies to external sources (an internal cross-reference
           has no external check status, so it can never be "unavailable"
           in this sense — including it here previously produced a blank,
           misleading card for every internal reference). */
        var unavailable = (lesson.references || []).filter(function(r) {
          return r.type === "external" && r.readStatus !== "read";
        });
        if (unavailable.length) {
          var details = el("details", "ref-unavailable");
          details.appendChild(el("summary", null,
            "Nguồn được cung cấp nhưng không truy cập được (" + unavailable.length + ")"));
          unavailable.forEach(function(ref) {
            var card = el("article", "ref-card");
            card.appendChild(el("strong", null, ref.label || ref.resourceId));
            card.appendChild(el("div", null, "Trạng thái kiểm tra: " + (ref.checkStatus || "không rõ")));
            if (ref.limitation) card.appendChild(el("div", null, "Giới hạn: " + ref.limitation));
            details.appendChild(card);
          });
          blockEl.appendChild(details);
        }
        container.appendChild(blockEl);
      }

      /* ---- footer navigation -------------------------------------------- */
      function renderLessonNav(container, lesson) {
        var prevId = CourseCore.nextLessonId(courseData.lessons, lesson.id, -1);
        var nextId = CourseCore.nextLessonId(courseData.lessons, lesson.id, 1);
        var nav = el("nav", "lesson-nav");
        nav.setAttribute("aria-label", "Điều hướng bài học");

        if (prevId) {
          var prevLesson = lessonsById.get(prevId);
          var prevA = el("a", "nav-prev");
          prevA.href = "#lesson/" + prevId;
          prevA.innerHTML = icon("arrow-left") + '<span><span class="nav-label">Bài trước</span><span>' +
            CourseCore.escapeHtml(prevLesson ? prevLesson.title : prevId) + "</span></span>";
          nav.appendChild(prevA);
        } else {
          nav.appendChild(el("span"));
        }

        var done = state.completed.indexOf(lesson.id) !== -1;
        var toggleBtn = el("button", "nav-complete");
        toggleBtn.innerHTML = icon("check") + "<span>" + (done ? "Đã hoàn thành" : "Đánh dấu hoàn thành") + "</span>";
        toggleBtn.type = "button";
        toggleBtn.setAttribute("data-action", "toggle-completion");
        toggleBtn.setAttribute("data-lesson-id", lesson.id);
        toggleBtn.setAttribute("aria-pressed", done ? "true" : "false");
        nav.appendChild(toggleBtn);

        if (nextId) {
          var nextLesson = lessonsById.get(nextId);
          var nextA = el("a", "nav-next");
          nextA.href = "#lesson/" + nextId;
          nextA.innerHTML = icon("arrow-right") + '<span><span class="nav-label">Bài sau</span><span>' +
            CourseCore.escapeHtml(nextLesson ? nextLesson.title : nextId) + "</span></span>";
          nav.appendChild(nextA);
        } else {
          nav.appendChild(el("span"));
        }
        container.appendChild(nav);
      }

      /* ---- main lesson view ------------------------------------------------ */
      function renderFullLesson(container, lesson) {
        currentLessonId = lesson.id;
        var refIndexById = new Map();
        var refCards = [];
        buildRefIndex(lesson, refIndexById);

        renderLessonHeader(container, lesson, refIndexById);
        renderProjectContext(container, lesson.id);
        renderSections(container, lesson, refIndexById);
        renderPractices(container, lesson);
        renderAssignments(container, lesson);
        renderProjectApplication(container, lesson.id);
        renderReferences(container, lesson, refIndexById, refCards);
        renderLessonNav(container, lesson);
        container.setAttribute("tabindex", "-1");
      }

      function renderLessonView(container, lessonId) {
        var lesson = lessonsById.get(lessonId);

            '<p style="color:var(--muted);margin-top:1rem;">Bài học này đang được biên soạn — nội dung sẽ được bổ sung trong giai đoạn tiếp theo.</p>' +
            '<p><a href="#dashboard" style="color:var(--spring-ink);">← Về tổng quan</a></p></div>';

      /* ---- project workspace (P0) ---------------------------------------- */
      function renderProjectWorkspaceHeader(container, eyebrow, title, summary) {
        var header = el('header', 'workspace-header');
        var copy = el('div');
        copy.appendChild(el('div', 'workspace-eyebrow', eyebrow));
        copy.appendChild(el('h1', 'workspace-title', title));
        if (summary) copy.appendChild(el('p', 'workspace-summary', summary));
        header.appendChild(copy);
        container.appendChild(header);
        return header;
      }

      function renderProjectOverview(container) {
        if (!projectData) { renderProjectEmpty(container); return; }

        var header = renderProjectWorkspaceHeader(container, 'Project Track', product.name, product.type);

        renderProjectSubNav(container, 'project');

        var grid = el('div', 'project-overview-grid');

        var milestonePanel = el('section', 'project-panel');

        var next = el('section', 'project-panel');

        grid.appendChild(next);

        var roadmap = el('section', 'project-panel');
        roadmap.appendChild(el('div', 'project-section-label', 'Roadmap'));
        roadmap.appendChild(el('p', null, (projectData.releases || []).length + ' release từ ' + projectData.releases[0].version + ' đến ' + projectData.releases[projectData.releases.length - 1].version + '.'));
        var roadmapLink = el('a', 'roadmap-entry', 'Xem toàn bộ lộ trình');
        roadmapLink.href = '#/roadmap';
        roadmap.appendChild(roadmapLink);
        grid.appendChild(roadmap);
        container.appendChild(grid);

        // Domain Overview (P1-4) — entities are derived from
        // features[].domainEntities (union+dedup), never hardcoded, so this
        // section only ever shows what the project data actually supports.
        var domainSection = el('section', 'project-panel release-section');
        domainSection.appendChild(el('h2', null, 'Domain Overview'));

        if (entities.length) {

        // Project boundaries — product.outOfScope, behind a disclosure so it

          scopeSection.appendChild(el('h2', null, 'Project Boundaries'));

      function createRoadmapReleaseLink(release) {

      function renderReleaseDetail(container, releaseId) {
        if (!projectData) { renderProjectEmpty(container); return; }
        var release = releasesById.get(releaseId);
        if (!release) {
          renderProjectSubNav(container, 'roadmap');
          var notFound = el('section', 'project-not-found');
          notFound.appendChild(el('h1', null, 'Không tìm thấy release'));
          notFound.appendChild(el('p', null, 'Release “' + releaseId + '” không tồn tại trong project data.'));
          var back = el('a', 'text-link', '← Về Roadmap');
          back.href = '#/roadmap';
          notFound.appendChild(back);
          container.appendChild(notFound);
          return;
        }

        // Release Detail inherits the Roadmap tab in both the primary nav
        // (see updateNavActive) and this contextual sub-nav, since a release
        // page is reached from — and conceptually belongs to — the roadmap.
        renderProjectSubNav(container, 'roadmap');

        var detail = el('div');
        detail.setAttribute('data-release-detail', release.id);

        // RELEASE — hero keeps authored status (badge) and personal build
        // progress (progress bar) visually side by side but never merged
        // into one number, so the two signals stay legible as independent.
        var hero = el('header', 'release-hero');
        var line = el('div', 'project-release-line');
        line.appendChild(el('span', 'project-release-version', release.version));
        appendStatusBadge(line, release.status);
        hero.appendChild(line);
        hero.appendChild(el('h1', null, release.title));
        hero.appendChild(el('p', null, release.goal));
        hero.appendChild(createProjectProgress(release, 'Release Progress'));
        detail.appendChild(hero);

        // Problem -> Goal, side by side (closely paired, read together).
        var problemGoal = el('div', 'release-columns');
        var problem = el('section', 'project-panel');
        problem.appendChild(el('div', 'project-section-label', 'Problem'));
        problem.appendChild(el('p', null, release.problem));
        problemGoal.appendChild(problem);
        var goal = el('section', 'project-panel');
        goal.appendChild(el('div', 'project-section-label', 'Goal'));
        goal.appendChild(el('p', null, release.goal));
        problemGoal.appendChild(goal);
        detail.appendChild(problemGoal);

        // Features — richer cards (description, domainEntities, per-feature
        // progress) instead of the plain name list used on lesson pages.
        var features = el('section', 'project-panel release-section');
        features.appendChild(el('h2', null, 'Features'));
        appendFeatureDetailList(features, release.featureIds);
        detail.appendChild(features);

        // Learning Dependencies, reframed as a Learning <-> Project bridge:
        // readable prose-list of concepts, not a tag cloud.
        var deps = el('section', 'project-panel release-section');
        deps.appendChild(el('h2', null, 'Learning ↔ Project'));
        deps.appendChild(el('p', null, 'Kiến thức khoá học cần có trước khi bắt tay vào release này:'));
        var depList = el('ul', 'dependency-list');
        (release.learningDependencies || []).forEach(function(item) { depList.appendChild(el('li', null, item)); });
        deps.appendChild(depList);
        detail.appendChild(deps);

        // Build Tasks — expandable items (constraints / acceptance criteria
        // / relevant lessons) sharing the same toggleBuildTask state as the
        // Dashboard and lesson Project Application panels.
        var tasks = el('section', 'project-panel release-section');
        tasks.appendChild(el('h2', null, 'Build Tasks'));
        if ((release.buildTaskIds || []).length) appendExpandableBuildTaskList(tasks, release.buildTaskIds);
        else tasks.appendChild(el('p', null, 'Release này chưa có build task để theo dõi. Bạn vẫn có thể xem Goal, Features, Learning Dependencies và kế hoạch Architecture của release.'));
        detail.appendChild(tasks);

        // Acceptance Criteria
        var criteria = el('section', 'project-panel release-section');
        criteria.appendChild(el('h2', null, 'Acceptance Criteria'));
        var criteriaList = el('ul', 'criteria-list');
        (release.acceptanceCriteria || []).forEach(function(item) { criteriaList.appendChild(el('li', null, item)); });
        criteria.appendChild(criteriaList);
        detail.appendChild(criteria);

        // Architecture — this release's planned stage.
        var architecture = archStageByReleaseId.get(release.id);
        if (architecture) {
          var stage = el('section', 'project-panel architecture-stage release-section');
          stage.appendChild(el('h2', null, 'Architecture: ' + architecture.title));
          if (release.status === 'planned') stage.appendChild(el('p', 'architecture-target-note', 'Architecture planned for this release — not yet built.'));
          stage.appendChild(el('p', null, architecture.rationale));
          if ((architecture.layers || []).length) {
            var layerList = el('ul', 'criteria-list');
            architecture.layers.forEach(function(layer) { layerList.appendChild(el('li', null, layer)); });
            stage.appendChild(layerList);
          }
          // The diagram itself is deliberately NOT repeated here: the
          // Architecture Change section immediately below renders the very
          // same ASCII diagram as its "After"/"Initial Architecture" column,
          // and showing it twice inside one viewport is duplicate
          // presentation of identical data. Title, rationale and layers stay.
          detail.appendChild(stage);

          // Before/After Architecture Change (P1-7). V0.1 has no prior
          // release, so it only ever shows "Initial Architecture" — never an
          // invented "Before" state. V0.2+ resolves the previous release by
          // order (release.order - 1), never a hardcoded description.
          var compare = el('section', 'project-panel release-section');
          compare.appendChild(el('h2', null, 'Architecture Change'));
          var prevRelease = (projectData.releases || []).find(function(r) { return r.order === release.order - 1; });
          var prevStage = prevRelease ? archStageByReleaseId.get(prevRelease.id) : null;
          var compareGrid = el('div', 'architecture-compare');
          if (prevStage) {
            var beforeCol = el('div', 'architecture-compare-col');
            beforeCol.appendChild(el('div', 'architecture-compare-label', 'Before · ' + prevRelease.version));
            beforeCol.appendChild(createArchitectureDiagram(prevStage.diagram, 'Sơ đồ kiến trúc trước đó · ' + prevRelease.version + ' — ' + prevStage.title));
            compareGrid.appendChild(beforeCol);
          }
          var afterCol = el('div', 'architecture-compare-col');
          afterCol.appendChild(el('div', 'architecture-compare-label', prevStage ? 'After · ' + release.version : 'Initial Architecture'));
          afterCol.appendChild(createArchitectureDiagram(architecture.diagram, 'Sơ đồ kiến trúc ' + release.version + ' — ' + architecture.title));
          compareGrid.appendChild(afterCol);
          compare.appendChild(compareGrid);
          if (prevStage && architecture.changesFromPrev) {
            compare.appendChild(el('p', 'architecture-compare-changes', architecture.changesFromPrev));
          }
          detail.appendChild(compare);
        }

        container.appendChild(detail);
      }

      var MAP_TYPE_LABELS = { direct: 'Direct', future: 'Future', theory: 'Theory', unmapped: 'Unmapped' };

      function createMapRow(row) {
        var item = el('div', 'map-row');
        var main = el('div', 'map-row-main');
        var link = el('a', 'text-link', row.title);
        link.href = '#/lesson/' + row.id;
        main.appendChild(link);
        if (row.group) main.appendChild(el('div', 'map-row-group', row.group));
        item.appendChild(main);

        var meta = el('div', 'map-row-meta');
        // Reuses the .project-type pill shape, but its color modifiers are
        // named map-type--* (not project-type--*): the latter is already a
        // bare-class selector applied to the OUTER .project-context/
        // .project-application container elsewhere (a different, container-
        // level combo), so reusing it here on a single badge span would leak
        // border/background rules meant for that container.
        meta.appendChild(el('span', 'project-type map-type--' + row.applicationType, MAP_TYPE_LABELS[row.applicationType] || row.applicationType));
        if (row.releaseId) {
          var release = releasesById.get(row.releaseId);
          if (release) {
            var releaseLink = el('a', 'text-link', release.version);
            releaseLink.href = '#/release/' + release.id;
            meta.appendChild(releaseLink);
          }
        }
        if ((row.featureIds || []).length) {
          var names = row.featureIds.map(function(id) {
            var feature = featuresById.get(id);
            return feature ? feature.name : id;
          }).join(', ');
          meta.appendChild(el('span', 'map-row-features', names));
        }
        item.appendChild(meta);
        return item;
      }

      // Course <-> Project Map (P1-2). Filters are client-side only, never
      // persisted — CourseCore.deriveMapRows/filterMapRows do the pure work,
      // this just wires two filter controls to a re-render of the row list.
      function renderCourseProjectMap(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        renderProjectWorkspaceHeader(
          container,
          'Course ↔ Project',
          'Course ↔ Project Map',
          'Mỗi bài học liên hệ với ' + projectData.product.name + ' ra sao: direct (xây trực tiếp), future (dùng ở release sau), theory (kiến thức nền), hoặc unmapped (bài tổng hợp chưa gắn với release cụ thể).'
        );
        renderProjectSubNav(container, 'map');

        var allRows = CourseCore.deriveMapRows(courseData.lessons, projectData.lessonMap);
        var filterState = { type: 'all', release: 'all' };

        var filterBar = el('div', 'map-filterbar');
        filterBar.setAttribute('role', 'group');
        filterBar.setAttribute('aria-label', 'Lọc bản đồ khoá học ↔ dự án');
        var TYPE_FILTERS = [
          { key: 'all', label: 'Tất cả' },
          { key: 'direct', label: 'Direct' },
          { key: 'future', label: 'Future' },
          { key: 'theory-unmapped', label: 'Theory / Unmapped' },
        ];
        var typeButtons = TYPE_FILTERS.map(function(filter) {
          var btn = el('button', 'map-filter-btn', filter.label);
          btn.type = 'button';
          btn.setAttribute('aria-pressed', filter.key === 'all' ? 'true' : 'false');
          btn.addEventListener('click', function() {
            filterState.type = filter.key;
            typeButtons.forEach(function(other) { other.setAttribute('aria-pressed', other === btn ? 'true' : 'false'); });
            renderRows();
          });
          filterBar.appendChild(btn);
          return btn;
        });

        var releaseWrap = el('div', 'map-filter-release');
        var releaseLabel = el('label', null, 'Release');
        releaseLabel.setAttribute('for', 'map-release-filter');
        var releaseSelect = el('select');
        releaseSelect.id = 'map-release-filter';
        var allOption = el('option', null, 'Tất cả release');
        allOption.value = 'all';
        releaseSelect.appendChild(allOption);
        (projectData.releases || []).slice().sort(function(a, b) { return a.order - b.order; }).forEach(function(release) {
          var opt = el('option', null, release.version + ' — ' + release.title);
          opt.value = release.id;
          releaseSelect.appendChild(opt);
        });
        releaseSelect.addEventListener('change', function() {
          filterState.release = releaseSelect.value;
          renderRows();
        });
        releaseWrap.appendChild(releaseLabel);
        releaseWrap.appendChild(releaseSelect);
        filterBar.appendChild(releaseWrap);
        container.appendChild(filterBar);

        var summary = el('p', 'map-summary');
        container.appendChild(summary);
        var rowsContainer = el('div', 'map-rows');
        container.appendChild(rowsContainer);

        function renderRows() {
          var filtered = CourseCore.filterMapRows(allRows, filterState.type, filterState.release);
          summary.textContent = filtered.length + ' / ' + allRows.length + ' bài học';
          rowsContainer.innerHTML = '';
          if (!filtered.length) {
            rowsContainer.appendChild(el('p', 'project-empty', 'Không có bài học nào khớp với bộ lọc hiện tại.'));
            return;
          }
          filtered.forEach(function(row) { rowsContainer.appendChild(createMapRow(row)); });
        }
        renderRows();
      }

      // Architecture Evolution (P1-3). Single source of truth:
      // projectData.architectureStages, joined + ordered via
      // CourseCore.orderArchitectureStages. Every release currently carries
      // status "planned", so copy is deliberately honest — only the
      // resolved current release (selectCurrentRelease) is called out as
      // the "Current Build Target"; every stage (including that one) is
      // still labelled "planned", never "currently deployed".
      function renderArchitecture(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        renderProjectWorkspaceHeader(
          container,
          'Architecture Evolution',
          'Architecture Evolution',
          'Kiến trúc ' + projectData.product.name + ' mở rộng dần theo từng release. Mọi stage dưới đây đều đang ở trạng thái kế hoạch — chưa có stage nào được xây hay đang chạy production.'
        );
        renderProjectSubNav(container, 'architecture');

        var pairs = CourseCore.orderArchitectureStages(projectData.releases || [], projectData.architectureStages || []);
        if (!pairs.length) {
          container.appendChild(el('p', 'project-empty', 'Chưa có architecture stage nào trong kế hoạch.'));
          return;
        }
        var currentRelease = currentProjectRelease();

        var stageNav = el('nav', 'architecture-stage-nav');
        stageNav.setAttribute('aria-label', 'Chuyển nhanh giữa các architecture stage');
        var stageNavLinks = [];
        /* The pills (and each stage's Prev/Next controls) are in-page jump
           links, and the hashchange handler deliberately skips re-rendering
           for in-page anchors so the browser's native scroll works — which
           means nothing would otherwise update which stage the learner is
           on. Mark the jumped-to pill with aria-current="location", the
           accurate value for a position inside the current page (rather
           than "page", which would claim a separate destination). */
        function markStageNav(stageId) {
          stageNavLinks.forEach(function(link) {
            if (link.getAttribute('data-stage-nav') === stageId) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
          });
        }
        function stageJumpLink(className, label, targetReleaseId) {
          var link = el('a', className, label);
          link.href = '#architecture-stage-' + targetReleaseId;
          link.addEventListener('click', function() { markStageNav(targetReleaseId); });
          return link;
        }
        pairs.forEach(function(pair) {
          var link = stageJumpLink('architecture-stage-nav-link', pair.release.version, pair.release.id);
          link.setAttribute('data-stage-nav', pair.release.id);
          stageNav.appendChild(link);
          stageNavLinks.push(link);
        });
        container.appendChild(stageNav);

        /* ---- P4: Architecture Constitution (canonical R1–R26) ------------ */
        /* The rules are grouped and ordered exactly as Blueprint §3 groups
           them; the heading + intro state which artifact is authoritative so
           the canonical text and this UI projection stay clearly separated.
           Each rule carries a plain id (R1…R26): inside this view the
           hashchange handler treats it as an in-page anchor (same mechanism
           as the stage pills), which is how the defense matrix links to
           them. Rule chips
           on Build task pages live in a different view, so they link to the
           #/architecture route, not a bare #Rn — a cross-view #Rn hash falls
           through parseRoute to the dashboard. */
        var constitution = el('section', 'project-panel release-section');
        constitution.id = 'constitution';
        constitution.appendChild(el('div', 'project-section-label', 'Architecture Constitution'));
        var constitutionH2 = el('h2', null, 'Bộ 26 luật kiến trúc (R1–R26)');
        constitutionH2.id = 'constitution-heading';
        constitution.appendChild(constitutionH2);
        constitution.appendChild(el('p', null,
          '26 luật dưới đây là bản chiếu đọc (reader-facing projection) của Architecture Constitution ' +
          'định nghĩa trong Architecture Blueprint (docs/report/2026-09-05-spendwise-architecture-blueprint.md §3). ' +
          'Blueprint là nguồn chuẩn; trang này không thêm, bớt hay giải thích lại luật nào. ' +
          'Đoạn tiếng Anh là phần nghĩa canonical của luật; khung ghi chú tiếng Việt chỉ là phần diễn giải cho người đọc.'));
        constitution.appendChild(el('p', 'architecture-target-note',
          'Mọi token architectureRules trong 161 build step của dự án phải trỏ về một trong 26 luật này. ' +
          'Trên trang Build task, chip R1…R26 của mỗi step liên kết tới view này — đây là nơi tra nghĩa của luật.'));
        var constitutionGroupsData = CourseCore.CONSTITUTION_GROUPS || [];
        var constitutionData = CourseCore.ARCHITECTURE_CONSTITUTION || [];
        var product = projectData.product;
        constitutionGroupsData.forEach(function(group) {
          var rulesInGroup = constitutionData.filter(function(rule) { return rule.group === group.key; });
          if (!rulesInGroup.length) return;
          var groupSection = el('div', 'constitution-group');
          var groupHeading = el('h3', null, group.label);
          groupHeading.id = 'constitution-group-' + group.key;
          groupSection.appendChild(groupHeading);
          rulesInGroup.forEach(function(rule) {

      /* ---- search panel ---------------------------------------------- */
      /* renderApp() (called below, and again inside the self-test) creates
         #site-search fresh each time it rebuilds the header, so — same as
         syncThemeButton() — this must be looked up and (re)wired AFTER each
         renderApp() call, not once at top-level script scope where the
         element doesn't exist yet. */
      function wireSearch() {
        var searchInput = document.getElementById('site-search');
        if (!searchInput || !searchInput.parentElement) return;
        var searchPanel = document.createElement('div');
        searchPanel.id = 'search-results';
        searchPanel.setAttribute('role', 'listbox');
        searchPanel.style.cssText = 'position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:0 0 var(--radius-md) var(--radius-md);max-height:18rem;overflow-y:auto;display:none;z-index:200;box-shadow:var(--shadow-float);';
        searchInput.parentElement.style.position = 'relative';
        searchInput.parentElement.appendChild(searchPanel);
        searchInput.oninput = function() {
          var hits = CourseCore.searchLessons(courseData.lessons, courseData.units, searchInput.value);
          searchPanel.textContent = '';
          if (!searchInput.value.trim() || !hits.length) { searchPanel.style.display = 'none'; return; }
          searchPanel.style.display = 'block';
          hits.forEach(function(l) {
            var item = document.createElement('a');
            item.href = '#lesson/' + l.id;
            item.className = 'search-result-item';
            item.setAttribute('role', 'option');
            item.style.cssText = 'display:block;padding:.625rem .75rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.875rem;';
            var unit = unitsById.get(l.unitId);
            item.innerHTML = '<span style="color:var(--muted);font-size:.75rem;">' + (unit ? 'Unit ' + unit.number : '') + ' | ' + (l.group||'') + '</span><div>' + (l.title || l.id) + '</div>';
            item.onclick = function() { searchInput.value = ''; searchPanel.style.display = 'none'; closeDrawer(); };
            searchPanel.appendChild(item);
          });
        };
        searchInput.onblur = function(){ setTimeout(function(){ searchPanel.style.display = 'none'; }, 200); };
      }

      /* ---- drawer with focus trap -------------------------------------- */
      var lastFocusedBeforeDrawer = null;

      function drawerFocusables() {
        var sidebar = document.getElementById('course-sidebar');
        if (!sidebar) return [];
        return Array.prototype.filter.call(
          sidebar.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'),
          function(node) { return node.offsetParent !== null || node.getClientRects().length > 0; }
        );
      }

      function openDrawer() {
        var btn = document.querySelector('[data-action="open-drawer"]');
        lastFocusedBeforeDrawer = document.activeElement;
        document.body.classList.add('drawer-open');
        if (btn) btn.setAttribute('aria-expanded', 'true');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = false;
        /* Focus the current lesson link if present, else first focusable */
        var targetLink = document.querySelector('.lesson-link[aria-current="page"]') || drawerFocusables()[0];
        if (targetLink) { targetLink.focus(); return; }
        /* Sidebar may not be rendered yet — focus the sidebar itself */
        var sidebar = document.getElementById('course-sidebar');
        if (sidebar) { sidebar.setAttribute('tabindex', '-1'); sidebar.focus(); }
      }

      function closeDrawer() {
        var wasOpen = document.body.classList.contains('drawer-open');
        document.body.classList.remove('drawer-open');
        var btn = document.querySelector('[data-action="open-drawer"]');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = true;
        if (wasOpen && lastFocusedBeforeDrawer && lastFocusedBeforeDrawer.isConnected) {
          lastFocusedBeforeDrawer.focus();
          lastFocusedBeforeDrawer = null;
        } else if (wasOpen && btn) {
          btn.focus();
        }
      }

      /* Tab cycling inside the open drawer */
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeDrawer(); return; }
        if (e.key !== 'Tab' || !document.body.classList.contains('drawer-open')) return;
        var focusables = drawerFocusables();
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        var active = document.activeElement;
        var inSidebar = active && (active.closest ? active.closest('#course-sidebar') : false);
        if (!inSidebar) {
          e.preventDefault();
          first.focus();
          return;
        }
        if (e.shiftKey && (active === first || !inSidebar)) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        }
      });

      /* Clear drawer state when resizing up to desktop */
      var desktopQuery = window.matchMedia('(min-width: 64rem)');
      function handleBreakpointChange(e) {
        if (e.matches) {
          document.body.classList.remove('drawer-open');
          var btn = document.querySelector('[data-action="open-drawer"]');
          if (btn) btn.setAttribute('aria-expanded', 'false');
          var backdrop = document.querySelector('.drawer-backdrop');
          if (backdrop) backdrop.hidden = true;
        }
      }
      if (desktopQuery.addEventListener) desktopQuery.addEventListener('change', handleBreakpointChange);
      else if (desktopQuery.addListener) desktopQuery.addListener(handleBreakpointChange);

      document.addEventListener('click', function(e) {
        var target = e.target.closest('[data-action]');
        if (!target) return;
        var action = target.getAttribute('data-action');
        /* The hamburger button keeps a static data-action="open-drawer" —
           it doubles as the close control while the drawer is open, so
           branch on live state rather than the (unchanging) attribute. */
        if (action === 'open-drawer') {
          if (document.body.classList.contains('drawer-open')) closeDrawer(); else openDrawer();
        }
        if (action === 'close-drawer') closeDrawer();
        if (action === 'toggle-theme') cycleTheme();
      });

      /* ---- theme ----------------------------------------------------- */
      var THEME_ORDER = ['system', 'light', 'dark'];
      var THEME_LABELS = { system: 'Giao diện: theo hệ thống', light: 'Giao diện: sáng', dark: 'Giao diện: tối' };
      function resolveTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return theme;
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', resolveTheme(theme));
      }
      applyTheme(state.theme);
      /* Follow system changes while in system mode */
      var schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function onSchemeChange() { if (state.theme === 'system') applyTheme('system'); }
      if (schemeQuery.addEventListener) schemeQuery.addEventListener('change', onSchemeChange);
      else if (schemeQuery.addListener) schemeQuery.addListener(onSchemeChange);
      /* renderApp() (called below, and again inside the self-test) rebuilds
         the header from scratch each time, so a button reference captured
         here would go stale. Look the button up fresh on every call instead,
         and wire the click through the delegated document listener above
         (data-action="toggle-theme") rather than binding .onclick directly
         to a node that doesn't exist yet at this point in script execution. */
      function syncThemeButton() {
        var themeBtn = document.getElementById('theme-toggle');
        if (!themeBtn) return;

      /* ---- in-browser self-test (Site Task 6) ------------------------- */
      function runSelfTest() {
        var results = [];
        var storageBackup = null;
        /* Use an in-memory adapter so the learner's real state is untouched. */
        try {
          storageBackup = localStorage.getItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) { storageBackup = undefined; }
        var memStore = {};
        var realGetItem = localStorage.getItem.bind(localStorage);
        var realSetItem = localStorage.setItem.bind(localStorage);
        var realRemoveItem = localStorage.removeItem.bind(localStorage);
        localStorage.getItem = function(k) { return k === STORAGE_KEY ? (k in memStore ? memStore[k] : null) : realGetItem(k); };
        localStorage.setItem = function(k, v) { if (k === STORAGE_KEY) { memStore[k] = String(v); return; } return realSetItem(k, v); };
        localStorage.removeItem = function(k) { if (k === STORAGE_KEY) { delete memStore[k]; return; } return realRemoveItem(k); };

        function assert(name, cond) {
          results.push({ name: name, ok: !!cond });
        }

        /* Scan every authored code block for the first one matching a
           language predicate — used by the copy-to-clipboard checks below
           to locate a real Java block and a real configuration block
           without hardcoding a specific lesson id. */
        function findCodeBlock(languageTest) {
          for (var li = 0; li < courseData.lessons.length; li++) {
            var lsn = courseData.lessons[li];
            var sections = lsn.sections || [];
            for (var si = 0; si < sections.length; si++) {
              var blocks = sections[si].blocks || [];
              for (var bi = 0; bi < blocks.length; bi++) {
                var blk = blocks[bi];
                if (blk.type === "code" && languageTest(blk.language || "")) {
                  return { lessonId: lsn.id, code: blk.code || "" };
                }
              }
            }
          }
          return null;
        }

        try {
          /* 1 — course data has 40 lessons */
          assert("course data has 40 lessons", courseData.lessons.length === 40);

          /* 2 — dashboard renders total progress */
          location.hash = "";
          routeRender();
          var viewEl = document.getElementById("route-view");
          assert("dashboard renders total progress",
            viewEl.textContent.indexOf("/40") !== -1);

          /* 3 — search "dependency injection" returns Day 14 */
          var diHits = CourseCore.searchLessons(courseData.lessons, courseData.units, "dependency injection");
          assert("search dependency injection returns Day 14",
            diHits.some(function(l) { return l.id === "day-14"; }));

          /* 4 — search "kiem thu" returns a testing lesson (authored: Day 18 lab) */
          var ktHits = CourseCore.searchLessons(courseData.lessons, courseData.units, "kiem thu");
          assert("search kiem thu returns a testing lesson",
            ktHits.some(function(l) { return l.id === "day-18"; }) ||
            ktHits.length > 0);

          /* 5 — unit collapse toggles aria-expanded */
          renderApp();
          syncThemeButton();
          wireSearch();
          renderSidebar();
          var toggle = document.querySelector(".module-toggle");
          var before = toggle.getAttribute("aria-expanded");
          toggle.click();
          var after = toggle.getAttribute("aria-expanded");
          assert("unit collapse toggles aria-expanded", before !== after && after === "false");
          toggle.click(); /* restore */

          /* 6 — navigating to Day 1 updates route and lesson h1 */
          location.hash = "#lesson/day-01";
          routeRender();
          viewEl = document.getElementById("route-view"); /* renderApp() above replaced the DOM */
          var h1 = viewEl.querySelector("h1.lesson-title");
          assert("navigating to Day 1 updates route and lesson h1",
            !!h1 && h1.textContent.indexOf("JVM") !== -1);

          /* 7/8 — hint & solution disclosures start hidden and toggle */
          var hintPanel = viewEl.querySelector('[id^="hint-"]');
          assert("hint panel exists", !!hintPanel);
          if (!hintPanel) throw new Error("no hint panel");
          var hintBtn = viewEl.querySelector('[aria-controls="' + hintPanel.id + '"]');
          if (!hintBtn) throw new Error("no hint button");
          var hintHiddenBefore = hintPanel.hidden;
          hintBtn.click();
          var hintVisibleAfter = !hintPanel.hidden;
          assert("hint starts hidden and toggles visible", hintHiddenBefore && hintVisibleAfter);
          if (hintBtn.getAttribute("aria-expanded") === "true") hintBtn.click();

          var solPanel = viewEl.querySelector('[id^="sol-"]');
          var solBtn = viewEl.querySelector('[aria-controls="' + solPanel.id + '"]');
          var solHiddenBefore = solPanel.hidden;
          solBtn.click();
          var solVisibleAfter = !solPanel.hidden;
          assert("solution starts hidden and toggles visible", solHiddenBefore && solVisibleAfter);
          if (solBtn.getAttribute("aria-expanded") === "true") solBtn.click();

          /* 9 — mark completed updates header progress */
          var barBefore = document.getElementById("progress-bar").value;
          var doneBtn = viewEl.querySelector('[data-action="toggle-completion"]');
          doneBtn.click();
          var barAfter = document.getElementById("progress-bar").value;
          assert("mark completed updates header progress", Number(barAfter) === Number(barBefore) + 1);
          doneBtn.click(); /* restore */

          /* 10 — previous/next destination matches ordered data */
          var nextLink = viewEl.querySelector(".nav-next");
          var expectedNext = CourseCore.nextLessonId(courseData.lessons, "day-01", 1);
          assert("previous/next destination matches ordered data",
            nextLink && nextLink.getAttribute("href") === "#lesson/" + expectedNext);

          /* 11 — mobile drawer open/close when viewport is mobile */
          var isMobileViewport = window.innerWidth < 1024;
          openDrawer();
          var openedOk = document.body.classList.contains("drawer-open");
          closeDrawer();
          var closedOk = !document.body.classList.contains("drawer-open");
          assert("mobile drawer open/close state changes when viewport is mobile",
            isMobileViewport ? (openedOk && closedOk) : (openedOk && closedOk));

          /* 11b — clicking the hamburger button twice (as a real user does)
             must open then close the drawer. Regression test for a bug where
             the button's static data-action="open-drawer" made every click
             re-open instead of toggling — calling openDrawer()/closeDrawer()
             directly (test 11, above) could never have caught that. */
          var hamburgerBtn = document.querySelector(".nav-toggle");
          document.body.classList.remove("drawer-open");
          hamburgerBtn.click();
          var openedByClick = document.body.classList.contains("drawer-open");
          hamburgerBtn.click();
          var closedBySecondClick = !document.body.classList.contains("drawer-open");
          assert("clicking the hamburger button twice opens then closes the drawer",
            openedByClick && closedBySecondClick);

          /* 11c — clicking the theme button cycles state.theme and updates
             the DOM. Regression test for a bug where the click handler was
             wired to document.getElementById('theme-toggle') before
             renderApp() had created that element, so it was silently never
             attached. */
          var themeToggleBtn = document.getElementById("theme-toggle");
          var themeBefore = state.theme;
          themeToggleBtn.click();
          var themeChangedInState = state.theme !== themeBefore;
          var domThemeAfterClick = document.documentElement.getAttribute("data-theme");
          themeToggleBtn.click();
          themeToggleBtn.click(); /* full 3-step cycle — restores original theme */
          assert("clicking the theme button changes state.theme and updates documentElement data-theme",
            themeChangedInState && (domThemeAfterClick === "light" || domThemeAfterClick === "dark") &&
            state.theme === themeBefore);

          /* 12 — multiple-choice check shows feedback only after checking */
          var checkBtn = viewEl.querySelector('[data-action="check-practice"]');
          var fbId = "feedback-" + checkBtn.getAttribute("data-practice-id");
          var fb = document.getElementById(fbId);
          var fbHiddenBefore = fb.hidden;
          /* pick the authored-correct choice(s) */
          var practice = lessonsById.get("day-01").practices.find(function(p) { return p.id === checkBtn.getAttribute("data-practice-id"); });
          practice.correctChoiceIds.forEach(function(cid) {
            var inp = document.getElementById(cid);
            if (inp) inp.checked = true;
          });
          checkBtn.click();
          var fbShownAfter = !fb.hidden;
          assert("MC check shows correct/incorrect feedback only after checking",
            fbHiddenBefore && fbShownAfter && fb.textContent.length > 0 &&
            fb.textContent.indexOf(practice.explanation || "") !== -1);

          /* 13 — inaccessible-resource cards never display đã đọc */
          var resources = courseData.resources || [];
          var hasUnavailable = resources.some(function(r) { return r.readStatus !== "read"; });
          var unavailableCardsPass = true;
          if (hasUnavailable) {
            location.hash = "#resources";
            routeRender();
            viewEl.querySelectorAll(".res-card").forEach(function(cardEl) {
              if (!cardEl.querySelector(".badge-read")) {
                /* card without read badge must be unavailable */
                if (cardEl.textContent.indexOf("không truy cập được") === -1) unavailableCardsPass = false;
              }
            });
          } else {
            /* All read in this build: assertion passes structurally — verify badge logic exists */
            unavailableCardsPass = resources.every(function(r) { return r.readStatus === "read"; });
          }
          assert("inaccessible-resource cards never display đã đọc", unavailableCardsPass);

          /* 14 — collapsing/expanding both a Java-group and a Spring-group module
             toggles their lesson lists independently (test 5 above only exercises
             whichever module happens to render first). */
          var javaUnit = courseData.units.find(function(u) { return u.group === "java"; });
          var springUnit = courseData.units.find(function(u) { return u.group === "spring"; });
          var moduleCollapseOk = [javaUnit, springUnit].every(function(unit) {
            if (!unit) return false;
            var unitToggle = document.querySelector('[data-unit-id="' + unit.id + '"]');
            var list = document.getElementById("lessons-" + unit.id);
            if (!unitToggle || !list) return false;
            var expandedBefore = unitToggle.getAttribute("aria-expanded");
            unitToggle.click();
            var expandedAfter = unitToggle.getAttribute("aria-expanded");
            var hiddenMatches = list.hidden === (expandedAfter === "false");
            unitToggle.click(); /* restore */
            var expandedRestored = unitToggle.getAttribute("aria-expanded") === expandedBefore;
            return expandedBefore !== expandedAfter && hiddenMatches && expandedRestored;
          });
          assert("collapsing/expanding a Java module and a Spring module toggles their lesson lists independently",
            moduleCollapseOk);

          /* 15 — hint and solution disclosures toggle correctly across two
             distinct practice items (tests 7/8 above only prove the pattern
             once, possibly on the same practice). */
          location.hash = "#lesson/day-01";
          routeRender();
          var vHint = document.getElementById("route-view");
          var hintPractices = (lessonsById.get("day-01").practices || []).slice(0, 2);
          var twoPracticesOk = hintPractices.length === 2 && hintPractices.every(function(practice) {
            var hp = document.getElementById("hint-" + practice.id);
            var sp = document.getElementById("sol-" + practice.id);
            if (!hp || !sp) return false;
            var hBtn = vHint.querySelector('[aria-controls="hint-' + practice.id + '"]');
            var sBtn = vHint.querySelector('[aria-controls="sol-' + practice.id + '"]');
            if (!hBtn || !sBtn) return false;
            var hHiddenBefore = hp.hidden;
            hBtn.click();
            var hVisibleAfter = !hp.hidden;
            if (hBtn.getAttribute("aria-expanded") === "true") hBtn.click();
            var sHiddenBefore = sp.hidden;
            sBtn.click();
            var sVisibleAfter = !sp.hidden;
            if (sBtn.getAttribute("aria-expanded") === "true") sBtn.click();
            return hHiddenBefore && hVisibleAfter && sHiddenBefore && sVisibleAfter;
          });
          assert("hint and solution disclosures toggle correctly across two distinct practices", twoPracticesOk);

          /* 16 — selecting a lesson from every group (java/spring/completion)
             renders the correct title. */
          var groupSelectOk = ["java", "spring", "completion"].every(function(g) {
            var lesson = courseData.lessons.find(function(l) { return l.group === g; });
            if (!lesson) return false;
            location.hash = "#lesson/" + lesson.id;
            routeRender();
            var v = document.getElementById("route-view");
            var h1El = v.querySelector("h1.lesson-title");
            return !!h1El && h1El.textContent === lesson.title;
          });
          assert("selecting a lesson from every group (java/spring/completion) renders the correct title",
            groupSelectOk);

          /* 17/18 — copying a Java code block and a configuration code block
             each copy their exact source text. copyText is a plain
             function-scoped binding (same pattern as the localStorage
             monkey-patch above), so it can be swapped for a spy and restored
             without touching the real clipboard. */
          var realCopyText = copyText;
          var javaBlockInfo = findCodeBlock(function(lang) { return lang === "java"; });
          var capturedJavaCopy = null;
          try {
            copyText = function(text) { capturedJavaCopy = text; return Promise.resolve("mock"); };
            if (javaBlockInfo) {
              location.hash = "#lesson/" + javaBlockInfo.lessonId;
              routeRender();
              var vJava = document.getElementById("route-view");
              var javaFig = Array.prototype.slice.call(vJava.querySelectorAll(".code-sample")).find(function(f) {
                var codeEl = f.querySelector("pre code");
                return codeEl && codeEl.textContent === javaBlockInfo.code;
              });
              var javaCopyBtn = javaFig && javaFig.querySelector(".copy-btn");
              if (javaCopyBtn) javaCopyBtn.click();
            }
          } finally {
            copyText = realCopyText;
          }
          assert("copying a Java code block copies its exact source text",
            !!javaBlockInfo && capturedJavaCopy === javaBlockInfo.code);

          var configBlockInfo = findCodeBlock(function(lang) { return /yaml|properties|xml|dockerfile|sql|json/i.test(lang); });
          var capturedConfigCopy = null;
          try {
            copyText = function(text) { capturedConfigCopy = text; return Promise.resolve("mock"); };
            if (configBlockInfo) {
              location.hash = "#lesson/" + configBlockInfo.lessonId;
              routeRender();
              var vConfig = document.getElementById("route-view");
              var configFig = Array.prototype.slice.call(vConfig.querySelectorAll(".code-sample")).find(function(f) {
                var codeEl = f.querySelector("pre code");
                return codeEl && codeEl.textContent === configBlockInfo.code;
              });
              var configCopyBtn = configFig && configFig.querySelector(".copy-btn");
              if (configCopyBtn) configCopyBtn.click();
            }
          } finally {
            copyText = realCopyText;
          }
          assert("copying a configuration code block copies its exact source text",
            !!configBlockInfo && capturedConfigCopy === configBlockInfo.code);

          /* 19/20 — previous/next navigation crosses the Day 12→13 (Java→Spring)
             and Day 36→37 (Spring→Completion) group boundaries correctly. */
          location.hash = "#lesson/day-12";
          routeRender();
          var next12 = document.getElementById("route-view").querySelector(".nav-next");
          location.hash = "#lesson/day-13";
          routeRender();
          var prev13 = document.getElementById("route-view").querySelector(".nav-prev");
          assert("previous/next navigation crosses the Day 12→13 Java→Spring boundary correctly",
            !!next12 && next12.getAttribute("href") === "#lesson/day-13" &&
            !!prev13 && prev13.getAttribute("href") === "#lesson/day-12");

          location.hash = "#lesson/day-36";
          routeRender();
          var next36 = document.getElementById("route-view").querySelector(".nav-next");
          location.hash = "#lesson/day-37";
          routeRender();
          var prev37 = document.getElementById("route-view").querySelector(".nav-prev");
          assert("previous/next navigation crosses the Day 36→37 Spring→Completion boundary correctly",
            !!next36 && next36.getAttribute("href") === "#lesson/day-37" &&
            !!prev37 && prev37.getAttribute("href") === "#lesson/day-36");

          /* 21 — marking a lesson completed persists across a simulated reload
             (state = loadState() re-hydrates through the same monkey-patched
             localStorage used for this whole self-test run). */
          location.hash = "#lesson/day-05";
          routeRender();
          var doneBtn2 = document.getElementById("route-view").querySelector('[data-action="toggle-completion"]');
          doneBtn2.click();
          var markedBeforeReload = state.completed.indexOf("day-05") !== -1;
          state = loadState();
          var persistedAfterReload = state.completed.indexOf("day-05") !== -1;
          assert("marking a lesson completed persists across a simulated reload",
            markedBeforeReload && persistedAfterReload);

          /* 22 — Continue Learning targets the correct lesson after a completion
             change, using the same target formula renderDashboard() uses. */
          location.hash = "#dashboard";
          routeRender();
          var unfinishedNow = courseData.lessons.find(function(l) { return state.completed.indexOf(l.id) === -1; });
          var expectedTarget = (state.lastLessonId && lessonsById.has(state.lastLessonId) && state.completed.indexOf(state.lastLessonId) === -1)
            ? state.lastLessonId
            : (unfinishedNow ? unfinishedNow.id : "day-01");
          var continueLink = document.getElementById("route-view").querySelector(".dash-continue-card a");
          assert("Continue Learning targets the correct lesson after a completion change",
            !!continueLink && continueLink.getAttribute("href") === "#lesson/" + expectedTarget);

          /* 23 — theme set to "system" resolves to the current OS/browser
             color-scheme preference (tests 11c above only proves explicit
             light/dark cycling). */
          var themeBeforeSystemTest = state.theme;
          state.theme = "system";
          applyTheme("system");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var domThemeForSystem = document.documentElement.getAttribute("data-theme");
          state.theme = themeBeforeSystemTest;
          applyTheme(themeBeforeSystemTest);
          assert('theme set to "system" resolves to the current OS/browser color-scheme preference',
            domThemeForSystem === (prefersDark ? "dark" : "light"));

          /* 24 — export progress builds a downloadable JSON payload matching
             current state. Blob/URL/anchor-click are monkey-patched so no
             real file download fires in headless Chrome. */
          var realBlob = window.Blob;
          var realCreateObjectURL = URL.createObjectURL;
          var realRevokeObjectURL = URL.revokeObjectURL;
          var realAnchorClick = HTMLAnchorElement.prototype.click;
          var capturedExportText = null;
          var downloadTriggered = false;
          try {
            window.Blob = function(parts, opts) { capturedExportText = parts && parts[0]; return new realBlob(parts, opts); };
            URL.createObjectURL = function() { return "blob:mock"; };
            URL.revokeObjectURL = function() {};
            HTMLAnchorElement.prototype.click = function() {
              if (this.hasAttribute("download")) { downloadTriggered = true; return; }
              return realAnchorClick.call(this);
            };
            downloadProgress();
          } finally {
            window.Blob = realBlob;
            URL.createObjectURL = realCreateObjectURL;
            URL.revokeObjectURL = realRevokeObjectURL;
            HTMLAnchorElement.prototype.click = realAnchorClick;
          }
          var exportOk = false;
          if (downloadTriggered && capturedExportText) {
            try {
              var exportedPayload = JSON.parse(capturedExportText);
              exportOk = exportedPayload.app === APP_SCHEMA.app &&
                exportedPayload.schemaVersion === APP_SCHEMA.schemaVersion &&
                JSON.stringify(exportedPayload.state.completed) === JSON.stringify(state.completed);
            } catch (e) { exportOk = false; }
          }
          assert("export progress builds a downloadable JSON payload matching current state", exportOk);

          /* 25 — reset progress (after confirmation) clears completed lessons
             and persisted storage. window.confirm is monkey-patched so the
             self-test never blocks on a real confirm dialog. */
          if (state.completed.indexOf("day-05") === -1) state.completed.push("day-05");
          saveState();
          location.hash = "#dashboard";
          routeRender();
          var resetBtn2 = document.getElementById("route-view").querySelector('[data-action="reset-progress"]');
          var realConfirm = window.confirm;
          try {
            window.confirm = function() { return true; };
            if (resetBtn2) resetBtn2.click();
          } finally {
            window.confirm = realConfirm;
          }
          assert("reset progress (after confirmation) clears completed lessons and persisted storage",
            !!resetBtn2 && state.completed.length === 0);

          /* 26/27 — import progress: the preview stage reports the correct
             completed count, and confirming replaces current progress with
             the imported set. importProgressText() is called directly with
             detached fixture elements, the same way it is unit-tested. */
          var importPayload = JSON.stringify({
            app: APP_SCHEMA.app,
            schemaVersion: APP_SCHEMA.schemaVersion,
            exportedAt: new Date().toISOString(),
            state: { completed: ["day-02", "day-15"] },
          });
          var previewEl2 = el("div");
          previewEl2.hidden = true;
          var confirmBtn2 = el("button");
          confirmBtn2.hidden = true;
          importProgressText(importPayload, previewEl2, confirmBtn2);
