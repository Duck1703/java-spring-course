<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung</a>
  <div id="app" aria-live="off"></div>
  <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="course-data" type="application/json">{}</script>
  <script id="app-script">
    /* ============================================================
*/ /* COURSE_CORE_START */ /*
       pure logic, no DOM access.
       Tested by tests/site_core.test.js in node:vm.
       ============================================================ */
    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      if (raw === "project") return { view: "project" };
      if (raw === "roadmap") return { view: "roadmap" };
      if (raw === "map") return { view: "map" };
      if (raw === "architecture") return { view: "architecture" };
      const releaseMatch = raw.match(/^release\/(.+)$/);
      if (releaseMatch) return { view: "release", releaseId: decodeURIComponent(releaseMatch[1]) };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      /* Task Detail (P3). decodeURIComponent is guarded: a malformed escape
         sequence (e.g. #/task/%) would otherwise throw a URIError that
         routeRender has no catch for, crashing the whole SPA. Falling back
         to the raw segment is deterministic — it matches no task id, so the
         renderer shows its not-found state instead of an exception. */
      const taskMatch = raw.match(/^task\/(.+)$/);
      if (taskMatch) {
        let taskId = taskMatch[1];
        try { taskId = decodeURIComponent(taskMatch[1]); } catch (e) { taskId = taskMatch[1]; }
        return { view: "task", taskId };
      }
      return { view: "dashboard" };
    }

    function selectCurrentRelease(releases) {
      const authored = Array.isArray(releases) ? releases : [];
      const byOrder = (a, b) => Number(a.order || 0) - Number(b.order || 0);
      return authored.filter((release) => release.status === "building").sort(byOrder)[0]
        || authored.filter((release) => release.status === "planned").sort(byOrder)[0]
        || null;
    }

    function selectNextBuildTask(release, taskSource, completedTaskIds) {
      if (!release || !Array.isArray(release.buildTaskIds)) return null;
      const done = new Set(completedTaskIds || []);
      const taskMap = taskSource instanceof Map
        ? taskSource
        : new Map((Array.isArray(taskSource) ? taskSource : []).map((task) => [task.id, task]));
      for (const taskId of release.buildTaskIds) {
        const task = taskMap.get(taskId);
        if (task && task.required !== false && !done.has(taskId)) return task;
      }
      return null;
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    // Project Progress aggregation. Both count ONLY required build tasks so
    // optional tasks never block a release/feature from reaching 100%. These
    // read the project build-task list + the completed-id list and are pure,
    // mirroring calculateProgress. They are independent of course completion.
    function calculateReleaseProgress(buildTasks, completedTaskIds, releaseId) {
      const done = new Set(completedTaskIds);
      const required = (buildTasks || []).filter((t) => t.required !== false && t.releaseId === releaseId);
      const total = required.length;
      const completed = required.filter((t) => done.has(t.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function calculateFeatureProgress(buildTasks, completedTaskIds, featureId) {
      const done = new Set(completedTaskIds);
      const required = (buildTasks || []).filter(
        (t) => t.required !== false && (t.featureIds || []).includes(featureId)
      );
      const total = required.length;
      const completed = required.filter((t) => done.has(t.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    // ---- P1: Course <-> Project Map ------------------------------------
    // Derives one row per lesson (in authored lesson order) describing how
    // that lesson relates to the project, without mutating either input.
    // `lessonMap` is the plain object keyed by lesson id (courseData shape),
    // not a Map, so this stays pure/serializable across the node:vm test
    // boundary. Lessons absent from lessonMap are "unmapped" (day-39-64
    // style aggregated lessons) — a UI-only fourth category, never an error.
    function deriveMapRows(lessons, lessonMap) {
      const map = lessonMap || {};
      return (lessons || []).map((lesson) => {
        const entry = map[lesson.id];
        const applicationType = entry ? (entry.applicationType || "theory") : "unmapped";
        return {
          id: lesson.id,
          title: lesson.title,
          group: lesson.group,
          unitId: lesson.unitId,
          applicationType,
          releaseId: entry ? (entry.releaseId || null) : null,
          featureIds: entry ? (entry.featureIds || []) : [],
        };
      });
    }

    // Client-side filter over deriveMapRows() output. Theory and Unmapped
    // share one filter bucket ("theory-unmapped") to keep the filter UI to
    // four buttons, but each row still carries its own precise
    // applicationType so direct/future/theory/unmapped stay visually
    // distinct — the filter groups them, it does not merge the data.
    function filterMapRows(rows, typeFilter, releaseFilter) {
      const tf = typeFilter || "all";
      const rf = releaseFilter || "all";
      return (rows || []).filter((row) => {
        if (tf === "direct" && row.applicationType !== "direct") return false;
        if (tf === "future" && row.applicationType !== "future") return false;
        if (tf === "theory-unmapped" && row.applicationType !== "theory" && row.applicationType !== "unmapped") return false;
        if (rf !== "all" && row.releaseId !== rf) return false;
        return true;
      });
    }

    // ---- P1: Domain Overview --------------------------------------------
    // Union+dedup of features[].domainEntities, alphabetically ordered, each
    // paired with the feature ids that reference it. Never hardcodes entity
    // names — entities are entirely derived from authored feature data.
    function deriveDomainEntities(features) {
      const byEntity = {};
      (features || []).forEach((feature) => {
        (feature.domainEntities || []).forEach((name) => {
          if (!byEntity[name]) byEntity[name] = { entity: name, featureIds: [] };
          if (!byEntity[name].featureIds.includes(feature.id)) byEntity[name].featureIds.push(feature.id);
        });
      });
      return Object.keys(byEntity).sort().map((name) => byEntity[name]);
    }

    // ---- P1: Architecture Evolution -------------------------------------
    // Joins releases to their architectureStage (by releaseId) and orders
    // the pairs by release.order — the single source of sequencing, never a
    // hardcoded narrative. Releases without an authored stage are omitted.
    function orderArchitectureStages(releases, architectureStages) {
      const stageByRelease = {};
      (architectureStages || []).forEach((stage) => { stageByRelease[stage.releaseId] = stage; });
      return (releases || [])
        .slice()
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
        .map((release) => ({ release, stage: stageByRelease[release.id] || null }))
        .filter((pair) => pair.stage);
    }

    // ---- P1: Richer Roadmap ----------------------------------------------
    // Groups releases under their authored milestone (via milestone.releaseIds),
    // in milestone/release order, with any release not covered by a milestone
    // trailing in an "ungrouped" bucket — a defensive fallback, not a data
    // requirement, so the roadmap never silently drops a release.
    function groupReleasesByMilestone(releases, milestones) {
      const releaseById = {};
      (releases || []).forEach((r) => { releaseById[r.id] = r; });
      const used = {};
      const groups = (milestones || []).map((milestone) => {
        const rels = (milestone.releaseIds || [])
          .map((id) => { used[id] = true; return releaseById[id]; })
          .filter(Boolean)
          .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
        return { milestone, releases: rels };
      });
      const ungrouped = (releases || [])
        .filter((r) => !used[r.id])
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
      if (ungrouped.length) groups.push({ milestone: null, releases: ungrouped });
      groups.sort((a, b) => {
        const ao = a.releases.length ? a.releases[0].order : Infinity;
        const bo = b.releases.length ? b.releases[0].order : Infinity;
        return ao - bo;
      });
      return groups;
    }

    // ---- P3: Task Detail / Build Step support ---------------------------
    // Canonical task ordering: releases by `order`, then each release's
    // buildTaskIds in authored order (the same authority the Build Tasks
    // Workspace already uses). Tasks missing from every release's list, and
    // releases in the artifact but not in the map, do not exist here — this
    // stays total on malformed input and never invents ordering.
    function orderAllTasks(releases, buildTasks) {
      const taskById = {};
      (buildTasks || []).forEach(function(task) { taskById[task.id] = task; });
      const ordered = [];
      const seen = {};
      (releases || [])
        .slice()
        .sort(function(a, b) { return Number(a.order || 0) - Number(b.order || 0); })
        .forEach(function(release) {
          (release.buildTaskIds || []).forEach(function(id) {
            if (seen[id]) return;
            const task = taskById[id];
            if (task) { ordered.push(task); seen[id] = true; }
          });
        });
      return ordered;
    }

    // Steps for one task, sorted by `order` — the raw JSON order is never an
    // authority (validators guarantee 1..n contiguous, not array position).
    // Non-mutating: filters/sort operate on a fresh array.
    function stepsForTask(buildSteps, taskId) {
      return (buildSteps || [])
        .filter(function(step) { return step.taskId === taskId; })
        .slice()
        .sort(function(a, b) { return Number(a.order || 0) - Number(b.order || 0); });
    }

    // Task Detail header estimated time. Honest derivation: a total exists
    // only when EVERY step carries estimatedMinutes — summing the subset
    // would silently understate work. Returns null when not derivable.
    function estimateTaskMinutes(steps) {
      if (!Array.isArray(steps) || !steps.length) return null;
      let total = 0;
      for (const step of steps) {
        const n = Number(step.estimatedMinutes);
        if (!step.estimatedMinutes || !Number.isFinite(n) || n < 0) return null;
        total += n;
      }
      return total;
    }

    // ---- P3: Mentor prompt builder (Phase 2 plan §14) --------------------
    // Pure: reads only its arguments, returns a string. No state, DOM,
    // clipboard or network. One builder serves both scopes — task-level when
    // `step` is null, step-level when a step is passed (the step is then
    // quoted prominently; the sibling steps stay listed so the mentor still
    // sees where the learner is in the sequence).
    const MENTOR_CONVENTION_CLAUSE =
      "Prefer the established Spendwise convention over your own preference, even where your preference is defensible.";
    const MENTOR_STOP_CLAUSE = [
      "If completing this task requires deviating from the architecture above, do not deviate. Stop and output:",
      "ARCHITECTURE_CHANGE_REQUIRED",
      "Rule: <rule id or ADR>",
      "Why it blocks: <one sentence>",
      "Proposed change: <one sentence>",
      "Cheapest alternative that keeps the rule: <one sentence>",
    ].join("\n");

    /* ============================================================
       P4: Architecture Constitution (canonical R1-R26) + defense matrix.
       The 26 texts below are the reader-facing projection of the
       Architecture Constitution defined in
       docs/report/2026-09-05-spendwise-architecture-blueprint.md §3 —
       the Blueprint stays the source of authority; this block renders it
       for learners and adds NO new rule. `text` is the canonical rule
       wording (condensed, semantic-preserving); `note` is Vietnamese UI
       framing that always points back to the canonical sources and is
       rendered visually distinct from `text`.
       Keys are validated by node tests + in-page self-tests: exactly 26,
       ids R1..R26, no duplicates, every ^R\d{1,2}$ token used by
       buildSteps.architectureRules resolves here.
       ============================================================ */
    const ARCHITECTURE_CONSTITUTION = [
      { id: "R1", group: "money", title: "Money là BigDecimal scale 2",
        text: "Money is BigDecimal with scale 2 from input to storage to output. double/float never touch money — including to satisfy a collector signature. Scale 2 is the Spendwise V1.0 precision convention, not a universal ISO-4217 claim.",
        cite: "Blueprint §3; ADR-001" },
      { id: "R2", group: "money", title: "So sánh tiền bằng compareTo",
        text: "Monetary comparison is compareTo(...) == 0. BigDecimal.equals is never used for monetary equality.",
        cite: "Blueprint §3; ADR-001" },
      { id: "R3", group: "money", title: "Khai báo scale/precision trong DDL",
        text: "Money scale and precision are declared in migration DDL (NUMERIC(19,2)), not in @Column.",
        cite: "Blueprint §3; ADR-001" },
      { id: "R4", group: "money", title: "Cộng trừ khác tiền tệ phải ném lỗi",
        text: "Cross-currency arithmetic throws. FX is display-only conversion in the report layer and never produces a ledger entry.",
        cite: "Blueprint §3; ADR-001" },
      { id: "R5", group: "money", title: "Chuẩn hoá scale 2 HALF_UP; chia phải khai báo rõ",
        text: "Construction normalizes to scale 2 HALF_UP; division requires an explicit scale + RoundingMode at the call site; multiplication rounds once at the end of the expression.",
        cite: "Blueprint §3" },
      { id: "R6", group: "truth", title: "Transaction là nguồn sự thật duy nhất",
        text: "Transaction rows are the sole source of financial truth.",
        cite: "Blueprint §3; ADR-003" },
      { id: "R7", group: "truth", title: "amount luôn dương; hướng là type",
        text: "Transaction.amount is always positive. Direction is Transaction.type, and the signed effect is exactly: INCOME +, EXPENSE −, TRANSFER_IN +, TRANSFER_OUT −.",
        cite: "Blueprint §3; ADR-003" },
      { id: "R8", group: "truth", title: "balance là projection có @Version",
        text: "Account.balance is a stored projection, written only inside the transaction that writes the Transaction row, guarded by @Version, permanently subject to balance == openingBalance + Σ signedEffect(t).",
        cite: "Blueprint §3; ADR-003" },
      { id: "R9", group: "truth", title: "openingBalance bất biến",
        text: "Account.openingBalance is immutable after account creation.",
        cite: "Blueprint §3; ADR-003" },
      { id: "R10", group: "truth", title: "Chỉ tiêu ngân sách/report luôn derive khi đọc",
        text: "Budget.spent / remaining / percentage / status and every report and dashboard figure are derived at read time and never stored.",
        cite: "Blueprint §3; ADR-003" },
      { id: "R11", group: "truth", title: "Không cache tiền",
        text: "No money value, balance, budget figure or report total is ever cached.",
        cite: "Blueprint §3; ADR-010/ADR-011" },
      { id: "R12", group: "time", title: "Instant cho sự kiện, LocalDate cho ngày kinh doanh",
        text: "System events are Instant/TIMESTAMPTZ; economic dates are LocalDate/DATE; period keys are YearMonth-shaped VARCHAR(7). Bare LocalDateTime is forbidden in persisted state. This rests on Hibernate 6, not on Jakarta Persistence 3.1.",
        cite: "Blueprint §3; ADR-002" },
      { id: "R13", group: "structure", title: "Package theo feature trong com.spendwise",
        text: "Package by feature under com.spendwise; layered inside the feature: controller → service → repository, service → domain. The import package is imports.",
        cite: "Blueprint §3" },
      { id: "R14", group: "structure", title: "Domain chỉ được import whitelist",
        text: "A domain class MAY import the JDK, com.spendwise.shared, and jakarta.persistence mapping annotations. It MUST NOT import Spring MVC, Spring Security, Spring service/application types, repository implementations, or any infrastructure client.",
        cite: "Blueprint §3; ADR-004; D20" },
      { id: "R15", group: "structure", title: "Một class cho mỗi concept",
        text: "One class per concept. No domain/entity twin, no mapper between them. JPA annotations are added to the existing class at V0.5. After V0.5 the domain is not framework-pure, by design.",
        cite: "Blueprint §3; ADR-004" },
      { id: "R16", group: "structure", title: "Entity/VO không vượt qua HTTP boundary",
        text: "No entity and no VO crosses the HTTP boundary. Request and response records only.",
        cite: "Blueprint §3" },
      { id: "R17", group: "structure", title: "Service không trả ResponseEntity",
        text: "Services never return ResponseEntity; controllers never contain business logic; @RestControllerAdvice is the single error-translation point.",
        cite: "Blueprint §3" },
      { id: "R18", group: "writes", title: "@Transactional chỉ ở public service method",
        text: "@Transactional on public service methods only — never a controller, repository, private or final method. Read paths are readOnly = true.",
        cite: "Blueprint §3" },
      { id: "R19", group: "writes", title: "Không I/O bên trong transaction",
        text: "No external call, file I/O or @Async dispatch inside a transaction.",
        cite: "Blueprint §3; ADR-012" },
      { id: "R20", group: "writes", title: "Một đường tạo Transaction duy nhất",
        text: "In production code, every Transaction is created by TransactionCreationService.create(command) — manual, recurring and imported alike — and carries a sourceRef. Tests MAY seed history via fixture builders or the repository, but MUST NOT bypass the canonical use case when the behaviour under test is transaction creation itself.",
        cite: "Blueprint §3; plan §13" },
      { id: "R21", group: "writes", title: "Transfer là một @Transactional ghép cặp",
        text: "A transfer is one @Transactional unit that creates a linked TRANSFER_OUT and TRANSFER_IN sharing one transferRef and updates both balance projections. Balances are never mutated without corresponding transaction rows. There is no Transfer aggregate.",
        cite: "Blueprint §3; ADR-003" },
      { id: "R22", group: "writes", title: "Import: batch không atomic, từng row atomic; identity hai tầng",
        text: "An import batch is not atomic; each row is. Every batch reaches a terminal state and every row is exactly one of OK / DUPLICATE / FAILED. A row's identity is its row identity: a source-provided reference where one exists (IMPORT:SRC:<sourceKey>:<accountId>:<normalize(sourceTxnId)>), otherwise the base content fingerprint (accountId | occurredOn | direction | amount at scale 2 | normalize(description)) plus its 1-based occurrence index within the statement (IMPORT:<baseFingerprint>|OCC:<n>) — never its ImportBatch PK. Two legitimate rows with identical business fields stay two transactions (OCC:1, OCC:2), and re-importing the same statement in the same logical order is deterministic; arbitrary reordering, filtering or reconstruction of a source without a reference is NOT guaranteed, and this is statement-scoped dedup, not universal bank-file deduplication. batchId and rowNo are reporting data only and never participate in identity. The import parse loop is sequential, in source-file order: occurrenceIndex is order-derived, so parallelStream()/.parallel() anywhere in the import path makes identity nondeterministic — an ARCHITECTURE_CHANGE_REQUIRED.",
        note: "Mệnh đề tuần tự ở câu cuối là mệnh đề thứ hai của R22 (thêm 2026-09-05 cùng mô hình fallback của D10.1), không phải rule mới: tập luật vẫn là 26 và mọi token architectureRules được validate theo ^R\\d{1,2}$ nên không thể tồn tại id như R22a.",

    /* Every architectureRules token used by buildSteps must resolve to a
       defined rule; used by node tests and the in-page self-test. Totality:
       any non-array input yields an empty report, and entries are guarded
       for shape — a malformed value can never throw here. */
    function resolveRuleTokens(steps) {
      const tokens = [];
      if (!Array.isArray(steps)) return tokens;
      steps.forEach(function(step) {
        if (!step || typeof step !== 'object') return;
        const rules = step.architectureRules;
        if (!Array.isArray(rules)) return;
        rules.forEach(function(token) {
          if (typeof token !== 'string') return;
          if (tokens.indexOf(token) === -1) tokens.push(token);
          if (!Object.prototype.hasOwnProperty.call(CONSTITUTION_BY_ID, token)) {
            tokens.push(token + ':DANGLING');
          }
        });
      });
      return tokens;
    }
