        container.appendChild(blockEl);
      }

      /* ---- references with transparent read status ---------------------- */
      function renderReferences(container, lesson, refIndexById, refCards) {
        if (!lesson.references || !lesson.references.length) return;
        var blockEl = el("section", "references-block");
        blockEl.id = "references-" + lessonIdSlug(lesson.id);
        blockEl.appendChild(el("h2", null, "Nguồn tham chiếu"));

        lesson.references.forEach(function(ref, i) {
          var num = i + 1;
          refIndexById.set(String(ref.citationId || ref.id).toLowerCase(), num);
          var card = el("article", "ref-card");
          card.id = "ref-" + lessonIdSlug(lesson.id) + "-" + num;
          var headRow = el("div", "ref-card-head");
          headRow.appendChild(el("span", "ref-num", "[" + num + "]"));
          headRow.appendChild(el("strong", null, ref.label || ref.pageTitle || ref.resourceId));
          headRow.appendChild(el("span", "badge-domain", ref.url ? new URL(ref.url).hostname : ""));
          if (ref.readStatus === "read") headRow.appendChild(el("span", "badge-read", "đã đọc"));
          card.appendChild(headRow);
          if (ref.pageTitle) {
            card.appendChild(el("div", null, "Trang: " + ref.pageTitle));
          }
          if (ref.url) {
            var linkP = el("p");
            var a = el("a", "ref-url", ref.safeUrl || ref.url);
            a.href = CourseCore.safeExternalUrl(ref.url) || "#";
            if (a.href !== "#") {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            }
            linkP.appendChild(a);
            card.appendChild(linkP);
          }
          /* section backlink */
          var back = el("a", null, "↑ Về đầu bài học");
          back.href = "#lesson/" + lesson.id;
          back.style.cssText = "font-size:.75rem;color:var(--muted);text-decoration:none;display:inline-block;margin-top:.375rem;";
          back.addEventListener("click", function(ev) {
            ev.preventDefault();
            window.location.hash = "#lesson/" + lesson.id;
            setTimeout(function() { document.getElementById("main-content").focus(); }, 50);
          });
          card.appendChild(back);
          blockEl.appendChild(card);
          refCards.push({ ref: ref, num: num });
        });

        /* Supplied but inaccessible resources — separate disclosure. */
        var unavailable = (lesson.references || []).filter(function(r) { return r.readStatus !== "read"; });
        if (unavailable.length) {
          var details = el("details", "ref-unavailable");
          details.appendChild(el("summary", null,
            "Nguồn được cung cấp nhưng không truy cập được (" + unavailable.length + ")"));
          unavailable.forEach(function(ref) {
            var card = el("article", "ref-card");
            card.appendChild(el("strong", null, ref.label || ref.resourceId));
            card.appendChild(el("div", null, "Trạng thái kiểm tra: " + (ref.checkStatus || "không rõ")));
            if (ref.limitation) card.appendChild(el("div", null, "Giới hạn: " + ref.limitation));
            details.appendChild(card);
          });
          blockEl.appendChild(details);
        }
        container.appendChild(blockEl);
      }

      /* ---- footer navigation -------------------------------------------- */
      function renderLessonNav(container, lesson) {
        var prevId = CourseCore.nextLessonId(courseData.lessons, lesson.id, -1);
        var nextId = CourseCore.nextLessonId(courseData.lessons, lesson.id, 1);
        var nav = el("nav", "lesson-nav");
        nav.setAttribute("aria-label", "Điều hướng bài học");

        if (prevId) {
          var prevLesson = lessonsById.get(prevId);
          var prevA = el("a", "nav-prev");
          prevA.href = "#lesson/" + prevId;
          prevA.innerHTML = icon("arrow-left") + '<span><span class="nav-label">Bài trước</span><span>' +
            CourseCore.escapeHtml(prevLesson ? prevLesson.title : prevId) + "</span></span>";
          nav.appendChild(prevA);
        } else {
          nav.appendChild(el("span"));
        }

        var done = state.completed.indexOf(lesson.id) !== -1;
        var toggleBtn = el("button", "nav-complete");
        toggleBtn.innerHTML = icon("check") + "<span>" + (done ? "Đã hoàn thành" : "Đánh dấu hoàn thành") + "</span>";
        toggleBtn.type = "button";
        toggleBtn.setAttribute("data-action", "toggle-completion");
        toggleBtn.setAttribute("data-lesson-id", lesson.id);
        toggleBtn.setAttribute("aria-pressed", done ? "true" : "false");
        nav.appendChild(toggleBtn);

        if (nextId) {
          var nextLesson = lessonsById.get(nextId);
          var nextA = el("a", "nav-next");
          nextA.href = "#lesson/" + nextId;
          nextA.innerHTML = icon("arrow-right") + '<span><span class="nav-label">Bài sau</span><span>' +
            CourseCore.escapeHtml(nextLesson ? nextLesson.title : nextId) + "</span></span>";
          nav.appendChild(nextA);
        } else {
          nav.appendChild(el("span"));
        }
        container.appendChild(nav);
      }

      /* ---- main lesson view ------------------------------------------------ */
      function renderFullLesson(container, lesson) {
        currentLessonId = lesson.id;
        var refIndexById = new Map();
        var refCards = [];

        renderLessonHeader(container, lesson, refIndexById);
        renderProjectContext(container, lesson.id);
        renderSections(container, lesson, refIndexById);
        renderPractices(container, lesson);
        renderAssignments(container, lesson);
        renderProjectApplication(container, lesson.id);
        renderReferences(container, lesson, refIndexById, refCards);
        renderLessonNav(container, lesson);
        container.setAttribute("tabindex", "-1");
      }

      /* ---- route entry for lessons ---------------------------------------- */
      function renderLessonView(container, lessonId) {
        var lesson = lessonsById.get(lessonId);
        if (!lesson) {
          container.innerHTML = '<h1 style="margin:2rem 0;">Không tìm thấy bài học</h1><p>Bài học "' +
            CourseCore.escapeHtml(lessonId) + '" không tồn tại.</p><a href="#dashboard" style="color:var(--spring-ink);">Về dashboard</a>';
          return;
        }
        state.lastLessonId = lessonId;
        saveState();
        if (lesson.kind === 'pending') {
          container.innerHTML = '<div style="padding:3rem 0;text-align:center;"><h1>' +
            CourseCore.escapeHtml(lesson.title) + '</h1>' +
            '<p style="color:var(--muted);margin-top:1rem;">Bài học này đang được biên soạn — nội dung sẽ được bổ sung trong giai đoạn tiếp theo.</p>' +
            '<p><a href="#dashboard" style="color:var(--spring-ink);">← Về tổng quan</a></p></div>';
          return;
        }
        renderFullLesson(container, lesson);
      }

      /* ---- project workspace (P0) ---------------------------------------- */
      function renderProjectWorkspaceHeader(container, eyebrow, title, summary) {
        var header = el('header', 'workspace-header');
        var copy = el('div');
        copy.appendChild(el('div', 'workspace-eyebrow', eyebrow));
        copy.appendChild(el('h1', 'workspace-title', title));
        if (summary) copy.appendChild(el('p', 'workspace-summary', summary));
        header.appendChild(copy);
        container.appendChild(header);
        return header;
      }

      function renderProjectOverview(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        var product = projectData.product;
        var release = currentProjectRelease();
        var milestone = release ? currentProjectMilestone(release.id) : null;
        var nextTask = release
          ? CourseCore.selectNextBuildTask(release, buildTasksById, projectCompletedTaskIds())
          : null;
        var header = renderProjectWorkspaceHeader(container, 'Project Track', product.name, product.type);
        header.setAttribute('data-project-overview', '');
        var headerCopy = header.querySelector('.workspace-summary');
        if (headerCopy) headerCopy.textContent = product.type + ' · ' + product.vision;
        renderProjectSubNav(container, 'project');

        var grid = el('div', 'project-overview-grid');
        var vision = el('section', 'project-panel');
        vision.appendChild(el('div', 'project-section-label', 'Product Vision'));
        vision.appendChild(el('h2', null, product.name));
        vision.appendChild(el('p', null, product.vision));
        grid.appendChild(vision);

        var current = el('section', 'project-panel');
        current.appendChild(el('div', 'project-section-label', 'Current Release'));
        if (release) {
          current.setAttribute('data-project-current-release', release.id);
          var line = el('div', 'project-release-line');
          var releaseLink = el('a', 'text-link', releaseDisplay(release));
          releaseLink.href = '#/release/' + release.id;
          line.appendChild(releaseLink);
          appendStatusBadge(line, release.status);
          current.appendChild(line);
          current.appendChild(createProjectProgress(release, 'Project Progress · ' + release.version));
        } else {
          current.appendChild(el('p', null, 'Chưa có release hiện tại.'));
        }
        grid.appendChild(current);

        var milestonePanel = el('section', 'project-panel');
        milestonePanel.appendChild(el('div', 'project-section-label', 'Current Milestone'));
        if (milestone) {
          milestonePanel.appendChild(el('h2', null, milestone.name));
          milestonePanel.appendChild(el('p', null, milestone.summary));
        } else {
          milestonePanel.appendChild(el('p', null, 'Release hiện tại chưa thuộc milestone nào.'));
        }
        grid.appendChild(milestonePanel);

        var next = el('section', 'project-panel');
        next.appendChild(el('div', 'project-section-label', 'Next Build Task'));
        if (nextTask) {
          next.appendChild(el('h2', null, nextTask.title));
          next.appendChild(el('p', null, nextTask.goal));
        } else {
          next.appendChild(el('p', null, 'Không còn required task đang mở trong release hiện tại.'));
        }
        grid.appendChild(next);

        var roadmap = el('section', 'project-panel');
        roadmap.appendChild(el('div', 'project-section-label', 'Roadmap'));
        roadmap.appendChild(el('p', null, (projectData.releases || []).length + ' release từ ' + projectData.releases[0].version + ' đến ' + projectData.releases[projectData.releases.length - 1].version + '.'));
        var roadmapLink = el('a', 'roadmap-entry', 'Xem toàn bộ lộ trình');
        roadmapLink.href = '#/roadmap';
        roadmap.appendChild(roadmapLink);
        grid.appendChild(roadmap);
        container.appendChild(grid);

        // Domain Overview (P1-4) — entities are derived from
        // features[].domainEntities (union+dedup), never hardcoded, so this
        // section only ever shows what the project data actually supports.
        var domainSection = el('section', 'project-panel release-section');
        domainSection.appendChild(el('h2', null, 'Domain Overview'));
        var entities = CourseCore.deriveDomainEntities(projectData.features || []);
        if (entities.length) {
          domainSection.appendChild(el('p', null, 'Domain entities xuất hiện trong các feature của sản phẩm:'));
          var entityGrid = el('div', 'domain-entity-grid');
          entities.forEach(function(entry) {
            var card = el('article', 'domain-entity-card');
            card.appendChild(el('h3', null, entry.entity));
            var featureNames = entry.featureIds.map(function(id) {
              var feature = featuresById.get(id);
              return feature ? feature.name : id;
            });
            card.appendChild(el('p', null, featureNames.join(', ')));
            entityGrid.appendChild(card);
          });
          domainSection.appendChild(entityGrid);
        } else {
          domainSection.appendChild(el('p', null, 'Chưa có domain entity nào trong dữ liệu sản phẩm.'));
        }
        container.appendChild(domainSection);

        // Project boundaries — product.outOfScope, behind a disclosure so it
        // doesn't dominate the page (21 items).
        var scopeItems = product.outOfScope || [];
        if (scopeItems.length) {
          var scopeSection = el('section', 'project-panel release-section');
          scopeSection.appendChild(el('h2', null, 'Project Boundaries'));
          var scopePanelId = 'project-out-of-scope';
          var scopeBtn = disclosureButton('Ngoài phạm vi (' + scopeItems.length + ')', scopePanelId, 'chevron-down');
          var scopePanel = el('div', null);
          scopePanel.id = scopePanelId;
          scopePanel.hidden = true;
          var scopeList = el('ul', 'criteria-list');
          scopeItems.forEach(function(item) { scopeList.appendChild(el('li', null, item)); });
          scopePanel.appendChild(scopeList);
          wireDisclosure(scopeBtn, scopePanel);
          scopeSection.appendChild(scopeBtn);
          scopeSection.appendChild(scopePanel);
          container.appendChild(scopeSection);
        }

        // Build Tasks Workspace (P1-5) — ordered by release.buildTaskIds
        // (the authority for build-task ordering), reusing the same
        // expandable item + shared toggleBuildTask state as Release Detail.
        var workspace = el('section', 'project-panel release-section');
        workspace.appendChild(el('h2', null, 'Build Tasks Workspace'));
        if (release && (release.buildTaskIds || []).length) {
          workspace.appendChild(el('p', null, 'Build tasks của release hiện tại · ' + releaseDisplay(release)));
          appendExpandableBuildTaskList(workspace, release.buildTaskIds);
        } else {
          workspace.appendChild(el('p', null, 'Release hiện tại chưa có build task nào trong kế hoạch.'));
        }
        container.appendChild(workspace);
      }

      function createRoadmapReleaseLink(release) {
        var link = el('a', 'roadmap-release');
        link.href = '#/release/' + release.id;
        link.setAttribute('data-release-id', release.id);
        var copy = el('div');
        copy.appendChild(el('div', 'roadmap-release-version', release.version));
        copy.appendChild(el('div', 'roadmap-release-title', release.title));
        copy.appendChild(el('div', 'roadmap-release-copy', release.problem || release.goal));
        link.appendChild(copy);
        var stateCol = el('div');
        appendStatusBadge(stateCol, release.status);
        stateCol.appendChild(createProjectProgress(release, 'User progress'));
        link.appendChild(stateCol);
        return link;
      }

      // Three layers — Milestone -> Release -> Personal Progress. Groups are
      // derived from projectData.milestones (never hardcoded); each release
      // still renders through the same .roadmap-release timeline item as
      // before, just nested under a milestone heading.
      function renderRoadmap(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        renderProjectWorkspaceHeader(
          container,
          'Release Roadmap',
          projectData.product.name + ' Roadmap',
          'Trạng thái kế hoạch của release và tiến độ build cá nhân là hai tín hiệu độc lập.'
        );
        renderProjectSubNav(container, 'roadmap');
        var groups = CourseCore.groupReleasesByMilestone(projectData.releases || [], projectData.milestones || []);
        groups.forEach(function(group) {
          var section = el('section', 'roadmap-milestone-group');
          var head = el('div', 'roadmap-milestone-head');
          head.appendChild(el('h2', null, group.milestone ? group.milestone.name : 'Release khác'));
          if (group.milestone && group.milestone.summary) head.appendChild(el('p', null, group.milestone.summary));
          section.appendChild(head);
          var list = el('div', 'roadmap-list');
          group.releases.forEach(function(release) { list.appendChild(createRoadmapReleaseLink(release)); });
          section.appendChild(list);
          container.appendChild(section);
        });
      }

      function renderReleaseDetail(container, releaseId) {
        if (!projectData) { renderProjectEmpty(container); return; }
        var release = releasesById.get(releaseId);
        if (!release) {
          renderProjectSubNav(container, 'roadmap');
          var notFound = el('section', 'project-not-found');
          notFound.appendChild(el('h1', null, 'Không tìm thấy release'));
          notFound.appendChild(el('p', null, 'Release “' + releaseId + '” không tồn tại trong project data.'));
          var back = el('a', 'text-link', '← Về Roadmap');
          back.href = '#/roadmap';
          notFound.appendChild(back);
          container.appendChild(notFound);
          return;
        }

        // Release Detail inherits the Roadmap tab in both the primary nav
        // (see updateNavActive) and this contextual sub-nav, since a release
        // page is reached from — and conceptually belongs to — the roadmap.
        renderProjectSubNav(container, 'roadmap');

        var detail = el('div');
        detail.setAttribute('data-release-detail', release.id);

        // RELEASE — hero keeps authored status (badge) and personal build
        // progress (progress bar) visually side by side but never merged
        // into one number, so the two signals stay legible as independent.
        var hero = el('header', 'release-hero');
        var line = el('div', 'project-release-line');
        line.appendChild(el('span', 'project-release-version', release.version));
        appendStatusBadge(line, release.status);
        hero.appendChild(line);
        hero.appendChild(el('h1', null, release.title));
        hero.appendChild(el('p', null, release.goal));
        hero.appendChild(createProjectProgress(release, 'Release Progress'));
        detail.appendChild(hero);

        // Problem -> Goal, side by side (closely paired, read together).
        var problemGoal = el('div', 'release-columns');
        var problem = el('section', 'project-panel');
        problem.appendChild(el('div', 'project-section-label', 'Problem'));
        problem.appendChild(el('p', null, release.problem));
        problemGoal.appendChild(problem);
        var goal = el('section', 'project-panel');
        goal.appendChild(el('div', 'project-section-label', 'Goal'));
        goal.appendChild(el('p', null, release.goal));
        problemGoal.appendChild(goal);
        detail.appendChild(problemGoal);

        // Features — richer cards (description, domainEntities, per-feature
        // progress) instead of the plain name list used on lesson pages.
        var features = el('section', 'project-panel release-section');
        features.appendChild(el('h2', null, 'Features'));
        appendFeatureDetailList(features, release.featureIds);
        detail.appendChild(features);

        // Learning Dependencies, reframed as a Learning <-> Project bridge:
        // readable prose-list of concepts, not a tag cloud.
        var deps = el('section', 'project-panel release-section');
        deps.appendChild(el('h2', null, 'Learning ↔ Project'));
        deps.appendChild(el('p', null, 'Kiến thức khoá học cần có trước khi bắt tay vào release này:'));
        var depList = el('ul', 'dependency-list');
        (release.learningDependencies || []).forEach(function(item) { depList.appendChild(el('li', null, item)); });
        deps.appendChild(depList);
        detail.appendChild(deps);

        // Build Tasks — expandable items (constraints / acceptance criteria
        // / relevant lessons) sharing the same toggleBuildTask state as the
        // Dashboard and lesson Project Application panels.
        var tasks = el('section', 'project-panel release-section');
        tasks.appendChild(el('h2', null, 'Build Tasks'));
        if ((release.buildTaskIds || []).length) appendExpandableBuildTaskList(tasks, release.buildTaskIds);
        else tasks.appendChild(el('p', null, 'Release này chưa có build task nào trong kế hoạch.'));
        detail.appendChild(tasks);

        // Acceptance Criteria
        var criteria = el('section', 'project-panel release-section');
        criteria.appendChild(el('h2', null, 'Acceptance Criteria'));
        var criteriaList = el('ul', 'criteria-list');
        (release.acceptanceCriteria || []).forEach(function(item) { criteriaList.appendChild(el('li', null, item)); });
        criteria.appendChild(criteriaList);
        detail.appendChild(criteria);

        // Architecture — this release's planned stage.
        var architecture = archStageByReleaseId.get(release.id);
        if (architecture) {
          var stage = el('section', 'project-panel architecture-stage release-section');
          stage.appendChild(el('h2', null, 'Architecture: ' + architecture.title));
          if (release.status === 'planned') stage.appendChild(el('p', 'architecture-target-note', 'Architecture planned for this release — not yet built.'));
          stage.appendChild(el('p', null, architecture.rationale));
          if ((architecture.layers || []).length) {
            var layerList = el('ul', 'criteria-list');
            architecture.layers.forEach(function(layer) { layerList.appendChild(el('li', null, layer)); });
            stage.appendChild(layerList);
          }
          // The diagram itself is deliberately NOT repeated here: the
          // Architecture Change section immediately below renders the very
          // same ASCII diagram as its "After"/"Initial Architecture" column,
          // and showing it twice inside one viewport is duplicate
          // presentation of identical data. Title, rationale and layers stay.
          detail.appendChild(stage);

          // Before/After Architecture Change (P1-7). V0.1 has no prior
          // release, so it only ever shows "Initial Architecture" — never an
          // invented "Before" state. V0.2+ resolves the previous release by
          // order (release.order - 1), never a hardcoded description.
          var compare = el('section', 'project-panel release-section');
          compare.appendChild(el('h2', null, 'Architecture Change'));
          var prevRelease = (projectData.releases || []).find(function(r) { return r.order === release.order - 1; });
          var prevStage = prevRelease ? archStageByReleaseId.get(prevRelease.id) : null;
          var compareGrid = el('div', 'architecture-compare');
          if (prevStage) {
            var beforeCol = el('div', 'architecture-compare-col');
            beforeCol.appendChild(el('div', 'architecture-compare-label', 'Before · ' + prevRelease.version));
            beforeCol.appendChild(createArchitectureDiagram(prevStage.diagram, 'Sơ đồ kiến trúc trước đó · ' + prevRelease.version + ' — ' + prevStage.title));
            compareGrid.appendChild(beforeCol);
          }
          var afterCol = el('div', 'architecture-compare-col');
          afterCol.appendChild(el('div', 'architecture-compare-label', prevStage ? 'After · ' + release.version : 'Initial Architecture'));
          afterCol.appendChild(createArchitectureDiagram(architecture.diagram, 'Sơ đồ kiến trúc ' + release.version + ' — ' + architecture.title));
          compareGrid.appendChild(afterCol);
          compare.appendChild(compareGrid);
          if (prevStage && architecture.changesFromPrev) {
            compare.appendChild(el('p', 'architecture-compare-changes', architecture.changesFromPrev));
          }
          detail.appendChild(compare);
        }

        container.appendChild(detail);
      }

      var MAP_TYPE_LABELS = { direct: 'Direct', future: 'Future', theory: 'Theory', unmapped: 'Unmapped' };

      function createMapRow(row) {
        var item = el('div', 'map-row');
        var main = el('div', 'map-row-main');
        var link = el('a', 'text-link', row.title);
        link.href = '#/lesson/' + row.id;
        main.appendChild(link);
        if (row.group) main.appendChild(el('div', 'map-row-group', row.group));
        item.appendChild(main);

        var meta = el('div', 'map-row-meta');
        // Reuses the .project-type pill shape, but its color modifiers are
        // named map-type--* (not project-type--*): the latter is already a
        // bare-class selector applied to the OUTER .project-context/
        // .project-application container elsewhere (a different, container-
        // level combo), so reusing it here on a single badge span would leak
        // border/background rules meant for that container.
        meta.appendChild(el('span', 'project-type map-type--' + row.applicationType, MAP_TYPE_LABELS[row.applicationType] || row.applicationType));
        if (row.releaseId) {
          var release = releasesById.get(row.releaseId);
          if (release) {
            var releaseLink = el('a', 'text-link', release.version);
            releaseLink.href = '#/release/' + release.id;
            meta.appendChild(releaseLink);
          }
        }
        if ((row.featureIds || []).length) {
          var names = row.featureIds.map(function(id) {
            var feature = featuresById.get(id);
            return feature ? feature.name : id;
          }).join(', ');
          meta.appendChild(el('span', 'map-row-features', names));
        }
        item.appendChild(meta);
        return item;
      }

      // Course <-> Project Map (P1-2). Filters are client-side only, never
      // persisted — CourseCore.deriveMapRows/filterMapRows do the pure work,
      // this just wires two filter controls to a re-render of the row list.
      function renderCourseProjectMap(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        renderProjectWorkspaceHeader(
          container,
          'Course ↔ Project',
          'Course ↔ Project Map',
          'Mỗi bài học liên hệ với ' + projectData.product.name + ' ra sao: direct (xây trực tiếp), future (dùng ở release sau), theory (kiến thức nền), hoặc unmapped (bài tổng hợp chưa gắn với release cụ thể).'
        );
        renderProjectSubNav(container, 'map');

        var allRows = CourseCore.deriveMapRows(courseData.lessons, projectData.lessonMap);
        var filterState = { type: 'all', release: 'all' };

        var filterBar = el('div', 'map-filterbar');
        filterBar.setAttribute('role', 'group');
        filterBar.setAttribute('aria-label', 'Lọc bản đồ khoá học ↔ dự án');
        var TYPE_FILTERS = [
          { key: 'all', label: 'Tất cả' },
          { key: 'direct', label: 'Direct' },
          { key: 'future', label: 'Future' },
          { key: 'theory-unmapped', label: 'Theory / Unmapped' },
        ];
        var typeButtons = TYPE_FILTERS.map(function(filter) {
          var btn = el('button', 'map-filter-btn', filter.label);
          btn.type = 'button';
          btn.setAttribute('aria-pressed', filter.key === 'all' ? 'true' : 'false');
          btn.addEventListener('click', function() {
            filterState.type = filter.key;
            typeButtons.forEach(function(other) { other.setAttribute('aria-pressed', other === btn ? 'true' : 'false'); });
            renderRows();
          });
          filterBar.appendChild(btn);
          return btn;
        });

        var releaseWrap = el('div', 'map-filter-release');
        var releaseLabel = el('label', null, 'Release');
        releaseLabel.setAttribute('for', 'map-release-filter');
        var releaseSelect = el('select');
        releaseSelect.id = 'map-release-filter';
        var allOption = el('option', null, 'Tất cả release');
        allOption.value = 'all';
        releaseSelect.appendChild(allOption);
        (projectData.releases || []).slice().sort(function(a, b) { return a.order - b.order; }).forEach(function(release) {
          var opt = el('option', null, release.version + ' — ' + release.title);
          opt.value = release.id;
          releaseSelect.appendChild(opt);
        });
        releaseSelect.addEventListener('change', function() {
          filterState.release = releaseSelect.value;
          renderRows();
        });
        releaseWrap.appendChild(releaseLabel);
        releaseWrap.appendChild(releaseSelect);
        filterBar.appendChild(releaseWrap);
        container.appendChild(filterBar);

        var summary = el('p', 'map-summary');
        container.appendChild(summary);
        var rowsContainer = el('div', 'map-rows');
        container.appendChild(rowsContainer);

        function renderRows() {
          var filtered = CourseCore.filterMapRows(allRows, filterState.type, filterState.release);
          summary.textContent = filtered.length + ' / ' + allRows.length + ' bài học';
          rowsContainer.innerHTML = '';
          if (!filtered.length) {
            rowsContainer.appendChild(el('p', 'project-empty', 'Không có bài học nào khớp với bộ lọc hiện tại.'));
            return;
          }
          filtered.forEach(function(row) { rowsContainer.appendChild(createMapRow(row)); });
        }
        renderRows();
      }

      // Architecture Evolution (P1-3). Single source of truth:
      // projectData.architectureStages, joined + ordered via
      // CourseCore.orderArchitectureStages. Every release currently carries
      // status "planned", so copy is deliberately honest — only the
      // resolved current release (selectCurrentRelease) is called out as
      // the "Current Build Target"; every stage (including that one) is
      // still labelled "planned", never "currently deployed".
      function renderArchitecture(container) {
        if (!projectData) { renderProjectEmpty(container); return; }
        renderProjectWorkspaceHeader(
          container,
          'Architecture Evolution',
          'Architecture Evolution',
          'Kiến trúc ' + projectData.product.name + ' mở rộng dần theo từng release. Mọi stage dưới đây đều đang ở trạng thái kế hoạch — chưa có stage nào được xây hay đang chạy production.'
        );
        renderProjectSubNav(container, 'architecture');

        var pairs = CourseCore.orderArchitectureStages(projectData.releases || [], projectData.architectureStages || []);
        if (!pairs.length) {
          container.appendChild(el('p', 'project-empty', 'Chưa có architecture stage nào trong kế hoạch.'));
          return;
        }
        var currentRelease = currentProjectRelease();

        var stageNav = el('nav', 'architecture-stage-nav');
        stageNav.setAttribute('aria-label', 'Chuyển nhanh giữa các architecture stage');
        var stageNavLinks = [];
        /* The pills (and each stage's Prev/Next controls) are in-page jump
           links, and the hashchange handler deliberately skips re-rendering
           for in-page anchors so the browser's native scroll works — which
           means nothing would otherwise update which stage the learner is
           on. Mark the jumped-to pill with aria-current="location", the
           accurate value for a position inside the current page (rather
           than "page", which would claim a separate destination). */
        function markStageNav(stageId) {
          stageNavLinks.forEach(function(link) {
            if (link.getAttribute('data-stage-nav') === stageId) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
          });
        }
        function stageJumpLink(className, label, targetReleaseId) {
          var link = el('a', className, label);
          link.href = '#architecture-stage-' + targetReleaseId;
          link.addEventListener('click', function() { markStageNav(targetReleaseId); });
          return link;
        }
        pairs.forEach(function(pair) {
          var link = stageJumpLink('architecture-stage-nav-link', pair.release.version, pair.release.id);
          link.setAttribute('data-stage-nav', pair.release.id);
          stageNav.appendChild(link);
          stageNavLinks.push(link);
        });
        container.appendChild(stageNav);

        pairs.forEach(function(pair, index) {
          var release = pair.release;
          var stage = pair.stage;
          var block = el('section', 'project-panel architecture-stage release-section');
          block.id = 'architecture-stage-' + release.id;
          var isCurrent = !!currentRelease && currentRelease.id === release.id;
          block.appendChild(el('div', 'project-section-label', release.version + ' · ' + release.title));
          block.appendChild(el('p', 'architecture-target-note', isCurrent
            ? 'Current Build Target — trạng thái release: ' + release.status + '.'
            : 'Architecture planned for release ' + release.version + ' (trạng thái release: ' + release.status + ') — chưa được xây.'));
          block.appendChild(el('h2', null, stage.title));
          block.appendChild(el('p', null, stage.rationale));
          if ((stage.layers || []).length) {
            var layerList = el('ul', 'criteria-list');
            stage.layers.forEach(function(layer) { layerList.appendChild(el('li', null, layer)); });
            block.appendChild(layerList);
          }
          block.appendChild(createArchitectureDiagram(stage.diagram, 'Sơ đồ kiến trúc ' + release.version + ' — ' + stage.title));

          var controls = el('div', 'architecture-stage-controls');
          if (index > 0) {
            controls.appendChild(stageJumpLink('text-link', '← ' + pairs[index - 1].release.version, pairs[index - 1].release.id));
          }
          var releaseLink = el('a', 'text-link', 'Xem release ' + release.version);
          releaseLink.href = '#/release/' + release.id;
          controls.appendChild(releaseLink);
          if (index < pairs.length - 1) {
            controls.appendChild(stageJumpLink('text-link', pairs[index + 1].release.version + ' →', pairs[index + 1].release.id));
          }
          block.appendChild(controls);
          container.appendChild(block);
        });
      }

      /* ---- drawer with focus trap -------------------------------------- */
      var lastFocusedBeforeDrawer = null;

      function drawerFocusables() {
        var sidebar = document.getElementById('course-sidebar');
        if (!sidebar) return [];
        return Array.prototype.filter.call(
          sidebar.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'),
          function(node) { return node.offsetParent !== null || node.getClientRects().length > 0; }
        );
      }

      function openDrawer() {
        var btn = document.querySelector('[data-action="open-drawer"]');
        lastFocusedBeforeDrawer = document.activeElement;
        document.body.classList.add('drawer-open');
        if (btn) btn.setAttribute('aria-expanded', 'true');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = false;
        /* Focus the current lesson link if present, else first focusable */
        var targetLink = document.querySelector('.lesson-link[aria-current="page"]') || drawerFocusables()[0];
        if (targetLink) { targetLink.focus(); return; }
        /* Sidebar may not be rendered yet — focus the sidebar itself */
        var sidebar = document.getElementById('course-sidebar');
        if (sidebar) { sidebar.setAttribute('tabindex', '-1'); sidebar.focus(); }
      }

      function closeDrawer() {
        var wasOpen = document.body.classList.contains('drawer-open');
        document.body.classList.remove('drawer-open');
        var btn = document.querySelector('[data-action="open-drawer"]');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        var backdrop = document.querySelector('.drawer-backdrop');
        if (backdrop) backdrop.hidden = true;
        if (wasOpen && lastFocusedBeforeDrawer && lastFocusedBeforeDrawer.isConnected) {
          lastFocusedBeforeDrawer.focus();
          lastFocusedBeforeDrawer = null;
        } else if (wasOpen && btn) {
          btn.focus();
        }
      }

      /* Tab cycling inside the open drawer */
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeDrawer(); return; }
        if (e.key !== 'Tab' || !document.body.classList.contains('drawer-open')) return;
        var focusables = drawerFocusables();
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        var active = document.activeElement;
        var inSidebar = active && (active.closest ? active.closest('#course-sidebar') : false);
        if (!inSidebar) {
          e.preventDefault();
          first.focus();
          return;
        }
        if (e.shiftKey && (active === first || !inSidebar)) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        }
      });

      /* Clear drawer state when resizing up to desktop */
      var desktopQuery = window.matchMedia('(min-width: 64rem)');
      function handleBreakpointChange(e) {
        if (e.matches) {
          document.body.classList.remove('drawer-open');
          var btn = document.querySelector('[data-action="open-drawer"]');
          if (btn) btn.setAttribute('aria-expanded', 'false');
          var backdrop = document.querySelector('.drawer-backdrop');
          if (backdrop) backdrop.hidden = true;
        }
      }
      if (desktopQuery.addEventListener) desktopQuery.addEventListener('change', handleBreakpointChange);
      else if (desktopQuery.addListener) desktopQuery.addListener(handleBreakpointChange);

      document.addEventListener('click', function(e) {
        var target = e.target.closest('[data-action]');
        if (!target) return;
        var action = target.getAttribute('data-action');
        /* The hamburger button keeps a static data-action="open-drawer" —
           it doubles as the close control while the drawer is open, so
           branch on live state rather than the (unchanging) attribute. */
        if (action === 'open-drawer') {
          if (document.body.classList.contains('drawer-open')) closeDrawer(); else openDrawer();
        }
        if (action === 'close-drawer') closeDrawer();
        if (action === 'toggle-theme') cycleTheme();
      });

      /* ---- theme ----------------------------------------------------- */
      var THEME_ORDER = ['system', 'light', 'dark'];
      var THEME_LABELS = { system: 'Giao diện: theo hệ thống', light: 'Giao diện: sáng', dark: 'Giao diện: tối' };
      function resolveTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return theme;
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', resolveTheme(theme));
      }
      applyTheme(state.theme);
      /* Follow system changes while in system mode */
      var schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function onSchemeChange() { if (state.theme === 'system') applyTheme('system'); }
      if (schemeQuery.addEventListener) schemeQuery.addEventListener('change', onSchemeChange);
      else if (schemeQuery.addListener) schemeQuery.addListener(onSchemeChange);
      /* renderApp() (called below, and again inside the self-test) rebuilds
         the header from scratch each time, so a button reference captured
         here would go stale. Look the button up fresh on every call instead,
         and wire the click through the delegated document listener above
         (data-action="toggle-theme") rather than binding .onclick directly
         to a node that doesn't exist yet at this point in script execution. */
      function syncThemeButton() {
        var themeBtn = document.getElementById('theme-toggle');
        if (!themeBtn) return;
        themeBtn.setAttribute('aria-label', THEME_LABELS[state.theme] || state.theme);
        themeBtn.innerHTML = icon(state.theme === 'dark' ? 'moon' : state.theme === 'light' ? 'sun' : 'monitor');
      }
      function cycleTheme() {
        state.theme = THEME_ORDER[(THEME_ORDER.indexOf(state.theme) + 1) % 3];
        applyTheme(state.theme);
        saveState();
        syncThemeButton();
      }

      /* ---- in-browser self-test (Site Task 6) ------------------------- */
      function runSelfTest() {
        var results = [];
        var storageBackup = null;
        /* Use an in-memory adapter so the learner's real state is untouched. */
        try {
          storageBackup = localStorage.getItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) { storageBackup = undefined; }
        var memStore = {};
        var realGetItem = localStorage.getItem.bind(localStorage);
        var realSetItem = localStorage.setItem.bind(localStorage);
        var realRemoveItem = localStorage.removeItem.bind(localStorage);
        localStorage.getItem = function(k) { return k === STORAGE_KEY ? (k in memStore ? memStore[k] : null) : realGetItem(k); };
        localStorage.setItem = function(k, v) { if (k === STORAGE_KEY) { memStore[k] = String(v); return; } return realSetItem(k, v); };
        localStorage.removeItem = function(k) { if (k === STORAGE_KEY) { delete memStore[k]; return; } return realRemoveItem(k); };

        function assert(name, cond) {
          results.push({ name: name, ok: !!cond });
        }

        /* Scan every authored code block for the first one matching a
           language predicate — used by the copy-to-clipboard checks below
           to locate a real Java block and a real configuration block
           without hardcoding a specific lesson id. */
        function findCodeBlock(languageTest) {
          for (var li = 0; li < courseData.lessons.length; li++) {
            var lsn = courseData.lessons[li];
            var sections = lsn.sections || [];
            for (var si = 0; si < sections.length; si++) {
              var blocks = sections[si].blocks || [];
              for (var bi = 0; bi < blocks.length; bi++) {
                var blk = blocks[bi];
                if (blk.type === "code" && languageTest(blk.language || "")) {
                  return { lessonId: lsn.id, code: blk.code || "" };
                }
              }
            }
          }
          return null;
        }

        try {
          /* 1 — course data has 40 lessons */
          assert("course data has 40 lessons", courseData.lessons.length === 40);

          /* 2 — dashboard renders total progress */
          location.hash = "";
          routeRender();
          var viewEl = document.getElementById("route-view");
          assert("dashboard renders total progress",
            viewEl.textContent.indexOf("/40") !== -1);

          /* 3 — search "dependency injection" returns Day 14 */
          var diHits = CourseCore.searchLessons(courseData.lessons, courseData.units, "dependency injection");
          assert("search dependency injection returns Day 14",
            diHits.some(function(l) { return l.id === "day-14"; }));

          /* 4 — search "kiem thu" returns a testing lesson (authored: Day 18 lab) */
          var ktHits = CourseCore.searchLessons(courseData.lessons, courseData.units, "kiem thu");
          assert("search kiem thu returns a testing lesson",
            ktHits.some(function(l) { return l.id === "day-18"; }) ||
            ktHits.length > 0);

          /* 5 — unit collapse toggles aria-expanded */
          renderApp();
          syncThemeButton();
          renderSidebar();
          var toggle = document.querySelector(".module-toggle");
          var before = toggle.getAttribute("aria-expanded");
          toggle.click();
          var after = toggle.getAttribute("aria-expanded");
          assert("unit collapse toggles aria-expanded", before !== after && after === "false");
          toggle.click(); /* restore */

          /* 6 — navigating to Day 1 updates route and lesson h1 */
          location.hash = "#lesson/day-01";
          routeRender();
          viewEl = document.getElementById("route-view"); /* renderApp() above replaced the DOM */
          var h1 = viewEl.querySelector("h1.lesson-title");
          assert("navigating to Day 1 updates route and lesson h1",
            !!h1 && h1.textContent.indexOf("JVM") !== -1);

          /* 7/8 — hint & solution disclosures start hidden and toggle */
          var hintPanel = viewEl.querySelector('[id^="hint-"]');
          assert("hint panel exists", !!hintPanel);
          if (!hintPanel) throw new Error("no hint panel");
          var hintBtn = viewEl.querySelector('[aria-controls="' + hintPanel.id + '"]');
          if (!hintBtn) throw new Error("no hint button");
          var hintHiddenBefore = hintPanel.hidden;
          hintBtn.click();
          var hintVisibleAfter = !hintPanel.hidden;
          assert("hint starts hidden and toggles visible", hintHiddenBefore && hintVisibleAfter);
          if (hintBtn.getAttribute("aria-expanded") === "true") hintBtn.click();

          var solPanel = viewEl.querySelector('[id^="sol-"]');
          var solBtn = viewEl.querySelector('[aria-controls="' + solPanel.id + '"]');
          var solHiddenBefore = solPanel.hidden;
          solBtn.click();
          var solVisibleAfter = !solPanel.hidden;
          assert("solution starts hidden and toggles visible", solHiddenBefore && solVisibleAfter);
          if (solBtn.getAttribute("aria-expanded") === "true") solBtn.click();

          /* 9 — mark completed updates header progress */
          var barBefore = document.getElementById("progress-bar").value;
          var doneBtn = viewEl.querySelector('[data-action="toggle-completion"]');
          doneBtn.click();
          var barAfter = document.getElementById("progress-bar").value;
          assert("mark completed updates header progress", Number(barAfter) === Number(barBefore) + 1);
          doneBtn.click(); /* restore */

          /* 10 — previous/next destination matches ordered data */
          var nextLink = viewEl.querySelector(".nav-next");
          var expectedNext = CourseCore.nextLessonId(courseData.lessons, "day-01", 1);
          assert("previous/next destination matches ordered data",
            nextLink && nextLink.getAttribute("href") === "#lesson/" + expectedNext);

          /* 11 — mobile drawer open/close when viewport is mobile */
          var isMobileViewport = window.innerWidth < 1024;
          openDrawer();
          var openedOk = document.body.classList.contains("drawer-open");
          closeDrawer();
          var closedOk = !document.body.classList.contains("drawer-open");
          assert("mobile drawer open/close state changes when viewport is mobile",
            isMobileViewport ? (openedOk && closedOk) : (openedOk && closedOk));

          /* 11b — clicking the hamburger button twice (as a real user does)
             must open then close the drawer. Regression test for a bug where
             the button's static data-action="open-drawer" made every click
             re-open instead of toggling — calling openDrawer()/closeDrawer()
             directly (test 11, above) could never have caught that. */
          var hamburgerBtn = document.querySelector(".nav-toggle");
          document.body.classList.remove("drawer-open");
          hamburgerBtn.click();
          var openedByClick = document.body.classList.contains("drawer-open");
          hamburgerBtn.click();
          var closedBySecondClick = !document.body.classList.contains("drawer-open");
          assert("clicking the hamburger button twice opens then closes the drawer",
            openedByClick && closedBySecondClick);

          /* 11c — clicking the theme button cycles state.theme and updates
             the DOM. Regression test for a bug where the click handler was
             wired to document.getElementById('theme-toggle') before
             renderApp() had created that element, so it was silently never
             attached. */

            navLinksForOverflow.every(function(link) {
              var rect = link.getBoundingClientRect();
              return rect.width > 0 && rect.left >= -1 && rect.right <= window.innerWidth + 1;
            });
          assert("layout has no horizontal overflow and all four primary nav links stay within the viewport",
            overflowOk && navLinksVisibleOk);

          /* 40 — When the narrow-viewport (<=30rem) breakpoint is active,
             its grid-collapsing overrides actually take effect. This is a
             viewport-agnostic invariant (vacuously true when the breakpoint
             isn't active) that specifically guards against @media block
             source-order regressions: a rule declared earlier in the
             stylesheet loses to an unconditional same-specificity rule
             declared later, even while its own media query matches, so a
             misplaced override can silently stop applying without ever
             causing horizontal overflow (the columns just get very narrow
             instead of collapsing to one). */
          var narrowActive = window.matchMedia("(max-width: 30rem)").matches;
          var progressCardEl = document.querySelector(".dash-progress-card");
          var narrowGridOk = !narrowActive || !progressCardEl ||
            getComputedStyle(progressCardEl).gridTemplateColumns.trim().split(/\s+/).length === 1;
          assert("narrow-viewport grid-collapse overrides win the cascade when their media query is active",
            narrowGridOk);

          /* 41 — a Release Detail page is reached only through the Roadmap
             tab (there is no standalone "Release" primary-nav destination),
             so its aria-current wayfinding cue should stay on "Lộ trình"
             rather than going dark — losing the active nav highlight on
             every release drill-down would strand the learner without a
             "where am I" cue even though they are still squarely inside
             the Roadmap section. */
          location.hash = "#/release/v0-1";
          routeRender();
          var releaseNavActive = document.querySelector('.primary-nav [data-view="roadmap"][aria-current="page"]');
          assert("viewing a release keeps the Roadmap primary-nav tab marked active",
            !!releaseNavActive);

          /* 42 — Lessons belong to the Learning Track, whose P0 primary-nav
             destination is Học/Dashboard. The active wayfinding cue must stay
             on Học while reading any lesson, just as Release Detail inherits
             the Roadmap cue above. */
          location.hash = "#/lesson/day-20";
          routeRender();
          var lessonNavActive = document.querySelector('.primary-nav [data-view="dashboard"][aria-current="page"]');
          assert("viewing a lesson keeps the Học primary-nav tab marked active",
            !!lessonNavActive);

          /* 43 — At the true 390px mobile viewport, the lesson footer must
             fit within the layout viewport. Its previous three-column intrinsic
             minimum expanded window.innerWidth beyond visualViewport.width on
             long lessons, so fixed navigation and screenshots were scaled up. */
          var mobileVisualWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
          var lessonFooterFitsViewport = mobileVisualWidth > 480 ||
            (window.innerWidth <= mobileVisualWidth + 1 &&
             document.documentElement.scrollWidth <= mobileVisualWidth + 1);
          assert("a lesson footer never expands the mobile layout beyond the visual viewport",
            lessonFooterFitsViewport);

          /* 44 — When the curriculum drawer opens on mobile, it owns the full
             interaction layer below the header. The fixed bottom primary nav
             must not sit above and intercept the drawer's final rows. */
          var drawerLayeringOk = true;
          if (mobileVisualWidth <= 1024) {
            openDrawer();
            var drawerForLayering = document.getElementById("course-sidebar");
            var navForLayering = document.querySelector(".primary-nav");
            var drawerZ = drawerForLayering ? Number(getComputedStyle(drawerForLayering).zIndex) : 0;
            var navZ = navForLayering ? Number(getComputedStyle(navForLayering).zIndex) : 0;
            drawerLayeringOk = !!drawerForLayering && !!navForLayering && drawerZ > navZ;
            closeDrawer();
          }
          assert("an open mobile curriculum drawer stays above the fixed primary nav",
            drawerLayeringOk);

          /* 45 — Long authored lesson titles must shrink inside the mobile
             curriculum drawer instead of making its implicit grid track wider
             than the drawer and introducing an internal horizontal scrollbar. */
          var drawerWidthOk = true;
          if (mobileVisualWidth <= 1024) {
            openDrawer();
            var drawerForWidth = document.getElementById("course-sidebar");
            drawerWidthOk = !!drawerForWidth && drawerForWidth.scrollWidth <= drawerForWidth.clientWidth + 1;
            closeDrawer();
          }
          assert("the mobile curriculum drawer has no internal horizontal overflow",
            drawerWidthOk);

          /* 46 — Course ↔ Project Map: filters are pure/client-side. The
             "Theory / Unmapped" control groups two distinct data-level
             types under one filter without merging their identities. */
          location.hash = "#/map";
          routeRender();
          var mapView = document.getElementById("route-view");
          var allMapRows = CourseCore.deriveMapRows(courseData.lessons, projectData.lessonMap);
          var mapRowsAllOk = mapView.querySelectorAll(".map-row").length === allMapRows.length;
          var mapFilterBtns = mapView.querySelectorAll(".map-filter-btn");
          var directBtn = Array.prototype.slice.call(mapFilterBtns).find(function(b) { return b.textContent.trim() === "Direct"; });
          directBtn.click();
          var directCount = allMapRows.filter(function(r) { return r.applicationType === "direct"; }).length;
          var directRows = mapView.querySelectorAll(".map-row");
          var directFilterOk = directRows.length === directCount &&
            directBtn.getAttribute("aria-pressed") === "true" &&
            Array.prototype.every.call(directRows, function(row) { return !!row.querySelector(".map-type--direct"); });
          var theoryUnmappedBtn = Array.prototype.slice.call(mapFilterBtns).find(function(b) { return b.textContent.trim() === "Theory / Unmapped"; });
          theoryUnmappedBtn.click();
          var theoryUnmappedCount = allMapRows.filter(function(r) { return r.applicationType === "theory" || r.applicationType === "unmapped"; }).length;
          var theoryUnmappedRows = mapView.querySelectorAll(".map-row");
          var theoryUnmappedOk = theoryUnmappedRows.length === theoryUnmappedCount &&
            directBtn.getAttribute("aria-pressed") === "false" &&
            Array.prototype.some.call(theoryUnmappedRows, function(row) { return !!row.querySelector(".map-type--theory"); }) &&
            Array.prototype.some.call(theoryUnmappedRows, function(row) { return !!row.querySelector(".map-type--unmapped"); });
          var allBtn = Array.prototype.slice.call(mapFilterBtns).find(function(b) { return b.textContent.trim() === "Tất cả"; });
          allBtn.click();
          var releaseSelectEl = mapView.querySelector("#map-release-filter");
          var sampleReleaseId = allMapRows.filter(function(r) { return r.releaseId; })[0].releaseId;
          releaseSelectEl.value = sampleReleaseId;
          releaseSelectEl.dispatchEvent(new Event("change"));
          var releaseFilterCount = allMapRows.filter(function(r) { return r.releaseId === sampleReleaseId; }).length;
          var releaseFilterOk = mapView.querySelectorAll(".map-row").length === releaseFilterCount;
          assert("Course ↔ Project Map type and release filters narrow rows correctly, keeping theory/unmapped as distinct data-level types",
            mapRowsAllOk && directFilterOk && theoryUnmappedOk && releaseFilterOk);

          /* 47 — Architecture Evolution orders stages by release order (not
             hardcoded), labels only the resolved current release "Current
             Build Target", and never claims any stage is deployed/running —
             every authored release.status is "planned". */
          location.hash = "#/architecture";
          routeRender();
          var archView = document.getElementById("route-view");
          var archPairs = CourseCore.orderArchitectureStages(projectData.releases || [], projectData.architectureStages || []);
          var archBlocks = archView.querySelectorAll(".architecture-stage");
          var archOrderOk = archBlocks.length === archPairs.length &&
            Array.prototype.every.call(archBlocks, function(block, i) { return block.id === "architecture-stage-" + archPairs[i].release.id; });
          var currentArchRelease = currentProjectRelease();
          var currentArchBlock = document.getElementById("architecture-stage-" + currentArchRelease.id);
          var currentNoteOk = !!currentArchBlock &&
            currentArchBlock.querySelector(".architecture-target-note").textContent.indexOf("Current Build Target") !== -1;
          var targetNotes = archView.querySelectorAll(".architecture-target-note");
          var honestWordingOk = targetNotes.length === archPairs.length &&
            Array.prototype.every.call(targetNotes, function(note) {
              var lower = note.textContent.toLowerCase();
              return lower.indexOf("deployed") === -1 && lower.indexOf("đang chạy") === -1;
            });
          assert("Architecture Evolution orders stages by release order, marks only the current release as the Current Build Target, and never claims a stage is deployed/running",
            archOrderOk && currentNoteOk && honestWordingOk);

          /* 48 — Domain Overview derives entities from features[].domainEntities
             (union+dedup, never hardcoded), and Project Boundaries discloses
             every product.outOfScope item behind a real accordion. */
          location.hash = "#/project";
          routeRender();
          var overviewView = document.getElementById("route-view");
          var derivedEntities = CourseCore.deriveDomainEntities(projectData.features || []);
          var domainCards = overviewView.querySelectorAll(".domain-entity-card");
          var domainOk = domainCards.length === derivedEntities.length &&
            Array.prototype.every.call(domainCards, function(card, i) { return card.querySelector("h3").textContent === derivedEntities[i].entity; });
          var scopeBtn = overviewView.querySelector('[aria-controls="project-out-of-scope"]');
          var scopePanelEl = document.getElementById("project-out-of-scope");
          var scopeHiddenBefore = scopePanelEl.hidden;
          scopeBtn.click();
          var scopeVisibleAfter = !scopePanelEl.hidden;
          var scopeItemsOk = scopePanelEl.querySelectorAll("li").length === (projectData.product.outOfScope || []).length;
          scopeBtn.click(); /* restore */
          assert("Domain Overview derives entities from features[].domainEntities and Project Boundaries discloses every out-of-scope item",
            domainOk && scopeHiddenBefore && scopeVisibleAfter && scopeItemsOk);

          /* 49 — Build Tasks Workspace (inside Project Overview) orders tasks
             per release.buildTaskIds and shares toggleBuildTask state with
             Release Detail; its own "Chi tiết" detail-disclosure toggle must
             never be confused with the completion toggle by shared selectors. */
          var workspaceRelease = currentProjectRelease();
          var workspaceTaskControls = overviewView.querySelectorAll('[data-action="toggle-build-task"]');
          var workspaceOrderOk = Array.prototype.every.call(workspaceTaskControls, function(ctrl, i) {
            return ctrl.getAttribute("data-task-id") === workspaceRelease.buildTaskIds[i];
          });
          var noOverlapWithDetailToggle = overviewView.querySelectorAll('[data-action="toggle-build-task"].build-task-detail-toggle').length === 0;
          assert("Build Tasks Workspace orders tasks per release.buildTaskIds and keeps its detail-disclosure toggle distinct from the completion toggle",
            workspaceTaskControls.length === workspaceRelease.buildTaskIds.length && workspaceOrderOk && noOverlapWithDetailToggle);

          /* 50 — Roadmap groups every release by its authored milestone (not
             hardcoded), in milestone-then-release order, matching
             CourseCore.groupReleasesByMilestone exactly. */
          location.hash = "#/roadmap";
          routeRender();
          var roadmapViewGrouped = document.getElementById("route-view");
          var milestoneGroups = roadmapViewGrouped.querySelectorAll(".roadmap-milestone-group");
          var expectedGroups = CourseCore.groupReleasesByMilestone(projectData.releases || [], projectData.milestones || []);
          var groupCountOk = milestoneGroups.length === expectedGroups.length;
          var totalReleaseLinksOk = roadmapViewGrouped.querySelectorAll(".roadmap-release").length === projectData.releases.length;
          var groupHeadingsOk = Array.prototype.every.call(milestoneGroups, function(group, i) {
            var heading = group.querySelector("h2");
            var expectedName = expectedGroups[i].milestone ? expectedGroups[i].milestone.name : "Release khác";
            return !!heading && heading.textContent === expectedName;
          });
          assert("Roadmap groups every release under its authored milestone in release order, matching CourseCore.groupReleasesByMilestone",
            groupCountOk && totalReleaseLinksOk && groupHeadingsOk);

          /* 51 — Release Detail's Architecture Change section shows only
             "Initial Architecture" on V0.1 (no invented prior state) and a
             real Before/After comparison + changesFromPrev prose on V0.2+. */
          location.hash = "#/release/v0-1";
          routeRender();
          var v01View = document.getElementById("route-view");
          var v01Compare = v01View.querySelector(".architecture-compare");
          var v01Ok = !!v01Compare && v01Compare.querySelectorAll(".architecture-compare-col").length === 1 &&
            v01Compare.textContent.indexOf("Initial Architecture") !== -1;
          var v02Release = (projectData.releases || []).find(function(r) { return r.order === 2; });
          location.hash = "#/release/" + v02Release.id;
          routeRender();
          var v02View = document.getElementById("route-view");
          var v02Compare = v02View.querySelector(".architecture-compare");
          var v02Stage = archStageByReleaseId.get(v02Release.id);
          var v02ChangesEl = v02View.querySelector(".architecture-compare-changes");
          var v02Ok = !!v02Compare && v02Compare.querySelectorAll(".architecture-compare-col").length === 2 &&
            v02Compare.textContent.indexOf("Before ·") !== -1 && v02Compare.textContent.indexOf("After ·") !== -1 &&
            (!v02Stage.changesFromPrev || (!!v02ChangesEl && v02ChangesEl.textContent === v02Stage.changesFromPrev));
          assert("Release Detail's Architecture Change section shows Initial Architecture only for V0.1 and a real Before/After comparison for V0.2+",
            v01Ok && v02Ok);

          /* 52 — the Project sub-nav (Option B) marks the correct tab active
             on every one of the 5 project-related views without adding to or
             duplicating the 4-item primary nav. */
          var subnavChecks = [
            ["#/project", "project"],
            ["#/roadmap", "roadmap"],
            ["#/release/v0-1", "roadmap"],
            ["#/map", "map"],
            ["#/architecture", "architecture"],
          ];
          var subnavOk = subnavChecks.every(function(pair) {
            location.hash = pair[0];
            routeRender();
            var subnav = document.getElementById("route-view").querySelector(".project-subnav");
            var active = subnav && subnav.querySelector('[data-subview="' + pair[1] + '"][aria-current="page"]');
            var onlyOneActive = subnav && subnav.querySelectorAll('[aria-current="page"]').length === 1;
            return !!active && onlyOneActive;
          });
          var primaryNavStillFour = document.querySelectorAll(".primary-nav [data-view]").length === 4;
          assert("project sub-nav marks the correct tab active on all 5 project views without growing the 4-item primary nav",
            subnavOk && primaryNavStillFour);

          /* 53 — four releases legitimately carry no build tasks yet. Those
             must state that honestly instead of rendering 0/0 · 0% with an
             empty bar, which reads as "you have completed none of the work"
             rather than "there is no work tracked here yet". Releases that
             do have tasks keep the real count + <progress>. */
          var emptyRelease = (projectData.releases || []).find(function(r) { return (r.buildTaskIds || []).length === 0; });
          var stockedRelease = (projectData.releases || []).find(function(r) { return (r.buildTaskIds || []).length > 0; });
          location.hash = "#/release/" + emptyRelease.id;
          routeRender();
          var emptyReleaseView = document.getElementById("route-view");
          var emptyProgressEl = emptyReleaseView.querySelector(".project-progress");
          var emptyProgressOk = !!emptyProgressEl &&
            !!emptyProgressEl.querySelector(".project-progress-note") &&
            !emptyProgressEl.querySelector(".project-progress-count") &&
            !emptyProgressEl.querySelector("progress") &&
            emptyReleaseView.textContent.indexOf("0/0") === -1;
          location.hash = "#/release/" + stockedRelease.id;
          routeRender();
          var stockedProgressEl = document.getElementById("route-view").querySelector(".project-progress");
          var stockedProgressOk = !!stockedProgressEl &&
            !!stockedProgressEl.querySelector(".project-progress-count") &&
            !!stockedProgressEl.querySelector("progress") &&
            !stockedProgressEl.querySelector(".project-progress-note");
          location.hash = "#/roadmap";
          routeRender();
          var roadmapZeroOfZero = document.getElementById("route-view").textContent.indexOf("0/0") === -1;
          assert("releases with no tracked build task state that honestly instead of showing 0/0 · 0%, while stocked releases keep a real count and bar",
            emptyProgressOk && stockedProgressOk && roadmapZeroOfZero);

          /* 54 — Map and Architecture are Project Track sub-views reachable
             only from the project sub-nav, so the primary nav must keep the
             "Dự án" cue lit rather than leaving every tab dark (same
             reasoning as #41/#42 for release/lesson). */
          var inheritedNavOk = ["#/map", "#/architecture"].every(function(hash) {
            location.hash = hash;
            routeRender();
            var active = document.querySelectorAll('.primary-nav [data-view][aria-current="page"]');
            return active.length === 1 && active[0].getAttribute("data-view") === "project";
          });
          assert("Map and Architecture keep the Dự án primary-nav tab marked active instead of leaving the nav without a cue",
            inheritedNavOk && document.querySelectorAll(".primary-nav [data-view]").length === 4);

          /* 55 — Release Detail must render each release's ASCII diagram
             once, not twice: the Architecture Change comparison below the
             Architecture section already shows the same diagram as its
             After/Initial column. Every diagram <pre> also carries an
             accessible name naming its stage, since a bare <pre> of ASCII
             art is announced without any context. */
          var diagramCheck = ["v0-1", "v0-5"].every(function(id) {
            location.hash = "#/release/" + id;
            routeRender();
            var view = document.getElementById("route-view");
            var stageDiagram = archStageByReleaseId.get(id).diagram;
            var pres = Array.prototype.slice.call(view.querySelectorAll("pre"));
            var sameDiagram = pres.filter(function(p) { return p.textContent === stageDiagram; });
            var allLabelled = pres.every(function(p) {
              return p.getAttribute("role") === "figure" && (p.getAttribute("aria-label") || "").length > 0;
            });
            return sameDiagram.length === 1 && allLabelled;
          });
          assert("Release Detail renders each architecture diagram once and gives every diagram an accessible name",
            diagramCheck);

          /* 56 — the Architecture stage pills are in-page jump links, and
             the hashchange handler skips re-rendering for in-page anchors,
             so the active pill has to be updated on click or the learner
             loses track of which stage they are on. */
          location.hash = "#/architecture";
          routeRender();
          var archNavView = document.getElementById("route-view");
          var stagePills = archNavView.querySelectorAll(".architecture-stage-nav-link");
          var noPillActiveInitially = archNavView.querySelectorAll(".architecture-stage-nav-link[aria-current]").length === 0;
          var targetPill = stagePills[2];
          targetPill.click();
          var activePills = archNavView.querySelectorAll('.architecture-stage-nav-link[aria-current="location"]');
          assert("Architecture stage pills mark exactly the jumped-to stage as the current location",
            stagePills.length === CourseCore.orderArchitectureStages(projectData.releases || [], projectData.architectureStages || []).length &&
            noPillActiveInitially && activePills.length === 1 && activePills[0] === targetPill);

          /* 57 — the Dashboard's two "Next" actions are a symmetric pair:
             both Learn → and Build → must be real navigable links, or the
             build half of the loop is a dead end. */
          location.hash = "#/dashboard";
          routeRender();
          var nextPanel = document.getElementById("route-view").querySelector(".project-next-grid");
          var nextPanelLinks = nextPanel ? Array.prototype.slice.call(nextPanel.querySelectorAll("a[href]")) : [];
          var dashRelease = currentProjectRelease();
          var dashNextTask = CourseCore.selectNextBuildTask(dashRelease, buildTasksById, projectCompletedTaskIds());
          var learnLinkOk = nextPanelLinks.some(function(a) { return /^#\/lesson\//.test(a.getAttribute("href")); });
          var buildLinkOk = nextPanelLinks.some(function(a) {
            return a.getAttribute("href") === "#/release/" + dashRelease.id && a.textContent === dashNextTask.title;
          });
          assert("dashboard Next panel exposes both the next lesson and the next build task as real links",
            !!dashNextTask && learnLinkOk && buildLinkOk);
        } catch (e) {
          results.push({ name: "self-test crashed: " + e.message, ok: false });
        } finally {
          /* Restore learner storage and app state */
          try {
            localStorage.getItem = realGetItem;
            localStorage.setItem = realSetItem;
            localStorage.removeItem = realRemoveItem;
            if (storageBackup != null) realSetItem(STORAGE_KEY, storageBackup);
          } catch (e) {}
          state = loadState() || CourseCore.defaultState();
          applyTheme(state.theme);
          renderSidebar();
          updateProgress();
        }

        var passed = results.filter(function(r) { return r.ok; }).length;
        var status = passed === results.length && results.length >= 15 ? "pass" : "fail";
        var pre = el("pre", null, "PASS " + passed + "/" + results.length);
        pre.id = "self-test-results";
        pre.setAttribute("data-status", status);
        pre.style.cssText = "position:fixed;bottom:.5rem;left:.5rem;z-index:9999;background:#000;color:#0f0;padding:.5rem .75rem;font-size:.75rem;margin:0;border-radius:.25rem;";
        document.body.appendChild(pre);
        if (status === "fail") {
          results.forEach(function(r, i) {
            if (!r.ok) console.error("SELFTEST #" + (i + 1) + " FAILED: " + r.name);
          });
        }
      }

      if (new URLSearchParams(location.search).get("selftest") === "1") {
        setTimeout(runSelfTest, 300);
      }
    })();
  </script>
</body>
</html>
