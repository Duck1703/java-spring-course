<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Khóa học Java 17 và Spring Boot 3.x theo lộ trình thực hành.">
  <title>Java Spring Boot Course</title>
  <style id="app-styles">
    /* ============================================================
       Design tokens — Java & Spring Boot Course · learning platform
       Java orange and Spring green stay the real brand colors of the
       two platforms taught here, tuned for legible text/UI contrast
       rather than decoration. Warm paper neutrals replace clinical
       black/white; every semantic hue gets a mid-tone (icons/borders/
       fills), an "-ink" (text), and a "-soft" tint (chip/badge wash).
       Code blocks stay dark in both themes (the one deliberately
       "terminal" surface, reserved for actual source code).
       ============================================================ */
    :root {
      --java: #c1440e;
      --java-ink: #963309;
      --java-soft: #fbe9dd;
      --spring: #3f7a24;
      --spring-ink: #2f6b1f;
      --spring-soft: #e6f1dd;
      --completion: #78716c;
      --completion-soft: #eeece6;
      --ink: #26231f;
      --muted: #6b6558;
      --canvas: #faf8f4;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-strong: #f2efe7;
      --line: #e6e0d3;
      --line-strong: #d2c9b4;
      --ok: #2e7d32;
      --ok-soft: #e5f3e6;
      --ok-contrast: #ffffff;
      --info: #2c6e9e;
      --info-soft: #e5f0f8;
      --danger: #b3372a;
      --danger-soft: #fbe9e6;
      --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
      --code-head: rgba(20, 27, 35, .06);
      --code-bg: #10151b;
      --code-ink: #e6edf5;
      --focus: #2f6b1f;
      --header-h: 4rem;
      --sidebar-w: 19rem;
      --content-max: 46rem;
      --radius-sm: .375rem;
      --radius-md: .75rem;
      --radius-lg: 1rem;
      --shadow-sm: 0 1px 2px rgb(38 35 32 / .06);
      --shadow-md: 0 8px 24px rgb(38 35 32 / .08);
      --shadow-float: 0 18px 40px rgb(20 24 20 / .16);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --java: #e8935c;
      --java-ink: #f2b083;
      --java-soft: #332217;
      --spring: #74cf4f;
      --spring-ink: #8ede6c;
      --spring-soft: #1c2a17;
      --completion: #a6a099;
      --completion-soft: #24221e;
      --ink: #eeebe4;
      --muted: #a39c8d;
      --canvas: #16140f;
      --surface: #1e1c17;
      --surface-raised: #24221c;
      --surface-strong: #2b2820;
      --line: #383429;
      --line-strong: #4a4433;
      --ok: #6fcf73;
      --ok-soft: #1a2a1b;
      --ok-contrast: #0b1f0d;
      --info: #7db8e8;
      --info-soft: #17222c;
      --danger: #e8776e;
      --danger-soft: #2c1815;
      --code-head: rgba(148, 163, 184, .1);
      --code-bg: #0a0d10;
      --code-ink: #dde6ef;
      --focus: #8ede6c;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .3);
      --shadow-md: 0 8px 24px rgb(0 0 0 / .35);
      --shadow-float: 0 18px 40px rgb(0 0 0 / .5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Inter", system-ui, -apple-system, "Noto Sans", sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      background: var(--canvas);
      color: var(--ink);
    }
    code, pre, kbd {
      font-family: var(--mono);
    }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 200;
      background: var(--surface-raised);
      color: var(--ink);
      padding: .6rem 1rem;
      border-radius: 0 0 var(--radius-sm) 0;
      border: 1px solid var(--line);
    }
    .skip-link:focus { left: 0; }

    /* ============ Header ============ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: var(--header-h);
      padding-inline: 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.375rem;
      height: 2.375rem;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: border-color .12s ease, color .12s ease, background .12s ease;
    }
    .icon-btn svg { width: 1.15rem; height: 1.15rem; }
    .icon-btn:hover { border-color: var(--spring); color: var(--spring-ink); background: var(--spring-soft); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .625rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 1.0625rem;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    /* Brand mark: a rounded two-tone badge (Java orange / Spring green
       diagonal split) standing in for a course "logo" — reads as a
       product mark, not a terminal prompt. */
    .brand-mark {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--java) 0%, var(--java) 45%, var(--spring) 55%, var(--spring) 100%);
      color: #fff;
      font-size: .8125rem;
      font-weight: 800;
      letter-spacing: -.02em;
      box-shadow: var(--shadow-sm);
    }
    .brand-text { color: var(--ink); }
    .header-search { margin-left: auto; position: relative; }
    .header-search label {
      position: absolute;
      left: -9999px;
    }
    .header-search svg {
      position: absolute;
      left: .7rem;
      top: 50%;
      width: 1rem;
      height: 1rem;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .header-search input {
      width: min(17rem, 42vw);
      padding: .5rem .75rem .5rem 2.1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-strong);
      color: var(--ink);
      font: inherit;
      font-size: .875rem;
    }
    .header-search input:focus { background: var(--surface); }
    .header-search input::placeholder { color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    .progress-meter {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-shrink: 0;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress-meter progress {
      -webkit-appearance: none;
      appearance: none;
      width: 6rem;
      height: .4375rem;
      border: none;
      border-radius: 999px;
      overflow: hidden;
      accent-color: var(--spring-ink);
    }
    .progress-meter progress::-webkit-progress-bar { background: var(--surface-strong); border-radius: 999px; }
    .progress-meter progress::-webkit-progress-value { background: var(--spring-ink); border-radius: 999px; }
    .progress-meter progress::-moz-progress-bar { background: var(--spring-ink); border-radius: 999px; }
    .progress-text-short { font-weight: 700; color: var(--spring-ink); min-width: 2.4ch; }

    /* ============ Frame ============ */
    .app-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 120rem;
      margin-inline: auto;
    }

    /* Sidebar / curriculum rail */
    .course-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .sidebar-title {
      padding: 1rem 1rem .75rem;
      font-size: .8125rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      margin-bottom: .5rem;
    }
    #curriculum-nav { padding: .25rem .75rem 2rem; }
    .group-label {
      display: flex;
      align-items: center;
      gap: .4375rem;
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.375rem .375rem .5rem;
    }
    .group-label::before {
      content: '';
      width: .5rem;
      height: .5rem;
      border-radius: 999px;
      background: var(--completion);
      flex-shrink: 0;
    }
    .group-label--java::before { background: var(--java); }
    .group-label--spring::before { background: var(--spring); }
    .module-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      width: 100%;
      padding: .5rem .5rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: .875rem;
      text-align: left;
      cursor: pointer;
    }
    .module-toggle:hover { background: var(--surface-strong); }
    .module-toggle-label { display: flex; align-items: baseline; gap: .5rem; min-width: 0; }
    .module-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.375rem;
      height: 1.375rem;
      padding-inline: .25rem;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 700;
    }
    .module-toggle[data-group="java"] .module-num { background: var(--java-soft); color: var(--java-ink); }
    .module-toggle[data-group="spring"] .module-num { background: var(--spring-soft); color: var(--spring-ink); }
    .module-toggle[data-group="completion"] .module-num { background: var(--completion-soft); color: var(--completion); }
    .module-toggle-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .module-progress { flex-shrink: 0; font-size: .6875rem; font-weight: 700; color: var(--muted); }
    .module-toggle .chevron { flex-shrink: 0; transition: transform .15s ease; color: var(--muted); }
    .module-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .lesson-list { list-style: none; margin: .125rem 0 .5rem; padding: 0; display: grid; gap: .0625rem; }
    .lesson-link {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .4375rem .625rem .4375rem 1.5rem;
      border-radius: var(--radius-sm);
      color: var(--ink);
      text-decoration: none;
      font-size: .8438rem;
      line-height: 1.4;
      border-left: 2px solid transparent;
    }
    .lesson-link:hover { background: var(--surface-strong); }
    .lesson-link[aria-current="page"] {
      background: var(--accent-soft, var(--spring-soft));
      font-weight: 600;
      border-left-color: var(--accent, var(--focus));
    }
    .lesson-state {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.125rem;
      height: 1.125rem;
      line-height: 1;
      border-radius: 999px;
      border: 1.5px solid var(--line-strong);
      color: transparent;
    }
    .lesson-state svg { width: .6875rem; height: .6875rem; }
    .lesson-state[data-done="true"] {
      background: var(--spring-ink);
      border-color: var(--spring-ink);
      color: #fff;
    }
    .lesson-link-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Drawer backdrop */
    .drawer-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgb(6 10 14 / .55);
      z-index: 90;
      border: 0;
      padding: 0;
    }

    main#main-content { outline: none; }
    #route-view { padding-block: 1.5rem 4rem; }
    /* Lesson reading view gets a capped line length; dashboard/resources
       stay full-width so their cards and the curriculum overview can breathe. */
    #route-view.route-view--reading { max-width: var(--content-max); margin-inline: auto; }

    /* ============ Responsive ============ */
    @media (min-width: 64rem) {
      .icon-btn.nav-toggle { display: none; }
      .drawer-backdrop { display: none !important; }
      .app-frame { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
      .course-sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100dvh - var(--header-h));
        overflow-y: auto;
      }
      #route-view { padding-inline: clamp(1.5rem, 4vw, 3rem); }
    }
    @media (max-width: 63.999rem) {
      .course-sidebar {
        position: fixed;
        top: var(--header-h);
        bottom: 0;
        left: 0;
        width: min(20rem, 85vw);
        z-index: 95;
        overflow-y: auto;
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--shadow-float);
      }
      body.drawer-open .course-sidebar { transform: translateX(0); }
      body.drawer-open { overflow: hidden; }
      #route-view { padding-inline: clamp(1rem, 4vw, 2rem); }
    }
    /* Desktop never shows drawer state even if body class lingers */
    @media (min-width: 64rem) {
      body.drawer-open { overflow: auto; }
      body.drawer-open .drawer-backdrop { display: none; }
    }
    @media (max-width: 30rem) {
      .progress-meter .progress-text-long { display: none; }
      .progress-meter .progress-text-short { display: none; }
      .progress-meter progress { width: 4rem; }
      .header-search input { width: 7rem; }
      .brand .brand-name-long { display: none; }
      .curriculum-row { flex-wrap: wrap; row-gap: .25rem; }
      .dash-progress-card { grid-template-columns: 1fr; }
    }

    pre { max-width: 100%; overflow-x: auto; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .app-header, .course-sidebar, .drawer-backdrop, #toast-region { display: none !important; }
      .app-frame { display: block; }
      #route-view { max-width: none; padding: 0; }
      .ref-url { display: inline !important; }
    }

    /* Toast */
    #toast-region {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: var(--canvas);
      padding: .55rem 1rem;
      border-radius: 999px;
      font-size: .8438rem;
      box-shadow: var(--shadow-float);
    }

    /* Lesson body (Site Task 4) */
    .lesson-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: .375rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1.125rem;
    }
    .lesson-breadcrumb a { color: var(--muted); text-decoration: none; }
    .lesson-breadcrumb a:hover { color: var(--accent, var(--spring-ink)); text-decoration: underline; }
    .lesson-breadcrumb .crumb-sep { display: inline-flex; align-items: center; color: var(--line-strong); }
    .lesson-breadcrumb .crumb-sep svg { width: .75rem; height: .75rem; }
    .lesson-breadcrumb .crumb-current { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
    .lesson-kicker {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--accent, var(--spring-ink));
      margin-bottom: .5rem;
    }
    .lesson-header { margin-bottom: 1.75rem; }
    .lesson-title {
      font-size: 2rem;
      line-height: 1.22;
      margin: 0 0 .75rem;
      letter-spacing: -0.015em;
      font-weight: 800;
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .3125rem;
      padding: .25rem .6875rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
    }
    .chip svg { width: .8125rem; height: .8125rem; flex-shrink: 0; }
    .chip--group-java { border-color: transparent; background: var(--java-soft); color: var(--java-ink); }
    .chip--group-spring { border-color: transparent; background: var(--spring-soft); color: var(--spring-ink); }
    .lesson-summary {
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--spring));
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink);
    }
    .lesson-columns { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-bottom: 2rem; }
    @media (min-width: 48rem) { .lesson-columns.twocol { grid-template-columns: 1fr 1fr; } }
    .lesson-column {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 1.125rem 1.25rem;
    }
    .lesson-column h2 {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin: 0 0 .75rem;
    }
    .lesson-column h2 svg { width: 1rem; height: 1rem; color: var(--accent, var(--spring-ink)); flex-shrink: 0; }
    .lesson-column ul { margin: 0; padding: 0; list-style: none; font-size: .9063rem; line-height: 1.6; display: grid; gap: .5rem; }
    .lesson-column li { display: flex; gap: .5rem; align-items: flex-start; }
    .lesson-column li::before {
      content: '';
      flex-shrink: 0;
      margin-top: .5rem;
      width: .375rem;
      height: .375rem;
      border-radius: 999px;
      background: var(--line-strong);
    }
    .lesson-column--outcomes li::before { background: var(--spring); }
    .section-block { margin-bottom: 2.75rem; }
    .section-heading {
      font-size: 1.375rem;
      font-weight: 700;
      margin: 0 0 1.125rem;
      padding-bottom: .625rem;
      border-bottom: 2px solid var(--line);
      letter-spacing: -.005em;
    }
    .prose > p { margin: 0 0 1.125rem; line-height: 1.75; font-size: 1rem; }
    .callout {
      display: flex;
      gap: .75rem;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 1rem 1.125rem;
      border-radius: var(--radius-md);
      margin: 0 0 1.25rem;
      font-size: .9375rem;
      line-height: 1.65;
    }
    .callout-icon { flex-shrink: 0; width: 1.375rem; height: 1.375rem; margin-top: .0625rem; }
    .callout-icon svg { width: 100%; height: 100%; }
    .callout-body { min-width: 0; }
    .callout-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem; margin-bottom: .25rem; }
    .callout-tag { display: none; }
    .callout-label { font-weight: 700; }
    .callout--note { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 35%, var(--line)); }
    .callout--note .callout-icon, .callout--note .callout-label { color: var(--info); }
    .callout--important { background: var(--java-soft); border-color: color-mix(in srgb, var(--java) 35%, var(--line)); }
    .callout--important .callout-icon, .callout--important .callout-label { color: var(--java-ink); }
    .callout--warning { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
    .callout--warning .callout-icon, .callout--warning .callout-label { color: var(--danger); }
    .callout--deliverable { background: var(--spring-soft); border-color: color-mix(in srgb, var(--spring) 35%, var(--line)); }
    .callout--deliverable .callout-icon, .callout--deliverable .callout-label { color: var(--spring-ink); }
    .deliverable-body { white-space: pre-wrap; }
    .code-sample { margin: 0 0 1.25rem; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
    .code-sample figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      padding: .5625rem .875rem;
      background: var(--code-head, rgba(127,127,127,.08));
      border-bottom: 1px solid var(--line);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .code-sample figcaption > span:first-child { font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; }
    .code-sample pre {
      margin: 0;
      padding: 1rem 1.125rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      font-size: .8438rem;
      line-height: 1.6;
      tab-size: 2;
    }
    .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: .3125rem;

    /* Dashboard settings (Site Task 5) */
    .settings-block { margin-top: 2.75rem; border-top: 1px solid var(--line); padding-top: 1.25rem; }

    .dash-progress-card {

    .btn {

    .btn--primary:hover { filter: brightness(1.1); }

    /* Curriculum overview — plain-language unit list replacing any

  </style>
  <script>
    /* Theme bootstrap: runs before first paint to avoid a light/dark flash. */
    (function() {
      try {
        var raw = localStorage.getItem("java-spring-course");
        var theme = raw ? (JSON.parse(raw).theme || "system") : "system";
        var resolved = theme === "dark" ? "dark"
          : theme === "light" ? "light"
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme",
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung</a>
  <div id="app" aria-live="off"></div>
  <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="course-data" type="application/json">{}</script>
  <script id="app-script">
    /* ============================================================
*/ /* COURSE_CORE_START */ /*
       pure logic, no DOM access.
       Tested by tests/site_core.test.js in node:vm.
       ============================================================ */
    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      return { view: "dashboard" };
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    const STATE_VERSION = 1;

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      escapeHtml, safeExternalUrl,
    });
    /* COURSE_CORE_END */

    /* ============================================================
       App bootstrap: data parse, indices, shell rendering, routing,
       curriculum navigation, dashboard, search panel (Site Task 3).
       ============================================================ */
    (function () {
      /* ---- data parse ------------------------------------------------ */
      let courseData;
      try {
        courseData = JSON.parse(document.getElementById("course-data").textContent);
      } catch(e) {
        document.getElementById("app").innerHTML = '<pre style="padding:2rem;color:red;">Loi tai du lieu khoa hoc.</pre>';
        throw e;
      }
      const lessonsById = new Map(courseData.lessons.map(function(l){return [l.id,l];}));
      const unitsById = new Map(courseData.units.map(function(u){return [u.id,u];}));

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {
        (l.practices || []).forEach(function(p) { acc.push(p.id); });
        return acc;
      }, []));
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? CourseCore.sanitizeState(JSON.parse(raw), LESSON_IDS, UNIT_IDS, PRACTICE_IDS) : null;
        } catch(e) { return null; }
      }
      function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
      var loaded = loadState();
      if (loaded) state = loaded;

      /* ---- render helpers -------------------------------------------- */
      function updateProgress() {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var bar = document.getElementById('progress-bar');
        if (bar) { bar.value = String(p.completed); bar.setAttribute('max', String(p.total || 1)); }
        var short = document.querySelector('.progress-text-short');
        if (short) short.textContent = p.percent + '%';
        var txt = document.querySelector('.progress-text-long');
        if (txt) txt.textContent = p.completed + '/' + p.total + ' bài';
      }
      function setAriaCurrent(id) {
        document.querySelectorAll('.lesson-link[aria-current]').forEach(function(a){a.removeAttribute('aria-current');});
        var link = document.querySelector('.lesson-link[data-lesson-id="' + id + '"]');
        if (link) link.setAttribute('aria-current', 'page');
      }

      /* ---- curriculum nav ------------------------------------------- */
      function renderSidebar() {
        var nav = document.getElementById('curriculum-nav');
        if (!nav) return;
        nav.textContent = '';
        var GROUP_ORDER = ['java', 'spring', 'completion'];
        var ACCENT = {java:'var(--java)',spring:'var(--spring)',completion:'var(--completion)'};
        var ACCENT_SOFT = {java:'var(--java-soft)',spring:'var(--spring-soft)',completion:'var(--completion-soft)'};
        GROUP_ORDER.forEach(function(groupKey) {
          var units = courseData.units.filter(function(u){return u.group===groupKey;});
          if (!units.length) return;
          var label = document.createElement('div');
          label.className = 'group-label' + (groupKey === 'completion' ? '' : ' group-label--' + groupKey);
          label.textContent = GROUP_LABELS[groupKey] || groupKey;
          nav.appendChild(label);
          units.forEach(function(unit) {
            var lessonIds = unit.lessonIds || [];
            var doneCount = lessonIds.filter(function(lid){ return state.completed.indexOf(lid)!==-1; }).length;
            var collapsed = state.collapsedUnits.indexOf(unit.id) !== -1;
            var toggle = document.createElement('button');
            toggle.className = 'module-toggle';
            toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            toggle.setAttribute('aria-controls', 'lessons-' + unit.id);
            toggle.setAttribute('data-unit-id', unit.id);
            toggle.setAttribute('data-group', groupKey);
            toggle.title = unit.number + '. ' + unit.title;
            toggle.innerHTML = '<span class="module-toggle-label"><span class="module-num">' + unit.number + '</span>' +
              '<span class="module-toggle-title">' + unit.title + '</span></span>' +
              '<span class="module-progress">' + doneCount + '/' + lessonIds.length + '</span>' +
              '<span class="chevron" aria-hidden="true">' + icon('chevron-down') + '</span>';
            toggle.onclick = function() {
              var expanded = toggle.getAttribute('aria-expanded')==='true';
              toggle.setAttribute('aria-expanded', expanded?'false':'true');
              var list = document.getElementById('lessons-' + unit.id);
              if (list) list.hidden = expanded;
              if (expanded) { if (state.collapsedUnits.indexOf(unit.id)===-1) state.collapsedUnits.push(unit.id); }
              else { state.collapsedUnits = state.collapsedUnits.filter(function(x){return x!==unit.id;}); }
              saveState();
            };
            nav.appendChild(toggle);
            var list = document.createElement('ul');
            list.className = 'lesson-list';
            list.id = 'lessons-' + unit.id;
            list.setAttribute('role', 'list');
            list.hidden = collapsed;
            lessonIds.forEach(function(lid) {
              var lesson = lessonsById.get(lid);
              if (!lesson) return;
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.className = 'lesson-link';
              a.href = '#lesson/' + lid;
              a.setAttribute('data-lesson-id', lid);
              a.title = lesson.title || lid;
              a.style.setProperty('--accent', ACCENT[lesson.group] || ACCENT.completion);
              a.style.setProperty('--accent-soft', ACCENT_SOFT[lesson.group] || ACCENT_SOFT.completion);
              var done = state.completed.indexOf(lid) !== -1;
              a.innerHTML = '<span class="lesson-state" data-done="' + done + '">' + (done ? icon('check') : '') + '</span>' +
                '<span class="lesson-link-title">' + (done ? '<span class="visually-hidden">Đã hoàn thành: </span>' : '') + (lesson.title || lid) + '</span>';
              a.onclick = function() { closeDrawer(); };
              li.appendChild(a);
              list.appendChild(li);
            });
            nav.appendChild(list);
          });
        });
        setAriaCurrent(state.lastLessonId);
      }

      /* ---- route render ---------------------------------------------- */
      function routeRender() {
        var route = CourseCore.parseRoute(window.location.hash);
        var view = document.getElementById('route-view');
        if (!view) return;
        view.textContent = '';
        view.classList.toggle('route-view--reading', route.view === 'lesson');
        if (route.view === 'lesson') renderLessonView(view, route.lessonId);
        else if (route.view === 'resources') renderResourcesView(view);
        else renderDashboard(view);
        setAriaCurrent(route.lessonId || state.lastLessonId);
      }
      window.addEventListener('hashchange', function() {
        /* In-page anchors (citation links like #ref-day01-2) target
           elements that already exist in the current view — let the
           browser perform its native anchor scroll and skip re-render. */
        var anchorId = window.location.hash.replace(/^#/, '');
        if (anchorId && document.getElementById(anchorId)) return;
        routeRender();
        /* Hash-only SPA navigation never triggers the browser's native
           scroll-to-top, so moving between lessons (sidebar, Bài trước/
           Bài sau) used to keep the previous scroll position. Jump
           instantly — the smooth scroll-behavior on <html> would animate
           through the freshly rendered content. */
        var htmlEl = document.documentElement;
        var prevBehavior = htmlEl.style.scrollBehavior;
        htmlEl.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        htmlEl.style.scrollBehavior = prevBehavior;
      });

      /* ---- dashboard ------------------------------------------------- */
      function renderDashboard(container) {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var jp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'java');
        var sp = CourseCore.calculateProgress(courseData.lessons, state.completed, 'spring');

        var hero = el('div', 'dash-hero');
        var eyebrow = el('div', 'dash-eyebrow');
        eyebrow.innerHTML = icon('book-open') + '<span>Lộ trình học</span>';
        hero.appendChild(eyebrow);
        hero.appendChild(el('h1', 'dash-title', 'Java & Spring Boot'));
        hero.appendChild(el('p', 'dash-desc',
          'Hành trình từ nền tảng ngôn ngữ Java đến xây dựng dịch vụ web với Spring Boot — theo từng bài học có thứ tự, kèm bài tập thực hành và tài liệu tham khảo.'));
        container.appendChild(hero);

        /* Overall progress + per-track (Java / Spring Boot) split */
        var progressCard = el('div', 'dash-progress-card');
        var overallCol = el('div');
        var headline = el('div', 'dash-progress-headline');
        headline.appendChild(el('span', 'dash-progress-percent', p.percent + '%'));
        headline.appendChild(el('span', 'dash-progress-count', p.completed + '/' + p.total + ' bài đã hoàn thành'));
        overallCol.appendChild(headline);
        var overallTrack = el('div', 'dash-progress-track');
        var overallFill = el('div', 'dash-progress-fill');
        overallFill.style.width = p.percent + '%';
        overallTrack.appendChild(overallFill);
        overallCol.appendChild(overallTrack);
        progressCard.appendChild(overallCol);

        var splitCol = el('div', 'dash-progress-split');
        [['java', 'Java', jp], ['spring', 'Spring Boot', sp]].forEach(function(entry) {
          var row = el('div', 'dash-progress-row dash-progress-row--' + entry[0]);
          row.appendChild(el('span', 'dash-progress-row-label', entry[1]));
          var rowTrack = el('div', 'dash-progress-track');
          var rowFill = el('div', 'dash-progress-fill');
          rowFill.style.width = entry[2].percent + '%';
          rowTrack.appendChild(rowFill);
          row.appendChild(rowTrack);
          row.appendChild(el('span', 'dash-progress-row-count', entry[2].completed + '/' + entry[2].total));
          splitCol.appendChild(row);
        });
        progressCard.appendChild(splitCol);
        container.appendChild(progressCard);

        /* Continue learning */
        var unfinished = courseData.lessons.find(function(l){return state.completed.indexOf(l.id)===-1;});
        var target = (state.lastLessonId && lessonsById.has(state.lastLessonId) && state.completed.indexOf(state.lastLessonId)===-1) ? state.lastLessonId : (unfinished ? unfinished.id : 'day-01');
        var targetLesson = lessonsById.get(target);
        var continueCard = el('div', 'dash-continue-card');
        var continueInfo = el('div');
        var continueEyebrow = el('div', 'dash-continue-eyebrow');
        continueEyebrow.innerHTML = icon('flag') + '<span>' + (state.completed.length > 0 ? 'Tiếp tục học' : 'Bắt đầu học') + '</span>';
        continueInfo.appendChild(continueEyebrow);
        continueInfo.appendChild(el('p', 'dash-continue-title', targetLesson ? (targetLesson.title || target) : target));
        var continueMeta = el('div', 'dash-continue-meta');
        if (targetLesson && targetLesson.unitTitle) continueMeta.appendChild(el('span', 'chip', targetLesson.unitNumber + '. ' + targetLesson.unitTitle));
        if (targetLesson && targetLesson.durationMinutes) continueMeta.appendChild(el('span', 'chip', '~' + targetLesson.durationMinutes + ' phút'));
        continueInfo.appendChild(continueMeta);
        continueCard.appendChild(continueInfo);
        var continueBtn = el('a', 'btn btn--primary');
        continueBtn.href = '#lesson/' + target;
        continueBtn.innerHTML = icon('play') + '<span>' + (state.completed.length > 0 ? 'Học tiếp' : 'Bắt đầu học') + '</span>';
        continueCard.appendChild(continueBtn);
        container.appendChild(continueCard);

        /* Curriculum overview — plain-language unit list, each row carrying
           its own real completion state (no build-log framing). */
        var overview = el('div', 'curriculum-overview');
        var head = el('div', 'curriculum-overview-head');
        head.appendChild(el('h2', null, 'Nội dung khóa học'));
        head.appendChild(el('span', 'curriculum-overview-hint', courseData.units.length + ' đơn vị học tập'));
        overview.appendChild(head);
        var list = el('div', 'curriculum-list');
        courseData.units.forEach(function(u) {
          var lessonIds = u.lessonIds || [];
          var doneCount = lessonIds.filter(function(lid){ return state.completed.indexOf(lid)!==-1; }).length;
          var isDone = lessonIds.length > 0 && doneCount === lessonIds.length;
          var isActive = !isDone && doneCount > 0;
          var row = el('a', 'curriculum-row' + (isDone ? ' curriculum-row--done' : isActive ? ' curriculum-row--active' : ''));
          row.href = '#lesson/' + (lessonIds[0] || '');
          var status = el('span', 'curriculum-status');
          status.innerHTML = isDone ? icon('check') : String(u.number);
          row.appendChild(status);
          row.appendChild(el('span', 'curriculum-name', u.number + '. ' + u.title));
          row.appendChild(el('span', 'curriculum-meta', doneCount + '/' + lessonIds.length + ' bài'));
          row.appendChild(el('span', 'curriculum-tag', isDone ? 'Hoàn thành' : (isActive ? 'Đang học' : 'Chưa bắt đầu')));
          list.appendChild(row);
        });
        overview.appendChild(list);
        container.appendChild(overview);

        renderSettingsBlock(container);
      }

      /* ---- settings: export / import / reset (Site Task 5) -------------- */
      var APP_SCHEMA = { app: "java-spring-course", schemaVersion: 1 };

      function downloadProgress() {
        var payload = {
          app: APP_SCHEMA.app,
          schemaVersion: APP_SCHEMA.schemaVersion,
          exportedAt: new Date().toISOString(),
          state: state,
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = el("a");
        a.href = url;
        a.download = "java-spring-course-tien-do.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        showToast("Đã tải tệp tiến độ");
      }

      function importProgressText(text, previewEl, confirmBtn) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không phải JSON hợp lệ.";
          return;
        }
        if (!parsed || parsed.app !== APP_SCHEMA.app || parsed.schemaVersion !== APP_SCHEMA.schemaVersion) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không đúng định dạng tiến độ của khóa học (app/schemaVersion không khớp).";
          return;
        }
        var cleaned = CourseCore.sanitizeState(parsed.state, LESSON_IDS, UNIT_IDS, PRACTICE_IDS);
        previewEl.hidden = false;
        previewEl.textContent = "Sẵn sàng nhập: " + cleaned.completed.length + "/" + courseData.lessons.length +
          " bài đã hoàn thành. Nhấn “Xác nhận nhập” để thay thế tiến độ hiện tại.";
        confirmBtn.hidden = false;
        confirmBtn.onclick = function() {
          state = cleaned;
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          previewEl.textContent = "Đã nhập tiến độ thành công.";
          confirmBtn.hidden = true;
          showToast("Tiến độ đã được nhập");
        };
      }

      function renderSettingsBlock(container) {
        var block = el("div", "settings-block");
        var details = el("details");
        details.appendChild(el("summary", null, "Cài đặt dữ liệu học tập"));
        var actions = el("div", "settings-actions");

        var exportBtn = el("button", "settings-btn");
        exportBtn.innerHTML = icon("download") + '<span>Tải tiến độ (.json)</span>';
        exportBtn.type = "button";
        exportBtn.setAttribute("data-action", "export-progress");
        exportBtn.addEventListener("click", downloadProgress);
        actions.appendChild(exportBtn);

        var importLabel = el("label", "settings-btn");
        importLabel.innerHTML = icon("upload") + '<span>Nhập tiến độ (.json)</span>';
        var fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".json,application/json";
        fileInput.style.display = "none";
        importLabel.appendChild(fileInput);
        actions.appendChild(importLabel);

        var resetBtn = el("button", "settings-btn settings-btn--danger");
        resetBtn.innerHTML = icon("refresh-cw") + '<span>Đặt lại tiến độ</span>';
        resetBtn.type = "button";
        resetBtn.setAttribute("data-action", "reset-progress");
        actions.appendChild(resetBtn);

        var preview = el("div", "import-preview");
        preview.hidden = true;
        var confirmBtn = el("button", "settings-btn");
        confirmBtn.innerHTML = icon("check") + '<span>Xác nhận nhập</span>';
        confirmBtn.type = "button";
        confirmBtn.hidden = true;

        fileInput.addEventListener("change", function() {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { importProgressText(String(reader.result), preview, confirmBtn); };
          reader.onerror = function() {
            preview.hidden = false;
            preview.textContent = "Không đọc được tệp đã chọn.";
          };
          reader.readAsText(file);
          fileInput.value = "";
        });

        resetBtn.addEventListener("click", function() {
          if (!window.confirm("Đặt lại toàn bộ tiến độ? Hành động này xóa trạng thái hoàn thành, bài đang học và cài đặt giao diện đã lưu trên máy bạn.")) return;
          state = CourseCore.defaultState();
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          showToast("Đã đặt lại tiến độ");
        });

        details.appendChild(actions);
        details.appendChild(preview);
        details.appendChild(confirmBtn);
        block.appendChild(details);
        container.appendChild(block);
      }

      /* ---- lesson renderer (Site Task 4) ------------------------------ */
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

         innerHTML assembly or a wrapper element's innerHTML. No <defs>/
         <symbol>/id attributes are used anywhere, by design — every icon is

        check: '<polyline points="5 13 10 18 19 7"/>',
        "chevron-left": '<polyline points="15 6 9 12 15 18"/>',
        "chevron-right": '<polyline points="9 6 15 12 9 18"/>',
        "chevron-down": '<polyline points="6 9 12 15 18 9"/>',
        "arrow-left": '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/>',
        "arrow-right": '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>',

        "alert-triangle": '<path d="M12 4 2.5 20h19L12 4z"/><line x1="12" y1="10" x2="12" y2="15"/><circle cx="12" cy="18" r=".75" fill="currentColor" stroke="none"/>',

        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".75" fill="currentColor" stroke="none"/>',
        "book-open": '<path d="M12 6.5c-1.8-1.3-4.2-2-6.5-2A2 2 0 0 0 3.5 6.5v11c2.3 0 4.7.7 6.5 2 1.8-1.3 4.2-2 6.5-2 1 0 1.9.1 2.5.3V6.5A2 2 0 0 0 18.5 4.5c-2.3 0-4.7.7-6.5 2z"/><line x1="12" y1="6.5" x2="12" y2="19.5"/>',
        "alert-circle": '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r=".75" fill="currentColor" stroke="none"/>',
        download: '<path d="M12 4v10m0 0 3.5-3.5M12 14l-3.5-3.5"/><path d="M4.5 15.5V18A1.5 1.5 0 0 0 6 19.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"/>',
        upload: '<path d="M12 20V10m0 0 3.5 3.5M12 10l-3.5 3.5"/><path d="M4.5 15.5V18A1.5 1.5 0 0 0 6 19.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"/>',
        "refresh-cw": '<path d="M20 11A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 13a8 8 0 0 0 13.7 4.7L20 15.5"/><path d="M20 20v-4.5h-4.5"/>',
        lightbulb: '<circle cx="12" cy="9" r="5"/><line x1="9.5" y1="18" x2="14.5" y2="18"/><line x1="10" y1="21" x2="14" y2="21"/><line x1="12" y1="14" x2="12" y2="18"/>'
      };
      var ICON_FILLED = { play: true };
      function icon(name, extraClass) {
        var body = ICONS[name];
        if (!body) return "";
        var filled = !!ICON_FILLED[name];
        var cls = "icon icon-" + name + (extraClass ? " " + extraClass : "");
        return '<svg class="' + cls + '" viewBox="0 0 24 24" width="1em" height="1em" ' +
          'fill="' + (filled ? "currentColor" : "none") + '" stroke="' + (filled ? "none" : "currentColor") + '" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
          body + '</svg>';
      }

      var GROUP_LABELS = { java: "Java", spring: "Spring Boot", completion: "Hoàn thành" };
      var PRACTICE_KIND_LABELS = {
        "concept": "Khái niệm",
        "predict-output": "Dự đoán kết quả",
        "coding": "Luyện code",
        "applied": "Vận dụng"
      };
      var CALLOUT_CLASS = { note: "callout--note", important: "callout--important", warning: "callout--warning", deliverable: "callout--deliverable" };
      var CALLOUT_LABEL = { note: "Ghi chú: ", important: "Quan trọng: ", warning: "Lưu ý: ", deliverable: "Đề bài: " };
      var CALLOUT_ICON = { note: "info", important: "alert-triangle", warning: "alert-circle", deliverable: "flag" };
      var ALLOWED_BLOCK_TYPES = ["paragraph", "note", "important", "warning", "code", "table", "deliverable"];
      var currentLessonId = null;

      function lessonIdSlug(id) {
        return String(id).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      /* Citations -> numbered superscript links pointing at the reference cards. */
      function appendCitations(parent, citations, refIndexById) {
        if (!citations || !citations.length) return;
        citations.forEach(function(cid, i) {
          var key = String(cid).toLowerCase();
          var idx = refIndexById.get(key);
          var a = el("a", "citation-link", "[" + (idx != null ? idx : "?") + "]");
          a.href = "#ref-" + lessonIdSlug(currentLessonId) + "-" + (idx != null ? idx : key);
          a.setAttribute("aria-label", "Nguồn tham chiếu " + (idx != null ? idx : cid));
          parent.appendChild(a);
          if (i < citations.length - 1) parent.appendChild(document.createTextNode(" "));
        });
      }

      function proseParagraph(text, citations, refIndexById) {
        var p = el("p");
        p.appendChild(document.createTextNode(text == null ? "" : String(text)));
        appendCitations(p, citations, refIndexById);
        return p;
      }

      function renderBlock(container, block, refIndexById) {
        var type = block.type;
        if (ALLOWED_BLOCK_TYPES.indexOf(type) === -1) {
          container.appendChild(el("div", "authoring-warning",
            "[Cảnh báo biên soạn] Khối nội dung không hỗ trợ: \"" + type + "\" — đã ẩn để tránh hiển thị sai."));
          return;
        }
        if (type === "code") {
          var fig = el("figure", "code-sample");
          var cap = el("figcaption");
          cap.appendChild(el("span", null, block.language ? block.language.toUpperCase() + (block.compile === false && block.partialReason ? " — không biên dịch độc lập" : "") : ""));
          var copyBtn = el("button", "copy-btn");
          copyBtn.innerHTML = icon("copy") + '<span>Sao chép mã</span>';
          copyBtn.type = "button";
          copyBtn.setAttribute("data-action", "copy-code");
          copyBtn.setAttribute("aria-label", "Sao chép mã mẫu vào clipboard");
          copyBtn.addEventListener("click", function() {
            copyText(block.code || "").then(function() { showToast("Đã sao chép mã"); },
              function() { showToast("Không thể sao chép tự động — hãy chọn mã và sao chép thủ công."); });
          });
          cap.appendChild(copyBtn);
          fig.appendChild(cap);
          var pre = el("pre");
          pre.appendChild(el("code", null, block.code || ""));
          fig.appendChild(pre);
          container.appendChild(fig);
          return;
        }
        if (type === "table") {
          var wrap = el("div", "data-table-wrap");
          var table = el("table", "data-table");
          var cols = block.columns || [];
          table.appendChild(el("caption", null, cols.join(" · ")));
          var thead = el("thead");
          var hr = el("tr");
          cols.forEach(function(c) { hr.appendChild(el("th", null, c)); });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tbody = el("tbody");
          (block.rows || []).forEach(function(row) {
            var tr = el("tr");
            row.forEach(function(cell, ci) {
              var td = el(ci < cols.length - 1 ? "td" : "td");
              td.appendChild(document.createTextNode(cell == null ? "" : String(cell)));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          return;
        }
        if (type === "note" || type === "important" || type === "warning" || type === "deliverable") {
          var aside = el("aside", "callout " + (CALLOUT_CLASS[type] || ""));
          aside.setAttribute("role", type === "warning" ? "alert" : "note");
          var calloutIcon = el("span", "callout-icon");
          calloutIcon.setAttribute("aria-hidden", "true");
          calloutIcon.innerHTML = icon(CALLOUT_ICON[type] || "info");
          aside.appendChild(calloutIcon);
          var calloutBody = el("div", "callout-body");
          var head = el("div", "callout-head");
          head.appendChild(el("strong", "callout-label", CALLOUT_LABEL[type] || ""));
          calloutBody.appendChild(head);
          /* Deliverable text is often an authored multi-line bullet list — preserve line breaks. */
          if (type === "deliverable") {
            var body = el("span", "deliverable-body");
            body.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
            calloutBody.appendChild(body);
          } else {
            calloutBody.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
          }
          appendCitations(calloutBody, block.citations, refIndexById);
          aside.appendChild(calloutBody);
          container.appendChild(aside);
          return;
        }
        /* paragraph */
        container.appendChild(proseParagraph(block.text, block.citations, refIndexById));
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function() { return "clipboard"; });
        }
        return new Promise(function(resolve, reject) {
          var area = Object.assign(document.createElement("textarea"), { value: text });
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          area.remove();
          if (!ok) reject(new Error("copy unavailable")); else resolve("fallback");
        });
      }

      function showToast(message) {
        var region = document.getElementById("toast-region");
        if (!region) return;
        var t = el("div", "toast", message);
        region.appendChild(t);
        setTimeout(function() { t.remove(); }, 2600);
      }

      function renderLessonHeader(container, lesson, refIndexById) {
        var crumb = el("nav", "lesson-breadcrumb");
        crumb.setAttribute("aria-label", "Đường dẫn bài học");
        var g = el("a", null, GROUP_LABELS[lesson.group] || lesson.group);
        g.href = "#dashboard";
        crumb.appendChild(g);
        var sep1 = el("span", "crumb-sep");
        sep1.setAttribute("aria-hidden", "true");
        sep1.innerHTML = icon("chevron-right");
        crumb.appendChild(sep1);
        var unit = courseData.units.find(function(x){ return x.id === lesson.unitId; });
        var u = el("a", null, "Unit " + lesson.unitNumber + ": " + (lesson.unitTitle || ""));
        if (unit && unit.lessonIds && unit.lessonIds.length) u.href = "#lesson/" + unit.lessonIds[0];
        crumb.appendChild(u);
        var sep2 = el("span", "crumb-sep");
        sep2.setAttribute("aria-hidden", "true");
        sep2.innerHTML = icon("chevron-right");
        crumb.appendChild(sep2);
        crumb.appendChild(el("span", "crumb-current", lesson.title));
        container.appendChild(crumb);

        var header = el("header", "lesson-header");
        var kicker = el("div", "lesson-kicker");
        kicker.innerHTML = icon("flag") + '<span>' + (GROUP_LABELS[lesson.group] || lesson.group) + '</span>';
        header.appendChild(kicker);
        header.appendChild(el("h1", "lesson-title", lesson.title));
        var meta = el("div", "lesson-meta");
        if (lesson.durationMinutes) meta.appendChild(el("span", "chip", "~" + lesson.durationMinutes + " phút"));
        header.appendChild(meta);
        if (lesson.summary) {
          var s = el("div", "lesson-summary");
          s.setAttribute("role", "note");
          s.textContent = lesson.summary;
          header.appendChild(s);
        }
        container.appendChild(header);

        /* Prerequisites / outcomes columns */
        var hasCols = (lesson.prerequisites && lesson.prerequisites.length) ||
                      (lesson.outcomes && lesson.outcomes.length);
        if (hasCols) {
          var cols = el("div", "lesson-columns" + ((lesson.prerequisites && lesson.prerequisites.length) ? " twocol" : ""));
          if (lesson.prerequisites && lesson.prerequisites.length) {
            var c0 = el("div", "lesson-column");
            var headingPrereq = el("h2");
            headingPrereq.innerHTML = icon("book-open") + '<span>Yêu cầu trước khi học</span>';
            c0.appendChild(headingPrereq);
            var ul0 = el("ul");
            lesson.prerequisites.forEach(function(item) { ul0.appendChild(el("li", null, item)); });
            c0.appendChild(ul0);
            cols.appendChild(c0);
          }
          if (lesson.outcomes && lesson.outcomes.length) {
            var c1 = el("div", "lesson-column lesson-column--outcomes");
            var headingOutcomes = el("h2");
            headingOutcomes.innerHTML = icon("target") + '<span>Sau bài này bạn sẽ</span>';
            c1.appendChild(headingOutcomes);
            var ul1 = el("ul");
            lesson.outcomes.forEach(function(item) { ul1.appendChild(el("li", null, item)); });
            c1.appendChild(ul1);
            cols.appendChild(c1);
          }
          container.appendChild(cols);
        }
      }

      function renderSections(container, lesson, refIndexById) {
        (lesson.sections || []).forEach(function(section) {
          var sec = el("section", "section-block");
          if (section.id) sec.id = section.id;
          sec.appendChild(el("h2", "section-heading", section.title || ""));
          (section.blocks || []).forEach(function(block) { renderBlock(sec, block, refIndexById); });
          container.appendChild(sec);
        });
      }


      /* ---- practice cards --------------------------------------------- */
      function disclosureButton(label, panelId, iconName) {
        var b = el("button", "disclosure-btn");
        b.innerHTML = (iconName ? icon(iconName) : "") + "<span>" + label + "</span>";
        b.type = "button";
        b.setAttribute("aria-expanded", "false");
        b.setAttribute("aria-controls", panelId);
        return b;
      }

      function wireDisclosure(btn, panel) {
        btn.addEventListener("click", function() {
          var open = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", open ? "false" : "true");
          panel.hidden = open;
        });
      }

      function renderPractice(container, practice) {
        var card = el("article", "practice-card");
        card.id = "practice-" + practice.id;
        var head = el("div", "practice-head");
        var kindLabel = PRACTICE_KIND_LABELS[practice.type] || practice.type;
        if (practice.interaction === "multiple-choice") kindLabel += " · trắc nghiệm";
        head.appendChild(el("div", "practice-kind", kindLabel));
        head.appendChild(el("p", "practice-prompt", practice.prompt || ""));
        card.appendChild(head);

        var body = el("div", "practice-body");
        if (practice.starterCode) {
          var starter = el("div", "practice-starter");
          var pre = el("pre");
          pre.appendChild(el("code", null, practice.starterCode));
          starter.appendChild(pre);
          body.appendChild(starter);
        }

        var mc = practice.interaction === "multiple-choice";

        if (mc && practice.choices && practice.choices.length) {
          var isMulti = (practice.correctChoiceIds || []).length > 1;
          var fieldset = el("fieldset");
          fieldset.style.cssText = "margin:0 0 .625rem;padding:0;border:none;";
          var legend = el("legend", "visually-hidden", isMulti ? "Chọn nhiều đáp án" : "Chọn một đáp án");
          fieldset.appendChild(legend);
          var list = el("ul", "choice-list");
          practice.choices.forEach(function(choice) {
            var li = el("li", "choice-item");
            li.setAttribute("data-choice-id", choice.id);
            var input = document.createElement("input");
            input.type = isMulti ? "checkbox" : "radio";
            input.name = "choice-" + practice.id;
            input.value = choice.id;
            input.id = choice.id;
            var label = el("label");
            label.htmlFor = choice.id;
            label.appendChild(input);
            label.appendChild(el("span", null, choice.text));
            li.appendChild(label);
            list.appendChild(li);
          });
          fieldset.appendChild(list);
          body.appendChild(fieldset);

          var checkBtn = el("button", "disclosure-btn");
          checkBtn.innerHTML = icon("check") + "<span>Kiểm tra đáp án</span>";
          checkBtn.type = "button";
          checkBtn.setAttribute("data-action", "check-practice");
          checkBtn.setAttribute("data-practice-id", practice.id);
          body.appendChild(checkBtn);

          var fb = el("div", "check-feedback");
          fb.id = "feedback-" + practice.id;
          fb.hidden = true;
          body.appendChild(fb);

          checkBtn.addEventListener("click", function() {
            var picked = Array.prototype.slice.call(
              body.querySelectorAll('input[name="choice-' + practice.id + '"]:checked')
            ).map(function(inp) { return inp.value; });
            if (!picked.length) { showToast("Hãy chọn ít nhất một đáp án trước khi kiểm tra."); return; }
            var correct = new Set(practice.correctChoiceIds || []);
            var allCorrect = picked.length === correct.size && picked.every(function(id){ return correct.has(id); });
            /* mark per-choice correctness */
            body.querySelectorAll(".choice-item").forEach(function(li) {
              var cid = li.getAttribute("data-choice-id");
              li.classList.remove("is-correct", "is-wrong");
              if (correct.has(cid)) li.classList.add("is-correct");
              else if (picked.indexOf(cid) !== -1) li.classList.add("is-wrong");
            });
            fb.className = "check-feedback " + (allCorrect ? "ok" : "wrong");
            fb.textContent = (allCorrect ? "Chính xác! " : "Chưa đúng. ") + (practice.explanation || "");
            fb.hidden = false;
            /* persist attempted state */
            state.practice[practice.id] = { attempted: true };
            saveState();
          });
        }

        var actions = el("div", "practice-actions");
        if (practice.hint) {
          var hintPanelId = "hint-" + practice.id;
          var hintBtn = disclosureButton("Gợi ý", hintPanelId, "lightbulb");
          var hintPanel = el("div", "disclosure-panel");
          hintPanel.id = hintPanelId;
          hintPanel.hidden = true;
          hintPanel.textContent = practice.hint;
          actions.appendChild(hintBtn);
          body.appendChild(hintPanel);
          wireDisclosure(hintBtn, hintPanel);
        }
        if (practice.solution || (mc && practice.explanation)) {
          var solPanelId = "sol-" + practice.id;
          var solBtn = disclosureButton(mc ? "Xem giải thích" : "Xem lời giải", solPanelId, "book-open");
          var solPanel = el("div", "disclosure-panel");
          solPanel.id = solPanelId;
          solPanel.hidden = true;
          var solutionText = mc
            ? ((practice.correctChoiceIds || []).join(", ") + (practice.explanation ? " — " + practice.explanation : ""))
            : [practice.solution, practice.explanation].filter(Boolean).join("\n\n");
          solPanel.textContent = solutionText;
          actions.appendChild(solBtn);
          body.appendChild(solPanel);
          wireDisclosure(solBtn, solPanel);
        }
        if (actions.childNodes.length) { body.appendChild(actions); }
        card.appendChild(body);
        container.appendChild(card);
      }

      function renderPractices(container, lesson) {
        if (!lesson.practices || !lesson.practices.length) return;
        var blockEl = el("section", "section-block");
        blockEl.appendChild(el("h2", "section-heading", "Luyện tập"));
        lesson.practices.forEach(function(p) { renderPractice(blockEl, p); });
        container.appendChild(blockEl);
      }


      /* ---- assignments (syllabus original vs enrichment) --------------- */
      function renderAssignments(container, lesson) {
        var syllabus = lesson.syllabusAssignments || [];
        var enhanced = lesson.enhancedExercises || [];
        if (!syllabus.length && !enhanced.length) return;
        var blockEl = el("section", "assignments-block");
        if (syllabus.length) {
          blockEl.appendChild(el("h2", null, "Bài tập trong syllabus"));
          syllabus.forEach(function(a) {
            var item = el("div", "assignment-item");
            item.appendChild(el("span", "assignment-origin", "Nội dung gốc · dòng " + a.row));
            item.appendChild(document.createTextNode("\n" + (a.text || "")));
            blockEl.appendChild(item);
          });
        }
        if (enhanced.length) {
          blockEl.appendChild(el("h2", null, "Luyện tập bổ sung"));
          enhanced.forEach(function(text) {
            var item = el("div", "assignment-item");
            item.style.borderLeftColor = "var(--spring)";
            item.appendChild(el("span", "assignment-origin", "Bổ sung"));
            item.appendChild(document.createTextNode("\n" + text));
            blockEl.appendChild(item);
          });
        }
        container.appendChild(blockEl);
      }

      /* ---- references with transparent read status ---------------------- */
      function renderReferences(container, lesson, refIndexById, refCards) {
        if (!lesson.references || !lesson.references.length) return;
        var blockEl = el("section", "references-block");
        blockEl.id = "references-" + lessonIdSlug(lesson.id);
        blockEl.appendChild(el("h2", null, "Nguồn tham chiếu"));

        lesson.references.forEach(function(ref, i) {
          var num = i + 1;
          refIndexById.set(String(ref.citationId || ref.id).toLowerCase(), num);
          var card = el("article", "ref-card");
          card.id = "ref-" + lessonIdSlug(lesson.id) + "-" + num;
          var headRow = el("div", "ref-card-head");
          headRow.appendChild(el("span", "ref-num", "[" + num + "]"));
          headRow.appendChild(el("strong", null, ref.label || ref.pageTitle || ref.resourceId));
          headRow.appendChild(el("span", "badge-domain", ref.url ? new URL(ref.url).hostname : ""));
          if (ref.readStatus === "read") headRow.appendChild(el("span", "badge-read", "đã đọc"));
          card.appendChild(headRow);
          if (ref.pageTitle) {
            card.appendChild(el("div", null, "Trang: " + ref.pageTitle));
          }
          if (ref.url) {
            var linkP = el("p");
            var a = el("a", "ref-url", ref.safeUrl || ref.url);
            a.href = CourseCore.safeExternalUrl(ref.url) || "#";
            if (a.href !== "#") {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            }
            linkP.appendChild(a);
            card.appendChild(linkP);
          }
          /* section backlink */
          var back = el("a", null, "↑ Về đầu bài học");
          back.href = "#lesson/" + lesson.id;
          back.style.cssText = "font-size:.75rem;color:var(--muted);text-decoration:none;display:inline-block;margin-top:.375rem;";
          back.addEventListener("click", function(ev) {
            ev.preventDefault();
            window.location.hash = "#lesson/" + lesson.id;
            setTimeout(function() { document.getElementById("main-content").focus(); }, 50);
          });
          card.appendChild(back);
          blockEl.appendChild(card);
          refCards.push({ ref: ref, num: num });
        });

        /* Supplied but inaccessible resources — separate disclosure. */
        var unavailable = (lesson.references || []).filter(function(r) { return r.readStatus !== "read"; });
        if (unavailable.length) {
          var details = el("details", "ref-unavailable");
          details.appendChild(el("summary", null,
            "Nguồn được cung cấp nhưng không truy cập được (" + unavailable.length + ")"));
          unavailable.forEach(function(ref) {
            var card = el("article", "ref-card");
            card.appendChild(el("strong", null, ref.label || ref.resourceId));
            card.appendChild(el("div", null, "Trạng thái kiểm tra: " + (ref.checkStatus || "không rõ")));
            if (ref.limitation) card.appendChild(el("div", null, "Giới hạn: " + ref.limitation));
            details.appendChild(card);
          });
          blockEl.appendChild(details);
        }
        container.appendChild(blockEl);
      }

      /* ---- footer navigation -------------------------------------------- */
      function renderLessonNav(container, lesson) {
        var prevId = CourseCore.nextLessonId(courseData.lessons, lesson.id, -1);
        var nextId = CourseCore.nextLessonId(courseData.lessons, lesson.id, 1);
        var nav = el("nav", "lesson-nav");
        nav.setAttribute("aria-label", "Điều hướng bài học");

        if (prevId) {
          var prevLesson = lessonsById.get(prevId);
          var prevA = el("a", "nav-prev");
          prevA.href = "#lesson/" + prevId;
          prevA.innerHTML = icon("arrow-left") + '<span><span class="nav-label">Bài trước</span><span>' +
            CourseCore.escapeHtml(prevLesson ? prevLesson.title : prevId) + "</span></span>";
          nav.appendChild(prevA);
        } else {
          nav.appendChild(el("span"));
        }

        var done = state.completed.indexOf(lesson.id) !== -1;
        var toggleBtn = el("button", "nav-complete");
        toggleBtn.innerHTML = icon("check") + "<span>" + (done ? "Đã hoàn thành" : "Đánh dấu hoàn thành") + "</span>";
        toggleBtn.type = "button";
        toggleBtn.setAttribute("data-action", "toggle-completion");
        toggleBtn.setAttribute("data-lesson-id", lesson.id);
        toggleBtn.setAttribute("aria-pressed", done ? "true" : "false");
        nav.appendChild(toggleBtn);

        if (nextId) {
          var nextLesson = lessonsById.get(nextId);
          var nextA = el("a", "nav-next");
          nextA.href = "#lesson/" + nextId;
          nextA.innerHTML = icon("arrow-right") + '<span><span class="nav-label">Bài sau</span><span>' +
            CourseCore.escapeHtml(nextLesson ? nextLesson.title : nextId) + "</span></span>";
          nav.appendChild(nextA);
        } else {
          nav.appendChild(el("span"));
        }
        container.appendChild(nav);
      }

      /* ---- main lesson view ------------------------------------------------ */
      function renderFullLesson(container, lesson) {
        currentLessonId = lesson.id;
        var refIndexById = new Map();
        var refCards = [];

        renderLessonHeader(container, lesson, refIndexById);
        renderSections(container, lesson, refIndexById);
        renderPractices(container, lesson);
        renderAssignments(container, lesson);
        renderReferences(container, lesson, refIndexById, refCards);
        renderLessonNav(container, lesson);
        container.setAttribute("tabindex", "-1");
      }

      /* ---- route entry for lessons ---------------------------------------- */
      function renderLessonView(container, lessonId) {
        var lesson = lessonsById.get(lessonId);
        if (!lesson) {
          container.innerHTML = '<h1 style="margin:2rem 0;">Không tìm thấy bài học</h1><p>Bài học "' +
            CourseCore.escapeHtml(lessonId) + '" không tồn tại.</p><a href="#dashboard" style="color:var(--spring-ink);">Về dashboard</a>';
          return;
        }
        state.lastLessonId = lessonId;
        saveState();
        if (lesson.kind === 'pending') {
          container.innerHTML = '<div style="padding:3rem 0;text-align:center;"><h1>' +
            CourseCore.escapeHtml(lesson.title) + '</h1>' +
            '<p style="color:var(--muted);margin-top:1rem;">Bài học này đang được biên soạn — nội dung sẽ được bổ sung trong giai đoạn tiếp theo.</p>' +
            '<p><a href="#dashboard" style="color:var(--spring-ink);">← Về tổng quan</a></p></div>';
          return;
        }
        renderFullLesson(container, lesson);
      }

      /* ---- resources view (Site Task 6) ---------------------------------- */
      var RES_FILTERS = [
        { key: "all", label: "Tất cả" },
        { key: "read", label: "Đã đọc" },
        { key: "unavailable", label: "Không truy cập được" }
      ];

      function renderResourcesView(container) {
        var resources = courseData.resources || [];
        var h1 = el("h1", null, "Nguồn tài liệu");
        h1.style.cssText = "font-size:1.75rem;margin:0 0 .5rem;";
        container.appendChild(h1);
        container.appendChild(el("p", "lesson-summary",
          "Tổng hợp mọi nguồn được cung cấp trong giáo trình, kèm trạng thái kiểm tra và đọc minh bạch."));

        /* Filter bar + search */
        var bar = el("div", "res-filterbar");
        bar.style.cssText = "display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.25rem 0;";
        var filterGroup = el("div");
