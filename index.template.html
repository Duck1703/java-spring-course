<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Khóa học Java 17 và Spring Boot 3.x theo lộ trình thực hành.">
  <title>Java Spring Boot Course</title>
  <style id="app-styles">
    /* ============================================================
       Design tokens — Java & Spring Boot Course · learning platform
       Java orange and Spring green stay the real brand colors of the
       two platforms taught here, tuned for legible text/UI contrast
       rather than decoration. Warm paper neutrals replace clinical
       black/white; every semantic hue gets a mid-tone (icons/borders/
       fills), an "-ink" (text), and a "-soft" tint (chip/badge wash).
       Code blocks stay dark in both themes (the one deliberately
       "terminal" surface, reserved for actual source code).
       ============================================================ */
    :root {
      --java: #c1440e;
      --java-ink: #963309;
      --java-soft: #fbe9dd;
      --spring: #3f7a24;
      --spring-ink: #2f6b1f;
      --spring-soft: #e6f1dd;
      --completion: #78716c;
      --completion-soft: #eeece6;
      --ink: #26231f;
      --muted: #6b6558;
      --canvas: #faf8f4;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-strong: #f2efe7;
      --line: #e6e0d3;
      --line-strong: #d2c9b4;
      --ok: #2e7d32;
      --ok-soft: #e5f3e6;
      --ok-contrast: #ffffff;
      --info: #2c6e9e;
      --info-soft: #e5f0f8;
      --project: #336b73;
      --project-ink: #24545b;
      --project-soft: #e3f0ef;
      --danger: #b3372a;
      --danger-soft: #fbe9e6;
      --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
      --code-head: rgba(20, 27, 35, .06);
      --code-bg: #10151b;
      --code-ink: #e6edf5;
      --focus: #2f6b1f;
      --header-h: 4rem;
      --sidebar-w: 19rem;
      --content-max: 46rem;
      --radius-sm: .375rem;
      --radius-md: .75rem;
      --radius-lg: 1rem;
      --shadow-sm: 0 1px 2px rgb(38 35 32 / .06);
      --shadow-md: 0 8px 24px rgb(38 35 32 / .08);
      --shadow-float: 0 18px 40px rgb(20 24 20 / .16);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --java: #e8935c;
      --java-ink: #f2b083;
      --java-soft: #332217;
      --spring: #74cf4f;
      --spring-ink: #8ede6c;
      --spring-soft: #1c2a17;
      --completion: #a6a099;
      --completion-soft: #24221e;
      --ink: #eeebe4;
      --muted: #a39c8d;
      --canvas: #16140f;
      --surface: #1e1c17;
      --surface-raised: #24221c;
      --surface-strong: #2b2820;
      --line: #383429;
      --line-strong: #4a4433;
      --ok: #6fcf73;
      --ok-soft: #1a2a1b;
      --ok-contrast: #0b1f0d;
      --info: #7db8e8;
      --info-soft: #17222c;
      --project: #72c4c5;
      --project-ink: #8ed8d8;
      --project-soft: #172929;
      --danger: #e8776e;
      --danger-soft: #2c1815;
      --code-head: rgba(148, 163, 184, .1);
      --code-bg: #0a0d10;
      --code-ink: #dde6ef;
      --focus: #8ede6c;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .3);
      --shadow-md: 0 8px 24px rgb(0 0 0 / .35);
      --shadow-float: 0 18px 40px rgb(0 0 0 / .5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Inter", system-ui, -apple-system, "Noto Sans", sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      background: var(--canvas);
      color: var(--ink);
    }
    code, pre, kbd {
      font-family: var(--mono);
    }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 200;
      background: var(--surface-raised);
      color: var(--ink);
      padding: .6rem 1rem;
      border-radius: 0 0 var(--radius-sm) 0;
      border: 1px solid var(--line);
    }
    .skip-link:focus { left: 0; }

    /* ============ Header ============ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: var(--header-h);
      padding-inline: 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.375rem;
      height: 2.375rem;
      flex-shrink: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: border-color .12s ease, color .12s ease, background .12s ease;
    }
    .icon-btn svg { width: 1.15rem; height: 1.15rem; }
    .icon-btn:hover { border-color: var(--spring); color: var(--spring-ink); background: var(--spring-soft); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .625rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 1.0625rem;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    /* Brand mark: a rounded two-tone badge (Java orange / Spring green
       diagonal split) standing in for a course "logo" — reads as a
       product mark, not a terminal prompt. */
    .brand-mark {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--java) 0%, var(--java) 45%, var(--spring) 55%, var(--spring) 100%);
      color: #fff;
      font-size: .8125rem;
      font-weight: 800;
      letter-spacing: -.02em;
      box-shadow: var(--shadow-sm);
    }
    .brand-text { color: var(--ink); }
    .header-search { margin-left: auto; position: relative; }
    .header-search label {
      position: absolute;
      left: -9999px;
    }
    .header-search svg {
      position: absolute;
      left: .7rem;
      top: 50%;
      width: 1rem;
      height: 1rem;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .header-search input {
      width: min(17rem, 42vw);
      padding: .5rem .75rem .5rem 2.1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-strong);
      color: var(--ink);
      font: inherit;
      font-size: .875rem;
    }
    .header-search input:focus { background: var(--surface); }
    .header-search input::placeholder { color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    .primary-nav {
      display: flex;
      align-items: center;
      gap: .125rem;
      padding: .1875rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-strong);
      flex-shrink: 0;
    }
    .primary-nav a {
      padding: .375rem .625rem;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: .8125rem;
      font-weight: 650;
      line-height: 1.25;
      text-decoration: none;
      white-space: nowrap;
    }
    .primary-nav a:hover { color: var(--ink); background: var(--surface); }
    .primary-nav a[aria-current="page"] {
      color: var(--project-ink);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .progress-meter {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-shrink: 0;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress-meter progress {
      -webkit-appearance: none;
      appearance: none;
      width: 6rem;
      height: .4375rem;
      border: none;
      border-radius: 999px;
      overflow: hidden;
      accent-color: var(--spring-ink);
    }
    .progress-meter progress::-webkit-progress-bar { background: var(--surface-strong); border-radius: 999px; }
    .progress-meter progress::-webkit-progress-value { background: var(--spring-ink); border-radius: 999px; }
    .progress-meter progress::-moz-progress-bar { background: var(--spring-ink); border-radius: 999px; }
    .progress-text-short { font-weight: 700; color: var(--spring-ink); min-width: 2.4ch; }

    /* ============ Frame ============ */
    .app-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 120rem;
      margin-inline: auto;
    }

    /* Sidebar / curriculum rail */
    .course-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .sidebar-title {
      padding: 1rem 1rem .75rem;
      font-size: .8125rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      margin-bottom: .5rem;
    }
    #curriculum-nav { padding: .25rem .75rem 2rem; }
    .group-label {
      display: flex;
      align-items: center;
      gap: .4375rem;
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.375rem .375rem .5rem;
    }
    .group-label::before {
      content: '';
      width: .5rem;
      height: .5rem;
      border-radius: 999px;
      background: var(--completion);
      flex-shrink: 0;
    }
    .group-label--java::before { background: var(--java); }
    .group-label--spring::before { background: var(--spring); }
    .module-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      width: 100%;
      padding: .5rem .5rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: .875rem;
      text-align: left;
      cursor: pointer;
    }
    .module-toggle:hover { background: var(--surface-strong); }
    .module-toggle-label { display: flex; align-items: baseline; gap: .5rem; min-width: 0; }
    .module-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.375rem;
      height: 1.375rem;
      padding-inline: .25rem;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 700;
    }
    .module-toggle[data-group="java"] .module-num { background: var(--java-soft); color: var(--java-ink); }
    .module-toggle[data-group="spring"] .module-num { background: var(--spring-soft); color: var(--spring-ink); }
    .module-toggle[data-group="completion"] .module-num { background: var(--completion-soft); color: var(--completion); }
    .module-toggle-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .module-progress { flex-shrink: 0; font-size: .6875rem; font-weight: 700; color: var(--muted); }
    .module-toggle .chevron { flex-shrink: 0; transition: transform .15s ease; color: var(--muted); }
    .module-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .lesson-list { list-style: none; margin: .125rem 0 .5rem; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: .0625rem; }
    .lesson-link {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .4375rem .625rem .4375rem 1.5rem;
      border-radius: var(--radius-sm);
      color: var(--ink);
      text-decoration: none;
      font-size: .8438rem;
      line-height: 1.4;
      border-left: 2px solid transparent;
      /* .lesson-list is an implicit single-column grid, so without this
         each link's automatic minimum size is its own min-content width —
         the full unwrapped title — which forces the sidebar (and the
         viewport) wider than the link's own ellipsis truncation intends. */
      min-width: 0;
    }
    .lesson-link:hover { background: var(--surface-strong); }
    .lesson-link[aria-current="page"] {
      background: var(--accent-soft, var(--spring-soft));
      font-weight: 600;
      border-left-color: var(--accent, var(--focus));
    }
    .lesson-state {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.125rem;
      height: 1.125rem;
      line-height: 1;
      border-radius: 999px;
      border: 1.5px solid var(--line-strong);
      color: transparent;
    }
    .lesson-state svg { width: .6875rem; height: .6875rem; }
    .lesson-state[data-done="true"] {
      background: var(--spring-ink);
      border-color: var(--spring-ink);
      color: #fff;
    }
    .lesson-link-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Drawer backdrop */
    .drawer-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgb(6 10 14 / .55);
      z-index: 90;
      border: 0;
      padding: 0;
    }

    main#main-content { outline: none; }
    #route-view { padding-block: 1.5rem 4rem; }
    /* Lesson reading view gets a capped line length; dashboard/resources
       stay full-width so their cards and the curriculum overview can breathe. */
    #route-view.route-view--reading { max-width: var(--content-max); margin-inline: auto; }

    /* ============ Responsive ============ */
    @media (min-width: 64rem) {
      .icon-btn.nav-toggle { display: none; }
      .drawer-backdrop { display: none !important; }
      .app-frame { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
      .course-sidebar {
        position: sticky;
        top: var(--header-h);
        height: calc(100dvh - var(--header-h));
        overflow-y: auto;
      }
      #route-view { padding-inline: clamp(1.5rem, 4vw, 3rem); }
    }
    @media (max-width: 63.999rem) {
      .app-header { gap: .625rem; padding-inline: .875rem; }
      .primary-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        /* A fixed-position flex CONTAINER sizes by shrink-to-fit, not by
           stretching between left/right, so without an explicit width its
           four nowrap labels can force it wider than the viewport (clipping
           the last link). Pin it to the viewport width explicitly. */
        width: 100%;
        z-index: 110;
        justify-content: space-around;
        gap: .25rem;
        border-width: 1px 0 0;
        border-radius: 0;
        padding: .4375rem max(.5rem, env(safe-area-inset-right)) calc(.4375rem + env(safe-area-inset-bottom)) max(.5rem, env(safe-area-inset-left));
        background: var(--surface);
        box-shadow: 0 -8px 24px rgb(38 35 32 / .08);
      }
      .primary-nav a { flex: 1 1 0; padding: .4375rem .25rem; text-align: center; }
      #route-view { padding-bottom: 6rem; }
      .course-sidebar {
        position: fixed;
        top: var(--header-h);
        bottom: 0;
        left: 0;
        width: min(20rem, 85vw);
        z-index: 95;
        overflow-y: auto;
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--shadow-float);
      }
      body.drawer-open .course-sidebar { z-index: 115; transform: translateX(0); }
      body.drawer-open { overflow: hidden; }
      #route-view { padding-inline: clamp(1rem, 4vw, 2rem); }
    }
    /* Desktop never shows drawer state even if body class lingers */
    @media (min-width: 64rem) {
      body.drawer-open { overflow: auto; }
      body.drawer-open .drawer-backdrop { display: none; }
    }
    pre { max-width: 100%; overflow-x: auto; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .app-header, .course-sidebar, .drawer-backdrop, #toast-region { display: none !important; }
      .app-frame { display: block; }
      #route-view { max-width: none; padding: 0; }
      .ref-url { display: inline !important; }
    }

    /* Toast */
    #toast-region {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: var(--canvas);
      padding: .55rem 1rem;
      border-radius: 999px;
      font-size: .8438rem;
      box-shadow: var(--shadow-float);
    }

    /* Lesson body (Site Task 4) */
    .lesson-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: .375rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1.125rem;
    }
    .lesson-breadcrumb a { color: var(--muted); text-decoration: none; }
    .lesson-breadcrumb a:hover { color: var(--accent, var(--spring-ink)); text-decoration: underline; }
    .lesson-breadcrumb .crumb-sep { display: inline-flex; align-items: center; color: var(--line-strong); }
    .lesson-breadcrumb .crumb-sep svg { width: .75rem; height: .75rem; }
    .lesson-breadcrumb .crumb-current { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
    .lesson-kicker {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--accent, var(--spring-ink));
      margin-bottom: .5rem;
    }
    .lesson-header { margin-bottom: 1.75rem; }
    .lesson-title {
      font-size: 2rem;
      line-height: 1.22;
      margin: 0 0 .75rem;
      letter-spacing: -0.015em;
      font-weight: 800;
    }
    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .3125rem;
      padding: .25rem .6875rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
    }
    .chip svg { width: .8125rem; height: .8125rem; flex-shrink: 0; }
    .chip--group-java { border-color: transparent; background: var(--java-soft); color: var(--java-ink); }
    .chip--group-spring { border-color: transparent; background: var(--spring-soft); color: var(--spring-ink); }
    .lesson-summary {
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--spring));
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink);
    }
    .lesson-columns { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-bottom: 2rem; }
    @media (min-width: 48rem) { .lesson-columns.twocol { grid-template-columns: 1fr 1fr; } }
    .lesson-column {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 1.125rem 1.25rem;
    }
    .lesson-column h2 {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .8125rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin: 0 0 .75rem;
    }
    .lesson-column h2 svg { width: 1rem; height: 1rem; color: var(--accent, var(--spring-ink)); flex-shrink: 0; }
    .lesson-column ul { margin: 0; padding: 0; list-style: none; font-size: .9063rem; line-height: 1.6; display: grid; gap: .5rem; }
    .lesson-column li { display: flex; gap: .5rem; align-items: flex-start; }
    .lesson-column li::before {
      content: '';
      flex-shrink: 0;
      margin-top: .5rem;
      width: .375rem;
      height: .375rem;
      border-radius: 999px;
      background: var(--line-strong);
    }
    .lesson-column--outcomes li::before { background: var(--spring); }
    .section-block { margin-bottom: 2.75rem; }
    .section-heading {
      font-size: 1.375rem;
      font-weight: 700;
      margin: 0 0 1.125rem;
      padding-bottom: .625rem;
      border-bottom: 2px solid var(--line);
      letter-spacing: -.005em;
    }
    .prose > p { margin: 0 0 1.125rem; line-height: 1.75; font-size: 1rem; }
    .callout {
      display: flex;
      gap: .75rem;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 1rem 1.125rem;
      border-radius: var(--radius-md);
      margin: 0 0 1.25rem;
      font-size: .9375rem;
      line-height: 1.65;
    }
    .callout-icon { flex-shrink: 0; width: 1.375rem; height: 1.375rem; margin-top: .0625rem; }
    .callout-icon svg { width: 100%; height: 100%; }
    .callout-body { min-width: 0; }
    .callout-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem; margin-bottom: .25rem; }
    .callout-tag { display: none; }
    .callout-label { font-weight: 700; }
    .callout--note { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 35%, var(--line)); }
    .callout--note .callout-icon, .callout--note .callout-label { color: var(--info); }
    .callout--important { background: var(--java-soft); border-color: color-mix(in srgb, var(--java) 35%, var(--line)); }
    .callout--important .callout-icon, .callout--important .callout-label { color: var(--java-ink); }
    .callout--warning { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
    .callout--warning .callout-icon, .callout--warning .callout-label { color: var(--danger); }
    .callout--deliverable { background: var(--spring-soft); border-color: color-mix(in srgb, var(--spring) 35%, var(--line)); }
    .callout--deliverable .callout-icon, .callout--deliverable .callout-label { color: var(--spring-ink); }
    .deliverable-body { white-space: pre-wrap; }
    .code-sample { margin: 0 0 1.25rem; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
    .code-sample figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      padding: .5625rem .875rem;
      background: var(--code-head, rgba(127,127,127,.08));
      border-bottom: 1px solid var(--line);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .code-sample figcaption > span:first-child { font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; }
    .code-sample pre {
      margin: 0;
      padding: 1rem 1.125rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      font-size: .8438rem;
      line-height: 1.6;
      tab-size: 2;
    }
    .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: .3125rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .625rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .copy-btn svg { width: .875rem; height: .875rem; }
    .copy-btn:hover { border-color: var(--spring); color: var(--spring-ink); background: var(--spring-soft); }
    .data-table-wrap { overflow-x: auto; margin: 0 0 1.25rem; border: 1px solid var(--line); border-radius: var(--radius-md); }
    .data-table { width: 100%; border-collapse: collapse; font-size: .875rem; line-height: 1.55; }
    .data-table caption { text-align: left; font-weight: 600; padding: .75rem .875rem; color: var(--ink); font-size: .875rem; border-bottom: 1px solid var(--line); background: var(--surface-strong); }
    .data-table th, .data-table td { border-bottom: 1px solid var(--line); padding: .625rem .875rem; text-align: left; vertical-align: top; }
    .data-table th { background: var(--surface-strong); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-strong) 45%, transparent); }
    .citation-link {
      font-size: .6875rem;
      vertical-align: super;
      text-decoration: none;
      margin-left: .0625rem;
      color: var(--accent, var(--spring-ink));
      font-weight: 700;
    }
    .authoring-warning {
      border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
      color: var(--danger);
      background: var(--danger-soft);
      padding: .75rem 1rem;
      border-radius: var(--radius-md);
      font-size: .875rem;
      margin: 0 0 1rem;
    }
    /* Practice cards */
    .practice-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin: 0 0 1rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .practice-head { padding: 1rem 1.125rem .625rem; }
    .practice-kind {
      display: inline-block;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent, var(--spring-ink));
      font-weight: 700;
      margin-bottom: .375rem;
    }
    .practice-prompt { margin: 0; font-size: .9375rem; line-height: 1.6; font-weight: 600; }
    .practice-body { padding: 0 1.125rem 1.125rem; }
    .practice-starter pre {
      margin: 0 0 .75rem;
      padding: .875rem 1rem;
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: var(--radius-sm);
      font-size: .8125rem;
      overflow-x: auto;
    }
    .practice-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
    .disclosure-btn {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .8125rem;
      font-weight: 600;
      padding: .4375rem .8125rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .disclosure-btn:hover { border-color: var(--spring); color: var(--spring-ink); }
    .disclosure-btn[aria-expanded="true"] { background: var(--spring-soft); border-color: var(--spring); color: var(--spring-ink); }
    .disclosure-btn[aria-pressed="true"] { background: var(--spring-ink); border-color: var(--spring-ink); color: #fff; }
    .disclosure-panel {
      margin-top: .75rem;
      padding: .75rem .875rem;
      background: var(--surface-strong);
      border-radius: var(--radius-sm);
      font-size: .875rem;
      line-height: 1.65;
    }
    .disclosure-panel[hidden] { display: none; }
    .choice-list { list-style: none; margin: 0 0 .75rem; padding: 0; display: grid; gap: .5rem; }
    .choice-item label {
      display: flex;
      gap: .625rem;
      align-items: baseline;
      padding: .625rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .9063rem;
      line-height: 1.5;
      transition: border-color .12s ease, background .12s ease;
    }
    .choice-item label:hover { border-color: var(--line-strong); background: var(--surface-strong); }
    .choice-item input { accent-color: var(--spring-ink); }
    .choice-item.is-correct label { border-color: var(--ok); background: var(--ok-soft); }
    .choice-item.is-wrong label { border-color: var(--danger); background: var(--danger-soft); }
    .check-feedback { margin: .75rem 0 0; font-size: .875rem; line-height: 1.6; padding: .75rem .875rem; border-radius: var(--radius-sm); font-weight: 500; }
    .check-feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok); color: var(--ink); }
    .check-feedback.wrong { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--ink); }
    /* Assignments */
    .assignments-block { margin: 2.75rem 0; }
    .assignments-block h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 .875rem; }
    .assignment-item {
      border: 1px solid var(--line);
      border-left: 4px solid var(--java);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      background: var(--surface);
      padding: .875rem 1.125rem;
      margin-bottom: .75rem;
      font-size: .9063rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .assignment-origin {
      display: inline-block;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: .375rem;
    }
    /* References */
    .references-block h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 .875rem; }
    .ref-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: .875rem 1.125rem;
      margin-bottom: .625rem;
      font-size: .875rem;
      scroll-margin-top: 5rem;
    }
    .ref-card-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .3125rem; }
    .ref-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.375rem;
      height: 1.375rem;
      border-radius: 999px;
      background: var(--spring-soft);
      color: var(--accent, var(--spring-ink));
      font-weight: 700;
      font-size: .75rem;
    }
    .ref-card a { color: var(--spring-ink); word-break: break-all; }
    .ref-url { display: inline-flex; align-items: flex-start; gap: .375rem; }
    .ref-url svg { flex-shrink: 0; margin-top: .1875rem; }
    .badge-read, .badge-status--unavailable {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .6875rem;
      font-weight: 700;
      padding: .1875rem .5625rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .badge-read svg, .badge-status--unavailable svg { flex-shrink: 0; }
    .badge-read {
      background: var(--ok-soft);
      color: var(--ok);
    }
    .badge-status--unavailable {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .badge-domain { font-size: .75rem; color: var(--muted); }
    .ref-inline-label { font-size: .8125rem; color: var(--muted); font-weight: 600; }
    details.ref-unavailable { margin-top: 1.25rem; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: .75rem 1rem; }
    details.ref-unavailable summary { cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--muted); }
    details.ref-unavailable .ref-card { border-style: dashed; }
    /* Lesson footer nav */
    .lesson-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .75rem;
      align-items: stretch;
      margin-top: 2.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    .lesson-nav a, .lesson-nav button {
      display: flex;
      align-items: center;
      gap: .625rem;
      font-size: .875rem;
      padding: .75rem 1rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: border-color .12s ease, background .12s ease;
    }
    .lesson-nav a:hover, .lesson-nav button:hover { border-color: var(--spring); background: var(--spring-soft); }
    .lesson-nav .nav-prev svg { flex-shrink: 0; }
    .lesson-nav .nav-next { text-align: right; flex-direction: row-reverse; }
    .lesson-nav .nav-next svg { flex-shrink: 0; }
    .lesson-nav .nav-complete {
      white-space: nowrap;
      min-width: 8rem;
      justify-content: center;
      font-weight: 700;
    }
    .lesson-nav .nav-complete[aria-pressed="true"] {
      background: var(--ok);
      border-color: var(--ok);
      color: var(--ok-contrast);
    }
    .nav-label { display: block; font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .lesson-nav a:hover .nav-label { color: var(--spring-ink); }

    /* Dashboard settings (Site Task 5) */
    .settings-block { margin-top: 2.75rem; border-top: 1px solid var(--line); padding-top: 1.25rem; }
    .settings-block details { margin-bottom: .625rem; }
    .settings-block summary {
      cursor: pointer;
      font-size: .9375rem;
      font-weight: 700;
      color: var(--ink);
    }
    .settings-actions { display: flex; flex-wrap: wrap; gap: .625rem; padding: 1rem 0 0; }
    .settings-btn {
      display: inline-flex;
      align-items: center;
      gap: .4375rem;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: .8438rem;
      font-weight: 600;
      padding: .5rem .875rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .settings-btn:hover { border-color: var(--spring); color: var(--spring-ink); background: var(--spring-soft); }
    .settings-btn--danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    .import-preview {
      margin-top: .75rem;
      padding: .75rem .875rem;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: .8438rem;
      line-height: 1.6;
    }
    .import-preview[hidden] { display: none; }

    /* ============ Dashboard: hero, progress, curriculum overview ============ */
    .dash-hero {
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .dash-eyebrow {
      display: flex;
      align-items: center;
      gap: .375rem;
      font-size: .8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--spring-ink);
      margin: 0 0 .5rem;
    }
    .dash-title {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 800;
      margin: 0 0 .625rem;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    .dash-desc { max-width: 42rem; margin: 0; font-size: 1rem; line-height: 1.6; color: var(--muted); }

    /* Overall + per-track progress card */
    .dash-progress-card {
      display: grid;
      grid-template-columns: minmax(11rem, 17rem) minmax(0, 1fr);
      gap: 1.75rem;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .dash-progress-headline { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
    .dash-progress-percent { font-size: 2.75rem; font-weight: 800; line-height: 1; color: var(--spring-ink); }
    .dash-progress-count { font-size: .9375rem; color: var(--muted); font-weight: 600; }
    .dash-progress-track {
      height: .5rem;
      border-radius: 999px;
      background: var(--surface-strong);
      overflow: hidden;
      margin-top: .75rem;
    }
    .dash-progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--spring-ink), var(--spring)); transition: width .3s ease; }
    .dash-progress-split { display: grid; gap: .875rem; }
    /* min-width: 0 — .dash-progress-split is an implicit single-column
       grid, so without it each row's automatic minimum size is its own
       min-content width, which can force the card (and the viewport)
       wider than its actual available space at narrow widths. */
    .dash-progress-row { display: grid; grid-template-columns: minmax(5rem, auto) minmax(0, 1fr) auto; align-items: center; gap: .75rem; min-width: 0; }
    .dash-progress-row-label { display: inline-flex; align-items: center; gap: .4375rem; font-size: .875rem; font-weight: 700; color: var(--ink); }
    .dash-progress-row-label::before { content: ""; width: .625rem; height: .625rem; border-radius: 999px; background: var(--muted); flex-shrink: 0; }
    .dash-progress-row--java .dash-progress-row-label::before { background: var(--java); }
    .dash-progress-row--spring .dash-progress-row-label::before { background: var(--spring); }
    .dash-progress-row .dash-progress-track { margin-top: 0; }
    .dash-progress-row--java .dash-progress-fill { background: linear-gradient(90deg, var(--java-ink), var(--java)); }
    .dash-progress-row--spring .dash-progress-fill { background: linear-gradient(90deg, var(--spring-ink), var(--spring)); }
    .dash-progress-row-count { font-size: .8125rem; color: var(--muted); font-weight: 600; white-space: nowrap; }

    /* Continue-learning callout card */
    .dash-continue-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--spring-soft);
      border: 1px solid var(--spring);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
    }
    .dash-continue-eyebrow {
      display: flex;
      align-items: center;
      gap: .375rem;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--spring-ink);
      margin: 0 0 .3125rem;
    }
    .dash-continue-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 .625rem; color: var(--ink); }
    .dash-continue-meta { display: flex; flex-wrap: wrap; gap: .5rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .9375rem;
      font-weight: 700;
      padding: .75rem 1.375rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      transition: filter .12s ease, transform .12s ease, background .12s ease;
      flex-shrink: 0;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn--primary { background: var(--spring-ink); border-color: var(--spring-ink); color: #fff; box-shadow: var(--shadow-sm); }
    .btn--primary:hover { filter: brightness(1.1); }
    .btn-glyph, .btn svg { flex-shrink: 0; }

    /* Curriculum overview — plain-language unit list replacing any
       build-log framing: each row is one unit with real completion state. */
    .curriculum-overview { margin-bottom: 1.75rem; }
    .curriculum-overview-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; margin-bottom: .875rem; }
    .curriculum-overview-head h2 { font-size: 1.125rem; font-weight: 700; margin: 0; }
    .curriculum-overview-hint { font-size: .8125rem; color: var(--muted); }
    .curriculum-list {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .curriculum-row {
      display: flex;
      align-items: center;
      gap: .875rem;
      padding: .875rem 1.125rem;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--ink);
    }
    .curriculum-row:last-child { border-bottom: 0; }
    .curriculum-row:hover { background: var(--surface-strong); }
    .curriculum-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
    }
    .curriculum-status svg { width: 1rem; height: 1rem; }
    .curriculum-row--done .curriculum-status { background: var(--ok); color: var(--ok-contrast); }
    .curriculum-row--active .curriculum-status { background: var(--java-soft); color: var(--java-ink); }
    .curriculum-name { flex: 1 1 auto; min-width: 0; font-size: .9375rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .curriculum-meta { flex-shrink: 0; font-size: .8125rem; color: var(--muted); font-weight: 600; }
    .curriculum-tag {
      flex-shrink: 0;
      font-size: .6875rem;
      font-weight: 700;
      padding: .1875rem .5625rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: var(--surface-strong);
      color: var(--muted);
    }
    .curriculum-row--done .curriculum-tag { background: var(--ok-soft); color: var(--ok); }
    .curriculum-row--active .curriculum-tag { background: var(--java-soft); color: var(--java-ink); }

    /* ============ Spendwise project track (P0) ============ */
    .workspace-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .workspace-eyebrow, .project-section-label {
      margin: 0 0 .375rem;
      color: var(--project-ink);
      font-family: var(--mono);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .065em;
      text-transform: uppercase;
    }
    .workspace-title { margin: 0; font-size: clamp(1.75rem, 3vw, 2.25rem); line-height: 1.2; letter-spacing: -.02em; }
    .workspace-summary { max-width: 50rem; margin: .625rem 0 0; color: var(--muted); line-height: 1.65; }
    .text-link { color: var(--project-ink); font-weight: 700; text-decoration-thickness: .08em; text-underline-offset: .18em; }
    .project-status {
      display: inline-flex;
      align-items: center;
      width: max-content;
      padding: .1875rem .5rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-strong);
      font-family: var(--mono);
      font-size: .6875rem;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .project-status--building { color: var(--project-ink); background: var(--project-soft); border-color: var(--project); }
    .project-status--released { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
    .project-progress {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .375rem .75rem;
      align-items: center;
    }
    .project-progress-label { font-size: .8125rem; color: var(--muted); }
    .project-progress-count { font-family: var(--mono); font-size: .75rem; font-weight: 700; color: var(--project-ink); }
    /* Shown instead of the count+bar when a release has no build task to
       track, so an empty plan never renders as 0% completion. */
    .project-progress-note { grid-column: 1 / -1; color: var(--muted); font-size: .8125rem; font-style: italic; }
    .project-progress progress {
      grid-column: 1 / -1;
      width: 100%;
      height: .5rem;
      border: 0;
      border-radius: 999px;
      overflow: hidden;
      accent-color: var(--project);
      background: var(--surface-strong);
    }
    .project-progress progress::-webkit-progress-bar { background: var(--surface-strong); }
    .project-progress progress::-webkit-progress-value { background: var(--project); }
    .project-progress progress::-moz-progress-bar { background: var(--project); }

    .project-dashboard {
      margin: .25rem 0 2rem;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-top: 3px solid var(--project);
      border-radius: var(--radius-lg);

    }
    .project-dashboard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .project-dashboard-head h2 { margin: 0; font-size: 1.125rem; }
    .project-now-grid, .project-next-grid, .project-overview-grid, .release-columns {

    }

    .project-panel h2, .project-panel h3 { margin: 0 0 .5rem; font-size: 1rem; line-height: 1.4; }

    .project-type--future .project-type { color: var(--info); border-color: var(--info); }
    .project-type--theory { border-left-color: var(--line-strong); background: var(--surface-strong); }

    .build-task-toggle svg { width: .875rem; height: .875rem; }
    .build-task-toggle[aria-pressed="true"] { color: #fff; border-color: var(--project-ink); background: var(--project-ink); }
    .build-task-title { display: flex; flex-wrap: wrap; gap: .375rem; align-items: baseline; font-weight: 700; }
    .build-task-meta { margin-top: .25rem; color: var(--muted); font-size: .8125rem; line-height: 1.5; }
    .build-task--done .build-task-title > span:first-child { text-decoration: line-through; text-decoration-thickness: .08em; color: var(--muted); }
    .task-kind { color: var(--muted); font-family: var(--mono); font-size: .6875rem; font-weight: 700; text-transform: uppercase; }

    .project-overview-grid { margin-bottom: 1.5rem; }

    .release-hero { margin-bottom: 1.25rem; }

    .release-columns { margin-bottom: 1rem; }
    .release-section { margin-top: 1rem; }
    .architecture-stage { margin-top: 1rem; }
    .architecture-stage pre { margin: .625rem 0 0; padding: .875rem 1rem; border-radius: var(--radius-sm); color: var(--code-ink); background: var(--code-bg); white-space: pre-wrap; }

    /* ---- P1: project sub-nav (Course<->Project Map / Architecture) ---- */
    .project-subnav { display: flex; flex-wrap: wrap; gap: .375rem; margin: .875rem 0 1.5rem; }
    .project-subnav a {

    .feature-progress-empty { margin-top: .625rem; color: var(--muted); font-size: .8125rem; font-style: italic; }

    /* ---- P1: Build Task expand/collapse detail -------------------------- */
    .build-task--expandable { grid-template-columns: auto minmax(0, 1fr); }
    .build-task-detail-toggle {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      gap: .3125rem;
      width: fit-content;
      margin-top: .125rem;
      padding: .25rem .5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
      background: transparent;
      font-size: .75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .build-task-detail-toggle svg { width: .75rem; height: .75rem; transition: transform .15s ease; }
    .build-task-detail-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .build-task-detail {
      grid-column: 1 / -1;
      padding-top: .625rem;
      border-top: 1px dashed var(--line);
      color: var(--muted);
