    }
    .build-task-detail-label { margin-top: .625rem; color: var(--ink); font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
    .build-task-detail-label:first-child { margin-top: 0; }
    .build-task-detail ul { margin: .3125rem 0 0; padding-left: 1.15rem; }
    .build-task-detail li { margin: .25rem 0; }

    /* ---- P1: Domain Overview -------------------------------------------- */
    /* align-items:start, not the default stretch: entity cards carry wildly
       different numbers of features (Rule has 1, Transaction has 14), and
       stretching every card in a row to the tallest one turns the short ones
       into tall, mostly-empty boxes. Each card sizes to its own content. */
    .domain-entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .625rem; margin-top: .75rem; align-items: start; }
    .domain-entity-card { padding: .75rem; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
    .domain-entity-card h3 { margin: 0 0 .25rem; font-size: .875rem; }
    .domain-entity-card p { margin: 0; color: var(--muted); font-size: .8125rem; }

    /* ---- P1: Course <-> Project Map -------------------------------------- */
    .map-filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 1rem 0 .75rem; }
    .map-filter-btn {
      padding: .375rem .75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: .8125rem;
      font-weight: 700;
      cursor: pointer;
    }
    .map-filter-btn[aria-pressed="true"] { border-color: var(--project); color: var(--project-ink); background: var(--project-soft); }
    .map-filter-release { display: flex; align-items: center; gap: .375rem; margin-left: auto; font-size: .8125rem; color: var(--muted); }
    .map-filter-release select { padding: .3125rem .5rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
    .map-summary { margin: 0 0 .625rem; color: var(--muted); font-size: .8125rem; }
    .map-rows { display: grid; gap: .5rem; }
    .map-row {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: .75rem;
      align-items: start;
      padding: .75rem .875rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .map-row-group { margin-top: .1875rem; color: var(--muted); font-size: .75rem; }
    .map-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .map-row-features { color: var(--muted); font-size: .8125rem; }
    .map-type--future { color: var(--info); border-color: var(--info); }
    .map-type--theory { color: var(--muted); border-color: var(--line-strong); }
    .map-type--unmapped { color: var(--muted); border-color: var(--line-strong); border-style: dashed; }

    /* ---- P1: Architecture Evolution -------------------------------------- */
    .architecture-stage-nav { display: flex; flex-wrap: wrap; gap: .375rem; margin: 1rem 0 1.25rem; }
    .architecture-stage-nav-link {
      padding: .3125rem .625rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      font-weight: 800;
      text-decoration: none;
    }
    .architecture-stage-nav-link:hover { border-color: var(--project); color: var(--project-ink); }
    /* Which stage the learner jumped to. Border + weight + background carry
       the state, not colour alone. */
    .architecture-stage-nav-link[aria-current="location"] {
      border-color: var(--project);
      color: var(--project-ink);
      background: var(--project-soft);
    }
    .architecture-target-note { color: var(--muted); font-size: .8125rem; font-style: italic; }
    .architecture-stage-controls { display: flex; flex-wrap: wrap; gap: .375rem 1rem; margin-top: .875rem; padding-top: .75rem; border-top: 1px solid var(--line); font-size: .875rem; }
    .architecture-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: .75rem; }
    .architecture-compare-col pre { margin: .375rem 0 0; padding: .875rem 1rem; border-radius: var(--radius-sm); color: var(--code-ink); background: var(--code-bg); white-space: pre-wrap; }
    .architecture-compare-label { color: var(--muted); font-family: var(--mono); font-size: .6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .architecture-compare-changes { margin-top: .625rem; color: var(--muted); font-size: .875rem; }

    /* ---- P1: Roadmap milestone grouping ---------------------------------- */
    .roadmap-milestone-group { margin-top: 1.75rem; }
    .roadmap-milestone-group:first-child { margin-top: 1rem; }
    .roadmap-milestone-head { margin-bottom: .25rem; }
    .roadmap-milestone-head h2 { margin: 0; font-size: 1.0625rem; }
    .roadmap-milestone-head p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }

    /* This block must stay last: it overrides base rules for several
       selectors (.dash-progress-card, .project-*-grid, .release-columns,
       .roadmap-release, .curriculum-row) that are declared further down
       the cascade than where a "Responsive" section would normally sit.
       With equal specificity, CSS resolves ties by source order, so this
       @media block has to appear after every rule it means to override —
       moving it earlier silently loses to those later base declarations
       even while the media query itself matches. */
    @media (max-width: 30rem) {
      .progress-meter { display: none; }
      .header-search input { width: min(7rem, 25vw); }
      .brand .brand-name-long { display: none; }
      .curriculum-row { flex-wrap: wrap; row-gap: .25rem; }
      .dash-progress-card { grid-template-columns: 1fr; }
      .project-now-grid, .project-next-grid, .project-overview-grid, .release-columns { grid-template-columns: 1fr; }
      .roadmap-release { grid-template-columns: auto minmax(0, 1fr); }
      .roadmap-release::before { grid-row: 1 / span 2; }
      .lesson-nav { grid-template-columns: 1fr 1fr; }
      .lesson-nav .nav-complete { grid-column: 1 / -1; grid-row: 2; }
      .lesson-nav .nav-next { grid-column: 2; }
      .map-row { grid-template-columns: 1fr; }
      .map-filter-release { margin-left: 0; width: 100%; }
      .architecture-compare { grid-template-columns: 1fr; }
    }
    /* Must stay last for the same reason as the block above: the
       unconditional #toast-region rule (declared earlier, ~line 504) sets
       bottom: 1rem, so this mobile override — which lifts toasts clear of
       the fixed bottom tab bar — has to appear after it in source order to
       win the cascade despite matching specificity. */
    @media (max-width: 63.999rem) {
      #toast-region { bottom: 4.25rem; }
    }
  </style>
  <script>
    /* Theme bootstrap: runs before first paint to avoid a light/dark flash. */
    (function() {
      try {
        var raw = localStorage.getItem("java-spring-course");
        var theme = raw ? (JSON.parse(raw).theme || "system") : "system";
        var resolved = theme === "dark" ? "dark"
          : theme === "light" ? "light"
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme",
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung</a>
  <div id="app" aria-live="off"></div>
  <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="course-data" type="application/json">{}</script>
  <script id="app-script">
    /* ============================================================
*/ /* COURSE_CORE_START */ /*
       pure logic, no DOM access.
       Tested by tests/site_core.test.js in node:vm.
       ============================================================ */
    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function parseRoute(hash) {
      const raw = String(hash ?? "").replace(/^#\/?/, "");
      if (!raw || raw === "dashboard") return { view: "dashboard" };
      if (raw === "resources") return { view: "resources" };
      if (raw === "project") return { view: "project" };
      if (raw === "roadmap") return { view: "roadmap" };
      if (raw === "map") return { view: "map" };
      if (raw === "architecture") return { view: "architecture" };
      const releaseMatch = raw.match(/^release\/(.+)$/);
      if (releaseMatch) return { view: "release", releaseId: decodeURIComponent(releaseMatch[1]) };
      const lessonMatch = raw.match(/^lesson\/(.+)$/);
      if (lessonMatch) return { view: "lesson", lessonId: decodeURIComponent(lessonMatch[1]) };
      return { view: "dashboard" };
    }

    function selectCurrentRelease(releases) {
      const authored = Array.isArray(releases) ? releases : [];
      const byOrder = (a, b) => Number(a.order || 0) - Number(b.order || 0);
      return authored.filter((release) => release.status === "building").sort(byOrder)[0]
        || authored.filter((release) => release.status === "planned").sort(byOrder)[0]
        || null;
    }

    function selectNextBuildTask(release, taskSource, completedTaskIds) {
      if (!release || !Array.isArray(release.buildTaskIds)) return null;
      const done = new Set(completedTaskIds || []);
      const taskMap = taskSource instanceof Map
        ? taskSource
        : new Map((Array.isArray(taskSource) ? taskSource : []).map((task) => [task.id, task]));
      for (const taskId of release.buildTaskIds) {
        const task = taskMap.get(taskId);
        if (task && task.required !== false && !done.has(taskId)) return task;
      }
      return null;
    }

    function calculateProgress(lessons, completedIds, group) {
      const valid = lessons.filter((l) => !group || l.group === group);
      const done = new Set(completedIds);
      const total = valid.length;
      const completed = valid.filter((l) => done.has(l.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    // Project Progress aggregation. Both count ONLY required build tasks so
    // optional tasks never block a release/feature from reaching 100%. These
    // read the project build-task list + the completed-id list and are pure,
    // mirroring calculateProgress. They are independent of course completion.
    function calculateReleaseProgress(buildTasks, completedTaskIds, releaseId) {
      const done = new Set(completedTaskIds);
      const required = (buildTasks || []).filter((t) => t.required !== false && t.releaseId === releaseId);
      const total = required.length;
      const completed = required.filter((t) => done.has(t.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function calculateFeatureProgress(buildTasks, completedTaskIds, featureId) {
      const done = new Set(completedTaskIds);
      const required = (buildTasks || []).filter(
        (t) => t.required !== false && (t.featureIds || []).includes(featureId)
      );
      const total = required.length;
      const completed = required.filter((t) => done.has(t.id)).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { completed, total, percent };
    }

    function nextLessonId(lessons, currentId, delta) {
      const index = lessons.findIndex((l) => l.id === currentId);
      if (index === -1) return null;
      const next = index + delta;
      if (next < 0 || next >= lessons.length) return null;
      return lessons[next].id;
    }

    // ---- P1: Course <-> Project Map ------------------------------------
    // Derives one row per lesson (in authored lesson order) describing how
    // that lesson relates to the project, without mutating either input.
    // `lessonMap` is the plain object keyed by lesson id (courseData shape),
    // not a Map, so this stays pure/serializable across the node:vm test
    // boundary. Lessons absent from lessonMap are "unmapped" (day-39-64
    // style aggregated lessons) — a UI-only fourth category, never an error.
    function deriveMapRows(lessons, lessonMap) {
      const map = lessonMap || {};
      return (lessons || []).map((lesson) => {
        const entry = map[lesson.id];
        const applicationType = entry ? (entry.applicationType || "theory") : "unmapped";
        return {
          id: lesson.id,
          title: lesson.title,
          group: lesson.group,
          unitId: lesson.unitId,
          applicationType,
          releaseId: entry ? (entry.releaseId || null) : null,
          featureIds: entry ? (entry.featureIds || []) : [],
        };
      });
    }

    // Client-side filter over deriveMapRows() output. Theory and Unmapped
    // share one filter bucket ("theory-unmapped") to keep the filter UI to
    // four buttons, but each row still carries its own precise
    // applicationType so direct/future/theory/unmapped stay visually
    // distinct — the filter groups them, it does not merge the data.
    function filterMapRows(rows, typeFilter, releaseFilter) {
      const tf = typeFilter || "all";
      const rf = releaseFilter || "all";
      return (rows || []).filter((row) => {
        if (tf === "direct" && row.applicationType !== "direct") return false;
        if (tf === "future" && row.applicationType !== "future") return false;
        if (tf === "theory-unmapped" && row.applicationType !== "theory" && row.applicationType !== "unmapped") return false;
        if (rf !== "all" && row.releaseId !== rf) return false;
        return true;
      });
    }

    // ---- P1: Domain Overview --------------------------------------------
    // Union+dedup of features[].domainEntities, alphabetically ordered, each
    // paired with the feature ids that reference it. Never hardcodes entity
    // names — entities are entirely derived from authored feature data.
    function deriveDomainEntities(features) {
      const byEntity = {};
      (features || []).forEach((feature) => {
        (feature.domainEntities || []).forEach((name) => {
          if (!byEntity[name]) byEntity[name] = { entity: name, featureIds: [] };
          if (!byEntity[name].featureIds.includes(feature.id)) byEntity[name].featureIds.push(feature.id);
        });
      });
      return Object.keys(byEntity).sort().map((name) => byEntity[name]);
    }

    // ---- P1: Architecture Evolution -------------------------------------
    // Joins releases to their architectureStage (by releaseId) and orders
    // the pairs by release.order — the single source of sequencing, never a
    // hardcoded narrative. Releases without an authored stage are omitted.
    function orderArchitectureStages(releases, architectureStages) {
      const stageByRelease = {};
      (architectureStages || []).forEach((stage) => { stageByRelease[stage.releaseId] = stage; });
      return (releases || [])
        .slice()
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
        .map((release) => ({ release, stage: stageByRelease[release.id] || null }))
        .filter((pair) => pair.stage);
    }

    // ---- P1: Richer Roadmap ----------------------------------------------
    // Groups releases under their authored milestone (via milestone.releaseIds),
    // in milestone/release order, with any release not covered by a milestone
    // trailing in an "ungrouped" bucket — a defensive fallback, not a data
    // requirement, so the roadmap never silently drops a release.
    function groupReleasesByMilestone(releases, milestones) {
      const releaseById = {};
      (releases || []).forEach((r) => { releaseById[r.id] = r; });
      const used = {};
      const groups = (milestones || []).map((milestone) => {
        const rels = (milestone.releaseIds || [])
          .map((id) => { used[id] = true; return releaseById[id]; })
          .filter(Boolean)
          .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
        return { milestone, releases: rels };
      });
      const ungrouped = (releases || [])
        .filter((r) => !used[r.id])
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
      if (ungrouped.length) groups.push({ milestone: null, releases: ungrouped });
      groups.sort((a, b) => {
        const ao = a.releases.length ? a.releases[0].order : Infinity;
        const bo = b.releases.length ? b.releases[0].order : Infinity;
        return ao - bo;
      });
      return groups;
    }

    const STATE_VERSION = 2;

    function defaultState() {
      return {
        version: STATE_VERSION,
        completed: [],
        lastLessonId: null,
        practice: {},
        collapsedUnits: [],
        theme: "system",
        // Project Progress is tracked independently of Course Progress:
        // completed[] is lesson completion; projectProgress.buildTasks[] is
        // Spendwise build-task completion. Completing a lesson never touches
        // this list, and vice versa.
        projectProgress: { buildTasks: [] },
      };
    }

    function sanitizeState(input, validLessonIds, validUnitIds, validPracticeKeys, validBuildTaskIds = new Set()) {
      const fresh = defaultState();
      if (!input || typeof input !== "object" || Array.isArray(input)) return fresh;
      const out = { ...fresh };

      if (Array.isArray(input.completed)) {
        out.completed = [...new Set(input.completed.filter((id) => validLessonIds.has(id)))];
      }
      if (typeof input.lastLessonId === "string" && validLessonIds.has(input.lastLessonId)) {
        out.lastLessonId = input.lastLessonId;
      }
      if (input.practice && typeof input.practice === "object" && !Array.isArray(input.practice)) {
        for (const key of Object.keys(input.practice)) {
          if (validPracticeKeys.has(key)) out.practice[key] = input.practice[key];
        }
      }
      if (Array.isArray(input.collapsedUnits)) {
        out.collapsedUnits = [...new Set(input.collapsedUnits.filter((id) => validUnitIds.has(id)))];
      }
      if (input.theme === "light" || input.theme === "dark" || input.theme === "system") {
        out.theme = input.theme;
      }
      // Project Progress. A fresh, independent object each call so course
      // fields can never share state with it. A v1 state (no projectProgress)
      // migrates by simply keeping course fields and starting an empty build
      // list; version is always normalized to the current STATE_VERSION.
      out.projectProgress = { buildTasks: [] };
      const pp = input.projectProgress;
      if (pp && typeof pp === "object" && !Array.isArray(pp) && Array.isArray(pp.buildTasks)) {
        out.projectProgress.buildTasks = [...new Set(pp.buildTasks.filter((id) => validBuildTaskIds.has(id)))];
      }
      return out;
    }

    function searchLessons(lessons, units, query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const unitTitleById = new Map(units.map((u) => [u.id, u.title]));
      return lessons.filter((lesson) => {
        const haystacks = [
          lesson.title,
          lesson.summary,
          ...(lesson.outcomes || []),
          unitTitleById.get(lesson.unitId) || "",
          ...(lesson.sections || []).map((s) => s.title),
        ];
        return normalizeSearch(haystacks.join(" \n ")).includes(q);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const SAFE_URL_PROTOCOLS = new Set(["http:", "https:", "mailto:"]);

    function safeExternalUrl(value) {
      if (typeof value !== "string") return null;
      try {
        const parsed = new URL(value);
        return SAFE_URL_PROTOCOLS.has(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    /* Exposed for node:vm tests and self-test mode. */
    globalThis.CourseCore = Object.freeze({
      normalizeSearch, parseRoute, calculateProgress, nextLessonId,
      sanitizeState, searchLessons, defaultState, STATE_VERSION,
      escapeHtml, safeExternalUrl,
      selectCurrentRelease, selectNextBuildTask,
      calculateReleaseProgress, calculateFeatureProgress,
      deriveMapRows, filterMapRows, deriveDomainEntities,
      orderArchitectureStages, groupReleasesByMilestone,
    });
    /* COURSE_CORE_END */

    /* ============================================================
       App bootstrap: data parse, indices, shell rendering, routing,
       curriculum navigation, dashboard, search panel (Site Task 3).
       ============================================================ */
    (function () {
      /* ---- data parse ------------------------------------------------ */
      let courseData;
      try {
        courseData = JSON.parse(document.getElementById("course-data").textContent);
      } catch(e) {
        document.getElementById("app").innerHTML = '<pre style="padding:2rem;color:red;">Loi tai du lieu khoa hoc.</pre>';
        throw e;
      }
      const lessonsById = new Map(courseData.lessons.map(function(l){return [l.id,l];}));
      const unitsById = new Map(courseData.units.map(function(u){return [u.id,u];}));

      /* ---- project data layer (Spendwise) ---------------------------- */
      // The project artifact is optional: the course renders fully without it.
      // All Spendwise content lives here in the data layer (never hard-coded),
      // indexed by stable id so the renderer can look up releases/features/
      // build tasks and the curriculum->project mapping on demand.
      var projectData = (courseData && courseData.project) ? courseData.project : null;
      var releasesById = new Map();
      var featuresById = new Map();
      var buildTasksById = new Map();
      var archStageByReleaseId = new Map();
      var projectByLessonId = new Map();
      if (projectData) {
        (projectData.releases || []).forEach(function(r){ releasesById.set(r.id, r); });
        (projectData.features || []).forEach(function(f){ featuresById.set(f.id, f); });
        (projectData.buildTasks || []).forEach(function(t){ buildTasksById.set(t.id, t); });
        (projectData.architectureStages || []).forEach(function(s){ archStageByReleaseId.set(s.releaseId, s); });
        var lessonMap = projectData.lessonMap || {};
        Object.keys(lessonMap).forEach(function(k){ projectByLessonId.set(k, lessonMap[k]); });
      }
      var BUILD_TASK_IDS = new Set(buildTasksById.keys());

      /* ---- state ----------------------------------------------------- */
      var STORAGE_KEY = 'java-spring-course';
      var state = CourseCore.defaultState();
      var LESSON_IDS = new Set(courseData.lessons.map(function(l){return l.id;}));
      var UNIT_IDS = new Set(courseData.units.map(function(u){return u.id;}));
      var PRACTICE_IDS = new Set(courseData.lessons.reduce(function(acc, l) {
        (l.practices || []).forEach(function(p) { acc.push(p.id); });
        return acc;
      }, []));
      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? CourseCore.sanitizeState(JSON.parse(raw), LESSON_IDS, UNIT_IDS, PRACTICE_IDS, BUILD_TASK_IDS) : null;
        } catch(e) { return null; }
      }
      function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
      var loaded = loadState();
      if (loaded) state = loaded;

      // Toggle a Spendwise build task's completion. This mutates ONLY
      // projectProgress.buildTasks — course completion (state.completed) is
      // never touched here, keeping the two progress tracks independent.
      function toggleBuildTask(taskId) {
        if (!BUILD_TASK_IDS.has(taskId)) return false;
        if (!state.projectProgress || typeof state.projectProgress !== 'object') {
          state.projectProgress = { buildTasks: [] };
        }
        if (!Array.isArray(state.projectProgress.buildTasks)) {
          state.projectProgress.buildTasks = [];
        }
        var list = state.projectProgress.buildTasks;
        var idx = list.indexOf(taskId);
        if (idx === -1) { list.push(taskId); } else { list.splice(idx, 1); }
        saveState();
        return idx === -1;
      }

      /* ---- render helpers -------------------------------------------- */
      function updateProgress() {
        var p = CourseCore.calculateProgress(courseData.lessons, state.completed, null);
        var bar = document.getElementById('progress-bar');
        if (bar) { bar.value = String(p.completed); bar.setAttribute('max', String(p.total || 1)); }
        var short = document.querySelector('.progress-text-short');
        if (short) short.textContent = p.percent + '%';
        var txt = document.querySelector('.progress-text-long');
        if (txt) txt.textContent = p.completed + '/' + p.total + ' bài';
      }
      function setAriaCurrent(id) {
        document.querySelectorAll('.lesson-link[aria-current]').forEach(function(a){a.removeAttribute('aria-current');});
        var link = document.querySelector('.lesson-link[data-lesson-id="' + id + '"]');
        if (link) link.setAttribute('aria-current', 'page');
      }
      function updateNavActive(view) {
        /* Release Detail has no primary-nav destination of its own — it is
           only ever reached by drilling into a release from the Roadmap
           tab — so it inherits Roadmap's active state rather than leaving
           every tab dark while the learner is still inside that section.
           Map and Architecture are likewise sub-views of the Project Track
           (they are only reachable from the project sub-nav), so they keep
           the "Dự án" tab lit instead of dropping the wayfinding cue
           entirely; the sub-nav then shows the precise position. */
        var navView = view === 'release' ? 'roadmap'
          : view === 'lesson' ? 'dashboard'
          : view === 'map' || view === 'architecture' ? 'project'
          : view;
        document.querySelectorAll('.primary-nav [data-view]').forEach(function(link) {
          link.removeAttribute('aria-current');
          if (link.getAttribute('data-view') === navView) link.setAttribute('aria-current', 'page');
        });
      }

      function projectCompletedTaskIds() {
        return state.projectProgress && Array.isArray(state.projectProgress.buildTasks)
          ? state.projectProgress.buildTasks
          : [];
      }

      function currentProjectRelease() {
        return projectData ? CourseCore.selectCurrentRelease(projectData.releases || []) : null;
      }

      function currentProjectMilestone(releaseId) {
        if (!projectData || !releaseId) return null;
        return (projectData.milestones || []).find(function(milestone) {
          return (milestone.releaseIds || []).indexOf(releaseId) !== -1;
        }) || null;
      }

      function releaseDisplay(release) {
        return release ? release.version + ' — ' + release.title : '';
      }

      function appendStatusBadge(container, status) {
        container.appendChild(el('span', 'project-status project-status--' + status, status));
      }

      // Personal build progress for one release. Four releases legitimately
      // carry no build tasks yet, and calculateReleaseProgress reports those
      // as 0/0 · 0% — a number that reads like "nothing done" rather than
      // "nothing to do". Mirror createFeatureProgress and state the honest
      // reason instead of drawing an empty bar.
      function createProjectProgress(release, label) {
        var progress = CourseCore.calculateReleaseProgress(
          (projectData && projectData.buildTasks) || [],
          projectCompletedTaskIds(),
          release ? release.id : null
        );
        var text = label || 'Project Progress';
        var wrap = el('div', 'project-progress');
        wrap.appendChild(el('span', 'project-progress-label', text));
        if (!progress.total) {
          wrap.appendChild(el('span', 'project-progress-note', 'Chưa có build task để theo dõi'));
          return wrap;
        }
        wrap.appendChild(el('span', 'project-progress-count', progress.completed + '/' + progress.total + ' · ' + progress.percent + '%'));
        var bar = el('progress');
        bar.max = Math.max(progress.total, 1);
        bar.value = progress.completed;
        bar.setAttribute('aria-label', text + ': ' + progress.completed + '/' + progress.total + ', ' + progress.percent + '%');
        bar.textContent = progress.percent + '%';
        wrap.appendChild(bar);
        return wrap;
      }

      // ASCII architecture diagrams are meaningful content, not decoration:
      // the <pre> keeps its text in the accessibility tree and gains a
      // figure role + name saying which stage it belongs to, because a bare
      // <pre> is announced without any context by a screen reader.
      function createArchitectureDiagram(diagram, label) {
        var pre = el('pre', null, diagram);
        pre.setAttribute('role', 'figure');
        pre.setAttribute('aria-label', label);
        return pre;
      }

      function appendFeatureList(container, featureIds) {
        var features = (featureIds || []).map(function(id) { return featuresById.get(id); }).filter(Boolean);
        if (!features.length) return;
        var list = el('ul', 'feature-list');
        features.forEach(function(feature) { list.appendChild(el('li', null, feature.name)); });
        container.appendChild(list);
      }

      // Per-feature progress widget for the richer Release Detail feature
      // cards. calculateFeatureProgress only counts required tasks; a
      // feature with none tracked yet gets an honest "not tracked" note
      // instead of a fake 0/0 bar.
      function createFeatureProgress(feature) {
        var progress = CourseCore.calculateFeatureProgress(
          (projectData && projectData.buildTasks) || [],
          projectCompletedTaskIds(),
          feature.id
        );
        if (!progress.total) {
          return el('p', 'feature-progress-empty', 'No tracked build task yet');
        }
        var wrap = el('div', 'project-progress project-progress--feature');
        wrap.appendChild(el('span', 'project-progress-count', progress.completed + '/' + progress.total + ' · ' + progress.percent + '%'));
        var bar = el('progress');
        bar.max = Math.max(progress.total, 1);
        bar.value = progress.completed;
        bar.setAttribute('aria-label', feature.name + ' progress: ' + progress.completed + '/' + progress.total + ', ' + progress.percent + '%');
        bar.textContent = progress.percent + '%';
        wrap.appendChild(bar);
        return wrap;
      }

      // Richer feature cards used by Release Detail: name, description,
      // domainEntities and per-feature progress — appendFeatureList above
      // stays the plain-name version already used inside lesson pages.
      function appendFeatureDetailList(container, featureIds) {
        var features = (featureIds || []).map(function(id) { return featuresById.get(id); }).filter(Boolean);
        if (!features.length) { container.appendChild(el('p', null, 'Chưa có feature nào gắn với release này.')); return; }
        var list = el('div', 'feature-detail-list');
        features.forEach(function(feature) {
          var card = el('article', 'feature-card');
          card.appendChild(el('h3', null, feature.name));
          if (feature.description) card.appendChild(el('p', null, feature.description));
          if ((feature.domainEntities || []).length) {
            var entRow = el('div', 'feature-entities');
            entRow.appendChild(el('span', 'feature-entities-label', 'Entities: '));
            entRow.appendChild(document.createTextNode(feature.domainEntities.join(', ')));
            card.appendChild(entRow);
          }
          card.appendChild(createFeatureProgress(feature));
          list.appendChild(card);
        });
        container.appendChild(list);
      }

      function createBuildTaskItem(task) {
        var done = projectCompletedTaskIds().indexOf(task.id) !== -1;
        var item = el('article', 'build-task' + (done ? ' build-task--done' : ''));
        var toggle = el('button', 'build-task-toggle');
        toggle.type = 'button';
        toggle.setAttribute('data-action', 'toggle-build-task');
        toggle.setAttribute('data-task-id', task.id);
        toggle.setAttribute('aria-pressed', done ? 'true' : 'false');
        toggle.setAttribute('aria-label', (done ? 'Đánh dấu chưa hoàn thành: ' : 'Đánh dấu hoàn thành: ') + task.title);
        toggle.innerHTML = icon('check');
        toggle.addEventListener('click', function() {
          var completed = toggleBuildTask(task.id);
          toggle.setAttribute('aria-pressed', completed ? 'true' : 'false');
          toggle.setAttribute('aria-label', (completed ? 'Đánh dấu chưa hoàn thành: ' : 'Đánh dấu hoàn thành: ') + task.title);
          item.classList.toggle('build-task--done', completed);
          showToast(completed ? 'Đã hoàn thành build task' : 'Đã mở lại build task');
          routeRender();
        });
        item.appendChild(toggle);
        var body = el('div');
        var title = el('div', 'build-task-title');
        title.appendChild(el('span', null, task.title));
        title.appendChild(el('span', 'task-kind', task.required === false ? 'optional' : 'required'));
        body.appendChild(title);
        if (task.problem) body.appendChild(el('div', 'build-task-meta', task.problem));
        if (task.goal) body.appendChild(el('div', 'build-task-meta', 'Goal: ' + task.goal));
        item.appendChild(body);
        return item;
      }

      function appendBuildTaskList(container, taskIds) {
        var tasks = (taskIds || []).map(function(id) { return buildTasksById.get(id); }).filter(Boolean);
        if (!tasks.length) return;
        var list = el('div', 'build-task-list');
        tasks.forEach(function(task) { list.appendChild(createBuildTaskItem(task)); });
        container.appendChild(list);
      }

      // Appends an optional, compact-by-default disclosure onto a build task
      // <article> with constraints / acceptance criteria / relevant lessons
      // (resolved to real #lesson/<id> links, not raw ids). Reuses the same
      // disclosureButton/wireDisclosure accordion pattern used elsewhere.
      // No-op when a task has none of these authored, so plain tasks stay flat.
      function appendBuildTaskDetails(item, task) {
        var hasConstraints = (task.constraints || []).length > 0;
        var hasCriteria = (task.acceptanceCriteria || []).length > 0;
        var lessons = (task.relevantLessonIds || []).map(function(id) { return lessonsById.get(id); }).filter(Boolean);
        if (!hasConstraints && !hasCriteria && !lessons.length) return;
        var panelId = 'build-task-detail-' + task.id;
        var toggleBtn = disclosureButton('Chi tiết', panelId, 'chevron-down');
        toggleBtn.classList.add('build-task-detail-toggle');
        var panel = el('div', 'build-task-detail');
        panel.id = panelId;
        panel.hidden = true;
        if (hasConstraints) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Constraints'));
          var cList = el('ul');
          task.constraints.forEach(function(c) { cList.appendChild(el('li', null, c)); });
          panel.appendChild(cList);
        }
        if (hasCriteria) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Acceptance Criteria'));
          var aList = el('ul');
          task.acceptanceCriteria.forEach(function(c) { aList.appendChild(el('li', null, c)); });
          panel.appendChild(aList);
        }
        if (lessons.length) {
          panel.appendChild(el('div', 'build-task-detail-label', 'Relevant Lessons'));
          var lList = el('ul');
          lessons.forEach(function(lesson) {
            var li = el('li');
            var a = el('a', 'text-link', lesson.title);
            a.href = '#lesson/' + lesson.id;
            li.appendChild(a);
            lList.appendChild(li);
          });
          panel.appendChild(lList);
        }
        wireDisclosure(toggleBtn, panel);
        item.appendChild(toggleBtn);
        item.appendChild(panel);
      }

      function createExpandableBuildTaskItem(task) {
        var item = createBuildTaskItem(task);
        item.classList.add('build-task--expandable');
        appendBuildTaskDetails(item, task);
        return item;
      }

      // Used by Release Detail's Build Tasks section and the Build Tasks
      // Workspace — both reuse createBuildTaskItem/toggleBuildTask (single
      // shared completion state), only adding the expandable detail panel.
      function appendExpandableBuildTaskList(container, taskIds) {
        var tasks = (taskIds || []).map(function(id) { return buildTasksById.get(id); }).filter(Boolean);
        if (!tasks.length) return;
        var list = el('div', 'build-task-list');
        tasks.forEach(function(task) { list.appendChild(createExpandableBuildTaskItem(task)); });
        container.appendChild(list);
      }

      // Project-scoped sub-navigation shown under the workspace header on
      // every project-track view. Keeps #/map and #/architecture reachable
      // without adding two more items to the always-visible primary nav
      // (which would crowd the 390px fixed bottom tab bar) — this pill row
      // wraps instead of clipping on narrow viewports.
      function renderProjectSubNav(container, activeView) {
        var nav = el('nav', 'project-subnav');
        nav.setAttribute('aria-label', 'Điều hướng Project Track');
        [
          { view: 'project', href: '#/project', label: 'Tổng quan' },
          /* "Lộ trình release", not a bare "Lộ trình": the primary nav
             already has a top-level "Lộ trình" tab pointing at this same
             route, and an unqualified repeat inside the project sub-nav
             reads like a second, project-scoped roadmap. The qualifier
             matches this destination's own header ("Release Roadmap"). */
          { view: 'roadmap', href: '#/roadmap', label: 'Lộ trình release' },
          { view: 'map', href: '#/map', label: 'Bản đồ' },
          { view: 'architecture', href: '#/architecture', label: 'Kiến trúc' },
        ].forEach(function(item) {
          var link = el('a', null, item.label);
          link.href = item.href;
          link.setAttribute('data-subview', item.view);
          if (item.view === activeView) link.setAttribute('aria-current', 'page');
          nav.appendChild(link);

        container.appendChild(nav);
        return nav;
      }

      function renderProjectEmpty(container) {
        var empty = el('section', 'project-empty');
        empty.appendChild(el('h1', null, 'Project track chưa sẵn sàng'));
        empty.appendChild(el('p', null, 'Dữ liệu project chưa có trong bản build này. Learning Track vẫn hoạt động bình thường.'));
        container.appendChild(empty);
      }

      /* ---- curriculum nav ------------------------------------------- */
      function renderSidebar() {
        var nav = document.getElementById('curriculum-nav');
        if (!nav) return;
        nav.textContent = '';
        var GROUP_ORDER = ['java', 'spring', 'completion'];
        var ACCENT = {java:'var(--java)',spring:'var(--spring)',completion:'var(--completion)'};
        var ACCENT_SOFT = {java:'var(--java-soft)',spring:'var(--spring-soft)',completion:'var(--completion-soft)'};
        GROUP_ORDER.forEach(function(groupKey) {
          var units = courseData.units.filter(function(u){return u.group===groupKey;});
          if (!units.length) return;
          var label = document.createElement('div');
          label.className = 'group-label' + (groupKey === 'completion' ? '' : ' group-label--' + groupKey);
          label.textContent = GROUP_LABELS[groupKey] || groupKey;
          nav.appendChild(label);
          units.forEach(function(unit) {
            var lessonIds = unit.lessonIds || [];
            var doneCount = lessonIds.filter(function(lid){ return state.completed.indexOf(lid)!==-1; }).length;
            var collapsed = state.collapsedUnits.indexOf(unit.id) !== -1;
            var toggle = document.createElement('button');
            toggle.className = 'module-toggle';
            toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            toggle.setAttribute('aria-controls', 'lessons-' + unit.id);
            toggle.setAttribute('data-unit-id', unit.id);
            toggle.setAttribute('data-group', groupKey);
            toggle.title = unit.number + '. ' + unit.title;
            toggle.innerHTML = '<span class="module-toggle-label"><span class="module-num">' + unit.number + '</span>' +
              '<span class="module-toggle-title">' + unit.title + '</span></span>' +
              '<span class="module-progress">' + doneCount + '/' + lessonIds.length + '</span>' +
              '<span class="chevron" aria-hidden="true">' + icon('chevron-down') + '</span>';
            toggle.onclick = function() {
              var expanded = toggle.getAttribute('aria-expanded')==='true';
              toggle.setAttribute('aria-expanded', expanded?'false':'true');
              var list = document.getElementById('lessons-' + unit.id);
              if (list) list.hidden = expanded;
              if (expanded) { if (state.collapsedUnits.indexOf(unit.id)===-1) state.collapsedUnits.push(unit.id); }
              else { state.collapsedUnits = state.collapsedUnits.filter(function(x){return x!==unit.id;}); }
              saveState();
            };
            nav.appendChild(toggle);
            var list = document.createElement('ul');
            list.className = 'lesson-list';
            list.id = 'lessons-' + unit.id;
            list.setAttribute('role', 'list');
            list.hidden = collapsed;
            lessonIds.forEach(function(lid) {
              var lesson = lessonsById.get(lid);
              if (!lesson) return;
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.className = 'lesson-link';
              a.href = '#lesson/' + lid;
              a.setAttribute('data-lesson-id', lid);
              a.title = lesson.title || lid;
              a.style.setProperty('--accent', ACCENT[lesson.group] || ACCENT.completion);
              a.style.setProperty('--accent-soft', ACCENT_SOFT[lesson.group] || ACCENT_SOFT.completion);
              var done = state.completed.indexOf(lid) !== -1;
              a.innerHTML = '<span class="lesson-state" data-done="' + done + '">' + (done ? icon('check') : '') + '</span>' +
                '<span class="lesson-link-title">' + (done ? '<span class="visually-hidden">Đã hoàn thành: </span>' : '') + (lesson.title || lid) + '</span>';
              a.onclick = function() { closeDrawer(); };
              li.appendChild(a);
              list.appendChild(li);

            nav.appendChild(list);

        });
        setAriaCurrent(state.lastLessonId);

      /* ---- route render ---------------------------------------------- */
      function routeRender() {
        var route = CourseCore.parseRoute(window.location.hash);
        var view = document.getElementById('route-view');
        if (!view) return;
        view.textContent = '';
        view.classList.toggle('route-view--reading', route.view === 'lesson');
        updateNavActive(route.view);
        if (route.view === 'lesson') renderLessonView(view, route.lessonId);
        else if (route.view === 'resources') renderResourcesView(view);
        else if (route.view === 'project') renderProjectOverview(view);
        else if (route.view === 'roadmap') renderRoadmap(view);
        else if (route.view === 'release') renderReleaseDetail(view, route.releaseId);
        else if (route.view === 'map') renderCourseProjectMap(view);
        else if (route.view === 'architecture') renderArchitecture(view);
        else renderDashboard(view);
        setAriaCurrent(route.lessonId || state.lastLessonId);
      }
      window.addEventListener('hashchange', function() {
        /* In-page anchors (citation links like #ref-day01-2) target
           elements that already exist in the current view — let the
           browser perform its native anchor scroll and skip re-render. */
        var anchorId = window.location.hash.replace(/^#/, '');
        if (anchorId && document.getElementById(anchorId)) return;
        routeRender();
        /* Hash-only SPA navigation never triggers the browser's native
           scroll-to-top, so moving between lessons (sidebar, Bài trước/
           Bài sau) used to keep the previous scroll position. Jump
           instantly — the smooth scroll-behavior on <html> would animate
           through the freshly rendered content. */
        var htmlEl = document.documentElement;
        var prevBehavior = htmlEl.style.scrollBehavior;
        htmlEl.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        htmlEl.style.scrollBehavior = prevBehavior;
      });

      /* ---- settings: export / import / reset (Site Task 5) -------------- */
      var APP_SCHEMA = { app: "java-spring-course", schemaVersion: 2 };
      // Import accepts the current schema and every older one it can migrate:
      // a v1 export (course progress only) is upgraded by sanitizeState, which
      // fills in an empty projectProgress. This keeps old backups importable.
      var SUPPORTED_IMPORT_VERSIONS = new Set([1, 2]);

      function downloadProgress() {
        var payload = {
          app: APP_SCHEMA.app,
          schemaVersion: APP_SCHEMA.schemaVersion,
          exportedAt: new Date().toISOString(),
          state: state,
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = el("a");
        a.href = url;
        a.download = "java-spring-course-tien-do.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        showToast("Đã tải tệp tiến độ");
      }

      function importProgressText(text, previewEl, confirmBtn) {
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không phải JSON hợp lệ.";
          return;
        }
        if (!parsed || parsed.app !== APP_SCHEMA.app ||
            typeof parsed.schemaVersion !== "number" || !SUPPORTED_IMPORT_VERSIONS.has(parsed.schemaVersion)) {
          previewEl.hidden = false;
          previewEl.textContent = "Tệp không đúng định dạng tiến độ của khóa học (app/schemaVersion không khớp).";
          return;
        }
        var cleaned = CourseCore.sanitizeState(parsed.state, LESSON_IDS, UNIT_IDS, PRACTICE_IDS, BUILD_TASK_IDS);
        previewEl.hidden = false;
        previewEl.textContent = "Sẵn sàng nhập: " + cleaned.completed.length + "/" + courseData.lessons.length +
          " bài đã hoàn thành. Nhấn “Xác nhận nhập” để thay thế tiến độ hiện tại.";
        confirmBtn.hidden = false;
        confirmBtn.onclick = function() {
          state = cleaned;
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          previewEl.textContent = "Đã nhập tiến độ thành công.";
          confirmBtn.hidden = true;
          showToast("Tiến độ đã được nhập");
        };
      }

      function renderSettingsBlock(container) {
        var block = el("div", "settings-block");
        var details = el("details");
        details.appendChild(el("summary", null, "Cài đặt dữ liệu học tập"));
        var actions = el("div", "settings-actions");

        var exportBtn = el("button", "settings-btn");
        exportBtn.innerHTML = icon("download") + '<span>Tải tiến độ (.json)</span>';
        exportBtn.type = "button";
        exportBtn.setAttribute("data-action", "export-progress");
        exportBtn.addEventListener("click", downloadProgress);
        actions.appendChild(exportBtn);

        var importLabel = el("label", "settings-btn");
        importLabel.innerHTML = icon("upload") + '<span>Nhập tiến độ (.json)</span>';
        var fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".json,application/json";
        fileInput.style.display = "none";
        importLabel.appendChild(fileInput);

        var resetBtn = el("button", "settings-btn settings-btn--danger");
        resetBtn.innerHTML = icon("refresh-cw") + '<span>Đặt lại tiến độ</span>';
        resetBtn.type = "button";
        resetBtn.setAttribute("data-action", "reset-progress");

        var preview = el("div", "import-preview");
        preview.hidden = true;
        var confirmBtn = el("button", "settings-btn");
        confirmBtn.innerHTML = icon("check") + '<span>Xác nhận nhập</span>';
        confirmBtn.type = "button";
        confirmBtn.hidden = true;

        fileInput.addEventListener("change", function() {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { importProgressText(String(reader.result), preview, confirmBtn); };
          reader.onerror = function() {
            preview.hidden = false;
            preview.textContent = "Không đọc được tệp đã chọn.";
          };
          reader.readAsText(file);
          fileInput.value = "";
        });

        resetBtn.addEventListener("click", function() {
          if (!window.confirm("Đặt lại toàn bộ tiến độ? Hành động này xóa trạng thái hoàn thành khóa học, tiến độ build project, bài đang học và cài đặt giao diện đã lưu trên máy bạn.")) return;
          state = CourseCore.defaultState();
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          saveState();
          applyTheme(state.theme);
          updateProgress();
          renderSidebar();
          routeRender();
          showToast("Đã đặt lại tiến độ");
        });

        details.appendChild(actions);
        details.appendChild(preview);
        details.appendChild(confirmBtn);
        block.appendChild(details);
        container.appendChild(block);
      }

        citations.forEach(function(cid, i) {
          var key = String(cid).toLowerCase();
          var idx = refIndexById.get(key);
          var a = el("a", "citation-link", "[" + (idx != null ? idx : "?") + "]");
          a.href = "#ref-" + lessonIdSlug(currentLessonId) + "-" + (idx != null ? idx : key);
          a.setAttribute("aria-label", "Nguồn tham chiếu " + (idx != null ? idx : cid));
          parent.appendChild(a);
          if (i < citations.length - 1) parent.appendChild(document.createTextNode(" "));
        });
      }

      function proseParagraph(text, citations, refIndexById) {
        var p = el("p");
        p.appendChild(document.createTextNode(text == null ? "" : String(text)));
        appendCitations(p, citations, refIndexById);
        return p;
      }

      function renderBlock(container, block, refIndexById) {
        var type = block.type;
        if (ALLOWED_BLOCK_TYPES.indexOf(type) === -1) {
          container.appendChild(el("div", "authoring-warning",
            "[Cảnh báo biên soạn] Khối nội dung không hỗ trợ: \"" + type + "\" — đã ẩn để tránh hiển thị sai."));
          return;
        }
        if (type === "code") {
          var fig = el("figure", "code-sample");
          var cap = el("figcaption");
          cap.appendChild(el("span", null, block.language ? block.language.toUpperCase() + (block.compile === false && block.partialReason ? " — không biên dịch độc lập" : "") : ""));
          var copyBtn = el("button", "copy-btn");
          copyBtn.innerHTML = icon("copy") + '<span>Sao chép mã</span>';
          copyBtn.type = "button";
          copyBtn.setAttribute("data-action", "copy-code");
          copyBtn.setAttribute("aria-label", "Sao chép mã mẫu vào clipboard");
          copyBtn.addEventListener("click", function() {
            copyText(block.code || "").then(function() { showToast("Đã sao chép mã"); },
              function() { showToast("Không thể sao chép tự động — hãy chọn mã và sao chép thủ công."); });
          });
          cap.appendChild(copyBtn);
          fig.appendChild(cap);
          var pre = el("pre");
          pre.appendChild(el("code", null, block.code || ""));
          fig.appendChild(pre);
          container.appendChild(fig);
          return;
        }
        if (type === "table") {
          var wrap = el("div", "data-table-wrap");
          var table = el("table", "data-table");
          var cols = block.columns || [];
          table.appendChild(el("caption", null, cols.join(" · ")));
          var thead = el("thead");
          var hr = el("tr");
          cols.forEach(function(c) { hr.appendChild(el("th", null, c)); });
          thead.appendChild(hr);
          table.appendChild(thead);
          var tbody = el("tbody");
          (block.rows || []).forEach(function(row) {
            var tr = el("tr");
            row.forEach(function(cell, ci) {
              var td = el(ci < cols.length - 1 ? "td" : "td");
              td.appendChild(document.createTextNode(cell == null ? "" : String(cell)));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          wrap.appendChild(table);
          container.appendChild(wrap);
          return;
        }
        if (type === "note" || type === "important" || type === "warning" || type === "deliverable") {
          var aside = el("aside", "callout " + (CALLOUT_CLASS[type] || ""));
          aside.setAttribute("role", type === "warning" ? "alert" : "note");
          var calloutIcon = el("span", "callout-icon");
          calloutIcon.setAttribute("aria-hidden", "true");
          calloutIcon.innerHTML = icon(CALLOUT_ICON[type] || "info");
          aside.appendChild(calloutIcon);
          var calloutBody = el("div", "callout-body");
          var head = el("div", "callout-head");
          head.appendChild(el("strong", "callout-label", CALLOUT_LABEL[type] || ""));
          calloutBody.appendChild(head);
          /* Deliverable text is often an authored multi-line bullet list — preserve line breaks. */
          if (type === "deliverable") {
            var body = el("span", "deliverable-body");
            body.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
            calloutBody.appendChild(body);
          } else {
            calloutBody.appendChild(document.createTextNode(block.text == null ? "" : String(block.text)));
          }
          appendCitations(calloutBody, block.citations, refIndexById);
          aside.appendChild(calloutBody);
          container.appendChild(aside);
          return;
        }
        /* paragraph */
        container.appendChild(proseParagraph(block.text, block.citations, refIndexById));
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).then(function() { return "clipboard"; });
        }
        return new Promise(function(resolve, reject) {
          var area = Object.assign(document.createElement("textarea"), { value: text });
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          area.remove();
          if (!ok) reject(new Error("copy unavailable")); else resolve("fallback");
        });
      }

      function showToast(message) {
        var region = document.getElementById("toast-region");
        if (!region) return;
        var t = el("div", "toast", message);
        region.appendChild(t);
        setTimeout(function() { t.remove(); }, 2600);
      }

      function renderSections(container, lesson, refIndexById) {
        (lesson.sections || []).forEach(function(section) {

      /* ---- practice cards --------------------------------------------- */
      function disclosureButton(label, panelId, iconName) {
        var b = el("button", "disclosure-btn");
        b.innerHTML = (iconName ? icon(iconName) : "") + "<span>" + label + "</span>";
        b.type = "button";
        b.setAttribute("aria-expanded", "false");
        b.setAttribute("aria-controls", panelId);
        return b;
      }

      function wireDisclosure(btn, panel) {
        btn.addEventListener("click", function() {
          var open = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", open ? "false" : "true");
          panel.hidden = open;
        });
      }

      function renderPractice(container, practice) {
        var card = el("article", "practice-card");
        card.id = "practice-" + practice.id;
        var head = el("div", "practice-head");
        var kindLabel = PRACTICE_KIND_LABELS[practice.type] || practice.type;
        if (practice.interaction === "multiple-choice") kindLabel += " · trắc nghiệm";
        head.appendChild(el("div", "practice-kind", kindLabel));
        head.appendChild(el("p", "practice-prompt", practice.prompt || ""));
        card.appendChild(head);

        var body = el("div", "practice-body");
        if (practice.starterCode) {
          var starter = el("div", "practice-starter");
          var pre = el("pre");
          pre.appendChild(el("code", null, practice.starterCode));
          starter.appendChild(pre);
          body.appendChild(starter);
        }

        var mc = practice.interaction === "multiple-choice";

        if (mc && practice.choices && practice.choices.length) {
          var isMulti = (practice.correctChoiceIds || []).length > 1;
          var fieldset = el("fieldset");
          fieldset.style.cssText = "margin:0 0 .625rem;padding:0;border:none;";
          var legend = el("legend", "visually-hidden", isMulti ? "Chọn nhiều đáp án" : "Chọn một đáp án");
          fieldset.appendChild(legend);
          var list = el("ul", "choice-list");
          practice.choices.forEach(function(choice) {
            var li = el("li", "choice-item");
            li.setAttribute("data-choice-id", choice.id);
            var input = document.createElement("input");
            input.type = isMulti ? "checkbox" : "radio";
            input.name = "choice-" + practice.id;
            input.value = choice.id;
            input.id = choice.id;
            var label = el("label");
            label.htmlFor = choice.id;
            label.appendChild(input);
            label.appendChild(el("span", null, choice.text));
            li.appendChild(label);
            list.appendChild(li);
          });
          fieldset.appendChild(list);
          body.appendChild(fieldset);

          var checkBtn = el("button", "disclosure-btn");
          checkBtn.innerHTML = icon("check") + "<span>Kiểm tra đáp án</span>";
          checkBtn.type = "button";
          checkBtn.setAttribute("data-action", "check-practice");
          checkBtn.setAttribute("data-practice-id", practice.id);
          body.appendChild(checkBtn);

          var fb = el("div", "check-feedback");
          fb.id = "feedback-" + practice.id;
          fb.hidden = true;
          body.appendChild(fb);

          checkBtn.addEventListener("click", function() {
            var picked = Array.prototype.slice.call(
              body.querySelectorAll('input[name="choice-' + practice.id + '"]:checked')
            ).map(function(inp) { return inp.value; });
            if (!picked.length) { showToast("Hãy chọn ít nhất một đáp án trước khi kiểm tra."); return; }
            var correct = new Set(practice.correctChoiceIds || []);
            var allCorrect = picked.length === correct.size && picked.every(function(id){ return correct.has(id); });
            /* mark per-choice correctness */
            body.querySelectorAll(".choice-item").forEach(function(li) {
              var cid = li.getAttribute("data-choice-id");
              li.classList.remove("is-correct", "is-wrong");
              if (correct.has(cid)) li.classList.add("is-correct");
              else if (picked.indexOf(cid) !== -1) li.classList.add("is-wrong");
            });
            fb.className = "check-feedback " + (allCorrect ? "ok" : "wrong");
            fb.textContent = (allCorrect ? "Chính xác! " : "Chưa đúng. ") + (practice.explanation || "");
            fb.hidden = false;
            /* persist attempted state */
            state.practice[practice.id] = { attempted: true };
            saveState();
          });
        }

        var actions = el("div", "practice-actions");
        if (practice.hint) {
          var hintPanelId = "hint-" + practice.id;
          var hintBtn = disclosureButton("Gợi ý", hintPanelId, "lightbulb");
          var hintPanel = el("div", "disclosure-panel");
          hintPanel.id = hintPanelId;
          hintPanel.hidden = true;
          hintPanel.textContent = practice.hint;
          actions.appendChild(hintBtn);
          body.appendChild(hintPanel);
          wireDisclosure(hintBtn, hintPanel);
        }
        if (practice.solution || (mc && practice.explanation)) {
          var solPanelId = "sol-" + practice.id;
          var solBtn = disclosureButton(mc ? "Xem giải thích" : "Xem lời giải", solPanelId, "book-open");
          var solPanel = el("div", "disclosure-panel");
          solPanel.id = solPanelId;
          solPanel.hidden = true;
          var solutionText = mc
            ? ((practice.correctChoiceIds || []).join(", ") + (practice.explanation ? " — " + practice.explanation : ""))
            : [practice.solution, practice.explanation].filter(Boolean).join("\n\n");
          solPanel.textContent = solutionText;
          actions.appendChild(solBtn);
          body.appendChild(solPanel);
          wireDisclosure(solBtn, solPanel);
        }
        if (actions.childNodes.length) { body.appendChild(actions); }
        card.appendChild(body);
        container.appendChild(card);
      }

      function renderPractices(container, lesson) {
        if (!lesson.practices || !lesson.practices.length) return;
        var blockEl = el("section", "section-block");
        blockEl.appendChild(el("h2", "section-heading", "Luyện tập"));
        lesson.practices.forEach(function(p) { renderPractice(blockEl, p); });
        container.appendChild(blockEl);
      }


      /* ---- assignments (syllabus original vs enrichment) --------------- */
      function renderAssignments(container, lesson) {
        var syllabus = lesson.syllabusAssignments || [];
        var enhanced = lesson.enhancedExercises || [];
        if (!syllabus.length && !enhanced.length) return;
        var blockEl = el("section", "assignments-block");
        if (syllabus.length) {
          blockEl.appendChild(el("h2", null, "Bài tập trong syllabus"));
          syllabus.forEach(function(a) {
            var item = el("div", "assignment-item");
            item.appendChild(el("span", "assignment-origin", "Nội dung gốc · dòng " + a.row));
            item.appendChild(document.createTextNode("\n" + (a.text || "")));
            blockEl.appendChild(item);
          });
        }
        if (enhanced.length) {
          blockEl.appendChild(el("h2", null, "Luyện tập bổ sung"));
          enhanced.forEach(function(text) {
            var item = el("div", "assignment-item");
            item.style.borderLeftColor = "var(--spring)";
            item.appendChild(el("span", "assignment-origin", "Bổ sung"));
            item.appendChild(document.createTextNode("\n" + text));
            blockEl.appendChild(item);
          });
