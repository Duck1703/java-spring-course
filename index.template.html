          });
          var primaryNavStillFour = document.querySelectorAll(".primary-nav [data-view]").length === 4;
          assert("project sub-nav marks the correct tab active on all 5 project views without growing the 4-item primary nav",
            subnavOk && primaryNavStillFour);

          /* 53 — a release carrying no build tasks must say so honestly
             instead of rendering 0/0 · 0% with an empty bar, which reads as
             "you have completed none of the work" rather than "there is no
             work tracked here yet". Releases that do have tasks keep the real
             count + <progress>.

             The empty case is driven by a SYNTHETIC release, not by finding a
             real one. Four releases (V0.7-V1.0) carry no tasks today, but they
             are authored in a later wave, after which no real release has an
             empty buildTaskIds — a `find(...)` for one then returns undefined
             and dereferencing `.id` throws a TypeError that the outer catch
             turns into a single opaque "self-test crashed" line for the whole
             harness. A synthetic release keeps this assertion meaningful in
             both eras and keeps the failure attributable to #53. */
          var syntheticEmptyRelease = { id: "release-selftest-no-tasks", version: "V9.9", order: 99 };
          var syntheticProgressEl = createProjectProgress(syntheticEmptyRelease, "Release Progress");
          var emptyProgressOk = !!syntheticProgressEl.querySelector(".project-progress-note") &&
            !syntheticProgressEl.querySelector(".project-progress-count") &&
            !syntheticProgressEl.querySelector("progress") &&
            syntheticProgressEl.textContent.indexOf("0/0") === -1;
          /* Any real release that is still unstocked must render that same
             honest note on its own detail route. Vacuous once every release
             owns tasks; never a crash, because an empty list simply loops zero
             times. */
          var realEmptyReleasesOk = (projectData.releases || [])
            .filter(function(r) { return (r.buildTaskIds || []).length === 0; })
            .every(function(r) {
              location.hash = "#/release/" + r.id;
              routeRender();
              var view = document.getElementById("route-view");
              var progressEl = view.querySelector(".project-progress");
              return !!progressEl &&
                !!progressEl.querySelector(".project-progress-note") &&
                !progressEl.querySelector(".project-progress-count") &&
                !progressEl.querySelector("progress") &&
                view.textContent.indexOf("0/0") === -1;
            });
          var stockedRelease = (projectData.releases || []).find(function(r) { return (r.buildTaskIds || []).length > 0; });
          location.hash = "#/release/" + stockedRelease.id;
          routeRender();
          var stockedProgressEl = document.getElementById("route-view").querySelector(".project-progress");
          var stockedProgressOk = !!stockedProgressEl &&
            !!stockedProgressEl.querySelector(".project-progress-count") &&
            !!stockedProgressEl.querySelector("progress") &&
            !stockedProgressEl.querySelector(".project-progress-note");
          location.hash = "#/roadmap";
          routeRender();
          var roadmapZeroOfZero = document.getElementById("route-view").textContent.indexOf("0/0") === -1;
          assert("releases with no tracked build task state that honestly instead of showing 0/0 · 0%, while stocked releases keep a real count and bar",
            emptyProgressOk && realEmptyReleasesOk && stockedProgressOk && roadmapZeroOfZero);

          /* 54 — Map and Architecture are Project Track sub-views reachable
             only from the project sub-nav, so the primary nav must keep the
             "Dự án" cue lit rather than leaving every tab dark (same
             reasoning as #41/#42 for release/lesson). */
          var inheritedNavOk = ["#/map", "#/architecture"].every(function(hash) {
            location.hash = hash;
            routeRender();
            var active = document.querySelectorAll('.primary-nav [data-view][aria-current="page"]');
            return active.length === 1 && active[0].getAttribute("data-view") === "project";
          });
          assert("Map and Architecture keep the Dự án primary-nav tab marked active instead of leaving the nav without a cue",
            inheritedNavOk && document.querySelectorAll(".primary-nav [data-view]").length === 4);

          /* 55 — Release Detail must render each release's ASCII diagram
             once, not twice: the Architecture Change comparison below the
             Architecture section already shows the same diagram as its
             After/Initial column. Every diagram <pre> also carries an
             accessible name naming its stage, since a bare <pre> of ASCII
             art is announced without any context. */
          var diagramCheck = ["v0-1", "v0-5"].every(function(id) {
            location.hash = "#/release/" + id;
            routeRender();
            var view = document.getElementById("route-view");
            var stageDiagram = archStageByReleaseId.get(id).diagram;
            var pres = Array.prototype.slice.call(view.querySelectorAll("pre"));
            var sameDiagram = pres.filter(function(p) { return p.textContent === stageDiagram; });
            var allLabelled = pres.every(function(p) {
              return p.getAttribute("role") === "figure" && (p.getAttribute("aria-label") || "").length > 0;
            });
            return sameDiagram.length === 1 && allLabelled;
          });
          assert("Release Detail renders each architecture diagram once and gives every diagram an accessible name",
            diagramCheck);

          /* 56 — the Architecture stage pills are in-page jump links, and
             the hashchange handler skips re-rendering for in-page anchors,
             so the active pill has to be updated on click or the learner
             loses track of which stage they are on. */
          location.hash = "#/architecture";
          routeRender();
          var archNavView = document.getElementById("route-view");
          var stagePills = archNavView.querySelectorAll(".architecture-stage-nav-link");
          var noPillActiveInitially = archNavView.querySelectorAll(".architecture-stage-nav-link[aria-current]").length === 0;
          var targetPill = stagePills[2];
          targetPill.click();
          var activePills = archNavView.querySelectorAll('.architecture-stage-nav-link[aria-current="location"]');
          assert("Architecture stage pills mark exactly the jumped-to stage as the current location",
            stagePills.length === CourseCore.orderArchitectureStages(projectData.releases || [], projectData.architectureStages || []).length &&
            noPillActiveInitially && activePills.length === 1 && activePills[0] === targetPill);

          /* 57 — the Dashboard's two "Next" actions are a symmetric pair:
             both Learn → and Build → must be real navigable links, or the
             build half of the loop is a dead end. */
          location.hash = "#/dashboard";
          routeRender();
          var nextPanel = document.getElementById("route-view").querySelector(".project-next-grid");
          var nextPanelLinks = nextPanel ? Array.prototype.slice.call(nextPanel.querySelectorAll("a[href]")) : [];
          var dashRelease = currentProjectRelease();
          var dashNextTask = CourseCore.selectNextBuildTask(dashRelease, buildTasksById, projectCompletedTaskIds());
          var learnLinkOk = nextPanelLinks.some(function(a) { return /^#\/lesson\//.test(a.getAttribute("href")); });
          var buildLinkOk = nextPanelLinks.some(function(a) {
            /* P3: the link goes straight to the task's detail page. */
            return a.getAttribute("href") === "#/task/" + dashNextTask.id && a.textContent === dashNextTask.title;
          });
          assert("dashboard Next panel exposes both the next lesson and the next build task as real links",
            !!dashNextTask && learnLinkOk && buildLinkOk);

          /* 58 — R-CAPSTONE-GUARD. Day 31-36 are the capstone window: they
             teach project planning, security review and defence, and they
             UNLOCK knowledge whose Spendwise execution belongs to the
             post-day-36 roadmap. Knowledge unlock is not project execution, so
             none of these lessons may render a build-task CTA — a learner who
             sees a toggle on day-33 is being told to build now, at the exact
             point the schedule says not to.

             This is the render-side half of the guard; the artifact-side half
             is the day-31..day-36 rule in tools/validate_project.py. It passes
             today (all six entries are `theory`, which renders no toggle) and
             its value is as a regression guard for the wave that converts
             day-33 to `direct v0-6` with a permanently empty buildTaskIds. */
          var capstoneWindowOk = ["day-31", "day-32", "day-33", "day-34", "day-35", "day-36"].every(function(id) {
            location.hash = "#/lesson/" + id;
            routeRender();
            return document.getElementById("route-view")
              .querySelectorAll('[data-action="toggle-build-task"]').length === 0;
          });
          assert("capstone-window lessons day-31..day-36 render no build-task CTA",
            capstoneWindowOk);

          /* 59 — P3 route surface. Every authored task id must resolve to a
             rendered Task Detail, and hostile hashes must degrade to a
             deterministic not-found (never a thrown URIError from
             decodeURIComponent, which would blank the whole SPA). */
          var routeOk = true;
          (projectData.buildTasks || []).forEach(function(t) {
            location.hash = "#/task/" + t.id;
            routeRender();
            var detail = document.getElementById("route-view").querySelector('[data-task-detail="' + t.id + '"]');
            var stepCards = document.getElementById("route-view").querySelectorAll(".task-step").length;
            var expectedSteps = (projectData.buildSteps || []).filter(function(s) { return s.taskId === t.id; }).length;
            if (!detail || stepCards !== expectedSteps) {
              routeOk = false;
              return;
            }
            var promptPre = detail.querySelector(".task-prompt-output");
            if (!promptPre || !promptPre.textContent.trim().length || /undefined|\[object Object\]/.test(promptPre.textContent)) {
              routeOk = false;
            }
          });
          assert("P3: every task id renders Task Detail with its step cards and a non-empty mentor prompt",
            routeOk);

          /* 60 — P3 invalid routes. Malformed escapes and unknown ids must
             land on the not-found panel, not crash. */
          var notFoundOk = ["#/task/%", "#/task/not-a-real-task", "#/task/%E0%A4%A"].every(function(hash) {
            location.hash = hash;
            routeRender();
            return !!document.getElementById("route-view").querySelector(".project-not-found");
          });
          assert("P3: invalid task hashes render the not-found panel instead of crashing",
            notFoundOk);

          /* 61 — P3 mentor prompt carries the ten §14 fields with the two
             contract clauses verbatim, and never suggests a Boot version. */
          location.hash = "#/task/task-money-vo";
          routeRender();
          var promptText = document.getElementById("route-view").querySelector(".task-prompt-output").textContent;
          var promptFieldsOk = [
            "## Bối cảnh dự án", "## Task hiện tại", "## Các bước của task",
            "## Toolchain", "## Repository truth", "## Hop dong day hoc",
            "SPRING_BOOT_EXACT_PIN_PENDING", "ARCHITECTURE_CHANGE_REQUIRED",
            "Prefer the established Spendwise convention over your own preference",
            "Khong refactor code khong lien quan, khong them dependency, khong doi build, khong tao package moi",
          ].every(function(marker) { return promptText.indexOf(marker) !== -1; });
          assert("P3: rendered mentor prompt contains the §14 sections and contract clauses",
            promptFieldsOk && promptText.indexOf(CourseCore.MENTOR_STOP_CLAUSE) !== -1 && !/Spring Boot\s+v?[0-9]+\.[0-9]/.test(promptText));

          /* 62 — P3 browse surface + progress independence. The catalogue on
             Project Mode lists every authored task exactly once, each row
             linking to #/task/<id>; marking a task complete changes the
             project track, not lesson completion. */
          location.hash = "#/project";
          routeRender();
          var browseLinks = Array.prototype.slice.call(
            document.getElementById("route-view").querySelectorAll('.task-browse-list a[href^="#/task/"]'));
          var browseIds = browseLinks.map(function(a) { return a.getAttribute("href").slice("#/task/".length); });
          var authoredIds = (projectData.buildTasks || []).map(function(t) { return t.id; });
          var browseOk = browseIds.length === authoredIds.length &&
            authoredIds.every(function(id) { return browseIds.indexOf(id) !== -1; }) &&
            new Set(browseIds).size === browseIds.length;
          assert("P3: all-task browse lists every authored task exactly once with #/task links",
            browseOk);

          /* 63 — P3 toggle on Task Detail shares the single completion state
             with the workspace and never touches lesson completion. */
          var beforeLessons = state.completed.length;
          var probeTaskId = (projectData.buildTasks || [])[0].id;
          var probeDoneBefore = projectCompletedTaskIds().indexOf(probeTaskId) !== -1;
          location.hash = "#/task/" + probeTaskId;
          routeRender();
          var detailToggle = document.getElementById("route-view").querySelector('.task-complete-toggle[data-task-id="' + probeTaskId + '"]');
          var toggleWorks = false;
          if (detailToggle) {
            detailToggle.click();
            var probeDoneAfter = projectCompletedTaskIds().indexOf(probeTaskId) !== -1;
            toggleWorks = probeDoneAfter !== probeDoneBefore && state.completed.length === beforeLessons;
            detailToggle.click(); // restore
          }
          assert("P3: task-detail completion toggle flips project state only, lesson completion untouched",
            toggleWorks);

          /* 64 — P3 picker visibility. The row's class sets display:flex, and
             author display beats the UA [hidden] rule; without the
             .task-prompt-step-picker[hidden] companion the select stays
             visible and focusable in task scope while its handler no-ops. */
          var pickerRow = document.getElementById("route-view").querySelector(".task-prompt-step-picker");
          var pickerOk = false;
          if (pickerRow) {
            var pickerHiddenInitially = getComputedStyle(pickerRow).display === "none" && pickerRow.hidden;
            var stepScopeBtn = document.getElementById("route-view").querySelector('[data-prompt-scope="step"]');
            var taskScopeBtn = document.getElementById("route-view").querySelector('[data-prompt-scope="task"]');
            stepScopeBtn.click();
            var pickerShownInStepScope = getComputedStyle(pickerRow).display !== "none" && !pickerRow.hidden;
            taskScopeBtn.click();
            var pickerHiddenBackInTaskScope = getComputedStyle(pickerRow).display === "none" && pickerRow.hidden;
            pickerOk = pickerHiddenInitially && pickerShownInStepScope && pickerHiddenBackInTaskScope;
          }
          assert("P3: mentor-prompt step picker is hidden in task scope and visible only in step scope (computed style, not just the hidden attribute)",
            pickerOk);

          /* 65 — P4: the Constitution renders exactly R1–R26, once each,
             grouped under the seven Blueprint §3 groups, and every rule
             carries its canonical text. */
          location.hash = "#/architecture";
          routeRender();
          var p4View = document.getElementById("route-view");
          var ruleCards = p4View.querySelectorAll(".constitution-rule");
          var ruleIds = Array.prototype.map.call(ruleCards, function(card) { return card.getAttribute("data-rule-id"); });
          var expectedIds = CourseCore.constitutionRuleIds();
          var noDup = new Set(ruleIds).size === ruleIds.length;
          var groups = p4View.querySelectorAll(".constitution-group h3");
          assert("P4: Architecture view renders exactly R1-R26 (26 rule cards, no dup ids, matching CourseCore data, 7 groups)",
            ruleIds.length === 26 && noDup &&
            JSON.stringify(ruleIds) === JSON.stringify(expectedIds) &&
            groups.length === (CourseCore.CONSTITUTION_GROUPS || []).length);

          /* 66 — P4: every ^R\d{1,2}$ token used by buildSteps resolves to a
             defined rule and to a rendered rule card (0 dangling). Node
             tests assert the full token↔rule matrix; here we assert
             resolution against the rendered cards. */
          var dangling = (CourseCore.resolveRuleTokens(projectData.buildSteps || []) || []).filter(function(t) { return /:DANGLING$/.test(t); });
          assert("P4: every buildSteps architectureRules token resolves to a defined Constitution rule (0 dangling)",
            dangling.length === 0 && ruleCards.length === 26);

          /* 67 — P4: defense matrix renders 15 rows, each anchored to a rule
             that exists; anchors are real links to the rule cards. */
          var defenseRows = p4View.querySelectorAll(".defense-table tbody tr");
          var defenseAnchors = Array.prototype.slice.call(p4View.querySelectorAll(".defense-table a.defense-anchored"));
          var defenseAnchorsOk = defenseAnchors.length === 15 && defenseAnchors.every(function(a) {
            return /^#R\d{1,2}$/.test(a.getAttribute("href")) && document.getElementById(a.getAttribute("href").slice(1));
          });
          assert("P4: defense matrix renders 15 rows, every answer anchor links to an existing rule card",
            defenseRows.length === 15 && defenseAnchorsOk);

          /* 68 — P4: boundaries panel shows the artifact's own outOfScope
             list, the course↔project boundary section, and the evolution
             narrative covers exactly the ten releases. */
          var outItems = p4View.querySelectorAll("#boundaries .boundary-grid div:nth-child(2) li");
          var whyItems = p4View.querySelectorAll("#evolution-why .evolution-item");
          var boundaryOk = outItems.length === (projectData.product.outOfScope || []).length &&
            whyItems.length === (projectData.releases || []).length &&
            !!document.getElementById("course-project-boundary");
          assert("P4: boundaries (21 out-of-scope items), course-project boundary section and 10-release evolution narrative all render",
            boundaryOk);

          /* 69 — P4: rule cards are in-page anchor targets: jumping to a rule
             id does not re-render the view (the hashchange skip), and the
             target element exists. */
          var anchorTarget = document.getElementById("R22");
          var anchorOk = !!anchorTarget && anchorTarget.classList.contains("constitution-rule") &&
            anchorTarget.textContent.indexOf("each row is") !== -1;
          assert("P4: R22 is a stable in-page anchor target for task rule chips (#R22 exists and is the import-identity rule)",
            anchorOk);

          /* 70 — P4 regression: the collapsed-unit `.lesson-list` stays
             display:none when hidden (author display:grid beats the UA
             [hidden] rule without the P4 companion rule). */
          var firstUnitToggle = document.querySelector('.module-toggle[data-unit-id]');
          var lessonListOk = false;
          if (firstUnitToggle) {
            location.hash = "#/dashboard";
            routeRender();
            firstUnitToggle = document.querySelector('.module-toggle[data-unit-id]');
            var unitId = firstUnitToggle.getAttribute("data-unit-id");
            var listEl = document.getElementById("lessons-" + unitId);
            var listVisibleBefore = listEl && getComputedStyle(listEl).display !== "none";
            firstUnitToggle.click();
            var listHiddenAfter = listEl && listEl.hidden && getComputedStyle(listEl).display === "none";
            firstUnitToggle.click();
            var listVisibleAgain = listEl && !listEl.hidden && getComputedStyle(listEl).display !== "none";
            lessonListOk = listVisibleBefore && listHiddenAfter && listVisibleAgain;
          }
          assert("P4: collapsed unit lesson list is truly display:none ([hidden] beats the author display:grid via the companion rule)",
            lessonListOk);
        } catch (e) {
          results.push({ name: "self-test crashed: " + e.message, ok: false });
        } finally {
          /* Restore learner storage and app state */
          try {
            localStorage.getItem = realGetItem;
            localStorage.setItem = realSetItem;
            localStorage.removeItem = realRemoveItem;
            if (storageBackup != null) realSetItem(STORAGE_KEY, storageBackup);
          } catch (e) {}
          state = loadState() || CourseCore.defaultState();
          applyTheme(state.theme);
          renderSidebar();
          updateProgress();
        }

        var passed = results.filter(function(r) { return r.ok; }).length;
        var status = passed === results.length && results.length >= 15 ? "pass" : "fail";
        var pre = el("pre", null, "PASS " + passed + "/" + results.length);
        pre.id = "self-test-results";
        pre.setAttribute("data-status", status);
        pre.style.cssText = "position:fixed;bottom:.5rem;left:.5rem;z-index:9999;background:#000;color:#0f0;padding:.5rem .75rem;font-size:.75rem;margin:0;border-radius:.25rem;";
        document.body.appendChild(pre);
        if (status === "fail") {
          results.forEach(function(r, i) {
            if (!r.ok) console.error("SELFTEST #" + (i + 1) + " FAILED: " + r.name);
          });
        }
      }

      if (new URLSearchParams(location.search).get("selftest") === "1") {
        setTimeout(runSelfTest, 300);
      }
    })();
  </script>
</body>
</html>
