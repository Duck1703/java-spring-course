<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Spring Course — Lesson Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; display: flex; height: 100vh; }

/* Sidebar */
.sidebar { width: 280px; background: #1a1a2e; color: #eee; overflow-y: auto; flex-shrink: 0; }
.sidebar h2 { padding: 20px 16px 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8888aa; border-bottom: 1px solid #2a2a4a; }
.sidebar .day-item { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all .15s; }
.sidebar .day-item:hover { background: #2a2a4a; }
.sidebar .day-item.active { background: #16213e; border-left-color: #0f3460; }
.sidebar .day-item .day-id { font-size: 12px; color: #0f3460; font-weight: 700; }
.sidebar .day-item .day-title { font-size: 13px; margin-top: 2px; }
.sidebar .day-item .day-kind { font-size: 11px; color: #888; margin-top: 1px; }
.sidebar .day-kind .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
.badge-theory { background: #0f3460; color: #a8d8ea; }
.badge-lab { background: #1a5c2a; color: #a8e6a8; }
.badge-project { background: #6b3a00; color: #f0c87a; }

/* Main content */
.main { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 900px; }
.main.empty { display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; }
.lesson-header { margin-bottom: 28px; border-bottom: 2px solid #ddd; padding-bottom: 16px; }
.lesson-header h1 { font-size: 24px; margin-bottom: 6px; }
.lesson-header .meta { font-size: 13px; color: #666; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.lesson-header .meta span { display: inline-flex; align-items: center; gap: 4px; }
.lesson-header .summary { margin-top: 12px; font-size: 14px; color: #555; line-height: 1.6; background: #fafafa; padding: 12px 16px; border-radius: 6px; border-left: 3px solid #0f3460; }

/* Section */
.section { margin-bottom: 28px; }
.section-title { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #e0e0e0; }

/* Blocks */
.block { margin-bottom: 16px; padding: 12px 16px; border-radius: 6px; font-size: 14px; line-height: 1.7; }
.block-paragraph { background: white; border: 1px solid #e8e8e8; }
.block-note { background: #e8f4fd; border-left: 4px solid #2196f3; }
.block-important { background: #fff8e1; border-left: 4px solid #ff9800; }
.block-warning { background: #fde8e8; border-left: 4px solid #f44336; }
.block-deliverable { background: #e8f5e9; border-left: 4px solid #4caf50; }
.block-template { background: #f3e5f5; border-left: 4px solid #9c27b0; }
.block-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; color: #666; }

/* Code */
.code-block { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 6px; overflow-x: auto; font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; line-height: 1.5; margin-bottom: 16px; white-space: pre; }
.code-block .lang-label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 6px; display: block; }

/* Table */
.lesson-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
.lesson-table th { background: #1a1a2e; color: white; padding: 8px 12px; text-align: left; }
.lesson-table td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; }
.lesson-table tr:nth-child(even) td { background: #fafafa; }

/* Lists */
.outcomes-list, .mistakes-list, .exercises-list { margin: 8px 0 16px 20px; }
.outcomes-list li, .mistakes-list li, .exercises-list li { margin-bottom: 6px; font-size: 14px; line-height: 1.6; }

/* Practices */
.practice { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.practice-header { font-size: 14px; font-weight: 700; color: #0f3460; margin-bottom: 8px; }
.practice-type { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 6px; }
.practice-prompt { font-size: 14px; margin-bottom: 10px; line-height: 1.6; }
.practice-choices { list-style: none; margin-bottom: 10px; }
.practice-choices li { padding: 6px 12px; margin-bottom: 4px; background: #f8f8f8; border-radius: 4px; font-size: 13px; }
.practice-choices li.correct { background: #e8f5e9; border-left: 3px solid #4caf50; }
.practice-explanation { font-size: 13px; color: #555; background: #fafafa; padding: 10px 12px; border-radius: 4px; margin-top: 8px; }

/* Assignments */
.assignment-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.assignment-box h3 { font-size: 14px; margin-bottom: 8px; }
.assignment-box pre { font-size: 13px; white-space: pre-wrap; line-height: 1.6; }

/* Tags */
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.tag-objective { background: #e3f2fd; color: #1565c0; }
.tag-outcome { background: #e8f5e9; color: #2e7d32; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h2>📚 Java Spring Course</h2>
  <div id="day-list"></div>
</div>

<div class="main empty" id="main">
  Chon mot bai hoc ben trai de xem noi dung
</div>

<script>
const LESSONS = [];

async function loadLessons() {
  const manifest = [
    'day-01','day-02','day-03','day-04','day-05','day-06',
    'day-07','day-08','day-09','day-10','day-11','day-12',
    'day-13','day-14','day-15','day-16','day-17','day-18'
  ];
  for (const id of manifest) {
    try {
      const res = await fetch(`content/lessons/${id}.json`);
      if (res.ok) LESSONS.push(await res.json());
    } catch(e) { console.warn(`Failed to load ${id}`, e); }
  }
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('day-list');
  list.innerHTML = LESSONS.map((l, i) => `
    <div class="day-item" data-idx="${i}" onclick="selectLesson(${i})">
      <div class="day-id">${l.id.toUpperCase()}</div>
      <div class="day-title">${l.title}</div>
      <div class="day-kind">
        <span class="badge badge-${l.kind}">${l.kind}</span>
        ${l.durationMinutes} min
      </div>
    </div>
  `).join('');
}

function selectLesson(idx) {
  document.querySelectorAll('.day-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.day-item[data-idx="${idx}"]`).classList.add('active');
  const main = document.getElementById('main');
  main.classList.remove('empty');
  main.innerHTML = renderLesson(LESSONS[idx]);
}

function esc(s) { return s ? String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function renderLesson(l) {
  let html = '';
  // Header
  html += `<div class="lesson-header">
    <h1>${esc(l.title)}</h1>
    <div class="meta">
      <span>🕐 ${l.durationMinutes} phut</span>
      <span>📝 ${l.kind}</span>
      <span>📖 ${l.sections.length} muc</span>
      <span>🎯 ${l.practices.length} bai tap</span>
    </div>
    <div class="summary">${esc(l.summary)}</div>
  </div>`;

  // Objectives
  if (l.objectives?.length) {
    html += `<h3 style="margin-bottom:8px;font-size:14px;">Muc tieu hoc tap</h3>
      <div class="tag-list">${l.objectives.map(o => `<span class="tag tag-objective">${esc(o)}</span>`).join('')}</div>`;
  }

  // Prerequisites
  if (l.prerequisites?.length) {
    html += `<h3 style="margin:16px 0 8px;font-size:14px;">Dien tien</h3>
      <ul class="outcomes-list">${l.prerequisites.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
  }

  // Outcomes
  if (l.outcomes?.length) {
    html += `<h3 style="margin:16px 0 8px;font-size:14px;">Ket qua mong doi</h3>
      <ul class="outcomes-list">${l.outcomes.map(o => `<li>${esc(o)}</li>`).join('')}</ul>`;
  }

  // Syllabus Assignments
  if (l.syllabusAssignments?.length && l.syllabusAssignments.some(a => a.text)) {
    html += `<div class="assignment-box"><h3>📋 De bai khoa hoc</h3><pre>${
      l.syllabusAssignments.map(a => esc(a.text)).join('\n')
    }</pre></div>`;
  }

  // Sections
  for (const sec of l.sections) {
    html += `<div class="section"><div class="section-title">${esc(sec.title)}</div>`;
    for (const blk of sec.blocks) {
      html += renderBlock(blk);
    }
    html += '</div>';
  }

  // Common Mistakes
  if (l.commonMistakes?.length) {
    html += `<h3 style="margin:20px 0 8px;font-size:16px;">⚠️ Sai lam thuong gap</h3>
      <ul class="mistakes-list">${l.commonMistakes.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
  }

  // Practices
  if (l.practices?.length) {
    html += `<h3 style="margin:20px 0 12px;font-size:16px;">🎯 Bai tap thuc hanh</h3>`;
    for (const p of l.practices) {
      html += renderPractice(p);
    }
  }

  // Enhanced Exercises
  if (l.enhancedExercises?.length) {
    html += `<h3 style="margin:20px 0 8px;font-size:16px;">🚀 Bai tap nang cao</h3>
      <ul class="exercises-list">${l.enhancedExercises.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
  }

  return html;
}

function renderBlock(b) {
  switch(b.type) {
    case 'paragraph':
      return `<div class="block block-paragraph"><div class="block-title">📄 Noi dung</div>${formatText(b.text)}</div>`;
    case 'note':
      return `<div class="block block-note"><div class="block-title">📌 Ghi chu</div>${formatText(b.text)}</div>`;
    case 'important':
      return `<div class="block block-important"><div class="block-title">⚡ Quan trong</div>${formatText(b.text)}</div>`;
    case 'warning':
      return `<div class="block block-warning"><div class="block-title">⚠️ Canh bao</div>${formatText(b.text)}</div>`;
    case 'deliverable':
      return `<div class="block block-deliverable"><div class="block-title">📋 De bai</div><pre style="white-space:pre-wrap;font-size:13px;line-height:1.6;">${esc(b.text)}</pre></div>`;
    case 'code':
      return `<div class="code-block"><span class="lang-label">${esc(b.language || 'code')}</span>${esc(b.code)}</div>`;
    case 'table':
      return renderTable(b);
    default:
      return `<div class="block block-paragraph">${esc(b.text || JSON.stringify(b))}</div>`;
  }
}

function renderTable(b) {
  if (!b.rows?.length) return '';
  let h = '<table class="lesson-table"><thead><tr>';
  for (const col of (b.columns || [])) h += `<th>${esc(col)}</th>`;
  h += '</tr></thead><tbody>';
  for (const row of b.rows) {
    h += '<tr>';
    for (const cell of row) h += `<td>${esc(cell)}</td>`;
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

function renderPractice(p) {
  let h = `<div class="practice">
    <div class="practice-type">${esc(p.type)} / ${esc(p.interaction)}</div>
    <div class="practice-prompt">${formatText(p.prompt)}</div>`;
  if (p.choices?.length) {
    h += '<ul class="practice-choices">';
    const correctSet = new Set(p.correctChoiceIds || []);
    for (const c of p.choices) {
      h += `<li class="${correctSet.has(c.id) ? 'correct' : ''}"><strong>${esc(c.id)}</strong>: ${esc(c.text)}</li>`;
    }
    h += '</ul>';
  }
  if (p.hint) h += `<div style="font-size:13px;color:#666;margin-top:6px;">💡 <em>${esc(p.hint)}</em></div>`;
  if (p.solution) {
    h += `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:13px;color:#0f3460;">Xem loi giai</summary>
      <pre class="code-block" style="margin-top:8px;">${esc(p.solution)}</pre></details>`;
  }
  if (p.explanation) h += `<div class="practice-explanation"><strong>Giai thich:</strong> ${formatText(p.explanation)}</div>`;
  h += '</div>';
  return h;
}

function formatText(s) {
  if (!s) return '';
  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code style="background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:13px;">$1</code>');
  return s;
}

loadLessons();
</script>
</body>
</html>
